<head>
<meta charset="UTF-8">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;
  background:#061426;
  color:#dcecff;
  font-family:"Noto Serif SC",serif;
  overflow-x:hidden;
  transition:
    background .6s ease,
    color .6s ease;
}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(38,91,137,.18),
      transparent 38%
    ),
    radial-gradient(
      circle at 50% 50%,
      rgba(11,45,75,.45),
      transparent 70%
    ),
    #061426;

  transition:background .6s ease;
}


/* =========================
   背景星点
========================= */

.star-field{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.star-dot{
  position:absolute;
  display:block;
  width:2px;
  height:2px;
  border-radius:50%;
  background:rgba(180,220,245,.58);
  opacity:.35;
  animation:starTwinkle 4s ease-in-out infinite;
}

.star-dot.small{
  width:1px;
  height:1px;
  opacity:.28;
}

.star-dot.large{
  width:3px;
  height:3px;
  opacity:.42;
}

@keyframes starTwinkle{
  0%,100%{
    opacity:.20;
    transform:scale(.8);
  }

  50%{
    opacity:.62;
    transform:scale(1.15);
  }
}


/* =========================
   浮动魔法符号
========================= */

.arcane-star{
  position:absolute;
  z-index:2;
  color:rgba(127,185,220,.30);
  font-family:"Cinzel","Times New Roman",serif;
  font-weight:400;
  line-height:1;
  pointer-events:none;
  user-select:none;
  text-shadow:none;
  animation:arcaneFloat 7s ease-in-out infinite;
}

.arcane-star.s1{
  top:17%;
  left:8%;
  font-size:17px;
  animation-delay:-1s;
}

.arcane-star.s2{
  top:29%;
  right:8%;
  font-size:12px;
  animation-delay:-4s;
}

.arcane-star.s3{
  top:62%;
  left:5%;
  font-size:13px;
  animation-delay:-2s;
}

.arcane-star.s4{
  top:75%;
  right:7%;
  font-size:18px;
  animation-delay:-5s;
}

.arcane-star.s5{
  top:45%;
  left:11%;
  font-size:9px;
  animation-delay:-3s;
}

.arcane-star.s6{
  top:52%;
  right:11%;
  font-size:10px;
  animation-delay:-6s;
}

.arcane-star.s7{
  top:13%;
  right:24%;
  font-size:8px;
  animation-delay:-2.5s;
}

.arcane-star.s8{
  top:82%;
  left:23%;
  font-size:11px;
  animation-delay:-4.5s;
}

@keyframes arcaneFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
    opacity:.22;
  }

  50%{
    transform:translateY(-6px) rotate(8deg);
    opacity:.48;
  }
}


/* =========================
   魔法阵
========================= */

.magic-circle{
  position:absolute;
  z-index:2;
  top:50%;
  left:50%;
  width:72vw;
  height:72vw;
  max-width:850px;
  max-height:850px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(98,160,204,.11);
  border-radius:50%;
  pointer-events:none;
}

.magic-circle::before,
.magic-circle::after{
  content:"";
  position:absolute;
  inset:7%;
  border:1px solid rgba(102,168,214,.08);
  border-radius:50%;
}

.magic-circle::after{
  inset:17%;
  border-style:dashed;
  border-color:rgba(106,170,215,.07);
}

.magic-ring-2{
  position:absolute;
  inset:27%;
  border:1px solid rgba(104,168,214,.07);
  border-radius:50%;
}

.magic-ring-3{
  position:absolute;
  inset:37%;
  border:1px solid rgba(104,168,214,.06);
  border-radius:50%;
}

.magic-line{
  position:absolute;
  inset:20%;
  border:1px solid rgba(105,170,215,.045);
  transform:rotate(30deg);
}

.magic-line::before{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(105,170,215,.04);
  transform:rotate(60deg);
}


/* =========================
   四角六芒星
========================= */

.corner-star{
  position:absolute;
  z-index:3;
  width:34px;
  height:34px;
  opacity:.24;
  pointer-events:none;
}

.corner-star::before,
.corner-star::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:1px;
  background:rgba(128,190,224,.55);
  transform:translate(-50%,-50%) rotate(0deg);
}

.corner-star::after{
  transform:translate(-50%,-50%) rotate(60deg);
}

.corner-star span{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:1px;
  background:rgba(128,190,224,.55);
  transform:translate(-50%,-50%) rotate(120deg);
}

.corner-star.tl{
  top:38px;
  left:38px;
}

.corner-star.tr{
  top:38px;
  right:38px;
}

.corner-star.bl{
  bottom:38px;
  left:38px;
}

.corner-star.br{
  bottom:38px;
  right:38px;
}


/* =========================
   左上角 LOGO
========================= */

.logo-symbol{
  color:rgba(127,185,220,.72);
  font-size:20px;
  line-height:1;
  text-shadow:none;
  transition:color .5s ease;
}


/* =========================
   Header
========================= */

.header{
  position:absolute;
  z-index:10;
  top:38px;
  left:58px;
  right:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;

  color:#dcecff;
  text-decoration:none;

  font-family:"Cinzel",serif;
  font-size:13px;
  letter-spacing:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:20px;
}

.back-home{
  color:rgba(190,220,240,.62);
  text-decoration:none;
  font-size:12px;
  letter-spacing:1.5px;
  transition:
    color .3s ease,
    opacity .3s ease;
}

.back-home:hover{
  color:#cfeeff;
}


/* =========================
   日夜切换
========================= */

.theme-toggle{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;

  border:1px solid rgba(111,174,224,.20);
  background:rgba(8,27,44,.22);

  color:rgba(190,220,240,.68);

  font-family:"Cinzel",serif;
  font-size:10px;
  letter-spacing:1.4px;

  cursor:pointer;

  transition:
    border-color .35s ease,
    background .35s ease,
    color .35s ease,
    box-shadow .35s ease;
}

.theme-icon{
  font-size:13px;
  line-height:1;
}

.theme-toggle:hover{
  border-color:rgba(122,192,235,.40);
  color:#dcecff;
  background:rgba(16,45,67,.30);
  box-shadow:0 0 14px rgba(76,151,202,.12);
}


/* =========================
   主内容
========================= */

.content{
  position:relative;
  z-index:5;

  width:min(1080px,100%);
  margin:0 auto;
  padding-top:150px;
}


/* =========================
   标题
========================= */

.heading{
  text-align:center;
  margin-bottom:64px;
}

.heading-en-small{
  margin-bottom:13px;

  color:rgba(158,200,226,.55);

  font-family:"Cinzel",serif;
  font-size:11px;
  letter-spacing:5px;
}

.heading-main{
  color:#dcecff;

  font-family:"Cinzel",serif;
  font-size:48px;
  font-weight:400;
  letter-spacing:10px;
  line-height:1.15;
}

.heading-cn{
  margin-top:14px;

  color:rgba(178,212,233,.55);

  font-size:13px;
  letter-spacing:7px;
}


/* =========================
   档案卡片
========================= */

.archive-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.archive-card{
  position:relative;
  min-height:190px;
  padding:30px 26px;

  border:1px solid rgba(111,174,224,.20);

  background:
    linear-gradient(
      145deg,
      rgba(18,48,72,.24),
      rgba(6,19,32,.28)
    );

  overflow:hidden;
  text-decoration:none;
  color:inherit;

  transition:
    border-color .35s ease,
    background .35s ease,
    transform .35s ease,
    box-shadow .35s ease;
}

.archive-card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(106,177,221,.07),
      transparent 55%
    );

  opacity:.8;
  pointer-events:none;
}

.archive-card:hover{
  transform:translateY(-4px);

  border-color:rgba(122,192,235,.40);

  background:
    linear-gradient(
      145deg,
      rgba(22,59,86,.32),
      rgba(7,22,37,.36)
    );

  box-shadow:
    0 10px 35px rgba(0,0,0,.2),
    0 0 25px rgba(70,160,215,.06);
}

.card-symbol{
  position:relative;
  z-index:2;

  display:block;
  margin-bottom:23px;

  color:rgba(121,180,215,.48);

  font-family:"Cinzel",serif;
  font-size:24px;
  line-height:1;

  text-shadow:none;

  transition:
    color .35s ease,
    transform .35s ease;
}

.archive-card:hover .card-symbol{
  color:rgba(151,205,235,.72);
  transform:translateY(-2px);
}

.card-en{
  position:relative;
  z-index:2;

  color:rgba(204,229,244,.82);

  font-family:"Cinzel",serif;
  font-size:18px;
  letter-spacing:3px;
}

.card-cn{
  position:relative;
  z-index:2;

  margin-top:9px;

  color:rgba(162,199,220,.56);

  font-size:12px;
  letter-spacing:3px;
}

.card-line{
  position:absolute;
  left:26px;
  right:26px;
  bottom:25px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(113,177,216,.20),
      transparent
    );
}


/* =========================
   Footer
========================= */

.footer{
  position:relative;
  z-index:5;

  padding:60px 20px 35px;

  text-align:center;

  color:rgba(143,181,205,.32);

  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:3px;
}


/* =========================
   日间模式
========================= */

body.day-mode{
  background:#f4f9fd;
  color:#2e5069;
}

body.day-mode .page{
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(165,211,238,.11),
      transparent 38%
    ),
    radial-gradient(
      circle at 50% 52%,
      rgba(255,255,255,.82),
      transparent 72%
    ),
    #f4f9fd;
}

body.day-mode .star-dot{
  background:rgba(79,151,201,.55);
  opacity:.24;
}

body.day-mode .star-dot.large{
  opacity:.30;
}

body.day-mode .arcane-star{
  color:rgba(76,145,190,.48);
  text-shadow:none;
}

body.day-mode .logo{
  color:#35566e;
}

body.day-mode .logo-symbol{
  color:rgba(79,151,201,.84);
  text-shadow:none;
}

body.day-mode .back-home{
  color:rgba(67,106,129,.64);
}

body.day-mode .back-home:hover{
  color:#3c718f;
}

body.day-mode .theme-toggle{
  border-color:rgba(82,151,198,.24);
  background:rgba(255,255,255,.40);
  color:rgba(63,104,128,.70);
}

body.day-mode .theme-toggle:hover{
  border-color:rgba(79,151,200,.42);
  background:rgba(255,255,255,.62);
  color:#315a72;
  box-shadow:0 0 14px rgba(76,151,202,.11);
}

body.day-mode .heading-en-small{
  color:rgba(74,119,145,.52);
}

body.day-mode .heading-main{
  color:#365c73;
}

body.day-mode .heading-cn{
  color:rgba(78,118,141,.55);
}

body.day-mode .archive-card{
  border-color:rgba(82,151,198,.24);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.58),
      rgba(239,247,251,.40)
    );

  box-shadow:0 5px 20px rgba(70,110,130,.04);
}

body.day-mode .archive-card:hover{
  border-color:rgba(79,151,200,.42);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.72),
      rgba(233,243,249,.52)
    );

  box-shadow:
    0 10px 35px rgba(55,95,115,.10),
    0 0 25px rgba(76,151,202,.06);
}

body.day-mode .card-symbol{
  color:rgba(70,135,165,.38);
  text-shadow:none;
}

body.day-mode .archive-card:hover .card-symbol{
  color:rgba(63,128,160,.62);
}

body.day-mode .card-en{
  color:rgba(58,91,111,.82);
}

body.day-mode .card-cn{
  color:rgba(78,116,137,.58);
}

body.day-mode .footer{
  color:rgba(76,116,137,.34);
}

body.day-mode .magic-circle{
  border-color:rgba(79,151,201,.08);
}

body.day-mode .magic-circle::before,
body.day-mode .magic-circle::after{

}

body.day-mode .magic-ring-2,
body.day-mode .magic-ring-3,
body.day-mode .magic-line{

}

body.day-mode .corner-star::before,
body.day-mode .corner-star::after,
body.day-mode .corner-star span{
  background:rgba(79,151,201,.42);
}


/* =========================
   平板
========================= */

@media(max-width:800px){

  .header{
    left:30px;
    right:30px;
  }

  .content{
    padding-left:25px;
    padding-right:25px;
  }

  .archive-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .heading-main{
    font-size:40px;
  }

  .magic-circle{
    width:90vw;
    height:90vw;
  }

}


/* =========================
   手机
========================= */

@media(max-width:600px){

  .header{
    top:25px;
    left:20px;
    right:20px;
  }

  .logo{
    font-size:10px;
    letter-spacing:2px;
  }

  .header-right{
    gap:9px;
  }

  .back-home{
    font-size:10px;
  }

  .theme-toggle{
    padding:6px 8px;
    font-size:8px;
  }

  .content{
    padding-top:120px;
    padding-left:18px;
    padding-right:18px;
  }

  .heading{
    margin-bottom:45px;
  }

  .heading-en-small{
    font-size:8px;
    letter-spacing:3px;
  }

  .heading-main{
    font-size:29px;
    letter-spacing:6px;
  }

  .heading-cn{
    margin-top:11px;
    font-size:11px;
    letter-spacing:5px;
  }

  .archive-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .archive-card{
    min-height:170px;
    padding:25px 22px;
  }

  .card-symbol{
    font-size:21px;
    margin-bottom:18px;
  }

  .card-en{
    font-size:16px;
  }

  .card-cn{
    font-size:11px;
  }

  .card-line{
    left:22px;
    right:22px;
    bottom:22px;
  }

  .magic-circle{
    width:125vw;
    height:125vw;
  }

  .corner-star{
    transform:scale(.75);
  }

  .corner-star.tl{
    top:22px;
    left:15px;
  }

  .corner-star.tr{
    top:22px;
    right:15px;
  }

  .corner-star.bl{
    bottom:22px;
    left:15px;
  }

  .corner-star.br{
    bottom:22px;
    right:15px;
  }

  .arcane-star.s1{
    left:6%;
    font-size:13px;
  }

  .arcane-star.s2{
    right:5%;
    font-size:10px;
  }

  .arcane-star.s3{
    left:4%;
    font-size:11px;
  }

  .arcane-star.s4{
    right:5%;
    font-size:14px;
  }

  .arcane-star.s5,
  .arcane-star.s6{
    display:none;
  }

}


/* =========================
   超小屏幕
========================= */

@media(max-width:360px){

  .header{
    left:14px;
    right:14px;
  }

  .header-right{
    gap:6px;
  }

  .back-home{
    font-size:9px;
  }

  .theme-toggle{
    padding:5px 7px;
  }

  .content{
    padding-top:110px;
  }

  .heading-main{
    font-size:25px;
    letter-spacing:4px;
  }

}


/* =========================
   减少动态
========================= */

@media(prefers-reduced-motion:reduce){

  .arcane-star,
  .star-dot{
    animation:none;
  }

  .archive-card,
  .theme-toggle,
  .back-home,
  .card-symbol{
    transition:none;
  }

}

</style>
</head>

<script>

/* =========================
   日夜模式
========================= */

const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");


function applyTheme(theme){

  if(theme === "day"){

    document.body.classList.add("day-mode");

    themeIcon.textContent = "☀";
    themeText.textContent = "DAY";

  }else{

    document.body.classList.remove("day-mode");

    themeIcon.textContent = "☾";
    themeText.textContent = "NIGHT";

  }

}


const savedTheme = localStorage.getItem("seyami-theme");

applyTheme(
  savedTheme === "day"
    ? "day"
    : "night"
);


themeToggle.addEventListener("click",()=>{

  const isDay =
    document.body.classList.contains("day-mode");

  const nextTheme =
    isDay
      ? "night"
      : "day";

  localStorage.setItem(
    "seyami-theme",
    nextTheme
  );

  applyTheme(nextTheme);

});

</script>
