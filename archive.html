    "Times New Roman",
    serif;

  overflow-x:hidden;

  transition:
    background .6s ease,
    color .6s ease;
}

.page{
  position:relative;

  min-height:100vh;

  padding:

/* =========================================================
   背景星尘
========================================================= */

.stars{
  position:absolute;

  inset:0;

  z-index:0;

  pointer-events:none;

  overflow:hidden;
}

.stars::before,
.stars::after{

  content:"";

  width:2px;
  height:2px;

  border-radius:50%;

  background:
    rgba(182,220,255,.7);

  box-shadow:

    8vw 12vh rgba(182,220,255,.25),
    17vw 28vh rgba(182,220,255,.20),
    26vw 9vh rgba(182,220,255,.28),
    36vw 23vh rgba(182,220,255,.20),
    47vw 13vh rgba(182,220,255,.30),
    58vw 31vh rgba(182,220,255,.22),
    69vw 16vh rgba(182,220,255,.26),
    78vw 28vh rgba(182,220,255,.20),
    89vw 11vh rgba(182,220,255,.28),

    12vw 62vh rgba(182,220,255,.20),
    23vw 76vh rgba(182,220,255,.25),
    34vw 66vh rgba(182,220,255,.18),
    51vw 82vh rgba(182,220,255,.25),
    64vw 68vh rgba(182,220,255,.20),
    77vw 79vh rgba(182,220,255,.23),
    91vw 63vh rgba(182,220,255,.20);

  opacity:.7;

  transition:
    background .6s ease,
    box-shadow .6s ease,
    opacity .6s ease;
}

.stars::after{

  width:1px;
  height:1px;

  box-shadow:

    5vw 19vh rgba(182,220,255,.30),
    15vw 44vh rgba(182,220,255,.25),
    31vw 17vh rgba(182,220,255,.20),

    57vw 21vh rgba(182,220,255,.20),
    72vw 44vh rgba(182,220,255,.25),
    84vw 36vh rgba(182,220,255,.20),
    95vw 23vh rgba(182,220,255,.25),

    7vw 84vh rgba(182,220,255,.20),
    19vw 70vh rgba(182,220,255,.25),
    29vw 90vh rgba(182,220,255,.20),
    42vw 72vh rgba(182,220,255,.25),
    55vw 93vh rgba(182,220,255,.20),
    70vw 84vh rgba(182,220,255,.25),
    86vw 91vh rgba(182,220,255,.20);
}


/* =========================================================
   【新增】微型星点
========================================================= */

.micro-stars{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.micro-star{
  position:absolute;
  display:block;

  width:2px;
  height:2px;

  border-radius:50%;

  background:
    rgba(194,225,248,.42);

  opacity:.35;

  animation:
    microTwinkle
    var(--micro-time)
    ease-in-out
    infinite;

  animation-delay:
    var(--micro-delay);
}

.micro-star.tiny{
  width:1px;
  height:1px;
  opacity:.30;
}

.micro-star.bright{
  width:2px;
  height:2px;
  opacity:.48;
}

@keyframes microTwinkle{

  0%,
  100%{
    opacity:.16;
    transform:scale(.75);
  }

  50%{
    opacity:.58;
    transform:scale(1.25);
  }

}


/* =========================================================
   ✦ ✶ ✡ 魔法星辰
========================================================= */

.arcane-stars{

  position:absolute;

  inset:0;

  z-index:1;

  pointer-events:none;

  overflow:hidden;

  transition:
    opacity .6s ease;
}

.arcane-star{

  position:absolute;

  display:block;

  color:
    rgba(158,207,247,.62);

  font-family:
    "Times New Roman",
    "Noto Serif",
    serif;

  font-weight:400;

  line-height:1;

  user-select:none;

  text-shadow:none;

  animation:

    arcaneFloat
    var(--float-time)
    ease-in-out
    infinite,

    arcaneTwinkle
    var(--twinkle-time)
    ease-in-out
    infinite;

  animation-delay:

    var(--float-delay),
    var(--twinkle-delay);

  transition:
    color .6s ease,
    text-shadow .6s ease;
}

/* 星辰动画 */

@keyframes arcaneFloat{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

  25%{
    transform:
      translate3d(4px,-7px,0)
      rotate(4deg);
  }

  50%{
    transform:
      translate3d(-3px,-11px,0)
      rotate(-3deg);
  }

  75%{
    transform:
      translate3d(-6px,-4px,0)
      rotate(3deg);
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

}

@keyframes arcaneTwinkle{

  0%,
  100%{
    opacity:.25;
  }

  50%{
    opacity:.75;
  }

}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

  position:absolute;

  width:min(72vw,760px);
  height:min(72vw,760px);

  left:50%;
  top:47%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid
    rgba(73,143,198,.28);

  box-shadow:

    0 0 50px
    rgba(47,126,184,.08),

    inset
    0 0 60px
    rgba(62,139,194,.04);

  z-index:0;

  pointer-events:none;

  transition:
    border-color .6s ease,
    box-shadow .6s ease;
}

.magic-circle::before,
.magic-circle::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  pointer-events:none;

  transition:
    border-color .6s ease,
    box-shadow .6s ease;
}

.magic-circle::before{

  width:82%;
  height:82%;

  border:
    1px solid
    rgba(91,162,213,.22);

  box-shadow:
    0 0 25px
    rgba(47,126,184,.08);
}

.magic-circle::after{

  width:61%;
  height:61%;

  border:
    1px solid
    rgba(91,162,213,.22);

  box-shadow:
    0 0 18px
    rgba(62,139,194,.04);
}


/* =========================================================
   四角框线
========================================================= */

.frame{

  position:absolute;

  top:20px;
  left:20px;
  right:20px;
  bottom:20px;

  border:
    1px solid
    rgba(111,174,224,.32);

  pointer-events:none;

  z-index:2;

  transition:
    border-color .6s ease;
}

.frame::before,
.frame::after{

  content:"";

  position:absolute;

  width:45px;
  height:45px;

  transition:
    border-color .6s ease;
}

.frame::before{

  left:-1px;
  top:-1px;

  border-left:
    1px solid
    rgba(108,178,230,.88);

  border-top:
    1px solid
    rgba(108,178,230,.88);
}

.frame::after{

  right:-1px;
  bottom:-1px;

  border-right:
    1px solid
    rgba(108,178,230,.88);

  border-bottom:
    1px solid
    rgba(108,178,230,.88);
}


/* =========================================================
   顶部 Header
========================================================= */

.header{

  position:absolute;

  left:58px;
  right:58px;
  top:38px;

  z-index:20;

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  width:auto;
  max-width:none;

  margin:0;
  padding:0;
}


/* Logo */

.logo{

  display:flex;

  align-items:flex-start;

  gap:12px;

  color:
    #d9edff;

  text-decoration:none;

  transition:
    color .6s ease;
}

.logo-symbol{

  color:
    rgba(137,201,239,.9);

  width:17px;
  height:13px;

  display:flex;

  align-items:flex-start;
  justify-content:center;

  font-size:17px;
  line-height:13px;

  margin:0;
  padding:0;

  text-shadow:
    0 0 7px rgba(76,159,216,.5),
    0 0 15px rgba(49,132,191,.22);

  flex-shrink:0;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}

.logo-text{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  line-height:1;
}

.logo-cn{

  display:block;

  height:13px;
  line-height:13px;

  color:
    #d9edff;

  font-size:13px;

  letter-spacing:3px;

  white-space:nowrap;

  transition:
    color .6s ease;
}

.logo-en{

  display:block;

  margin-top:5px;

  color:
    rgba(157,204,239,.63);

  font-family:
    "Times New Roman",
    serif;

  font-size:8px;
  line-height:8px;

  letter-spacing:3px;

  white-space:nowrap;

  transition:
    color .6s ease;
}


/* =========================================================
   返回
========================================================= */

.header-right{

  display:flex;

  align-items:center;

  gap:20px;
}

.back{

  color:
    rgba(191,220,243,.68);

  text-decoration:none;

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:11px;

  letter-spacing:1px;

  transition:
    color .3s ease,
    text-shadow .3s ease;
}

.back:hover{

  color:#d9efff;

  text-shadow:
    0 0 8px
    rgba(102,180,231,.35);
}


/* =========================================================
   昼夜切换
========================================================= */

.theme-toggle{

  display:flex;

  align-items:center;

  gap:7px;

  height:28px;

  padding:
    0 11px;

  border:
    1px solid
    rgba(111,174,224,.32);

  background:
    rgba(8,28,49,.35);

  color:
    rgba(191,220,243,.68);

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:8px;

  letter-spacing:2px;

  cursor:pointer;

  border-radius:0;

  white-space:nowrap;

  transition:
    color .35s ease,
    border-color .35s ease,
    background .35s ease,
    box-shadow .35s ease;
}

.theme-toggle:hover{

  color:#d9efff;

  border-color:
    rgba(122,192,235,.62);

  background:
    rgba(8,31,52,.55);

  box-shadow:
    0 0 14px
    rgba(76,151,202,.12);
}

.theme-icon{

  font-size:12px;

  line-height:1;

  letter-spacing:0;
}


/* =========================================================
   主内容
========================================================= */

.content{

  z-index:5;

  width:

  margin:

  padding-top:150px;
}

/* =========================================================
   档案卡片
========================================================= */

.archive-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

  width:100%;
}

.archive-card{

  position:relative;

  min-height:190px;

  padding:
    30px 26px;

  border:
    1px solid
    rgba(111,174,224,.32);

  background:

    linear-gradient(
      145deg,
      rgba(38,91,137,.18),
      rgba(11,45,75,.45)
    );

  overflow:hidden;

  text-decoration:none;

  color:inherit;

  transition:
    border-color .35s ease,
    background .35s ease,
    transform .35s ease,
    box-shadow .35s ease;
}

.archive-card::before{

  content:"";

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:1px;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(115,182,224,.62),
      transparent
    );

  opacity:.5;

  transition:
    background .6s ease;
}

.archive-card::after{

  content:"";

  position:absolute;

  width:100px;
  height:100px;

  right:-45px;
  bottom:-45px;

  border-radius:50%;

  border:
    1px solid
    rgba(91,162,213,.22);

  transition:
    border-color .6s ease;
}

.archive-card:hover{

  transform:
    translateY(-4px);

  border-color:
    rgba(122,192,235,.62);

  background:

    linear-gradient(
      145deg,
      rgba(38,91,137,.26),
      rgba(11,45,75,.55)
    );

  box-shadow:

    0 10px 35px
    rgba(0,0,0,.2),

    0 0 25px
    rgba(56,143,201,.18);
}

.card-title{

  font-family:
    "Cinzel",
    serif;

  font-size:22px;

  font-weight:400;

  letter-spacing:4px;

  color:
    rgba(220,238,255,.92);

  margin-bottom:9px;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}

.card-cn{

  font-size:12px;

  letter-spacing:3px;

  color:
    rgba(177,207,230,.62);

  transition:
    color .6s ease;
}

.card-symbol{

  position:absolute;

  right:24px;
  top:25px;

  color:
    rgba(137,201,239,.32);

  font-family:
    "Times New Roman",
    serif;

  font-size:19px;

  text-shadow:none;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}


/* =========================================================
   Footer
========================================================= */

.footer{

  position:relative;

  z-index:5;

  text-align:center;

  margin-top:60px;

  font-family:

<script>

/* =========================================================
   昼夜模式
   与首页共用：seyami-theme
========================================================= */

const themeToggle =
  document.getElementById(
    "themeToggle"
  );

const themeIcon =
  document.getElementById(
    "themeIcon"
  );

const themeText =
  document.getElementById(
    "themeText"
  );


function applyTheme(theme){

  if(theme === "day"){

    document.body.classList.add(
      "day-mode"
    );

    themeIcon.textContent = "☀";

    themeText.textContent = "DAY";

  }else{

    document.body.classList.remove(
      "day-mode"
    );

    themeIcon.textContent = "☾";

    themeText.textContent = "NIGHT";

  }

}


/* 读取首页 / 其他页面保存的模式 */

const savedTheme =
  localStorage.getItem(
    "seyami-theme"
  );


/* 默认夜间 */

applyTheme(
  savedTheme === "day"
    ? "day"
    : "night"
);


/* 点击切换 */

themeToggle.addEventListener(
  "click",
  () => {

    const isDay =
      document.body.classList.contains(
        "day-mode"
      );

    const nextTheme =
      isDay
        ? "night"
        : "day";

    localStorage.setItem(
      "seyami-theme",
      nextTheme
    );

    applyTheme(
      nextTheme
    );

  }
);

</script>
