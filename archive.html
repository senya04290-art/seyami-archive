========================================================= */

/* =========================================================

========================================================= */

.arcane-stars{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.arcane-star{
  position:absolute;
  display:block;

  color:rgba(145,215,250,.42);

  font-family:
    "Times New Roman",
    "Noto Serif",
    serif;

  font-weight:400;
  line-height:1;

  user-select:none;

  text-shadow:
    0 0 5px rgba(90,190,240,.25),
    0 0 14px rgba(60,160,220,.12);

  animation:
    arcaneFloat var(--float-time) ease-in-out infinite,
    arcaneTwinkle var(--twinkle-time) ease-in-out infinite;

  animation-delay:
    var(--float-delay),
    var(--twinkle-delay);
}

/* 星辰动画 */

@keyframes arcaneFloat{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

  25%{
    transform:
      translate3d(4px,-7px,0)
      rotate(4deg);
  }

  50%{
    transform:
      translate3d(-3px,-11px,0)
      rotate(-3deg);
  }

  75%{
    transform:
      translate3d(-6px,-4px,0)
      rotate(3deg);
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

}

@keyframes arcaneTwinkle{

  0%,
  100%{
    opacity:.25;
  }

  50%{
    opacity:.75;
  }

}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{
  position:absolute;

  width:min(72vw,760px);
  height:min(72vw,760px);

  left:50%;
  top:47%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid rgba(104,190,235,.07);

  box-shadow:
    0 0 50px rgba(70,150,210,.035),
    inset 0 0 60px rgba(70,150,210,.025);

  z-index:0;
  pointer-events:none;
}

.magic-circle::before,
.magic-circle::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  pointer-events:none;
}

.magic-circle::before{
  width:82%;
  height:82%;

  border:
    1px solid rgba(120,205,245,.055);

  box-shadow:
    0 0 25px rgba(80,170,220,.025);
}

.magic-circle::after{
  width:61%;
  height:61%;

  border:
    1px solid rgba(130,215,250,.06);

  box-shadow:
    0 0 18px rgba(90,180,230,.025);
}


/* =========================================================
   四角框线
========================================================= */

.frame{
  position:absolute;

  top:20px;
  left:20px;
  right:20px;
  bottom:20px;

  border:
    1px solid rgba(130,200,235,.12);

  pointer-events:none;

  z-index:2;
}

.frame::before,
.frame::after{
  content:"";

  position:absolute;

  width:45px;
  height:45px;
}

.frame::before{
  left:-1px;
  top:-1px;

  border-left:
    1px solid rgba(160,220,250,.45);

  border-top:
    1px solid rgba(160,220,250,.45);
}

.frame::after{
  right:-1px;
  bottom:-1px;

  border-right:
    1px solid rgba(160,220,250,.45);

  border-bottom:
    1px solid rgba(160,220,250,.45);
}


/* =========================================================
   顶部 Header
========================================================= */

.header{
  position:absolute;

  left:58px;
  right:58px;
  top:38px;

  z-index:20;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  width:auto;
  max-width:none;

  margin:0;
  padding:0;
}


/* Logo */

.logo{
  display:flex;
  align-items:flex-start;
  gap:12px;

  color:rgba(225,246,255,.92);

  text-decoration:none;
}

.logo-symbol{
  color:#9edcff;

  width:17px;
  height:13px;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  font-size:17px;
  line-height:13px;

  margin:0;
  padding:0;

  text-shadow:
    0 0 12px rgba(90,200,255,.7);

  flex-shrink:0;
}

.logo-text{
  display:flex;
  flex-direction:column;
  align-items:flex-start;

  line-height:1;
}

.logo-cn{
  display:block;

  height:13px;
  line-height:13px;

  color:rgba(225,246,255,.92);

  font-size:13px;
  letter-spacing:3px;

  white-space:nowrap;
}

.logo-en{
  display:block;

  margin-top:5px;

  color:rgba(200,230,245,.45);

  font-family:
    "Times New Roman",
    serif;

  font-size:8px;
  line-height:8px;

  letter-spacing:3px;

  white-space:nowrap;
}


/* 返回 */

.back{
  color:rgba(190,225,245,.58);

  text-decoration:none;

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:11px;
  letter-spacing:1px;

  transition:
    color .3s ease,
    text-shadow .3s ease;
}

.back:hover{
  color:rgba(220,245,255,.95);

  text-shadow:
    0 0 10px rgba(100,200,245,.35);
}


/* =========================================================
   主内容
========================================================= */

.content{
  position:relative;

  z-index:5;

  width:min(1080px,100%);

  margin:0 auto;

  padding-top:150px;
}


/* 标题 */

.heading{
  text-align:center;

  margin-bottom:55px;
}

.heading-small{
  font-family:
    "Cinzel",
    serif;

  font-size:11px;

  letter-spacing:6px;

  color:rgba(145,205,235,.55);

  margin-bottom:12px;
}

.heading-main{
  font-family:
    "Cinzel",
    serif;

  font-size:clamp(34px,5vw,58px);

  font-weight:400;

  letter-spacing:8px;

  color:rgba(225,245,255,.9);

  line-height:1;
}

.heading-cn{
  margin-top:15px;

  font-size:13px;

  letter-spacing:5px;

  color:rgba(170,210,230,.48);
}


/* =========================================================
   档案卡片
========================================================= */

.archive-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

  width:100%;
}

.archive-card{
  position:relative;

  min-height:190px;

  padding:30px 26px;

  border:
    1px solid rgba(110,180,220,.16);

  background:
    linear-gradient(
      145deg,
      rgba(18,48,72,.35),
      rgba(6,19,32,.38)
    );

  overflow:hidden;

  text-decoration:none;

  color:inherit;

  transition:
    border-color .35s ease,
    background .35s ease,
    transform .35s ease,
    box-shadow .35s ease;
}

.archive-card::before{
  content:"";

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(150,220,250,.45),
      transparent
    );

  opacity:.5;
}

.archive-card::after{
  content:"";

  position:absolute;

  width:100px;
  height:100px;

  right:-45px;
  bottom:-45px;

  border-radius:50%;

  border:
    1px solid rgba(120,200,240,.08);
}

.archive-card:hover{
  transform:translateY(-4px);

  border-color:
    rgba(125,210,250,.32);

  background:
    linear-gradient(
      145deg,
      rgba(22,59,86,.48),
      rgba(7,22,37,.5)
    );

  box-shadow:
    0 10px 35px rgba(0,0,0,.2),
    0 0 25px rgba(70,160,215,.04);
}

.card-number{
  font-family:
    "Cinzel",
    serif;

  font-size:10px;

  letter-spacing:3px;

  color:rgba(120,195,235,.48);

  margin-bottom:26px;
}

.card-title{
  font-family:
    "Cinzel",
    serif;

  font-size:22px;

  font-weight:400;

  letter-spacing:4px;

  color:rgba(220,242,252,.86);

  margin-bottom:9px;
}

.card-cn{
  font-size:12px;

  letter-spacing:3px;

  color:rgba(175,215,235,.48);
}

.card-symbol{
  position:absolute;

  right:24px;
  top:25px;

  color:rgba(120,200,240,.25);

  font-family:
    "Times New Roman",
    serif;

  font-size:19px;

  text-shadow:
    0 0 12px rgba(80,180,230,.25);
}


/* =========================================================
   Footer
========================================================= */

.footer{
  position:relative;

  z-index:5;

  text-align:center;

  margin-top:60px;

  font-family:
    "Cinzel",
    serif;

  font-size:8px;

  letter-spacing:4px;

  color:rgba(145,190,215,.3);
}


/* =========================================================
   平板
========================================================= */

@media (max-width:800px){

  .header{

    right:35px;
    top:30px;
  }

  .archive-grid{

  }

}

========================================================= */

  }

  .arcane-star.star-i{font-size:8px;}
  .arcane-star.star-j{font-size:10px;}
  .arcane-star.star-k{font-size:12px;}
  .arcane-star.star-l{font-size:7px;}
  .arcane-star.star-m{font-size:11px;}
  .arcane-star.star-n{font-size:10px;}
  .arcane-star.star-o{font-size:15px;}
  .arcane-star.star-p{font-size:8px;}
  .arcane-star.star-q{font-size:9px;}
  .arcane-star.star-r{font-size:11px;}
  .arcane-star.star-s{font-size:12px;}
  .arcane-star.star-t{font-size:8px;}

}


/* =========================================================
   超小屏
========================================================= */

@media (max-width:360px){

  .header{
    left:20px;
    right:20px;
    top:24px;
  }

  .heading-main{
    font-size:27px;
  }

}


/* =========================================================
   减少动画
========================================================= */

@media (prefers-reduced-motion:reduce){

  .arcane-star{
    animation:none;
  }

  .archive-card{
    transition:none;
  }

}

</style>
</head>
