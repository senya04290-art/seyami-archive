<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 国家档案</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(25,61,92,.14),
            transparent 42%
        ),
        #061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================================================
   星点
========================================================= */

.stars,
.micro-stars,
.arcane-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:0;
}

.stars span,
.micro-stars span,
.arcane-stars span{

    position:absolute;

    display:block;

    color:#b9ddff;

    opacity:.45;

    animation:
        starFloat
        7s
        ease-in-out
        infinite;
}

.stars span{

    font-size:14px;
}

.micro-stars span{

    font-size:8px;

    opacity:.28;

    animation-duration:9s;
}

.arcane-stars span{

    font-size:11px;

    opacity:.22;

    animation-duration:11s;
}

@keyframes starFloat{

    0%,
    100%{

        transform:
            translate3d(0,0,0);

        opacity:.25;
    }

    50%{

        transform:
            translate3d(
                0,
                -6px,
                0
            );

        opacity:.55;
    }
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:fixed;

    width:min(70vw,760px);

    height:min(70vw,760px);

    left:50%;

    top:47%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(109,170,218,.11);

    border-radius:50%;

    pointer-events:none;

    z-index:0;
}

.magic-circle::before{

    content:"";

    position:absolute;

    inset:9%;

    border:
        1px solid
        rgba(109,170,218,.09);

    border-radius:50%;
}

.magic-circle::after{

    content:"";

    position:absolute;

    inset:20%;

    border:
        1px solid
        rgba(109,170,218,.07);

    border-radius:50%;
}


/* =========================================================
   外框
========================================================= */

.frame{

    position:fixed;

    inset:20px;

    border:
        1px solid
        rgba(129,181,222,.12);

    pointer-events:none;

    z-index:2;
}

.frame::before,
.frame::after{

    content:"";

    position:absolute;

    width:34px;

    height:34px;

    border-color:
        rgba(142,193,232,.28);

    border-style:solid;
}

.frame::before{

    left:-1px;

    top:-1px;

    border-width:
        1px 0 0 1px;
}

.frame::after{

    right:-1px;

    bottom:-1px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   Header
========================================================= */

header{

    position:relative;

    z-index:5;

    height:120px;

    padding:
        34px 58px 0;

    display:flex;

    justify-content:
        space-between;

    align-items:flex-start;
}

.logo{

    text-decoration:none;

    color:#dcecff;

    line-height:1.2;
}

.logo-cn{

    display:block;

    font-size:16px;

    letter-spacing:4px;

    font-weight:400;
}

.logo-en{

    display:block;

    margin-top:5px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:3px;

    opacity:.48;
}

.header-right{

    display:flex;

    align-items:center;

    gap:22px;
}

.back-link{

    color:
        rgba(210,231,248,.55);

    text-decoration:none;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    transition:
        color .3s ease;
}

.back-link:hover{

    color:#dcecff;
}

.theme-toggle{

    width:34px;

    height:34px;

    border:
        1px solid
        rgba(139,186,221,.2);

    background:
        rgba(8,25,43,.25);

    color:
        rgba(213,235,252,.62);

    cursor:pointer;

    font-family:"Cinzel",serif;

    font-size:11px;

    transition:
        all .3s ease;
}

.theme-toggle:hover{

    border-color:
        rgba(139,186,221,.45);

    color:#e3f3ff;
}


/* =========================================================
   主体
========================================================= */

main{

    position:relative;

    z-index:3;

    width:min(1120px, calc(100% - 80px));

    margin:0 auto;

    padding:
        35px 0 100px;
}


/* =========================================================
   标题
========================================================= */

.hero-title{

    text-align:center;

    margin-bottom:46px;
}

.hero-en{

    font-family:"Cinzel",serif;

    font-size:
        clamp(27px,4vw,45px);

    font-weight:400;

    letter-spacing:
        8px;

    line-height:1;

    opacity:.92;
}

.hero-sub{

    margin-top:13px;

    font-size:13px;

    letter-spacing:7px;

    opacity:.5;
}


/* =========================================================
   国家档案主体
========================================================= */

.nation-book{

    position:relative;

    width:min(900px,100%);

    margin:0 auto;

    min-height:560px;

    display:flex;

    align-items:stretch;

    justify-content:center;
}


/* =========================================================
   单页
========================================================= */

.nation-page{

    position:relative;

    width:100%;

    min-height:560px;

    padding:
        58px
        68px
        48px;

    background:
        linear-gradient(
            135deg,
            rgba(11,31,51,.72),
            rgba(7,23,40,.82)
        );

    border:
        1px solid
        rgba(132,181,219,.18);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.18);

    transition:
        background .5s ease,
        border-color .5s ease;
}

.nation-page::before{

    content:"";

    position:absolute;

    inset:12px;

    border:
        1px solid
        rgba(132,181,219,.07);

    pointer-events:none;
}

.nation-page::after{

    content:"";

    position:absolute;

    width:60px;

    height:60px;

    top:22px;

    right:22px;

    border:
        1px solid
        rgba(132,181,219,.1);

    border-left:0;

    border-bottom:0;

    pointer-events:none;
}


/* =========================================================
   页面顶部
========================================================= */

.page-top{

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    margin-bottom:34px;
}

.page-label{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(188,220,243,.46);
}

.page-number{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    color:
        rgba(188,220,243,.32);
}


/* =========================================================
   国家名称
========================================================= */

.nation-name{

    font-family:"Cinzel",serif;

    font-size:
        clamp(27px,4vw,42px);

    font-weight:400;

    letter-spacing:4px;

    line-height:1.2;

    color:#e2f1ff;

    margin:0;
}

.nation-subtitle{

    margin-top:13px;

    font-size:12px;

    letter-spacing:3px;

    opacity:.48;
}


/* =========================================================
   分隔线
========================================================= */

.page-line{

    width:100%;

    height:1px;

    margin:
        30px 0
        30px;

    background:
        linear-gradient(
            to right,
            rgba(126,177,216,.24),
            transparent
        );
}


/* =========================================================
   信息区域
========================================================= */

.nation-info{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        22px 42px;

    margin-bottom:34px;
}

.info-item{

    min-width:0;
}

.info-label{

    display:block;

    margin-bottom:7px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:2px;

    color:
        rgba(184,218,243,.38);
}

.info-value{

    display:block;

    font-size:12px;

    letter-spacing:1px;

    color:
        rgba(218,237,251,.78);

    min-height:18px;

    word-break:break-word;
}


/* =========================================================
   国家正文
========================================================= */

.nation-profile{

    margin-top:4px;
}

.profile-label{

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(184,218,243,.38);

    margin-bottom:12px;
}

.profile-text{

    font-size:13px;

    line-height:2;

    letter-spacing:1px;

    color:
        rgba(217,235,249,.67);

    white-space:pre-line;

    min-height:100px;
}


/* =========================================================
   编辑按钮
========================================================= */

.nation-edit-wrap{

    margin-top:32px;

    display:flex;

    justify-content:flex-end;
}

.nation-edit-button{

    border:
        1px solid
        rgba(111,174,224,.28);

    background:
        rgba(8,28,49,.22);

    color:
        rgba(191,220,243,.58);

    padding:
        8px 15px;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    cursor:pointer;

    transition:
        color .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.nation-edit-button:hover{

    color:#d9efff;

    border-color:
        rgba(111,174,224,.58);

    background:
        rgba(15,43,68,.38);
}

.nation-edit-button:disabled{

    opacity:.25;

    cursor:default;
}


/* =========================================================
   底部翻页
========================================================= */

.nation-navigation{

    width:min(900px,100%);

    margin:
        30px auto 0;

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    gap:20px;
}

.nav-button{

    border:0;

    background:none;

    color:
        rgba(192,220,241,.52);

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    cursor:pointer;

    padding:10px 0;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.nav-button:first-child{

    text-align:left;
}

.nav-button:last-child{

    text-align:right;
}

.nav-button:hover{

    color:#dcecff;
}

.nav-button:disabled{

    opacity:.18;

    cursor:default;
}

.page-status{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    color:
        rgba(192,220,241,.35);

    text-align:center;

    white-space:nowrap;
}


/* =========================================================
   更新时间
========================================================= */

.updated-time{

    margin-top:20px;

    text-align:right;

    font-family:"Cinzel",serif;

    font-size:7px;

    letter-spacing:1.5px;

    color:
        rgba(185,217,240,.25);
}


/* =========================================================
   空状态
========================================================= */

.empty-state{

    min-height:420px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:
        rgba(204,226,244,.38);

    font-size:13px;

    letter-spacing:2px;
}


/* =========================================================
   Footer
========================================================= */

footer{

    position:relative;

    z-index:3;

    text-align:center;

    padding:
        10px 0 45px;

    font-family:"Cinzel",serif;

    font-size:7px;

    letter-spacing:3px;

    color:
        rgba(181,214,239,.24);
}


/* =========================================================
   日间模式
========================================================= */

body.day{

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(164,201,226,.16),
            transparent 42%
        ),
        #eef5fa;

    color:#28465d;
}

body.day .frame{

    border-color:
        rgba(75,119,148,.18);
}

body.day .magic-circle{

    border-color:
        rgba(75,128,164,.13);
}

body.day .magic-circle::before{

    border-color:
        rgba(75,128,164,.1);
}

body.day .magic-circle::after{

    border-color:
        rgba(75,128,164,.08);
}

body.day .stars span,
body.day .micro-stars span,
body.day .arcane-stars span{

    color:#477b9f;
}

body.day .logo{

    color:#28465d;
}

body.day .back-link{

    color:
        rgba(52,87,110,.58);
}

body.day .back-link:hover{

    color:#294e68;
}

body.day .theme-toggle{

    border-color:
        rgba(80,124,151,.25);

    background:
        rgba(255,255,255,.38);

    color:
        rgba(47,82,105,.68);
}

body.day .hero-en{

    color:#294a62;
}

body.day .nation-page{

    background:
        linear-gradient(
            135deg,
            rgba(248,252,255,.78),
            rgba(235,244,250,.76)
        );

    border-color:
        rgba(86,132,160,.22);

    box-shadow:
        0 20px 60px
        rgba(57,91,112,.08);
}

body.day .nation-page::before{

    border-color:
        rgba(86,132,160,.09);
}

body.day .nation-name{

    color:#284b65;
}

body.day .nation-subtitle{

    color:
        rgba(51,83,103,.55);
}

body.day .page-label,
body.day .page-number,
body.day .info-label,
body.day .profile-label{

    color:
        rgba(55,91,114,.5);
}

body.day .info-value{

    color:
        rgba(42,73,94,.78);
}

body.day .profile-text{

    color:
        rgba(45,75,96,.7);
}

body.day .page-line{

    background:
        linear-gradient(
            to right,
            rgba(74,122,151,.24),
            transparent
        );
}

body.day .nation-edit-button{

    border-color:
        rgba(91,145,184,.34);

    background:
        rgba(248,252,255,.58);

    color:
        rgba(61,98,125,.68);
}

body.day .nation-edit-button:hover{

    color:#28536f;

    border-color:
        rgba(91,145,184,.58);

    background:
        rgba(248,252,255,.88);
}

body.day .nav-button{

    color:
        rgba(55,91,114,.58);
}

body.day .nav-button:hover{

    color:#28536f;
}

body.day .page-status{

    color:
        rgba(55,91,114,.42);
}

body.day .updated-time{

    color:
        rgba(55,91,114,.32);
}

body.day footer{

    color:
        rgba(55,91,114,.28);
}


/* =========================================================
   平板
========================================================= */

@media (max-width:900px){

    header{

        padding-left:38px;

        padding-right:38px;
    }

    main{

        width:
            calc(100% - 56px);
    }

    .nation-page{

        padding:
            48px 46px 42px;
    }
}


/* =========================================================
   手机
========================================================= */

@media (max-width:600px){

    .frame{

        inset:12px;
    }

    header{

        height:105px;

        padding:
            27px 25px 0;
    }

    .logo-cn{

        font-size:13px;

        letter-spacing:3px;
    }

    .logo-en{

        font-size:7px;

        letter-spacing:2px;
    }

    .header-right{

        gap:10px;
    }

    .back-link{

        font-size:7px;

        letter-spacing:1.5px;
    }

    .theme-toggle{

        width:30px;

        height:30px;
    }

    main{

        width:
            calc(100% - 34px);

        padding-top:28px;

        padding-bottom:65px;
    }

    .hero-title{

        margin-bottom:30px;
    }

    .hero-en{

        font-size:25px;

        letter-spacing:5px;
    }

    .hero-sub{

        font-size:10px;

        letter-spacing:4px;
    }

    .nation-book{

        min-height:0;
    }

    .nation-page{

        min-height:540px;

        padding:
            38px 27px 32px;
    }

    .nation-page::before{

        inset:9px;
    }

    .page-top{

        margin-bottom:26px;
    }

    .nation-name{

        font-size:27px;

        letter-spacing:3px;
    }

    .nation-subtitle{

        font-size:10px;

        letter-spacing:2px;
    }

    .page-line{

        margin:
            24px 0;
    }

    .nation-info{

        grid-template-columns:
            1fr;

        gap:18px;

        margin-bottom:28px;
    }

    .profile-text{

        font-size:12px;

        line-height:1.9;
    }

    .nation-edit-wrap{

        margin-top:24px;

        justify-content:flex-end;
    }

    .nation-edit-button{

        font-size:8px;

        padding:
            7px 11px;

        letter-spacing:1.5px;
    }

    .nation-navigation{

        margin-top:22px;

        gap:10px;
    }

    .nav-button{

        font-size:8px;

        letter-spacing:1.2px;
    }

    .page-status{

        font-size:8px;

        letter-spacing:1.5px;
    }
}


/* =========================================================
   超小屏
========================================================= */

@media (max-width:380px){

    header{

        padding-left:19px;

        padding-right:19px;
    }

    .back-link{

        display:none;
    }

    main{

        width:
            calc(100% - 24px);
    }

    .nation-page{

        padding:
            32px 21px 28px;
    }

    .nation-name{

        font-size:23px;
    }

    .nation-navigation{

        grid-template-columns:
            auto 1fr auto;
    }
}


/* =========================================================
   减少动画
========================================================= */

@media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;
    }
}

</style>

</head>

                <!-- 国家历史 -->

                <!-- 国家文化 -->

                <!-- 编辑 -->

                </div>

    <!-- ===================================================
         翻页

            ← PREVIOUS
        </button>

            class="page-status"
            id="pageStatus"
        >

<!-- =======================================================
     Supabase
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DOM
========================================================= */

const nationName =
    document.getElementById("nationName");

const nationSubtitle =
    document.getElementById("nationSubtitle");

const nationCapital =
    document.getElementById("nationCapital");

const nationGovernment =
    document.getElementById("nationGovernment");

const nationRegion =
    document.getElementById("nationRegion");

const nationDescription =
    document.getElementById("nationDescription");

const nationHistory =
    document.getElementById("nationHistory");

const nationCulture =
    document.getElementById("nationCulture");

const pageNumber =
    document.getElementById("pageNumber");

const pageStatus =
    document.getElementById("pageStatus");

const updatedTime =
    document.getElementById("updatedTime");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const editNationButton =
    document.getElementById("editNationButton");

const nationContent =
    document.getElementById("nationContent");

const emptyState =
    document.getElementById("emptyState");

const themeToggle =
    document.getElementById("themeToggle");


/* =========================================================
   数据
========================================================= */

let nations = [];

let currentPage = 0;


/* =========================================================
   安全显示
========================================================= */

function displayValue(value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "—";
    }

    return String(value);
}


/* =========================================================
   时间
========================================================= */

function formatDate(value){

    if(!value){
        return "";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";
    }

    return (
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2,"0") +
        "." +
        String(
            date.getDate()
        ).padStart(2,"0")
    );
}


/* =========================================================
   显示国家
========================================================= */

function renderNation(){

    if(nations.length === 0){

        nationContent.style.display =
            "none";

        emptyState.style.display =
            "flex";

        pageNumber.textContent =
            "—";

        pageStatus.textContent =
            "— / —";

        prevButton.disabled =
            true;

        nextButton.disabled =
            true;

        editNationButton.disabled =
            true;

        editNationButton.onclick =
            null;

        return;
    }


    nationContent.style.display =
        "block";

    emptyState.style.display =
        "none";


    const nation =
        nations[currentPage];


    /* -----------------------------------------
       基础内容
    ----------------------------------------- */

    nationName.textContent =
        displayValue(
            nation.name
        );

    nationSubtitle.textContent =
        displayValue(
            nation.subtitle
        );

    nationCapital.textContent =
        displayValue(
            nation.capital
        );

    nationGovernment.textContent =
        displayValue(
            nation.government
        );

    nationRegion.textContent =
        displayValue(
            nation.region
        );


    nationDescription.textContent =
        displayValue(
            nation.description
        );


    nationHistory.textContent =
        displayValue(
            nation.history
        );


    nationCulture.textContent =
        displayValue(
            nation.culture
        );


    /* -----------------------------------------
       编号
    ----------------------------------------- */

    const displayNumber =
        String(
            currentPage + 1
        ).padStart(3,"0");

    const totalNumber =
        String(
            nations.length
        ).padStart(3,"0");


    pageNumber.textContent =
        displayNumber;


    pageStatus.textContent =
        displayNumber +
        " / " +
        totalNumber;


    /* -----------------------------------------
       更新时间
    ----------------------------------------- */

    const formattedDate =
        formatDate(
            nation.updated_at
        );

    if(formattedDate){

        updatedTime.textContent =
            "LAST UPDATED · " +
            formattedDate;

    }else{

        updatedTime.textContent =
            "";

    }


    /* -----------------------------------------
       翻页按钮
    ----------------------------------------- */

    prevButton.disabled =
        currentPage <= 0;

    nextButton.disabled =
        currentPage >=
        nations.length - 1;


    /* -----------------------------------------
       编辑按钮
    ----------------------------------------- */

    editNationButton.disabled =
        !nation.id;

    editNationButton.onclick =
        function(){

            if(!nation.id){

                return;
            }

            window.location.href =
                "edit.html?type=country&id=" +
                encodeURIComponent(
                    nation.id
                );
        };

}


/* =========================================================
   上一个
========================================================= */

prevButton.addEventListener(
    "click",
    function(){

        if(
            currentPage <= 0
        ){

            return;
        }

        currentPage--;

        renderNation();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   下一个
========================================================= */

nextButton.addEventListener(
    "click",
    function(){

        if(
            currentPage >=
            nations.length - 1
        ){

            return;
        }

        currentPage++;

        renderNation();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   键盘翻页
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft"
        ){

            if(
                !prevButton.disabled
            ){

                prevButton.click();
            }

        }


        if(
            event.key === "ArrowRight"
        ){

            if(
                !nextButton.disabled
            ){

                nextButton.click();
            }

        }

    }
);


/* =========================================================
   读取国家
========================================================= */

async function loadNations(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("countries")
            .select(`
                id,
                name,
                subtitle,
                capital,
                government,
                region,
                description,
                history,
                culture,
                updated_at
            `)
            .order(
                "id",
                {
                    ascending:true
                }
            );


        if(error){

            console.error(
                "读取国家失败：",
                error
            );

            nationContent.style.display =
                "none";

            emptyState.style.display =
                "flex";

            emptyState.textContent =
                "读取国家档案失败";

            prevButton.disabled =
                true;

            nextButton.disabled =
                true;

            editNationButton.disabled =
                true;

            return;
        }


        nations =
            Array.isArray(data)
                ? data
                : [];


        currentPage = 0;

        renderNation();


    }catch(error){

        console.error(
            "读取国家异常：",
            error
        );

        nationContent.style.display =
            "none";

        emptyState.style.display =
            "flex";

        emptyState.textContent =
            "读取国家档案失败";

        prevButton.disabled =
            true;

        nextButton.disabled =
            true;

        editNationButton.disabled =
            true;

    }

}


/* =========================================================
   日 / 夜模式
========================================================= */

function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

        themeToggle.textContent =
            "☀";

    }else{

        document.body.classList.remove(
            "day"
        );

        themeToggle.textContent =
            "☾";

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day"
            );

        const nextTheme =
            isDay
                ? "night"
                : "day";

        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );

        applyTheme(
            nextTheme
        );

    }
);


/* =========================================================
   启动
========================================================= */

loadNations();

</script>

</body>

</html>
