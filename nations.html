<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061426">
<title>塞垭弥大陆档案馆 · 国家档案</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #061426;
    --bg-deep: #030b17;
    --panel: rgba(10, 29, 51, .92);
    --paper: #10253b;
    --paper-light: #142e48;
    --text: #dcecff;
    --text-soft: #a9bfd6;
    --text-muted: #718da9;
    --gold: #c4aa78;
    --gold-light: #e0cda2;
    --line: rgba(196,170,120,.38);
    --shadow: rgba(0,0,0,.36);
    --page-radius: 3px;
    --body-font: "Noto Serif SC", serif;
    --title-font: "Cinzel", serif;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 0%, rgba(31,67,103,.24), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-deep));
    font-family: var(--body-font);
    font-weight: 300;
    overflow-x: hidden;
    transition: background .3s, color .3s;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: .32;
    background-image:
        radial-gradient(1px 1px at 8% 18%, #dcecff 50%, transparent 100%),
        radial-gradient(1px 1px at 72% 13%, #dcecff 50%, transparent 100%),
        radial-gradient(1px 1px at 31% 44%, #dcecff 50%, transparent 100%),
        radial-gradient(1px 1px at 88% 62%, #dcecff 50%, transparent 100%),
        radial-gradient(1px 1px at 15% 79%, #dcecff 50%, transparent 100%),
        radial-gradient(1px 1px at 59% 87%, #dcecff 50%, transparent 100%);
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

.site-header {
    position: relative;
    z-index: 2;
    width: min(1200px, calc(100% - 48px));
    margin: 0 auto;
    padding: 25px 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--line);
}

.brand {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.brand-cn {
    color: var(--gold-light);
    font-size: 15px;
    letter-spacing: 3px;
}

.brand-en {
    color: var(--text-muted);
    font-family: var(--title-font);
    font-size: 10px;
    letter-spacing: 3px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-link,
.theme-toggle {
    min-height: 36px;
    padding: 8px 13px;
    border: 1px solid var(--line);
    background: rgba(7,22,39,.6);
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

.header-link:hover,
.theme-toggle:hover {
    color: var(--gold-light);
    border-color: var(--gold);
}

main {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto;
    padding: 42px 0 65px;
}

.page-heading {
    margin-bottom: 28px;
    text-align: center;
}

.eyebrow {
    color: var(--gold);
    font-family: var(--title-font);
    font-size: 11px;
    letter-spacing: 5px;
}

.page-heading h1 {
    margin: 12px 0 9px;
    color: var(--gold-light);
    font-family: var(--title-font), var(--body-font);
    font-size: clamp(25px, 4vw, 38px);
    font-weight: 400;
    letter-spacing: 5px;
}

.page-heading p {
    margin: 0;
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 2px;
}

.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 20px auto 0;
    color: var(--gold);
    font-size: 12px;
}

.ornament::before,
.ornament::after {
    content: "";
    width: 56px;
    height: 1px;
    background: var(--line);
}

/* 书本外框 */
.book-wrap {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

.book {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: stretch;
    min-height: 500px;
    border: 1px solid rgba(196,170,120,.52);
    background: var(--panel);
    box-shadow:
        0 20px 60px var(--shadow),
        inset 0 0 0 5px rgba(196,170,120,.035);
}

.book::before {
    content: "";
    position: absolute;
    z-index: 2;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: linear-gradient(
        transparent,
        rgba(196,170,120,.45) 8%,
        rgba(196,170,120,.22) 50%,
        rgba(196,170,120,.45) 92%,
        transparent
    );
    pointer-events: none;
}

.book-page {
    position: relative;
    min-width: 0;
    min-height: 500px;
    padding: 42px 38px;
    overflow-wrap: anywhere;
}

.left-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(ellipse at center, rgba(35,68,98,.32), transparent 70%),
        var(--paper);
}

.left-emblem {
    width: 170px;
    height: 170px;
    max-width: 65%;
    margin-bottom: 28px;
    display: grid;
    place-items: center;
    position: relative;
}

.left-emblem::before,
.left-emblem::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(196,170,120,.55);
    border-radius: 50%;
}

.left-emblem::after {
    inset: 12px;
    border-style: dashed;
    opacity: .7;
    animation: slow-rotate 90s linear infinite;
}

.emblem-inner {
    width: 70%;
    height: 70%;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--gold-light);
    font-family: var(--title-font);
    font-size: 46px;
    font-weight: 300;
}

@keyframes slow-rotate {
    to { transform: rotate(360deg); }
}

.left-label {
    color: var(--gold);
    font-family: var(--title-font);
    font-size: 10px;
    letter-spacing: 4px;
}

.left-country-name {
    margin: 16px 0 10px;
    color: var(--gold-light);
    font-size: clamp(21px, 2.5vw, 28px);
    font-weight: 400;
    letter-spacing: 3px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.left-subtitle {
    max-width: 100%;
    color: var(--text-soft);
    font-size: 12px;
    line-height: 2;
    overflow-wrap: anywhere;
}

.left-bottom {
    margin-top: 36px;
    color: var(--text-muted);
    font-family: var(--title-font);
    font-size: 9px;
    letter-spacing: 3px;
}

.right-page {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background:
        linear-gradient(135deg, rgba(255,255,255,.018), transparent 42%),
        var(--paper-light);
}

.section-label {
    color: var(--gold);
    font-family: var(--title-font);
    font-size: 10px;
    letter-spacing: 3px;
}

.right-title {
    margin: 12px 0 8px;
    color: var(--gold-light);
    font-size: clamp(21px, 2.4vw, 28px);
    font-weight: 400;
    letter-spacing: 2px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.right-subtitle {
    margin-bottom: 18px;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.9;
}

.title-rule {
    width: 100%;
    height: 1px;
    margin: 0 0 20px;
    background: linear-gradient(90deg, var(--gold), transparent);
    opacity: .65;
}

.content-section {
    margin-bottom: 22px;
    min-width: 0;
}

.content-heading {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 10px;
    color: var(--gold-light);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
}

.content-heading::before {
    content: "✦";
    color: var(--gold);
    font-size: 10px;
}

.page-text {
    margin: 0;
    min-width: 0;
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 300;
    line-height: 2.1;
    white-space: pre-line;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.country-info {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 24px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
}

.info-item {
    min-width: 0;
}

.info-label {
    margin-bottom: 6px;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 1px;
}

.info-value {
    min-width: 0;
    color: var(--text);
    font-size: 12px;
    line-height: 1.9;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-line;
}

.edit-area {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: auto;
    padding-top: 18px;
}

.edit-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    background: rgba(3,11,23,.22);
    color: var(--gold-light);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

.edit-button:hover {
    border-color: var(--gold-light);
    background: rgba(196,170,120,.1);
}

.book-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    margin: 24px auto 0;
}

.page-button {
    min-width: 108px;
    min-height: 39px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    background: rgba(7,22,39,.72);
    color: var(--text-soft);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

.page-button:hover:not(:disabled) {
    color: var(--gold-light);
    border-color: var(--gold);
}

.page-button:disabled {
    opacity: .3;
    cursor: not-allowed;
}

.page-indicator {
    min-width: 90px;
    color: var(--text-muted);
    font-family: var(--title-font);
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
}

.status-message {
    min-height: 28px;
    margin: 18px auto 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.8;
    text-align: center;
}

.status-message.error {
    color: #d99b9b;
}

.empty-state {
    padding: 70px 20px;
    border: 1px solid var(--line);
    color: var(--text-soft);
    text-align: center;
    line-height: 2.2;
}

.empty-state .empty-symbol {
    margin-bottom: 15px;
    color: var(--gold);
    font-size: 25px;
}

.site-footer {
    padding: 20px 20px 30px;
    color: var(--text-muted);
    font-family: var(--title-font);
    font-size: 9px;
    letter-spacing: 3px;
    text-align: center;
}

/* 日间模式：仅改变明暗，不改变布局 */
body.day-mode {
    --bg: #e9edf2;
    --bg-deep: #dce4ec;
    --panel: rgba(248,250,252,.96);
    --paper: #f4f6f8;
    --paper-light: #fff;
    --text: #23374b;
    --text-soft: #465c70;
    --text-muted: #718295;
    --gold: #9a7a43;
    --gold-light: #806332;
    --line: rgba(130,105,61,.32);
    --shadow: rgba(20,38,56,.13);
}

body.day-mode::before {
    opacity: .08;
}

body.day-mode .header-link,
body.day-mode .theme-toggle,
body.day-mode .page-button {
    background: rgba(255,255,255,.75);
}

body.day-mode .left-page {
    background:
        radial-gradient(ellipse at center, rgba(196,170,120,.09), transparent 70%),
        var(--paper);
}

body.day-mode .right-page {
    background: var(--paper-light);
}

body.day-mode .edit-button {
    background: rgba(255,255,255,.8);
}

/* 平板 */
@media (max-width: 800px) {
    .site-header {
        width: calc(100% - 32px);
    }

    main {
        width: calc(100% - 28px);
        padding-top: 32px;
    }

    .book {
        min-height: 480px;
    }

    .book-page {
        min-height: 480px;
        padding: 32px 25px;
    }

    .left-emblem {
        width: 135px;
        height: 135px;
    }

    .emblem-inner {
        font-size: 37px;
    }

    .page-text {
        font-size: 12px;
        line-height: 2;
    }
}

/* 手机：页面高度由内容决定，禁止裁切 */
@media (max-width: 600px) {
    .site-header {
        width: calc(100% - 28px);
        padding-top: 18px;
        gap: 10px;
    }

    .brand-cn {
        font-size: 12px;
        letter-spacing: 1.5px;
    }

    .brand-en {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .header-actions {
        gap: 6px;
    }

    .header-link,
    .theme-toggle {
        min-height: 33px;
        padding: 7px 9px;
        font-size: 10px;
    }

    main {
        width: calc(100% - 24px);
        padding-top: 28px;
        padding-bottom: 42px;
    }

    .page-heading {
        margin-bottom: 22px;
    }

    .page-heading h1 {
        font-size: 25px;
        letter-spacing: 3px;
    }

    .page-heading p {
        font-size: 10px;
        line-height: 1.9;
        letter-spacing: 1px;
    }

    .book {
        display: flex;
        flex-direction: column;
        height: auto !important;
        min-height: 0;
        overflow: visible;
    }

    .book::before {
        display: none;
    }

    .book-page,
    .left-page,
    .right-page {
        width: 100%;
        height: auto !important;
        min-height: 0;
        overflow: visible !important;
    }

    .left-page {
        padding: 30px 23px 28px;
        border-bottom: 1px solid var(--line);
    }

    .left-emblem {
        width: 105px;
        height: 105px;
        margin-bottom: 18px;
    }

    .emblem-inner {
        font-size: 30px;
    }

    .left-country-name {
        margin: 12px 0 6px;
        font-size: 23px;
    }

    .left-bottom {
        margin-top: 18px;
    }

    .right-page {
        padding: 28px 23px 24px;
    }

    .right-title {
        font-size: 23px;
    }

    .right-subtitle {
        margin-bottom: 15px;
    }

    .content-section {
        margin-bottom: 21px;
    }

    .page-text {
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        overflow-y: visible !important;
        font-size: 13px;
        line-height: 2;
        white-space: pre-line;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .country-info {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 12px;
    }

    .info-item,
    .info-value {
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .edit-area {
        position: static !important;
        width: 100%;
        margin-top: 8px;
        padding-top: 15px;
        justify-content: flex-end;
        flex-wrap: wrap;
    }

    .edit-button {
        min-height: 40px;
    }

    .book-controls {
        position: relative;
        margin-top: 20px;
        gap: 10px;
    }

    .page-button {
        min-width: 94px;
        min-height: 40px;
        padding: 9px 10px;
    }

    .page-indicator {
        min-width: 68px;
        font-size: 10px;
    }

    .site-footer {
        padding-bottom: 24px;
        font-size: 8px;
        letter-spacing: 2px;
    }
}

/* 窄屏手机 */
@media (max-width: 360px) {
    .brand-cn {
        font-size: 11px;
        letter-spacing: 1px;
    }

    .header-link,
    .theme-toggle {
        padding: 6px 7px;
        font-size: 9px;
    }

    .right-page {
        padding: 24px 17px 21px;
    }

    .left-page {
        padding-right: 17px;
        padding-left: 17px;
    }

    .country-info {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
    }

    .page-text {
        font-size: 12px;
        line-height: 2;
    }

    .page-button {
        min-width: 82px;
        font-size: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>
<header class="site-header">
    <a class="brand" href="index.html" aria-label="返回塞垭弥大陆档案馆首页">
        <span class="brand-cn">塞垭弥大陆档案馆</span>
        <span class="brand-en">SEYAMI ARCHIVE</span>
    </a>

    <div class="header-actions">
        <a class="header-link" href="archive.html">人物档案</a>
        <button class="theme-toggle" id="themeToggle" type="button">☼ 日间</button>
    </div>
</header>

<main>
    <section class="page-heading">
        <div class="eyebrow">NATION ARCHIVE</div>
        <h1>国家档案</h1>
        <p>记录塞垭弥大陆的国度、历史与文明</p>
        <div class="ornament">✦</div>
    </section>

    <section id="archiveRoot" aria-live="polite">
        <div class="empty-state">
            <div class="empty-symbol">✧</div>
            正在读取国家档案……
        </div>
    </section>

    <div class="status-message" id="statusMessage" role="status"></div>
</main>

<footer class="site-footer">
    SEYAMI ARCHIVE · THE CONTINENT RECORDS
</footer>

<script>
/* =========================================
   Supabase 配置
   使用现有的 Seyami Archive 项目
========================================= */
const SUPABASE_URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const archiveRoot = document.getElementById("archiveRoot");
const statusMessage = document.getElementById("statusMessage");
const themeToggle = document.getElementById("themeToggle");

let countries = [];
let currentIndex = 0;

/* 安全转义，避免档案文本被当成 HTML 执行 */
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

/* 空值统一显示 */
function displayValue(value) {
    if (value === null || value === undefined || String(value).trim() === "") {
        return "尚未记载";
    }
    return escapeHTML(value);
}

/* 将文本中的换行保留下来 */
function displayText(value) {
    if (value === null || value === undefined || String(value).trim() === "") {
        return "这部分档案暂时留白。";
    }
    return escapeHTML(value);
}

function setStatus(message, isError = false) {
    statusMessage.textContent = message;
    statusMessage.classList.toggle("error", isError);
}

/* 国家基本信息 */
function renderInfoItem(label, value) {
    return `
        <div class="info-item">
            <div class="info-label">${escapeHTML(label)}</div>
            <div class="info-value">${displayValue(value)}</div>
        </div>
    `;
}

/* 根据当前国家生成档案 */
function renderNation() {
    if (!countries.length) {
        archiveRoot.innerHTML = `
            <div class="empty-state">
                <div class="empty-symbol">✧</div>
                目前还没有可展示的国家档案。<br>
                请确认数据库 countries 表中已有国家记录。
            </div>
        `;
        updateControls();
        return;
    }

    currentIndex = Math.max(0, Math.min(currentIndex, countries.length - 1));

    const nation = countries[currentIndex];

    const name = nation.name || "未命名国度";
    const subtitle = nation.subtitle || "国家档案";
    const description = nation.description || "";
    const history = nation.history || "";
    const culture = nation.culture || "";

    archiveRoot.innerHTML = `
        <div class="book-wrap">
            <div class="book" id="nationBook">

                <article class="book-page left-page">
                    <div class="left-emblem" aria-hidden="true">
                        <div class="emblem-inner">✦</div>
                    </div>

                    <div class="left-label">NATION RECORD</div>
                    <h2 class="left-country-name">${escapeHTML(name)}</h2>
                    <div class="left-subtitle">${displayValue(subtitle)}</div>
                    <div class="left-bottom">SEYAMI · ARCHIVE</div>
                </article>

                <article class="book-page right-page" id="rightPage">
                    <div class="section-label">COUNTRY PROFILE</div>
                    <h2 class="right-title">${escapeHTML(name)}</h2>
                    <div class="right-subtitle">${displayValue(subtitle)}</div>
                    <div class="title-rule"></div>

                    <section class="content-section">
                        <h3 class="content-heading">国家概述</h3>
                        <p class="page-text">${displayText(description)}</p>
                    </section>

                    <section class="content-section">
                        <h3 class="content-heading">国家历史</h3>
                        <p class="page-text">${displayText(history)}</p>
                    </section>

                    <section class="content-section">
                        <h3 class="content-heading">文化与风俗</h3>
                        <p class="page-text">${displayText(culture)}</p>
                    </section>

                    <div class="country-info">
                        ${renderInfoItem("首都", nation.capital)}
                        ${renderInfoItem("政体", nation.government)}
                        ${renderInfoItem("所属区域", nation.region)}
                        ${renderInfoItem("档案更新", formatDate(nation.updated_at))}
                    </div>

                    <div class="edit-area">
                        <a
                            class="edit-button"
                            href="edit.html?type=country&id=${encodeURIComponent(nation.id)}"
                            aria-label="修改${escapeHTML(name)}的国家档案"
                        >✦ 修改档案</a>
                    </div>
                </article>
            </div>

            <nav class="book-controls" aria-label="国家档案翻页">
                <button
                    class="page-button"
                    id="prevButton"
                    type="button"
                    ${currentIndex === 0 ? "disabled" : ""}
                >← 上一国</button>

                <div class="page-indicator" id="pageIndicator">
                    ${currentIndex + 1} / ${countries.length}
                </div>

                <button
                    class="page-button"
                    id="nextButton"
                    type="button"
                    ${currentIndex >= countries.length - 1 ? "disabled" : ""}
                >下一国 →</button>
            </nav>
        </div>
    `;

    document.getElementById("prevButton").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderNation();
            scrollToBook();
        }
    });

    document.getElementById("nextButton").addEventListener("click", () => {
        if (currentIndex < countries.length - 1) {
            currentIndex++;
            renderNation();
            scrollToBook();
        }
    });

    updateControls();
}

function formatDate(value) {
    if (!value) return "尚未记录";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleDateString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}

function updateControls() {
    const indicator = document.getElementById("pageIndicator");
    if (indicator && countries.length) {
        indicator.textContent = `${currentIndex + 1} / ${countries.length}`;
    }
}

function scrollToBook() {
    const book = document.getElementById("nationBook");
    if (!book) return;

    const rect = book.getBoundingClientRect();
    if (rect.top < 0 || rect.top > window.innerHeight * 0.55) {
        book.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}

/* 从 Supabase 读取国家档案 */
async function loadCountries() {
    setStatus("");

    const { data, error } = await supabaseClient
        .from("countries")
        .select("id, name, subtitle, capital, government, region, description, history, culture, updated_at")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("读取国家档案失败：", error);

        archiveRoot.innerHTML = `
            <div class="empty-state">
                <div class="empty-symbol">✧</div>
                国家档案暂时无法读取。<br>
                请检查 Supabase 的 countries 表权限及网络连接。
            </div>
        `;

        setStatus("读取失败：" + error.message, true);
        return;
    }

    countries = Array.isArray(data) ? data : [];
    currentIndex = 0;

    if (!countries.length) {
        renderNation();
        setStatus("数据库中暂时没有国家记录。");
        return;
    }

    renderNation();
    setStatus(`已载入 ${countries.length} 份国家档案。`);
}

/* 日间／夜间模式 */
function applyTheme(isDay) {
    document.body.classList.toggle("day-mode", isDay);
    themeToggle.textContent = isDay ? "☾ 夜间" : "☼ 日间";
    themeToggle.setAttribute("aria-pressed", String(isDay));
}

themeToggle.addEventListener("click", () => {
    const isDay = !document.body.classList.contains("day-mode");
    applyTheme(isDay);
});

/* 键盘翻页 */
document.addEventListener("keydown", event => {
    const tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

    if (event.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex--;
        renderNation();
    } else if (event.key === "ArrowRight" && currentIndex < countries.length - 1) {
        currentIndex++;
        renderNation();
    }
});

/* 启动 */
loadCountries();
</script>
</body>
</html>
