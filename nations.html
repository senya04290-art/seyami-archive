<title>塞垭弥大陆档案馆 · 国家档案</title>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    background:#061426;
    color:#dcecff;
    font-family:"Noto Serif SC",serif;
    overflow-x:hidden;
    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================================================
   页面背景
========================================================= */

.page{
    position:relative;
    min-height:100vh;
    padding:34px 28px 42px;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;

    transition:background .5s ease;

    overflow:hidden;
}

   星星背景
========================================================= */

.stars,
.stars::before,
.stars::after{
    position:absolute;
    content:"";
    pointer-events:none;
}

.stars{
    inset:0;
    z-index:0;
}

    height:2px;

        91vw 53vh rgba(182,220,255,.46),

        9vw 81vh rgba(182,220,255,.34),
        20vw 91vh rgba(182,220,255,.48),
        33vw 82vh rgba(182,220,255,.36),
        45vw 94vh rgba(182,220,255,.42),
        57vw 84vh rgba(182,220,255,.32),
        68vw 92vh rgba(182,220,255,.48),
        79vw 82vh rgba(182,220,255,.36),

}

        44vw 39vh rgba(182,220,255,.35),

        66vw 42vh rgba(182,220,255,.35),

}


/* =========================================================
   微小星点
========================================================= */

.micro-stars{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.micro-stars span{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(158,207,247,.62);
    opacity:.45;
    animation:microTwinkle 5s ease-in-out infinite;
}

.micro-stars span:nth-child(1){left:9%;top:12%;animation-delay:0s;}
.micro-stars span:nth-child(2){left:18%;top:25%;animation-delay:1s;}
.micro-stars span:nth-child(3){left:28%;top:11%;animation-delay:2s;}
.micro-stars span:nth-child(4){left:37%;top:21%;animation-delay:3s;}
.micro-stars span:nth-child(5){left:48%;top:9%;animation-delay:1.5s;}
.micro-stars span:nth-child(6){left:58%;top:27%;animation-delay:2.5s;}
.micro-stars span:nth-child(7){left:69%;top:14%;animation-delay:4s;}
.micro-stars span:nth-child(8){left:78%;top:24%;animation-delay:.5s;}
.micro-stars span:nth-child(9){left:88%;top:11%;animation-delay:3.5s;}
.micro-stars span:nth-child(10){left:94%;top:31%;animation-delay:1.2s;}

.micro-stars span:nth-child(11){left:7%;top:48%;animation-delay:2.2s;}
.micro-stars span:nth-child(12){left:20%;top:58%;animation-delay:4.2s;}
.micro-stars span:nth-child(13){left:31%;top:46%;animation-delay:1.8s;}
.micro-stars span:nth-child(14){left:44%;top:57%;animation-delay:.8s;}
.micro-stars span:nth-child(15){left:56%;top:48%;animation-delay:3.2s;}
.micro-stars span:nth-child(16){left:68%;top:59%;animation-delay:1.4s;}
.micro-stars span:nth-child(17){left:80%;top:47%;animation-delay:2.8s;}
.micro-stars span:nth-child(18){left:91%;top:57%;animation-delay:4.5s;}
.micro-stars span:nth-child(19){left:13%;top:84%;animation-delay:3.8s;}

@keyframes microTwinkle{
    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }

    50%{
        opacity:.9;
        transform:scale(1.5);
    }
}


/* =========================================================
   魔法星
========================================================= */

.arcane-stars{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.arcane-stars span{
    position:absolute;
    width:4px;
    height:4px;
    background:rgba(158,207,247,.62);
    transform:rotate(45deg);
    opacity:.52;
    box-shadow:0 0 7px rgba(113,177,220,.28);
}

.star-a{left:7%;top:19%;}
.star-b{left:15%;top:8%;}
.star-c{left:24%;top:31%;}
.star-d{left:34%;top:12%;}
.star-e{left:43%;top:24%;}
.star-f{left:54%;top:10%;}
.star-g{left:64%;top:31%;}
.star-h{left:74%;top:17%;}
.star-i{left:84%;top:28%;}
.star-j{left:93%;top:13%;}

.star-k{left:5%;top:67%;}
.star-l{left:16%;top:77%;}
.star-m{left:27%;top:64%;}
.star-n{left:38%;top:75%;}
.star-o{left:49%;top:67%;}
.star-p{left:61%;top:78%;}
.star-q{left:72%;top:65%;}
.star-r{left:83%;top:76%;}
.star-s{left:94%;top:68%;}
.star-t{left:57%;top:90%;}

.extra-u{left:12%;top:42%;}
.extra-v{left:30%;top:54%;}
.extra-w{left:46%;top:42%;}
.extra-x{left:66%;top:49%;}
.extra-y{left:86%;top:44%;}
.extra-z{left:97%;top:55%;}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{
    position:absolute;
    width:680px;
    height:680px;
    left:50%;
    top:49%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(73,143,198,.28);
    border-radius:50%;
    z-index:1;
    pointer-events:none;
}

.magic-circle::before{
    content:"";
    position:absolute;
    inset:34px;
    border:1px solid rgba(91,162,213,.22);
    border-radius:50%;
}

.magic-circle::after{
    content:"✦";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:18px;
    color:rgba(117,181,220,.25);
}


/* =========================================================
   外框
========================================================= */

.frame{
    position:relative;
    z-index:5;

    max-width:1280px;
    min-height:calc(100vh - 76px);

    margin:0 auto;

    border:1px solid rgba(111,174,224,.32);

    padding:28px 34px 32px;

    display:flex;
    flex-direction:column;
}


/* 四角装饰 */

.frame::before,
.frame::after{
    content:"";
    position:absolute;
    width:42px;
    height:42px;
    pointer-events:none;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-left:1px solid rgba(108,178,230,.88);
    border-top:1px solid rgba(108,178,230,.88);
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-right:1px solid rgba(108,178,230,.88);
    border-bottom:1px solid rgba(108,178,230,.88);
}


/* =========================================================
   Header
========================================================= */

.header{
    position:relative;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    min-height:44px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    color:#d9edff;

    font-family:"Cinzel",serif;
    font-size:14px;
    letter-spacing:3px;
    white-space:nowrap;
}

.logo-symbol{
    color:rgba(137,201,239,.9);
    font-size:13px;
}


/* =========================================================
   Header 右侧
========================================================= */

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.back{
    text-decoration:none;

    color:rgba(191,220,243,.68);

    font-family:"Cinzel","Noto Serif SC",serif;
    font-size:11px;
    letter-spacing:1.8px;

    transition:color .3s ease;
}

.back:hover{
    color:#d9efff;
}


/* =========================================================
   日夜切换
========================================================= */

.theme-toggle{
    border:1px solid rgba(111,174,224,.32);

    background:rgba(8,28,49,.35);

    color:rgba(191,220,243,.68);

    padding:7px 11px;

    font-family:"Noto Serif SC",serif;
    font-size:11px;

    letter-spacing:1px;

    cursor:pointer;

    transition:
        color .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.theme-toggle:hover{
    color:#d9efff;
    border-color:rgba(111,174,224,.58);
}


/* =========================================================
   主标题
========================================================= */

.hero{
    position:relative;
    z-index:5;

    text-align:center;

    padding:70px 10px 55px;
}

.hero-main{
    font-family:"Cinzel",serif;

    font-size:clamp(30px,5vw,58px);

    font-weight:400;

    letter-spacing:8px;

    line-height:1.15;

    color:#dceeff;

    text-shadow:
        0 0 18px rgba(106,172,220,.08);
}

.hero-sub{
    margin-top:16px;

    font-family:"Cinzel",serif;

    font-size:13px;

    letter-spacing:5px;

    color:rgba(177,207,230,.62);
}

.hero-cn{
    margin-top:10px;

    font-size:13px;

    letter-spacing:4px;

    color:rgba(177,207,230,.62);
}


/* =========================================================
   国家档案区域
========================================================= */

.nation-list{
    position:relative;
    z-index:5;

    width:100%;
    max-width:1080px;

    margin:0 auto;

    display:flex;
    flex-direction:column;

    gap:22px;
}


/* =========================================================
   国家卡片
========================================================= */

.nation-card{
    position:relative;

    min-height:230px;

    padding:28px 30px 30px;

    border:1px solid rgba(111,174,224,.30);

    background:
        linear-gradient(
            135deg,
            rgba(12,39,64,.30),
            rgba(7,25,45,.16)
        );

    backdrop-filter:blur(3px);

    overflow:hidden;

    transition:
        border-color .35s ease,
        background .35s ease,
        transform .35s ease;
}

.nation-card:hover{
    border-color:rgba(111,174,224,.52);

    background:
        linear-gradient(
            135deg,
            rgba(16,48,76,.38),
            rgba(7,28,49,.20)
        );

    transform:translateY(-2px);
}


/* 卡片顶部细线 */

.nation-card::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(111,174,224,.52),
            transparent
        );
}


/* 左上编号 */

.nation-number{
    position:absolute;

    top:18px;
    left:22px;

    font-family:"Cinzel",serif;

    font-size:11px;

    letter-spacing:2px;

    color:rgba(111,174,224,.48);
}


/* 星形装饰 */

.nation-symbol{
    position:absolute;

    right:25px;
    top:20px;

    color:rgba(137,201,239,.55);

    font-size:14px;
}


/* 国家标题 */

.nation-title{
    margin-top:18px;

    font-family:"Cinzel",serif;

    font-size:25px;

    letter-spacing:4px;

    color:#dceeff;
}

.nation-cn{
    margin-top:7px;

    font-size:13px;

    letter-spacing:3px;

    color:rgba(177,207,230,.62);
}


/* =========================================================
   国家信息
========================================================= */

.nation-info{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-top:28px;

    padding-top:20px;

    border-top:1px solid rgba(111,174,224,.16);
}

.info-item{
    min-width:0;
}

.info-label{
    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(137,190,220,.52);

    margin-bottom:7px;
}

.info-value{
    min-height:18px;

    font-size:11px;

    letter-spacing:1px;

    color:rgba(205,228,244,.48);
}


/* =========================================================
   国家简介
========================================================= */

.nation-description{
    margin-top:22px;

    min-height:35px;

    color:rgba(191,220,243,.42);

    font-size:11px;

    line-height:2;

    letter-spacing:1px;
}


/* =========================================================
   空白提示
========================================================= */

.empty-note{
    position:relative;
    z-index:5;

    text-align:center;

    margin-top:15px;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:10px;

    letter-spacing:2px;

    color:rgba(133,177,207,.38);
}


/* =========================================================
   Footer
========================================================= */

.footer{
    position:relative;
    z-index:5;

    margin-top:auto;

    padding-top:50px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    color:rgba(133,177,207,.38);
}

========================================================= */

/* =========================================================
   平板
========================================================= */

@media (max-width:800px){

    .page{
        padding:24px 18px 30px;
    }

    .frame{
        padding:24px 24px 28px;
    }

    .hero{
        padding:60px 5px 42px;
    }

    .hero-main{

<script>

/* =========================================================
   日夜模式
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("seyami-theme");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day");

        themeToggle.textContent = "☾ 夜间";

    }else{

        document.body.classList.remove("day");

        themeToggle.textContent = "☼ 日间";

    }

}


/* 读取之前保存的模式 */

applyTheme(savedTheme === "day" ? "day" : "night");


/* 切换 */

themeToggle.addEventListener("click",function(){

    const isDay =
        document.body.classList.contains("day");

    const newTheme =
        isDay ? "night" : "day";

    localStorage.setItem(
        "seyami-theme",
        newTheme
    );

    applyTheme(newTheme);

});

</script>
