/* =========================
   页面背景
========================= */

.page{
    position:relative;
    min-height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%

        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;
}


/* =========================
   普通星点
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:-10%;
    background-image:
        radial-gradient(
            circle,
            rgba(182,220,255,.58) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(182,220,255,.32) 0 1px,
            transparent 1.5px
        );
    background-size:
        170px 170px,
        260px 260px;
    background-position:
        20px 30px,
        100px 130px;
    animation:starDrift 18s ease-in-out infinite alternate;
}

.stars::after{
    opacity:.55;
    background-size:
        230px 230px,
        310px 310px;
    animation-duration:26s;
}


@keyframes starDrift{

    0%{
        transform:translate3d(0,0,0);
        opacity:.82;
    }

    50%{
        transform:translate3d(-4px,2px,0);
        opacity:1;
    }

    100%{
        transform:translate3d(4px,-3px,0);
        opacity:.86;
    }

}

/* =========================
   浮动 ✦✶ 星点
========================= */

.arcane-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
}

.arcane-stars span{
    position:absolute;

    width:auto;

    color:rgba(158,207,247,.62);

    font-family:"Cinzel",serif;

    letter-spacing:0;

.arcane-stars span::before{

/* =========================
   主体
========================= */

.container{
    position:relative;
    z-index:5;

    width:min(1180px,92vw);
    min-height:100vh;

    margin:0 auto;

    padding:
        32px 0
        46px;

    display:flex;
    flex-direction:column;
}


/* =========================
   顶部
========================= */

.topbar{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    color:#d9edff;

    text-decoration:none;

    font-family:"Cinzel",serif;
    font-size:13px;
    letter-spacing:3px;
}

.logo-symbol{
    color:rgba(137,201,239,.9);
    font-size:14px;
}


.back{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:"Cinzel",serif;
    font-size:11px;
    letter-spacing:2px;

    transition:.3s ease;
}

.back:hover{
    color:#d9efff;
}


/* =========================
   日夜切换
========================= */

.theme-toggle{
    border:1px solid rgba(111,174,224,.32);

    background:rgba(8,28,49,.35);

    color:rgba(191,220,243,.68);

    width:42px;
    height:30px;

    border-radius:30px;

    cursor:pointer;

    font-size:14px;

    transition:
        background .4s ease,
        color .4s ease,
        border .4s ease;

    backdrop-filter:blur(6px);
}

.theme-toggle:hover{
    color:#d9efff;
    border-color:rgba(111,174,224,.6);
}


/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;

    left:50%;
    top:50%;

    width:700px;
    height:700px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid rgba(73,143,198,.28);

    border-radius:50%;

    pointer-events:none;

    opacity:.65;
}

.magic-circle::before{
    content:"";

    position:absolute;
    inset:48px;

    border:
        1px solid rgba(91,162,213,.22);

    border-radius:50%;
}

.magic-circle::after{
    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:rgba(126,188,229,.3);

    font-size:16px;
}


/* =========================
   书本区域
========================= */

.book{
    position:relative;

    width:100%;
    max-width:1080px;

    margin:72px auto 0;

    display:grid;
    grid-template-columns:1fr 1fr;

    perspective:1800px;
}


/* =========================
   书页
========================= */

.book-page{
    position:relative;

    min-height:620px;

    padding:62px 58px;

    border:1px solid rgba(111,174,224,.32);

    background:
        linear-gradient(
            145deg,
            rgba(13,39,65,.58),
            rgba(5,20,36,.72)
        );

    backdrop-filter:blur(5px);

    overflow:hidden;
}

.book-page:first-child{
    border-right:none;

    border-radius:
        8px 0 0 8px;
}

.book-page:last-child{
    border-radius:
        0 8px 8px 0;
}

.book-page::before{
    content:"";

    position:absolute;
    inset:14px;

    border:
        1px solid rgba(104,166,211,.16);

    pointer-events:none;
}

.book-page::after{
    content:"✦";

    position:absolute;

    right:22px;
    bottom:17px;

    color:rgba(120,185,227,.34);

    font-size:12px;
}


/* =========================
   页面标题
========================= */

.page-number{
    color:rgba(132,189,225,.52);

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    margin-bottom:18px;
}

.page-title{
    margin:0;

    font-family:"Cinzel",serif;

    font-weight:400;

    font-size:27px;

    letter-spacing:5px;

    color:#dceeff;
}

.page-title-cn{
    margin-top:9px;

    font-size:13px;

    letter-spacing:4px;

    color:rgba(177,207,230,.62);
}

.page-line{
    width:55px;
    height:1px;

    margin:
        26px 0
        34px;

    background:
        rgba(112,177,220,.38);
}


/* =========================
   国家资料
========================= */

.nation-name{
    font-family:"Cinzel",serif;

    font-size:22px;

    letter-spacing:4px;

    color:#dceeff;

    min-height:32px;
}

.nation-cn{
    font-size:13px;

    letter-spacing:3px;

    color:rgba(177,207,230,.62);

    margin-top:8px;

    min-height:22px;
}

.nation-description{
    margin-top:25px;

    min-height:95px;

    color:rgba(192,219,237,.66);

    font-size:13px;

    line-height:2;

    letter-spacing:1px;
}


/* =========================
   信息
========================= */

.info-grid{
    margin-top:32px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        24px 30px;
}

.info-item{
    min-height:50px;
}

.info-label{
    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(125,181,218,.55);

    margin-bottom:7px;
}

.info-value{
    color:rgba(215,234,248,.78);

    font-size:12px;

    letter-spacing:1px;

    min-height:18px;
}


/* =========================
   翻页按钮
========================= */

.book-controls{
    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:26px;

    margin-top:24px;
}

.book-btn{
    width:38px;
    height:38px;

    border:
        1px solid rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.38);

    color:
        rgba(191,220,243,.72);

    border-radius:50%;

    cursor:pointer;

    transition:.3s ease;

    font-size:14px;
}

.book-btn:hover{
    color:#e4f3ff;

    border-color:
        rgba(111,174,224,.65);

    background:
        rgba(15,46,73,.55);
}

.book-btn:disabled{
    opacity:.25;

    cursor:default;
}

.page-counter{
    min-width:80px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    color:
        rgba(145,193,221,.52);
}


/* =========================
   页脚
========================= */

.footer{
    margin-top:auto;

    padding-top:40px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(133,177,207,.38);
}


/* =========================
   日间模式
========================= */

body.day{
    background:#f4f9fd;

    color:#2e5069;
}

body.day .page{
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%

        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),

body.day .micro-stars span{

    box-shadow:
        0 0 5px rgba(103,166,207,.25);
}

    background:none;

    color:rgba(87,151,199,.50);

    box-shadow:none;

    text-shadow:
        0 0 7px rgba(87,151,199,.18);
}


body.day .logo{
    color:#2e526c;
}

body.day .logo-symbol{
    color:rgba(79,151,201,.84);
}

body.day .back{

}

body.day .back:hover{

}

body.day .theme-toggle{

}

body.day .magic-circle::after{

        rgba(79,148,196,.25);
}

body.day .book-page{
    border-color:
        rgba(91,145,184,.34);

    background:
        linear-gradient(
            145deg,
            rgba(242,249,253,.76),
            rgba(226,240,249,.68)
        );
}

body.day .book-page::before{
    border-color:
        rgba(91,145,184,.16);
}

body.day .book-page::after{
    color:
        rgba(79,148,196,.30);
}

body.day .page-number{
    color:
        rgba(72,132,171,.56);
}

body.day .page-title{
    color:#2b506a;
}

body.day .page-title-cn{
    color:
        rgba(45,82,106,.80);
}

body.day .page-line{
    background:
        rgba(82,151,198,.38);
}

body.day .nation-name{
    color:#2b506a;
}

body.day .nation-cn{
    color:
        rgba(45,82,106,.68);
}

body.day .nation-description{
    color:
        rgba(55,91,113,.70);
}

body.day .info-label{
    color:
        rgba(65,126,165,.62);
}

body.day .info-value{
    color:
        rgba(47,82,103,.78);
}

body.day .book-btn{
    border-color:
        rgba(91,145,184,.34);

    background:
        rgba(248,252,255,.65);

        rgba(61,98,125,.72);

    border-color:
        rgba(91,145,184,.62);

/* =========================
   手机端
========================= */

@media(max-width:760px){

    .container{
        width:90vw;
        padding-top:24px;
    }

    .back{
        display:none;
    }

    .book{
        display:block;

        margin-top:55px;
    }

    .book-page{
        min-height:590px;

        padding:
            52px 32px;
    }

    .book-page:first-child{
        display:none;
    }

    .book-page:last-child{
        border:
            1px solid rgba(111,174,224,.32);

        border-radius:8px;
    }

    .magic-circle{
        width:560px;
        height:560px;
    }

    .page-title{
        font-size:22px;
        letter-spacing:4px;
    }

    .nation-name{
        font-size:19px;
    }

    .info-grid{
        gap:
            20px 20px;
    }

}


/* =========================
   更小屏幕
========================= */

@media(max-width:430px){

    .container{
        width:92vw;
    }

    .book-page{
        padding:
            48px 25px;
    }

    .page-title{
        font-size:20px;
    }

    .page-title-cn{
        font-size:11px;
    }

    .nation-description{
        font-size:12px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .magic-circle{
        width:480px;
        height:480px;
    }

}

<script>

/* =========================
   国家资料
========================= */

const nations = [

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    }

];


/* =========================
   当前页面
========================= */

let currentPage = 0;


/* =========================
   显示国家资料
========================= */

function renderNation(){

    const nation =
        nations[currentPage];

    const nextNation =
        nations[currentPage + 1];


    /* 左页 */

    document.getElementById("nationNameLeft")
        .textContent =
        nation?.name || "";

    document.getElementById("nationCnLeft")
        .textContent =
        nation?.cn || "";

    document.getElementById("nationDescriptionLeft")
        .textContent =
        nation?.description || "";

    document.getElementById("capitalLeft")
        .textContent =
        nation?.capital || "";

    document.getElementById("regionLeft")
        .textContent =
        nation?.region || "";

    document.getElementById("raceLeft")
        .textContent =
        nation?.race || "";

    document.getElementById("terrainLeft")
        .textContent =
        nation?.terrain || "";


    /* 右页 */

    document.getElementById("nationNameRight")
        .textContent =
        nextNation?.name || "";

    document.getElementById("nationCnRight")
        .textContent =
        nextNation?.cn || "";

    document.getElementById("nationDescriptionRight")
        .textContent =
        nextNation?.description || "";

    document.getElementById("capitalRight")
        .textContent =
        nextNation?.capital || "";

    document.getElementById("regionRight")
        .textContent =
        nextNation?.region || "";

    document.getElementById("raceRight")
        .textContent =
        nextNation?.race || "";

    document.getElementById("terrainRight")
        .textContent =
        nextNation?.terrain || "";


    /* 页码 */

    document.getElementById("pageCounter")
        .textContent =
        String(currentPage + 1).padStart(2,"0")
        +
        " / "
        +
        String(nations.length).padStart(2,"0");


    /* 按钮 */

    document.getElementById("prevBtn")
        .disabled =
        currentPage === 0;

    document.getElementById("nextBtn")
        .disabled =
        currentPage >= nations.length - 1;

}


/* =========================
   上一页
========================= */

document.getElementById("prevBtn")
.addEventListener("click",()=>{

    if(currentPage > 0){

        currentPage--;

        renderNation();

    }

});


/* =========================
   下一页
========================= */

document.getElementById("nextBtn")
.addEventListener("click",()=>{

    if(currentPage < nations.length - 1){

        currentPage++;

        renderNation();

    }

});


/* =========================
   日夜模式
========================= */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("seyami-theme");


if(savedTheme === "day"){

    document.body.classList.add("day");

    themeToggle.textContent = "☾";

}else{

    themeToggle.textContent = "☼";

}


themeToggle.addEventListener("click",()=>{

    document.body.classList.toggle("day");

    const isDay =
        document.body.classList.contains("day");


    themeToggle.textContent =
        isDay ? "☾" : "☼";


    localStorage.setItem(
        "seyami-theme",
        isDay ? "day" : "night"
    );

});


/* =========================
   初始化
========================= */

renderNation();

</script>
