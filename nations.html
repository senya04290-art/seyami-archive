/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Serif SC",
        "Times New Roman",
        serif;

    background:#061426;
    color:#dcecff;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================
   页面背景
========================= */

.page{
    position:relative;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18) 0%,
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45) 0%,
            transparent 70%
        ),
        #061426;

    overflow:hidden;

    transition:background .5s ease;
}


/* =========================
   星点背景
========================= */

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(182,220,255,.78) 1px,
            transparent 1.5px
        );

    background-size:
        120px 120px;

    background-position:
        20px 10px;

    opacity:.28;

    pointer-events:none;

    animation:
        starDrift 28s ease-in-out infinite alternate;
}

@keyframes starDrift{

    0%{
        transform:
            translate3d(0,0,0);

        opacity:.23;
    }

    50%{
        transform:
            translate3d(-4px,3px,0);

        opacity:.32;
    }

    100%{
        transform:
            translate3d(4px,-3px,0);

        opacity:.25;
    }
}


/* =========================
   微小星星
========================= */

.micro-stars{
    position:absolute;
    inset:0;

    pointer-events:none;
}

.micro-stars span{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:
        rgba(182,220,255,.8);

    box-shadow:
        0 0 5px
        rgba(182,220,255,.55);

    animation:
        microTwinkle
        4s ease-in-out infinite;
}

@keyframes microTwinkle{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:.9;
        transform:scale(1.4);
    }
}

    left:8%;
    top:18%;
    animation-delay:.3s;
}

/* =========================
   装饰星芒
========================= */

.arcane-stars{
    position:absolute;
    inset:0;

    pointer-events:none;
}

.arcane-stars span{
    position:absolute;

    width:4px;
    height:4px;

    background:
        rgba(158,207,247,.62);

    transform:
        rotate(45deg);

    box-shadow:
        0 0 9px
        rgba(158,207,247,.35);

    animation:
        arcaneTwinkle
        5s ease-in-out infinite;
}

.arcane-stars span::before,
.arcane-stars span::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(158,207,247,.45);
}

.arcane-stars span::before{
    width:14px;
    height:1px;
}

.arcane-stars span::after{
    width:1px;
    height:14px;
}

@keyframes arcaneTwinkle{

    0%,
    100%{
        opacity:.25;
        transform:
            rotate(45deg)
            scale(.75);
    }

    50%{
        opacity:.8;
        transform:
            rotate(45deg)
            scale(1);
    }
}

/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;

    left:50%;
    top:50%;

    width:720px;
    height:720px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(73,143,198,.28);

    border-radius:50%;

    pointer-events:none;

    opacity:.65;
}

.magic-circle::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:590px;
    height:590px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(91,162,213,.22);

    border-radius:50%;
}

.magic-circle::after{
    content:"✦✶";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-family:
        "Cinzel",
        serif;

    font-size:24px;

    letter-spacing:14px;

    color:
        rgba(111,174,224,.32);
}


/* =========================
   外框
========================= */

.frame{
    position:relative;

    width:
        calc(100% - 48px);

    max-width:1380px;

    min-height:
        calc(100vh - 48px);

    margin:24px auto;

    border:
        1px solid
        rgba(111,174,224,.32);

    padding:34px 42px 28px;

    z-index:2;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:22px;
    height:22px;

    border-color:
        rgba(108,178,230,.88);

    border-style:solid;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-width:
        1px 0 0 1px;
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-width:
        0 1px 1px 0;
}


/* =========================
   顶部
========================= */

.header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    position:relative;

    z-index:5;
}

.logo{
    font-family:
        "Cinzel",
        serif;

    font-size:14px;

    letter-spacing:4px;

    color:#d9edff;
}

.logo-symbol{
    color:
        rgba(137,201,239,.9);

    margin-right:8px;
}


/* =========================
   返回 + 模式
========================= */

.header-right{
    display:flex;

    align-items:center;

    gap:22px;
}

.back{
    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        serif;

    font-size:11px;

    letter-spacing:2px;

    transition:
        color .3s ease;
}

.back:hover{
    color:#d9efff;
}

.theme-toggle{
    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    width:36px;
    height:36px;

    border-radius:50%;

    cursor:pointer;

    font-size:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        all .3s ease;
}

.theme-toggle:hover{
    border-color:
        rgba(137,201,239,.7);

    color:#d9efff;
}


/* =========================
   标题
========================= */

.title-area{
    text-align:center;

    margin-top:55px;

    position:relative;

    z-index:3;
}

.title-main{
    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(34px,5vw,66px);

    font-weight:400;

    letter-spacing:8px;

    color:#dceeff;

    line-height:1.1;
}

.title-sub{
    font-family:
        "Cinzel",
        serif;

    margin-top:10px;

    font-size:
        clamp(16px,2vw,25px);

    letter-spacing:10px;

    color:#dceeff;
}

.title-cn{
    margin-top:15px;

    font-size:13px;

    letter-spacing:7px;

    color:
        rgba(177,207,230,.62);
}


/* =========================
   书本
========================= */

.book-wrap{
    width:100%;

    max-width:1120px;

    margin:
        58px auto 0;

    position:relative;

    z-index:3;
}

.book{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    min-height:500px;

    position:relative;

    perspective:1800px;
}


/* =========================
   页面
========================= */

.page-panel{
    position:relative;

    padding:50px 55px;

    min-height:500px;

    border:
        1px solid
        rgba(111,174,224,.24);

    background:
        linear-gradient(
            135deg,
            rgba(10,31,52,.78),
            rgba(6,20,38,.9)
        );

    overflow:hidden;
}

.page-panel.left{
    border-right:
        1px solid
        rgba(111,174,224,.18);

    box-shadow:
        inset -12px 0 25px
        rgba(0,0,0,.12);
}

.page-panel.right{
    border-left:
        1px solid
        rgba(111,174,224,.18);

    box-shadow:
        inset 12px 0 25px
        rgba(0,0,0,.12);
}

.page-panel::before{
    content:"";

    position:absolute;

    inset:14px;

    border:
        1px solid
        rgba(111,174,224,.10);

    pointer-events:none;
}


/* =========================
   国家页面内容
========================= */

.page-number{
    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(133,177,207,.38);

    margin-bottom:34px;
}

.nation-name{
    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(28px,3.4vw,46px);

    font-weight:400;

    letter-spacing:5px;

    color:#dceeff;

    line-height:1.2;
}

.nation-cn{
    margin-top:9px;

    font-size:14px;

    letter-spacing:5px;

    color:
        rgba(177,207,230,.62);
}

.decor-line{
    width:80px;
    height:1px;

    margin:
        28px 0 34px;

    background:
        rgba(108,178,230,.48);
}

.info-list{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        24px 28px;

    margin-top:20px;
}

.info-item{
    min-width:0;
}

.info-label{
    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:2px;

    color:
        rgba(133,177,207,.55);

    margin-bottom:7px;
}

.info-value{
    font-size:13px;

    min-height:18px;

    color:
        rgba(220,236,255,.78);

    letter-spacing:1px;
}


/* =========================
   简介
========================= */

.profile-title{
    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(133,177,207,.55);

    margin-bottom:18px;
}

.profile{
    font-size:13px;

    line-height:2.1;

    letter-spacing:1px;

    color:
        rgba(220,236,255,.68);

    min-height:180px;
}


/* =========================
   翻页
========================= */

.flip-next .page-panel.right{
    animation:
        pageFlipNext
        .65s ease;
}

.flip-prev .page-panel.left{
    animation:
        pageFlipPrev
        .65s ease;
}

@keyframes pageFlipNext{

    0%{
        transform:
            rotateY(0deg);

        opacity:1;
    }

    50%{
        transform:
            rotateY(-90deg);

        opacity:.35;
    }

    100%{
        transform:
            rotateY(0deg);

        opacity:1;
    }
}

@keyframes pageFlipPrev{

    0%{
        transform:
            rotateY(0deg);

        opacity:1;
    }

    50%{
        transform:
            rotateY(90deg);

        opacity:.35;
    }

    100%{
        transform:
            rotateY(0deg);

        opacity:1;
    }
}


/* =========================
   翻页按钮
========================= */

.book-controls{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:25px;

    margin-top:28px;
}

.book-btn{
    border:
        1px solid
        rgba(111,174,224,.28);

    background:
        rgba(8,28,49,.3);

    color:
        rgba(191,220,243,.68);

    padding:
        10px 22px;

    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:
        all .3s ease;
}

.book-btn:hover{
    color:#d9efff;

    border-color:
        rgba(137,201,239,.68);

    background:
        rgba(16,46,72,.42);
}

.book-count{
    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(133,177,207,.45);
}


/* =========================
   页脚
========================= */

.footer{
    text-align:center;

    margin-top:45px;

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:4px;

    color:
        rgba(133,177,207,.38);

    position:relative;

    z-index:3;
}

<script>

/* =========================
   国家资料
========================= */

const nations = [

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        profile:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        profile:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        profile:""
    }

];


/* =========================
   当前页面
========================= */

let currentPage = 0;


/* =========================
   DOM
========================= */

const leftName =
    document.getElementById("leftName");

const leftCn =
    document.getElementById("leftCn");

const leftCapital =
    document.getElementById("leftCapital");

const leftRegion =
    document.getElementById("leftRegion");

const leftRace =
    document.getElementById("leftRace");

const leftTerrain =
    document.getElementById("leftTerrain");

const leftNumber =
    document.getElementById("leftNumber");


const rightName =
    document.getElementById("rightName");

const rightCn =
    document.getElementById("rightCn");

const rightCapital =
    document.getElementById("rightCapital");

const rightRegion =
    document.getElementById("rightRegion");

const rightRace =
    document.getElementById("rightRace");

const rightTerrain =
    document.getElementById("rightTerrain");

const rightProfile =
    document.getElementById("rightProfile");

const rightNumber =
    document.getElementById("rightNumber");


const book =
    document.getElementById("book");

const bookCount =
    document.getElementById("bookCount");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");


/* =========================
   显示国家
========================= */

function renderNation(
    nation,
    side,
    number
){

    if(!nation){
        return;
    }

    if(side === "left"){

        leftName.textContent =
            nation.name;

        leftCn.textContent =
            nation.cn;

        leftCapital.textContent =
            nation.capital;

        leftRegion.textContent =
            nation.region;

        leftRace.textContent =
            nation.race;

        leftTerrain.textContent =
            nation.terrain;

        leftNumber.textContent =
            "NATION " +
            String(number).padStart(2,"0");

    }else{

        rightName.textContent =
            nation.name;

        rightCn.textContent =
            nation.cn;

        rightCapital.textContent =
            nation.capital;

        rightRegion.textContent =
            nation.region;

        rightRace.textContent =
            nation.race;

        rightTerrain.textContent =
            nation.terrain;

        rightProfile.textContent =
            nation.profile;

        rightNumber.textContent =
            "NATION " +
            String(number).padStart(2,"0");

    }

}


/* =========================
   渲染页面
========================= */

function renderPages(){

    const left =
        nations[currentPage];

    const right =
        nations[currentPage + 1];

    renderNation(
        left,
        "left",
        currentPage + 1
    );

    renderNation(
        right,
        "right",
        currentPage + 2
    );

    bookCount.textContent =
        String(currentPage + 1).padStart(2,"0")
        +
        " — "
        +
        String(
            Math.min(
                currentPage + 2,
                nations.length
            )
        ).padStart(2,"0");

    prevBtn.disabled =
        currentPage <= 0;

    nextBtn.disabled =
        currentPage + 2 >= nations.length;

}


/* =========================
   下一页
========================= */

nextBtn.addEventListener(
    "click",
    function(){

        if(
            currentPage + 2 >=
            nations.length
        ){
            return;
        }

        book.classList.remove(
            "flip-prev"
        );

        book.classList.add(
            "flip-next"
        );

        setTimeout(
            function(){

                currentPage += 2;

                renderPages();

                book.classList.remove(
                    "flip-next"
                );

            },
            320
        );

    }
);


/* =========================
   上一页
========================= */

prevBtn.addEventListener(
    "click",
    function(){

        if(currentPage <= 0){
            return;
        }

        book.classList.remove(
            "flip-next"
        );

        book.classList.add(
            "flip-prev"
        );

        setTimeout(
            function(){

                currentPage -= 2;

                renderPages();

                book.classList.remove(
                    "flip-prev"
                );

            },
            320
        );

    }
);


/* =========================
   日夜模式
========================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


function setTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

        themeToggle.textContent =
            "☀";

    }else{

        document.body.classList.remove(
            "day"
        );

        themeToggle.textContent =
            "☾";

    }

    localStorage.setItem(
        "seyami-theme",
        theme
    );

}


/* =========================
   读取主题
========================= */

const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );

if(savedTheme){

    setTheme(savedTheme);

}else{

    setTheme("night");

}


/* =========================
   切换主题
========================= */

themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day"
            );

        setTheme(
            isDay
                ? "night"
                : "day"
        );

    }
);


/* =========================
   初始化
========================= */

renderPages();

</script>
