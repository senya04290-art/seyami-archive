<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 国家档案</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;

    background:#061426;
    color:#dcecff;

    font-family:"Noto Serif SC",serif;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================================================
   页面
========================================================= */

.page{
    position:relative;

    min-height:100vh;

    padding:34px 28px 42px;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;

    overflow:hidden;

    transition:background .5s ease;
}


/* =========================================================
   星星
========================================================= */

.stars,
.stars::before,
.stars::after{
    position:absolute;
    content:"";
    pointer-events:none;
}

.stars{
    inset:0;
    z-index:0;
}

.stars::before{
    width:2px;
    height:2px;

    background:rgba(182,220,255,.55);

    box-shadow:
        5vw 8vh rgba(182,220,255,.55),
        13vw 18vh rgba(182,220,255,.40),
        22vw 7vh rgba(182,220,255,.55),
        31vw 14vh rgba(182,220,255,.32),
        41vw 5vh rgba(182,220,255,.50),
        52vw 12vh rgba(182,220,255,.38),
        63vw 7vh rgba(182,220,255,.48),
        74vw 16vh rgba(182,220,255,.32),
        86vw 8vh rgba(182,220,255,.52),
        94vw 20vh rgba(182,220,255,.38),

        8vw 31vh rgba(182,220,255,.34),
        18vw 39vh rgba(182,220,255,.48),
        29vw 27vh rgba(182,220,255,.32),
        39vw 34vh rgba(182,220,255,.44),
        49vw 26vh rgba(182,220,255,.36),
        61vw 38vh rgba(182,220,255,.46),
        72vw 29vh rgba(182,220,255,.34),
        83vw 36vh rgba(182,220,255,.50),
        92vw 28vh rgba(182,220,255,.36),

        4vw 55vh rgba(182,220,255,.46),
        15vw 63vh rgba(182,220,255,.34),
        25vw 52vh rgba(182,220,255,.52),
        36vw 61vh rgba(182,220,255,.32),
        47vw 54vh rgba(182,220,255,.44),
        58vw 67vh rgba(182,220,255,.38),
        69vw 55vh rgba(182,220,255,.50),
        80vw 64vh rgba(182,220,255,.34),
        91vw 53vh rgba(182,220,255,.46),

        9vw 81vh rgba(182,220,255,.34),
        20vw 91vh rgba(182,220,255,.48),
        33vw 82vh rgba(182,220,255,.36),
        45vw 94vh rgba(182,220,255,.42),
        57vw 84vh rgba(182,220,255,.32),
        68vw 92vh rgba(182,220,255,.48),
        79vw 82vh rgba(182,220,255,.36),
        89vw 90vh rgba(182,220,255,.44);
}

.stars::after{
    width:1px;
    height:1px;

    background:rgba(182,220,255,.38);

    box-shadow:
        2vw 14vh rgba(182,220,255,.35),
        17vw 5vh rgba(182,220,255,.28),
        27vw 20vh rgba(182,220,255,.35),
        37vw 8vh rgba(182,220,255,.28),
        47vw 18vh rgba(182,220,255,.35),
        58vw 5vh rgba(182,220,255,.28),
        69vw 22vh rgba(182,220,255,.35),
        79vw 9vh rgba(182,220,255,.28),
        90vw 15vh rgba(182,220,255,.35),

        11vw 45vh rgba(182,220,255,.28),
        22vw 34vh rgba(182,220,255,.35),
        34vw 47vh rgba(182,220,255,.28),
        44vw 39vh rgba(182,220,255,.35),
        55vw 47vh rgba(182,220,255,.28),
        66vw 42vh rgba(182,220,255,.35),
        77vw 48vh rgba(182,220,255,.28),
        88vw 40vh rgba(182,220,255,.35),

        6vw 72vh rgba(182,220,255,.35),
        17vw 78vh rgba(182,220,255,.28),
        29vw 70vh rgba(182,220,255,.35),
        41vw 77vh rgba(182,220,255,.28),
        53vw 72vh rgba(182,220,255,.35),
        64vw 79vh rgba(182,220,255,.28),
        76vw 71vh rgba(182,220,255,.35),
        87vw 78vh rgba(182,220,255,.28);
}


/* =========================================================
   微星
========================================================= */

.micro-stars{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.micro-stars span{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:rgba(158,207,247,.62);

    opacity:.45;

    animation:microTwinkle 5s ease-in-out infinite;
}

.micro-stars span:nth-child(1){left:9%;top:12%;animation-delay:0s;}
.micro-stars span:nth-child(2){left:18%;top:25%;animation-delay:1s;}
.micro-stars span:nth-child(3){left:28%;top:11%;animation-delay:2s;}
.micro-stars span:nth-child(4){left:37%;top:21%;animation-delay:3s;}
.micro-stars span:nth-child(5){left:48%;top:9%;animation-delay:1.5s;}
.micro-stars span:nth-child(6){left:58%;top:27%;animation-delay:2.5s;}
.micro-stars span:nth-child(7){left:69%;top:14%;animation-delay:4s;}
.micro-stars span:nth-child(8){left:78%;top:24%;animation-delay:.5s;}
.micro-stars span:nth-child(9){left:88%;top:11%;animation-delay:3.5s;}
.micro-stars span:nth-child(10){left:94%;top:31%;animation-delay:1.2s;}

.micro-stars span:nth-child(11){left:7%;top:48%;animation-delay:2.2s;}
.micro-stars span:nth-child(12){left:20%;top:58%;animation-delay:4.2s;}
.micro-stars span:nth-child(13){left:31%;top:46%;animation-delay:1.8s;}
.micro-stars span:nth-child(14){left:44%;top:57%;animation-delay:.8s;}
.micro-stars span:nth-child(15){left:56%;top:48%;animation-delay:3.2s;}
.micro-stars span:nth-child(16){left:68%;top:59%;animation-delay:1.4s;}
.micro-stars span:nth-child(17){left:80%;top:47%;animation-delay:2.8s;}
.micro-stars span:nth-child(18){left:91%;top:57%;animation-delay:4.5s;}
.micro-stars span:nth-child(19){left:13%;top:84%;animation-delay:3.8s;}

@keyframes microTwinkle{

    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }

    50%{
        opacity:.9;
        transform:scale(1.5);
    }

}


/* =========================================================
   魔法星
========================================================= */

.arcane-stars{
    position:absolute;
    inset:0;

    z-index:1;

    pointer-events:none;
}

.arcane-stars span{
    position:absolute;

    width:auto;
    height:auto;

    background:none;

    transform:none;

    opacity:.52;

    color:rgba(158,207,247,.62);

    font-family:"Cinzel",serif;

    font-size:10px;

    line-height:1;

    letter-spacing:0;

    text-shadow:
        0 0 7px rgba(113,177,220,.28);

    animation:arcaneTwinkle 6s ease-in-out infinite;
}


/* =========================================================
   ✦ ✶ 浮动魔法星
   奇数 = ✦
   偶数 = ✶
========================================================= */

.arcane-stars span:nth-child(odd)::before{
    content:"✦";
}

.arcane-stars span:nth-child(even)::before{
    content:"✶";
}


@keyframes arcaneTwinkle{

    0%,100%{
        opacity:.38;
        transform:scale(.85);
    }

    50%{
        opacity:.72;
        transform:scale(1.15);
    }

}

.star-a{left:7%;top:19%;}
.star-b{left:15%;top:8%;}
.star-c{left:24%;top:31%;}
.star-d{left:34%;top:12%;}
.star-e{left:43%;top:24%;}
.star-f{left:54%;top:10%;}
.star-g{left:64%;top:31%;}
.star-h{left:74%;top:17%;}
.star-i{left:84%;top:28%;}
.star-j{left:93%;top:13%;}

.star-k{left:5%;top:67%;}
.star-l{left:16%;top:77%;}
.star-m{left:27%;top:64%;}
.star-n{left:38%;top:75%;}
.star-o{left:49%;top:67%;}
.star-p{left:61%;top:78%;}
.star-q{left:72%;top:65%;}
.star-r{left:83%;top:76%;}
.star-s{left:94%;top:68%;}
.star-t{left:57%;top:90%;}

.extra-u{left:12%;top:42%;}
.extra-v{left:30%;top:54%;}
.extra-w{left:46%;top:42%;}
.extra-x{left:66%;top:49%;}
.extra-y{left:86%;top:44%;}
.extra-z{left:97%;top:55%;}


/* =========================================================
   魔法阵
   PC端改为「档案目录」星环
========================================================= */

.magic-circle{
    position:absolute;

    width:510px;
    height:510px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%) rotate(-8deg);

    border-radius:50%;

    opacity:.5;

    filter:
        drop-shadow(
            0 0 14px
            rgba(45,120,215,.38)
        );

    pointer-events:none;

    z-index:1;
}

.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:182px;

    border:1px solid rgba(99,174,248,.45);

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    clip-path:polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );

    pointer-events:none;
}

.magic-circle::after{
    transform:
        translate(-50%,-50%)
        rotate(90deg);

    opacity:.65;
}


/* =========================================================
   外框
========================================================= */

.frame{
    position:relative;

    z-index:5;

    max-width:1280px;

    min-height:calc(100vh - 76px);

    margin:0 auto;

    border:1px solid rgba(111,174,224,.32);

    padding:28px 34px 32px;

    display:flex;
    flex-direction:column;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:42px;
    height:42px;

    pointer-events:none;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-left:1px solid rgba(108,178,230,.88);
    border-top:1px solid rgba(108,178,230,.88);
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-right:1px solid rgba(108,178,230,.88);
    border-bottom:1px solid rgba(108,178,230,.88);
}


/* =========================================================
   Header
========================================================= */

.header{
    position:relative;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;

    min-height:44px;
}

.logo{
    display:flex;

    align-items:center;

    gap:10px;

    color:#d9edff;

    font-family:"Cinzel",serif;

    font-size:14px;

    letter-spacing:3px;

    white-space:nowrap;
}

.logo-symbol{
    color:rgba(137,201,239,.9);

    font-size:13px;
}

/* 与前面页面一致的两行 Logo */

.logo > span:last-child{
    display:flex;
    flex-direction:column;
    justify-content:center;
    line-height:1.15;
}

.logo-cn{
    font-family:"Noto Serif SC",serif;

    font-size:12px;

    font-weight:400;

    letter-spacing:2px;

    color:inherit;
}

.logo-en{
    margin-top:3px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:2.5px;

    color:rgba(191,220,243,.55);
}

.header-right{
    display:flex;

    align-items:center;

    gap:18px;
}

.back{
    text-decoration:none;

    color:rgba(191,220,243,.68);

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:11px;

    letter-spacing:1.8px;

    transition:color .3s ease;
}

.back:hover{
    color:#d9efff;
}


/* =========================================================
   日夜按钮
========================================================= */

.theme-toggle{
    border:1px solid rgba(111,174,224,.32);

    background:rgba(8,28,49,.35);

    color:rgba(191,220,243,.68);

    padding:7px 11px;

    font-family:"Noto Serif SC",serif;

    font-size:11px;

    letter-spacing:1px;

    cursor:pointer;

    transition:
        color .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.theme-toggle:hover{
    color:#d9efff;

    border-color:rgba(111,174,224,.58);
}


/* =========================================================
   标题
========================================================= */

.hero{
    position:relative;

    z-index:5;

    text-align:center;

    padding:55px 10px 30px;
}

.hero-main{
    font-family:"Cinzel",serif;

    font-size:clamp(30px,5vw,56px);

    font-weight:400;

    letter-spacing:8px;

    line-height:1.15;

    color:#dceeff;

    text-shadow:
        0 0 18px rgba(106,172,220,.08);
}

.hero-sub{
    margin-top:15px;

    font-family:"Cinzel",serif;

    font-size:13px;

    letter-spacing:5px;

    color:rgba(177,207,230,.62);
}

.hero-cn{
    margin-top:9px;

    font-size:13px;

    letter-spacing:4px;

    color:rgba(177,207,230,.62);
}


/* =========================================================
   书本区域
========================================================= */

.book-area{
    position:relative;

    z-index:6;

    width:100%;

    max-width:1040px;

    margin:0 auto;

    padding:12px 0 0;
}


/* =========================================================
   书本
========================================================= */

.book{
    position:relative;

    width:100%;

    height:520px;

    display:grid;

    grid-template-columns:1fr 1fr;

    perspective:1800px;
}


/* 中间书脊 */

.book::before{
    content:"";

    position:absolute;

    left:50%;
    top:8px;
    bottom:8px;

    width:1px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(111,174,224,.38) 10%,
            rgba(111,174,224,.38) 90%,
            transparent
        );

    z-index:20;

    pointer-events:none;
}


/* =========================================================
   页面
========================================================= */

.book-page{
    position:relative;

    height:100%;

    overflow:hidden;

    border:1px solid rgba(111,174,224,.28);

    background:
        linear-gradient(
            135deg,
            rgba(12,38,62,.76),
            rgba(7,25,44,.82)
        );

    box-shadow:
        inset 0 0 45px rgba(65,132,178,.05);

    backface-visibility:hidden;

    transition:
        background .5s ease,
        border-color .5s ease;
}


/* 左页 */

.left-page{
    border-right:none;

    padding:48px 55px 45px 58px;

    border-radius:4px 0 0 4px;
}


/* 右页 */

.right-page{
    border-left:none;

    padding:48px 58px 45px 55px;

    border-radius:0 4px 4px 0;
}


/* =========================================================
   页面装饰
========================================================= */

.book-page::before{
    content:"";

    position:absolute;

    inset:15px;

    border:1px solid rgba(111,174,224,.10);

    pointer-events:none;
}

.book-page::after{
    content:"✦";

    position:absolute;

    bottom:18px;

    font-family:"Cinzel",serif;

    font-size:10px;

    color:rgba(137,201,239,.28);

    pointer-events:none;
}

.left-page::after{
    left:24px;
}

.right-page::after{
    right:24px;
}


/* =========================================================
   页面编号
========================================================= */

.page-index{
    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    color:rgba(137,190,220,.50);

    margin-bottom:27px;
}


/* =========================================================
   国家标题
========================================================= */

.country-title{
    font-family:"Cinzel",serif;

    font-size:30px;

    font-weight:400;

    letter-spacing:5px;

    color:#dceeff;

    min-height:40px;
}

.country-cn{
    margin-top:8px;

    font-size:13px;

    letter-spacing:3px;

    color:rgba(177,207,230,.65);

    min-height:22px;
}


/* =========================================================
   装饰线
========================================================= */

.page-line{
    width:90px;

    height:1px;

    margin:24px 0 28px;

    background:
        linear-gradient(
            90deg,
            rgba(111,174,224,.50),
            transparent
        );
}

.right-page .page-line{
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(111,174,224,.50)
        );
}


/* =========================================================
   国家信息
========================================================= */

.country-info{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:23px 28px;
}

.info-item{
    min-width:0;
}

.info-label{
    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(137,190,220,.52);

    margin-bottom:8px;
}

.info-value{
    min-height:20px;

    font-size:11px;

    line-height:1.8;

    letter-spacing:1px;

    color:rgba(205,228,244,.52);
}


/* =========================================================
   页面正文
========================================================= */

.page-heading{
    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    color:rgba(137,190,220,.55);

    margin-bottom:15px;
}

.page-text{
    min-height:160px;

    font-size:11px;

    line-height:2.15;

    letter-spacing:1px;

    color:rgba(191,220,243,.48);
}


/* =========================================================
   翻页动画
========================================================= */

.book-page.flip-next{
    animation:flipNext .72s ease-in-out;
}

.book-page.flip-prev{
    animation:flipPrev .72s ease-in-out;
}

@keyframes flipNext{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    45%{
        transform:rotateY(-88deg);
        opacity:.65;
    }

    100%{
        transform:rotateY(0deg);
        opacity:1;
    }

}

@keyframes flipPrev{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    45%{
        transform:rotateY(88deg);
        opacity:.65;
    }

    100%{
        transform:rotateY(0deg);
        opacity:1;
    }

}


/* =========================================================
   翻页控制
========================================================= */

.book-controls{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:28px;

    margin-top:25px;
}

.page-button{
    border:none;

    background:transparent;

    color:rgba(191,220,243,.62);

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    padding:8px 10px;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.page-button:hover:not(:disabled){
    color:#d9efff;
}

.page-button:disabled{
    opacity:.20;

    cursor:default;
}

.page-count{
    min-width:70px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    color:rgba(137,190,220,.48);
}


/* =========================================================
   提示
========================================================= */

.archive-note{
    text-align:center;

    margin-top:17px;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(133,177,207,.34);
}


/* =========================================================
   Footer
========================================================= */

.footer{
    position:relative;

    z-index:5;

    margin-top:auto;

    padding-top:38px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    color:rgba(133,177,207,.38);
}


/* =========================================================
   日间模式
========================================================= */

body.day{
    background:#f4f9fd;

    color:#2e5069;
}

body.day .page{
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),
        #f4f9fd;
}


/* 星星 */

body.day .stars::before{
    background:rgba(103,166,207,.42);

    box-shadow:
        5vw 8vh rgba(103,166,207,.42),
        13vw 18vh rgba(103,166,207,.30),
        22vw 7vh rgba(103,166,207,.42),
        31vw 14vh rgba(103,166,207,.25),
        41vw 5vh rgba(103,166,207,.38),
        52vw 12vh rgba(103,166,207,.28),
        63vw 7vh rgba(103,166,207,.38),
        74vw 16vh rgba(103,166,207,.25),
        86vw 8vh rgba(103,166,207,.40),
        94vw 20vh rgba(103,166,207,.28);
}

body.day .stars::after{
    background:rgba(103,166,207,.30);
}


/* 微星 */

body.day .micro-stars span{
    background:rgba(87,151,199,.50);
}


/* 魔法星 */

body.day .arcane-stars span{
    background:none;

    color:rgba(87,151,199,.50);

    box-shadow:none;

    text-shadow:
        0 0 7px rgba(87,151,199,.18);
}


/* 魔法阵 */

body.day .magic-circle{
    border-color:rgba(99,174,248,.45);

    filter:
        drop-shadow(
            0 0 10px
            rgba(45,120,215,.20)
        );
}

<script>

/* =========================================================
   国家资料
   =========================================================
   以后只需要修改这里。

   name  = 英文国家名
   cn    = 中文国家名
   capital = 首都
   region  = 地理位置
   race    = 主要种族
   terrain = 地形
   description = 国家介绍

   目前全部留空，不预设你的世界观。
========================================================= */

const nations = [

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    },

    {
        name:"",
        cn:"",
        capital:"",
        region:"",
        race:"",
        terrain:"",
        description:""
    }

];


/* =========================================================
   当前页
========================================================= */

let currentPage = 0;

const totalPages = nations.length;


/* =========================================================
   获取元素
========================================================= */

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const leftTitle =
    document.getElementById("leftTitle");

const leftCn =
    document.getElementById("leftCn");

const leftInfo =
    document.getElementById("leftInfo");

const rightTitle =
    document.getElementById("rightTitle");

const rightCn =
    document.getElementById("rightCn");

const rightDescription =
    document.getElementById("rightDescription");

const rightInfo =
    document.getElementById("rightInfo");

const pageCount =
    document.getElementById("pageCount");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");


/* =========================================================
   更新单个页面
========================================================= */

function setPage(
    side,
    nation
){

    const title =
        side === "left"
        ? leftTitle
        : rightTitle;

    const cn =
        side === "left"
        ? leftCn
        : rightCn;

    const info =
        side === "left"
        ? leftInfo
        : rightInfo;


    title.textContent =
        nation.name || "—";

    cn.textContent =
        nation.cn || "—";


    const values = [
        nation.capital,
        nation.region,
        nation.race,
        nation.terrain
    ];


    const valueElements =
        info.querySelectorAll(".info-value");


    valueElements.forEach(
        (element,index)=>{

            element.textContent =
                values[index] || "—";

        }
    );


    if(side === "right"){

        rightDescription.textContent =
            nation.description || "—";

    }

}


/* =========================================================
   手机 / 桌面页面更新
========================================================= */

function render(){

    /*
       桌面：
       左右两页显示相邻国家。

       手机：
       只显示右页。
    */

    const leftNation =
        nations[currentPage] || nations[0];

    const rightNation =
        nations[currentPage + 1] ||
        nations[currentPage] ||
        nations[0];


    setPage(
        "left",
        leftNation
    );

    setPage(
        "right",
        rightNation
    );


    pageCount.textContent =
        String(currentPage + 1).padStart(2,"0")
        + " / "
        + String(totalPages).padStart(2,"0");


    prevButton.disabled =
        currentPage <= 0;

    nextButton.disabled =
        currentPage >= totalPages - 1;

}


/* =========================================================
   翻页动画
========================================================= */

function animatePage(direction){

    const animationClass =
        direction === "next"
        ? "flip-next"
        : "flip-prev";


    leftPage.classList.remove(
        "flip-next",
        "flip-prev"
    );

    rightPage.classList.remove(
        "flip-next",
        "flip-prev"
    );


    void leftPage.offsetWidth;
    void rightPage.offsetWidth;


    leftPage.classList.add(
        animationClass
    );

    rightPage.classList.add(
        animationClass
    );


    setTimeout(
        ()=>{

            leftPage.classList.remove(
                animationClass
            );

            rightPage.classList.remove(
                animationClass
            );

        },
        720
    );

}


/* =========================================================
   下一页
========================================================= */

nextButton.addEventListener(
    "click",
    function(){

        if(currentPage >= totalPages - 1){
            return;
        }


        animatePage("next");


        currentPage++;


        setTimeout(
            render,
            180
        );

    }
);


/* =========================================================
   上一页
========================================================= */

prevButton.addEventListener(
    "click",
    function(){

        if(currentPage <= 0){
            return;
        }


        animatePage("prev");


        currentPage--;


        setTimeout(
            render,
            180
        );

    }
);


/* =========================================================
   日夜模式
========================================================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

        themeToggle.textContent =
            "☾ 夜间";

    }else{

        document.body.classList.remove(
            "day"
        );

        themeToggle.textContent =
            "☼ 日间";

    }

}


/* 读取保存的模式 */

applyTheme(
    savedTheme === "day"
    ? "day"
    : "night"
);


/* 点击切换 */

themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day"
            );


        const newTheme =
            isDay
            ? "night"
            : "day";


        localStorage.setItem(
            "seyami-theme",
            newTheme
        );


        applyTheme(
            newTheme
        );

    }
);


/* =========================================================
   初始化
========================================================= */

render();

</script>
