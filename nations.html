
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061426">
<title>塞垭弥大陆档案馆 · 国家档案</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #061426;
  --text: #dcecff;
  --muted: #91a9c8;
  --line: rgba(153,190,235,.28);
  --gold: #d9c49a;
  --panel: rgba(9,25,45,.88);
  --panel-soft: rgba(15,36,61,.76);
  --shadow: rgba(0,0,0,.3);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: clip;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 5%, rgba(47,85,139,.2), transparent 45%),
    radial-gradient(ellipse at 8% 65%, rgba(85,65,139,.1), transparent 38%),
    var(--bg);
  font-family: "Noto Serif SC", serif;
  transition: background .25s, color .25s;
}

body.day-mode {
  color-scheme: light;
  --bg: #e8eef6;
  --text: #203650;
  --muted: #627b98;
  --line: rgba(69,101,143,.3);
  --gold: #947746;
  --panel: rgba(255,255,255,.82);
  --panel-soft: rgba(235,242,251,.8);
  --shadow: rgba(40,60,90,.12);

  background:
    radial-gradient(ellipse at 50% 5%, rgba(120,158,207,.2), transparent 48%),
    #e8eef6;
}

button,
a {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid #7dbdff;
  outline-offset: 3px;
}

/* 星空背景 */
.star-field {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star-field span {
  position: absolute;
  color: rgba(190,216,255,.65);
  animation: twinkle 3.5s ease-in-out infinite alternate;
}

.star-field span:nth-child(3n) {
  color: rgba(255,191,222,.7);
  animation-delay: -1.3s;
}

.star-field span:nth-child(4n) {
  color: rgba(224,202,255,.72);
  animation-delay: -2.1s;
}

@keyframes twinkle {
  from {
    opacity: .25;
    transform: scale(.85) rotate(0);
  }
  to {
    opacity: .9;
    transform: scale(1.15) rotate(18deg);
  }
}

.site-header,
main,
.site-footer {
  position: relative;
  z-index: 1;
}

.site-header {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 28px 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.logo-cn {
  font-size: 16px;
  letter-spacing: 3px;
}

.logo-en {
  font-family: Cinzel, serif;
  font-size: 10px;
  letter-spacing: 3.5px;
  color: var(--muted);
}

.header-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 10px;
}

.nav-link,
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--panel-soft);
  color: var(--text);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}

.nav-link:hover,
.theme-toggle:hover {
  border-color: var(--gold);
}

/* 页面标题 */
.intro {
  text-align: center;
  padding: 22px 20px 16px;
}

.eyebrow {
  color: var(--gold);
  font-family: Cinzel, serif;
  font-size: 11px;
  letter-spacing: 4px;
}

.intro h1 {
  margin: 14px 0 8px;
  font-family: Cinzel, "Noto Serif SC", serif;
  font-size: clamp(27px, 4vw, 40px);
  font-weight: 400;
  letter-spacing: 4px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 3px;
}

.intro-stars {
  margin-top: 14px;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 8px;
}

/* 书本区域 */
.book-wrap {
  width: min(1100px, calc(100% - 40px));
  margin: 12px auto 0;
}

.book {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr);
  gap: 0;
  min-height: 500px;
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 18px 50px var(--shadow);
}

.book::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 44%;
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent,
    var(--line) 10%,
    var(--line) 90%,
    transparent
  );
  pointer-events: none;
}

.book-page {
  position: relative;
  min-width: 0;
  padding: 38px 34px 36px;
}

.left-page {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: linear-gradient(145deg, rgba(26,48,76,.2), transparent 70%);
}

.right-page {
  min-width: 0;
}

.corner {
  position: absolute;
  color: var(--gold);
  opacity: .8;
  font-size: 15px;
  pointer-events: none;
}

.corner.tl {
  top: 13px;
  left: 15px;
}

.corner.tr {
  top: 13px;
  right: 15px;
}

.corner.bl {
  bottom: 13px;
  left: 15px;
}

.corner.br {
  bottom: 13px;
  right: 15px;
}

.page-kicker {
  color: var(--gold);
  font-family: Cinzel, serif;
  font-size: 10px;
  letter-spacing: 3px;
}

.country-title {
  margin: 20px 0 10px;
  font-size: clamp(25px, 3vw, 35px);
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.country-subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.ornament {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 25px 0;
  color: var(--gold);
  font-size: 12px;
}

.ornament::before,
.ornament::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--line);
}

.country-info {
  display: grid;
  gap: 0;
  margin: 0;
}

.info-row {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr);
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.info-row dt {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 1px;
}

.info-row dd {
  min-width: 0;
  margin: 0;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.edit-area {
  margin-top: auto;
  padding-top: 28px;
  display: flex;
  justify-content: flex-start;
}

.edit-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 1px;
  transition: color .2s, border-color .2s;
}

.edit-link:hover {
  color: var(--gold);
  border-color: var(--gold);
}

/* 右页内容 */
.page-section {
  margin: 0 0 28px;
  min-width: 0;
}

/* 关键：空栏目整块隐藏，防止被其他 display 样式覆盖 */
.page-section[hidden] {
  display: none !important;
}

.page-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 15px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
  color: var(--gold);
  font-family: Cinzel, "Noto Serif SC", serif;
  font-size: 12px;
  letter-spacing: 2px;
}

.page-heading .heading-cn {
  color: var(--text);
  font-family: "Noto Serif SC", serif;
  font-size: 13px;
  letter-spacing: 2px;
}

.page-text {
  min-width: 0;
  min-height: 0;
  height: auto;
  max-height: none;
  overflow: visible;
  color: var(--text);
  font-size: 14px;
  line-height: 2.15;
  white-space: pre-line;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.loading-state,
.empty-state,
.error-state {
  padding: 70px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
}

.loading-state .loading-star {
  display: block;
  margin-bottom: 12px;
  color: var(--gold);
  font-size: 24px;
  animation: twinkle 1.5s ease-in-out infinite alternate;
}

/* 翻页 */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 25px auto 0;
}

.page-button {
  min-width: 92px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--text);
  background: var(--panel);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: border-color .2s, opacity .2s;
}

.page-button:hover:not(:disabled) {
  border-color: var(--gold);
}

.page-button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.page-indicator {
  min-width: 70px;
  color: var(--muted);
  text-align: center;
  font-family: Cinzel, serif;
  font-size: 12px;
  letter-spacing: 2px;
}

.site-footer {
  padding: 35px 20px 25px;
  color: var(--muted);
  text-align: center;
  font-family: Cinzel, serif;
  font-size: 10px;
  letter-spacing: 3px;
}

/* 日间模式 */
.day-mode .book {
  background: var(--panel);
}

.day-mode .left-page {
  background: linear-gradient(145deg, rgba(174,197,225,.15), transparent 70%);
}

.day-mode .star-field span {
  color: rgba(87,117,165,.45);
}

/* 手机端：内容随页面延伸，不再固定高度或内部裁切 */
@media (max-width: 700px) {
  .site-header {
    width: calc(100% - 28px);
    padding: 20px 0 14px;
    align-items: flex-start;
    gap: 10px;
  }

  .logo-cn {
    font-size: 13px;
    letter-spacing: 1.5px;
  }

  .logo-en {
    font-size: 9px;
    letter-spacing: 2px;
  }

  .header-actions {
    gap: 6px;
  }

  .nav-link,
  .theme-toggle {
    min-height: 32px;
    padding: 6px 9px;
    font-size: 11px;
    letter-spacing: 0;
  }

  .intro {
    padding: 22px 15px 14px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: 2px;
  }

  .intro h1 {
    margin-top: 12px;
    font-size: 26px;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.9;
  }

  .book-wrap {
    width: calc(100% - 24px);
    margin-top: 10px;
  }

  .book {
    display: flex;
    flex-direction: column;
    height: auto;
    min-height: 0;
    overflow: visible;
  }

  .book::before {
    display: none;
  }

  .book-page,
  .left-page,
  .right-page {
    height: auto;
    min-height: 0;
    overflow: visible;
  }

  .book-page {
    padding: 30px 23px;
  }

  .left-page {
    border-bottom: 1px solid var(--line);
  }

  .right-page {
    padding-top: 28px;
    padding-bottom: 32px;
  }

  .country-title {
    margin-top: 17px;
    font-size: 27px;
  }

  .ornament {
    margin: 20px 0;
  }

  .info-row {
    grid-template-columns: 70px minmax(0, 1fr);
    gap: 9px;
    padding: 11px 0;
  }

  .page-section {
    margin-bottom: 25px;
  }

  .page-heading {
    gap: 8px;
    font-size: 11px;
  }

  .page-heading .heading-cn {
    font-size: 12px;
  }

  .page-text {
    font-size: 13px;
    line-height: 2;
  }

  .edit-area {
    padding-top: 24px;
  }

  .pagination {
    gap: 12px;
    margin-top: 20px;
  }

  .page-button {
    min-width: 78px;
    padding: 9px 10px;
    font-size: 11px;
  }

  .site-footer {
    padding-top: 28px;
    font-size: 9px;
    letter-spacing: 2px;
  }
}

@media (max-width: 360px) {
  .site-header {
    flex-wrap: wrap;
  }

  .header-actions {
    width: 100%;
    justify-content: flex-end;
  }

  .book-page {
    padding-right: 18px;
    padding-left: 18px;
  }

  .info-row {
    grid-template-columns: 62px minmax(0, 1fr);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<script>
/* Supabase 配置：保留现有项目地址与公开密钥 */
const SUPABASE_URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const elements = {
  loading: document.getElementById("loadingState"),
  error: document.getElementById("errorState"),
  empty: document.getElementById("emptyState"),
  book: document.getElementById("countryBook"),
  pagination: document.getElementById("pagination"),

  name: document.getElementById("countryName"),
  subtitle: document.getElementById("countrySubtitle"),
  capital: document.getElementById("countryCapital"),
  government: document.getElementById("countryGovernment"),
  region: document.getElementById("countryRegion"),

  descriptionSection: document.getElementById("descriptionSection"),
  historySection: document.getElementById("historySection"),
  cultureSection: document.getElementById("cultureSection"),

  description: document.getElementById("rightDescription"),
  history: document.getElementById("rightHistory"),
  culture: document.getElementById("rightCulture"),

  edit: document.getElementById("editCountry"),
  prev: document.getElementById("prevButton"),
  next: document.getElementById("nextButton"),
  indicator: document.getElementById("pageIndicator")
};

let countries = [];
let currentIndex = 0;

/* 只有存在实际文字时才显示栏目 */
function setOptionalSection(section, element, value) {
  const text = value == null ? "" : String(value).trim();

  element.textContent = text;
  section.hidden = text.length === 0;
}

/* 没有资料时，隐藏所有可选栏目 */
function hideOptionalSections() {
  elements.description.textContent = "";
  elements.history.textContent = "";
  elements.culture.textContent = "";

  elements.descriptionSection.hidden = true;
  elements.historySection.hidden = true;
  elements.cultureSection.hidden = true;
}

function showOnlyState(state) {
  elements.loading.hidden = state !== "loading";
  elements.error.hidden = state !== "error";
  elements.empty.hidden = state !== "empty";
  elements.book.hidden = state !== "book";
  elements.pagination.hidden =
    state !== "book" || countries.length <= 1;
}

function renderNation() {
  if (!countries.length) {
    showOnlyState("empty");
    return;
  }

  const nation = countries[currentIndex];

  elements.name.textContent = nation.name || "未命名国家";
  elements.subtitle.textContent = nation.subtitle || "";

  elements.capital.textContent = nation.capital || "—";
  elements.government.textContent = nation.government || "—";
  elements.region.textContent = nation.region || "—";

  /* 核心修改：空内容连同整个栏目标题一起隐藏 */
  setOptionalSection(
    elements.descriptionSection,
    elements.description,
    nation.description
  );

  setOptionalSection(
    elements.historySection,
    elements.history,
    nation.history
  );

  setOptionalSection(
    elements.cultureSection,
    elements.culture,
    nation.culture
  );

  /* 保留原有后台编辑入口 */
  elements.edit.href =
    "admin.html?type=country&id=" +
    encodeURIComponent(nation.id);

  elements.prev.disabled = currentIndex <= 0;
  elements.next.disabled = currentIndex >= countries.length - 1;

  elements.indicator.textContent =
    String(currentIndex + 1).padStart(2, "0") +
    " / " +
    String(countries.length).padStart(2, "0");

  showOnlyState("book");
}

async function loadNations() {
  showOnlyState("loading");

  try {
    const { data, error } = await supabaseClient
      .from("countries")
      .select(
        "id, name, subtitle, capital, government, region, description, history, culture, updated_at"
      )
      .order("name", { ascending: true });

    if (error) {
      throw error;
    }

    countries = Array.isArray(data) ? data : [];
    currentIndex = 0;

    if (countries.length === 0) {
      hideOptionalSections();
      showOnlyState("empty");
      return;
    }

    renderNation();
  } catch (error) {
    console.error("加载国家档案失败：", error);
    hideOptionalSections();
    showOnlyState("error");
  }
}

elements.prev.addEventListener("click", function () {
  if (currentIndex > 0) {
    currentIndex--;
    renderNation();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

elements.next.addEventListener("click", function () {
  if (currentIndex < countries.length - 1) {
    currentIndex++;
    renderNation();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* 日间 / 夜间模式 */
const themeToggle = document.getElementById("themeToggle");

themeToggle.addEventListener("click", function () {
  const isDay = document.body.classList.toggle("day-mode");

  themeToggle.textContent = isDay ? "☾ 夜间" : "☼ 日间";

  document
    .querySelector('meta[name="theme-color"]')
    .setAttribute("content", isDay ? "#e8eef6" : "#061426");
});

/* 初始化 */
loadNations();
</script>
</body>
</html>
