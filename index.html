<head>
<meta charset="UTF-8">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<style>

/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background: #020b1c;

    color: #eaf4ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}


/* =========================================================
   页面
   深蓝 / 皇家蓝 / 冰蓝
========================================================= */

.page {
    position: relative;

    width: 100%;
    height: 100vh;
    min-height: 620px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 43%,

            rgba(42, 105, 190, .25) 0%,

            rgba(18, 65, 125, .20) 24%,

            rgba(7, 28, 58, .78) 57%,

            #020b1c 100%
        );
}


/* =========================================================
   外框
========================================================= */

.frame {
    position: absolute;

    inset: 18px;

    border:
        1px solid
        rgba(105, 175, 245, .30);

    pointer-events: none;

    z-index: 20;
}


/* 左上 / 右下基础角 */

.frame::before,
.frame::after {
    content: "";

    position: absolute;

    width: 38px;
    height: 38px;

    border-color:
        rgba(120, 190, 255, .62);

    border-style: solid;
}

.frame::before {
    left: -1px;
    top: -1px;

    border-width:
        1px 0 0 1px;
}

.frame::after {
    right: -1px;
    bottom: -1px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   星空背景
========================================================= */

.stars {
    position: absolute;

    inset: 0;

    opacity: .82;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.78) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(165,210,255,.58) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.42) 0 1px,
            transparent 1.5px
        );

    background-size:
        190px 190px,
        270px 270px,
        340px 340px;

    background-position:
        20px 30px,
        100px 120px,
        40px 80px;

    animation:
        starFieldMove 28s linear infinite;

    pointer-events: none;
}

@keyframes starFieldMove {

    0% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(-18px,12px,0);
    }

    100% {
        transform:
            translate3d(0,0,0);
    }
}


/* =========================================================
   漂浮星星
========================================================= */

.floating-stars {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;
}

.floating-star {

    position: absolute;

    color:
        rgba(190, 225, 255, .84);

    font-family:
        "Times New Roman",
        serif;

    text-shadow:

        0 0 5px
        rgba(185, 225, 255, .95),

        0 0 16px
        rgba(65, 145, 245, .68),

        0 0 30px
        rgba(55, 130, 230, .34);

    opacity: .35;

    animation:
        starFloat 8s ease-in-out infinite,
        starTwinkle 4s ease-in-out infinite;
}


/* =========================================================
   星星位置
========================================================= */

.star-a {
    left: 12%;
    top: 23%;

    font-size: 13px;

    animation-delay:
        0s,
        .4s;
}

.star-b {
    left: 23%;
    top: 67%;

    font-size: 10px;

    animation-delay:
        1.8s,
        1.2s;
}

.star-c {
    left: 30%;
    top: 17%;

    font-size: 17px;

    animation-delay:
        3s,
        .8s;
}

.star-d {
    left: 76%;
    top: 22%;

    font-size: 14px;

    animation-delay:
        1s,
        2s;
}

.star-e {
    left: 86%;
    top: 36%;

    font-size: 11px;

    animation-delay:
        2.5s,
        .2s;
}

.star-f {
    left: 72%;
    top: 72%;

    font-size: 16px;

    animation-delay:
        4s,
        1.5s;
}

.star-g {
    left: 15%;
    top: 48%;

    font-size: 14px;

    animation-delay:
        2s,
        2.5s;
}

.star-h {
    left: 91%;
    top: 69%;

    font-size: 13px;

    animation-delay:
        3.5s,
        1s;
}

.star-i {
    left: 58%;
    top: 14%;

    font-size: 9px;

    animation-delay:
        1.5s,
        3s;
}

.star-j {
    left: 63%;
    top: 83%;

    font-size: 14px;

    animation-delay:
        4.5s,
        2s;
}

.star-k {
    left: 39%;
    top: 78%;

    font-size: 9px;

    animation-delay:
        2.2s,
        .5s;
}

.star-l {
    left: 81%;
    top: 54%;

    font-size: 15px;

    animation-delay:
        3.8s,
        2.8s;
}


/* =========================================================
   ✡ ✶
========================================================= */

.star-m {
    left: 18%;
    top: 35%;

    font-size: 15px;

    opacity: .42;

    animation-delay:
        1.2s,
        2.4s;
}

.star-n {
    left: 43%;
    top: 25%;

    font-size: 13px;

    opacity: .50;

    animation-delay:
        3.4s,
        1.3s;
}

.star-o {
    left: 68%;
    top: 62%;

    font-size: 18px;

    opacity: .38;

    animation-delay:
        2.6s,
        .7s;
}

.star-p {
    left: 88%;
    top: 18%;

    font-size: 12px;

    opacity: .48;

    animation-delay:
        4.2s,
        2.1s;
}


/* =========================================================
   星星动画
========================================================= */

@keyframes starFloat {

    0%,
    100% {

        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    50% {

        transform:
            translate3d(0,-18px,0)
            rotate(10deg);
    }
}

@keyframes starTwinkle {

    0%,
    100% {

        opacity: .25;

        filter:
            blur(.2px);
    }

    50% {

        opacity: 1;

        filter:
            blur(0)
            drop-shadow(
                0 0 7px
                rgba(155,210,255,.85)
            );
    }
}


/* =========================================================
   中央蓝色光晕
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 43%;

    width: 600px;
    height: 600px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            rgba(48, 118, 215, .15) 0%,

            rgba(30, 82, 165, .08) 30%,

            transparent 68%
        );

    filter:
        blur(5px);

    pointer-events: none;
}


/* =========================================================
   多层魔法阵
========================================================= */

.magic-circle {

    position: absolute;

    left: 50%;
    top: 52%;

    width: 520px;
    height: 520px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(105, 175, 245, .15);

    box-shadow:

        0 0 40px
        rgba(55, 125, 225, .07),

        inset 0 0 40px
        rgba(55, 125, 225, .06);

    opacity: .72;

    pointer-events: none;
}


/* 第二层 */

.magic-circle::before {

    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(110, 185, 250, .12);
}


/* 第三层 */

.magic-circle::after {

    content: "";

    position: absolute;

    inset: 88px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(125, 195, 255, .10);

    animation:
        circleRotate 40s linear infinite;
}

@keyframes circleRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   额外星轨
========================================================= */

.magic-circle {

    box-shadow:

        0 0 40px
        rgba(55, 125, 225, .07),

        inset 0 0 40px
        rgba(55, 125, 225, .06);
}


/* =========================================================
   顶部导航
========================================================= */

.nav {

    position: absolute;

    left: 58px;
    right: 58px;

    top: 46px;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    z-index: 30;
}


/* =========================================================
   左上 Logo
========================================================= */

.logo {

    display: flex;

    align-items: flex-start;

    gap: 13px;

    color:
        rgba(220,244,255,.92);

    white-space: nowrap;
}

.logo-symbol {

    color:
        #82c4ff;

    font-size: 17px;

    line-height: 1;

    text-shadow:

        0 0 10px
        rgba(105,190,255,.75);

    margin-top: 3px;
}

.logo-text {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 2px;
}

.logo-cn {

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(220,244,255,.92);
}

.logo-en {

    display: block;

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(190,225,255,.76);

    opacity: .72;
}


/* =========================================================
   导航
========================================================= */

.nav-links {

    display: flex;

    gap: 34px;
}

.nav-links a {

    position: relative;

    color:
        rgba(208,232,255,.68);

    text-decoration: none;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    transition:

        color .35s ease,

        text-shadow .35s ease;
}

.nav-links a::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -8px;

    width: 0;

    height: 1px;

    background:
        rgba(145,205,255,.85);

    transform:
        translateX(-50%);

    transition:
        width .35s ease;
}

.nav-links a:hover {

    color:
        rgba(235,250,255,.98);

    text-shadow:

        0 0 12px
        rgba(100,185,255,.60);
}

.nav-links a:hover::after {

    width: 100%;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(1000px, 90vw);

    transform:
        translate(-50%, -47%);

    text-align: center;

    z-index: 10;
}


/* =========================================================
   顶部装饰
========================================================= */

.symbol {

    margin-bottom: 28px;

    color:
        rgba(165,215,255,.74);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 17px;

    letter-spacing: 8px;

    text-shadow:

        0 0 12px
        rgba(90,175,255,.48);

    animation:
        symbolBreath 4s ease-in-out infinite;
}

@keyframes symbolBreath {

    0%,
    100% {
        opacity: .55;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   主标题
========================================================= */

.title-en {

    display: flex;

    flex-direction: column;

    align-items: center;

    font-family:

        "Cormorant Garamond",

        "Bodoni 72",

        "Didot",

        "Baskerville",

        "Times New Roman",

        serif;

    font-weight: 300;

    color:
        rgba(244,250,255,.97);

    text-shadow:

        0 0 5px
        rgba(225,247,255,.54),

        0 0 18px
        rgba(80,170,245,.27),

        0 0 45px
        rgba(45,125,220,.15);

    transform:
        scaleX(.92);

    line-height: .82;

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        geometricPrecision;
}

.title-word {

    display: block;

    white-space: nowrap;
}


/* =========================================================
   SEYAMI
========================================================= */

.title-word:first-child {

    font-size:
        clamp(76px, 10.5vw, 136px);

    font-weight: 300;

    letter-spacing:
        clamp(11px, 1.8vw, 24px);

    padding-left:
        clamp(11px, 1.8vw, 24px);
}


/* =========================================================
   ARCHIVE
========================================================= */

.title-word:last-child {

    display: block;

    margin-top: 14px;

    font-size:
        clamp(68px, 9.6vw, 124px);

    font-weight: 300;

    letter-spacing:
        clamp(14px, 2.2vw, 29px);

    padding-left:
        clamp(14px, 2.2vw, 29px);

    opacity: .96;
}


/* =========================================================
   标题分隔线
========================================================= */

.title-line {

    width: 180px;

    height: 1px;

    margin:
        31px auto 23px;

    background:

        linear-gradient(

            to right,

            transparent,

            rgba(145,205,255,.62),

            transparent
        );

    box-shadow:

        0 0 10px
        rgba(80,165,245,.24);
}


/* =========================================================
   中文标题
   ★ PC端严格以英文标题整体中心对齐
========================================================= */

.title-cn {

    display: block;

    width: 100%;

    text-align: center;

    font-family:

        "Noto Sans SC",

        "Microsoft YaHei",

        "PingFang SC",

        sans-serif;

    font-size: 18px;

    font-weight: 300;

    letter-spacing: 8px;

    padding-left: 8px;

    color:
        rgba(224,244,255,.91);

    text-shadow:

        0 0 15px
        rgba(80,175,245,.22);

    /*
       保证中文标题的视觉中心
       与 SEYAMI / ARCHIVE 两行共同中心一致
    */

    transform:
        translateX(0);
}


/* =========================================================
   简介
========================================================= */

.description {

    margin-top: 22px;

    color:
        rgba(190,219,242,.62);

    font-size: 12px;

    font-weight: 300;

    line-height: 2.25;

    letter-spacing: 4px;

    padding-left: 4px;
}


/* =========================================================
   进入档案馆按钮
========================================================= */

.enter-button {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 32px;

    min-width: 190px;

    height: 45px;

    padding: 0 25px;

    border:
        1px solid
        rgba(125,195,255,.40);

    color:
        rgba(220,245,255,.90);

    text-decoration: none;

    font-family:

        "Noto Sans SC",

        "Microsoft YaHei",

        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 4px;

    background:

        rgba(55,120,195,.045);

    box-shadow:

        inset 0 0 20px
        rgba(65,150,225,.035),

        0 0 20px
        rgba(55,135,225,.045);

    transition:

        background .4s ease,

        border-color .4s ease,

        box-shadow .4s ease,

        color .4s ease,

        transform .4s ease;
}

.enter-button:hover {

    color:
        #f2fbff;

    border-color:
        rgba(160,220,255,.78);

    background:
        rgba(60,135,220,.10);

    box-shadow:

        0 0 25px
        rgba(70,170,245,.15),

        inset 0 0 25px
        rgba(65,160,235,.07);

    transform:
        translateY(-2px);
}


/* =========================================================
   底部
========================================================= */

.footer-mark {

    position: absolute;

    left: 50%;

    bottom: 38px;

    transform:
        translateX(-50%);

    color:
        rgba(160,205,235,.30);

    font-family:

        "Cormorant Garamond",

        "Times New Roman",

        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    z-index: 10;
}


/* =========================================================
   手机端
========================================================= */

@media (max-width: 700px) {

    .page {
        min-height: 580px;
    }

    .frame {
        inset: 11px;
    }

    .nav {

        left: 30px;
        right: 30px;

        top: 30px;
    }

    .logo {
        gap: 9px;
    }

    .logo-symbol {
        font-size: 13px;
    }

    .logo-cn {

    }

    .logo-en {

    }

    .nav-links a {

        font-size: 10px;

    }

    .nav-links a:nth-child(3) {
        display: none;
    }


    /* HERO */

    .hero {

        width: 94vw;

        transform:
            translate(-50%, -46%);
    }


    .symbol {

        margin-bottom: 23px;

        font-size: 13px;

        letter-spacing: 5px;
    }


    /* 手机 SEYAMI */

    .title-word:first-child {

        font-size:
            clamp(58px, 16vw, 88px);

        letter-spacing: 7px;

        padding-left: 7px;
    }


    /* 手机 ARCHIVE */

    .title-word:last-child {

        margin-top: 11px;

        font-size:
            clamp(52px, 14.5vw, 80px);

        letter-spacing: 9px;

        padding-left: 9px;
    }


    .title-line {

        width: 120px;

        margin:
            25px auto 19px;
    }


    .title-cn {

        font-size: 14px;

        letter-spacing: 5px;

        padding-left: 5px;
    }


    .description {

        margin-top: 18px;

        font-size: 10px;

        letter-spacing: 2px;

        line-height: 2;
    }


    .enter-button {

        margin-top: 26px;

        min-width: 170px;

        height: 42px;

        font-size: 10px;

        letter-spacing: 3px;
    }


    .magic-circle {

        width: 390px;
        height: 390px;
    }


    .footer-mark {

        bottom: 25px;

        font-size: 8px;

        letter-spacing: 2px;
    }
}


/* =========================================================
   超小屏
========================================================= */

@media (max-width: 420px) {

    .nav-links {
        display: none;
    }

    .nav {

        justify-content:
            flex-start;
    }


    .title-word:first-child {

        font-size: 59px;

        letter-spacing: 6px;

        padding-left: 6px;
    }


    .title-word:last-child {

        font-size: 52px;

        letter-spacing: 7px;

        padding-left: 7px;
    }


    .title-cn {

        font-size: 13px;
    }


    .description {

        font-size: 9px;
    }
}

</style>
