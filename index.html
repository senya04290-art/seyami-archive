<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>


<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    background:#061426;

    color:#dcecff;

    overflow-x:hidden;

    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}


.page{

    position:relative;

    width:100%;

    min-height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),

        #061426;
}


/* =========================================================
   背景星空
========================================================= */

.stars{

    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;
}

.stars::before,
.stars::after{

    content:"";

    position:absolute;

    inset:-20%;

    background-image:

        radial-gradient(
            circle,
            rgba(182,220,255,.7) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(130,191,239,.45) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(220,240,255,.35) 0 1px,
            transparent 1.5px
        );

    background-size:

        180px 180px,
        240px 240px,
        310px 310px;

    background-position:

        20px 30px,
        80px 120px,
        150px 70px;

    opacity:.45;

    animation:
        starMove
        35s
        linear
        infinite;
}

.stars::after{

    opacity:.22;

    transform:scale(1.15);

    animation-duration:50s;
}


@keyframes starMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-80px,50px,0);
    }

}


/* =========================================================
   浮动星星
========================================================= */

.floating-stars{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:2;
}

.floating-stars span{

    position:absolute;

    color:
        rgba(158,207,247,.62);

    font-family:serif;

    font-size:14px;

    text-shadow:
        0 0 8px
        rgba(96,177,242,.5);

    animation:
        floatStar
        6s
        ease-in-out
        infinite;
}


.floating-stars span:nth-child(1){
    left:12%;
    top:24%;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:20%;
    top:67%;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(3){
    left:77%;
    top:22%;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:84%;
    top:70%;
    animation-delay:1s;
}

.floating-stars span:nth-child(5){
    left:30%;
    top:17%;
    animation-delay:3s;
}

.floating-stars span:nth-child(6){
    left:71%;
    top:61%;
    animation-delay:2s;
}

.floating-stars span:nth-child(7){
    left:16%;
    top:46%;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:89%;
    top:43%;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(9){
    left:42%;
    top:11%;
    animation-delay:2.2s;
}

.floating-stars span:nth-child(10){
    left:57%;
    top:83%;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(11){
    left:7%;
    top:78%;
    animation-delay:1.2s;
}

.floating-stars span:nth-child(12){
    left:94%;
    top:18%;
    animation-delay:4.2s;
}


@keyframes floatStar{

    0%,
    100%{

        opacity:.35;

        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{

        opacity:.85;

        transform:
            translateY(-8px)
            rotate(12deg);
    }

}


/* =========================================================
   外框
========================================================= */

.frame{

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;
}


.frame::before{

    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(81,142,193,.08);
}


/* =========================================================
   四角六芒星
========================================================= */

.corner{

    position:absolute;

    width:68px;

    height:68px;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}


.corner::before{

    content:"✡";

    display:block;

    font-family:
        "Times New Roman",
        serif;

    font-size:40px;

    font-weight:400;

    line-height:1;

    color:
        rgba(108,178,230,.88);

    text-shadow:
        0 0 5px
        rgba(67,153,218,.5),

        0 0 13px
        rgba(43,124,190,.28);
}


.corner.tl{
    left:-34px;
    top:-34px;
}

.corner.tr{
    right:-34px;
    top:-34px;
}

.corner.bl{
    left:-34px;
    bottom:-34px;
}

.corner.br{
    right:-34px;
    bottom:-34px;
}


/* =========================================================
   顶部导航
========================================================= */

.top-nav{

    position:absolute;

    left:58px;

    right:58px;

    top:38px;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    z-index:20;
}


.logo{

    display:flex;

    align-items:baseline;

    gap:10px;

    color:#d9edff;

    text-decoration:none;
}


.logo-mark{

    width:auto;

    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    font-weight:400;

    line-height:1;

    color:
        rgba(137,201,239,.9);

    position:relative;

    top:1px;

    text-shadow:
        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);
}


.logo-text{

    display:flex;

    flex-direction:column;

    line-height:1.05;
}


.logo-cn{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:15px;

    font-weight:400;

    letter-spacing:2px;
}


.logo-en{

    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.63);
}


.nav-links{

    display:flex;

    align-items:center;

    gap:31px;
}


.nav-links a{

    position:relative;

    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:2px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}


.nav-links a::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-8px;

    width:0;

    height:1px;

    background:
        rgba(122,192,235,.7);

    transform:
        translateX(-50%);

    transition:
        width .3s ease;
}


.nav-links a:hover{

    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}


.nav-links a:hover::after{

    width:100%;
}


/* =========================================================
   主体
========================================================= */

.main{

    position:relative;

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:5;

    padding:
        80px
        20px
        70px;
}


/* =========================================================
   魔法圆阵
========================================================= */

.magic-circle{

    position:absolute;

    width:560px;

    height:560px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    opacity:.55;
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.28);

    box-shadow:
        0 0 22px
        rgba(47,126,184,.08);

    animation:
        rotateCircle
        80s
        linear
        infinite;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:27px;

    border-radius:50%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        inset
        0 0 20px
        rgba(62,139,194,.04);

    animation:
        rotateCircleReverse
        55s
        linear
        infinite;
}


@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* =========================================================
   三重魔法星轨
========================================================= */

.orbit-system{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    overflow:visible;
}


.orbit-track{

    fill:none;

    stroke:
        rgba(69,164,230,.28);

    stroke-width:1;

    vector-effect:
        non-scaling-stroke;

    filter:
        drop-shadow(
            0 0 4px
            rgba(70,155,210,.10)
        );
}


/* =========================================================
   小星辰
========================================================= */

#travellingStar{

    font-family:
        "Times New Roman",
        serif;

    font-size:15px;

    fill:
        rgba(190,228,255,.95);

    text-anchor:middle;

    dominant-baseline:middle;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 3px
            rgba(131,207,250,.9)
        )

        drop-shadow(
            0 0 8px
            rgba(74,165,224,.55)
        );
}


.star-glow{

    fill:
        rgba(143,210,246,.08);

    filter:blur(2px);

    pointer-events:none;
}


/* =========================================================
   中央魔法线
========================================================= */

.magic-line{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(92,164,213,.13);
}


.magic-line.horizontal{

    width:490px;

    height:1px;
}


.magic-line.vertical{

    width:1px;

    height:490px;
}


/* =========================================================
   中央小圆
========================================================= */

.magic-center{

    position:absolute;

    left:50%;

    top:50%;

    width:12px;

    height:12px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(133,202,242,.48);

    border-radius:50%;

    box-shadow:
        0 0 10px
        rgba(88,171,224,.25);
}


.magic-center::before{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    width:3px;

    height:3px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(174,221,249,.7);

    box-shadow:
        0 0 8px
        rgba(126,203,244,.8);
}


/* =========================================================
   标题区域
========================================================= */

.title-area{

    position:relative;

    text-align:center;

    z-index:8;

    margin-top:-18px;
}


/* =========================================================
   PC 标题
========================================================= */

.main-title{

    position:relative;

    width:100%;

    max-width:100%;

    height:87px;

    margin-left:auto;

    margin-right:auto;

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        serif;

    font-weight:400;

    line-height:1;

    letter-spacing:8px;

    color:#dceeff;

    text-align:center;

    text-shadow:
        0 0 18px
        rgba(94,172,222,.08);
}


.main-title .seyami{

    position:absolute;

    right:50%;

    margin-right:20px;

    font-size:clamp(56px, 7.9vw, 87px);

    white-space:nowrap;
}


.main-title .archive{

    position:absolute;

    left:50%;

    margin-left:20px;

    margin-top:0;

    font-size:clamp(56px, 7.9vw, 87px);

    letter-spacing:9px;

    white-space:nowrap;
}


/* =========================================================
   ★ 电脑窄窗口专用修复
   只针对鼠标电脑
   不影响手机
========================================================= */

@media
(hover:hover)
and (pointer:fine)
and (max-width:1200px){

    .main-title{

        height:78px;

        letter-spacing:5px;

        width:100%;

        max-width:100%;

        overflow:visible;
    }


    .main-title .seyami,
    .main-title .archive{

        font-size:clamp(
            36px,
            6.2vw,
            68px
        );

        line-height:1;

        letter-spacing:5px;
    }


    .main-title .seyami{

        right:50%;

        margin-right:10px;
    }


    .main-title .archive{

        left:50%;

        margin-left:10px;

        margin-top:0;
    }

}


/* =========================================================
   标题装饰
========================================================= */

.title-decoration{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    margin-top:29px;

    opacity:.7;
}


.title-decoration .line{

    width:95px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(115,182,224,.62)
        );
}


.title-decoration .line.right{

    background:
        linear-gradient(
            90deg,
            rgba(115,182,224,.62),
            transparent
        );
}


.title-decoration .diamond{

    width:6px;

    height:6px;

    border:
        1px solid
        rgba(143,202,237,.8);

    transform:rotate(45deg);
}


/* =========================================================
   中文标题
========================================================= */

.chinese-title{

    margin-top:24px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:8px;

    color:
        rgba(207,229,246,.86);

    text-align:center;
}


/* =========================================================
   描述
========================================================= */

.description{

    margin-top:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:7px;

    text-align:center;

    color:
        rgba(177,207,230,.62);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    line-height:1.7;

    letter-spacing:2px;
}


/* =========================================================
   进入按钮
========================================================= */

.enter-wrap{

    position:relative;

    width:370px;

    height:82px;

    margin:42px auto 0;

    display:flex;

    align-items:center;

    justify-content:center;
}


.enter-wrap::before{

    content:"";

    position:absolute;

    inset:0;

    clip-path:
        polygon(
            0 20%,
            5% 20%,
            8% 0,
            92% 0,
            95% 20%,
            100% 20%,
            100% 80%,
            95% 80%,
            92% 100%,
            8% 100%,
            5% 80%,
            0 80%
        );

    border:
        1px solid
        rgba(91,167,218,.38);

    background:
        rgba(8,28,49,.48);

    box-shadow:
        0 0 22px
        rgba(39,120,180,.08);

    pointer-events:none;
}


.enter-wrap::after{

    content:"";

    position:absolute;

    left:13px;

    right:13px;

    top:13px;

    bottom:13px;

    border:
        1px solid
        rgba(91,164,213,.16);

    pointer-events:none;
}


.enter-button{

    position:relative;

    z-index:2;

    width:300px;

    height:50px;

    border:none;

    outline:none;

    cursor:pointer;

    color:#d9edff;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    border-top:
        1px solid
        rgba(105,180,225,.38);

    border-bottom:
        1px solid
        rgba(105,180,225,.38);

    transition:
        background .35s ease,
        box-shadow .35s ease,
        letter-spacing .35s ease;
}


.enter-button:hover{

    background:
        linear-gradient(
            90deg,
            rgba(10,41,67,.95),
            rgba(23,66,98,.95),
            rgba(10,41,67,.95)
        );

    box-shadow:
        0 0 22px
        rgba(56,143,201,.18);

    letter-spacing:5px;
}


.enter-button:active{

    transform:translateY(1px);
}


.enter-star{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    color:
        rgba(111,186,229,.75);

    font-size:16px;

    text-shadow:
        0 0 9px
        rgba(67,158,215,.45);

    z-index:3;
}


.enter-star.left{
    left:18px;
}

.enter-star.right{
    right:18px;
}


.enter-diamond{

    position:absolute;

    left:50%;

    width:6px;

    height:6px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border:
        1px solid
        rgba(116,187,226,.65);

    background:#061426;
}


.enter-diamond.top{
    top:-3px;
}


.enter-diamond.bottom{
    bottom:-3px;
}


/* =========================================================
   Footer
========================================================= */

.footer{

    position:absolute;

    left:50%;

    bottom:32px;

    transform:
        translateX(-50%);

    z-index:15;

    color:
        rgba(133,177,207,.38);

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    white-space:nowrap;
}


/* =========================================================
   平板
========================================================= */

@media(max-width:800px){

    .top-nav{

        left:35px;

        right:35px;

        top:30px;
    }


    .nav-links{

        gap:17px;
    }


    .nav-links a{

        font-size:11px;

        letter-spacing:1px;
    }


    .magic-circle{

        width:500px;

        height:500px;
    }


    .main-title{

        width:max-content;

        max-width:calc(100vw - 40px);

        margin-left:auto;

        margin-right:auto;

        flex-direction:row;

        align-items:baseline;
    }


    .main-title .seyami{

        font-size:58px;
    }


    .main-title .archive{

        margin-top:0;

        margin-left:14px;

        font-size:70px;
    }


    .chinese-title{

        font-size:18px;
    }


    .description{

        font-size:11px;
    }

}


/* =========================================================
   ★ 手机端
   原来的手机布局完全保留
========================================================= */

    .frame{
        inset:12px;
    }


    .top-nav{

        left:25px;

        right:25px;

        top:24px;
    }


    .logo{

        gap:8px;

        align-items:baseline;
    }


    .logo-mark{

        font-size:18px;

        position:relative;

        top:1px;
    }


    .logo-cn{

        font-size:12px;

        letter-spacing:1px;
    }


    .logo-en{

        font-size:6px;

        letter-spacing:2px;
    }


    .nav-links{

        gap:12px;
    }


    .nav-links a{

        font-size:9px;

        letter-spacing:0;
    }


    .corner{

        width:55px;

        height:55px;
    }


    .corner.tl{

        left:-27.5px;

        top:-27.5px;
    }


    .corner.tr{

        right:-27.5px;

        top:-27.5px;
    }


    .corner.bl{

        left:-27.5px;

        bottom:-27.5px;
    }


    .corner.br{

        right:-27.5px;

        bottom:-27.5px;
    }


    .corner::before{

        font-size:32px;
    }


    .main{

        padding:
            100px
            15px
            70px;
    }


    .magic-circle{

        width:390px;

        height:390px;

        opacity:.48;
    }


    .magic-line.horizontal{

        width:350px;
    }


    .magic-line.vertical{

        height:350px;
    }


    /* =====================================================
       手机标题
       两行
    ===================================================== */

    .main-title{

        width:auto;

        max-width:none;

        margin-left:0;

        margin-right:0;

        flex-direction:column;

        align-items:center;

        justify-content:center;

        letter-spacing:5px;

        line-height:.88;

        height:auto;
    }


    .main-title .seyami{

        position:static;

        margin-right:0;

        font-size:43px;

        white-space:nowrap;
    }


    .main-title .archive{

        position:static;

        margin-top:3px;

        margin-left:0;

        font-size:53px;

        letter-spacing:6px;

        white-space:nowrap;
    }


    /* =====================================================
       手机标题装饰
    ===================================================== */

    .title-decoration{

        margin-top:23px;
    }


    .title-decoration .line{

        width:55px;
    }


    /* =====================================================
       手机中文标题
    ===================================================== */

    .chinese-title{

        margin-top:20px;

        font-size:15px;

        letter-spacing:5px;
    }


    /* =====================================================
       手机描述

<script>

/* =========================================================
   SEYAMI ARCHIVE
   三层星轨

   A：38秒 / 顺时针
   B：32秒 / 逆时针
   C：25秒 / 顺时针
========================================================= */


(function(){


    const star =
        document.getElementById(
            "travellingStar"
        );


    const glow =
        document.getElementById(
            "starGlow"
        );


    if(
        !star ||
        !glow
    ){
        return;
    }


    const CX = 280;

    const CY = 280;


    const tracks = [


        {

            id:"A",

            rx:250,

            ry:95,

            rotation:0,

            speed:360 / 38,

            direction:1

        },


        {

            id:"B",

            rx:210,

            ry:72.5,

            rotation:55,

            speed:-360 / 32,

            direction:-1

        },


        {

            id:"C",

            rx:165,

            ry:52.5,

            rotation:110,

            speed:360 / 25,

            direction:1

        }


    ];


    let currentTrack = 0;

    let starAngle = 300;

    let targetAngle = null;

    let switching = false;


    const animationStart =
        performance.now();


    let lastTime =
        animationStart;


    /* =====================================================
       角度
    ====================================================== */

    function degToRad(angle){

        return angle *
               Math.PI /
               180;

    }


    function radToDeg(angle){

        return angle *
               180 /
               Math.PI;

    }


    function normalize(angle){

        angle %= 360;

        if(
            angle < 0
        ){

            angle += 360;

        }

        return angle;

    }


    /* =====================================================
       获取轨道旋转角
    ====================================================== */

    function getRotation(
        track,
        elapsed
    ){

        return (

            track.rotation +

            track.speed *
            elapsed /
            1000

        );

    }


    /* =====================================================
       根据轨道角度获取实际坐标
    ====================================================== */

    function getPoint(
        track,
        angle,
        elapsed
    ){

        const rad =
            degToRad(angle);


        const localX =
            track.rx *
            Math.cos(rad);


        const localY =
            track.ry *
            Math.sin(rad);


        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        const cos =
            Math.cos(rotation);


        const sin =
            Math.sin(rotation);


        const worldX =
            localX * cos -
            localY * sin;


        const worldY =
            localX * sin +
            localY * cos;


        return {

            x:
                CX + worldX,

            y:
                CY + worldY

        };

    }


    /* =====================================================
       屏幕坐标 → 轨道角度
    ====================================================== */

    function worldToTrackAngle(
        track,
        x,
        y,
        elapsed
    ){

        let dx =
            x - CX;


        let dy =
            y - CY;


        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        const cos =
            Math.cos(
                -rotation
            );


        const sin =
            Math.sin(
                -rotation
            );


        const localX =
            dx * cos -
            dy * sin;


        const localY =
            dx * sin +
            dy * cos;


        const angle =
            radToDeg(

                Math.atan2(
                    localY / track.ry,
                    localX / track.rx
                )

            );


        return normalize(
            angle
        );

    }


    /* =====================================================
       寻找两条轨道交接位置
    ====================================================== */

    function findIntersection(
        trackA,
        trackB,
        elapsed,
        fromAngle
    ){

        const samples = 720;


        let best = null;

        let bestDistance =
            Infinity;


        for(
            let i = 0;
            i < samples;
            i++
        ){

            const angleA =
                i *
                360 /
                samples;


            const pointA =
                getPoint(
                    trackA,
                    angleA,
                    elapsed
                );


            const angleB =
                worldToTrackAngle(
                    trackB,
                    pointA.x,
                    pointA.y,
                    elapsed
                );


            const pointB =
                getPoint(
                    trackB,
                    angleB,
                    elapsed
                );


            const dx =
                pointA.x -
                pointB.x;


            const dy =
                pointA.y -
                pointB.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            let travel =
                normalize(

                    (
                        angleA -
                        fromAngle
                    ) *
                    trackA.direction

                );


            if(
                travel < 0
            ){

                travel += 360;

            }


            if(

                distance <
                bestDistance

                &&

                travel > 2

            ){

                bestDistance =
                    distance;


                best = {

                    angleA,

                    angleB,

                    x:
                        (
                            pointA.x +
                            pointB.x
                        ) / 2,

                    y:
                        (
                            pointA.y +
                            pointB.y
                        ) / 2,

                    distance,

                    travel

                };

            }

        }


        if(

            !best ||

            best.distance > 8

        ){

            best = null;

            bestDistance =
                Infinity;


            for(
                let i = 0;
                i < samples;
                i++
            ){

                const angleA =
                    i *
                    360 /
                    samples;


                const pointA =
                    getPoint(
                        trackA,
                        angleA,
                        elapsed
                    );


                const angleB =
                    worldToTrackAngle(
                        trackB,
                        pointA.x,
                        pointA.y,
                        elapsed
                    );


                const pointB =
                    getPoint(
                        trackB,
                        angleB,
                        elapsed
                    );


                const dx =
                    pointA.x -
                    pointB.x;


                const dy =
                    pointA.y -
                    pointB.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if(
                    distance <
                    bestDistance
                ){

                    bestDistance =
                        distance;


                    best = {

                        angleA,

                        angleB,

                        x:
                            (
                                pointA.x +
                                pointB.x
                            ) / 2,

                        y:
                            (
                                pointA.y +
                                pointB.y
                            ) / 2,

                        distance

                    };

                }

            }

        }


        return best;

    }


    /* =====================================================
       设置下一段轨道
    ====================================================== */

    function setNextTarget(
        elapsed
    ){

        const nextTrackIndex =
            (
                currentTrack +
                1
            ) % 3;


        const current =
            tracks[
                currentTrack
            ];


        const next =
            tracks[
                nextTrackIndex
            ];


        const intersection =
            findIntersection(
                current,
                next,
                elapsed,
                starAngle
            );


        if(!intersection){

            return;

        }


        targetAngle =
            intersection.angleA;


        switching = true;

    }


    /* =====================================================
       更新三条轨道
    ====================================================== */

    function updateOrbits(
        elapsed
    ){

        const groupA =
            document.getElementById(
                "orbitA"
            );


        const groupB =
            document.getElementById(
                "orbitB"
            );


        const groupC =
            document.getElementById(
                "orbitC"
            );


        if(groupA){

            groupA.setAttribute(

                "transform",

                `rotate(
                    ${getRotation(
                        tracks[0],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`

            );

        }


        if(groupB){

            groupB.setAttribute(

                "transform",

                `rotate(
                    ${getRotation(
                        tracks[1],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`

            );

        }


        if(groupC){

            groupC.setAttribute(

                "transform",

                `rotate(
                    ${getRotation(
                        tracks[2],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`

            );

        }

    }


    /* =====================================================
       更新星辰
    ====================================================== */

    function updateStar(
        elapsed
    ){

        const track =
            tracks[
                currentTrack
            ];


        const point =
            getPoint(
                track,
                starAngle,
                elapsed
            );


        star.setAttribute(
            "x",
            point.x.toFixed(3)
        );


        star.setAttribute(
            "y",
            point.y.toFixed(3)
        );


        glow.setAttribute(
            "cx",
            point.x.toFixed(3)
        );


        glow.setAttribute(
            "cy",
            point.y.toFixed(3)
        );

    }


    /* =====================================================
       星辰运行速度
    ====================================================== */

    const STAR_SPEED = 11;


    /* =====================================================
       动画
    ====================================================== */

    function animate(now){

        const elapsed =
            now -
            animationStart;


        const delta =
            Math.min(

                0.05,

                (
                    now -
                    lastTime
                ) / 1000

            );


        updateOrbits(
            elapsed
        );


        if(!switching){

            setNextTarget(
                elapsed
            );

        }


        if(

            switching &&

            targetAngle !== null

        ){

            const track =
                tracks[
                    currentTrack
                ];


            const direction =
                track.direction;


            let distance =
                normalize(

                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction

                );


            let speed =
                STAR_SPEED;


            if(
                distance < 25
            ){

                speed *=
                    Math.max(

                        0.25,

                        distance / 25

                    );

            }


            starAngle +=

                speed *
                direction *
                delta;


            starAngle =
                normalize(
                    starAngle
                );


            distance =
                normalize(

                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction

                );


            if(
                distance < 1
            ){

                const intersection =
                    getPoint(

                        track,

                        targetAngle,

                        elapsed

                    );


                const nextTrackIndex =
                    (
                        currentTrack +
                        1
                    ) % 3;


                const nextTrack =
                    tracks[
                        nextTrackIndex
                    ];


                const nextAngle =
                    worldToTrackAngle(

                        nextTrack,

                        intersection.x,

                        intersection.y,

                        elapsed

                    );


                currentTrack =
                    nextTrackIndex;


                starAngle =
                    nextAngle;


                targetAngle =
                    null;


                switching =
                    false;


                starAngle =
                    normalize(

                        starAngle +

                        tracks[
                            currentTrack
                        ].direction *

                        0.8

                    );

            }

        }


        updateStar(
            elapsed
        );


        lastTime =
            now;


        requestAnimationFrame(
            animate
        );

    }


    /* =====================================================
       初始化
    ====================================================== */

    starAngle = 300;


    updateOrbits(0);


    updateStar(0);


    requestAnimationFrame(
        animate
    );


})();

</script>
