<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* ================================
   基础
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcefff;
    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
    overflow-x:hidden;
}


/* ================================
   页面背景
================================ */

.page{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(25,91,140,.14),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(10,48,79,.25),
            transparent 65%
        ),

        #061426;
}


/* ================================
   背景星尘
================================ */

.stars,
.stars::before,
.stars::after{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.stars{
    opacity:.65;
}

.stars::before{
    content:"";

    background-image:

        radial-gradient(
            circle,
            rgba(180,225,255,.8) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(100,180,240,.6) 0 1px,
            transparent 1.5px
        );

    background-size:
        170px 170px,
        230px 230px;

    background-position:
        20px 40px,
        80px 120px;

    animation:
        starMove 28s linear infinite;
}

.stars::after{
    content:"";

    background-image:

        radial-gradient(
            circle,
            rgba(190,230,255,.55) 0 1px,
            transparent 1.5px
        );

    background-size:310px 310px;

    animation:
        starMove 42s linear infinite reverse;

    opacity:.5;
}

@keyframes starMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-70px);
    }

}


/* ================================
   浮动星星
================================ */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.floating-stars span{
    position:absolute;

    color:
        rgba(132,201,239,.45);

    font-family:
        "Times New Roman",
        serif;

    animation:
        floatingStar
        7s
        ease-in-out
        infinite;
}

.floating-stars span:nth-child(1){
    left:13%;
    top:21%;
    font-size:13px;
}

.floating-stars span:nth-child(2){
    left:82%;
    top:19%;
    font-size:10px;
    animation-delay:1s;
}

.floating-stars span:nth-child(3){
    left:22%;
    top:72%;
    font-size:9px;
    animation-delay:2s;
}

.floating-stars span:nth-child(4){
    left:76%;
    top:70%;
    font-size:14px;
    animation-delay:3s;
}

.floating-stars span:nth-child(5){
    left:9%;
    top:48%;
    font-size:8px;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(6){
    left:90%;
    top:43%;
    font-size:8px;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(7){
    left:30%;
    top:16%;
    font-size:8px;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:68%;
    top:82%;
    font-size:9px;
    animation-delay:2s;
}

.floating-stars span:nth-child(9){
    left:47%;
    top:10%;
    font-size:8px;
    animation-delay:1s;
}

.floating-stars span:nth-child(10){
    left:56%;
    top:88%;
    font-size:10px;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(11){
    left:17%;
    top:87%;
    font-size:8px;
    animation-delay:4.5s;
}

.floating-stars span:nth-child(12){
    left:86%;
    top:83%;
    font-size:9px;
    animation-delay:5s;
}

@keyframes floatingStar{

    0%,
    100%{
        opacity:.2;
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        opacity:.75;
        transform:
            translateY(-9px)
            rotate(20deg);
    }

}


/* ================================
   外框
================================ */

.frame{
    position:absolute;
    inset:24px;

    border:
        1px solid
        rgba(91,173,222,.16);

    pointer-events:none;

    z-index:5;
}


/* ================================
   四角六芒星
================================ */

.corner{
    position:absolute;

    color:
        rgba(100,190,235,.42);

    font-family:
        "Times New Roman",
        serif;

    font-size:24px;

    line-height:1;

    text-shadow:
        0 0 8px
        rgba(50,150,220,.15);
}

.corner.tl{
    top:-14px;
    left:-14px;
}

.corner.tr{
    top:-14px;
    right:-14px;
}

.corner.bl{
    bottom:-14px;
    left:-14px;
}

.corner.br{
    bottom:-14px;
    right:-14px;
}


/* ================================
   顶部导航
================================ */

.top-nav{
    position:absolute;

    top:42px;
    left:58px;
    right:58px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    z-index:20;
}


/* ================================
   左上角 Logo
================================ */

.logo{
    display:flex;
    align-items:baseline;
    gap:10px;

    color:
        rgba(220,239,255,.92);

    text-decoration:none;
}

.logo-mark{
    width:auto;
    height:auto;

    display:block;
    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;
    line-height:1;

    position:relative;
    top:1px;
}

.logo-text{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.logo-cn{
    font-family:
        "Noto Serif SC",
        serif;

    font-size:15px;
    letter-spacing:4px;

    font-weight:400;
}

.logo-en{
    font-family:
        "Cinzel",
        serif;

    font-size:8px;
    letter-spacing:4px;

    opacity:.48;
}


/* ================================
   导航
================================ */

.nav-links{
    display:flex;
    gap:34px;
}

.nav-links a{
    color:
        rgba(197,225,244,.62);

    text-decoration:none;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:3px;

    transition:
        color .3s ease;
}

.nav-links a:hover{
    color:
        rgba(225,244,255,.95);
}


/* ================================
   主区域
================================ */

.main{
    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;
}


/* ================================
   魔法阵
================================ */

.magic-circle{
    position:absolute;

    left:50%;
    top:50%;

    width:560px;
    height:560px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}


/* 外圈 */

.magic-circle::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:520px;
    height:520px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(69,164,230,.13);

    border-radius:50%;
}


/* 内圈 */

.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:390px;
    height:390px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(69,164,230,.09);

    border-radius:50%;
}


/* ================================
   ★ 星轨
================================ */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:
        2px solid
        rgba(69,164,230,.30);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    animation:
        orbitRotate
        38s
        linear
        infinite;
}


/* 第一层 */

.orbit.one{
    width:500px;
    height:190px;
}


/* 第二层 */

.orbit.two{
    width:420px;
    height:145px;

    animation-direction:reverse;

    animation-duration:32s;
}


/* 第三层 */

.orbit.three{
    width:330px;
    height:105px;

    animation-duration:25s;
}


@keyframes orbitRotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* ================================
   魔法十字线
================================ */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    background:
        rgba(69,164,230,.10);
}

.magic-line.horizontal{
    width:490px;
    height:1px;

    transform:
        translate(-50%,-50%);
}

.magic-line.vertical{
    width:1px;
    height:490px;

    transform:
        translate(-50%,-50%);
}


/* ================================
   中心小点
================================ */

.center-dot{
    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    border-radius:50%;

    background:
        rgba(129,204,245,.65);

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 12px
        rgba(69,164,230,.25);
}


/* ================================
   中央内容
================================ */

.content{
    position:relative;

    z-index:10;

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:18px;
}


/* ================================
   主标题
================================ */

.main-title{
    display:flex;
    flex-direction:column;

    align-items:center;

    font-family:
        "Cinzel",
        serif;

    font-weight:400;

    color:
        rgba(224,241,252,.94);

    line-height:.88;

    letter-spacing:7px;
}

.main-title .seyami{
    font-size:70px;
}

.main-title .archive{
    font-size:87px;

    letter-spacing:10px;

    margin-top:7px;
}


/* ================================
   标题装饰线
================================ */

.title-decoration{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;

    margin-top:27px;

    opacity:.6;
}

.title-decoration .line{
    width:90px;
    height:1px;

    background:
        rgba(100,190,235,.38);
}

.title-decoration .diamond{
    width:6px;
    height:6px;

    border:
        1px solid
        rgba(100,190,235,.6);

    transform:
        rotate(45deg);
}


/* ================================
   中文标题
================================ */

.cn-title{
    margin-top:22px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:19px;

    letter-spacing:9px;

    font-weight:300;

    color:
        rgba(214,236,250,.82);
}


/* ================================
   描述
================================ */

.description{
    margin-top:18px;

    color:
        rgba(178,209,228,.54);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    line-height:2.1;

    letter-spacing:3px;
}


/* ================================
   进入按钮
================================ */

.enter-button{
    position:relative;

    margin-top:36px;

    padding:
        13px
        42px;

    background:
        rgba(7,28,47,.46);

    border:
        1px solid
        rgba(88,178,232,.45);

    color:
        rgba(214,239,255,.86);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:5px;

    cursor:pointer;

    transition:
        all .35s ease;
}


/* 上下小装饰 */

.enter-button::before,
.enter-button::after{
    content:"";

    position:absolute;

    left:50%;

    width:6px;
    height:6px;

    border:
        1px solid
        rgba(100,190,235,.65);

    transform:
        translateX(-50%)
        rotate(45deg);

    background:#061426;
}

.enter-button::before{
    top:-4px;
}

.enter-button::after{
    bottom:-4px;
}


/* 两侧六芒星 */

.enter-button{
    text-shadow:
        0 0 8px
        rgba(100,190,235,.08);
}

.enter-button:hover{
    background:
        rgba(19,64,92,.38);

    border-color:
        rgba(110,201,247,.72);

    color:
        rgba(235,248,255,.98);

    transform:
        translateY(-2px);
}


/* ================================
   Footer
================================ */

.footer{
    position:absolute;

    left:0;
    bottom:38px;

    width:100%;

    text-align:center;

    z-index:20;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:5px;

    color:
        rgba(132,183,213,.38);
}


/* ================================
   平板
================================ */

@media(max-width:900px){

    .top-nav{
        left:38px;
        right:38px;
    }

    .nav-links{
        gap:20px;
    }

    .main-title .seyami{
        font-size:58px;
    }

    .main-title .archive{
        font-size:72px;
    }

}


/* ================================
   手机
================================ */

@media(max-width:600px){

    .frame{
        inset:14px;
    }

    .top-nav{
        top:30px;

        left:30px;
        right:30px;
    }

    .logo{
        gap:7px;
    }

    .logo-mark{
        font-size:18px;
        top:1px;
    }

    .logo-cn{
        font-size:11px;
        letter-spacing:2px;
    }

    .logo-en{
        font-size:6px;
        letter-spacing:2px;
    }

    .nav-links{
        display:none;
    }


    /* 魔法阵 */

    .magic-circle{
        width:390px;
        height:390px;
    }

    .magic-circle::before{
        width:370px;
        height:370px;
    }

    .magic-circle::after{
        width:280px;
        height:280px;
    }


    /* 手机星轨 */

    .orbit.one{
        width:350px;
        height:133px;
    }

    .orbit.two{
        width:295px;
        height:102px;
    }

    .orbit.three{
        width:235px;
        height:75px;
    }


    .magic-line.horizontal{
        width:350px;
    }

    .magic-line.vertical{
        height:350px;
    }


    /* 标题 */

    .main-title{
        letter-spacing:4px;
    }

    .main-title .seyami{
        font-size:43px;
    }

    .main-title .archive{
        font-size:53px;
        letter-spacing:6px;
    }


    .title-decoration{
        margin-top:22px;
    }

    .title-decoration .line{
        width:55px;
    }


    .cn-title{
        margin-top:18px;

        font-size:14px;

        letter-spacing:5px;
    }


    .description{
        padding:
            0 28px;

        font-size:10px;

        letter-spacing:2px;

        line-height:2;
    }


    .enter-button{
        margin-top:30px;

        padding:
            12px
            30px;

        font-size:10px;

        letter-spacing:3px;
    }


    .footer{
        bottom:25px;

        font-size:6px;

        letter-spacing:3px;
    }


    .corner{
        font-size:18px;
    }

}

</style>

</head>
