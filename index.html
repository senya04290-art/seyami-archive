<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#061426;
    color:#dcecff;
    font-family:"Noto Serif SC",serif;
}

/* =========================
   页面
========================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(30,92,140,.10),
            transparent 42%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(19,65,100,.08),
            transparent 45%
        ),
        #061426;
}

/* =========================
   背景星点
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    color:rgba(166,210,244,.55);
    font-family:serif;
    font-size:8px;
    animation:twinkle 4s ease-in-out infinite;
}

.star:nth-child(1){left:8%;top:17%;animation-delay:.4s;}
.star:nth-child(2){left:17%;top:72%;font-size:6px;animation-delay:1.2s;}
.star:nth-child(3){left:29%;top:11%;font-size:5px;animation-delay:2s;}
.star:nth-child(4){left:72%;top:16%;font-size:6px;animation-delay:.8s;}
.star:nth-child(5){left:86%;top:34%;font-size:5px;animation-delay:1.7s;}
.star:nth-child(6){left:91%;top:70%;font-size:7px;animation-delay:2.6s;}
.star:nth-child(7){left:75%;top:84%;font-size:5px;animation-delay:1.5s;}
.star:nth-child(8){left:31%;top:87%;font-size:7px;animation-delay:3s;}
.star:nth-child(9){left:5%;top:43%;font-size:5px;animation-delay:2.1s;}
.star:nth-child(10){left:94%;top:52%;font-size:6px;animation-delay:.7s;}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.8);
    }

    50%{
        opacity:.9;
        transform:scale(1.25);
    }
}

/* =========================
   浮动魔法符号
========================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.floating-stars span{
    position:absolute;
    color:rgba(103,173,220,.22);
    font-family:serif;
    animation:floatSymbol 7s ease-in-out infinite;
}

.floating-stars span:nth-child(1){
    left:12%;
    top:28%;
    font-size:13px;
}

.floating-stars span:nth-child(2){
    left:81%;
    top:24%;
    font-size:11px;
    animation-delay:1s;
}

.floating-stars span:nth-child(3){
    left:22%;
    top:79%;
    font-size:9px;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:87%;
    top:76%;
    font-size:14px;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(5){
    left:7%;
    top:59%;
    font-size:8px;
    animation-delay:3.2s;
}

@keyframes floatSymbol{
    0%,100%{
        transform:translateY(0) rotate(0deg);
        opacity:.15;
    }

    50%{
        transform:translateY(-8px) rotate(12deg);
        opacity:.4;
    }
}

/* =========================
   页面外框
========================= */

.frame{
    position:absolute;
    inset:16px;
    border:1px solid rgba(94,157,201,.18);
    pointer-events:none;
}

.frame::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(91,150,194,.08);
}

/* =========================
   四角六芒星
========================= */

.corner{
    position:absolute;
    color:rgba(101,176,225,.38);
    font-size:18px;
    font-family:serif;
    z-index:4;
    pointer-events:none;
}

.corner.tl{
    left:27px;
    top:25px;
}

.corner.tr{
    right:27px;
    top:25px;
}

.corner.bl{
    left:27px;
    bottom:25px;
}

.corner.br{
    right:27px;
    bottom:25px;
}

/* =========================
   顶部
========================= */

.header{
    position:absolute;
    top:35px;
    left:44px;
    right:44px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:10;
}

.logo{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.logo-main{
    display:flex;
    align-items:center;
    gap:8px;

    font-family:"Noto Serif SC",serif;
    font-size:13px;
    font-weight:400;
    letter-spacing:4px;

    color:rgba(203,229,247,.82);
}

.logo-symbol{
    font-family:serif;
    font-size:15px;
    color:rgba(108,179,226,.65);
}

.logo-en{
    margin-left:23px;

    font-family:"Cinzel",serif;
    font-size:7px;
    letter-spacing:3px;

    color:rgba(112,167,204,.48);
}

.nav{
    display:flex;
    gap:28px;

    font-family:"Noto Serif SC",serif;
    font-size:8px;
    letter-spacing:3px;

    color:rgba(170,204,228,.52);
}

.nav span{
    cursor:pointer;
    transition:.3s ease;
}

.nav span:hover{
    color:rgba(209,235,255,.9);
}

/* =========================
   主区域
========================= */

.main{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:3;
}

/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;

    width:540px;
    height:540px;

    left:50%;
    top:50%;

    transform:translate(-50%,-51%);

    opacity:.55;
    pointer-events:none;
}

.magic-circle .circle{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;
    border:1px solid rgba(72,148,204,.15);
}

.magic-circle .c1{
    width:520px;
    height:520px;
}

.magic-circle .c2{
    width:475px;
    height:475px;
}

.magic-circle .c3{
    width:350px;
    height:350px;

    border-color:rgba(83,160,211,.19);
}

.magic-circle .c4{
    width:245px;
    height:245px;

    border-color:rgba(87,165,216,.23);
}

.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(77,154,208,.12);
}

.magic-circle::before{
    width:390px;
    height:390px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);
}

.magic-circle::after{
    width:275px;
    height:275px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);
}

/* =========================
   三层星轨
========================= */

.orbit-system{
    position:absolute;

    width:560px;
    height:300px;

    left:50%;
    top:50%;

    transform:translate(-50%,-51%);

    pointer-events:none;
}

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    transform-origin:center;
}

.orbit.one{
    width:500px;
    height:190px;

    transform:translate(-50%,-50%);
}

.orbit.two{
    width:420px;
    height:145px;

    transform:translate(-50%,-50%);
}

.orbit.three{
    width:330px;
    height:105px;

    transform:translate(-50%,-50%);
}

.orbit ellipse{
    fill:none;

    stroke:rgba(71,151,205,.23);
    stroke-width:1;
}

.orbit.one ellipse{
    stroke:rgba(71,151,205,.21);
}

.orbit.two ellipse{
    stroke:rgba(78,158,211,.18);
}

.orbit.three ellipse{
    stroke:rgba(86,166,217,.22);
}

/* =========================
   小星辰
========================= */

.travel-star{
    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    margin-left:-6px;
    margin-top:-6px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(190,225,247,.92);

    font-family:serif;
    font-size:10px;

    filter:
        drop-shadow(
            0 0 4px rgba(93,176,226,.7)
        );

    pointer-events:none;
}

.travel-star::after{
    content:"";

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:rgba(197,231,249,.7);

    box-shadow:
        0 0 6px rgba(98,180,229,.8),
        0 0 12px rgba(71,151,205,.3);
}

/* =========================
   标题
========================= */

.title{
    position:relative;
    z-index:5;

    margin-top:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    line-height:.78;

    pointer-events:none;
}

.title .seyami{
    font-family:"Cormorant Garamond",serif;

    font-size:67px;
    font-weight:300;

    letter-spacing:14px;
    text-indent:14px;

    color:rgba(221,238,250,.91);
}

.title .archive{
    margin-top:7px;

    font-family:"Cormorant Garamond",serif;

    font-size:84px;
    font-weight:300;

    letter-spacing:12px;
    text-indent:12px;

    color:rgba(221,238,250,.94);
}

.title-cn{
    position:relative;
    z-index:5;

    margin-top:25px;

    font-family:"Noto Serif SC",serif;
    font-size:11px;
    font-weight:300;

    letter-spacing:7px;
    text-indent:7px;

    color:rgba(184,213,234,.7);
}

.description{
    position:relative;
    z-index:5;

    margin-top:13px;

    text-align:center;

    font-family:"Noto Serif SC",serif;
    font-size:7px;
    line-height:2.2;

    letter-spacing:2px;

    color:rgba(145,181,207,.42);
}

/* =========================
   进入按钮
========================= */

.enter-wrap{
    position:relative;

    width:370px;
    height:82px;

    margin-top:42px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.enter-wrap::before{
    content:"";

    position:absolute;
    inset:0;

    clip-path:polygon(
        0 20%,
        5% 20%,
        8% 0,
        92% 0,
        95% 20%,
        100% 20%,
        100% 80%,
        95% 80%,
        92% 100%,
        8% 100%,
        5% 80%,
        0 80%
    );

    border:1px solid rgba(91,167,218,.38);

    background:rgba(8,28,49,.48);

    box-shadow:
        0 0 22px rgba(39,120,180,.08);

    pointer-events:none;
}

.enter-wrap::after{
    content:"";

    position:absolute;

    left:13px;
    right:13px;
    top:13px;
    bottom:13px;

    border:1px solid rgba(91,164,213,.16);

    pointer-events:none;
}

.enter-button{
    position:relative;
    z-index:2;

    width:300px;
    height:50px;

    border:1px solid rgba(103,176,222,.46);

    background:
        linear-gradient(
            90deg,
            rgba(10,33,55,.65),
            rgba(15,47,73,.42),
            rgba(10,33,55,.65)
        );

    color:rgba(207,231,247,.88);

    font-family:"Noto Serif SC",serif;
    font-size:11px;
    font-weight:300;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease,
        box-shadow .35s ease;
}

.enter-button:hover{
    background:
        linear-gradient(
            90deg,
            rgba(13,45,72,.72),
            rgba(24,65,94,.52),
            rgba(13,45,72,.72)
        );

    border-color:rgba(112,190,237,.7);

    color:rgba(231,244,252,.98);

    box-shadow:
        0 0 20px rgba(55,146,202,.12);
}

/* =========================
   ✡
========================= */

.enter-star{
    position:absolute;

    z-index:3;

    top:50%;

    transform:translateY(-50%);

    color:rgba(91,169,219,.62);

    font-size:13px;
    font-family:serif;

    pointer-events:none;
}

.enter-star.left{
    left:18px;
}

.enter-star.right{
    right:18px;
}

/* =========================
   Footer
========================= */

.footer{
    position:absolute;

    left:50%;
    bottom:27px;

    transform:translateX(-50%);

    z-index:5;

    white-space:nowrap;

    font-family:"Cinzel",serif;
    font-size:7px;

    letter-spacing:3px;

    color:rgba(103,158,194,.38);
}

/* =====================================================
   手机端
===================================================== */

@media(max-width:520px){

    .frame{

    }

    .corner.tr{
        right:19px;
        top:18px;
    }

    .corner.bl{
        left:19px;
        bottom:18px;
    }

    .corner.br{
        right:19px;
        bottom:18px;
    }

    .header{
        top:27px;
        left:27px;
        right:27px;
    }

    .logo-main{
        font-size:10px;

    }

    .nav{

    /* =========================

    .magic-circle{
        width:390px;

    }

    .magic-circle .c1{
        width:375px;
        height:375px;
    }

    .magic-circle .c2{
        width:340px;
        height:340px;
    }

    .magic-circle .c3{
        width:250px;
        height:250px;
    }

    .magic-circle .c4{
        width:175px;
        height:175px;
    }

    .magic-circle::before{
        width:280px;
        height:280px;
    }

    .magic-circle::after{

    }

    /* =========================
       手机端星轨
    ========================= */

    .orbit-system{
        width:400px;

    }

    .orbit.one{
        width:360px;

    }

    .orbit.two{
        width:300px;

    }

    .orbit.three{
        width:235px;

    }

    /* =========================
       手机端标题
    ========================= */

    .title .seyami{

    /* =================================================
       手机端按钮

       ★ 整个框就是 220px
       ★ 外框也就是这 220px

       ★ 所有内容都限制在 220px 内
    ================================================= */

    .enter-wrap{

    }

    /* 外层半透明框：

    }

    /* 中间按钮 */
    .enter-button{
        width:190px;

    /* ✡

    .enter-star.left{

</style>
</head>

<div class="page">

            <svg
                class="orbit one"
                viewBox="0 0 500 190"

            >

                    cx="250"

                xmlns="http://www.w3.org/2000/svg"
            >

                    cx="210"

<script>

/* =====================================================
   三层星轨

   A → A/B → B → B/C → C → C/A → A

   A = 38秒
   B = 32秒
   C = 25秒
===================================================== */

const orbitSystem =
    document.querySelector(".orbit-system");

const travelStar =
    document.querySelector(".travel-star");


const tracks = {

    A:{
        rx:250,
        ry:95,
        rotation:0,
        speed:360/38,
        direction:1
    },

    B:{
        rx:210,
        ry:72.5,
        rotation:55,
        speed:-360/32,
        direction:-1
    },

    C:{
        rx:165,
        ry:52.5,
        rotation:110,
        speed:360/25,
        direction:1
    }

};


/* =====================================================
   三层轨道旋转
===================================================== */

let lastTime =
    performance.now();

let rotationA = 0;
let rotationB = 55;
let rotationC = 110;


function rotateTracks(time){

    const delta =
        (time-lastTime)/1000;

    lastTime = time;


    rotationA +=
        tracks.A.speed * delta;

    rotationB +=
        tracks.B.speed * delta;

    rotationC +=
        tracks.C.speed * delta;


    const orbitA =
        document.querySelector(".orbit.one");

    const orbitB =
        document.querySelector(".orbit.two");

    const orbitC =
        document.querySelector(".orbit.three");


    orbitA.style.transform =
        `translate(-50%,-50%) rotate(${rotationA}deg)`;


    orbitB.style.transform =
        `translate(-50%,-50%) rotate(${rotationB}deg)`;


    orbitC.style.transform =
        `translate(-50%,-50%) rotate(${rotationC}deg)`;


    requestAnimationFrame(
        rotateTracks
    );

}

requestAnimationFrame(
    rotateTracks
);


/* =====================================================
   小星辰路线
===================================================== */

const route = [

    {
        track:"A",
        start:0,
        end:1
    },

    {
        track:"AB",
        start:0,
        end:1
    },

    {
        track:"B",
        start:0,
        end:1
    },

    {
        track:"BC",
        start:0,
        end:1
    },

    {
        track:"C",
        start:0,
        end:1
    },

    {
        track:"CA",
        start:0,
        end:1
    }

];


let routeIndex = 0;

let routeProgress = 0;

const routeDuration = 9000;

let routeStart =
    performance.now();


/* =====================================================
   角度转弧度
===================================================== */

function degToRad(deg){

    return deg * Math.PI / 180;

}


/* =====================================================
   椭圆坐标
===================================================== */

function ellipsePoint(
    rx,
    ry,
    angle
){

    const rad =
        degToRad(angle);


    return {

        x:
            rx *
            Math.cos(rad),

        y:
            ry *
            Math.sin(rad)

    };

}


/* =====================================================
   旋转坐标
===================================================== */

function rotatePoint(
    x,
    y,
    deg
){

    const rad =
        degToRad(deg);


    return {

        x:
            x *
            Math.cos(rad)
            -
            y *
            Math.sin(rad),

        y:
            x *
            Math.sin(rad)
            +
            y *
            Math.cos(rad)

    };

}


/* =====================================================
   获取轨道上的位置
===================================================== */

function getTrackPoint(
    name,
    t
){

    let track;


    if(name==="A"){

        track =
            tracks.A;


        const p =
            ellipsePoint(
                track.rx,
                track.ry,
                t*360
            );


        return rotatePoint(
            p.x,
            p.y,
            rotationA
        );

    }


    if(name==="B"){

        track =
            tracks.B;


        const p =
            ellipsePoint(
                track.rx,
                track.ry,
                t*360
            );


        return rotatePoint(
            p.x,
            p.y,
            rotationB
        );

    }


    if(name==="C"){

        track =
            tracks.C;


        const p =
            ellipsePoint(
                track.rx,
                track.ry,
                t*360
            );


        return rotatePoint(
            p.x,
            p.y,
            rotationC
        );

    }


    return {
        x:0,
        y:0
    };

}


/* =====================================================
   轨道之间连接
===================================================== */

function getTransitionPoint(
    type,
    t
){

    let p1;
    let p2;


    if(type==="AB"){

        p1 =
            getTrackPoint(
                "A",
                0
            );

        p2 =
            getTrackPoint(
                "B",
                0
            );

    }

    else if(type==="BC"){

        p1 =
            getTrackPoint(
                "B",
                0
            );

        p2 =
            getTrackPoint(
                "C",
                0
            );

    }

    else{

        p1 =
            getTrackPoint(
                "C",
                0
            );

        p2 =
            getTrackPoint(
                "A",
                0
            );

    }


    return {

        x:
            p1.x +
            (p2.x-p1.x) *
            t,

        y:
            p1.y +
            (p2.y-p1.y) *
            t

    };

}


/* =====================================================
   小星辰动画
===================================================== */

function animateStar(now){

    const elapsed =
        now-routeStart;


    routeProgress =
        Math.min(
            elapsed/routeDuration,
            1
        );


    const current =
        route[routeIndex];


    let point;


    if(
        current.track==="A" ||
        current.track==="B" ||
        current.track==="C"
    ){

        point =
            getTrackPoint(
                current.track,
                routeProgress
            );

    }

    else{

        point =
            getTransitionPoint(
                current.track,
                routeProgress
            );

    }


    travelStar.style.transform =
        `translate(${point.x}px,${point.y}px)`;


    if(routeProgress>=1){

        routeIndex++;


        if(
            routeIndex>=route.length
        ){

            routeIndex=0;

        }


        routeStart =
            now;

    }


    requestAnimationFrame(
        animateStar
    );

}


requestAnimationFrame(
    animateStar
);

</script>
