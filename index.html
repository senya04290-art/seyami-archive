<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;
    overflow-x:hidden;
    font-family:"Cormorant Garamond","Noto Serif SC",serif;
}


/* =========================
   页面背景
========================= */

.page{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;
}


/* =========================
   背景星尘
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:-20%;

    background-image:
        radial-gradient(
            circle,
            rgba(182,220,255,.7) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(130,191,239,.45) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(220,240,255,.35) 0 1px,
            transparent 1.5px
        );

    background-size:
        180px 180px,
        240px 240px,
        310px 310px;

    background-position:
        20px 30px,
        80px 120px,
        150px 70px;

    opacity:.45;

    animation:starMove 35s linear infinite;
}

.stars::after{
    opacity:.22;
    transform:scale(1.15);
    animation-duration:50s;
}

@keyframes starMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-80px,50px,0);
    }

}


/* =========================
   浮动星星
========================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.floating-stars span{
    position:absolute;

    color:rgba(158,207,247,.62);

    font-family:serif;
    font-size:14px;

    text-shadow:
        0 0 8px rgba(96,177,242,.5);

    animation:
        floatStar 6s ease-in-out infinite;
}

.floating-stars span:nth-child(1){
    left:12%;
    top:24%;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:20%;
    top:67%;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(3){
    left:77%;
    top:22%;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:84%;
    top:70%;
    animation-delay:1s;
}

.floating-stars span:nth-child(5){
    left:30%;
    top:17%;
    animation-delay:3s;
}

.floating-stars span:nth-child(6){
    left:71%;
    top:61%;
    animation-delay:2s;
}

.floating-stars span:nth-child(7){
    left:16%;
    top:46%;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:89%;
    top:43%;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(9){
    left:42%;
    top:11%;
    animation-delay:2.2s;
}

.floating-stars span:nth-child(10){
    left:57%;
    top:83%;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(11){
    left:7%;
    top:78%;
    animation-delay:1.2s;
}

.floating-stars span:nth-child(12){
    left:94%;
    top:18%;
    animation-delay:4.2s;
}

@keyframes floatStar{

    0%,
    100%{
        opacity:.35;
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        opacity:.85;
        transform:
            translateY(-8px)
            rotate(12deg);
    }

}


/* =========================
   外框
========================= */

.frame{
    position:absolute;
    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;
    z-index:10;
}

.frame::before{
    content:"";

    position:absolute;
    inset:7px;

    border:
        1px solid
        rgba(81,142,193,.08);
}


/* =========================
   四角六芒星
========================= */

.corner{
    position:absolute;

    width:68px;
    height:68px;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.corner::before{
    content:"✡";

    display:block;

    font-family:"Times New Roman",serif;

    /* 放大 */
    font-size:31px;

    font-weight:400;
    line-height:1;

    color:rgba(108,178,230,.88);

    text-shadow:
        0 0 5px rgba(67,153,218,.5),
        0 0 13px rgba(43,124,190,.28);
}

.corner.tl{
    left:-34px;
    top:-34px;
}

.corner.tr{
    right:-34px;
    top:-34px;
}

.corner.bl{
    left:-34px;
    bottom:-34px;
}

.corner.br{
    right:-34px;
    bottom:-34px;
}


/* =========================
   顶部导航
========================= */

.top-nav{
    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    z-index:20;
}


/* =========================
   左上角 Logo
========================= */

.logo{
    display:flex;

    align-items:center;

    gap:10px;

    color:#d9edff;
}


/*
   ✶

   不再给它固定方框，
   这样它会直接和中文文字对齐
*/

.logo-mark{
    width:auto;
    height:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    font-family:"Times New Roman",serif;

    font-size:21px;
    font-weight:400;

    line-height:1;

    color:rgba(137,201,239,.9);

    /*
       微调垂直位置
    */
    transform:translateY(-1px);

    text-shadow:
        0 0 7px rgba(76,159,216,.5),
        0 0 15px rgba(49,132,191,.22);
}

.logo-text{
    display:flex;
    flex-direction:column;

    line-height:1.05;
}

.logo-cn{
    font-family:"Noto Serif SC",serif;

    font-size:15px;
    font-weight:400;

    letter-spacing:2px;
}

.logo-en{
    margin-top:5px;

    font-family:"Cinzel",serif;

    font-size:8px;
    letter-spacing:3px;

    color:rgba(157,204,239,.63);
}


/* =========================
   导航
========================= */

.nav-links{
    display:flex;

    align-items:center;

    gap:31px;
}

.nav-links a{
    position:relative;

    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:"Noto Serif SC",serif;

    font-size:12px;

    letter-spacing:2px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.nav-links a::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-8px;

    width:0;
    height:1px;

    background:rgba(122,192,235,.7);

    transform:translateX(-50%);

    transition:width .3s ease;
}

.nav-links a:hover{
    color:#d9efff;

    text-shadow:
        0 0 8px rgba(102,180,231,.35);
}

.nav-links a:hover::after{
    width:100%;
}


/* =========================
   主区域
========================= */

.main{
    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:5;

    padding:
        80px
        20px
        70px;
}


/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    opacity:.55;
}


/* 外圈 */

.magic-circle::before{
    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.28);

    box-shadow:
        0 0 22px
        rgba(47,126,184,.08);

    animation:
        rotateCircle
        80s
        linear
        infinite;
}


/* 内圈 */

.magic-circle::after{
    content:"";

    position:absolute;

    inset:27px;

    border-radius:50%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        inset 0 0 20px
        rgba(62,139,194,.04);

    animation:
        rotateCircleReverse
        55s
        linear
        infinite;
}

@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* =========================
   星轨
========================= */

/*
   这里是这次重点修复。

   原本的星轨在动画过程中
   会从 0° 开始，所以视觉上的
   交叉角度会消失。

   现在让每一条星轨：
   1. 保持原本角度
   2. 自己缓慢旋转
   3. 正反方向交替
*/


.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:
        1px solid
        rgba(94,165,214,.18);

    transform-origin:center center;

    pointer-events:none;
}


/* 第一条 */

.orbit-1{
    width:470px;
    height:170px;

    transform:
        translate(-50%,-50%)
        rotate(25deg);

    animation:
        orbitSpin1
        55s
        linear
        infinite;
}


/* 第二条 */

.orbit-2{
    width:470px;
    height:170px;

    transform:
        translate(-50%,-50%)
        rotate(-25deg);

    animation:
        orbitSpin2
        72s
        linear
        infinite;
}


/* 第三条 */

.orbit-3{
    width:430px;
    height:230px;

    transform:
        translate(-50%,-50%)
        rotate(65deg);

    animation:
        orbitSpin3
        64s
        linear
        infinite;
}


/* 第四条 */

.orbit-4{
    width:430px;
    height:230px;

    transform:
        translate(-50%,-50%)
        rotate(-65deg);

    animation:
        orbitSpin4
        82s
        linear
        infinite;
}


/* 第一条顺时针 */

@keyframes orbitSpin1{

    from{
        transform:
            translate(-50%,-50%)
            rotate(25deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(385deg);
    }

}


/* 第二条逆时针 */

@keyframes orbitSpin2{

    from{
        transform:
            translate(-50%,-50%)
            rotate(-25deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-385deg);
    }

}


/* 第三条顺时针 */

@keyframes orbitSpin3{

    from{
        transform:
            translate(-50%,-50%)
            rotate(65deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(425deg);
    }

}


/* 第四条逆时针 */

@keyframes orbitSpin4{

    from{
        transform:
            translate(-50%,-50%)
            rotate(-65deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-425deg);
    }

}


/* =========================
   魔法阵十字线
========================= */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(92,164,213,.13);
}

.magic-line.horizontal{
    width:490px;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:490px;
}


/* =========================
   魔法阵中心
========================= */

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(133,202,242,.48);

    border-radius:50%;

    box-shadow:
        0 0 10px
        rgba(88,171,224,.25);
}

.magic-center::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(174,221,249,.7);

    box-shadow:
        0 0 8px
        rgba(126,203,244,.8);
}


/* =========================
   标题
========================= */

.title-area{
    position:relative;

    text-align:center;

    z-index:8;

    margin-top:-18px;
}

.main-title{
    display:flex;

    flex-direction:column;

    align-items:center;

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        serif;

    font-weight:400;

    line-height:.83;

    letter-spacing:8px;

    color:#dceeff;

    text-shadow:
        0 0 18px
        rgba(94,172,222,.08);
}

.main-title .seyami{
    font-size:70px;
}

.main-title .archive{
    margin-top:15px;

    font-size:87px;

    letter-spacing:9px;
}


/* =========================
   标题装饰
========================= */

.title-decoration{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:15px;

    margin-top:29px;

    opacity:.7;
}

.title-decoration .line{
    width:95px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(115,182,224,.62)
        );
}

.title-decoration .line.right{
    background:
        linear-gradient(
            90deg,
            rgba(115,182,224,.62),
            transparent
        );
}

.title-decoration .diamond{
    width:6px;
    height:6px;

    border:
        1px solid
        rgba(143,202,237,.8);

    transform:rotate(45deg);
}


/* =========================
   中文标题
========================= */

.chinese-title{
    margin-top:24px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:8px;

    color:
        rgba(207,229,246,.86);
}


/* =========================
   描述文字
========================= */

.description{
    margin-top:20px;

    display:flex;

    flex-direction:column;

    gap:7px;

    text-align:center;

    color:
        rgba(177,207,230,.62);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    line-height:1.7;

    letter-spacing:2px;
}


/* =========================
   进入按钮
========================= */

.enter-wrap{
    position:relative;

    width:370px;
    height:82px;

    margin-top:42px;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* 外层魔法边框 */

.enter-wrap::before{
    content:"";

    position:absolute;

    inset:0;

    clip-path:
        polygon(
            0 20%,
            5% 20%,
            8% 0,
            92% 0,
            95% 20%,
            100% 20%,
            100% 80%,
            95% 80%,
            92% 100%,
            8% 100%,
            5% 80%,
            0 80%
        );

    border:
        1px solid
        rgba(91,167,218,.38);

    background:
        rgba(8,28,49,.48);

    box-shadow:
        0 0 22px
        rgba(39,120,180,.08);

    pointer-events:none;
}


/* 内框 */

.enter-wrap::after{
    content:"";

    position:absolute;

    left:13px;
    right:13px;

    top:13px;
    bottom:13px;

    border:
        1px solid
        rgba(91,164,213,.16);

    pointer-events:none;
}


/* 按钮 */

.enter-button{
    position:relative;

    z-index:2;

    width:300px;
    height:50px;

    border:none;
    outline:none;

    cursor:pointer;

    color:#d9edff;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    border-top:
        1px solid
        rgba(105,180,225,.38);

    border-bottom:
        1px solid
        rgba(105,180,225,.38);

    transition:
        background .35s ease,
        box-shadow .35s ease,
        letter-spacing .35s ease;
}

.enter-button:hover{

    background:
        linear-gradient(
            90deg,
            rgba(10,41,67,.95),
            rgba(23,66,98,.95),
            rgba(10,41,67,.95)
        );

    box-shadow:
        0 0 22px
        rgba(56,143,201,.18);

    letter-spacing:5px;
}

.enter-button:active{
    transform:translateY(1px);
}


/* 按钮两侧星星 */

.enter-star{
    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    color:
        rgba(111,186,229,.75);

    font-size:16px;

    text-shadow:
        0 0 9px
        rgba(67,158,215,.45);
}

.enter-star.left{
    left:26px;
}

.enter-star.right{
    right:26px;
}


/* 按钮上下菱形 */

.enter-diamond{
    position:absolute;

    left:50%;

    width:6px;
    height:6px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border:
        1px solid
        rgba(116,187,226,.65);

    background:#061426;
}

.enter-diamond.top{
    top:-3px;
}

.enter-diamond.bottom{
    bottom:-3px;
}


/* =========================
   页脚
========================= */

.footer{
    position:absolute;

    left:50%;
    bottom:32px;

    transform:
        translateX(-50%);

    z-index:15;

    color:
        rgba(133,177,207,.38);

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    white-space:nowrap;
}


/* =========================
   平板 / 小屏
========================= */

@media(max-width:800px){

    .top-nav{
        left:35px;
        right:35px;
        top:30px;
    }

    .nav-links{
        gap:17px;
    }

    .nav-links a{
        font-size:11px;
        letter-spacing:1px;
    }

    .magic-circle{
        width:500px;
        height:500px;
    }

    .main-title .seyami{
        font-size:58px;
    }

    .main-title .archive{
        font-size:70px;
    }

    .chinese-title{
        font-size:18px;
    }

    .description{
        font-size:11px;
    }

}


/* =========================
   手机
========================= */

@media(max-width:520px){

    .frame{
        inset:12px;
    }

    .top-nav{
        left:25px;
        right:25px;
        top:24px;
    }

    .logo{
        gap:8px;
    }


    /* 手机端 ✶ */

    .logo-mark{
        width:auto;
        height:auto;

        font-size:18px;

        transform:
            translateY(-1px);
    }


    .logo-cn{
        font-size:12px;
        letter-spacing:1px;
    }

    .logo-en{
        font-size:6px;
        letter-spacing:2px;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:9px;
        letter-spacing:0;
    }


    /* 手机端四角 */

    .corner{
        width:55px;
        height:55px;
    }

    .corner.tl{
        left:-27.5px;
        top:-27.5px;
    }

    .corner.tr{
        right:-27.5px;
        top:-27.5px;
    }

    .corner.bl{
        left:-27.5px;
        bottom:-27.5px;
    }

    .corner.br{
        right:-27.5px;
        bottom:-27.5px;
    }

    .corner::before{
        font-size:26px;
    }


    /* 手机主区域 */

    .main{
        padding:
            100px
            15px
            70px;
    }


    /* 手机魔法阵 */

    .magic-circle{
        width:390px;
        height:390px;

        opacity:.48;
    }


    /* 手机星轨 */

    .orbit-1,
    .orbit-2{
        width:330px;
        height:120px;
    }

    .orbit-3,
    .orbit-4{
        width:310px;
        height:165px;
    }


    /* 手机十字线 */

    .magic-line.horizontal{
        width:350px;
    }

    .magic-line.vertical{
        height:350px;
    }


    /* 手机标题 */

    .main-title{
        letter-spacing:5px;
    }

    .main-title .seyami{
        font-size:43px;
    }

    .main-title .archive{
        margin-top:11px;

        font-size:53px;

        letter-spacing:6px;
    }


    /* 手机装饰 */

    .title-decoration{
        margin-top:23px;
    }

    .title-decoration .line{
        width:55px;
    }


    /* 手机中文 */

    .chinese-title{
        margin-top:20px;

        font-size:15px;

        letter-spacing:5px;
    }


    /* 手机描述 */

    .description{
