<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dceeff;
    overflow-x:hidden;
    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    position:relative;
    min-height:100vh;
    width:100%;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(35,92,135,.13),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(18,53,88,.16),
            transparent 65%
        ),
        #061426;
}


/* =========================================================
   BACKGROUND STARS
========================================================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    color:rgba(180,220,255,.7);
    font-size:8px;
    animation:
        starFloat 5s ease-in-out infinite alternate;
}

@keyframes starFloat{
    from{
        opacity:.25;
        transform:translateY(0) scale(.85);
    }
    to{
        opacity:.85;
        transform:translateY(-7px) scale(1);
    }
}


/* =========================================================
   FLOATING DECORATIVE STARS
========================================================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.floating-stars span{
    position:absolute;
    color:rgba(177,216,246,.42);
    font-family:serif;
    animation:
        floatStar 7s ease-in-out infinite alternate;
}

.floating-stars .s1{
    top:18%;
    left:13%;
    font-size:12px;
}

.floating-stars .s2{
    top:29%;
    right:16%;
    font-size:9px;
    animation-delay:1s;
}

.floating-stars .s3{
    bottom:27%;
    left:18%;
    font-size:8px;
    animation-delay:2s;
}

.floating-stars .s4{
    bottom:18%;
    right:12%;
    font-size:13px;
    animation-delay:3s;
}

.floating-stars .s5{
    top:42%;
    left:8%;
    font-size:7px;
    animation-delay:1.5s;
}

.floating-stars .s6{
    top:48%;
    right:8%;
    font-size:7px;
    animation-delay:2.5s;
}

@keyframes floatStar{
    from{
        opacity:.18;
        transform:translateY(0) rotate(0deg);
    }
    to{
        opacity:.65;
        transform:translateY(-9px) rotate(8deg);
    }
}


/* =========================================================
   FRAME
   「星轨外层＋封印结界」
========================================================= */

.frame{
    position:absolute;
    inset:22px;
    z-index:5;
    pointer-events:none;

    border:1px solid rgba(116,177,215,.28);
}


/* 内侧第二层结界线 */

.frame::before{
    content:"";
    position:absolute;
    inset:7px;

    border:1px solid rgba(103,164,204,.12);

    clip-path:
        polygon(
            0 0,
            36% 0,
            39% 2px,
            61% 2px,
            64% 0,
            100% 0,
            100% 36%,
            calc(100% - 2px) 39%,
            calc(100% - 2px) 61%,
            100% 64%,
            100% 100%,
            64% 100%,
            61% calc(100% - 2px),
            39% calc(100% - 2px),
            36% 100%,
            0 100%,
            0 64%,
            2px 61%,
            2px 39%,
            0 36%
        );
}


/* 外层断续魔法线 */

.frame::after{
    content:"";
    position:absolute;
    inset:-7px;

    border:1px solid rgba(101,170,215,.16);

    clip-path:
        polygon(
            0 0,
            23% 0,
            25% 2px,
            39% 2px,
            41% 0,
            59% 0,
            61% 2px,
            75% 2px,
            77% 0,
            100% 0,

            100% 23%,
            calc(100% - 2px) 25%,
            calc(100% - 2px) 39%,
            100% 41%,
            100% 59%,
            calc(100% - 2px) 61%,
            calc(100% - 2px) 75%,
            100% 77%,
            100% 100%,

            77% 100%,
            75% calc(100% - 2px),
            61% calc(100% - 2px),
            59% 100%,
            41% 100%,
            39% calc(100% - 2px),
            25% calc(100% - 2px),
            23% 100%,
            0 100%,

            0 77%,
            2px 75%,
            2px 61%,
            0 59%,
            0 41%,
            2px 39%,
            2px 25%,
            0 23%
        );
}


/* =========================================================
   SIX-POINTED STARS
========================================================= */

.corner{
    position:absolute;
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(152,207,240,.75);
    font-size:19px;

    text-shadow:
        0 0 12px rgba(93,177,225,.22);
}

.corner::before{
    content:"";
    position:absolute;
    width:31px;
    height:31px;

    border:1px solid rgba(102,169,211,.18);

    transform:rotate(45deg);
}

.corner::after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;

    border:1px solid rgba(125,190,225,.12);

    transform:rotate(45deg);
}

.corner.tl{
    top:-13px;
    left:-13px;
}

.corner.tr{
    top:-13px;
    right:-13px;
}

.corner.bl{
    bottom:-13px;
    left:-13px;
}

.corner.br{
    bottom:-13px;
    right:-13px;
}


/* =========================================================
   MAGIC NODES ON FRAME
========================================================= */

.frame-node{
    position:absolute;
    width:7px;
    height:7px;

    border:1px solid rgba(133,196,232,.65);

    transform:rotate(45deg);

    background:#061426;

    box-shadow:
        0 0 7px rgba(92,177,225,.18);
}


/* top */

.frame-node.n1{
    top:-4px;
    left:27%;
}

.frame-node.n2{
    top:-4px;
    left:50%;
}

.frame-node.n3{
    top:-4px;
    right:27%;
}


/* right */

.frame-node.n4{
    right:-4px;
    top:27%;
}

.frame-node.n5{
    right:-4px;
    top:50%;
}

.frame-node.n6{
    right:-4px;
    bottom:27%;
}


/* bottom */

.frame-node.n7{
    bottom:-4px;
    left:27%;
}

.frame-node.n8{
    bottom:-4px;
    right:27%;
}


/* =========================================================
   TOP NAV
========================================================= */

.top-nav{
    position:relative;
    z-index:20;

    width:100%;
    padding:
        38px 58px 0;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;
}


/* logo */

.logo{
    display:flex;
    flex-direction:column;
    align-items:flex-start;

    color:#dceeff;
}

.logo-symbol{
    font-size:20px;
    line-height:1;
    margin-bottom:5px;
    color:#9ed4f2;
}

.logo-cn{
    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;
    letter-spacing:3px;

    color:rgba(221,239,255,.88);
}

.logo-en{
    margin-top:2px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;
    letter-spacing:3px;

    color:rgba(147,194,222,.65);
}


/* nav links */

.nav-links{
    display:flex;
    gap:30px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;
    letter-spacing:2px;

    color:rgba(201,225,244,.68);
}

.nav-links span{
    cursor:pointer;
    transition:
        color .3s ease,
        opacity .3s ease;
}

.nav-links span:hover{
    color:#dceeff;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    position:relative;
    z-index:10;

    min-height:
        calc(100vh - 100px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:
        40px 20px 100px;
}


/* =========================================================
   MAGIC CIRCLE
========================================================= */

.magic-circle{
    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    opacity:.82;

    pointer-events:none;
}

.magic-circle svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.orbit{
    fill:none;
    stroke:rgba(94,164,207,.23);
    stroke-width:1;
}

.orbit-secondary{
    fill:none;
    stroke:rgba(87,158,203,.13);
    stroke-width:.7;
    stroke-dasharray:3 9;
}

.magic-inner{
    fill:none;
    stroke:rgba(112,179,217,.11);
    stroke-width:.8;
}

.magic-dot{
    fill:#b7e0f8;
    opacity:.7;
}


/* =========================================================
   MAGIC LINES
========================================================= */

.magic-line{
    position:absolute;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(104,174,215,.16),
            transparent
        );

    pointer-events:none;
}

.magic-line.horizontal{
    width:100%;
    height:1px;

    top:50%;
    left:0;
}

.magic-line.vertical{
    width:1px;
    height:100%;

    left:50%;
    top:0;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(104,174,215,.13),
            transparent
        );
}

.magic-center{
    position:absolute;

    width:5px;
    height:5px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border:1px solid rgba(174,219,244,.7);
}


/* =========================================================
   TITLE AREA
========================================================= */

.title-area{
    position:relative;
    z-index:12;

    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================================================
   MAIN TITLE
========================================================= */

.main-title{
    position:relative;

    width:100%;
    max-width:100%;

    height:87px;

    margin-left:auto;
    margin-right:auto;

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        serif;

    font-weight:400;

    line-height:1;

    letter-spacing:8px;

    color:#dceeff;

    text-align:center;

    text-shadow:
        0 0 18px
        rgba(94,172,222,.08);
}


.main-title .seyami{
    position:absolute;

    right:50%;

    margin-right:20px;

    font-size:87px;

    white-space:nowrap;
}


.main-title .archive{
    position:absolute;

    left:50%;

    margin-left:20px;
    margin-top:0;

    font-size:87px;

    letter-spacing:9px;

    white-space:nowrap;
}


/* =========================================================
   TITLE DECORATION
========================================================= */

.title-decoration{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    margin-top:17px;

    color:rgba(135,193,225,.55);

    font-size:11px;
}

.title-decoration .line{
    width:68px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(117,181,217,.48)
        );
}

.title-decoration .line.right{
    background:
        linear-gradient(
            90deg,
            rgba(117,181,217,.48),
            transparent
        );
}


/* =========================================================
   CHINESE TITLE
========================================================= */

.chinese-title{
    margin-top:24px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:16px;

    letter-spacing:8px;

    color:
        rgba(221,239,255,.88);
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
    margin-top:14px;

    text-align:center;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:11px;

    line-height:2;

    letter-spacing:2px;

    color:
        rgba(173,202,222,.58);
}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter-wrap{
    position:relative;

    width:370px;
    height:82px;

    margin:42px auto 0;

    display:flex;

    align-items:center;
    justify-content:center;
}


.enter-button{
    position:relative;

    width:100%;
    height:58px;

    border:1px solid rgba(112,181,220,.42);

    background:
        rgba(7,25,43,.38);

    color:#dceeff;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}


.enter-button::before,
.enter-button::after{
    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border:1px solid rgba(127,194,229,.65);
}

.enter-button::before{
    top:-5px;
    left:-5px;

    border-right:0;
    border-bottom:0;
}

.enter-button::after{
    bottom:-5px;
    right:-5px;

    border-left:0;
    border-top:0;
}


.enter-button:hover{
    background:
        rgba(27,67,99,.28);

    border-color:
        rgba(145,211,241,.68);

    box-shadow:
        0 0 22px
        rgba(76,159,210,.11);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    position:absolute;

    z-index:20;

    bottom:28px;

    left:50%;

    transform:
        translateX(-50%);

    width:100%;

    text-align:center;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    color:
        rgba(128,177,208,.46);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .top-nav{
        padding:
            30px 30px 0;
    }

    .nav-links{
        gap:18px;
        font-size:10px;
    }

    .magic-circle{
        width:500px;
        height:500px;
    }

    .main-title{
        width:max-content;
        max-width:calc(100vw - 40px);
        margin-left:auto;
        margin-right:auto;

        flex-direction:row;
        align-items:baseline;
    }

    .main-title .seyami{
        font-size:58px;
    }

    .main-title .archive{
        margin-top:0;
        margin-left:14px;
        font-size:70px;
    }

}


@media(max-width:520px){

    .frame{
        inset:14px;
    }

    .frame::before{
        inset:5px;
    }

    .frame::after{
        inset:-5px;
    }

    .top-nav{
        padding:
            25px 23px 0;
    }

    .logo-symbol{
        font-size:17px;
    }

    .logo-cn{
        font-size:11px;
        letter-spacing:2px;
    }

    .logo-en{
        font-size:7px;
        letter-spacing:2px;
    }

    .nav-links{
        gap:11px;
        font-size:9px;
        letter-spacing:1px;
    }

    .main{
        min-height:
            calc(100vh - 80px);

        padding:
            30px 15px 90px;
    }

    .magic-circle{
        width:390px;
        height:390px;
    }


    .main-title{
        width:auto;
        max-width:none;

        margin-left:0;
        margin-right:0;

        flex-direction:column;

        align-items:center;
        justify-content:center;

        letter-spacing:5px;

        line-height:.88;

        height:auto;
    }


    .main-title .seyami{
        position:static;

        margin-right:0;

        font-size:43px;

        white-space:nowrap;
    }


    .main-title .archive{
        position:static;

        margin-top:3px;
        margin-left:0;

        font-size:53px;

        letter-spacing:6px;

        white-space:nowrap;
    }


    .title-decoration{
        margin-top:18px;
        gap:8px;
    }

    .title-decoration .line{
        width:43px;
    }

    .chinese-title{
        margin-top:21px;

        font-size:13px;

        letter-spacing:5px;
    }

    .description{
        margin-top:12px;

        font-size:9px;

        line-height:2.1;

        letter-spacing:1px;

        padding:0 15px;
    }

    .enter-wrap{
        width:285px;
        height:76px;

        margin-top:35px;
    }

    .enter-button{
        height:54px;

        font-size:11px;

        letter-spacing:3px;
    }

    footer{
        bottom:20px;

        font-size:7px;

        letter-spacing:3px;
    }

}


@media(max-width:360px){

    .nav-links{
        gap:8px;
        font-size:8px;
    }

    .main-title .seyami{
        font-size:39px;
    }

    .main-title .archive{
        font-size:48px;
        margin-top:2px;
    }

    .magic-circle{
        width:350px;
        height:350px;
    }

    .enter-wrap{
        width:260px;
    }

}


/* =========================================================
   ORBIT ANIMATION
========================================================= */

#travellingStar{
    filter:
        drop-shadow(
            0 0 4px
            rgba(140,211,245,.75)
        );
}

#starGlow{
    opacity:.45;
}

</style>
</head>

        <!-- MAGIC CROSS -->

<script>

/* =========================================================
   TRUE ORBIT SYSTEM
========================================================= */

const CX = 280;
const CY = 280;


/*
    三层轨道

    A : 38 秒
    B : 32 秒
    C : 25 秒
*/

const tracks = {

    A:{
        rx:250,
        ry:95,
        base:0,
        speed:360/38,
        dir:1
    },

    B:{
        rx:210,
        ry:72.5,
        base:55,
        speed:-360/32,
        dir:-1
    },

    C:{
        rx:165,
        ry:52.5,
        base:110,
        speed:360/25,
        dir:1
    }

};


/*
    A → A/B → B → B/C → C → C/A → A
*/

const route = [
    ["A","B"],
    ["B","C"],
    ["C","A"]
];


let currentTrack = "A";

let currentAngle = 0;

let transitionIndex = 0;

let transitionProgress = 0;

let inTransition = false;


/* =========================================================
   ELLIPSE POSITION
========================================================= */

function ellipsePoint(track, angle){

    const t = tracks[track];

    const rad =
        (angle + t.base) *
        Math.PI / 180;

    return {

        x:
            CX +
            t.rx *
            Math.cos(rad),

        y:
            CY +
            t.ry *
            Math.sin(rad)

    };

}


/* =========================================================
   INTERSECTION SEARCH
========================================================= */

function findIntersection(a,b){

    let best = null;

    let minDistance = Infinity;

    for(
        let i=0;
        i<720;
        i++
    ){

        const angle =
            i *
            .5;

        const p1 =
            ellipsePoint(a,angle);

        const p2 =
            ellipsePoint(b,angle);

        const dx =
            p1.x-p2.x;

        const dy =
            p1.y-p2.y;

        const d =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        if(d<minDistance){

            minDistance=d;

            best={
                a:angle,
                b:angle
            };

        }

    }

    return best;

}


/* =========================================================
   ROUTE INTERSECTIONS
========================================================= */

const intersections = {

    AB:
        findIntersection("A","B"),

    BC:
        findIntersection("B","C"),

    CA:
        findIntersection("C","A")

};


/* =========================================================
   STAR
========================================================= */

const travellingStar =
    document.getElementById(
        "travellingStar"
    );

const starGlow =
    document.getElementById(
        "starGlow"
    );


let lastTime =
    performance.now();


let globalDistance = 0;

const STAR_SPEED = 11;


/* =========================================================
   NORMAL TRACK MOTION
========================================================= */

function moveOnTrack(
    track,
    delta
){

    const t =
        tracks[track];

    currentAngle +=
        t.speed *
        delta /
        1000;

}


/* =========================================================
   STAR POSITION
========================================================= */

function updateStar(){

    const p =
        ellipsePoint(
            currentTrack,
            currentAngle
        );

    travellingStar.setAttribute(
        "x",
        p.x
    );

    travellingStar.setAttribute(
        "y",
        p.y
    );

    starGlow.setAttribute(
        "cx",
        p.x
    );

    starGlow.setAttribute(
        "cy",
        p.y
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(time){

    const delta =
        time-lastTime;

    lastTime=time;


    moveOnTrack(
        currentTrack,
        delta
    );


    updateStar();


    requestAnimationFrame(
        animate
    );

}


updateStar();

requestAnimationFrame(
    animate
);

</script>
