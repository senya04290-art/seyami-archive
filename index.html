<script>

/* =========================================================
   SEYAMI ARCHIVE
   三重动态星轨 · 平滑换轨系统

   A：38 秒 / 顺时针
   B：32 秒 / 逆时针
   C：25 秒 / 顺时针

   路线：

   A
   ↓
   A / B 交点
   ↓
   B
   ↓
   B / C 交点
   ↓
   C
   ↓
   C / A 交点
   ↓
   A
========================================================= */


(function(){


    /* =====================================================
       DOM
    ===================================================== */

    const star =
        document.getElementById(
            "travellingStar"
        );


    const glow =
        document.getElementById(
            "starGlow"
        );


    const groupA =
        document.getElementById(
            "orbitA"
        );


    const groupB =
        document.getElementById(
            "orbitB"
        );


    const groupC =
        document.getElementById(
            "orbitC"
        );


    if(
        !star ||
        !glow
    ){

        return;

    }


    /* =====================================================
       中心
    ===================================================== */

    const CX = 280;

    const CY = 280;


    /* =====================================================
       三条轨道
    ===================================================== */

    const tracks = [

        {

            id:"A",

            rx:250,

            ry:95,

            rotation:0,

            /*
               38 秒一圈
            */

            speed:
                360 / 38,

            direction:1

        },


        {

            id:"B",

            rx:210,

            ry:72.5,

            rotation:55,

            /*
               32 秒一圈
               逆时针
            */

            speed:
                -360 / 32,

            direction:-1

        },


        {

            id:"C",

            rx:165,

            ry:52.5,

            rotation:110,

            /*
               25 秒一圈
            */

            speed:
                360 / 25,

            direction:1

        }

    ];


    /* =====================================================
       当前轨道
    ===================================================== */

    let currentTrack = 0;


    /* =====================================================
       星星当前位置
    ===================================================== */

    let starAngle = 300;


    /* =====================================================
       当前目标
    ===================================================== */

    let targetAngle = null;

    let targetWorld = null;


    /* =====================================================
       平滑换轨状态
    ===================================================== */

    let switching = false;


    /*
       换轨开始时间
    */

    let transitionStart = 0;


    /*
       换轨持续时间

       半秒不到。

       足够让方向自然改变，
       又不会让星星明显离开轨道。
    */

    const TRANSITION_DURATION = 420;


    /*
       开始进入交点的距离。

       12° 是一个非常短的范围。
    */

    const TRANSITION_ANGLE = 12;


    /*
       过渡时记录的数据
    */

    let transitionFromTrack = 0;

    let transitionToTrack = 0;

    let transitionFromAngle = 0;

    let transitionToAngle = 0;

    let transitionCrossX = 0;

    let transitionCrossY = 0;


    /* =====================================================
       时间
    ===================================================== */

    const animationStart =
        performance.now();


    let lastTime =
        animationStart;


    /* =====================================================
       角度工具
    ===================================================== */

    function degToRad(
        angle
    ){

        return (
            angle *
            Math.PI /
            180
        );

    }


    function radToDeg(
        angle
    ){

        return (
            angle *
            180 /
            Math.PI
        );

    }


    function normalize(
        angle
    ){

        angle %= 360;


        if(
            angle < 0
        ){

            angle += 360;

        }


        return angle;

    }


    /* =====================================================
       轨道当前旋转
    ===================================================== */

    function getRotation(
        track,
        elapsed
    ){

        return (

            track.rotation +

            track.speed *
            elapsed /
            1000

        );

    }


    /* =====================================================
       轨道坐标
    ===================================================== */

    function getPoint(
        track,
        angle,
        elapsed
    ){

        const rad =
            degToRad(
                angle
            );


        /*
           椭圆本地坐标
        */

        const localX =
            track.rx *
            Math.cos(
                rad
            );


        const localY =
            track.ry *
            Math.sin(
                rad
            );


        /*
           当前轨道旋转
        */

        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        const cos =
            Math.cos(
                rotation
            );


        const sin =
            Math.sin(
                rotation
            );


        /*
           旋转到世界坐标
        */

        const worldX =
            localX * cos -
            localY * sin;


        const worldY =
            localX * sin +
            localY * cos;


        return {

            x:
                CX + worldX,

            y:
                CY + worldY

        };

    }


    /* =====================================================
       世界坐标 → 轨道角度
    ===================================================== */

    function worldToTrackAngle(
        track,
        x,
        y,
        elapsed
    ){

        const dx =
            x - CX;


        const dy =
            y - CY;


        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        /*
           反向旋转
        */

        const cos =
            Math.cos(
                -rotation
            );


        const sin =
            Math.sin(
                -rotation
            );


        const localX =
            dx * cos -
            dy * sin;


        const localY =
            dx * sin +
            dy * cos;


        const angle =
            radToDeg(
                Math.atan2(
                    localY / track.ry,
                    localX / track.rx
                )
            );


        return normalize(
            angle
        );

    }


    /* =====================================================
       两条轨道的交点搜索
    ===================================================== */

    function findIntersection(
        trackA,
        trackB,
        elapsed,
        fromAngle
    ){

        const samples = 720;


        let best = null;

        let bestScore =
            Infinity;


        for(
            let i = 0;
            i < samples;
            i++
        ){

            const angleA =
                i *
                360 /
                samples;


            /*
               A上的点
            */

            const pointA =
                getPoint(
                    trackA,
                    angleA,
                    elapsed
                );


            /*
               转换到B
            */

            const angleB =
                worldToTrackAngle(
                    trackB,
                    pointA.x,
                    pointA.y,
                    elapsed
                );


            const pointB =
                getPoint(
                    trackB,
                    angleB,
                    elapsed
                );


            /*
               两点距离
            */

            const dx =
                pointA.x -
                pointB.x;


            const dy =
                pointA.y -
                pointB.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               沿当前方向的距离
            */

            const travel =
                normalize(
                    (
                        angleA -
                        fromAngle
                    ) *
                    trackA.direction
                );


            /*
               排除已经经过的位置
            */

            if(
                travel < 2
            ){

                continue;

            }


            /*
               优先选择前方最近交点
            */

            const score =
                distance +
                travel * 0.008;


            if(
                score <
                bestScore
            ){

                bestScore =
                    score;


                best = {

                    angleA,

                    angleB,

                    x:
                        (
                            pointA.x +
                            pointB.x
                        ) / 2,

                    y:
                        (
                            pointA.y +
                            pointB.y
                        ) / 2,

                    distance,

                    travel

                };

            }

        }


        return best;

    }


    /* =====================================================
       寻找下一交点
    ===================================================== */

    function setNextTarget(
        elapsed
    ){

        const nextIndex =
            (
                currentTrack +
                1
            ) % 3;


        const current =
            tracks[
                currentTrack
            ];


        const next =
            tracks[
                nextIndex
            ];


        const intersection =
            findIntersection(
                current,
                next,
                elapsed,
                starAngle
            );


        if(
            !intersection
        ){

            return;

        }


        targetAngle =
            intersection.angleA;


        targetWorld = {

            x:
                intersection.x,

            y:
                intersection.y

        };


        switching = false;

    }


    /* =====================================================
       Smoothstep
       让速度在开始/结束时都很柔和
    ===================================================== */

    function smoothstep(
        t
    ){

        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            );


        return (

            t *
            t *
            (
                3 -
                2 * t
            )

        );

    }


    /* =====================================================
       更柔和的五次缓动
    ===================================================== */

    function smootherstep(
        t
    ){

        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            );


        return (

            t *
            t *
            t *
            (
                t *
                (
                    t *
                    6 -
                    15
                ) +
                10
            )

        );

    }


    /* =====================================================
       轨道旋转
    ===================================================== */

    function updateOrbits(
        elapsed
    ){

        if(groupA){

            groupA.setAttribute(
                "transform",
                `rotate(
                    ${
                        getRotation(
                            tracks[0],
                            elapsed
                        )
                    }
                    ${CX}
                    ${CY}
                )`
            );

        }


        if(groupB){

            groupB.setAttribute(
                "transform",
                `rotate(
                    ${
                        getRotation(
                            tracks[1],
                            elapsed
                        )
                    }
                    ${CX}
                    ${CY}
                )`
            );

        }


        if(groupC){

            groupC.setAttribute(
                "transform",
                `rotate(
                    ${
                        getRotation(
                            tracks[2],
                            elapsed
                        )
                    }
                    ${CX}
                    ${CY}
                )`
            );

        }

    }


    /* =====================================================
       ★ 开始一次平滑换轨
    ===================================================== */

    function beginTransition(
        elapsed
    ){

        const from =
            tracks[
                currentTrack
            ];


        const toIndex =
            (
                currentTrack +
                1
            ) % 3;


        const to =
            tracks[
                toIndex
            ];


        /*
           记录换轨前轨道
        */

        transitionFromTrack =
            currentTrack;


        transitionToTrack =
            toIndex;


        /*
           当前轨道的交点角度
        */

        transitionFromAngle =
            targetAngle;


        /*
           找到交点在下一轨道上的角度
        */

        transitionToAngle =
            worldToTrackAngle(
                to,
                targetWorld.x,
                targetWorld.y,
                elapsed
            );


        /*
           记录交点
        */

        transitionCrossX =
            targetWorld.x;


        transitionCrossY =
            targetWorld.y;


        /*
           开始时间
        */

        transitionStart =
            performance.now();


        switching = true;

    }


    /* =====================================================
       ★ 平滑换轨位置

       重点就在这里。

       不是：

           A → B

       而是：

           A → A/B交点附近
                ↘
                 ↘
                  B

       中间用平滑插值。
    ===================================================== */

    function getTransitionPosition(
        now,
        elapsed
    ){

        const from =
            tracks[
                transitionFromTrack
            ];


        const to =
            tracks[
                transitionToTrack
            ];


        let t =
            (
                now -
                transitionStart
            ) /
            TRANSITION_DURATION;


        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            );


        /*
           五次缓动。

           起点速度很低，
           中间自然加速，
           终点又自然减速。
        */

        const eased =
            smootherstep(
                t
            );


        /*
           当前轨道的点

           从交点前一点
           滑到交点。
        */

        const fromAngle =
            normalize(
                transitionFromAngle -
                from.direction *
                (
                    5 *
                    (
                        1 -
                        eased
                    )
                )
            );


        /*
           下一轨道从交点开始
           向前一点。
        */

        const toAngle =
            normalize(
                transitionToAngle +
                to.direction *
                (
                    5 *
                    eased
                )
            );


        const p1 =
            getPoint(
                from,
                fromAngle,
                elapsed
            );


        const p2 =
            getPoint(
                to,
                toAngle,
                elapsed
            );


        /*
           世界坐标平滑融合
        */

        const x =
            p1.x *
            (
                1 -
                eased
            ) +
            p2.x *
            eased;


        const y =
            p1.y *
            (
                1 -
                eased
            ) +
            p2.y *
            eased;


        return {

            x,

            y,

            progress:t

        };

    }


    /* =====================================================
       ★ 正常星星位置
    ===================================================== */

    function getNormalPosition(
        elapsed
    ){

        const track =
            tracks[
                currentTrack
            ];


        return getPoint(
            track,
            starAngle,
            elapsed
        );

    }


    /* =====================================================
       更新星星
    ===================================================== */

    function updateStar(
        now,
        elapsed
    ){

        let position;


        if(
            switching
        ){

            position =
                getTransitionPosition(
                    now,
                    elapsed
                );

        }
        else{

            position =
                getNormalPosition(
                    elapsed
                );

        }


        /*
           星星
        */

        star.setAttribute(
            "x",
            position.x.toFixed(3)
        );


        star.setAttribute(
            "y",
            position.y.toFixed(3)
        );


        /*
           光晕
        */

        glow.setAttribute(
            "cx",
            position.x.toFixed(3)
        );


        glow.setAttribute(
            "cy",
            position.y.toFixed(3)
        );

    }


    /* =====================================================
       星星速度

       保持原来的速度感。
    ===================================================== */

    const STAR_SPEED = 11;


    /* =====================================================
       主动画
    ===================================================== */

    function animate(
        now
    ){

        const elapsed =
            now -
            animationStart;


        const delta =
            Math.min(
                0.05,
                (
                    now -
                    lastTime
                ) / 1000
            );


        /* -----------------------------------------------
           轨道旋转
        ------------------------------------------------ */

        updateOrbits(
            elapsed
        );


        /* -----------------------------------------------
           如果正在换轨
        ------------------------------------------------ */

        if(
            switching
        ){

            const progress =
                (
                    now -
                    transitionStart
                ) /
                TRANSITION_DURATION;


            /*
               换轨完成
            */

            if(
                progress >= 1
            ){

                /*
                   正式进入下一轨道
                */

                currentTrack =
                    transitionToTrack;


                /*
                   重新根据当前时间
                   获取交点对应的角度
                */

                const next =
                    tracks[
                        currentTrack
                    ];


                const currentPoint =
                    getPoint(
                        next,
                        transitionToAngle,
                        elapsed
                    );


                starAngle =
                    worldToTrackAngle(
                        next,
                        currentPoint.x,
                        currentPoint.y,
                        elapsed
                    );


                /*
                   向前走一点。

                   避免停在交点。
                */

                starAngle =
                    normalize(
                        starAngle +
                        next.direction *
                        1.2
                    );


                targetAngle = null;

                targetWorld = null;

                switching = false;

            }

        }


        /* -----------------------------------------------
           正常移动
        ------------------------------------------------ */

        if(
            !switching
        ){

            /*
               没有目标，
               寻找下一交点。
            */

            if(
                targetAngle === null
            ){

                setNextTarget(
                    elapsed
                );

            }


            if(
                targetAngle !== null
            ){

                const track =
                    tracks[
                        currentTrack
                    ];


                /*
                   距离交点
                */

                let distance =
                    normalize(
                        (
                            targetAngle -
                            starAngle
                        ) *
                        track.direction
                    );


                /*
                   正常速度
                */

                let speed =
                    STAR_SPEED;


                /*
                   靠近交点：

                   先慢慢减速。
                */

                if(
                    distance <
                    TRANSITION_ANGLE * 2
                ){

                    const factor =
                        distance /
                        (
                            TRANSITION_ANGLE *
                            2
                        );


                    speed *=
                        Math.max(
                            .22,
                            factor
                        );

                }


                /*
                   移动
                */

                starAngle +=
                    speed *
                    track.direction *
                    delta;


                starAngle =
                    normalize(
                        starAngle
                    );


                /*
                   更新距离
                */

                distance =
                    normalize(
                        (
                            targetAngle -
                            starAngle
                        ) *
                        track.direction
                    );


                /*
                   到达平滑换轨区
                */

                if(
                    distance <=
                    TRANSITION_ANGLE
                ){

                    beginTransition(
                        elapsed
                    );

                }

            }

        }


        /* -----------------------------------------------
           更新星星
        ------------------------------------------------ */

        updateStar(
            now,
            elapsed
        );


        lastTime =
            now;


        requestAnimationFrame(
            animate
        );

    }


    /* =====================================================
       初始化
    ===================================================== */

    starAngle = 300;


    updateOrbits(0);


    updateStar(
        animationStart,
        0
    );


    /* =====================================================
       开始
    ===================================================== */

    requestAnimationFrame(
        animate
    );


})();
