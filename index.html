<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#061426;
    color:#d9edff;
    font-family:"Cormorant Garamond","Noto Serif SC",serif;
}

/* =========================
   背景
========================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    min-height:620px;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(16,55,84,.34) 0%,
            rgba(6,20,38,.86) 45%,
            #061426 78%
        );
}

/* =========================
   星空
========================= */

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    color:rgba(163,213,241,.68);
    font-size:10px;
    animation:
        floatStar var(--time) ease-in-out infinite alternate;
    animation-delay:var(--delay);
}

.star:nth-child(1){
    left:8%;
    top:17%;
    --time:5s;
    --delay:-2s;
}

.star:nth-child(2){
    left:17%;
    top:72%;
    --time:7s;
    --delay:-4s;
}

.star:nth-child(3){
    left:29%;
    top:24%;
    --time:6s;
    --delay:-1s;
}

.star:nth-child(4){
    left:42%;
    top:11%;
    --time:8s;
    --delay:-5s;
}

.star:nth-child(5){
    left:56%;
    top:82%;
    --time:6s;
    --delay:-2s;
}

.star:nth-child(6){
    left:68%;
    top:18%;
    --time:7s;
    --delay:-3s;
}

.star:nth-child(7){
    left:78%;
    top:68%;
    --time:5s;
    --delay:-1s;
}

.star:nth-child(8){
    left:91%;
    top:29%;
    --time:8s;
    --delay:-4s;
}

.star:nth-child(9){
    left:84%;
    top:87%;
    --time:6s;
    --delay:-2s;
}

.star:nth-child(10){
    left:12%;
    top:42%;
    --time:7s;
    --delay:-3s;
}

.star:nth-child(11){
    left:74%;
    top:46%;
    --time:5s;
    --delay:-2s;
}

.star:nth-child(12){
    left:36%;
    top:91%;
    --time:8s;
    --delay:-5s;
}

@keyframes floatStar{
    0%{
        opacity:.22;
        transform:translate3d(0,0,0) rotate(0deg);
    }

    50%{
        opacity:.75;
    }

    100%{
        opacity:.25;
        transform:translate3d(0,-9px,0) rotate(18deg);
    }
}

/* =========================
   四角边框
========================= */

.corner{
    position:absolute;
    width:80px;
    height:80px;
    z-index:5;
    pointer-events:none;
}

.corner::before,
.corner::after{
    content:"";
    position:absolute;
    background:rgba(91,167,218,.34);
}

.corner::before{
    width:100%;
    height:1px;
}

.corner::after{
    width:1px;
    height:100%;
}

.corner.tl{
    top:25px;
    left:25px;
}

.corner.tl::before,
.corner.tl::after{
    left:0;
    top:0;
}

.corner.tr{
    top:25px;
    right:25px;
}

.corner.tr::before,
.corner.tr::after{
    right:0;
    top:0;
}

.corner.bl{
    bottom:25px;
    left:25px;
}

.corner.bl::before,
.corner.bl::after{
    left:0;
    bottom:0;
}

.corner.br{
    bottom:25px;
    right:25px;
}

.corner.br::before,
.corner.br::after{
    right:0;
    bottom:0;
}

.corner-star{
    position:absolute;
    color:rgba(105,181,224,.58);
    font-family:serif;
    font-size:17px;
    line-height:1;
}

.corner.tl .corner-star{
    left:-4px;
    top:-8px;
}

.corner.tr .corner-star{
    right:-4px;
    top:-8px;
}

.corner.bl .corner-star{
    left:-4px;
    bottom:-8px;
}

.corner.br .corner-star{
    right:-4px;
    bottom:-8px;
}

/* =========================
   顶部导航
========================= */

.header{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:105px;
    padding:28px 48px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    z-index:20;
}

.logo{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.logo-symbol{
    color:#79bce3;
    font-size:20px;
    line-height:1;
    margin-top:2px;
}

.logo-text{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.logo-cn{
    font-family:"Noto Serif SC",serif;
    font-size:15px;
    letter-spacing:4px;
    color:rgba(216,237,251,.9);
}

.logo-en{
    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:3px;
    color:rgba(112,178,216,.68);
}

.nav{
    display:flex;
    gap:28px;
    padding-top:3px;
}

.nav a{
    color:rgba(183,216,237,.62);
    text-decoration:none;
    font-family:"Noto Serif SC",serif;
    font-size:11px;
    letter-spacing:2px;
    transition:
        color .3s ease,
        letter-spacing .3s ease;
}

.nav a:hover{
    color:#d8efff;
    letter-spacing:3px;
}

/* =========================
   中央区域
========================= */

.main{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:2;
}

.content{
    position:relative;
    width:min(900px,90vw);
    height:620px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding-top:25px;
}

/* =========================
   魔法阵 / 星轨
========================= */

.magic-system{
    position:absolute;
    left:50%;
    top:50%;

    width:600px;
    height:600px;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

/* 外圈 */

.magic-ring{
    position:absolute;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    border:1px solid rgba(82,158,205,.17);
}

.magic-ring.r1{
    width:540px;
    height:540px;
}

.magic-ring.r2{
    width:470px;
    height:470px;
    border-style:dashed;
    border-color:rgba(86,164,212,.15);
}

.magic-ring.r3{
    width:350px;
    height:350px;
    border-color:rgba(98,177,222,.18);
}

.magic-ring.r4{
    width:250px;
    height:250px;
    border-color:rgba(105,181,225,.16);
}

/* 十字魔法线 */

.magic-line{
    position:absolute;
    left:50%;
    top:50%;

    transform-origin:center;

    background:rgba(86,163,211,.12);
}

.magic-line.horizontal{
    width:590px;
    height:1px;
    transform:translate(-50%,-50%);
}

.magic-line.vertical{
    width:1px;
    height:590px;
    transform:translate(-50%,-50%);
}

/* =========================
   三层星轨
========================= */

.orbit-system{
    position:absolute;
    inset:0;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

.orbit-path{
    fill:none;
    stroke:rgba(88,169,216,.17);
    stroke-width:1;
}

.orbit-path-inner{
    fill:none;
    stroke:rgba(88,169,216,.10);
    stroke-width:1;
}

/* 轨道星 */

.orbit-star{
    fill:#a9dcf7;
    opacity:.82;
    filter:drop-shadow(0 0 4px rgba(87,177,228,.65));
}

/* =========================
   中央小圆
========================= */

.center-symbol{
    position:absolute;
    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:translate(-50%,-50%) rotate(45deg);

    border:1px solid rgba(113,192,231,.62);
}

.center-symbol::after{
    content:"";
    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:translate(-50%,-50%);

    background:#8cc9ea;
    box-shadow:0 0 8px rgba(88,181,229,.7);
}

/* =========================
   标题
========================= */

.title-area{
    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:-30px;
}

.title-main{
    display:flex;
    flex-direction:column;
    align-items:center;

    line-height:.78;
}

.title-main .seyami{
    font-family:"Cinzel",serif;
    font-weight:300;
    font-size:78px;
    letter-spacing:16px;
    margin-right:-16px;

    color:#d9edff;
}

.title-main .archive{
    font-family:"Cinzel",serif;
    font-weight:300;
    font-size:92px;
    letter-spacing:18px;
    margin-right:-18px;

    color:#d9edff;
}

.title-cn{
    margin-top:29px;

    font-family:"Noto Serif SC",serif;
    font-weight:300;

    font-size:14px;
    letter-spacing:8px;

    color:rgba(207,231,246,.82);
}

.description{
    margin-top:18px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:5px;

    font-family:"Noto Serif SC",serif;
    font-size:11px;
    line-height:1.8;

    letter-spacing:2px;

    color:rgba(151,190,214,.58);
}

/* =========================
   进入按钮
========================= */

.enter-wrap{
    position:relative;

    width:370px;
    height:82px;

    margin-top:42px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.enter-wrap::before{
    content:"";

    position:absolute;
    inset:0;

    clip-path:polygon(
        0 20%,
        5% 20%,
        8% 0,
        92% 0,
        95% 20%,
        100% 20%,
        100% 80%,
        95% 80%,
        92% 100%,
        8% 100%,
        5% 80%,
        0 80%
    );

    border:1px solid rgba(91,167,218,.38);

    background:rgba(8,28,49,.48);

    box-shadow:
        0 0 22px rgba(39,120,180,.08);

    pointer-events:none;
}

.enter-wrap::after{
    content:"";

    position:absolute;

    left:13px;
    right:13px;
    top:13px;
    bottom:13px;

    border:1px solid rgba(91,164,213,.16);

    pointer-events:none;
}

.enter-button{
    position:relative;
    z-index:2;

    width:300px;
    height:50px;

    border:none;
    outline:none;

    cursor:pointer;

    color:#d9edff;

    font-family:"Noto Serif SC",serif;
    font-size:13px;
    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    border-top:1px solid rgba(105,180,225,.38);
    border-bottom:1px solid rgba(105,180,225,.38);

    transition:
        background .35s ease,
        box-shadow .35s ease,
        letter-spacing .35s ease;
}

.enter-button:hover{
    background:
        linear-gradient(
            90deg,
            rgba(10,41,67,.95),
            rgba(23,66,98,.95),
            rgba(10,41,67,.95)
        );

    box-shadow:
        0 0 22px rgba(56,143,201,.18);

    letter-spacing:5px;
}

.enter-button:active{
    transform:translateY(1px);
}

.enter-star{
    position:absolute;

    top:50%;

    transform:translateY(-50%);

    color:rgba(111,186,229,.75);

    font-size:16px;

    text-shadow:
        0 0 9px rgba(67,158,215,.45);

    z-index:3;
}

.enter-star.left{
    left:18px;
}

.enter-star.right{
    right:18px;
}

.enter-diamond{
    position:absolute;

    left:50%;

    width:6px;
    height:6px;

    transform:translateX(-50%) rotate(45deg);

    border:1px solid rgba(116,187,226,.65);

    background:#061426;
}

.enter-diamond.top{
    top:-3px;
}

.enter-diamond.bottom{
    bottom:-3px;
}

/* =========================
   底部
========================= */

.footer{
    position:absolute;

    left:50%;
    bottom:28px;

    transform:translateX(-50%);

    z-index:10;

    white-space:nowrap;

    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:4px;

    color:rgba(103,161,195,.48);
}

/* =========================
   星轨动画
========================= */

@keyframes orbitA{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes orbitB{
    from{
        transform:rotate(55deg);
    }

    to{
        transform:rotate(-305deg);
    }
}

@keyframes orbitC{
    from{
        transform:rotate(110deg);
    }

    to{
        transform:rotate(470deg);
    }
}

.orbit-a{
    animation:orbitA 38s linear infinite;
    transform-origin:300px 300px;
}

.orbit-b{
    animation:orbitB 32s linear infinite;
    transform-origin:300px 300px;
}

.orbit-c{
    animation:orbitC 25s linear infinite;
    transform-origin:300px 300px;
}

/* =========================
   手机端
========================= */

@media(max-width:520px){

    .page{
        min-height:600px;
    }

    .header{
        height:90px;
        padding:22px 24px;
    }

    .logo{
        gap:7px;
    }

    .logo-symbol{
        font-size:16px;
    }

    .logo-cn{
        font-size:12px;
        letter-spacing:3px;
    }

    .logo-en{
        font-size:7px;
        letter-spacing:2px;
    }

    .nav{
        gap:13px;
        padding-top:1px;
    }

    .nav a{
        font-size:9px;
        letter-spacing:1px;
    }

    .content{
        width:100%;
        height:560px;
        padding-top:15px;
    }

    .magic-system{
        width:440px;
        height:440px;
    }

    .orbit-system{
        width:440px;
        height:440px;
    }

    .magic-ring.r1{
        width:420px;
        height:420px;
    }

    .magic-ring.r2{
        width:365px;
        height:365px;
    }

    .magic-ring.r3{
        width:280px;
        height:280px;
    }

    .magic-ring.r4{
        width:205px;
        height:205px;
    }

    .magic-line.horizontal{
        width:430px;
    }

    .magic-line.vertical{
        height:430px;
    }

    .title-area{
        margin-top:-25px;
    }

    .title-main .seyami{
        font-size:52px;
        letter-spacing:10px;
        margin-right:-10px;
    }

    .title-main .archive{
        font-size:62px;
        letter-spacing:11px;
        margin-right:-11px;
    }

    .title-cn{
        margin-top:22px;
        font-size:11px;
        letter-spacing:5px;
    }

    .description{
        margin-top:14px;
        font-size:9px;

        padding:0 25px;
    }

    /* =========================
       手机端按钮整体缩短
       ========================= */

    .enter-wrap{
        width:285px;
        height:76px;
        margin-top:35px;
    }

    .enter-button{
        width:230px;

        letter-spacing:3px;
    }

        left:16px;
    }

    .enter-star.right{
        right:16px;
    }

    .footer{
        bottom:18px;

    }

    .corner{

        height:55px;
    }

    .corner.tl,
    .corner.tr{
        top:17px;
    }

    .corner.bl,
    .corner.br{
        bottom:17px;
    }

    .corner.tl,
    .corner.bl{
        left:17px;
    }

    .corner.tr,
    .corner.br{
        right:17px;
    }

    .corner-star{
        font-size:13px;
    }

}

/* =========================
   超小屏
========================= */

@media(max-width:380px){

    .header{
        padding-left:18px;
        padding-right:18px;
    }

    .nav{
        gap:9px;
    }

    .nav a{
        font-size:8px;
    }

    .title-main .seyami{
        font-size:46px;
        letter-spacing:8px;
        margin-right:-8px;
    }

    .title-main .archive{
        font-size:54px;
        letter-spacing:9px;
        margin-right:-9px;
    }

    .title-cn{
        font-size:10px;
        letter-spacing:4px;
    }

    .description{
        font-size:8px;
    }

    .enter-wrap{
        width:275px;
    }

    .enter-button{
        width:225px;
    }

}
</style>
</head>

<script>

/* ==========================================
   三层星轨
   A：38秒
   B：32秒 / 反方向
   C：25秒
========================================== */

const orbitData = [

    {
        name:"A",
        rx:250,
        ry:95,
        baseRotation:0,
        speed:360/38,
        direction:1
    },

    {
        name:"B",
        rx:210,
        ry:72.5,
        baseRotation:55,
        speed:-360/32,
        direction:-1
    },

    {
        name:"C",
        rx:165,
        ry:52.5,
        baseRotation:110,
        speed:360/25,
        direction:1
    }

];


/* 
   星辰沿轨道移动：
   A → A/B → B → B/C → C → C/A → A
*/

const orbitStar = document.querySelector(".orbit-star");

let startTime = performance.now();

function getOrbitPoint(
    rx,
    ry,
    rotation,
    progress
){

    const angle =
        progress * Math.PI * 2;

    const x =
        rx * Math.cos(angle);

    const y =
        ry * Math.sin(angle);

    const rad =
        rotation * Math.PI / 180;

    return {

        x:
            x * Math.cos(rad)
            -
            y * Math.sin(rad),

        y:
            x * Math.sin(rad)
            +
            y * Math.cos(rad)

    };

}


/*
   根据时间计算三条轨道的旋转
*/

function animateOrbit(now){

    const elapsed =
        (now - startTime) / 1000;


    const A =
        (elapsed / 38) % 1;

    const B =
        (elapsed / 32) % 1;

    const C =
        (elapsed / 25) % 1;


    /*
       三条轨道旋转
    */

    const groupA =
        document.querySelector(".orbit-a");

    const groupB =
        document.querySelector(".orbit-b");

    const groupC =
        document.querySelector(".orbit-c");


    if(groupA){
        groupA.style.transform =
            `rotate(${A * 360}deg)`;
    }

    if(groupB){
        groupB.style.transform =
            `rotate(${55 - B * 360}deg)`;
    }

    if(groupC){
        groupC.style.transform =
            `rotate(${110 + C * 360}deg)`;
    }


    requestAnimationFrame(animateOrbit);

}


requestAnimationFrame(animateOrbit);


/* ==========================================
   页面进入
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document.body.classList.add("loaded");

    }
);

</script>
