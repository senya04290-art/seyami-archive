<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>赛垭弥大陆档案馆｜SEYAMI ARCHIVE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

    color: #e9f6ff;

    background:
        radial-gradient(circle at 50% 25%, rgba(52, 145, 220, 0.22), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(34, 93, 180, 0.18), transparent 30%),
        linear-gradient(
            180deg,
            #06152c 0%,
            #081d3b 45%,
            #041126 100%
        );

    overflow-x: hidden;
}

/* 星空 */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1px),
        radial-gradient(circle, rgba(137,210,255,.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1px);

    background-size:
        110px 110px,
        170px 170px,
        240px 240px;

    background-position:
        10px 20px,
        70px 90px,
        130px 40px;

    opacity: .65;
}

/* 顶部导航 */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(4, 17, 38, .72);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(116, 203, 255, .18);

    z-index: 20;
}

.logo {
    color: #dff6ff;
    text-decoration: none;

    font-size: 18px;
    letter-spacing: 3px;

    text-shadow:
        0 0 10px rgba(105, 207, 255, .7);
}

.logo span {
    display: block;

    font-size: 10px;
    letter-spacing: 4px;

    color: #78cfff;

    margin-top: 3px;
}

/* 首页 */

.hero {
    position: relative;
    z-index: 2;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 100px 20px 60px;
}

.hero-content {
    max-width: 850px;
}

/* 月亮 */

.moon {
    width: 150px;
    height: 150px;

    margin: 0 auto 35px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #dff7ff 45%,
            #8fd9ff 100%
        );

    box-shadow:
        0 0 30px rgba(130, 220, 255, .55),
        0 0 80px rgba(65, 165, 255, .28);

    position: relative;
}

.moon::before,
.moon::after {
    content: "";
    position: absolute;

    border-radius: 50%;

    background: rgba(89, 166, 211, .18);
}

.moon::before {
    width: 28px;
    height: 28px;

    top: 35px;
    left: 30px;
}

.moon::after {
    width: 18px;
    height: 18px;

    bottom: 35px;
    right: 35px;
}

/* 标题 */

.title-cn {
    font-size: clamp(34px, 7vw, 68px);

    font-weight: 500;

    letter-spacing: 9px;

    color: #effbff;

    text-shadow:
        0 0 12px rgba(122, 214, 255, .9),
        0 0 35px rgba(55, 151, 255, .55);

    margin-bottom: 15px;
}

.title-en {
    font-size: clamp(13px, 2vw, 18px);

    letter-spacing: 8px;

    color: #79d4ff;

    margin-bottom: 28px;
}

.description {
    color: #a9cde3;

    font-size: 14px;

    line-height: 2;

    max-width: 620px;

    margin: 0 auto 42px;
}

/* 魔法圆环 */

.magic-ring {
    position: absolute;

    width: min(600px, 85vw);
    height: min(600px, 85vw);

    border-radius: 50%;

    border: 1px solid rgba(95, 205, 255, .16);

    z-index: -1;

    animation: rotate 35s linear infinite;
}

.magic-ring::before,
.magic-ring::after {
    content: "";

    position: absolute;

    inset: 25px;

    border-radius: 50%;

    border: 1px dashed rgba(103, 207, 255, .16);
}

.magic-ring::after {
    inset: 65px;

    border: 1px solid rgba(110, 220, 255, .1);
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* 进入按钮 */

.enter-btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 220px;

    padding: 15px 32px;

    border-radius: 50px;

    border: 1px solid rgba(132, 222, 255, .65);

    color: #e8f9ff;

    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            rgba(51, 143, 220, .25),
            rgba(29, 82, 155, .18)
        );

    box-shadow:
        0 0 18px rgba(73, 184, 255, .18),
        inset 0 0 20px rgba(103, 205, 255, .05);

    transition:
        .3s ease;

    letter-spacing: 3px;

    font-size: 15px;
}

.enter-btn:hover {
    transform: translateY(-3px);

    background:
        linear-gradient(
            135deg,
            rgba(65, 168, 240, .4),
            rgba(35, 100, 190, .28)
        );

    box-shadow:
        0 0 30px rgba(74, 192, 255, .4);

    border-color: #9ee7ff;
}

/* 小装饰 */

.decor {
    position: absolute;

    color: rgba(124, 211, 255, .6);

    font-size: 14px;

    pointer-events: none;

    animation: float 5s ease-in-out infinite;
}

.decor.one {
    top: 25%;
    left: 10%;
}

.decor.two {
    top: 35%;
    right: 12%;

    animation-delay: 1.5s;
}

.decor.three {
    bottom: 18%;
    left: 18%;

    animation-delay: 2.5s;
}

.decor.four {
    bottom: 25%;
    right: 20%;

    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
        opacity: .45;
    }

    50% {
        transform: translateY(-12px);
        opacity: 1;
    }
}

/* 底部 */

.footer {
    position: absolute;

    bottom: 25px;

    width: 100%;

    text-align: center;

    color: rgba(157, 201, 225, .5);

    font-size: 11px;

    letter-spacing: 3px;
}

/* 手机 */

@media (max-width: 600px) {

    nav {
        height: 62px;
        padding: 0 20px;
    }

    .logo {
        font-size: 15px;
    }

    .logo span {
        font-size: 8px;
    }

    .hero {
        padding-top: 80px;
    }

    .moon {
        width: 110px;
        height: 110px;

        margin-bottom: 28px;
    }

    .title-cn {
        letter-spacing: 5px;
    }

    .title-en {
        letter-spacing: 5px;
    }

    .description {
        font-size: 13px;
        padding: 0 15px;
    }

    .magic-ring {
        width: 450px;
        height: 450px;
    }

    .decor {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<nav>
    <a href="index.html" class="logo">
        赛垭弥大陆档案馆
        <span>SEYAMI ARCHIVE</span>
    </a>
</nav>

<main class="hero">

    <div class="magic-ring"></div>

    <div class="decor one">✦</div>
    <div class="decor two">✧</div>
    <div class="decor three">⋆</div>
    <div class="decor four">✦</div>

    <div class="hero-content">

        <div class="moon"></div>

        <h1 class="title-cn">
            赛垭弥大陆档案馆
        </h1>

        <div class="title-en">
            SEYAMI ARCHIVE
        </div>

        <p class="description">
            记录关于这片大陆的一切。
            <br>
            角色、种族、地域、历史，以及那些尚未被发现的故事。
        </p>

        <!-- 点击后进入独立档案目录页面 -->
        <a href="archive.html" class="enter-btn">
            进入档案馆
            <span style="margin-left:10px;">→</span>
        </a>

    </div>

</main>

<div class="footer">
    ✦ THE ARCHIVES OF SEYAMI ✦
</div>

</body>
</html>
