<script>

/* =========================================================
   SEYAMI ARCHIVE
   三重动态星轨 · 平滑换轨版

   A：38秒 / 顺时针
   B：32秒 / 逆时针
   C：25秒 / 顺时针

   路线：

   A → A/B → B → B/C → C → C/A → A

   ★ 本版本重点：
   星星不会在交点瞬间“跳轨”。

   接近交点：
       A ───────╮
                 ✦
       B ───────╯

   星星会在交点附近进行短距离的
   平滑方向过渡，然后自然进入下一条轨道。
========================================================= */

(function(){

    const star =
        document.getElementById(
            "travellingStar"
        );

    const glow =
        document.getElementById(
            "starGlow"
        );


    if(!star || !glow){
        return;
    }


    /* =====================================================
       中心
    ===================================================== */

    const CX = 280;
    const CY = 280;


    /* =====================================================
       三条轨道
    ===================================================== */

    const tracks = [

        {
            id:"A",

            rx:250,
            ry:95,

            rotation:0,

            /* 38 秒一圈 / 顺时针 */
            speed:360 / 38,

            direction:1
        },


        {
            id:"B",

            rx:210,
            ry:72.5,

            rotation:55,

            /* 32 秒一圈 / 逆时针 */
            speed:-360 / 32,

            direction:-1
        },


        {
            id:"C",

            rx:165,
            ry:52.5,

            /* 25 秒一圈 / 顺时针 */
            rotation:110,

            speed:360 / 25,

            direction:1
        }

    ];


    /* =====================================================
       当前轨道
    ===================================================== */

    let currentTrack = 0;


    /* =====================================================
       星星参数角度
    ===================================================== */

    let starAngle = 300;


    /* =====================================================
       目标交点
    ===================================================== */

    let targetAngle = null;


    /*
       交点的真实世界坐标
    */

    let targetWorld = null;


    /*
       是否正在前往交点
    */

    let switching = false;


    /* =====================================================
       时间
    ===================================================== */

    const animationStart =
        performance.now();

    let lastTime =
        animationStart;


    /* =====================================================
       平滑换轨参数
    ===================================================== */

    /*
       进入交点前多少角度
       开始准备换轨。

       数值越大：
       过渡越早、越柔和。

       这里保持比较自然的短过渡。
    */

    const TRANSITION_ANGLE = 12;


    /*
       交点附近的平滑比例
    */

    let transitionProgress = 0;


    /* =====================================================
       工具
    ===================================================== */

    function degToRad(angle){

        return angle *
               Math.PI /
               180;

    }


    function radToDeg(angle){

        return angle *
               180 /
               Math.PI;

    }


    function normalize(angle){

        angle %= 360;

        if(angle < 0){
            angle += 360;
        }

        return angle;

    }


    /* =====================================================
       当前轨道旋转角
    ===================================================== */

    function getRotation(
        track,
        elapsed
    ){

        return (
            track.rotation +
            track.speed *
            elapsed /
            1000
        );

    }


    /* =====================================================
       ★ 轨道真实坐标
    ===================================================== */

    function getPoint(
        track,
        angle,
        elapsed
    ){

        const rad =
            degToRad(angle);


        /*
           椭圆自身坐标
        */

        const localX =
            track.rx *
            Math.cos(rad);

        const localY =
            track.ry *
            Math.sin(rad);


        /*
           当前轨道旋转
        */

        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        const cos =
            Math.cos(rotation);

        const sin =
            Math.sin(rotation);


        /*
           旋转后的坐标
        */

        const worldX =
            localX * cos -
            localY * sin;

        const worldY =
            localX * sin +
            localY * cos;


        return {

            x:CX + worldX,

            y:CY + worldY

        };

    }


    /* =====================================================
       世界坐标 → 轨道参数
    ===================================================== */

    function worldToTrackAngle(
        track,
        x,
        y,
        elapsed
    ){

        const dx =
            x - CX;

        const dy =
            y - CY;


        /*
           反向旋转
        */

        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );


        const cos =
            Math.cos(-rotation);

        const sin =
            Math.sin(-rotation);


        const localX =
            dx * cos -
            dy * sin;

        const localY =
            dx * sin +
            dy * cos;


        const angle =
            radToDeg(
                Math.atan2(
                    localY / track.ry,
                    localX / track.rx
                )
            );


        return normalize(angle);

    }


    /* =====================================================
       寻找两条轨道交点
    ===================================================== */

    function findIntersection(
        trackA,
        trackB,
        elapsed,
        fromAngle
    ){

        const samples = 720;

        let best = null;

        let bestScore = Infinity;


        for(
            let i = 0;
            i < samples;
            i++
        ){

            const angleA =
                i *
                360 /
                samples;


            /*
               当前轨道上的点
            */

            const pointA =
                getPoint(
                    trackA,
                    angleA,
                    elapsed
                );


            /*
               转换到 B 轨道
            */

            const angleB =
                worldToTrackAngle(
                    trackB,
                    pointA.x,
                    pointA.y,
                    elapsed
                );


            const pointB =
                getPoint(
                    trackB,
                    angleB,
                    elapsed
                );


            const dx =
                pointA.x -
                pointB.x;

            const dy =
                pointA.y -
                pointB.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               当前星星前进方向
            */

            const travel =
                normalize(
                    (
                        angleA -
                        fromAngle
                    ) *
                    trackA.direction
                );


            /*
               不选择刚刚经过的交点
            */

            if(
                travel < 2
            ){
                continue;
            }


            /*
               分数：
               距离越近越好。
               
               同时优先选择前方最近交点。
            */

            const score =
                distance +
                travel * 0.008;


            if(
                score <
                bestScore
            ){

                bestScore =
                    score;

                best = {

                    angleA,

                    angleB,

                    x:
                        (
                            pointA.x +
                            pointB.x
                        ) / 2,

                    y:
                        (
                            pointA.y +
                            pointB.y
                        ) / 2,

                    distance,

                    travel

                };

            }

        }


        return best;

    }


    /* =====================================================
       设置下一交点
    ===================================================== */

    function setNextTarget(
        elapsed
    ){

        const nextTrackIndex =
            (
                currentTrack +
                1
            ) % 3;


        const current =
            tracks[
                currentTrack
            ];

        const next =
            tracks[
                nextTrackIndex
            ];


        const intersection =
            findIntersection(
                current,
                next,
                elapsed,
                starAngle
            );


        if(!intersection){
            return;
        }


        targetAngle =
            intersection.angleA;


        targetWorld = {

            x:intersection.x,

            y:intersection.y

        };


        switching = true;

        transitionProgress = 0;

    }


    /* =====================================================
       更新三条轨道
    ===================================================== */

    function updateOrbits(
        elapsed
    ){

        const groupA =
            document.getElementById(
                "orbitA"
            );

        const groupB =
            document.getElementById(
                "orbitB"
            );

        const groupC =
            document.getElementById(
                "orbitC"
            );


        if(groupA){

            groupA.setAttribute(
                "transform",
                `rotate(
                    ${getRotation(
                        tracks[0],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }


        if(groupB){

            groupB.setAttribute(
                "transform",
                `rotate(
                    ${getRotation(
                        tracks[1],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }


        if(groupC){

            groupC.setAttribute(
                "transform",
                `rotate(
                    ${getRotation(
                        tracks[2],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }

    }


    /* =====================================================
       ★ 平滑函数
    ===================================================== */

    function smoothstep(t){

        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            );


        return (
            t *
            t *
            (
                3 -
                2 * t
            )
        );

    }


    /* =====================================================
       ★ 计算星星在交点附近的平滑位置
       
       这里不是简单“瞬间换轨”。
       
       而是：
       
       当前轨道位置
          ↓
       逐渐靠近交点
          ↓
       交点
          ↓
       新轨道位置
    ===================================================== */

    function getSmoothStarPosition(
        elapsed
    ){

        const current =
            tracks[
                currentTrack
            ];


        const nextIndex =
            (
                currentTrack +
                1
            ) % 3;


        const next =
            tracks[
                nextIndex
            ];


        /*
           当前距离交点还有多少
        */

        let distance =
            normalize(
                (
                    targetAngle -
                    starAngle
                ) *
                current.direction
            );


        /*
           进入过渡区域
        */

        if(
            distance <=
            TRANSITION_ANGLE
        ){

            transitionProgress =
                1 -
                distance /
                TRANSITION_ANGLE;


            transitionProgress =
                smoothstep(
                    transitionProgress
                );


            /*
               当前轨道的位置
            */

            const currentPoint =
                getPoint(
                    current,
                    starAngle,
                    elapsed
                );


            /*
               新轨道交点参数
            */

            const nextAngle =
                worldToTrackAngle(
                    next,
                    targetWorld.x,
                    targetWorld.y,
                    elapsed
                );


            /*
               沿着新轨道稍微向前一点
            */

            const nextAdvance =
                next.direction *
                0.8;


            const nextPoint =
                getPoint(
                    next,
                    normalize(
                        nextAngle +
                        nextAdvance
                    ),
                    elapsed
                );


            /*
               ★ 在两个位置之间
               使用平滑插值。
            */

            const x =
                currentPoint.x *
                (1 - transitionProgress) +
                nextPoint.x *
                transitionProgress;


            const y =
                currentPoint.y *
                (1 - transitionProgress) +
                nextPoint.y *
                transitionProgress;


            return {

                x,
                y,

                blended:true

            };

        }


        /*
           正常状态
        */

        return {

            ...getPoint(
                current,
                starAngle,
                elapsed
            ),

            blended:false

        };

    }


    /* =====================================================
       ★ 更新星星
    ===================================================== */

    function updateStar(
        elapsed
    ){

        const position =
            getSmoothStarPosition(
                elapsed
            );


        star.setAttribute(
            "x",
            position.x.toFixed(3)
        );


        star.setAttribute(
            "y",
            position.y.toFixed(3)
        );


        glow.setAttribute(
            "cx",
            position.x.toFixed(3)
        );


        glow.setAttribute(
            "cy",
            position.y.toFixed(3)
        );

    }


    /* =====================================================
       星星速度
    ===================================================== */

    const STAR_SPEED = 11;


    /* =====================================================
       主动画
    ===================================================== */

    function animate(now){

        const elapsed =
            now -
            animationStart;


        const delta =
            Math.min(
                0.05,
                (
                    now -
                    lastTime
                ) / 1000
            );


        /* -----------------------------------------------
           1.
           三条轨道独立旋转
        ------------------------------------------------ */

        updateOrbits(
            elapsed
        );


        /* -----------------------------------------------
           2.
           如果没有目标，
           寻找下一个交点
        ------------------------------------------------ */

        if(!switching){

            setNextTarget(
                elapsed
            );

        }


        /* -----------------------------------------------
           3.
           星星前往交点
        ------------------------------------------------ */

        if(
            switching &&
            targetAngle !== null
        ){

            const track =
                tracks[
                    currentTrack
                ];


            const direction =
                track.direction;


            /*
               当前距离
            */

            let distance =
                normalize(
                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction
                );


            /*
               正常速度
            */

            let speed =
                STAR_SPEED;


            /*
               靠近交点时慢慢减速
            */

            if(
                distance <
                TRANSITION_ANGLE * 2
            ){

                speed *=
                    Math.max(
                        0.2,
                        distance /
                        (
                            TRANSITION_ANGLE *
                            2
                        )
                    );

            }


            /*
               前进
            */

            starAngle +=
                speed *
                direction *
                delta;


            starAngle =
                normalize(
                    starAngle
                );


            /*
               更新距离
            */

            distance =
                normalize(
                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction
                );


            /* -------------------------------------------
               4.
               到达真正交点
            ------------------------------------------- */

            if(
                distance < 0.7
            ){

                /*
                   ★ 此时重新计算
                   当前轨道上的真实交点
                */

                const intersection =
                    getPoint(
                        track,
                        targetAngle,
                        elapsed
                    );


                /*
                   下一条轨道
                */

                const nextIndex =
                    (
                        currentTrack +
                        1
                    ) % 3;


                const nextTrack =
                    tracks[
                        nextIndex
                    ];


                /*
                   ★ 将真实交点
                   转换成下一轨道自己的角度
                */

                const nextAngle =
                    worldToTrackAngle(
                        nextTrack,
                        intersection.x,
                        intersection.y,
                        elapsed
                    );


                /*
                   正式换轨
                */

                currentTrack =
                    nextIndex;


                /*
                   使用新轨道自己的参数
                */

                starAngle =
                    nextAngle;


                /*
                   清除旧目标
                */

                targetAngle = null;

                targetWorld = null;

                switching = false;

                transitionProgress = 0;


                /*
                   微小前进量
                */

                starAngle =
                    normalize(
                        starAngle +
                        nextTrack.direction *
                        0.8
                    );

            }

        }


        /* -----------------------------------------------
           5.
           更新星星
        ------------------------------------------------ */

        updateStar(
            elapsed
        );


        lastTime =
            now;


        requestAnimationFrame(
            animate
        );

    }


    /* =====================================================
       初始化
    ===================================================== */

    starAngle = 300;


    updateOrbits(0);

    updateStar(0);


    /* =====================================================
       开始
    ===================================================== */

    requestAnimationFrame(
        animate
    );


})();

              </script>
