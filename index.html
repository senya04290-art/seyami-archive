<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
基础
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background: #020b24;

    color: #eaf7ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}


/* =========================
页面
========================= */

.page {
    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 620px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 44%,
            rgba(25, 76, 155, .25) 0%,
            rgba(10, 40, 90, .20) 23%,
            rgba(4, 18, 48, .78) 55%,
            #020b24 100%
        );
}


/* =========================
边框
========================= */

.frame {
    position: absolute;

    inset: 18px;

    border:
        1px solid
        rgba(92, 160, 235, .30);

    pointer-events: none;

    z-index: 20;
}

.frame::before,
.frame::after {
    content: "";

    position: absolute;

    width: 38px;
    height: 38px;

    border-color:
        rgba(112, 184, 255, .62);

    border-style: solid;
}

.frame::before {
    left: -1px;
    top: -1px;

    border-width:
        1px 0 0 1px;
}

.frame::after {
    right: -1px;
    bottom: -1px;

    border-width:
        0 1px 1px 0;
}


/* =========================
背景星空
========================= */

.stars {
    position: absolute;

    inset: 0;

    opacity: .8;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.75) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(150,205,255,.58) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.4) 0 1px,
            transparent 1.5px
        );

    background-size:
        190px 190px,
        270px 270px,
        340px 340px;

    background-position:
        20px 30px,
        100px 120px,
        40px 80px;

    animation:
        starFieldMove 28s linear infinite;

    pointer-events: none;
}

@keyframes starFieldMove {

    0% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(-18px,12px,0);
    }

    100% {
        transform:
            translate3d(0,0,0);
    }
}


/* =========================
漂浮星星
========================= */

.floating-stars {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;
}

.floating-star {
    position: absolute;

    color:
        rgba(185, 220, 255, .84);

    font-family:
        "Times New Roman",
        serif;

    text-shadow:
        0 0 5px
        rgba(175, 220, 255, .95),

        0 0 16px
        rgba(72, 145, 235, .68),

        0 0 30px
        rgba(55, 125, 225, .34);

    opacity: .35;

    animation:
        starFloat 8s ease-in-out infinite,
        starTwinkle 4s ease-in-out infinite;
}


/* =========================
原本的星星
========================= */

.star-a {
    left: 12%;
    top: 23%;
    font-size: 13px;
    animation-delay: 0s, .4s;
}

.star-b {
    left: 23%;
    top: 67%;
    font-size: 10px;
    animation-delay: 1.8s, 1.2s;
}

.star-c {
    left: 30%;
    top: 17%;
    font-size: 17px;
    animation-delay: 3s, .8s;
}

.star-d {
    left: 76%;
    top: 22%;
    font-size: 14px;
    animation-delay: 1s, 2s;
}

.star-e {
    left: 86%;
    top: 36%;
    font-size: 11px;
    animation-delay: 2.5s, .2s;
}

.star-f {
    left: 72%;
    top: 72%;
    font-size: 16px;
    animation-delay: 4s, 1.5s;
}

.star-g {
    left: 15%;
    top: 48%;
    font-size: 14px;
    animation-delay: 2s, 2.5s;
}

.star-h {
    left: 91%;
    top: 69%;
    font-size: 13px;
    animation-delay: 3.5s, 1s;
}

.star-i {
    left: 58%;
    top: 14%;
    font-size: 9px;
    animation-delay: 1.5s, 3s;
}

.star-j {
    left: 63%;
    top: 83%;
    font-size: 14px;
    animation-delay: 4.5s, 2s;
}

.star-k {
    left: 39%;
    top: 78%;
    font-size: 9px;
    animation-delay: 2.2s, .5s;
}

.star-l {
    left: 81%;
    top: 54%;
    font-size: 15px;
    animation-delay: 3.8s, 2.8s;
}


/* =========================
新增 ✡ ✶ 星象符号
========================= */

.star-m {
    left: 18%;
    top: 35%;

    font-size: 15px;

    opacity: .42;

    animation-delay:
        1.2s,
        2.4s;
}

.star-n {
    left: 43%;
    top: 25%;

    font-size: 13px;

    opacity: .50;

    animation-delay:
        3.4s,
        1.3s;
}

.star-o {
    left: 68%;
    top: 62%;

    font-size: 18px;

    opacity: .38;

    animation-delay:
        2.6s,
        .7s;
}

.star-p {
    left: 88%;
    top: 18%;

    font-size: 12px;

    opacity: .48;

    animation-delay:
        4.2s,
        2.1s;
}


/* =========================
漂浮动画
========================= */

@keyframes starFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    50% {
        transform:
            translate3d(0,-18px,0)
            rotate(10deg);
    }
}


/* =========================
闪烁动画
========================= */

@keyframes starTwinkle {

    0%,
    100% {
        opacity: .25;

        filter:
            blur(.2px);
    }

    50% {
        opacity: 1;

        filter:
            blur(0)
            drop-shadow(
                0 0 7px
                rgba(145,205,255,.85)
            );
    }
}


/* =========================
中央光晕
========================= */

.glow {
    position: absolute;

    left: 50%;
    top: 43%;

    width: 600px;
    height: 600px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(42,105,205,.15) 0%,
            rgba(24,68,150,.08) 28%,
            transparent 68%
        );

    filter: blur(5px);

    pointer-events: none;
}


/* =========================
魔法阵
========================= */

.magic-circle {
    position: absolute;

    left: 50%;
    top: 52%;

    width: 520px;
    height: 520px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(92,160,235,.15);

    box-shadow:
        0 0 40px
        rgba(45,110,210,.07),

        inset 0 0 40px
        rgba(45,110,210,.06);

    opacity: .7;

    pointer-events: none;
}

.magic-circle::before,
.magic-circle::after {
    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(98,170,240,.12);
}

.magic-circle::after {
    inset: 88px;

    border:
        1px dashed
        rgba(112,182,248,.10);

    animation:
        circleRotate 40s linear infinite;
}

@keyframes circleRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================
顶部导航
========================= */

.nav {
    position: absolute;

    left: 58px;
    right: 58px;
    top: 46px;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    z-index: 30;
}


/* =========================
左上角 Logo
========================= */

.logo {
    display: flex;

    align-items: flex-start;

    gap: 13px;

    color:
        rgba(218,240,255,.92);

    white-space: nowrap;
}

.logo-symbol {
    color:
        #79bbf7;

    font-size: 17px;

    line-height: 1;

    text-shadow:
        0 0 10px
        rgba(78,160,245,.7);

    margin-top: 3px;
}

.logo-text {
    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 2px;
}

.logo-cn {
    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(218,240,255,.92);
}

.logo-en {
    display: block;

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(178,215,252,.76);

    opacity: .65;
}


/* =========================
导航
========================= */

.nav-links {
    display: flex;

    gap: 34px;
}

.nav-links a {
    position: relative;

    color:
        rgba(202,228,255,.68);

    text-decoration: none;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    transition:
        color .35s ease,
        text-shadow .35s ease;
}

.nav-links a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    width: 0;
    height: 1px;

    background:
        rgba(135,195,255,.85);

    transform:
        translateX(-50%);

    transition:
        width .35s ease;
}

.nav-links a:hover {
    color:
        rgba(232,248,255,.98);

    text-shadow:
        0 0 12px
        rgba(72,160,240,.55);
}

.nav-links a:hover::after {
    width: 100%;
}


/* =========================
Hero
========================= */

.hero {
    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(1000px, 90vw);

    transform:
        translate(-50%, -47%);

    text-align: center;

    z-index: 10;
}


/* =========================
顶部装饰
========================= */

.symbol {
    margin-bottom: 28px;

    color:
        rgba(158,210,255,.74);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 17px;

    letter-spacing: 8px;

    text-shadow:
        0 0 12px
        rgba(78,160,245,.48);

    animation:
        symbolBreath 4s ease-in-out infinite;
}

@keyframes symbolBreath {

    0%,
    100% {
        opacity: .55;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
SEYAMI ARCHIVE
========================= */

.title-en {
    display: flex;

    flex-direction: row;

    align-items: baseline;

    justify-content: center;

    gap: clamp(28px, 4vw, 62px);

    width: 100%;

    font-family:
        "Cormorant Garamond",
        "Bodoni 72",
        "Didot",
        "Baskerville",
        "Times New Roman",
        serif;

    font-weight: 300;

    color:
        rgba(244,250,255,.96);

    text-shadow:
        0 0 5px
        rgba(225,247,255,.52),

        0 0 18px
        rgba(72,160,240,.24),

        0 0 45px
        rgba(45,115,215,.12);

    transform:
        scaleX(.92);

    line-height: .82;

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        geometricPrecision;
}

.title-word {
    display: block;

    white-space: nowrap;
}


/* =========================
SEYAMI
========================= */

.title-word:first-child {
    font-size:
        clamp(76px, 10.5vw, 136px);

    font-weight: 300;

    letter-spacing:
        clamp(11px, 1.8vw, 24px);

    padding-left:
        clamp(11px, 1.8vw, 24px);
}


/* =========================
ARCHIVE
========================= */

.title-word:last-child {
    display: block;

    margin-top: 0;

    font-size:
        clamp(68px, 9.6vw, 124px);

    font-weight: 300;

    letter-spacing:
        clamp(14px, 2.2vw, 29px);

    padding-left:
        clamp(14px, 2.2vw, 29px);

    opacity: .96;
}


/* =========================
标题装饰线
========================= */

.title-line {
    width: 180px;

    height: 1px;

    margin:
        31px auto 23px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(135,195,255,.62),
            transparent
        );

    box-shadow:
        0 0 10px
        rgba(72,160,240,.18);
}


/* =========================
中文标题
========================= */

.title-cn {
    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 18px;

    font-weight: 300;

    letter-spacing: 8px;

    padding-left: 8px;

    color:
        rgba(220,241,255,.91);

    text-shadow:
        0 0 15px
        rgba(72,160,240,.22);
}


/* =========================
简介
========================= */

.description {
    margin-top: 22px;

    color:
        rgba(184,216,242,.62);

    font-size: 12px;

    font-weight: 300;

    line-height: 2.25;

    letter-spacing: 4px;

    padding-left: 4px;
}


/* =========================
进入按钮
========================= */

.enter-button {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 32px;

    min-width: 190px;

    height: 45px;

    padding: 0 25px;

    border:
        1px solid
        rgba(112,185,250,.40);

    color:
        rgba(216,242,255,.90);

    text-decoration: none;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 4px;

    background:
        rgba(35,90,165,.045);

    box-shadow:
        inset 0 0 20px
        rgba(48,125,215,.035),

        0 0 20px
        rgba(45,115,215,.045);

    transition:
        background .4s ease,
        border-color .4s ease,
        box-shadow .4s ease,
        color .4s ease,
        transform .4s ease;
}

.enter-button:hover {
    color:
        #f2fbff;

    border-color:
        rgba(145,205,255,.72);

    background:
        rgba(40,100,185,.08);

    box-shadow:
        0 0 25px
        rgba(72,160,240,.12),

        inset 0 0 25px
        rgba(72,160,240,.06);

    transform:
        translateY(-2px);
}


/* =========================
底部
========================= */

.footer-mark {
    position: absolute;

    left: 50%;
    bottom: 38px;

    transform:
        translateX(-50%);

    color:
        rgba(152,199,235,.30);

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    z-index: 10;
}


/* =========================
手机端
========================= */

@media (max-width: 700px) {

    .page {
        min-height: 580px;
    }

    .frame {
        inset: 11px;
    }

    .nav {
        left: 30px;
        right: 30px;
        top: 30px;
    }

    .logo {
        gap: 9px;
    }

    .logo-symbol {
        font-size: 13px;
    }

    .logo-cn {
        font-size: 10px;
        letter-spacing: 2px;
    }

    .logo-en {
        font-size: 9px;
        letter-spacing: 2.5px;
    }

    .nav-links {
        gap: 14px;
    }

    .nav-links a {
        font-size: 10px;
        letter-spacing: 1px;
    }

    .nav-links a:nth-child(3) {
        display: none;
    }

    .hero {
        width: 94vw;

        transform:
            translate(-50%, -46%);
    }

    .symbol {
        margin-bottom: 23px;

        font-size: 13px;

        letter-spacing: 5px;
    }

    /* 手机端恢复两行 */
    .title-en {
        flex-direction: column;

        gap: 0;
    }

    .title-word:first-child {
        font-size:
            clamp(58px, 16vw, 88px);

        letter-spacing: 7px;

        padding-left: 7px;
    }

    .title-word:last-child {
        margin-top: 11px;

        font-size:
            clamp(52px, 14.5vw, 80px);

        letter-spacing: 9px;

        padding-left: 9px;
    }

    .title-line {
        width: 120px;

        margin:
            25px auto 19px;
    }

    .title-cn {
        font-size: 14px;

        letter-spacing: 5px;

        padding-left: 5px;
    }

    .description {
        margin-top: 18px;

        font-size: 10px;

        letter-spacing: 2px;

        line-height: 2;
    }

    .enter-button {
        margin-top: 26px;

        min-width: 170px;

        height: 42px;

        font-size: 10px;

        letter-spacing: 3px;
    }

    .magic-circle {
        width: 390px;
        height: 390px;
    }

    .footer-mark {
        bottom: 25px;

        font-size: 8px;

        letter-spacing: 2px;
    }
}


/* =========================
超小屏
========================= */

@media (max-width: 420px) {

    .nav-links {
        display: none;
    }

    .nav {
        justify-content: flex-start;
    }

    .title-word:first-child {
        font-size: 59px;

        letter-spacing: 6px;

        padding-left: 6px;
    }

    .title-word:last-child {
        font-size: 52px;

        letter-spacing: 7px;

        padding-left: 7px;
    }

    .title-cn {
        font-size: 13px;
    }

    .description {
        font-size: 9px;
    }
}

</style>
</head>
