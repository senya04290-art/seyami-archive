<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;
    overflow-x:hidden;

    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}


/* =========================================================
   页面背景
========================================================= */

.page{
    position:relative;

    width:100%;
    min-height:100vh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),

        #061426;
}


/* =========================================================
   星空
========================================================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.stars::before,
.stars::after{

    content:"";

    position:absolute;
    inset:-20%;

    background-image:

        radial-gradient(
            circle,
            rgba(182,220,255,.7) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(130,191,239,.45) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(220,240,255,.35) 0 1px,
            transparent 1.5px
        );

    background-size:
        180px 180px,
        240px 240px,
        310px 310px;

    background-position:
        20px 30px,
        80px 120px,
        150px 70px;

    opacity:.45;

    animation:
        starMove
        35s
        linear
        infinite;
}

.stars::after{

    opacity:.22;

    transform:scale(1.15);

    animation-duration:50s;
}


@keyframes starMove{

    from{
        transform:
            translate3d(0,0,0);
    }

    to{
        transform:
            translate3d(-80px,50px,0);
    }

}


/* =========================================================
   浮动星星
========================================================= */

.floating-stars{

    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:2;
}

.floating-stars span{

    position:absolute;

    color:
        rgba(158,207,247,.62);

    font-family:
        serif;

    font-size:14px;

    text-shadow:
        0 0 8px
        rgba(96,177,242,.5);

    animation:
        floatStar
        6s
        ease-in-out
        infinite;
}


.floating-stars span:nth-child(1){
    left:12%;
    top:24%;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:20%;
    top:67%;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(3){
    left:77%;
    top:22%;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:84%;
    top:70%;
    animation-delay:1s;
}

.floating-stars span:nth-child(5){
    left:30%;
    top:17%;
    animation-delay:3s;
}

.floating-stars span:nth-child(6){
    left:71%;
    top:61%;
    animation-delay:2s;
}

.floating-stars span:nth-child(7){
    left:16%;
    top:46%;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:89%;
    top:43%;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(9){
    left:42%;
    top:11%;
    animation-delay:2.2s;
}

.floating-stars span:nth-child(10){
    left:57%;
    top:83%;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(11){
    left:7%;
    top:78%;
    animation-delay:1.2s;
}

.floating-stars span:nth-child(12){
    left:94%;
    top:18%;
    animation-delay:4.2s;
}


@keyframes floatStar{

    0%,
    100%{

        opacity:.35;

        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{

        opacity:.85;

        transform:
            translateY(-8px)
            rotate(12deg);
    }

}


/* =========================================================
   外框
========================================================= */

.frame{

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;
}

.frame::before{

    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(81,142,193,.08);
}


/* =========================================================
   四角六芒星
========================================================= */

.corner{

    position:absolute;

    width:68px;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.corner::before{

    content:"✡";

    display:block;

    font-family:
        "Times New Roman",
        serif;

    font-size:31px;
    font-weight:400;

    line-height:1;

    color:
        rgba(108,178,230,.88);

    text-shadow:

        0 0 5px
        rgba(67,153,218,.5),

        0 0 13px
        rgba(43,124,190,.28);
}


.corner.tl{
    left:-34px;
    top:-34px;
}

.corner.tr{
    right:-34px;
    top:-34px;
}

.corner.bl{
    left:-34px;
    bottom:-34px;
}

.corner.br{
    right:-34px;
    bottom:-34px;
}


/* =========================================================
   顶部导航
========================================================= */

.top-nav{

    position:absolute;

    left:58px;
    right:58px;

    top:38px;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    z-index:20;
}


/* =========================================================
   Logo
========================================================= */

.logo{

    display:flex;

    align-items:baseline;

    gap:10px;

    color:#d9edff;

    text-decoration:none;
}


.logo-mark{

    width:auto;
    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    font-weight:400;

    line-height:1;

    color:
        rgba(137,201,239,.9);

    position:relative;

    top:1px;

    text-shadow:

        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);
}


/* =========================================================
   Logo文字
========================================================= */

.logo-text{

    display:flex;

    flex-direction:column;

    line-height:1.05;
}

.logo-cn{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:15px;

    font-weight:400;

    letter-spacing:2px;
}

.logo-en{

    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.63);
}


/* =========================================================
   导航
========================================================= */

.nav-links{

    display:flex;

    align-items:center;

    gap:31px;
}

.nav-links a{

    position:relative;

    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:2px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.nav-links a::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-8px;

    width:0;

    height:1px;

    background:
        rgba(122,192,235,.7);

    transform:
        translateX(-50%);

    transition:
        width .3s ease;
}

.nav-links a:hover{

    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}

.nav-links a:hover::after{
    width:100%;
}


/* =========================================================
   主区域
========================================================= */

.main{

    position:relative;

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:5;

    padding:
        80px
        20px
        70px;
}


/* =========================================================
   外层魔法圆
========================================================= */

.magic-circle{

    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    opacity:.55;
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.28);

    box-shadow:
        0 0 22px
        rgba(47,126,184,.08);

    animation:
        rotateCircle
        80s
        linear
        infinite;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:27px;

    border-radius:50%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        inset 0 0 20px
        rgba(62,139,194,.04);

    animation:
        rotateCircleReverse
        55s
        linear
        infinite;
}


@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}


/* =========================================================
   ★★★ 三条真正交叉的星轨 ★★★

   A → A/B → B → B/C → C → C/A → A
========================================================= */

.orbit-system{

    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:4;
}


/* SVG */

.orbit-svg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;
}


/* 三条轨道 */

.orbit-path{

    fill:none;

    stroke:
        rgba(69,164,230,.29);

    stroke-width:1;

    vector-effect:
        non-scaling-stroke;

    filter:
        drop-shadow(
            0 0 5px
            rgba(70,155,210,.10)
        );
}


/* =========================================================
   轨道内部的细虚线
========================================================= */

.orbit-detail{

    fill:none;

    stroke:
        rgba(104,181,226,.12);

    stroke-width:.65;

    stroke-dasharray:3 9;

    vector-effect:
        non-scaling-stroke;
}


/* =========================================================
   交叉点的小光点
========================================================= */

.orbit-cross{

    fill:
        rgba(117,192,235,.30);

    filter:
        drop-shadow(
            0 0 5px
            rgba(83,170,224,.35)
        );
}


/* =========================================================
   唯一一颗运动星辰
========================================================= */

.travel-star{

    position:absolute;

    left:0;
    top:0;

    width:20px;
    height:20px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:30;

    will-change:
        left,
        top;
}


.travel-star::before{

    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-family:
        "Times New Roman",
        serif;

    font-size:15px;

    line-height:1;

    color:
        rgba(210,237,255,.96);

    text-shadow:

        0 0 4px
        rgba(147,213,247,.95),

        0 0 9px
        rgba(88,176,231,.75),

        0 0 18px
        rgba(63,143,204,.45);
}


/* =========================================================
   魔法阵十字线
========================================================= */

.magic-line{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(92,164,213,.13);
}

.magic-line.horizontal{

    width:490px;

    height:1px;
}

.magic-line.vertical{

    width:1px;

    height:490px;
}


/* =========================================================
   魔法阵中心
========================================================= */

.magic-center{

    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(133,202,242,.48);

    border-radius:50%;

    box-shadow:
        0 0 10px
        rgba(88,171,224,.25);
}

.magic-center::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(174,221,249,.7);

    box-shadow:
        0 0 8px
        rgba(126,203,244,.8);
}


/* =========================================================
   标题
========================================================= */

.title-area{

    position:relative;

    text-align:center;

    z-index:8;

    margin-top:-18px;
}

.main-title{

    display:flex;

    flex-direction:column;

    align-items:center;

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        serif;

    font-weight:400;

    line-height:.83;

    letter-spacing:8px;

    color:#dceeff;

    text-shadow:
        0 0 18px
        rgba(94,172,222,.08);
}

.main-title .seyami{

    font-size:70px;
}

.main-title .archive{

    margin-top:15px;

    font-size:87px;

    letter-spacing:9px;
}


/* =========================================================
   标题装饰
========================================================= */

.title-decoration{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    margin-top:29px;

    opacity:.7;
}

.title-decoration .line{

    width:95px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(115,182,224,.62)
        );
}

.title-decoration .line.right{

    background:
        linear-gradient(
            90deg,
            rgba(115,182,224,.62),
            transparent
        );
}

.title-decoration .diamond{

    width:6px;
    height:6px;

    border:
        1px solid
        rgba(143,202,237,.8);

    transform:rotate(45deg);
}


/* =========================================================
   中文标题
========================================================= */

.chinese-title{

    margin-top:24px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:8px;

    color:
        rgba(207,229,246,.86);
}


/* =========================================================
   简介
========================================================= */

.description{

    margin-top:20px;

    display:flex;

    flex-direction:column;

    gap:7px;

    text-align:center;

    color:
        rgba(177,207,230,.62);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    line-height:1.7;

    letter-spacing:2px;
}


/* =========================================================
   进入档案馆
========================================================= */

.enter-wrap{

    position:relative;

    width:370px;
    height:82px;

    margin-top:42px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.enter-wrap::before{

    content:"";

    position:absolute;

    inset:0;

    clip-path:
        polygon(
            0 20%,
            5% 20%,
            8% 0,
            92% 0,
            95% 20%,
            100% 20%,
            100% 80%,
            95% 80%,
            92% 100%,
            8% 100%,
            5% 80%,
            0 80%
        );

    border:
        1px solid
        rgba(91,167,218,.38);

    background:
        rgba(8,28,49,.48);

    box-shadow:
        0 0 22px
        rgba(39,120,180,.08);

    pointer-events:none;
}


.enter-wrap::after{

    content:"";

    position:absolute;

    left:13px;
    right:13px;

    top:13px;
    bottom:13px;

    border:
        1px solid
        rgba(91,164,213,.16);

    pointer-events:none;
}


.enter-button{

    position:relative;

    z-index:2;

    width:300px;
    height:50px;

    border:none;

    outline:none;

    cursor:pointer;

    color:#d9edff;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    border-top:
        1px solid
        rgba(105,180,225,.38);

    border-bottom:
        1px solid
        rgba(105,180,225,.38);

    transition:
        background .35s ease,
        box-shadow .35s ease,
        letter-spacing .35s ease;
}

.enter-button:hover{

    background:
        linear-gradient(
            90deg,
            rgba(10,41,67,.95),
            rgba(23,66,98,.95),
            rgba(10,41,67,.95)
        );

    box-shadow:
        0 0 22px
        rgba(56,143,201,.18);

    letter-spacing:5px;
}

.enter-button:active{
    transform:translateY(1px);
}


/* =========================================================
   按钮星星
========================================================= */

.enter-star{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    color:
        rgba(111,186,229,.75);

    font-size:16px;

    text-shadow:
        0 0 9px
        rgba(67,158,215,.45);
}

.enter-star.left{
    left:26px;
}

.enter-star.right{
    right:26px;
}


/* =========================================================
   按钮菱形
========================================================= */

.enter-diamond{

    position:absolute;

    left:50%;

    width:6px;
    height:6px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border:
        1px solid
        rgba(116,187,226,.65);

    background:#061426;
}

.enter-diamond.top{
    top:-3px;
}

.enter-diamond.bottom{
    bottom:-3px;
}


/* =========================================================
   页脚
========================================================= */

.footer{

    position:absolute;

    left:50%;

    bottom:32px;

    transform:
        translateX(-50%);

    z-index:15;

    color:
        rgba(133,177,207,.38);

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    white-space:nowrap;
}


/* =========================================================
   平板
========================================================= */

@media(max-width:800px){

    .top-nav{

        left:35px;
        right:35px;
        top:30px;
    }

    .nav-links{
        gap:17px;
    }

    .nav-links a{

        font-size:11px;
        letter-spacing:1px;
    }

    .magic-circle{

        width:500px;
        height:500px;
    }

    .orbit-system{

        width:500px;
        height:500px;
    }

    .main-title .seyami{
        font-size:58px;
    }

    .main-title .archive{
        font-size:70px;
    }

    .chinese-title{
        font-size:18px;
    }

    .description{
        font-size:11px;
    }

}


/* =========================================================
   手机
========================================================= */

@media(max-width:520px){

    .frame{
        inset:12px;
    }


    .top-nav{

        left:25px;
        right:25px;
        top:24px;
    }


    .logo{

        gap:8px;

        align-items:baseline;
    }


    .logo-mark{

        font-size:18px;

        position:relative;

        top:1px;
    }


    .logo-cn{

        font-size:12px;

        letter-spacing:1px;
    }


    .logo-en{

        font-size:6px;

        letter-spacing:2px;
    }


    .nav-links{
        gap:12px;
    }


    .nav-links a{

        font-size:9px;

        letter-spacing:0;
    }


    .corner{

        width:55px;
        height:55px;
    }


    .corner.tl{

        left:-27.5px;
        top:-27.5px;
    }

    .corner.tr{

        right:-27.5px;
        top:-27.5px;
    }

    .corner.bl{

        left:-27.5px;
        bottom:-27.5px;
    }

    .corner.br{

        right:-27.5px;
        bottom:-27.5px;
    }


    .corner::before{
        font-size:26px;
    }


    .main{

        padding:
            100px
            15px
            70px;
    }


    .magic-circle{

        width:390px;
        height:390px;

        opacity:.48;
    }


    .orbit-system{

        width:390px;
        height:390px;
    }


    .magic-line.horizontal{
        width:350px;
    }

    .magic-line.vertical{
        height:350px;
    }


    .main-title{

        letter-spacing:5px;
    }

    .main-title .seyami{

        font-size:43px;
    }

    .main-title .archive{

        margin-top:11px;

        font-size:53px;

        letter-spacing:6px;
    }


    .title-decoration{

        margin-top:23px;
    }

    .title-decoration .line{
        width:55px;
    }


    .chinese-title{

        margin-top:20px;

        font-size:15px;

        letter-spacing:5px;
    }


    .description{

        margin-top:16px;

        font-size:10px;

        letter-spacing:1px;
    }


    .enter-wrap{

        width:320px;
        height:76px;

        margin-top:35px;
    }


    .enter-button{

        width:255px;
        height:46px;

        font-size:11px;

        letter-spacing:3px;
    }


    .enter-star.left{
        left:23px;
    }

    .enter-star.right{
        right:23px;
    }


    .footer{

        bottom:21px;

        font-size:6px;

        letter-spacing:2px;
    }

}

</style>

</head>

<!-- =========================================================
     ★★★ 三轨换轨系统

<script>

/*
    ============================================================
    核心逻辑

    一颗星星：

    A轨道
       ↓
    A/B交叉点
       ↓
    B轨道
       ↓
    B/C交叉点
       ↓
    C轨道
       ↓
    C/A交叉点
       ↓
    A轨道

    无限循环。
    ============================================================
*/


const svg =
    document.querySelector(".orbit-svg");

const orbitSystem =
    document.querySelector(".orbit-system");

const star =
    document.querySelector("#travelStar");


const pathA =
    document.querySelector("#orbitA");

const pathB =
    document.querySelector("#orbitB");

const pathC =
    document.querySelector("#orbitC");


const detailA =
    document.querySelector("#detailA");

const detailB =
    document.querySelector("#detailB");

const detailC =
    document.querySelector("#detailC");


const crossAB =
    document.querySelector("#crossAB");

const crossBC =
    document.querySelector("#crossBC");

const crossCA =
    document.querySelector("#crossCA");


/* =========================================================
   SVG 尺寸
========================================================= */

const SIZE = 560;

const CENTER = 280;


/* =========================================================
   生成旋转椭圆

   三条轨道：

   A = 0°
   B = 60°
   C = 120°

   它们不是同心圆，
   而是三条互相穿过的轨道。
========================================================= */

function createEllipsePoints(
    rx,
    ry,
    rotation,
    steps = 360
){

    const points = [];

    const rad =
        rotation * Math.PI / 180;

    const cosR =
        Math.cos(rad);

    const sinR =
        Math.sin(rad);


    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t =
            (Math.PI * 2 * i)
            / steps;

        const x =
            rx * Math.cos(t);

        const y =
            ry * Math.sin(t);


        const rotatedX =
            x * cosR -
            y * sinR;

        const rotatedY =
            x * sinR +
            y * cosR;


        points.push({

            x:
                CENTER + rotatedX,

            y:
                CENTER + rotatedY

        });

    }


    return points;
}


/* =========================================================
   生成 SVG path
========================================================= */

function pointsToPath(points){

    let d =
        `M ${points[0].x} ${points[0].y}`;

    for(
        let i=1;
        i<points.length;
        i++
    ){

        d +=
            ` L ${points[i].x} ${points[i].y}`;

    }

    d += " Z";

    return d;
}


/* =========================================================
   三条轨道

   半长轴：230
   半短轴：88

   旋转：

   A = 0°
   B = 60°
   C = 120°
========================================================= */

const pointsA =
    createEllipsePoints(
        230,
        88,
        0
    );

const pointsB =
    createEllipsePoints(
        230,
        88,
        60
    );

const pointsC =
    createEllipsePoints(
        230,
        88,
        120
    );


pathA.setAttribute(
    "d",
    pointsToPath(pointsA)
);

pathB.setAttribute(
    "d",
    pointsToPath(pointsB)
);

pathC.setAttribute(
    "d",
    pointsToPath(pointsC)
);


/* =========================================================
   内部虚线
========================================================= */

function createDetailPath(
    rx,
    ry,
    rotation
){

    const points =
        createEllipsePoints(
            rx,
            ry,
            rotation
        );

    return pointsToPath(points);
}


detailA.setAttribute(
    "d",
    createDetailPath(
        218,
        78,
        0
    )
);

detailB.setAttribute(
    "d",
    createDetailPath(
        218,
        78,
        60
    )
);

detailC.setAttribute(
    "d",
    createDetailPath(
        218,
        78,
        120
    )
);


/* =========================================================
   寻找两个轨道的交叉位置

   用采样方式寻找最接近的点。
========================================================= */

function findIntersections(
    path1,
    path2
){

    const length1 =
        path1.getTotalLength();

    const length2 =
        path2.getTotalLength();


    const results = [];


    /*
       先粗略扫描
    */

    for(
        let i=0;
        i<=180;
        i++
    ){

        const d1 =
            length1 * i / 180;

        const p1 =
            path1.getPointAtLength(d1);


        for(
            let j=0;
            j<=180;
            j++
        ){

            const d2 =
                length2 * j / 180;

            const p2 =
                path2.getPointAtLength(d2);


            const dx =
                p1.x - p2.x;

            const dy =
                p1.y - p2.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                distance < 3
            ){

                results.push({

                    d1:d1,
                    d2:d2,

                    x:
                        (p1.x+p2.x)/2,

                    y:
                        (p1.y+p2.y)/2,

                    distance

                });

            }

        }

    }


    /*
       去除非常接近的重复点
    */

    const unique = [];


    results.forEach(
        point => {

            const exists =
                unique.some(
                    existing => {

                        const dx =
                            existing.x -
                            point.x;

                        const dy =
                            existing.y -
                            point.y;

                        return (
                            Math.sqrt(
                                dx*dx +
                                dy*dy
                            ) < 12
                        );

                    }
                );


            if(!exists){

                unique.push(point);

            }

        }
    );


    return unique;
}


/* =========================================================
   获取三个轨道之间的交叉点
========================================================= */

const intersectionsAB =
    findIntersections(
        pathA,
        pathB
    );

const intersectionsBC =
    findIntersections(
        pathB,
        pathC
    );

const intersectionsCA =
    findIntersections(
        pathC,
        pathA
    );


/* =========================================================
   选择交叉点

   每一对轨道有多个交叉点。
   我们选择三个分布比较开的点，
   让路线看起来像一个持续运行的星轨。
========================================================= */

function chooseIntersection(
    intersections,
    preferredX,
    preferredY
){

    let best =
        intersections[0];

    let bestDistance =
        Infinity;


    intersections.forEach(
        point => {

            const dx =
                point.x -
                preferredX;

            const dy =
                point.y -
                preferredY;

            const distance =
                dx*dx +
                dy*dy;


            if(
                distance <
                bestDistance
            ){

                bestDistance =
                    distance;

                best =
                    point;

            }

        }
    );


    return best;
}


/*
   A/B：
   选择左上附近的交叉位置
*/

const AB =
    chooseIntersection(
        intersectionsAB,
        150,
        190
    );


/*
   B/C：
   选择右上附近的交叉位置
*/

const BC =
    chooseIntersection(
        intersectionsBC,
        410,
        190
    );


/*
   C/A：
   选择下方附近的交叉位置
*/

const CA =
    chooseIntersection(
        intersectionsCA,
        280,
        430
    );


/* =========================================================
   显示三个交叉点
========================================================= */

crossAB.setAttribute(
    "cx",
    AB.x
);

crossAB.setAttribute(
    "cy",
    AB.y
);


crossBC.setAttribute(
    "cx",
    BC.x
);

crossBC.setAttribute(
    "cy",
    BC.y
);


crossCA.setAttribute(
    "cx",
    CA.x
);

crossCA.setAttribute(
    "cy",
    CA.y
);


/* =========================================================
   三条轨道长度
========================================================= */

const lengthA =
    pathA.getTotalLength();

const lengthB =
    pathB.getTotalLength();

const lengthC =
    pathC.getTotalLength();


/* =========================================================
   让星星移动到路径上的某个位置
========================================================= */

function setStarPosition(
    path,
    distance
){

    const totalLength =
        path.getTotalLength();


    /*
       保证距离始终在轨道范围内
    */

    let d =
        distance % totalLength;


    if(d < 0){

        d += totalLength;

    }


    const point =
        path.getPointAtLength(d);


    /*
       orbit-system 在不同屏幕下
       会有不同实际尺寸。

       SVG 坐标需要换算成 CSS 像素。
    */

    const scale =
        orbitSystem.clientWidth /
        SIZE;


    star.style.left =
        (
            point.x * scale
        ) + "px";


    star.style.top =
        (
            point.y * scale
        ) + "px";
}


/* =========================================================
   平滑移动

   使用 easeInOut，
   让星星在换轨点不会突然加速/减速。
========================================================= */

function moveAlongPath(
    path,
    startDistance,
    endDistance,
    duration
){

    return new Promise(
        resolve => {

            const startTime =
                performance.now();


            /*
               处理跨过终点的情况
            */

            let distanceDelta =
                endDistance -
                startDistance;


            if(
                distanceDelta < 0
            ){

                distanceDelta +=
                    path.getTotalLength();

            }


            function animate(
                currentTime
            ){

                const elapsed =
                    currentTime -
                    startTime;


                const rawProgress =
                    Math.min(
                        elapsed /
                        duration,
                        1
                    );


                /*
                   smoothstep
                */

                const progress =
                    rawProgress *
                    rawProgress *
                    (
                        3 -
                        2 *
                        rawProgress
                    );


                const currentDistance =
                    startDistance +
                    distanceDelta *
                    progress;


                setStarPosition(
                    path,
                    currentDistance
                );


                if(
                    rawProgress < 1
                ){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );
}


/* =========================================================
   找到从某个交叉点出发的方向

   为了让星星不会在交叉点突然倒退，
   根据两个方向选择顺时针的一侧。
========================================================= */

function getForwardDistance(
    path,
    targetDistance
){

    return targetDistance;
}


/* =========================================================
   主循环

   ★ A
      ↓
   ★ A/B
      ↓
   ★ B
      ↓
   ★ B/C
      ↓
   ★ C
      ↓
   ★ C/A
      ↓
   ★ A
========================================================= */

async function travel(){

    /*
       A轨道起点

       从 A 的一个位置开始
    */

    const startA =
        0;


    /*
       A → A/B
    */

    await moveAlongPath(
        pathA,
        startA,
        AB.d1,
        8500
    );


    /*
       现在星星就在
       A/B 的真实交叉点。

       直接把路径控制权交给 B。

       因为两条轨道在这里相交，
       所以视觉上是连续的。
    */

    setStarPosition(
        pathB,
        AB.d2
    );


    /*
       B → B/C
    */

    await moveAlongPath(
        pathB,
        AB.d2,
        BC.d2,
        8500
    );


    /*
       B/C
       ↓
       C
    */

    setStarPosition(
        pathC,
        BC.d2
    );


    /*
       C → C/A
    */

    await moveAlongPath(
        pathC,
        BC.d2,
        CA.d2,
        8500
    );


    /*
       C/A
       ↓
       A
    */

    setStarPosition(
        pathA,
        CA.d1
    );


    /*
       A → 下一次 A/B
    */

    await moveAlongPath(
        pathA,
        CA.d1,
        AB.d1,
        8500
    );


    /*
       无限循环
    */

    travel();
}

        setTimeout(

);

</script>
