<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #020b24;
    color: #eaf4ff;
    overflow-x: hidden;
    font-family:
        "Noto Serif SC",
        "Times New Roman",
        serif;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   页面主体
========================================================= */

.page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(25, 76, 155, .24) 0%,
            rgba(10, 40, 90, .20) 25%,
            rgba(4, 18, 48, .80) 58%,
            #020b24 100%
        );
}


/* =========================================================
   星星背景
========================================================= */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .9;

    background-image:
        radial-gradient(circle at 12% 18%, rgba(185,220,255,.9) 0 1px, transparent 1.7px),
        radial-gradient(circle at 22% 74%, rgba(125,180,255,.65) 0 1px, transparent 1.6px),
        radial-gradient(circle at 35% 21%, rgba(210,235,255,.8) 0 1px, transparent 1.7px),
        radial-gradient(circle at 47% 13%, rgba(130,190,255,.65) 0 1px, transparent 1.6px),
        radial-gradient(circle at 58% 77%, rgba(190,225,255,.75) 0 1px, transparent 1.7px),
        radial-gradient(circle at 72% 23%, rgba(150,205,255,.75) 0 1px, transparent 1.6px),
        radial-gradient(circle at 82% 67%, rgba(205,232,255,.8) 0 1px, transparent 1.7px),
        radial-gradient(circle at 91% 35%, rgba(130,190,255,.65) 0 1px, transparent 1.6px),
        radial-gradient(circle at 7% 51%, rgba(155,210,255,.7) 0 1px, transparent 1.7px),
        radial-gradient(circle at 66% 45%, rgba(205,232,255,.55) 0 1px, transparent 1.6px);
}


/* =========================================================
   浮动星星
========================================================= */

.floating-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
}

.floating-star {
    position: absolute;
    color: rgba(190,225,255,.84);
    font-family: serif;
    text-shadow:
        0 0 5px rgba(82,158,245,.9),
        0 0 14px rgba(72,145,235,.55);
    animation:
        floatStar 7s ease-in-out infinite;
}

.floating-star:nth-child(1) {
    left: 10%;
    top: 27%;
    font-size: 12px;
    animation-delay: -1s;
}

.floating-star:nth-child(2) {
    left: 18%;
    top: 61%;
    font-size: 9px;
    animation-delay: -3s;
}

.floating-star:nth-child(3) {
    left: 27%;
    top: 17%;
    font-size: 7px;
    animation-delay: -5s;
}

.floating-star:nth-child(4) {
    left: 35%;
    top: 72%;
    font-size: 11px;
    animation-delay: -2s;
}

.floating-star:nth-child(5) {
    left: 43%;
    top: 23%;
    font-size: 8px;
    animation-delay: -4s;
}

.floating-star:nth-child(6) {
    left: 54%;
    top: 67%;
    font-size: 10px;
    animation-delay: -6s;
}

.floating-star:nth-child(7) {
    left: 64%;
    top: 16%;
    font-size: 9px;
    animation-delay: -2s;
}

.floating-star:nth-child(8) {
    left: 74%;
    top: 72%;
    font-size: 13px;
    animation-delay: -5s;
}

.floating-star:nth-child(9) {
    left: 84%;
    top: 30%;
    font-size: 8px;
    animation-delay: -3s;
}

.floating-star:nth-child(10) {
    left: 91%;
    top: 57%;
    font-size: 11px;
    animation-delay: -6s;
}

.floating-star:nth-child(11) {
    left: 14%;
    top: 43%;
    font-size: 7px;
    animation-delay: -4s;
}

.floating-star:nth-child(12) {
    left: 79%;
    top: 49%;
    font-size: 8px;
    animation-delay: -1s;
}

.floating-star:nth-child(13) {
    left: 32%;
    top: 84%;
    font-size: 9px;
    animation-delay: -5s;
}

.floating-star:nth-child(14) {
    left: 68%;
    top: 84%;
    font-size: 7px;
    animation-delay: -2s;
}

@keyframes floatStar {
    0%,
    100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: .45;
    }

    50% {
        transform: translate3d(0, -12px, 0) rotate(12deg);
        opacity: 1;
    }
}


/* =========================================================
   中央蓝色光晕
========================================================= */

.glow {
    position: absolute;
    width: 75vw;
    height: 75vw;
    max-width: 1000px;
    max-height: 1000px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(48,118,215,.15) 0%,
            rgba(30,82,165,.08) 30%,
            transparent 68%
        );

    filter: blur(4px);
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle {
    position: absolute;

    width: min(82vw, 900px);
    height: min(82vw, 900px);

    left: 50%;
    top: 46%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid rgba(105,175,245,.15);

    box-shadow:
        0 0 25px rgba(72,145,235,.05),
        inset 0 0 35px rgba(72,145,235,.04);

    pointer-events: none;

    opacity: .8;
}


/* 第二层星轨 */

.magic-circle::before {
    content: "";
    position: absolute;

    width: 78%;
    height: 78%;

    left: 11%;
    top: 11%;

    border-radius: 50%;

    border:
        1px solid rgba(110,185,250,.12);

    transform:
        rotate(27deg)
        scaleX(1.45);

    box-shadow:
        0 0 25px rgba(82,158,245,.05);
}


/* 第三层星轨 */

.magic-circle::after {
    content: "";
    position: absolute;

    width: 65%;
    height: 65%;

    left: 17.5%;
    top: 17.5%;

    border-radius: 50%;

    border:
        1px dashed rgba(125,195,255,.10);

    transform:
        rotate(-32deg)
        scaleX(1.65);
}


/* =========================================================
   六芒星
========================================================= */

.magic-circle {
    background:

        linear-gradient(
            30deg,
            transparent 49.7%,
            rgba(105,175,245,.08) 50%,
            transparent 50.3%
        ),

        linear-gradient(
            150deg,
            transparent 49.7%,
            rgba(105,175,245,.08) 50%,
            transparent 50.3%
        );
}


/* =========================================================
   外框
========================================================= */

.frame {
    position: absolute;
    inset: 22px;

    border:
        1px solid rgba(105,175,245,.30);

    pointer-events: none;

    box-shadow:
        inset 0 0 35px rgba(35,95,180,.04);
}


/* 四角六芒星装饰 */

.frame::before,
.frame::after {
    content: "✡";

    position: absolute;

    color: rgba(120,190,255,.62);

    font-size: 16px;

    line-height: 1;

    text-shadow:
        0 0 7px rgba(82,158,245,.8),
        0 0 16px rgba(72,145,235,.4);
}

.frame::before {
    left: -9px;
    top: -9px;
}

.frame::after {
    right: -9px;
    bottom: -9px;
}


/* =========================================================
   左下 / 右上额外角饰
========================================================= */

.page::before,
.page::after {
    content: "✡";

    position: absolute;

    z-index: 8;

    color: rgba(120,190,255,.55);

    font-size: 14px;

    text-shadow:
        0 0 7px rgba(82,158,245,.7);
}

.page::before {
    left: 13px;
    bottom: 13px;
}

.page::after {
    right: 13px;
    top: 13px;
}


/* =========================================================
   顶部导航
========================================================= */

.nav {
    position: relative;

    z-index: 20;

    height: 100px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0 clamp(45px, 7vw, 110px);
}


/* 左上角 Logo */

.logo {
    display: flex;
    flex-direction: column;

    gap: 4px;

    letter-spacing: 4px;

    color: rgba(225,242,255,.92);

    text-shadow:
        0 0 10px rgba(82,158,245,.32);
}

.logo-main {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 15px;
    font-weight: 400;
}

.logo-symbol {
    color: #82c4ff;

    font-size: 18px;

    text-shadow:
        0 0 8px rgba(82,158,245,.85);
}

.logo-en {
    margin-left: 27px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: rgba(150,200,255,.68);
}


/* 右侧导航 */

.nav-links {
    display: flex;
    align-items: center;

    gap: clamp(20px, 3vw, 42px);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 12px;

    letter-spacing: 3px;

    color: rgba(160,205,255,.72);
}

.nav-links a {
    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.nav-links a:hover {
    color: #b9dcff;

    text-shadow:
        0 0 9px rgba(82,158,245,.75);
}


/* =========================================================
   Hero
========================================================= */

.hero {
    position: relative;

    z-index: 10;

    min-height:
        calc(100vh - 100px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        30px 20px
        110px;
}


/* 顶部装饰 */

.symbol {
    margin-bottom: 25px;

    color: rgba(145,205,255,.72);

    font-family: serif;

    font-size: 15px;

    letter-spacing: 9px;

    text-shadow:
        0 0 9px rgba(82,158,245,.7);
}


/* =========================================================
   英文标题
========================================================= */

.title-en {
    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform:
        scaleX(.92);

    line-height: .82;

    color:
        rgba(244,250,255,.97);

    font-family:
        "Cinzel",
        "Times New Roman",
        serif;

    font-weight: 300;

    text-shadow:
        0 0 8px rgba(105,175,245,.32),
        0 0 24px rgba(72,145,235,.18);
}


.title-word {
    display: block;

    white-space: nowrap;
}


/* SEYAMI */

.title-word:first-child {
    font-size:
        clamp(76px, 10.5vw, 136px);

    letter-spacing:
        clamp(11px, 1.8vw, 24px);

    padding-left:
        clamp(11px, 1.8vw, 24px);
}


/* ARCHIVE */

.title-word:last-child {
    margin-top: 14px;

    font-size:
        clamp(68px, 9.6vw, 124px);

    letter-spacing:
        clamp(14px, 2.2vw, 29px);

    padding-left:
        clamp(14px, 2.2vw, 29px);
}


/* =========================================================
   标题下面细线
========================================================= */

.title-line {
    width:
        min(370px, 55vw);

    height: 1px;

    margin:
        30px auto 22px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(105,175,245,.55),
            rgba(185,220,255,.78),
            rgba(105,175,245,.55),
            transparent
        );

    box-shadow:
        0 0 8px rgba(82,158,245,.35);
}


/* =========================================================
   中文标题
========================================================= */

.title-cn {
    display: block;

    width: 100%;

    text-align: center;

    font-size: 18px;

    font-weight: 300;

    letter-spacing: 8px;

    padding-left: 8px;

    color:
        rgba(218,237,255,.88);

    text-shadow:
        0 0 10px rgba(82,158,245,.35);

    transform: translateX(0);
}


/* =========================================================
   简介
========================================================= */

.description {
    max-width: 620px;

    margin-top: 25px;

    font-size: 13px;

    line-height: 2;

    letter-spacing: 3px;

    font-weight: 300;

    color:
        rgba(160,201,245,.62);

    text-shadow:
        0 0 8px rgba(45,105,190,.25);
}


/* =========================================================
   进入按钮
========================================================= */

.enter-button {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    min-width: 205px;

    height: 52px;

    margin-top: 39px;

    padding: 0 32px;

    border:
        1px solid rgba(105,175,245,.65);

    background:
        rgba(5,20,50,.22);

    color:
        rgba(220,240,255,.92);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 14px;

    letter-spacing: 5px;

    transition:
        all .35s ease;

    box-shadow:
        0 0 18px rgba(72,145,235,.06),
        inset 0 0 15px rgba(72,145,235,.04);
}


/* 按钮内侧细框 */

.enter-button::before {
    content: "";

    position: absolute;

    inset: 4px;

    border:
        1px solid rgba(105,175,245,.18);

    pointer-events: none;
}


/* 按钮四角小装饰 */

.enter-button::after {
    content: "✦";

    position: absolute;

    right: -7px;
    top: -8px;

    font-size: 11px;

    color:
        rgba(185,220,255,.9);

    text-shadow:
        0 0 8px rgba(82,158,245,.8);
}


.enter-button:hover {
    color: white;

    border-color:
        rgba(155,210,255,.92);

    background:
        rgba(20,65,130,.24);

    box-shadow:
        0 0 22px rgba(72,145,235,.18),
        inset 0 0 18px rgba(72,145,235,.08);

    transform:
        translateY(-2px);
}


/* =========================================================
   Footer
========================================================= */

.footer-mark {
    position: absolute;

    z-index: 20;

    bottom: 32px;

    left: 50%;

    transform:
        translateX(-50%);

    white-space: nowrap;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(120,175,235,.42);

    text-shadow:
        0 0 8px rgba(72,145,235,.2);
}


/* =========================================================
   手机端
========================================================= */

@media (max-width: 700px) {

    .frame {
        inset: 13px;
    }

    .nav {
        height: 82px;

        padding:
            0 30px;
    }

    .nav-links {
        display: none;
    }

    .logo {
        letter-spacing: 3px;
    }

    .logo-main {
        font-size: 13px;
    }

    .logo-en {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .hero {
        min-height:
            calc(100vh - 82px);

        padding:
            20px 18px
            100px;
    }

    .magic-circle {
        width: 125vw;
        height: 125vw;

        opacity: .6;
    }

    .symbol {
        margin-bottom: 18px;

        font-size: 12px;

        letter-spacing: 6px;
    }

    .title-word:first-child {
        font-size:
            clamp(48px, 15vw, 78px);

        letter-spacing:
            clamp(7px, 2vw, 13px);

        padding-left:
            clamp(7px, 2vw, 13px);
    }

    .title-word:last-child {
        margin-top: 10px;

        font-size:
            clamp(42px, 13.5vw, 70px);

        letter-spacing:
            clamp(8px, 2.5vw, 16px);

        padding-left:
            clamp(8px, 2.5vw, 16px);
    }

    .title-line {
        width: 68vw;

        margin:
            22px auto 17px;
    }

    .title-cn {
        font-size: 14px;

        letter-spacing: 5px;

        padding-left: 5px;
    }

    .description {
        max-width: 90%;

        margin-top: 20px;

        font-size: 11px;

        line-height: 1.9;

        letter-spacing: 2px;
    }

    .enter-button {
        min-width: 180px;

        height: 48px;

        margin-top: 30px;

        font-size: 12px;

        letter-spacing: 4px;
    }

    .footer-mark {
        bottom: 20px;

        font-size: 8px;

        letter-spacing: 3px;
    }
}


/* =========================================================
   超小屏幕
========================================================= */

@media (max-width: 420px) {

    .nav {
        padding:
            0 23px;
    }

    .logo-main {
        font-size: 12px;
    }

    .logo-en {
        margin-left: 24px;
    }

    .hero {
        padding-left: 12px;
        padding-right: 12px;
    }

    .title-word:first-child {
        font-size: 47px;

        letter-spacing: 6px;

        padding-left: 6px;
    }

    .title-word:last-child {
        font-size: 42px;

        letter-spacing: 7px;

        padding-left: 7px;
    }

    .title-cn {
        font-size: 13px;

        letter-spacing: 4px;

        padding-left: 4px;
    }

    .description {
        font-size: 10px;

        letter-spacing: 1.5px;
    }
}

</style>
</head>

    <div class="floating-stars">
