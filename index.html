<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · Seyami Archive</title>


<!-- =========================
     字体
========================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>


<style>


/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

}


body {

    overflow: hidden;

    background: #06111d;

    color: #eaf7ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

}


/* =========================================================
   页面
========================================================= */

.page {

    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 620px;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 44%,
            rgba(38, 111, 153, .24) 0%,
            rgba(13, 48, 72, .18) 23%,
            rgba(5, 18, 31, .72) 55%,
            #030a12 100%
        );

}


/* =========================================================
   背景星空
========================================================= */

.stars {

    position: absolute;

    inset: 0;

    opacity: .8;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.75) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(170,225,255,.55) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.4) 0 1px,
            transparent 1.5px
        );

    background-size:

        190px 190px,
        270px 270px,
        340px 340px;

    background-position:

        20px 30px,
        100px 120px,
        40px 80px;

    animation:
        starFieldMove
        28s
        linear
        infinite;

    pointer-events: none;

}


@keyframes starFieldMove {

    0% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(-18px,12px,0);
    }

    100% {
        transform:
            translate3d(0,0,0);
    }

}


/* =========================================================
   漂浮星星
========================================================= */

.floating-stars {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

}


.floating-star {

    position: absolute;

    color:
        rgba(190, 235, 255, .82);

    font-family:
        "Times New Roman",
        serif;

    text-shadow:
        0 0 5px rgba(185, 235, 255, .9),
        0 0 16px rgba(74, 181, 235, .65),
        0 0 30px rgba(55, 160, 220, .3);

    opacity: .35;

    animation:

        starFloat
        8s
        ease-in-out
        infinite,

        starTwinkle
        4s
        ease-in-out
        infinite;

}


/* =========================================================
   原本的星星位置
========================================================= */

.star-a {
    left: 12%;
    top: 23%;
    font-size: 13px;
    animation-delay: 0s, .4s;
}

.star-b {
    left: 23%;
    top: 67%;
    font-size: 10px;
    animation-delay: 1.8s, 1.2s;
}

.star-c {
    left: 30%;
    top: 17%;
    font-size: 17px;
    animation-delay: 3s, .8s;
}

.star-d {
    left: 76%;
    top: 22%;
    font-size: 14px;
    animation-delay: 1s, 2s;
}

.star-e {
    left: 86%;
    top: 36%;
    font-size: 11px;
    animation-delay: 2.5s, .2s;
}

.star-f {
    left: 72%;
    top: 72%;
    font-size: 16px;
    animation-delay: 4s, 1.5s;
}

.star-g {
    left: 15%;
    top: 48%;
    font-size: 14px;
    animation-delay: 2s, 2.5s;
}

.star-h {
    left: 91%;
    top: 69%;
    font-size: 13px;
    animation-delay: 3.5s, 1s;
}

.star-i {
    left: 58%;
    top: 14%;
    font-size: 9px;
    animation-delay: 1.5s, 3s;
}

.star-j {
    left: 63%;
    top: 83%;
    font-size: 14px;
    animation-delay: 4.5s, 2s;
}

.star-k {
    left: 39%;
    top: 78%;
    font-size: 9px;
    animation-delay: 2.2s, .5s;
}

.star-l {
    left: 81%;
    top: 54%;
    font-size: 15px;
    animation-delay: 3.8s, 2.8s;
}


/* =========================================================
   ✡ ✶
========================================================= */

.star-m {
    left: 18%;
    top: 35%;
    font-size: 15px;
    opacity: .42;
    animation-delay: 1.2s, 2.4s;
}

.star-n {
    left: 43%;
    top: 25%;
    font-size: 13px;
    opacity: .50;
    animation-delay: 3.4s, 1.3s;
}

.star-o {
    left: 68%;
    top: 62%;
    font-size: 18px;
    opacity: .38;
    animation-delay: 2.6s, .7s;
}

.star-p {
    left: 88%;
    top: 18%;
    font-size: 12px;
    opacity: .48;
    animation-delay: 4.2s, 2.1s;
}


/* =========================================================
   星星动画
========================================================= */

@keyframes starFloat {

    0%,
    100% {

        transform:
            translate3d(0,0,0)
            rotate(0deg);

    }

    50% {

        transform:
            translate3d(0,-18px,0)
            rotate(10deg);

    }

}


@keyframes starTwinkle {

    0%,
    100% {

        opacity: .25;

        filter:
            blur(.2px);

    }

    50% {

        opacity: 1;

        filter:
            blur(0)
            drop-shadow(
                0 0 7px
                rgba(160,225,255,.8)
            );

    }

}


/* =========================================================
   中央光晕
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 43%;

    width: 600px;
    height: 600px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(67, 163, 210, .12) 0%,
            rgba(55, 135, 180, .06) 28%,
            transparent 68%
        );

    filter: blur(5px);

    pointer-events: none;

}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle {

    position: absolute;

    left: 50%;
    top: 52%;

    width: 560px;
    height: 560px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(110, 196, 235, .12);

    box-shadow:

        0 0 40px
        rgba(76, 170, 220, .06),

        inset 0 0 40px
        rgba(76, 170, 220, .05);

    opacity: .7;

    pointer-events: none;

}


/* 第一层 */

.magic-circle::before {

    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(120, 205, 240, .09);

}


/* 第二层 */

.magic-circle::after {

    content: "";

    position: absolute;

    inset: 88px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(135, 215, 245, .08);

    animation:
        circleRotate
        40s
        linear
        infinite;

}


@keyframes circleRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   魔法阵额外星轨
========================================================= */

.magic-orbit {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 470px;
    height: 185px;

    transform:
        translate(-50%,-50%)
        rotate(25deg);

    border:
        1px solid
        rgba(100,190,235,.09);

    border-radius: 50%;

    animation:
        orbitRotate
        45s
        linear
        infinite;

}


.magic-orbit.two {

    width: 400px;
    height: 150px;

    transform:
        translate(-50%,-50%)
        rotate(-32deg);

    animation-duration:
        34s;

    animation-direction:
        reverse;

}


.magic-orbit.three {

    width: 330px;
    height: 120px;

    transform:
        translate(-50%,-50%)
        rotate(70deg);

    animation-duration:
        28s;

}


@keyframes orbitRotate {

    from {

        transform:
            translate(-50%,-50%)
            rotate(0deg);

    }

    to {

        transform:
            translate(-50%,-50%)
            rotate(360deg);

    }

}


/* =========================================================
   魔法阵十字轴
========================================================= */

.magic-axis {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 500px;
    height: 1px;

    transform:
        translate(-50%,-50%);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(85,174,225,.22),
            transparent
        );

}


.magic-axis.vertical {

    transform:
        translate(-50%,-50%)
        rotate(90deg);

}


/* =========================================================
   四角边框
========================================================= */

.frame {

    position: absolute;

    inset: 18px;

    border:
        1px solid
        rgba(155, 218, 245, .25);

    pointer-events: none;

    z-index: 20;

}


/* =========================================================
   六芒星角落 SVG
========================================================= */

.corner-star {

    position: absolute;

    width: 64px;
    height: 64px;

    display: block;

}


.corner-star svg {

    width: 100%;
    height: 100%;

    overflow: visible;

}


.corner-star svg .hexagram {

    fill: none;

    stroke:
        rgba(128, 207, 241, .68);

    stroke-width: 1;

    vector-effect:
        non-scaling-stroke;

}


.corner-star svg .inner {

    fill: none;

    stroke:
        rgba(112, 194, 232, .34);

    stroke-width: .8;

}


.corner-star svg .line {

    stroke:
        rgba(146, 220, 247, .48);

    stroke-width: 1;

}


/* 左上 */

.corner-tl {

    left: 1px;
    top: 1px;

}


/* 右上 */

.corner-tr {

    right: 1px;
    top: 1px;

    transform:
        rotate(90deg);

}


/* 左下 */

.corner-bl {

    left: 1px;
    bottom: 1px;

    transform:
        rotate(-90deg);

}


/* 右下 */

.corner-br {

    right: 1px;
    bottom: 1px;

    transform:
        rotate(180deg);

}


/* =========================================================
   顶部导航
========================================================= */

.nav {

    position: absolute;

    left: 58px;
    right: 58px;
    top: 46px;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    z-index: 30;

}


/* =========================================================
   左上角 Logo
========================================================= */

.logo {

    display: flex;

    align-items: flex-start;

    gap: 13px;

    color:
        rgba(220,244,255,.92);

    white-space: nowrap;

}


.logo-symbol {

    color:
        #9fdcff;

    font-size: 17px;

    line-height: 1;

    margin-top: 3px;

}


.logo-text {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 2px;

}


.logo-cn {

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(220,244,255,.90);

}


.logo-en {

    display: block;

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(190,225,245,.72);

    opacity: .65;

}


/* =========================================================
   导航
========================================================= */

.nav-links {

    display: flex;

    gap: 34px;

}


.nav-links a {

    position: relative;

    color:
        rgba(208,232,244,.65);

    text-decoration: none;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    transition:
        color .35s ease;

}


.nav-links a::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    width: 0;
    height: 1px;

    background:
        rgba(170,225,250,.8);

    transform:
        translateX(-50%);

    transition:
        width .35s ease;

}


.nav-links a:hover {

    color:
        rgba(235,250,255,.98);

}


.nav-links a:hover::after {

    width: 100%;

}


/* 当前页 */

.nav-links a.active {

    color:
        rgba(235,250,255,.95);

}


.nav-links a.active::after {

    width: 100%;

}


/* =========================================================
   Hero
========================================================= */

.hero {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(1200px, 92vw);

    transform:
        translate(-50%, -47%);

    text-align: center;

    z-index: 10;

}


/* =========================================================
   英文标题
   PC：一整行
========================================================= */

.title-en {

    display: block;

    white-space: nowrap;

    font-family:

        "Cormorant Garamond",

        "Bodoni 72",

        "Didot",

        "Baskerville",

        "Times New Roman",

        serif;

    font-weight: 300;

    color:
        rgba(244,250,255,.96);

    /* 注意：
       这里故意没有 text-shadow
       = 去掉字体发光 */

    line-height: 1;

    transform:
        scaleX(.92);

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        geometricPrecision;

}


/* =========================================================
   PC 一行标题
========================================================= */

.title-word {

    display: inline;

    white-space: nowrap;

}


/* SEYAMI */

.title-word:first-child {

    font-size:
        clamp(68px, 8vw, 122px);

    letter-spacing:
        clamp(8px, 1.35vw, 20px);

    padding-left:
        clamp(8px, 1.35vw, 20px);

}


/* ARCHIVE */

.title-word:last-child {

    margin-left:
        clamp(18px, 2vw, 34px);

    font-size:
        clamp(68px, 8vw, 122px);

    letter-spacing:
        clamp(10px, 1.55vw, 23px);

    padding-left:
        clamp(10px, 1.55vw, 23px);

    opacity: .96;

}


/* =========================================================
   标题下面的装饰线
========================================================= */

.title-line {

    position: relative;

    width: 190px;

    height: 1px;

    margin:
        28px auto 21px;

    background:

        linear-gradient(
            to right,
            transparent,
            rgba(175,225,247,.58),
            transparent
        );

}


/* =========================================================
   中文标题
========================================================= */

.title-cn {

    font-family:

        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 18px;

    font-weight: 300;

    letter-spacing: 8px;

    padding-left: 8px;

    color:
        rgba(224,244,252,.88);

}


/* =========================================================
   简介
========================================================= */

.description {

    margin-top: 22px;

    color:
        rgba(190,219,234,.58);

    font-size: 12px;

    font-weight: 300;

    line-height: 2.25;

    letter-spacing: 4px;

    padding-left: 4px;

}


/* =========================================================
   进入档案馆按钮
========================================================= */

.enter-button {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 32px;

    width: 235px;
    height: 52px;

    padding: 0 30px;

    color:
        rgba(220,245,255,.9);

    text-decoration: none;

    font-family:

        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

    font-size: 13px;

    font-weight: 300;

    letter-spacing: 4px;

    background:
        rgba(100,175,210,.035);

    transition:
        background .4s ease,
        border-color .4s ease,
        box-shadow .4s ease,
        color .4s ease,
        transform .4s ease;

}


/* 外框 */

.enter-button::before {

    content: "";

    position: absolute;

    inset: 0;

    border:
        1px solid
        rgba(150,215,240,.52);

    clip-path:
        polygon(
            13px 0,
            calc(100% - 13px) 0,
            100% 13px,
            100% calc(100% - 13px),
            calc(100% - 13px) 100%,
            13px 100%,
            0 calc(100% - 13px),
            0 13px
        );

}


/* 内框 */

.enter-button::after {

    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid
        rgba(120,195,232,.25);

    clip-path:
        polygon(
            8px 0,
            calc(100% - 8px) 0,
            100% 8px,
            100% calc(100% - 8px),
            calc(100% - 8px) 100%,
            8px 100%,
            0 calc(100% - 8px),
            0 8px
        );

}


/* 两侧菱形 */

.button-diamond {

    position: absolute;

    width: 9px;
    height: 9px;

    border:
        1px solid
        rgba(153,220,247,.8);

    transform:
        rotate(45deg);

    background:
        #06111d;

    z-index: 2;

}


.button-diamond.left {

    left: -4px;

}


.button-diamond.right {

    right: -4px;

}


/* 上下装饰短线 */

.button-line {

    position: absolute;

    width: 38px;
    height: 1px;

    background:
        rgba(135,208,239,.55);

}


.button-line.top {

    top: -7px;

}


.button-line.bottom {

    bottom: -7px;

}


/* 按钮星芒 */

.button-star {

    position: absolute;

    width: 18px;
    height: 18px;

    z-index: 3;

}


.button-star::before,
.button-star::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(195,235,250,.9);

}


.button-star::before {

    width: 1px;
    height: 22px;

}


.button-star::after {

    width: 22px;
    height: 1px;

}


.button-star.top {

    top: -17px;

}


.button-star.bottom {

    bottom: -17px;

}


/* hover */

.enter-button:hover {

    color:
        #f2fbff;

    background:
        rgba(100,185,225,.08);

    box-shadow:
        0 0 25px
        rgba(80,190,240,.12),

        inset 0 0 25px
        rgba(80,190,240,.06);

    transform:
        translateY(-2px);

}


/* =========================================================
   底部
========================================================= */

.footer-mark {

    position: absolute;

    left: 50%;
    bottom: 38px;

    transform:
        translateX(-50%);

    color:
        rgba(160,205,225,.28);

    font-family:

        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    z-index: 10;

}


/* =========================================================
   手机端
========================================================= */

@media (max-width: 700px) {


    .page {

        min-height: 580px;

    }


    /* 手机边框 */

    .frame {

        inset: 10px;

    }


    /* 手机四角六芒星 */

    .corner-star {

        width: 48px;
        height: 48px;

    }


    /* 顶部 */

    .nav {

        left: 30px;
        right: 30px;
        top: 30px;

    }


    .logo {

        gap: 9px;

    }


    .logo-symbol {

        font-size: 13px;

    }


    .logo-cn {

        font-size: 10px;

        letter-spacing: 2px;

    }


    .logo-en {

        font-size: 9px;

        letter-spacing: 2.5px;

    }


    .nav-links {

        gap: 14px;

    }


    .nav-links a {

        font-size: 10px;

        letter-spacing: 1px;

    }


    /* 手机标题允许换行 */

    .hero {

        width: 94vw;

        transform:
            translate(-50%, -46%);

    }


    .title-en {

        white-space: normal;

        transform:
            scaleX(.95);

    }


    .title-word {

        display: block;

    }


    .title-word:first-child {

        font-size:
            clamp(54px, 15vw, 82px);

        letter-spacing: 6px;

        padding-left: 6px;

    }


    .title-word:last-child {

        margin-left: 0;

        margin-top: 9px;

        font-size:
            clamp(50px, 14vw, 78px);

        letter-spacing: 8px;

        padding-left: 8px;

    }


    .title-line {

        width: 120px;

        margin:
            24px auto 19px;

    }


    .title-cn {

        font-size: 14px;

        letter-spacing: 5px;

        padding-left: 5px;

    }


    .description {

        margin-top: 18px;

        font-size: 10px;

        letter-spacing: 2px;

        line-height: 2;

        padding:
            0 15px;

    }


    .enter-button {

        margin-top: 26px;

        width: 205px;

        height: 46px;

        font-size: 11px;

        letter-spacing: 3px;

    }


    /* 手机魔法阵 */

    .magic-circle {

        width: 390px;
        height: 390px;

        top: 50%;

    }


    .magic-circle::before {

        inset: 32px;

    }


    .magic-circle::after {

        inset: 62px;

    }


    .magic-orbit {

        width: 340px;
        height: 135px;

    }


    .magic-orbit.two {

        width: 300px;
        height: 110px;

    }


    .magic-orbit.three {

        width: 250px;
        height: 90px;

    }


    .magic-axis {

        width: 350px;

    }


    .footer-mark {

        bottom: 23px;

        font-size: 8px;

        letter-spacing: 2px;

    }

}


/* =========================================================
   超小屏
========================================================= */

@media (max-width: 420px) {


    .frame {

        inset: 8px;

    }


    .corner-star {

        width: 40px;
        height: 40px;

    }


    .nav {

        left: 23px;
        right: 23px;
        top: 25px;

    }


    .nav-links {
