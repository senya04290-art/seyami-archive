<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>赛垭弥大陆档案馆｜SEYAMI ARCHIVE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        "Noto Serif SC",
        "Source Han Serif SC",
        "Microsoft YaHei",
        serif;

    color: #eee8ff;

    background:
        radial-gradient(circle at 50% 0%, #29204a 0%, transparent 38%),
        radial-gradient(circle at 10% 80%, #241a42 0%, transparent 30%),
        linear-gradient(180deg, #0d0a19 0%, #100c20 55%, #080710 100%);

    overflow-x: hidden;
}

/* ===== 星空 ===== */

.stars,
.stars::before,
.stars::after {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.stars {
    z-index: 0;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(198,176,255,.5) 1px, transparent 1px);
    background-size: 130px 130px, 190px 190px;
    background-position: 20px 40px, 80px 120px;
    opacity: .45;
}

.stars::before {
    content: "";
    background-image:
        radial-gradient(circle, white 1px, transparent 1px);
    background-size: 240px 240px;
    opacity: .35;
}

/* ===== 导航 ===== */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6vw;

    background: rgba(9, 7, 18, .72);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(210,190,255,.12);

    z-index: 20;
}

.logo {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.logo-cn {
    font-size: 18px;
    letter-spacing: 3px;
}

.logo-en {
    margin-top: 4px;
    font-size: 9px;
    letter-spacing: 4px;
    color: #a99acb;
}

.nav-links {
    display: flex;
    gap: 28px;
}

.nav-links a {
    color: #c9c0dc;
    text-decoration: none;
    font-size: 13px;
    transition: .3s;
}

.nav-links a:hover {
    color: #fff;
    text-shadow: 0 0 12px rgba(205,180,255,.8);
}

/* ===== 首页 ===== */

.hero {
    position: relative;
    z-index: 1;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 120px 25px 80px;
}

.hero-content {
    max-width: 850px;
}

.symbol {
    font-size: 48px;
    color: #cbb8ff;

    margin-bottom: 25px;

    text-shadow:
        0 0 12px rgba(194,165,255,.7),
        0 0 35px rgba(134,98,220,.45);

    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.hero h1 {
    font-size: clamp(38px, 7vw, 78px);
    font-weight: 400;
    letter-spacing: 12px;

    margin-bottom: 15px;

    text-shadow:
        0 0 20px rgba(200,175,255,.35);
}

.hero .english {
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 9px;
    color: #9e91bd;
    margin-bottom: 35px;
}

.hero p {
    color: #bdb4ca;
    line-height: 2;
    font-size: 14px;
}

/* ===== 魔法圆环 ===== */

.magic-ring {
    width: 230px;
    height: 230px;

    border: 1px solid rgba(190,165,255,.25);
    border-radius: 50%;

    margin: 35px auto;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: rotate 35s linear infinite;
}

.magic-ring::before,
.magic-ring::after {
    content: "";
    position: absolute;
    inset: 18px;

    border: 1px dashed rgba(200,180,255,.28);
    border-radius: 50%;
}

.magic-ring::after {
    inset: 45px;
    border-style: solid;
    opacity: .6;
}

.magic-core {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(circle,
            #eee4ff 0%,
            #bda5ff 25%,
            #62478e 55%,
            transparent 72%
        );

    box-shadow:
        0 0 25px rgba(184,151,255,.8),
        0 0 70px rgba(111,76,180,.45);
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

/* ===== 按钮 ===== */

.enter-btn {
    display: inline-block;

    padding: 14px 35px;

    border: 1px solid rgba(205,185,255,.5);
    border-radius: 40px;

    color: #eee7ff;
    text-decoration: none;

    background: rgba(130,100,190,.12);

    transition: .35s;

    letter-spacing: 3px;
    font-size: 13px;
}

.enter-btn:hover {
    background: rgba(165,135,235,.25);

    box-shadow:
        0 0 20px rgba(180,150,255,.3);

    transform: translateY(-2px);
}

/* ===== 档案区域 ===== */

.section {
    position: relative;
    z-index: 1;

    max-width: 1100px;

    margin: auto;

    padding: 100px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 50px;
}

.section-title h2 {
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 6px;
}

.section-title span {
    display: block;

    margin-top: 10px;

    font-size: 10px;
    letter-spacing: 5px;

    color: #887ba5;
}

/* ===== 卡片 ===== */

.archive-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.archive-card {
    min-height: 190px;

    padding: 35px 25px;

    background:
        linear-gradient(
            145deg,
            rgba(92,70,130,.16),
            rgba(20,16,35,.55)
        );

    border: 1px solid rgba(191,169,235,.13);

    border-radius: 14px;

    transition: .35s;

    position: relative;
    overflow: hidden;
}

.archive-card::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -50px;
    bottom: -50px;

    border-radius: 50%;

    background: rgba(157,122,220,.08);

    filter: blur(10px);
}

.archive-card:hover {
    transform: translateY(-5px);

    border-color:
        rgba(202,181,255,.35);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.card-icon {
    font-size: 27px;
    margin-bottom: 18px;
}

.archive-card h3 {
    font-size: 17px;
    font-weight: 400;

    margin-bottom: 10px;

    letter-spacing: 2px;
}

.archive-card p {
    color: #958ca7;

    font-size: 12px;

    line-height: 1.8;
}

/* ===== Footer ===== */

footer {
    position: relative;
    z-index: 1;

    padding: 70px 20px 40px;

    text-align: center;

    color: #625a70;

    font-size: 11px;

    letter-spacing: 2px;
}

footer .footer-name {
    color: #9a8caf;

    margin-bottom: 10px;

    font-size: 14px;
}

/* ===== 手机 ===== */

@media (max-width: 700px) {

    nav {
        height: 62px;
        padding: 0 20px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding-top: 100px;
    }

    .hero h1 {
        letter-spacing: 5px;
    }

    .hero .english {
        letter-spacing: 5px;
    }

    .magic-ring {
        width: 190px;
        height: 190px;
    }

    .archive-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<!-- 导航 -->
<nav>

    <div class="logo">
        <div class="logo-cn">
            赛垭弥大陆档案馆
        </div>

        <div class="logo-en">
            SEYAMI ARCHIVE
        </div>
    </div>

    <div class="nav-links">
        <a href="#home">首页</a>
        <a href="#characters">角色档案</a>
        <a href="#world">世界</a>
        <a href="#gallery">画廊</a>
    </div>

</nav>


<!-- 首页 -->
<section class="hero" id="home">

    <div class="hero-content">

        <div class="symbol">
            ✦
        </div>

        <h1>
            赛垭弥大陆档案馆
        </h1>

        <div class="english">
            SEYAMI ARCHIVE
        </div>

        <p>
            记录大陆上的生命、传说与未曾被遗忘的故事。
            <br>
            在星辰与魔法之间，寻找属于他们的名字。
        </p>

        <div class="magic-ring">
            <div class="magic-core"></div>
        </div>

        <a class="enter-btn" href="#characters">
            进入档案馆　✦
        </a>

    </div>

</section>


<!-- 档案 -->
<section class="section" id="characters">

    <div class="section-title">

        <h2>
            档案目录
        </h2>

        <span>
            ARCHIVE INDEX
        </span>

    </div>


    <div class="archive-grid">

        <div class="archive-card">

            <div class="card-icon">
                ✦
            </div>

            <h3>
                角色档案
            </h3>

            <p>
                记录生活于赛垭弥大陆的角色、
                种族、身份与他们各自的故事。
            </p>

        </div>


        <div class="archive-card" id="world">

            <div class="card-icon">
                ◇
            </div>

            <h3>
                世界设定
            </h3>

            <p>
                大陆、国家、森林、雪山、
                王庭与隐藏于历史中的秘密。
            </p>

        </div>


        <div class="archive-card" id="gallery">

            <div class="card-icon">
                ♢
            </div>

            <h3>
                档案画廊
            </h3>

            <p>
                收藏角色插画、场景、
                概念设计与属于这个世界的视觉记录。
            </p>

        </div>

    </div>

</section>


<footer>

    <div class="footer-name">
        ✦ SEYAMI ARCHIVE ✦
    </div>

    赛垭弥大陆档案馆

</footer>


</body>
</html>
