/* =========================================================
   背景浮动星星
========================================================= */

const starContainer = document.getElementById("stars");

const starSymbols = [
    "✦",
    "✧",
    "·",
    "✶",
    "✡"
];

for(let i = 0; i < 45; i++){

    const star = document.createElement("span");

    star.className = "star";

    star.textContent =
        starSymbols[
            Math.floor(
                Math.random() * starSymbols.length
            )
        ];

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.fontSize =
        (Math.random() * 6 + 5) + "px";

    star.style.animationDuration =
        (Math.random() * 8 + 8) + "s";

    star.style.animationDelay =
        -(Math.random() * 10) + "s";

    starContainer.appendChild(star);
}


/* =========================================================
   三条星轨
========================================================= */

const CX = 280;
const CY = 280;

const tracks = [

    {
        id:"A",

        rx:250,
        ry:95,

        rotation:0,

        speed:360 / 38,

        direction:1
    },

    {
        id:"B",

        rx:210,
        ry:72.5,

        rotation:55,

        speed:-360 / 32,

        direction:-1
    },

    {
        id:"C",

        rx:165,
        ry:52.5,

        rotation:110,

        speed:360 / 25,

        direction:1
    }

];


/* =========================================================
   取得轨道当前旋转角
========================================================= */

function getRotation(track, elapsed){

    return track.rotation
        + track.speed * elapsed / 1000;

}


/* =========================================================
   角度标准化
========================================================= */

function normalizeAngle(angle){

    angle %= 360;

    if(angle < 0){
        angle += 360;
    }

    return angle;

}


/* =========================================================
   最短角度差
========================================================= */

function angleDifference(a,b){

    let d =
        normalizeAngle(a)
        -
        normalizeAngle(b);

    if(d > 180){
        d -= 360;
    }

    if(d < -180){
        d += 360;
    }

    return d;

}


/* =========================================================
   沿指定方向取得角度
========================================================= */

function moveAngle(
    from,
    to,
    direction,
    progress
){

    let diff;

    if(direction > 0){

        diff =
            normalizeAngle(to - from);

    }else{

        diff =
            -normalizeAngle(from - to);

    }

    return from + diff * progress;

}


/* =========================================================
   轨道上的世界坐标
========================================================= */

function getPoint(
    track,
    angle,
    elapsed
){

    const rad =
        angle * Math.PI / 180;

    const localX =
        track.rx * Math.cos(rad);

    const localY =
        track.ry * Math.sin(rad);

    const rotation =
        getRotation(track, elapsed)
        * Math.PI / 180;

    const worldX =
        localX * Math.cos(rotation)
        -
        localY * Math.sin(rotation);

    const worldY =
        localX * Math.sin(rotation)
        +
        localY * Math.cos(rotation);

    return {

        x:CX + worldX,

        y:CY + worldY

    };

}


/* =========================================================
   世界坐标 → 轨道角度
========================================================= */

function worldToTrackAngle(
    track,
    x,
    y,
    elapsed
){

    const dx = x - CX;
    const dy = y - CY;

    const rotation =
        getRotation(track, elapsed)
        * Math.PI / 180;

    const localX =
        dx * Math.cos(rotation)
        +
        dy * Math.sin(rotation);

    const localY =
        -dx * Math.sin(rotation)
        +
        dy * Math.cos(rotation);

    return normalizeAngle(
        Math.atan2(
            localY / track.ry,
            localX / track.rx
        ) * 180 / Math.PI
    );

}


/* =========================================================
   找两条轨道交叉点
========================================================= */

function findIntersection(
    trackA,
    trackB,
    elapsed,
    fromAngle
){

    let best = null;

    const samples = 720;

    for(let i = 0; i < samples; i++){

        const angle =
            i * 360 / samples;

        const p =
            getPoint(
                trackA,
                angle,
                elapsed
            );

        const angleB =
            worldToTrackAngle(
                trackB,
                p.x,
                p.y,
                elapsed
            );

        const pB =
            getPoint(
                trackB,
                angleB,
                elapsed
            );

        const distance =
            Math.hypot(
                p.x - pB.x,
                p.y - pB.y
            );

        if(
            !best ||
            distance < best.distance
        ){

            best = {

                angleA:angle,

                angleB:angleB,

                distance:distance

            };

        }

    }

    if(!best){
        return null;
    }

    /*
       轨道交叉附近通常有两个交点。
       优先选择星星运动方向前方最近的那个。
    */

    const direction =
        trackA.direction;

    let delta;

    if(direction > 0){

        delta =
            normalizeAngle(
                best.angleA - fromAngle
            );

    }else{

        delta =
            normalizeAngle(
                fromAngle - best.angleA
            );

    }

    if(delta < 0){
        delta += 360;
    }

    return best;

}


/* =========================================================
   平滑函数
========================================================= */

function smoothStep(t){

    t = Math.max(
        0,
        Math.min(1,t)
    );

    return t * t * (3 - 2 * t);

}


/* =========================================================
   DOM
========================================================= */

const star =
    document.getElementById(
        "travellingStar"
    );

const starGlow =
    document.getElementById(
        "starGlow"
    );

const ellipseA =
    document.getElementById(
        "ellipseA"
    );

const ellipseB =
    document.getElementById(
        "ellipseB"
    );

const ellipseC =
    document.getElementById(
        "ellipseC"
    );


/* =========================================================
   当前状态
========================================================= */

let currentTrackIndex = 0;

let starAngle = 0;

let lastTime = performance.now();

let elapsed = 0;


/*
   当前目标交叉点
*/

let targetIntersection = null;


/*
   平滑换轨状态
*/

let transitioning = false;

let transitionStartTime = 0;

const transitionDuration = 460;

let transitionFromTrackIndex = 0;

let transitionToTrackIndex = 1;

let transitionFromAngle = 0;

let transitionCrossAngleFrom = 0;

let transitionCrossAngleTo = 0;

let transitionEndAngle = 0;


/*
   每隔一小段时间重新检查交叉点。
*/

let intersectionRefreshTimer = 0;


/* =========================================================
   初始化
========================================================= */

function initialize(){

    starAngle = 0;

    currentTrackIndex = 0;

    targetIntersection =
        findIntersection(
            tracks[0],
            tracks[1],
            0,
            starAngle
        );

}


/* =========================================================
   开始平滑换轨
========================================================= */

function startTransition(
    intersection,
    elapsed
){

    const fromIndex =
        currentTrackIndex;

    const toIndex =
        (currentTrackIndex + 1)
        % tracks.length;

    const fromTrack =
        tracks[fromIndex];

    const toTrack =
        tracks[toIndex];


    transitionFromTrackIndex =
        fromIndex;

    transitionToTrackIndex =
        toIndex;


    transitionFromAngle =
        starAngle;


    transitionCrossAngleFrom =
        intersection.angleA;

    transitionCrossAngleTo =
        intersection.angleB;


    /*
       换到下一条轨道以后，
       不停在交叉点，而是继续前进一点。

       这样看起来会像真正沿着下一条轨道
       流过去，而不是停住再换轨。
    */

    const forwardAngle = 4.5;

    transitionEndAngle =
        transitionCrossAngleTo
        +
        toTrack.direction
        * forwardAngle;


    transitionStartTime =
        performance.now();

    transitioning = true;

}


/* =========================================================
   普通运行状态
========================================================= */

function updateNormal(
    delta
){

    const track =
        tracks[currentTrackIndex];


    /*
       星星沿当前轨道运行
    */

    starAngle +=
        track.direction
        *
        track.speed
        *
        delta
        /
        1000;

    starAngle =
        normalizeAngle(starAngle);


    /*
       找下一条轨道
    */

    const nextTrackIndex =
        (currentTrackIndex + 1)
        % tracks.length;

    const nextTrack =
        tracks[nextTrackIndex];


    /*
       如果还没有目标交叉点，
       重新寻找。
    */

    if(!targetIntersection){

        targetIntersection =
            findIntersection(
                track,
                nextTrack,
                elapsed,
                starAngle
            );

    }


    /*
       接近交叉点以后重新计算一次。

       因为轨道本身在旋转，
       所以交叉点也会随时间轻微变化。
    */

    intersectionRefreshTimer += delta;

    if(
        intersectionRefreshTimer > 160 &&
        targetIntersection
    ){

        intersectionRefreshTimer = 0;

        const refreshed =
            findIntersection(
                track,
                nextTrack,
                elapsed,
                starAngle
            );

        if(refreshed){

            targetIntersection =
                refreshed;

        }

    }


    if(!targetIntersection){
        return;
    }


    /*
       判断星星距离交叉点还有多远
    */

    let distanceToIntersection;

    if(track.direction > 0){

        distanceToIntersection =
            normalizeAngle(
                targetIntersection.angleA
                -
                starAngle
            );

    }else{

        distanceToIntersection =
            normalizeAngle(
                starAngle
                -
                targetIntersection.angleA
            );

    }


    /*
       进入最后约 8° 的时候，
       开始自然换轨。
    */

    if(
        distanceToIntersection <= 8
        ||
        distanceToIntersection >= 352
    ){

        startTransition(
            targetIntersection,
            elapsed
        );

    }

}


/* =========================================================
   平滑换轨状态
========================================================= */

function updateTransition(){

    const now =
        performance.now();

    let t =
        (
            now -
            transitionStartTime
        )
        /
        transitionDuration;


    t =
        Math.max(
            0,
            Math.min(1,t)
        );


    /*
       smoothstep：

       开始慢
       中间自然加速
       结束慢

       这样不会出现“突然横跳”。
    */

    const eased =
        smoothStep(t);


    const fromTrack =
        tracks[
            transitionFromTrackIndex
        ];

    const toTrack =
        tracks[
            transitionToTrackIndex
        ];


    /*
       当前轨道：

       从星星现在的位置
       平滑靠近交叉点。
    */

    const fromAngle =
        moveAngle(
            transitionFromAngle,
            transitionCrossAngleFrom,
            fromTrack.direction,
            eased
        );


    /*
       下一条轨道：

       从交叉点继续向前移动。

       这样两个位置在视觉上会自然衔接。
    */

    const toAngle =
        moveAngle(
            transitionCrossAngleTo,
            transitionEndAngle,
            toTrack.direction,
            eased
        );


    const pointA =
        getPoint(
            fromTrack,
            fromAngle,
            elapsed
        );

    const pointB =
        getPoint(
            toTrack,
            toAngle,
            elapsed
        );


    /*
       世界坐标进行柔和混合。

       这一步是这次最重要的修改：

       星星不会在 AB 交点瞬间跳轨，
       而是在很短的一段距离内自然过渡。
    */

    const x =
        pointA.x
        +
        (
            pointB.x -
            pointA.x
        )
        *
        eased;


    const y =
        pointA.y
        +
        (
            pointB.y -
            pointA.y
        )
        *
        eased;


    star.setAttribute(
        "x",
        x
    );

    star.setAttribute(
        "y",
        y
    );


    /*
       小小的光晕变化。

       不会明显闪烁，
       只是让换轨瞬间稍微有一点生命感。
    */

    const glowScale =
        1
        +
        Math.sin(
            t * Math.PI
        )
        *
        .25;

    starGlow.setAttribute(
        "cx",
        x
    );

    starGlow.setAttribute(
        "cy",
        y
    );

    starGlow.setAttribute(
        "r",
        8 * glowScale
    );


    /*
       换轨完成
    */

    if(t >= 1){

        currentTrackIndex =
            transitionToTrackIndex;

        starAngle =
            normalizeAngle(
                transitionEndAngle
            );

        transitioning = false;

        targetIntersection = null;

        intersectionRefreshTimer = 0;

    }

}


/* =========================================================
   更新星轨旋转
========================================================= */

function updateTracks(
    elapsed
){

    const rotationA =
        getRotation(
            tracks[0],
            elapsed
        );

    const rotationB =
        getRotation(
            tracks[1],
            elapsed
        );

    const rotationC =
        getRotation(
            tracks[2],
            elapsed
        );


    ellipseA.setAttribute(
        "transform",
        `rotate(${rotationA} ${CX} ${CY})`
    );

    ellipseB.setAttribute(
        "transform",
        `rotate(${rotationB} ${CX} ${CY})`
    );

    ellipseC.setAttribute(
        "transform",
        `rotate(${rotationC} ${CX} ${CY})`
    );

}


/* =========================================================
   主动画
========================================================= */

function animate(now){

    const delta =
        now -
        lastTime;

    lastTime = now;

    elapsed += delta;


    /*
       三条轨道持续旋转
    */

    updateTracks(elapsed);


    /*
       星星：

       普通状态
       ↓
       接近交叉点
       ↓
       平滑换轨
       ↓
       下一条轨道
    */

    if(transitioning){

        updateTransition();

    }else{

        updateNormal(delta);

    }


    /*
       普通状态下，
       根据当前 starAngle 更新位置。
    */

    if(!transitioning){

        const track =
            tracks[currentTrackIndex];

        const point =
            getPoint(
                track,
                starAngle,
                elapsed
            );

        star.setAttribute(
            "x",
            point.x
        );

        star.setAttribute(
            "y",
            point.y
        );

        starGlow.setAttribute(
            "cx",
            point.x
        );

        starGlow.setAttribute(
            "cy",
            point.y
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   启动
========================================================= */

initialize();

requestAnimationFrame(
    animate
);

</script></body>
