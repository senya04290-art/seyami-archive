<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<!-- 西幻感衬线字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,255,255,.95) 0%,
            rgba(247,243,250,.95) 34%,
            rgba(239,233,245,1) 100%
        );

    color:#4d4058;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x:hidden;
}


/* =========================
   背景装饰
========================= */

.background-glow{
    position:fixed;
    width:520px;
    height:520px;

    left:50%;
    top:43%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(224,210,237,.25) 45%,
            transparent 72%
        );

    pointer-events:none;

    filter:blur(5px);
}


/* =========================
   漂浮星星
========================= */

.star{
    position:fixed;

    color:#b7a5c7;

    font-family:
        "Cormorant Garamond",
        serif;

    font-weight:300;

    opacity:.45;

    pointer-events:none;

    animation:
        floatStar
        7s
        ease-in-out
        infinite;
}

.star.s1{
    top:19%;
    left:17%;
    font-size:17px;
    animation-delay:-1s;
}

.star.s2{
    top:27%;
    right:18%;
    font-size:13px;
    animation-delay:-4s;
}

.star.s3{
    top:54%;
    left:11%;
    font-size:12px;
    animation-delay:-2s;
}

.star.s4{
    top:64%;
    right:13%;
    font-size:18px;
    animation-delay:-5s;
}

.star.s5{
    top:78%;
    left:25%;
    font-size:10px;
    animation-delay:-3s;
}

.star.s6{
    top:73%;
    right:27%;
    font-size:12px;
    animation-delay:-6s;
}

.star.s7{
    top:37%;
    left:27%;
    font-size:9px;
    animation-delay:-1.5s;
}

.star.s8{
    top:43%;
    right:29%;
    font-size:10px;
    animation-delay:-3.5s;
}

@keyframes floatStar{

    0%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.28;
    }

    50%{
        transform:
            translateY(-12px)
            rotate(12deg);

        opacity:.7;
    }

    100%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.28;
    }
}


/* =========================
   左上角 LOGO
========================= */

.logo{
    position:absolute;

    top:32px;
    left:38px;

    z-index:5;

    color:#574861;

    text-decoration:none;

    line-height:1;
}

.logo-cn{
    display:block;

    font-size:15px;

    letter-spacing:
        4px;

    font-weight:400;

    margin-bottom:8px;
}

.logo-en{
    display:block;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:12px;

    letter-spacing:
        4px;

    font-weight:400;

    color:#9a8aa6;
}


/* =========================
   主页面
========================= */

.hero{
    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        80px
        25px
        70px;
}


/* =========================
   中央内容
========================= */

.hero-content{
    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* 小装饰 */

.ornament{
    color:#aa96bb;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:15px;

    letter-spacing:8px;

    margin-bottom:27px;

    opacity:.7;
}


/* =========================
   SEYAMI
========================= */

.title-seyami{

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(58px, 10vw, 105px);

    font-weight:300;

    letter-spacing:
        .20em;

    line-height:.82;

    color:#51425c;

    margin-left:.20em;

    text-shadow:
        0 1px 0 rgba(255,255,255,.8);
}


/* =========================
   ARCHIVE
========================= */

.title-archive{

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(76px, 13vw, 138px);

    font-weight:300;

    letter-spacing:
        .105em;

    line-height:.9;

    color:#51425c;

    margin-left:.105em;

    margin-top:7px;

    text-shadow:
        0 1px 0 rgba(255,255,255,.8);
}


/* =========================
   中文副标题
========================= */

.subtitle{

    margin-top:27px;

    font-size:13px;

    font-weight:300;

    letter-spacing:
        7px;

    color:#8d7c99;

    margin-left:7px;
}


/* =========================
   分隔线
========================= */

.divider{

    width:145px;

    height:1px;

    margin-top:27px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(157,137,171,.65),
            transparent
        );
}


/* =========================
   进入按钮
========================= */

.enter-button{

    margin-top:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    width:190px;
    height:47px;

    border:1px solid
        rgba(142,121,158,.48);

    border-radius:2px;

    background:
        rgba(255,255,255,.35);

    color:#6f6078;

    text-decoration:none;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:15px;

    letter-spacing:4px;

    transition:
        .35s ease;

    backdrop-filter:
        blur(5px);
}

.enter-button:hover{

    background:
        rgba(255,255,255,.72);

    border-color:
        rgba(121,99,140,.7);

    color:#51425c;

    letter-spacing:6px;

    box-shadow:
        0 8px 25px
        rgba(100,80,120,.09);

    transform:
        translateY(-2px);
}


/* =========================
   下方说明
========================= */

.description{

    margin-top:18px;

    font-size:11px;

    letter-spacing:3px;

    color:#afa2b8;

    font-weight:300;
}


/* =========================
   两侧装饰
========================= */

.side-decoration{

    position:absolute;

    top:50%;

    width:1px;

    height:115px;

    transform:translateY(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(166,146,178,.38),
            transparent
        );
}

.side-decoration.left{
    left:9%;
}

.side-decoration.right{
    right:9%;
}


/* =========================
   小星芒
========================= */

.sparkle{

    position:absolute;

    font-family:
        "Cormorant Garamond",
        serif;

    color:#a894b8;

    opacity:.5;

    animation:
        sparkleFloat
        5s
        ease-in-out
        infinite;
}

.sparkle.one{
    top:31%;
    left:33%;
    font-size:12px;
}

.sparkle.two{
    top:32%;
    right:34%;
    font-size:9px;
    animation-delay:-2s;
}

.sparkle.three{
    bottom:29%;
    left:37%;
    font-size:10px;
    animation-delay:-1s;
}

.sparkle.four{
    bottom:27%;
    right:37%;
    font-size:13px;
    animation-delay:-3s;
}

@keyframes sparkleFloat{

    0%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }

    50%{
        transform:
            translateY(-7px)
            rotate(20deg);

        opacity:.65;
    }

    100%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }
}


/* =========================
   底部
========================= */

.footer{

    position:absolute;

    bottom:23px;

    left:0;
    right:0;

    text-align:center;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:10px;

    letter-spacing:4px;

    color:#b3a7ba;
}


/* =========================
   手机适配
========================= */

@media(max-width:600px){

    .logo{

        top:24px;
        left:23px;
    }

    .logo-cn{

        font-size:12px;

        letter-spacing:3px;
    }

    .logo-en{

        font-size:10px;

        letter-spacing:3px;
    }

    .hero{

        padding:
            90px
            18px
            60px;
    }

    .title-seyami{

        font-size:
            clamp(48px, 15vw, 72px);

        letter-spacing:
            .15em;

        margin-left:.15em;
    }

    .title-archive{

        font-size:
            clamp(64px, 19vw, 92px);

        letter-spacing:
            .07em;

        margin-left:.07em;
    }

    .subtitle{

        font-size:11px;

        letter-spacing:4px;

        margin-left:4px;
    }

    .side-decoration{

        height:80px;
    }

    .side-decoration.left{
        left:5%;
    }

    .side-decoration.right{
        right:5%;
    }

    .description{

        font-size:9px;

        letter-spacing:2px;
    }
}

</style>
</head>


<body>

<!-- 背景光晕 -->
<div class="background-glow"></div>


<!-- 左上角 -->
<a href="index.html" class="logo">

    <span class="logo-cn">
        塞垭弥大陆档案馆
    </span>

    <span class="logo-en">
        SEYAMI ARCHIVE
    </span>

</a>


<!-- 漂浮星星 -->

<div class="star s1">✶</div>
<div class="star s2">✡</div>
<div class="star s3">✦</div>
<div class="star s4">✶</div>
<div class="star s5">✧</div>
<div class="star s6">✡</div>
<div class="star s7">·</div>
<div class="star s8">✦</div>


<!-- 页面 -->

<main class="hero">

    <!-- 两侧竖线 -->

    <div class="side-decoration left"></div>
    <div class="side-decoration right"></div>


    <!-- 中央内容 -->

    <section class="hero-content">

        <div class="ornament">
            ✦　✧　✦
        </div>


        <div class="title-seyami">
            SEYAMI
        </div>


        <div class="title-archive">
            ARCHIVE
        </div>


        <div class="subtitle">
            塞垭弥大陆档案馆
        </div>


        <div class="divider"></div>


        <a href="archive.html" class="enter-button">
            ENTER ARCHIVE
        </a>


        <div class="description">
            THE RECORDS OF SEYAMI CONTINENT
        </div>

    </section>


    <!-- 小星芒 -->

    <span class="sparkle one">✶</span>
    <span class="sparkle two">✡</span>
    <span class="sparkle three">✧</span>
    <span class="sparkle four">✶</span>

</main>


<!-- 底部 -->

<footer class="footer">
    ✦  SEYAMI CONTINENT  ✦
</footer>


</body>
</html>
