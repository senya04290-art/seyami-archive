<!DOCTYPE html>  <html lang="zh-CN">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>塞垭弥大陆档案馆 · Seyami Archive</title>  <!-- 西幻标题字体 -->  <link rel="preconnect" href="https://fonts.googleapis.com">  
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">  <style>  
  
/* =========================================================  
   基础  
========================================================= */  
  
*{  
    margin:0;  
    padding:0;  
    box-sizing:border-box;  
}  
  
html,  
body{  
    width:100%;  
    height:100%;  
}  
  
body{  
  
    overflow:hidden;  
  
    background:  
        radial-gradient(  
            ellipse at 50% 45%,  
            #09275b 0%,  
            #061d46 28%,  
            #03142f 58%,  
            #010b20 100%  
        );  
  
    color:#dcecff;  
  
    font-family:  
        "Noto Serif SC",  
        serif;  
}  
  
  
/* =========================================================  
   背景星空  
========================================================= */  
  
.space{  
  
    position:fixed;  
  
    inset:0;  
  
    overflow:hidden;  
  
    pointer-events:none;  
  
    z-index:0;  
}  
  
  
/* 星星 */  
  
.star{  
  
    position:absolute;  
  
    width:2px;  
    height:2px;  
  
    background:#d8ecff;  
  
    border-radius:50%;  
  
    box-shadow:  
        0 0 5px #8fc8ff,  
        0 0 10px rgba(84,161,255,.7);  
  
    animation:  
        twinkle  
        var(--duration)  
        ease-in-out  
        infinite;  
  
    animation-delay:var(--delay);  
}  
  
  
/* 大型星芒 */  
  
.big-star{  
  
    position:absolute;  
  
    width:34px;  
    height:34px;  
  
    transform:  
        rotate(45deg);  
  
    opacity:.85;  
  
    filter:  
        drop-shadow(  
            0 0 8px  
            rgba(97,180,255,.9)  
        );  
}  
  
.big-star::before,  
.big-star::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    transform:  
        translate(-50%,-50%);  
  
    background:  
        linear-gradient(  
            transparent,  
            #dff4ff,  
            transparent  
        );  
}  
  
.big-star::before{  
  
    width:2px;  
    height:42px;  
}  
  
.big-star::after{  
  
    width:42px;  
    height:2px;  
}  
  
.big-star span{  
  
    position:absolute;  
  
    inset:9px;  
  
    background:  
        #e7f7ff;  
  
    clip-path:  
        polygon(  
            50% 0%,  
            68% 32%,  
            100% 50%,  
            68% 68%,  
            50% 100%,  
            32% 68%,  
            0% 50%,  
            32% 32%  
        );  
}  
  
  
/* 星星动画 */  
  
@keyframes twinkle{  
  
    0%{  
        opacity:.2;  
        transform:scale(.7);  
    }  
  
    50%{  
        opacity:1;  
        transform:scale(1.5);  
    }  
  
    100%{  
        opacity:.2;  
        transform:scale(.7);  
    }  
}  
  
  
/* =========================================================  
   中央魔法阵  
========================================================= */  
  
.magic-circle{  
  
    position:absolute;  
  
    left:50%;  
    top:48%;  
  
    width:510px;  
    height:510px;  
  
    transform:  
        translate(-50%,-50%);  
  
    opacity:.5;  
  
    filter:  
        drop-shadow(  
            0 0 10px  
            rgba(44,132,255,.25)  
        );  
}  
  
  
/* 圆 */  
  
.circle{  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    border:  
        1px solid  
        rgba(76,159,255,.45);  
  
    border-radius:50%;  
  
    transform:  
        translate(-50%,-50%);  
}  
  
.circle.c1{  
    width:490px;  
    height:490px;  
}  
  
.circle.c2{  
    width:420px;  
    height:420px;  
}  
  
.circle.c3{  
    width:330px;  
    height:330px;  
}  
  
.circle.c4{  
    width:250px;  
    height:250px;  
}  
  
.circle.c5{  
    width:180px;  
    height:180px;  
}  
  
  
/* 旋转圆 */  
  
.orbit{  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    border:  
        1px solid  
        rgba(66,146,244,.28);  
  
    border-radius:50%;  
  
    transform:  
        translate(-50%,-50%);  
  
    animation:  
        rotateOrbit  
        40s  
        linear  
        infinite;  
}  
  
.orbit.o1{  
  
    width:450px;  
    height:180px;  
}  
  
.orbit.o2{  
  
    width:390px;  
    height:140px;  
  
    animation-direction:reverse;  
  
    animation-duration:32s;  
}  
  
.orbit.o3{  
  
    width:310px;  
    height:110px;  
  
    animation-duration:25s;  
}  
  
@keyframes rotateOrbit{  
  
    from{  
        transform:  
            translate(-50%,-50%)  
            rotate(0deg);  
    }  
  
    to{  
        transform:  
            translate(-50%,-50%)  
            rotate(360deg);  
    }  
}  
  
  
/* 魔法阵十字线 */  
  
.magic-line{  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    transform:  
        translate(-50%,-50%);  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            rgba(66,153,255,.4),  
            transparent  
        );  
  
    width:500px;  
    height:1px;  
}  
  
.magic-line.vertical{  
  
    transform:  
        translate(-50%,-50%)  
        rotate(90deg);  
}  
  
  
/* =========================================================  
   页面边框  
========================================================= */  
  
.frame{  
  
    position:fixed;  
  
    inset:38px;  
  
    z-index:3;  
  
    pointer-events:none;  
  
    border:  
        1px solid  
        rgba(54,142,238,.58);  
  
    box-shadow:  
        inset 0 0 25px  
        rgba(30,108,210,.08);  
}  
  
  
/* 上下装饰线 */  
  
.frame::before,  
.frame::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:40px;  
    right:40px;  
  
    height:1px;  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            rgba(58,145,240,.55) 10%,  
            rgba(79,168,255,.8) 50%,  
            rgba(58,145,240,.55) 90%,  
            transparent  
        );  
}  
  
.frame::before{  
    top:0;  
}  
  
.frame::after{  
    bottom:0;  
}  
  
  
/* =========================================================  
   四角装饰  
========================================================= */  
  
.corner{  
  
    position:absolute;  
  
    width:58px;  
    height:58px;  
}  
  
.corner::before,  
.corner::after{  
  
    content:"";  
  
    position:absolute;  
  
    border:  
        1px solid  
        rgba(75,164,255,.75);  
}  
  
  
/* 左上 */  
  
.corner.tl{  
    left:-1px;  
    top:-1px;  
}  
  
.corner.tl::before{  
  
    width:42px;  
    height:42px;  
  
    border-right:0;  
    border-bottom:0;  
  
    border-radius:  
        22px 0 0 0;  
  
    transform:  
        rotate(0deg);  
}  
  
.corner.tl::after{  
  
    width:18px;  
    height:18px;  
  
    left:9px;  
    top:9px;  
  
    border-right:0;  
    border-bottom:0;  
  
    transform:  
        rotate(45deg);  
}  
  
  
/* 右上 */  
  
.corner.tr{  
    right:-1px;  
    top:-1px;  
}  
  
.corner.tr::before{  
  
    width:42px;  
    height:42px;  
  
    right:0;  
  
    border-left:0;  
    border-bottom:0;  
  
    border-radius:  
        0 22px 0 0;  
}  
  
.corner.tr::after{  
  
    width:18px;  
    height:18px;  
  
    right:9px;  
    top:9px;  
  
    border-left:0;  
    border-bottom:0;  
  
    transform:  
        rotate(45deg);  
}  
  
  
/* 左下 */  
  
.corner.bl{  
    left:-1px;  
    bottom:-1px;  
}  
  
.corner.bl::before{  
  
    width:42px;  
    height:42px;  
  
    border-right:0;  
    border-top:0;  
  
    border-radius:  
        0 0 0 22px;  
}  
  
.corner.bl::after{  
  
    width:18px;  
    height:18px;  
  
    left:9px;  
    bottom:9px;  
  
    border-right:0;  
    border-top:0;  
  
    transform:  
        rotate(45deg);  
}  
  
  
/* 右下 */  
  
.corner.br{  
    right:-1px;  
    bottom:-1px;  
}  
  
.corner.br::before{  
  
    width:42px;  
    height:42px;  
  
    right:0;  
  
    border-left:0;  
    border-top:0;  
  
    border-radius:  
        0 0 22px 0;  
}  
  
.corner.br::after{  
  
    width:18px;  
    height:18px;  
  
    right:9px;  
    bottom:9px;  
  
    border-left:0;  
    border-top:0;  
  
    transform:  
        rotate(45deg);  
}  
  
  
/* =========================================================  
   顶部  
========================================================= */  
  
.header{  
  
    position:absolute;  
  
    left:0;  
    right:0;  
  
    top:0;  
  
    height:88px;  
  
    z-index:10;  
  
    display:flex;  
  
    align-items:center;  
  
    justify-content:space-between;  
  
    padding:  
        0 10% 0 10%;  
}  
  
  
/* =========================================================  
   左上 Logo  
========================================================= */  
  
.brand{  
  
    display:flex;  
  
    align-items:center;  
  
    gap:20px;  
}  
  
  
/* 罗盘 */  
  
.compass{  
  
    position:relative;  
  
    width:68px;  
    height:68px;  
  
    border:  
        1px solid  
        rgba(72,161,255,.65);  
  
    border-radius:50%;  
  
    box-shadow:  
        0 0 15px  
        rgba(57,145,255,.25);  
}  
  
.compass::before{  
  
    content:"";  
  
    position:absolute;  
  
    inset:7px;  
  
    border:  
        1px solid  
        rgba(77,165,255,.55);  
  
    border-radius:50%;  
}  
  
.compass::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    width:2px;  
    height:76px;  
  
    transform:  
        translate(-50%,-50%);  
  
    background:  
        linear-gradient(  
            transparent,  
            #6ebcff,  
            transparent  
        );  
}  
  
  
/* 罗盘星 */  
  
.compass-star{  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    width:36px;  
    height:36px;  
  
    transform:  
        translate(-50%,-50%)  
        rotate(45deg);  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent 45%,  
            #d9f1ff 46%,  
            #75bdff 54%,  
            transparent 55%  
        ),  
        linear-gradient(  
            transparent 45%,  
            #d9f1ff 46%,  
            #75bdff 54%,  
            transparent 55%  
        );  
}  
  
.compass-star::after{  
  
    content:"";  
  
    position:absolute;  
  
    inset:7px;  
  
    background:#dff5ff;  
  
    clip-path:  
        polygon(  
            50% 0,  
            64% 36%,  
            100% 50%,  
            64% 64%,  
            50% 100%,  
            36% 64%,  
            0 50%,  
            36% 36%  
        );  
}  
  
  
/* 品牌文字 */  
  
.brand-text{  
  
    display:flex;  
  
    flex-direction:column;  
  
    gap:4px;  
}  
  
.brand-cn{  
  
    font-family:  
        "Noto Serif SC",  
        serif;  
  
    font-size:22px;  
  
    letter-spacing:6px;  
  
    color:#e4f1ff;  
  
    text-shadow:  
        0 0 12px  
        rgba(89,167,255,.35);  
}  
  
.brand-en{  
  
    font-family:  
        "Cinzel",  
        serif;  
  
    font-size:12px;  
  
    letter-spacing:5px;  
  
    color:#86aeda;  
}  
  
  
/* =========================================================  
   导航  
========================================================= */  
  
.nav{  
  
    display:flex;  
  
    gap:60px;  
  
    height:100%;  
  
    align-items:center;  
}  
  
.nav a{  
  
    position:relative;  
  
    color:#aac4e5;  
  
    text-decoration:none;  
  
    font-family:  
        "Noto Serif SC",  
        serif;  
  
    font-size:16px;  
  
    letter-spacing:3px;  
  
    transition:  
        .3s ease;  
}  
  
.nav a:hover{  
  
    color:#e5f3ff;  
  
    text-shadow:  
        0 0 12px  
        rgba(99,181,255,.8);  
}  
  
  
/* 当前页面 */  
  
.nav a.active{  
  
    color:#eaf5ff;  
}  
  
.nav a.active::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:0;  
    right:0;  
  
    bottom:-14px;  
  
    height:1px;  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            #a9dcff,  
            transparent  
        );  
  
    box-shadow:  
        0 0 8px  
        #56aaff;  
}  
  
  
/* =========================================================  
   顶部横线中央星星  
========================================================= */  
  
.header-line-star{  
  
    position:absolute;  
  
    left:50%;  
  
    top:83px;  
  
    transform:  
        translateX(-50%);  
  
    width:26px;  
    height:26px;  
  
    z-index:12;  
}  
  
.header-line-star::before,  
.header-line-star::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    transform:  
        translate(-50%,-50%);  
  
    background:#dff4ff;  
  
    box-shadow:  
        0 0 12px  
        #64baff;  
}  
  
.header-line-star::before{  
  
    width:2px;  
    height:34px;  
}  
  
.header-line-star::after{  
  
    width:34px;  
    height:2px;  
}  
  
  
/* =========================================================  
   主内容  
========================================================= */  
  
.hero{  
  
    position:relative;  
  
    z-index:5;  
  
    width:100%;  
    height:100vh;  
  
    display:flex;  
  
    justify-content:center;  
  
    align-items:center;  
  
    text-align:center;  
}  
  
.hero-content{  
  
    position:relative;  
  
    width:100%;  
  
    max-width:1200px;  
  
    margin-top:45px;  
  
    display:flex;  
  
    flex-direction:column;  
  
    align-items:center;  
}  
  
  
/* =========================================================  
   主标题  
========================================================= */  
  
.title{  
  
    position:relative;  
  
    font-family:  
        "Cinzel",  
        serif;  
  
    font-weight:500;  
  
    font-size:  
        clamp(58px, 7.8vw, 118px);  
  
    letter-spacing:  
        .055em;  
  
    line-height:1;  
  
    color:#eaf5ff;  
  
    white-space:nowrap;  
  
    text-shadow:  
  
        0 0 4px  
        rgba(255,255,255,.9),  
  
        0 0 16px  
        rgba(83,170,255,.8),  
  
        0 0 36px  
        rgba(35,115,220,.45);  
}  
  
  
/* 标题上下装饰线 */  
  
.title-line{  
  
    position:absolute;  
  
    top:50%;  
  
    width:260px;  
  
    height:1px;  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            rgba(86,172,255,.8)  
        );  
}  
  
.title-line.left{  
  
    right:100%;  
  
    margin-right:20px;  
}  
  
.title-line.right{  
  
    left:100%;  
  
    margin-left:20px;  
  
    transform:  
        rotate(180deg);  
}  
  
  
/* 标题线上的小菱形 */  
  
.title-line::after{  
  
    content:"";  
  
    position:absolute;  
  
    right:-1px;  
  
    top:-3px;  
  
    width:6px;  
    height:6px;  
  
    transform:  
        rotate(45deg);  
  
    border:  
        1px solid  
        #6cbaff;  
  
    background:  
        #061a3c;  
  
    box-shadow:  
        0 0 8px  
        rgba(76,170,255,.7);  
}  
  
  
/* =========================================================  
   中文标题  
========================================================= */  
  
.subtitle{  
  
    margin-top:18px;  
  
    font-family:  
        "Noto Serif SC",  
        serif;  
  
    font-size:25px;  
  
    font-weight:300;  
  
    letter-spacing:  
        13px;  
  
    margin-left:13px;  
  
    color:#d9eaff;  
  
    text-shadow:  
        0 0 10px  
        rgba(83,170,255,.4);  
}  
  
  
/* =========================================================  
   中文下方装饰  
========================================================= */  
  
.subtitle-decoration{  
  
    display:flex;  
  
    align-items:center;  
  
    justify-content:center;  
  
    gap:14px;  
  
    margin-top:13px;  
  
    width:620px;  
  
    max-width:80vw;  
}  
  
.subtitle-decoration .line{  
  
    height:1px;  
  
    flex:1;  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            rgba(77,162,255,.75)  
        );  
}  
  
.subtitle-decoration .line.right{  
  
    background:  
        linear-gradient(  
            90deg,  
            rgba(77,162,255,.75),  
            transparent  
        );  
}  
  
  
/* 菱形 */  
  
.diamond{  
  
    width:7px;  
    height:7px;  
  
    transform:  
        rotate(45deg);  
  
    border:  
        1px solid  
        #78c2ff;  
  
    box-shadow:  
        0 0 8px  
        rgba(76,173,255,.8);  
}  
  
  
/* =========================================================  
   中间星芒  
========================================================= */  
  
.center-star{  
  
    position:absolute;  
  
    left:50%;  
  
    top:48%;  
  
    width:42px;  
    height:42px;  
  
    transform:  
        translate(-50%,-50%);  
  
    pointer-events:none;  
  
    filter:  
        drop-shadow(  
            0 0 9px  
            #53b1ff  
        );  
}  
  
.center-star::before,  
.center-star::after{  
  
    content:"";  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    transform:  
        translate(-50%,-50%);  
  
    background:  
        linear-gradient(  
            transparent,  
            #e8f7ff,  
            transparent  
        );  
}  
  
.center-star::before{  
  
    width:2px;  
    height:75px;  
}  
  
.center-star::after{  
  
    width:75px;  
    height:2px;  
}  
  
.center-star span{  
  
    position:absolute;  
  
    left:50%;  
    top:50%;  
  
    width:25px;  
    height:25px;  
  
    transform:  
        translate(-50%,-50%)  
        rotate(45deg);  
  
    background:  
        #e9f7ff;  
  
    clip-path:  
        polygon(  
            50% 0,  
            64% 36%,  
            100% 50%,  
            64% 64%,  
            50% 100%,  
            36% 64%,  
            0 50%,  
            36% 36%  
        );  
}  
  
  
/* =========================================================  
   说明文字  
========================================================= */  
  
.description{  
  
    margin-top:92px;  
  
    color:#a6c0df;  
  
    font-size:15px;  
  
    line-height:2.15;  
  
    letter-spacing:3px;  
  
    text-shadow:  
        0 0 8px  
        rgba(63,139,222,.25);  
}  
  
  
/* =========================================================  
   进入按钮  
========================================================= */  
  
.enter-wrap{  
  
    margin-top:38px;  
  
    position:relative;  
  
    width:330px;  
    height:66px;  
  
    display:flex;  
  
    justify-content:center;  
  
    align-items:center;  
}  
  
  
/* 外框 */  
  
.enter-button{  
  
    position:relative;  
  
    width:285px;  
    height:54px;  
  
    display:flex;  
  
    align-items:center;  
  
    justify-content:center;  
  
    text-decoration:none;  
  
    color:#e6f3ff;  
  
    font-family:  
        "Noto Serif SC",  
        serif;  
  
    font-size:18px;

    star.style.setProperty(  
        "--delay",  
        (-Math.random() * 6) + "s"  
    );  
  
    space.appendChild(star);  
}

}
