<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#d9e8f8;
    overflow-x:hidden;
    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}

/* =========================
   背景
========================= */

.page{
    position:relative;
    min-height:100vh;
    width:100%;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(24,67,112,.20) 0%,
            rgba(10,32,58,.12) 28%,
            rgba(6,20,38,0) 58%
        ),
        #061426;
}

/* =========================
   星空
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    color:rgba(177,213,246,.7);
    font-family:serif;
    font-size:8px;
    opacity:.5;
    animation:floatStar linear infinite;
}

@keyframes floatStar{
    0%{
        transform:translateY(0) scale(.8);
        opacity:.25;
    }
    50%{
        opacity:.75;
    }
    100%{
        transform:translateY(-22px) scale(1);
        opacity:.15;
    }
}

.s1{left:8%;top:18%;animation-duration:5s;}
.s2{left:17%;top:72%;animation-duration:7s;}
.s3{left:29%;top:25%;animation-duration:6s;}
.s4{left:42%;top:11%;animation-duration:8s;}
.s5{left:56%;top:20%;animation-duration:5s;}
.s6{left:72%;top:16%;animation-duration:7s;}
.s7{left:86%;top:28%;animation-duration:6s;}
.s8{left:93%;top:68%;animation-duration:8s;}
.s9{left:74%;top:82%;animation-duration:6s;}
.s10{left:49%;top:88%;animation-duration:7s;}
.s11{left:24%;top:91%;animation-duration:5s;}
.s12{left:5%;top:48%;animation-duration:8s;}
.s13{left:64%;top:52%;animation-duration:6s;}
.s14{left:35%;top:67%;animation-duration:7s;}
.s15{left:81%;top:47%;animation-duration:5s;}

/* =========================
   外框
========================= */

.frame{
    position:absolute;
    inset:18px;
    border:1px solid rgba(133,178,221,.28);
    pointer-events:none;
}

.frame::before,
.frame::after{
    content:"";
    position:absolute;
    pointer-events:none;
}

.frame::before{
    inset:7px;
    border:1px solid rgba(110,158,204,.08);
}

.frame::after{
    inset:0;
    box-shadow:
        inset 0 0 80px rgba(31,87,137,.05);
}

/* =========================
   四角六芒星
========================= */

.corner{
    position:absolute;
    color:rgba(132,181,224,.72);
    font-size:20px;
    line-height:1;
    font-family:serif;
    text-shadow:0 0 10px rgba(99,167,224,.15);
}

.corner.tl{
    top:30px;
    left:30px;
}

.corner.tr{
    top:30px;
    right:30px;
}

.corner.bl{
    bottom:30px;
    left:30px;
}

.corner.br{
    bottom:30px;
    right:30px;
}

/* =========================
   顶部导航
========================= */

.topbar{
    position:absolute;
    top:42px;
    left:54px;
    right:54px;

    align-items:flex-start;

}

.logo{

.logo-mark{

}

.logo-text{

}

.logo-cn{

    letter-spacing:3px;
    color:#b7d0e7;
    font-weight:400;
}

.logo-en{

    font-size:8px;
    letter-spacing:3px;
    color:rgba(147,188,222,.55);

}

.nav{

    align-items:center;

}

.nav a{

    text-decoration:none;
    font-family:"Noto Serif SC",serif;
    font-size:12px;
    letter-spacing:3px;
    transition:.3s ease;
}

.nav a:hover{

}

/* =========================
   中央区域
========================= */

.hero{
    position:relative;
    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:120px 30px 80px;
}

.hero-inner{
    position:relative;
    width:100%;
    max-width:1100px;
    min-height:620px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   魔法阵
========================= */

.magic{
    position:absolute;
    left:50%;
    top:50%;

    width:590px;
    height:590px;

    transform:translate(-50%,-50%);

    pointer-events:none;
    opacity:.95;
}

.magic-circle{
    position:absolute;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.magic-circle.c1{
    width:590px;
    height:590px;
    border:1px solid rgba(102,160,211,.14);
}

.magic-circle.c2{
    width:520px;
    height:520px;
    border:1px solid rgba(123,177,222,.12);
}

.magic-circle.c3{
    width:445px;
    height:445px;
    border:1px solid rgba(109,167,216,.15);
}

.magic-circle.c4{
    width:365px;
    height:365px;
    border:1px solid rgba(125,181,227,.12);
}

.magic-circle.c5{
    width:275px;
    height:275px;
    border:1px solid rgba(127,181,225,.15);
}

/* 魔法阵横线 */

.magic-line{
    position:absolute;
    left:50%;
    top:50%;
    width:590px;
    height:1px;
    transform:translate(-50%,-50%);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(117,174,221,.16),
        transparent
    );
}

.magic-line.vertical{
    transform:translate(-50%,-50%) rotate(90deg);
}

/* =========================
   星轨
========================= */

.orbit-system{
    position:absolute;
    left:50%;
    top:50%;

    width:590px;
    height:590px;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

.orbit-track{
    position:absolute;
    left:50%;
    top:50%;

    border:1px solid rgba(117,177,224,.16);
    border-radius:50%;

    transform:translate(-50%,-50%);
}

.orbit-a{
    width:500px;
    height:190px;
}

.orbit-b{
    width:420px;
    height:145px;
}

.orbit-c{

.enter-button::before,

.enter-button::after{

<script>

/* =========================
   进入档案馆
========================= */

function enterArchive(){

    window.location.href = "archive.html";

}


/* =========================
   星轨运行
   A → A/B → B → B/C → C → C/A → A
========================= */

const orbitSystem = document.querySelector(".orbit-system");

const tracks = {

    A:{
        rx:250,
        ry:95,
        rotation:0,
        speed:360/38,
        direction:1
    },

    B:{
        rx:210,
        ry:72.5,
        rotation:55,
        speed:-360/32,
        direction:-1
    },

    C:{
        rx:165,
        ry:52.5,
        rotation:110,
        speed:360/25,
        direction:1
    }

};


/* =========================
   创建小星辰
========================= */

const tinyStar = document.createElement("div");

tinyStar.innerHTML = `
    <span style="
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        color:#d8ecff;
        font-size:12px;
        line-height:1;
        text-shadow:
            0 0 4px rgba(151,210,255,.8),
            0 0 10px rgba(100,170,230,.45);
    ">✦</span>
`;

tinyStar.style.position = "absolute";
tinyStar.style.left = "0";
tinyStar.style.top = "0";
tinyStar.style.width = "1px";
tinyStar.style.height = "1px";
tinyStar.style.pointerEvents = "none";

orbitSystem.appendChild(tinyStar);


/* =========================
   轨道位置计算
========================= */

function ellipsePoint(rx,ry,angle){

    const rad = angle * Math.PI / 180;

    return {
        x:Math.cos(rad) * rx,
        y:Math.sin(rad) * ry
    };

}


/* =========================
   坐标旋转
========================= */

function rotatePoint(x,y,angle){

    const rad = angle * Math.PI / 180;

    return {

        x:
            x * Math.cos(rad)
            -
            y * Math.sin(rad),

        y:
            x * Math.sin(rad)
            +
            y * Math.cos(rad)

    };

}


/* =========================
   两个轨道之间的插值
========================= */

function interpolateOrbit(a,b,t){

    return {

        rx:a.rx + (b.rx-a.rx)*t,

        ry:a.ry + (b.ry-a.ry)*t,

        rotation:
            a.rotation
            +
            (b.rotation-a.rotation)*t

    };

}


/* =========================
   动画状态
========================= */

let startTime = performance.now();

const durationA  = 38000;
const durationAB = 5000;
const durationB  = 32000;
const durationBC = 5000;
const durationC  = 25000;
const durationCA = 5000;

const totalDuration =
    durationA +
    durationAB +
    durationB +
    durationBC +
    durationC +
    durationCA;


/* =========================
   动画
========================= */

function animate(now){

    const elapsed =
        (now - startTime)
        % totalDuration;

    let time = elapsed;

    let orbit;
    let angle;


    /* A */

    if(time < durationA){

        const p = time / durationA;

        orbit = tracks.A;

        angle =
            p * 360;

    }

    /* A → B */

    else if(
        (time -= durationA)
        < durationAB
    ){

        const p = time / durationAB;

        orbit =
            interpolateOrbit(
                tracks.A,
                tracks.B,
                p
            );

        angle =
            p * 360;

    }

    /* B */

    else if(
        (time -= durationAB)
        < durationB
    ){

        const p = time / durationB;

        orbit = tracks.B;

        angle =
            360 - p * 360;

    }

    /* B → C */

    else if(
        (time -= durationB)
        < durationBC
    ){

        const p = time / durationBC;

        orbit =
            interpolateOrbit(
                tracks.B,
                tracks.C,
                p
            );

        angle =
            360 - p * 360;

    }

    /* C */

    else if(
        (time -= durationBC)
        < durationC
    ){

        const p = time / durationC;

        orbit = tracks.C;

        angle =
            p * 360;

    }

    /* C → A */

    else{

        time -= durationC;

        const p = time / durationCA;

        orbit =
            interpolateOrbit(
                tracks.C,
                tracks.A,
                p
            );

        angle =
            p * 360;

    }


    const point =
        ellipsePoint(
            orbit.rx,
            orbit.ry,
            angle
        );


    const rotated =
        rotatePoint(
            point.x,
            point.y,
            orbit.rotation
        );


    /*
       orbit-system 本身是 590 × 590
       所以中心点是 295 / 295
    */

    tinyStar.style.left =
        `${295 + rotated.x}px`;

    tinyStar.style.top =
        `${295 + rotated.y}px`;


    requestAnimationFrame(animate);

}

requestAnimationFrame(animate);

</script>
