<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    background: #06111d;

    color: #eaf7ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}


/* =========================================================
   页面主体
========================================================= */

.page {

    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 620px;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 43%,
            rgba(38, 111, 153, .20) 0%,
            rgba(13, 48, 72, .14) 25%,
            rgba(5, 18, 31, .70) 58%,
            #030a12 100%
        );
}


/* =========================================================
   星空背景
========================================================= */

.stars {

    position: absolute;

    inset: 0;

    opacity: .72;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(170,225,255,.48) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.35) 0 1px,
            transparent 1.5px
        );

    background-size:
        190px 190px,
        270px 270px,
        340px 340px;

    background-position:
        20px 30px,
        100px 120px,
        40px 80px;

    animation:
        starFieldMove 32s linear infinite;

    pointer-events: none;

    z-index: 1;
}


@keyframes starFieldMove {

    0% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(-18px,12px,0);
    }

    100% {
        transform:
            translate3d(0,0,0);
    }
}


/* =========================================================
   漂浮星星
========================================================= */

.floating-stars {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;
}


.floating-star {

    position: absolute;

    color:
        rgba(190,235,255,.72);

    font-family:
        "Times New Roman",
        serif;

    opacity: .42;

    animation:
        starFloat 9s ease-in-out infinite,
        starTwinkle 5s ease-in-out infinite;
}


/* 普通星星 */

.star-a {
    left: 12%;
    top: 23%;
    font-size: 13px;
    animation-delay: 0s,.4s;
}

.star-b {
    left: 23%;
    top: 67%;
    font-size: 10px;
    animation-delay: 1.8s,1.2s;
}

.star-c {
    left: 30%;
    top: 17%;
    font-size: 17px;
    animation-delay: 3s,.8s;
}

.star-d {
    left: 76%;
    top: 22%;
    font-size: 14px;
    animation-delay: 1s,2s;
}

.star-e {
    left: 86%;
    top: 36%;
    font-size: 11px;
    animation-delay: 2.5s,.2s;
}

.star-f {
    left: 72%;
    top: 72%;
    font-size: 16px;
    animation-delay: 4s,1.5s;
}

.star-g {
    left: 15%;
    top: 48%;
    font-size: 14px;
    animation-delay: 2s,2.5s;
}

.star-h {
    left: 91%;
    top: 69%;
    font-size: 13px;
    animation-delay: 3.5s,1s;
}

.star-i {
    left: 58%;
    top: 14%;
    font-size: 9px;
    animation-delay: 1.5s,3s;
}

.star-j {
    left: 63%;
    top: 83%;
    font-size: 14px;
    animation-delay: 4.5s,2s;
}

.star-k {
    left: 39%;
    top: 78%;
    font-size: 9px;
    animation-delay: 2.2s,.5s;
}

.star-l {
    left: 81%;
    top: 54%;
    font-size: 15px;
    animation-delay: 3.8s,2.8s;
}


/* 星象符号 */

.star-m {
    left: 18%;
    top: 35%;
    font-size: 15px;
    opacity: .38;
    animation-delay: 1.2s,2.4s;
}

.star-n {
    left: 43%;
    top: 25%;
    font-size: 13px;
    opacity: .44;
    animation-delay: 3.4s,1.3s;
}

.star-o {
    left: 68%;
    top: 62%;
    font-size: 18px;
    opacity: .36;
    animation-delay: 2.6s,.7s;
}

.star-p {
    left: 88%;
    top: 18%;
    font-size: 12px;
    opacity: .42;
    animation-delay: 4.2s,2.1s;
}


@keyframes starFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    50% {
        transform:
            translate3d(0,-15px,0)
            rotate(8deg);
    }
}


@keyframes starTwinkle {

    0%,
    100% {
        opacity: .22;
    }

    50% {
        opacity: .9;
    }
}


/* =========================================================
   中央光晕
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 43%;

    width: 650px;
    height: 650px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(67,163,210,.09) 0%,
            rgba(55,135,180,.045) 30%,
            transparent 70%
        );

    filter: blur(7px);

    pointer-events: none;

    z-index: 2;
}


/* =========================================================
   中央魔法阵
========================================================= */

.magic-circle {

    position: absolute;

    left: 50%;
    top: 52%;

    width: 540px;
    height: 540px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(110,196,235,.10);

    box-shadow:

        0 0 40px
        rgba(76,170,220,.04),

        inset 0 0 40px
        rgba(76,170,220,.035);

    opacity: .68;

    pointer-events: none;

    z-index: 2;
}


.magic-circle::before {

    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(120,205,240,.075);
}


.magic-circle::after {

    content: "";

    position: absolute;

    inset: 88px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(135,215,245,.07);

    animation:
        circleRotate 45s linear infinite;
}


@keyframes circleRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   外框
========================================================= */

.frame {

    position: absolute;

    inset: 22px;

    border:
        1px solid
        rgba(155,218,245,.24);

    pointer-events: none;

    z-index: 20;
}


/* 上下横线 */

.frame::before {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 1px;

    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(70,157,218,.18) 12%,
            rgba(100,190,235,.32) 50%,
            rgba(70,157,218,.18) 88%,
            transparent 100%
        );

    opacity: 0;

}


/* =========================================================
   四角雪花 SVG
========================================================= */

.corner {

    position: absolute;

    width: 74px;
    height: 74px;

    color:
        rgba(105,190,240,.70);

    opacity: .85;

    filter:
        drop-shadow(
            0 0 4px
            rgba(70,170,230,.18)
        );

}


/* 左上 */

.corner-tl {

    left: -8px;
    top: -8px;
}


/* 右上 */

.corner-tr {

    right: -8px;
    top: -8px;

    transform:
        rotate(90deg);
}


/* 左下 */

.corner-bl {

    left: -8px;
    bottom: -8px;

    transform:
        rotate(-90deg);
}


/* 右下 */

.corner-br {

    right: -8px;
    bottom: -8px;

    transform:
        rotate(180deg);
}


/* =========================================================
   顶部导航
========================================================= */

.nav {

    position: absolute;

    left: 58px;
    right: 58px;

    top: 43px;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    z-index: 30;
}


/* =========================================================
   左上角 Logo
   使用你原本代码里的样式
========================================================= */

.logo {

    display: flex;

    align-items: flex-start;

    gap: 13px;

    color:
        rgba(220,244,255,.92);

    white-space: nowrap;
}


.logo-symbol {

    color:
        #9fdcff;

    font-size: 17px;

    line-height: 1;

    margin-top: 3px;
}


.logo-text {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 2px;
}


.logo-cn {

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(220,244,255,.90);
}


.logo-en {

    display: block;

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 3px;

    color:
        rgba(190,225,245,.72);

    opacity: .65;
}


/* =========================================================
   导航
========================================================= */

.nav-links {

    display: flex;

    gap: 34px;
}


.nav-links a {

    position: relative;

    color:
        rgba(208,232,244,.65);

    text-decoration: none;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 3px;

    transition:
        color .35s ease;
}


.nav-links a::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -8px;

    width: 0;

    height: 1px;

    background:
        rgba(170,225,250,.8);

    transform:
        translateX(-50%);

    transition:
        width .35s ease;
}


.nav-links a:hover {

    color:
        rgba(235,250,255,.98);
}


.nav-links a:hover::after {

    width: 100%;
}


/* =========================================================
   Hero
========================================================= */

.hero {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(1050px,92vw);

    transform:
        translate(-50%,-46%);

    text-align: center;

    z-index: 10;
}


/* =========================================================
   主标题
========================================================= */

.title-en {

    display: flex;

    flex-direction: column;

    align-items: center;

    font-family:

        "Cormorant Garamond",
        "Bodoni 72",
        "Didot",
        "Baskerville",
        "Times New Roman",
        serif;

    font-weight: 300;

    color:
        rgba(244,250,255,.96);

    /* 已经去除文字发光 */

    text-shadow:
        none;

    transform:
        scaleX(.92);

    line-height: .80;

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        geometricPrecision;
}


.title-word {

    display: block;

    white-space: nowrap;
}


/* SEYAMI */

.title-word:first-child {

    font-size:
        clamp(78px,10.8vw,142px);

    font-weight: 300;

    letter-spacing:
        clamp(10px,1.7vw,24px);

    padding-left:
        clamp(10px,1.7vw,24px);
}


/* ARCHIVE */

.title-word:last-child {

    margin-top: 13px;

    font-size:
        clamp(72px,10vw,132px);

    font-weight: 300;

    letter-spacing:
        clamp(13px,2vw,28px);

    padding-left:
        clamp(13px,2vw,28px);

    opacity: .96;
}


/* =========================================================
   标题下方细线
========================================================= */

.title-line {

    position: relative;

    width: 300px;

    height: 1px;

    margin:
        31px auto 23px;

    background:

        linear-gradient(
            to right,
            transparent,
            rgba(155,215,242,.52),
            transparent
        );
}


/* =========================================================
   中文标题
========================================================= */

.title-cn {

    font-family:

        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 18px;

    font-weight: 300;

    letter-spacing: 8px;

    padding-left: 8px;

    color:
        rgba(224,244,252,.88);

    text-shadow:
        none;
}


/* =========================================================
   简介
========================================================= */

.description {

    margin-top: 22px;

    color:
        rgba(190,219,234,.58);

    font-size: 12px;

    font-weight: 300;

    line-height: 2.25;

    letter-spacing: 4px;

    padding-left: 4px;
}


/* =========================================================
   进入档案馆按钮
   全新西幻双层边框
========================================================= */

.enter-button {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 34px;

    width: 230px;

    height: 54px;

    padding: 0 25px;

    color:
        rgba(220,245,255,.90);

    text-decoration: none;

    font-family:

        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 4px;

    background:
        rgba(20,65,95,.10);

    border:
        1px solid
        rgba(135,205,240,.55);

    transition:
        background .4s ease,
        border-color .4s ease,
        transform .4s ease;
}


/* 内层边框 */

.enter-button::before {

    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid
        rgba(105,190,235,.32);

    pointer-events: none;
}


/* 四角切角 */

.enter-button::after {

    content: "";

    position: absolute;

    inset: -1px;

    pointer-events: none;

    background:

        linear-gradient(
            45deg,
            transparent 0 12px,
            rgba(145,215,245,.55) 12px 13px,
            transparent 13px
        )
        left top / 20px 20px no-repeat,

        linear-gradient(
            -45deg,
            transparent 0 12px,
            rgba(145,215,245,.55) 12px 13px,
            transparent 13px
        )
        right top / 20px 20px no-repeat,

        linear-gradient(
            -45deg,
            transparent 0 12px,
            rgba(145,215,245,.55) 12px 13px,
            transparent 13px
        )
        left bottom / 20px 20px no-repeat,

        linear-gradient(
            45deg,
            transparent 0 12px,
            rgba(145,215,245,.55) 12px 13px,
            transparent 13px
        )
        right bottom / 20px 20px no-repeat;
}


/* 按钮中央小菱形 */

.enter-button span {

    position: relative;

    z-index: 2;
}


.enter-button:hover {

    color:
        #f2fbff;

    border-color:
        rgba(175,225,250,.78);

    background:
        rgba(45,105,145,.13);

    transform:
        translateY(-2px);
}


/* =========================================================
   底部文字
========================================================= */

.footer-mark {

    position: absolute;

    left: 50%;

    bottom: 38px;

    transform:
        translateX(-50%);

    color:
        rgba(160,205,225,.28);

    font-family:

        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    z-index: 10;
}


/* =========================================================
   手机端
========================================================= */

@media (max-width:700px) {

    .page {

        min-height: 580px;
    }


    .frame {

        inset: 12px;
    }


    /* 雪花角变小 */

    .corner {

        width: 57px;
        height: 57px;
    }


    .corner-tl {
        left: -6px;
        top: -6px;
    }

    .corner-tr {
        right: -6px;
        top: -6px;
    }

    .corner-bl {
        left: -6px;
        bottom: -6px;
    }

    .corner-br {
        right: -6px;
        bottom: -6px;
    }


    .nav {

        left: 30px;

        right: 30px;

        top: 30px;
    }


    .logo {

        gap: 9px;
    }


    .logo-symbol {

        font-size: 13px;
    }


    .logo-cn {

        font-size: 10px;

        letter-spacing: 2px;
    }


    .logo-en {

        font-size: 9px;

        letter-spacing: 2.5px;
    }


    .nav-links {

        gap: 14px;
    }


    .nav-links a {

        font-size: 10px;

        letter-spacing: 1px;
    }


    .nav-links a:nth-child(3) {

        display: none;
    }


    .hero {

        width: 94vw;

        transform:
            translate(-50%,-45%);
    }


    .title-word:first-child {

        font-size:
            clamp(57px,16vw,88px);

        letter-spacing: 7px;

        padding-left: 7px;
    }


    .title-word:last-child {

        margin-top: 10px;

        font-size:
            clamp(51px,14.5vw,80px);

        letter-spacing: 8px;

        padding-left: 8px;
    }


    .title-line {

        width: 150px;

        margin:
            25px auto 19px;
    }


    .title-cn {

        font-size: 14px;

        letter-spacing: 5px;

        padding-left: 5px;
    }


    .description {

        margin-top: 18px;

        font-size: 10px;

        letter-spacing: 2px;

        line-height: 2;
    }


    .enter-button {

        width: 200px;

        height: 49px;

        margin-top: 27px;

        font-size: 10px;

        letter-spacing: 3px;
    }


    .magic-circle {

        width: 390px;

        height: 390px;
    }


    .footer-mark {

        bottom: 25px;

        font-size: 8px;

        letter-spacing: 2px;
    }
}


/* =========================================================
   超小屏
========================================================= */

@media (max-width:420px) {

    .nav-links {

        display: none;
    }


    .nav {

        justify-content: flex-start;
    }


    .title-word:first-child {

        font-size: 57px;

        letter-spacing: 5px;

        padding-left: 5px;
    }


    .title-word:last-child {

        font-size: 50px;

        letter-spacing: 6px;

        padding-left: 6px;
    }


    .title-cn {

        font-size: 13px;
    }


    .description {

        font-size: 9px;
    }


    .corner {

        width: 51px;

        height: 51px;
    }


    .enter-button {

        width: 190px;

        height: 47px;
    }
}

</style>
</head>
