/* =========================
   背景
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(39,112,170,.10),
            transparent 42%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(34,93,150,.08),
            transparent 35%
        );

    z-index:-3;
}

.stars,
.stars::before,
.stars::after{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.stars{
    z-index:-2;
}

.stars::before{
    content:"";
    opacity:.45;

    background-image:
        radial-gradient(circle, rgba(210,235,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(120,190,235,.45) 0 1px, transparent 1.5px);

    background-size:
        170px 170px,
        260px 260px;

    background-position:
        20px 30px,
        100px 90px;

    animation:starsMove 80s linear infinite;
}

.stars::after{
    content:"";
    opacity:.22;

    background-image:
        radial-gradient(circle, rgba(220,245,255,.8) 0 1px, transparent 1.5px);

    background-size:310px 310px;

    animation:starsMoveReverse 120s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-80px);
    }
}

@keyframes starsMoveReverse{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(60px);
    }
}


/* =========================
   四角边框
========================= */

.frame{
    position:fixed;
    inset:24px;
    pointer-events:none;
    z-index:10;
}

.corner{
    position:absolute;
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(113,190,235,.75);

    font-size:22px;
    font-family:serif;

    opacity:.8;
}

.corner.tl{
    top:0;
    left:0;
}

.corner.tr{
    top:0;
    right:0;
}

.corner.bl{
    bottom:0;
    left:0;
}

.corner.br{
    bottom:0;
    right:0;
}

.corner::before{
    content:"";
    position:absolute;
    width:34px;
    height:34px;
    border:1px solid rgba(90,170,220,.18);
}

.corner.tl::before{
    border-right:0;
    border-bottom:0;
}

.corner.tr::before{
    border-left:0;
    border-bottom:0;
}

.corner.bl::before{
    border-right:0;
    border-top:0;
}

.corner.br::before{
    border-left:0;
    border-top:0;
}


/* =========================
   浮动星星
========================= */

.floating-stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.floating-stars span{

}

.floating-stars span:nth-child(2){

}

.floating-stars span:nth-child(3){

    left:10%;
    font-size:9px;
    animation-delay:-4s;
}

.floating-stars span:nth-child(4){

    right:14%;
    font-size:14px;
    animation-delay:-2s;
}

.floating-stars span:nth-child(5){

    right:7%;
    font-size:9px;
    animation-delay:-5s;
}

.floating-stars span:nth-child(6){
    bottom:29%;
    left:18%;
    font-size:13px;
    animation-delay:-1.5s;
}

@keyframes floatingStar{

    height:560px;

    top:50%;

}

/* 外层圆环 */

.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

.magic-circle::before{
    width:530px;
    height:530px;

    border:
        1px solid
        rgba(72,153,207,.20);

    box-shadow:
        0 0 25px rgba(48,129,183,.06);

}

.magic-circle::after{
    width:485px;
    height:485px;

    border:
        1px solid
        rgba(87,173,220,.13);

    animation:
        magicRotateReverse 65s linear infinite;
}

@keyframes magicRotate{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

@keyframes magicRotateReverse{
    from{
        transform:translate(-50%,-50%) rotate(360deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(0deg);
    }
}


/* =========================
   ★ 三轨魔法星轨系统 ★
========================= */

.orbit-svg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

    z-index:3;
}

/*
   三条轨道本身都存在于同一个系统中。
   JS 会让整个系统缓慢旋转。
*/

.orbit-system{
    transform-origin:280px 280px;

    animation:
        orbitSystemRotate 58s linear infinite;
}

@keyframes orbitSystemRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* 三条轨道 */

.orbit-path{
    fill:none;

    stroke:
        rgba(73,165,221,.27);

    stroke-width:1.15;

    vector-effect:non-scaling-stroke;

    stroke-linecap:round;
    stroke-linejoin:round;

    filter:
        drop-shadow(

            rgba(71,160,218,.12)

/* 第二层极淡轨道 */

.orbit-path-soft{

<script>

/* =========================================================
   塞垭弥大陆档案馆
   三轨相交 + 星辰轨道切换系统

   A → A/B → B → B/C → C → C/A → A
========================================================= */

const svgNS = "http://www.w3.org/2000/svg";

const CX = 280;
const CY = 280;

/*
    三条轨道使用同一组椭圆参数，
    但分别旋转 0° / 60° / 120°。

    因此三条轨道会自然形成多个交叉点。
*/

const RX = 250;
const RY = 95;

const SAMPLE_COUNT = 720;


/* =========================================================
   生成旋转椭圆
========================================================= */

function createEllipsePoints(rotation){

    const points = [];

    const angle = rotation * Math.PI / 180;

    const cosR = Math.cos(angle);
    const sinR = Math.sin(angle);

    for(let i = 0; i <= SAMPLE_COUNT; i++){

        const t =
            (Math.PI * 2 * i) /
            SAMPLE_COUNT;

        const x =
            RX * Math.cos(t);

        const y =
            RY * Math.sin(t);

        const rotatedX =
            x * cosR -
            y * sinR;

        const rotatedY =
            x * sinR +
            y * cosR;

        points.push({

            x: CX + rotatedX,
            y: CY + rotatedY

        });

    }

    return points;
}


/* =========================================================
   点 → SVG path
========================================================= */

function pointsToPath(points){

    let d =
        `M ${points[0].x} ${points[0].y}`;

    for(let i = 1; i < points.length; i++){

        d +=
            ` L ${points[i].x} ${points[i].y}`;

    }

    return d;
}


/* =========================================================
   计算每个点对应的累计长度
========================================================= */

function buildLengthTable(points){

    const lengths = [0];

    let total = 0;

    for(let i = 1; i < points.length; i++){

        const dx =
            points[i].x -
            points[i - 1].x;

        const dy =
            points[i].y -
            points[i - 1].y;

        total += Math.sqrt(
            dx * dx +
            dy * dy
        );

        lengths.push(total);

    }

    return {
        lengths,
        total
    };
}


/* =========================================================
   两线段交点
========================================================= */

function segmentIntersection(
    p1,
    p2,
    q1,
    q2
){

    const rx =
        p2.x - p1.x;

    const ry =
        p2.y - p1.y;

    const sx =
        q2.x - q1.x;

    const sy =
        q2.y - q1.y;


    const denominator =
        rx * sy -
        ry * sx;


    if(Math.abs(denominator) < 0.00001){

        return null;

    }


    const qpx =
        q1.x - p1.x;

    const qpy =
        q1.y - p1.y;


    const t =
        (qpx * sy - qpy * sx) /
        denominator;

    const u =
        (qpx * ry - qpy * rx) /
        denominator;


    if(
        t >= 0 &&
        t <= 1 &&
        u >= 0 &&
        u <= 1
    ){

        return {

            x:
                p1.x + t * rx,

            y:
                p1.y + t * ry,

            t

        };

    }

    return null;
}


/* =========================================================
   找两条轨道所有交点
========================================================= */

function findIntersections(
    pointsA,
    pointsB,
    lengthsA,
    lengthsB
){

    const intersections = [];

    for(
        let i = 0;
        i < pointsA.length - 1;
        i++
    ){

        const a1 = pointsA[i];
        const a2 = pointsA[i + 1];


        for(
            let j = 0;
            j < pointsB.length - 1;
            j++
        ){

            const b1 = pointsB[j];
            const b2 = pointsB[j + 1];


            const hit =
                segmentIntersection(
                    a1,
                    a2,
                    b1,
                    b2
                );


            if(!hit){
                continue;
            }


            const segmentLengthA =
                Math.hypot(
                    a2.x - a1.x,
                    a2.y - a1.y
                );

            const segmentLengthB =
                Math.hypot(
                    b2.x - b1.x,
                    b2.y - b1.y
                );


            const distanceA =
                lengthsA[i] +
                segmentLengthA * hit.t;

            const distanceB =
                lengthsB[j] +
                segmentLengthB * hit.t;


            intersections.push({

                x:hit.x,
                y:hit.y,

                distanceA,
                distanceB

            });

        }

    }


    /*
        去除非常接近的重复交点
    */

    const unique = [];

    for(const item of intersections){

        const duplicate =
            unique.some(existing => {

                return Math.hypot(
                    existing.x - item.x,
                    existing.y - item.y
                ) < 4;

            });


        if(!duplicate){

            unique.push(item);

        }

    }

    return unique;
}


/* =========================================================
   找最接近指定角度的交点
========================================================= */

function chooseIntersection(
    intersections,
    targetAngle
){

    const target =
        targetAngle * Math.PI / 180;


    let best = null;
    let bestDifference = Infinity;


    for(const point of intersections){

        const angle =
            Math.atan2(
                point.y - CY,
                point.x - CX
            );


        let difference =
            Math.abs(angle - target);


        if(difference > Math.PI){

            difference =
                Math.PI * 2 -
                difference;

        }


        if(difference < bestDifference){

            bestDifference = difference;
            best = point;

        }

    }


    return best;
}


/* =========================================================
   建立三条轨道
========================================================= */

const orbitPoints = {

    A:createEllipsePoints(0),

    B:createEllipsePoints(60),

};


const orbitLengths = {

    A:buildLengthTable(

    ),

    B:buildLengthTable(
        orbitPoints.B
    ),

    C:buildLengthTable(
        orbitPoints.C
    )

};


/* =========================================================

document.getElementById("orbitA")

document.getElementById("orbitASoft")

document.getElementById("orbitCSoft")

/* =========================================================
   找到三组交点

   AB：右上附近
   BC：左下附近
   CA：右下附近

   三个点共同组成循环路线
========================================================= */

const intersectionsAB =
    findIntersections(
        orbitPoints.A,
        orbitPoints.B,
        orbitLengths.A.lengths,
        orbitLengths.B.lengths
    );

const intersectionsBC =
    findIntersections(
        orbitPoints.B,
        orbitPoints.C,
        orbitLengths.B.lengths,
        orbitLengths.C.lengths
    );

const intersectionsCA =
    findIntersections(
        orbitPoints.C,
        orbitPoints.A,
        orbitLengths.C.lengths,
        orbitLengths.A.lengths
    );


/*
   选择视觉上分散开的三个交汇点
*/

const crossAB =
    chooseIntersection(
        intersectionsAB,
        -35
    );

const crossBC =
    chooseIntersection(
        intersectionsBC,
        145
    );

const crossCA =
    chooseIntersection(
        intersectionsCA,
        265
    );


/* =========================================================
   显示交汇点
========================================================= */

function setCrossPosition(
    element,
    point
){

    if(!point){
        return;
    }

    element.setAttribute(
        "cx",
        point.x
    );

    element.setAttribute(
        "cy",
        point.y
    );

}


setCrossPosition(
    document.getElementById("crossAB"),
    crossAB
);

setCrossPosition(
    document.getElementById("crossBC"),
    crossBC
);

setCrossPosition(
    document.getElementById("crossCA"),
    crossCA
);


/* =========================================================
   计算轨道上的路径位置
========================================================= */

function getPositionOnPath(
    points,
    lengthTable,
    distance
){

    const total =
        lengthTable.total;


    /*
        让距离永远保持在轨道范围内
    */

    distance =
        ((distance % total) + total) %
        total;


    const lengths =
        lengthTable.lengths;


    let low = 0;
    let high = lengths.length - 1;


    while(low < high){

        const mid =
            Math.floor(
                (low + high) / 2
            );


        if(
            lengths[mid] < distance
        ){

            low = mid + 1;

        }else{

            high = mid;

        }

    }


    const index =
        Math.max(
            1,
            low
        );


    const p1 =
        points[index - 1];

    const p2 =
        points[index];


    const l1 =
        lengths[index - 1];

    const l2 =
        lengths[index];


    const ratio =
        (distance - l1) /
        (l2 - l1 || 1);


    return {

        x:
            p1.x +
            (p2.x - p1.x) * ratio,

        y:
            p1.y +
            (p2.y - p1.y) * ratio

    };

}


/* =========================================================
   找出交点在各轨道上的长度
========================================================= */

function findPathDistance(
    points,
    lengthTable,
    target
){

    let bestDistance = 0;
    let bestDistanceSquared = Infinity;


    for(
        let i = 0;
        i < points.length - 1;
        i++
    ){

        const a = points[i];
        const b = points[i + 1];


        const abx =
            b.x - a.x;

        const aby =
            b.y - a.y;


        const ab2 =
            abx * abx +
            aby * aby;


        let t =
            (
                (target.x - a.x) * abx +
                (target.y - a.y) * aby
            ) /
            (ab2 || 1);


        t =
            Math.max(
                0,
                Math.min(1,t)
            );


        const px =
            a.x + abx * t;

        const py =
            a.y + aby * t;


        const dx =
            target.x - px;

        const dy =
            target.y - py;


        const distanceSquared =
            dx * dx +
            dy * dy;


        if(
            distanceSquared <
            bestDistanceSquared
        ){

            bestDistanceSquared =
                distanceSquared;


            const segmentLength =
                Math.sqrt(ab2);


            bestDistance =
                lengthTable.lengths[i] +
                segmentLength * t;

        }

    }


    return bestDistance;

}


/* =========================================================
   三个交汇点在各轨道上的位置
========================================================= */

const route = {

    AB:{

        A:
            findPathDistance(
                orbitPoints.A,
                orbitLengths.A,
                crossAB
            ),

        B:
            findPathDistance(
                orbitPoints.B,
                orbitLengths.B,
                crossAB
            )

    },

    BC:{

        B:
            findPathDistance(
                orbitPoints.B,
                orbitLengths.B,
                crossBC
            ),

        C:
            findPathDistance(
                orbitPoints.C,
                orbitLengths.C,
                crossBC
            )

    },

    CA:{

        C:
            findPathDistance(
                orbitPoints.C,
                orbitLengths.C,
                crossCA
            ),

        A:
            findPathDistance(
                orbitPoints.A,
                orbitLengths.A,
                crossCA
            )

    }

};


/* =========================================================
   让星星沿着每一条轨道移动

   A：
   CA → AB

   B：
   AB → BC

   C：
   BC → CA
========================================================= */

const star =
    document.getElementById(
        "travellingStar"
    );


const segments = [

    {
        name:"A",

        points:
            orbitPoints.A,

        lengths:
            orbitLengths.A,

        start:
            route.CA.A,

        end:
            route.AB.A
    },

    {
        name:"B",

        points:
            orbitPoints.B,

        lengths:
            orbitLengths.B,

        start:
            route.AB.B,

        end:
            route.BC.B
    },

    {
        name:"C",

        points:
            orbitPoints.C,

        lengths:
            orbitLengths.C,

        start:
            route.BC.C,

        end:
            route.CA.C
    }

];


/* =========================================================
   选择每段较短的运行方向
========================================================= */

for(const segment of segments){

    const total =
        segment.lengths.total;


    const forwardDistance =
        (
            segment.end -
            segment.start +
            total
        ) % total;


    const backwardDistance =
        (
            segment.start -
            segment.end +
            total
        ) % total;


    /*
        默认选择较短方向
    */

    if(
        backwardDistance <
        forwardDistance
    ){

        segment.distance =
            segment.start;

        segment.target =
            segment.end;

        segment.direction = -1;

    }else{

        segment.distance =
            segment.start;

        segment.target =
            segment.end;

        segment.direction = 1;

    }

}


/* =========================================================
   动画参数
========================================================= */

/*
   数字越小，星星越慢。

   这里让它慢慢巡游，
   不会像普通 loading 那样疯狂转。
*/

const STAR_SPEED = 22;


/*
   当前第几条轨道
*/

let currentSegment = 0;


/*
   当前距离
*/

let currentDistance =
    segments[0].distance;


/*
   时间
*/

let previousTime = null;


/* =========================================================
   星星位置
========================================================= */

function updateStarPosition(){

    const segment =
        segments[currentSegment];


    const point =
        getPositionOnPath(
            segment.points,
            segment.lengths,
            currentDistance
        );


    star.setAttribute(
        "x",
        point.x
    );

    star.setAttribute(
        "y",
        point.y
    );

}


/* =========================================================
   轨道动画
========================================================= */

function animateStar(timestamp){

    if(previousTime === null){

        previousTime = timestamp;

    }


    let delta =
        (timestamp - previousTime) /
        1000;


    previousTime = timestamp;


    /*
        防止手机切后台回来后瞬移
    */

    delta =
        Math.min(
            delta,
            .05
        );


    const segment =
        segments[currentSegment];


    currentDistance +=
        STAR_SPEED *
        delta *
        segment.direction;


    const total =
        segment.lengths.total;


    /*
        判断是否抵达当前轨道的出口
    */

    let arrived = false;


    if(segment.direction > 0){

        if(
            currentDistance >=
            segment.target
        ){

            arrived = true;

        }

    }else{

        if(
            currentDistance <=
            segment.target
        ){

            arrived = true;

        }

    }


    if(arrived){

        /*
            精确落在交叉点
        */

        currentDistance =
            segment.target;


        updateStarPosition();


        /*
            A → B
            B → C
            C → A
        */

        currentSegment =
            (currentSegment + 1) %
            segments.length;


        const next =
            segments[currentSegment];


        /*
            下一条轨道从同一个交点开始。

            因为两条轨道在这里真实相交，
            所以视觉上不会跳。
        */

        currentDistance =
            next.start;

    }


    updateStarPosition();


    requestAnimationFrame(
        animateStar
    );

}


/* =========================================================
   初始化
========================================================= */

updateStarPosition();

requestAnimationFrame(
    animateStar
);


/* =========================================================
   小星星轻微闪烁
========================================================= */

let sparkleTime = 0;

function sparkle(){

    sparkleTime += .025;


    const scale =
        1 +
        Math.sin(sparkleTime) *
        .10;


    star.setAttribute(
        "font-size",
        15 * scale
    );


    requestAnimationFrame(
        sparkle
    );

}

sparkle();
