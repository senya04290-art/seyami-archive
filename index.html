<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(21,65,130,.34) 0%,
            rgba(8,36,82,.28) 25%,
            rgba(3,18,48,.72) 55%,
            #020b24 100%
        );

    color:#eaf5ff;

    font-family:
        "Noto Serif SC",
        serif;
}


/* =========================================================
   星空背景
========================================================= */

.space{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#d8ecff;

    box-shadow:
        0 0 5px rgba(150,205,255,.85),
        0 0 12px rgba(75,145,235,.55);

    animation:
        twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.35);
    }
}


/* =========================================================
   大型星芒
========================================================= */

.big-star{
    position:absolute;

    width:8px;
    height:8px;

    background:#dff1ff;

    transform:rotate(45deg);

    box-shadow:
        0 0 8px #79baff,
        0 0 22px rgba(68,137,225,.85);

    opacity:.9;

    animation:
        bigStar 5s ease-in-out infinite;
}

.big-star::before,
.big-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:linear-gradient(
        to bottom,
        transparent,
        #b8dcff,
        transparent
    );
}

.big-star::before{
    width:1px;
    height:34px;
}

.big-star::after{
    width:34px;
    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        #b8dcff,
        transparent
    );
}

@keyframes bigStar{

    0%,
    100%{
        opacity:.35;
        transform:rotate(45deg) scale(.75);
    }

    50%{
        opacity:1;
        transform:rotate(45deg) scale(1);
    }
}


/* =========================================================
   档案馆外框
========================================================= */

.frame{
    position:fixed;
    inset:22px;

    border:1px solid rgba(78,145,225,.32);

    pointer-events:none;

    z-index:20;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    left:32px;
    right:32px;

    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        rgba(75,145,235,.72),
        rgba(140,195,255,.85),
        rgba(75,145,235,.72),
        transparent
    );
}

.frame::before{
    top:12px;
}

.frame::after{
    bottom:12px;
}


/* =========================================================
   四角装饰
========================================================= */

.corner{
    position:absolute;

    width:65px;
    height:65px;
}

.corner::before,
.corner::after{
    content:"";

    position:absolute;

    background:#71aef3;

    box-shadow:
        0 0 7px rgba(73,145,235,.65);
}

.corner::before{
    width:1px;
    height:100%;
}

.corner::after{
    width:100%;
    height:1px;
}

.corner.tl{
    left:-1px;
    top:-1px;
}

.corner.tr{
    right:-1px;
    top:-1px;

    transform:scaleX(-1);
}

.corner.bl{
    left:-1px;
    bottom:-1px;

    transform:scaleY(-1);
}

.corner.br{
    right:-1px;
    bottom:-1px;

    transform:scale(-1);
}


/* =========================================================
   星空魔法阵
========================================================= */

.magic-circle{
    position:absolute;

    width:510px;
    height:510px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        rotate(-8deg);

    opacity:.5;

    filter:
        drop-shadow(
            0 0 14px rgba(45,120,215,.38)
        );

    pointer-events:none;
}


/* 圆环 */

.circle{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:1px solid rgba(91,163,240,.55);

    transform:translate(-50%,-50%);
}

.circle.c1{
    width:490px;
    height:490px;
}

.circle.c2{
    width:420px;
    height:420px;

    border-color:
        rgba(79,145,228,.45);
}

.circle.c3{
    width:330px;
    height:330px;

    border-style:dashed;

    border-color:
        rgba(100,175,248,.52);
}

.circle.c4{
    width:250px;
    height:250px;

    border-color:
        rgba(80,147,231,.46);
}

.circle.c5{
    width:180px;
    height:180px;

    border-style:dashed;

    border-color:
        rgba(111,182,255,.52);
}


/* =========================================================
   真正的多层星轨
========================================================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(83,153,235,.56);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotate(0deg);
}

.orbit.o1{
    width:450px;
    height:180px;

    animation:
        orbitOne 28s linear infinite;
}

.orbit.o2{
    width:390px;
    height:140px;

    border-color:
        rgba(102,173,246,.55);

    transform:
        translate(-50%,-50%)
        rotate(58deg);

    animation:
        orbitTwo 22s linear infinite;
}

.orbit.o3{
    width:310px;
    height:110px;

    border-color:
        rgba(73,140,226,.62);

    transform:
        translate(-50%,-50%)
        rotate(-45deg);

    animation:
        orbitThree 18s linear infinite;
}

@keyframes orbitOne{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes orbitTwo{

    from{
        transform:
            translate(-50%,-50%)
            rotate(58deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-302deg);
    }
}

@keyframes orbitThree{

    from{
        transform:
            translate(-50%,-50%)
            rotate(-45deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(315deg);
    }
}


/* =========================================================
   魔法阵十字
========================================================= */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(96,167,242,.7),
            transparent
        );
}

.magic-line.horizontal{
    width:490px;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:490px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(96,167,242,.7),
            transparent
        );
}


/* =========================================================
   六芒星
========================================================= */

.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:182px;

    border:1px solid rgba(99,174,248,.45);

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    clip-path:polygon(
        50% 0%,
        100% 25%,
        100% 75%,
        50% 100%,
        0% 75%,
        0% 25%
    );
}

.magic-circle::after{
    transform:
        translate(-50%,-50%)
        rotate(90deg);

    opacity:.65;
}


/* =========================================================
   Header
========================================================= */

header{
    position:relative;

    z-index:10;

    width:min(1200px, calc(100% - 100px));

    margin:0 auto;

    padding-top:48px;

    display:flex;

    align-items:center;
    justify-content:space-between;
}


/* 左侧 LOGO */

.logo{
    display:flex;

    align-items:center;

    gap:14px;

    text-decoration:none;

    color:#c9e4ff;
}

.logo-symbol{
    width:34px;
    height:34px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid rgba(104,171,244,.65);

    border-radius:50%;

    color:#78b8ff;

    font-size:18px;

    box-shadow:
        0 0 12px rgba(58,130,220,.25);
}

.logo-text{
    font-family:"Cinzel",serif;

    font-size:14px;

    letter-spacing:.22em;

    color:#b9d8fa;

    line-height:1.4;
}

.logo-text span{
    display:block;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:10px;

    letter-spacing:.25em;

    color:#769bc7;
}


/* 导航 */

nav{
    display:flex;

    align-items:center;

    gap:34px;
}

nav a{
    position:relative;

    color:#a9c1df;

    text-decoration:none;

    font-size:13px;

    letter-spacing:.14em;

    transition:.35s ease;
}

nav a:hover{
    color:#edf7ff;
}

nav a.active{
    color:#e9f5ff;
}

nav a.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-9px;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#83c1ff;

    box-shadow:
        0 0 8px #5aa8ff;

    transform:translateX(-50%);
}


/* =========================================================
   Header 中央星星
========================================================= */

.header-star{
    position:absolute;

    left:50%;
    top:63px;

    transform:translateX(-50%);

    color:#b9ddff;

    font-size:15px;

    text-shadow:
        0 0 10px #5ba8ff,
        0 0 20px rgba(62,133,222,.75);

    animation:
        headerStar 4s ease-in-out infinite;
}

@keyframes headerStar{

    0%,
    100%{
        opacity:.55;
    }

    50%{
        opacity:1;
    }
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    z-index:5;

    min-height:calc(100vh - 110px);

    display:flex;

    justify-content:center;

    align-items:flex-start;
}

.hero-content{

    width:min(1200px, calc(100% - 70px));

    margin-top:45px;

    text-align:center;
}


/* 标题 */

.title{
    position:relative;

    display:block;

    width:100%;

    font-family:"Cinzel",serif;

    font-size:clamp(
        58px,
        7.8vw,
        118px
    );

    font-weight:400;

    letter-spacing:.055em;

    line-height:1;

    white-space:nowrap;

    color:#eef7ff;

    text-shadow:
        0 0 5px rgba(215,237,255,.7),
        0 0 18px rgba(84,158,239,.55),
        0 0 42px rgba(42,106,195,.35);
}


/* 标题两侧细线 */

.title::before,
.title::after{
    content:"";

    position:absolute;

    top:50%;

    width:120px;
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(91,162,238,.72)
        );
}

.title::before{
    right:100%;

    margin-right:30px;
}

.title::after{
    left:100%;

    margin-left:30px;

    transform:scaleX(-1);
}


/* =========================================================
   副标题
========================================================= */

.subtitle{
    margin-top:24px;

    font-size:19px;

    letter-spacing:.55em;

    text-indent:.55em;

    color:#dcecff;

    text-shadow:
        0 0 15px rgba(77,150,230,.35);
}


/* 副标题装饰 */

.subtitle-decoration{
    width:min(620px, 72vw);

    margin:17px auto 0;

    display:flex;

    align-items:center;

    gap:16px;
}

.subtitle-decoration::before,
.subtitle-decoration::after{
    content:"";

    flex:1;

    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(77,145,229,.7)
        );
}

.subtitle-decoration::after{
    transform:scaleX(-1);
}

.subtitle-decoration span{
    width:6px;
    height:6px;

    background:#9bd1ff;

    transform:rotate(45deg);

    box-shadow:
        0 0 8px #61afff;
}


/* =========================================================
   中央小星
========================================================= */

.center-star{
    margin-top:17px;

    color:#a9d6ff;

    font-size:16px;

    letter-spacing:.5em;

    text-shadow:
        0 0 10px #5ba8ff,
        0 0 22px rgba(67,140,225,.7);
}


/* =========================================================
   介绍文字
========================================================= */

.description{

    width:min(760px, 82vw);

    margin:24px auto 0;

    color:#a9c5e8;

    font-size:13px;

    line-height:2.1;

    letter-spacing:.12em;

    text-shadow:
        0 0 8px rgba(55,120,210,.18);
}


/* =========================================================
   进入按钮
========================================================= */

.enter-wrap{
    margin-top:38px;

    display:flex;

    justify-content:center;

    position:relative;
}

.enter-button{

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    width:245px;
    height:58px;

    border:1px solid rgba(101,173,246,.72);

    background:
        linear-gradient(
            135deg,
            rgba(10,42,89,.82),
            rgba(4,20,50,.88)
        );

    color:#e7f4ff;

    text-decoration:none;

    font-size:13px;

    letter-spacing:.35em;

    text-indent:.35em;

    transition:.4s ease;

    box-shadow:
        0 0 18px rgba(54,125,218,.16),
        inset 0 0 20px rgba(42,102,184,.1);
}

.enter-button:hover{

    border-color:#9bd1ff;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(15,55,111,.9),
            rgba(5,25,60,.95)
        );

    box-shadow:
        0 0 25px rgba(69,145,231,.3),
        inset 0 0 24px rgba(65,135,225,.14);

    transform:translateY(-2px);
}


/* 按钮四角 */

.enter-button::before,
.enter-button::after{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    border:1px solid #8bc7ff;
}

.enter-button::before{
    left:-5px;
    top:-5px;

    border-right:none;
    border-bottom:none;
}

.enter-button::after{
    right:-5px;
    bottom:-5px;

    border-left:none;
    border-top:none;
}


/* 按钮星星 */

.button-star{
    position:absolute;

    color:#b8dcff;

    font-size:10px;

    text-shadow:
        0 0 8px #5ba8ff;
}

.button-star.left{
    left:-24px;
    top:50%;

    transform:translateY(-50%);
}

.button-star.right{
    right:-24px;
    top:50%;

    transform:translateY(-50%);
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:900px){

    header{
        width:calc(100% - 60px);

        padding-top:38px;
    }

    nav{
        gap:20px;
    }

    nav a{
        font-size:11px;
    }

    .hero-content{
        margin-top:60px;
    }

    .title{
        font-size:clamp(
            48px,
            9vw,
            80px
        );
    }

    .title::before,
    .title::after{
        width:70px;
    }

    .magic-circle{
        transform:
            translate(-50%,-50%)
            scale(.82)
            rotate(-8deg);
    }

}


/* =========================================================
   手机
========================================================= */

@media(max-width:600px){

    .frame{
        inset:12px;
    }

    .frame::before,
    .frame::after{
        left:18px;
        right:18px;
    }

    header{
        width:calc(100% - 45px);

        padding-top:30px;
    }

    .logo-text{
        font-size:11px;
    }

    .logo-text span{
        font-size:8px;
    }

    nav{
        gap:13px;
    }

    nav a{
        font-size:9px;

        letter-spacing:.08em;
    }

    .header-star{
        top:42px;
    }


    .hero-content{

        width:calc(100% - 40px);

        margin-top:70px;
    }


    /* 手机标题强制两行 */

    .title{

        width:100%;

        white-space:normal;

        font-size:
            clamp(
                42px,
                14vw,
                64px
            );

        line-height:1.05;

        letter-spacing:.08em;

        padding:0 20px;
    }

    .title::before,
    .title::after{
        display:none;
    }


    .subtitle{

        margin-top:25px;

        font-size:15px;

        letter-spacing:.35em;

        text-indent:.35em;
    }

    .subtitle-decoration{
        width:88%;

        gap:10px;
    }

    .description{

        width:90%;

        font-size:11px;

        line-height:2;

        letter-spacing:.08em;
    }

    .enter-button{
        width:210px;
        height:54px;

        font-size:11px;
    }

    .magic-circle{

        width:440px;
        height:440px;

        transform:
            translate(-50%,-50%)
            scale(.65)
            rotate(-8deg);
    }

    .circle.c1{
        width:490px;
        height:490px;
    }

    .circle.c2{
        width:420px;
        height:420px;
    }

    .circle.c3{
        width:330px;
        height:330px;
    }

    .circle.c4{
        width:250px;
        height:250px;
    }

    .circle.c5{
        width:180px;
        height:180px;
    }

}


/* =========================================================
   超小屏
========================================================= */

@media(max-width:380px){

    nav{
        gap:9px;
    }

    nav a{
        font-size:8px;
    }

    .hero-content{
        margin-top:58px;
    }

    .title{
        font-size:39px;
    }

    .subtitle{
        font-size:13px;
    }

}


/* =========================================================
   防止手机横向溢出
========================================================= */

@media(max-width:600px){

    .title{
        overflow-wrap:break-word;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     星空
======================================================= -->

<div class="space" id="space"></div>


<!-- =======================================================
     外框
======================================================= -->

<div class="frame">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

</div>


<!-- =======================================================
     魔法阵
======================================================= -->

<div class="magic-circle">

    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
    <div class="circle c5"></div>

    <!-- 真正的多层星轨 -->

    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>

    <!-- 十字魔法线 -->

    <div class="magic-line horizontal"></div>
    <div class="magic-line vertical"></div>

</div>


<!-- =======================================================
     Header
======================================================= -->

<header>

    <a href="index.html" class="logo">

        <div class="logo-symbol">
            ✦
        </div>

        <div class="logo-text">

            塞垭弥大陆档案馆

            <span>
                SEYAMI ARCHIVE
            </span>

        </div>

    </a>


    <div class="header-star">
        ✦
    </div>


    <nav>

        <a href="index.html" class="active">
            首页
        </a>

        <a href="archive.html">
            档案目录
        </a>

        <a href="about.html">
            关于
        </a>

    </nav>

</header>


<!-- =======================================================
     Hero
======================================================= -->

<main class="hero">

    <div class="hero-content">


        <!-- 标题 -->

        <h1 class="title">
            SEYAMI ARCHIVE
        </h1>


        <!-- 中文标题 -->

        <div class="subtitle">
            塞垭弥大陆档案馆
        </div>


        <!-- 标题装饰 -->

        <div class="subtitle-decoration">
            <span></span>
        </div>


        <!-- 中央星 -->

        <div class="center-star">
            ✡　✶　✡
        </div>


        <!-- 介绍 -->

        <p class="description">

            记录塞垭弥大陆上的人物、种族、传说与未曾被遗忘的故事。
            <br>

            这里收藏着属于这个世界的每一份档案。

        </p>


        <!-- 进入档案馆 -->

        <div class="enter-wrap">

            <span class="button-star left">
                ✦
            </span>

            <a
                href="archive.html"
                class="enter-button"
            >
                进入档案馆
            </a>

            <span class="button-star right">
                ✦
            </span>

        </div>


    </div>

</main>


<script>

/* =========================================================
   动态生成星空
========================================================= */

const space =
    document.getElementById("space");


/* 普通星星 */

for(let i = 0; i < 95; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const size =
        Math.random() * 2 + .5;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    star.style.animationDuration =
        3 + Math.random() * 5 + "s";

    space.appendChild(star);

}


/* =========================================================
   大型星芒
========================================================= */

const bigStarPositions = [

    [12,18],
    [83,15],
    [91,47],
    [8,70],
    [76,82],
    [24,87],
    [52,10],
    [44,78]

];

bigStarPositions.forEach(
    (position,index)=>{

        const star =
            document.createElement("div");

        star.className =
            "big-star";

        star.style.left =
            position[0] + "%";

        star.style.top =
            position[1] + "%";

        star.style.animationDelay =
            (index * .7) + "s";

        space.appendChild(star);

    }
);


/* =========================================================
   微小星尘
========================================================= */

for(let i = 0; i < 18; i++){

    const dust =
        document.createElement("div");

    dust.style.position =
        "absolute";

    dust.style.left =
        Math.random() * 100 + "%";

    dust.style.top =
        Math.random() * 100 + "%";

    dust.style.width =
        "1px";

    dust.style.height =
        "1px";

    dust.style.borderRadius =
        "50%";

    dust.style.background =
        "rgba(150,205,255,.75)";

    dust.style.boxShadow =
        "0 0 6px rgba(80,150,230,.7)";

    dust.style.opacity =
        .2 + Math.random() * .6;

    dust.style.animation =
        "twinkle " +
        (4 + Math.random() * 6) +
        "s ease-in-out infinite";

    dust.style.animationDelay =
        Math.random() * 6 + "s";

    space.appendChild(dust);

}

</script>
