<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · SEYAMI ARCHIVE</title>

<!-- 西幻高对比衬线字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background: #020914;

    color: #e9f6ff;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        sans-serif;
}


/* =========================================================
   页面
========================================================= */

.page {
    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 650px;

    overflow: hidden;

    background:

        radial-gradient(
            ellipse at 50% 45%,
            rgba(18, 66, 120, .38) 0%,
            rgba(7, 31, 68, .32) 28%,
            rgba(2, 12, 30, .88) 66%,
            #010711 100%
        );
}


/* =========================================================
   星空背景
========================================================= */

.stars {
    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .9;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(115,194,255,.75) 0 1px,
            transparent 1.7px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.55) 0 .8px,
            transparent 1.5px
        );

    background-size:
        210px 210px,
        330px 330px,
        470px 470px;

    background-position:
        30px 20px,
        80px 120px,
        160px 50px;

    animation:
        starField 40s linear infinite;
}

@keyframes starField {

    0% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(-15px,10px,0);
    }

    100% {
        transform:
            translate3d(0,0,0);
    }
}


/* =========================================================
   远处星云
========================================================= */

.nebula {
    position: absolute;

    left: 50%;
    top: 47%;

    width: 900px;
    height: 700px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(28, 101, 170, .12),
            rgba(8, 48, 93, .06) 40%,
            transparent 72%
        );

    filter: blur(25px);

    pointer-events: none;
}


/* =========================================================
   漂浮星象
========================================================= */

.floating-stars {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;
}

.floating-star {
    position: absolute;

    color:
        rgba(180,225,255,.9);

    text-shadow:

        0 0 5px
        rgba(160,225,255,.95),

        0 0 14px
        rgba(65,170,255,.75),

        0 0 28px
        rgba(35,125,230,.45);

    animation:

        floatingStar
        8s
        ease-in-out
        infinite,

        twinkleStar
        4s
        ease-in-out
        infinite;
}


/* 普通星星 */

.star-1 {
    left: 8%;
    top: 27%;
    font-size: 12px;
}

.star-2 {
    left: 14%;
    top: 55%;
    font-size: 16px;
    animation-delay: 2s, .5s;
}

.star-3 {
    left: 22%;
    top: 21%;
    font-size: 8px;
    animation-delay: 1s, 1.8s;
}

.star-4 {
    left: 29%;
    top: 70%;
    font-size: 12px;
    animation-delay: 3s, .2s;
}

.star-5 {
    left: 40%;
    top: 18%;
    font-size: 9px;
    animation-delay: 1.5s, 2s;
}

.star-6 {
    left: 57%;
    top: 15%;
    font-size: 10px;
    animation-delay: 2.5s, 1s;
}

.star-7 {
    left: 68%;
    top: 24%;
    font-size: 14px;
    animation-delay: 1.3s, 2.5s;
}

.star-8 {
    left: 78%;
    top: 47%;
    font-size: 9px;
    animation-delay: 3.2s, 1.5s;
}

.star-9 {
    left: 87%;
    top: 30%;
    font-size: 13px;
    animation-delay: 1.8s, .7s;
}

.star-10 {
    left: 83%;
    top: 70%;
    font-size: 8px;
    animation-delay: 4s, 2.2s;
}

.star-11 {
    left: 69%;
    top: 77%;
    font-size: 12px;
    animation-delay: 2.2s, .4s;
}

.star-12 {
    left: 46%;
    top: 79%;
    font-size: 8px;
    animation-delay: 3.8s, 1.2s;
}


/* 星象符号 */

.star-13 {
    left: 17%;
    top: 40%;

    font-size: 17px;

    animation-delay:
        1s,
        2s;
}

.star-14 {
    left: 35%;
    top: 31%;

    font-size: 13px;

    animation-delay:
        2.5s,
        .5s;
}

.star-15 {
    left: 74%;
    top: 37%;

    font-size: 18px;

    animation-delay:
        1.7s,
        1.3s;
}

.star-16 {
    left: 90%;
    top: 55%;

    font-size: 14px;

    animation-delay:
        3.4s,
        2.4s;
}

@keyframes floatingStar {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    50% {
        transform:
            translate3d(0,-14px,0)
            rotate(8deg);
    }
}

@keyframes twinkleStar {

    0%,
    100% {
        opacity: .28;
        filter: blur(.2px);
    }

    50% {
        opacity: 1;

        filter:
            drop-shadow(
                0 0 8px
                rgba(130,215,255,.95)
            );
    }
}


/* =========================================================
   外层框架
========================================================= */

.frame {
    position: absolute;

    inset: 38px;

    border:
        1px solid
        rgba(75,166,239,.45);

    z-index: 20;

    pointer-events: none;

    box-shadow:
        0 0 18px
        rgba(38,130,220,.06);
}


/* =========================================================
   顶部横线
========================================================= */

.top-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 85px;

    height: 1px;

    background:
        linear-gradient(
            to right,

            transparent 0%,

            rgba(55,151,231,.8) 4%,

            rgba(67,170,245,.65) 30%,

            rgba(140,213,255,.85) 50%,

            rgba(67,170,245,.65) 70%,

            rgba(55,151,231,.8) 96%,

            transparent 100%
        );

    box-shadow:
        0 0 8px
        rgba(56,160,240,.55);

    z-index: 21;
}


/* =========================================================
   顶部中央星徽
========================================================= */

.top-emblem {
    position: absolute;

    left: 50%;
    top: 85px;

    transform:
        translate(-50%, -50%);

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #eaf8ff;

    font-size: 32px;

    line-height: 1;

    text-shadow:

        0 0 8px
        rgba(170,235,255,.95),

        0 0 25px
        rgba(50,155,245,.8);

    z-index: 25;

    animation:
        emblemGlow 3s ease-in-out infinite;
}

@keyframes emblemGlow {

    0%,
    100% {
        opacity: .72;
        transform:
            translate(-50%, -50%)
            scale(.96);
    }

    50% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}


/* =========================================================
   四角装饰
========================================================= */

.corner {
    position: absolute;

    width: 55px;
    height: 55px;

    z-index: 22;

    pointer-events: none;
}


/* 左上 */

.corner-tl {
    left: 0;
    top: 0;

    border-left:
        1px solid rgba(77,175,244,.75);

    border-top:
        1px solid rgba(77,175,244,.75);

    transform:
        rotate(45deg)
        scale(.72);
}


/* 右上 */

.corner-tr {
    right: 0;
    top: 0;

    border-right:
        1px solid rgba(77,175,244,.75);

    border-top:
        1px solid rgba(77,175,244,.75);

    transform:
        rotate(-45deg)
        scale(.72);
}


/* 左下 */

.corner-bl {
    left: 0;
    bottom: 0;

    border-left:
        1px solid rgba(77,175,244,.75);

    border-bottom:
        1px solid rgba(77,175,244,.75);

    transform:
        rotate(-45deg)
        scale(.72);
}


/* 右下 */

.corner-br {
    right: 0;
    bottom: 0;

    border-right:
        1px solid rgba(77,175,244,.75);

    border-bottom:
        1px solid rgba(77,175,244,.75);

    transform:
        rotate(45deg)
        scale(.72);
}


/* =========================================================
   左上 Logo
========================================================= */

.logo {
    position: absolute;

    left: 80px;
    top: 18px;

    display: flex;

    align-items: center;

    gap: 18px;

    z-index: 40;
}


/* Logo 星徽 */

.logo-symbol {
    position: relative;

    width: 68px;
    height: 68px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #edfaff;

    font-size: 42px;

    text-shadow:

        0 0 7px
        rgba(205,240,255,.95),

        0 0 20px
        rgba(58,164,244,.85);
}

.logo-symbol::before,
.logo-symbol::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,180,248,.55);

    transform:
        translate(-50%, -50%);
}

.logo-symbol::after {
    width: 48px;
    height: 48px;

    border:
        1px solid
        rgba(90,180,248,.35);

    transform:
        translate(-50%, -50%)
        rotate(45deg);
}


/* Logo 文字 */

.logo-text {
    display: flex;

    flex-direction: column;

    gap: 3px;
}

.logo-cn {
    color:
        rgba(231,247,255,.95);

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 21px;

    font-weight: 300;

    letter-spacing: 7px;

    text-shadow:
        0 0 12px
        rgba(110,200,255,.25);
}

.logo-en {
    color:
        rgba(178,221,247,.72);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 12px;

    font-weight: 400;

    letter-spacing: 6px;
}


/* =========================================================
   导航
========================================================= */

.nav {
    position: absolute;

    right: 80px;
    top: 32px;

    display: flex;

    gap: 65px;

    z-index: 40;
}

.nav a {
    position: relative;

    color:
        rgba(194,226,247,.72);

    text-decoration: none;

    font-family:
        "Cormorant Garamond",
        "Microsoft YaHei",
        serif;

    font-size: 15px;

    letter-spacing: 4px;

    transition:
        color .35s ease,
        text-shadow .35s ease;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -16px;

    width: 0;
    height: 2px;

    transform:
        translateX(-50%);

    background:
        #d9f5ff;

    box-shadow:
        0 0 8px
        rgba(100,205,255,.9);

    transition:
        width .35s ease;
}

.nav a:hover,
.nav a.active {
    color:
        #f2fbff;

    text-shadow:
        0 0 12px
        rgba(100,200,255,.55);
}

.nav a:hover::after,
.nav a.active::after {
    width: 70px;
}


/* =========================================================
   中央魔法阵
========================================================= */

.magic-circle {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 570px;
    height: 570px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(71,158,232,.28);

    z-index: 2;

    pointer-events: none;

    box-shadow:
        0 0 25px
        rgba(44,145,225,.08);
}


/* 内圈 */

.magic-circle::before {
    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(84,180,246,.25);

    box-shadow:
        inset 0 0 20px
        rgba(61,150,225,.05);
}


/* 虚线圈 */

.magic-circle::after {
    content: "";

    position: absolute;

    inset: 92px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(83,174,239,.24);

    animation:
        magicRotate
        55s
        linear
        infinite;
}

@keyframes magicRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   魔法阵十字线
========================================================= */

.magic-horizontal {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 660px;

    height: 1px;

    transform:
        translate(-50%, -50%);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(77,172,240,.55),
            transparent
        );

    z-index: 3;

    pointer-events: none;
}

.magic-vertical {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 1px;

    height: 510px;

    transform:
        translate(-50%, -50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(77,172,240,.45),
            transparent
        );

    z-index: 3;

    pointer-events: none;
}


/* =========================================================
   中央巨大星星
========================================================= */

.center-star {
    position: absolute;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    color: #edfaff;

    font-size: 64px;

    z-index: 5;

    text-shadow:

        0 0 8px
        rgba(235,250,255,1),

        0 0 20px
        rgba(120,210,255,.95),

        0 0 45px
        rgba(45,145,245,.65);

    animation:
        centerStarPulse
        4s
        ease-in-out
        infinite;
}

@keyframes centerStarPulse {

    0%,
    100% {
        opacity: .7;
        transform:
            translate(-50%, -50%)
            scale(.95);
    }

    50% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.06);
    }
}


/* =========================================================
   Hero
========================================================= */

.hero {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 1000px;
    max-width: 90vw;

    transform:
        translate(-50%, -50%);

    text-align: center;

    z-index: 10;
}


/* =========================================================
   英文标题
========================================================= */

.title-en {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 0;

    color:
        #f1f8ff;

    font-family:
        "Cormorant Garamond",
        "Didot",
        "Bodoni 72",
        "Baskerville",
        "Times New Roman",
        serif;

    font-weight: 300;

    font-size:
        clamp(74px, 7.8vw, 132px);

    line-height: .82;

    letter-spacing:
        1px;

    white-space: nowrap;

    text-shadow:

        0 0 5px
        rgba(245,252,255,.95),

        0 0 15px
        rgba(117,208,255,.65),

        0 0 35px
        rgba(40,140,240,.32);

    -webkit-font-smoothing:
        antialiased;

    transform:
        scaleX(.95);
}


/* =========================================================
   标题上下装饰线
========================================================= */

.title-decoration {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;

    width: 850px;
    max-width: 85vw;

    margin:
        25px auto 0;
}

.title-decoration::before,
.title-decoration::after {
    content: "";

    height: 1px;

    flex: 1;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(94,184,245,.8)
        );

    box-shadow:
        0 0 7px
        rgba(80,170,245,.4);
}

.title-decoration::after {
    background:
        linear-gradient(
            to left,
            transparent,
            rgba(94,184,245,.8)
        );
}

.title-decoration span {
    color:
        #bfeaff;

    font-size: 17px;

    text-shadow:
        0 0 10px
        rgba(105,205,255,.9);
}


/* =========================================================
   中文标题
========================================================= */

.title-cn {
    margin-top: 5px;

    color:
        rgba(229,246,255,.94);

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:
        clamp(19px, 1.7vw, 28px);

    font-weight: 300;

    letter-spacing:
        12px;

    padding-left: 12px;

    text-shadow:
        0 0 12px
        rgba(105,200,255,.4);
}


/* =========================================================
   中文标题下面装饰线
========================================================= */

.title-decoration-bottom {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;

    width: 560px;
    max-width: 65vw;

    margin:
        14px auto 0;
}

.title-decoration-bottom::before,
.title-decoration-bottom::after {
    content: "";

    height: 1px;

    flex: 1;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(83,174,239,.7)
        );
}

.title-decoration-bottom::after {
    background:
        linear-gradient(
            to left,
            transparent,
            rgba(83,174,239,.7)
        );
}

.title-decoration-bottom span {
    color:
        #aee3ff;

    font-size: 17px;

    text-shadow:
        0 0 10px
        rgba(95,200,255,.9);
}


/* =========================================================
   简介
========================================================= */

.description {
    margin-top: 45px;

    color:
        rgba(193,224,244,.75);

    font-size: 13px;

    font-weight: 300;

    line-height: 2.25;

    letter-spacing: 3px;

    text-shadow:
        0 0 8px
        rgba(73,166,230,.22);
}


/* =========================================================
   进入按钮
========================================================= */

.enter-button {
    position: relative;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    width: 310px;
    height: 66px;

    margin-top: 35px;

    color:
        rgba(233,248,255,.95);

    text-decoration: none;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 15px;

    font-weight: 300;

    letter-spacing: 7px;

    background:
        rgba(13,55,104,.16);

    border:
        1px solid
        rgba(92,188,247,.75);

    clip-path:
        polygon(
            9% 0%,
            91% 0%,
            100% 50%,
            91% 100%,
            9% 100%,
            0% 50%
        );

    box-shadow:
        0 0 15px
        rgba(45,155,240,.12),

        inset 0 0 18px
        rgba(45,145,230,.08);

    transition:
        transform .35s ease,
        background .35s ease,
        box-shadow .35s ease,
        color .35s ease;
}

.enter-button::before {
    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid
        rgba(91,190,248,.55);

    clip-path:
        polygon(
            9% 0%,
            91% 0%,
            100% 50%,
            91% 100%,
            9% 100%,
            0% 50%
        );

    pointer-events: none;
}

.enter-button::after {
    content: "✦";

    position: absolute;

    left: 50%;
    top: -10px;

    transform:
        translateX(-50%);

    color:
        #e8faff;

    font-size: 16px;

    text-shadow:
        0 0 10px
        rgba(115,215,255,.95);
}

.enter-button:hover {
    color: #ffffff;

    background:
        rgba(31,100,165,.25);

    box-shadow:
        0 0 25px
        rgba(45,170,255,.3),

        inset 0 0 25px
        rgba(50,170,245,.1);

    transform:
        translateY(-3px);
}


/* =========================================================
   按钮箭头
========================================================= */

.enter-arrow {
    margin-left: 16px;

    font-size: 18px;

    transition:
        transform .3s ease;
}

.enter-button:hover .enter-arrow {
    transform:
        translateX(7px);
}


/* =========================================================
   底部文字
========================================================= */

.footer {
    position: absolute;

    left: 50%;
    bottom: 26px;

    transform:
        translateX(-50%);

    color:
        rgba(100,173,221,.35);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 10px;

    letter-spacing: 5px;

    white-space: nowrap;

    z-index: 30;
}


/* =========================================================
   移动端
========================================================= */

@media (max-width: 700px) {

    .page {
        min-height: 600px;
    }

    .frame {
        inset: 18px;
    }

    .top-line {
        top: 74px;
    }

    .logo {
        left: 35px;
        top: 20px;

        gap: 9px;
    }

    .logo-symbol {
        width: 42px;
        height: 42px;

        font-size: 28px;
    }

    .logo-symbol::before {
        width: 40px;
        height: 40px;
    }

    .logo-symbol::after {
        width: 31px;
        height: 31px;
    }

    .logo-cn {
        font-size: 11px;
        letter-spacing: 3px;
    }

    .logo-en {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .nav {
        right: 35px;
        top: 27px;

        gap: 15px;
    }

    .nav a {
        font-size: 10px;
        letter-spacing: 1px;
    }

    .nav a:nth-child(3) {
        display: none;
    }

    .magic-circle {
