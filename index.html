<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seyami Archive · 星轨测试</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at center,
            #0b2140 0%,
            #07182e 42%,
            #040d1c 100%
        );

    color: #dcecff;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   页面
========================= */

.scene {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================
   背景星点
========================= */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    color: rgba(190, 220, 255, 0.5);
    font-size: 9px;
    animation: twinkle 4s ease-in-out infinite;
}

.star:nth-child(1) {
    left: 12%;
    top: 19%;
    animation-delay: 0s;
}

.star:nth-child(2) {
    left: 82%;
    top: 15%;
    animation-delay: 1.2s;
}

.star:nth-child(3) {
    left: 73%;
    top: 76%;
    animation-delay: 2s;
}

.star:nth-child(4) {
    left: 17%;
    top: 72%;
    animation-delay: 2.8s;
}

.star:nth-child(5) {
    left: 51%;
    top: 12%;
    animation-delay: 1.8s;
}

.star:nth-child(6) {
    left: 91%;
    top: 54%;
    animation-delay: 0.8s;
}

@keyframes twinkle {
    0%,100% {
        opacity: .25;
        transform: scale(.8);
    }

    50% {
        opacity: .9;
        transform: scale(1.25);
    }
}

/* =========================
   魔法阵
========================= */

.magic-system {
    width: min(78vw, 560px);
    height: min(78vw, 560px);
    position: relative;
}

/* 中心光晕 */

.magic-system::before {
    content: "";
    position: absolute;
    inset: 25%;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(75, 145, 220, .10),
            transparent 68%
        );

    filter: blur(15px);
}

/* =========================
   三层星轨
========================= */

.orbit {
    position: absolute;
    left: 50%;
    top: 50%;

    border: 1px solid rgba(125, 178, 230, .38);
    border-radius: 50%;

    transform: translate(-50%, -50%);
}

/* 外圈 */

.orbit.outer {
    width: 100%;
    height: 100%;

    animation: orbitRotateOuter 38s linear infinite;
}

/* 中圈 */

.orbit.middle {
    width: 76%;
    height: 76%;

    animation: orbitRotateMiddle 31s linear infinite reverse;
}

/* 内圈 */

.orbit.inner {
    width: 53%;
    height: 53%;

    animation: orbitRotateInner 23s linear infinite;
}

/* =========================
   星轨上的装饰线
========================= */

.orbit.outer::before,
.orbit.outer::after,
.orbit.middle::before,
.orbit.middle::after,
.orbit.inner::before,
.orbit.inner::after {
    content: "";
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    border: 1px solid rgba(115, 170, 225, .16);
}

.orbit.outer::after {
    inset: 15%;
    border-style: dashed;
    opacity: .45;
}

.orbit.middle::before {
    inset: 8%;
    border-style: dashed;
    opacity: .35;
}

.orbit.middle::after {
    inset: 18%;
    border-color: rgba(115, 170, 225, .12);
}

.orbit.inner::before {
    inset: 12%;
    border-style: dashed;
    opacity: .4;
}

.orbit.inner::after {
    inset: 25%;
    border-color: rgba(115, 170, 225, .12);
}

/* =========================
   四个方向的小刻度
========================= */

.orbit .mark {
    position: absolute;
    width: 7px;
    height: 7px;

    border: 1px solid rgba(165, 205, 245, .65);

    transform: rotate(45deg);
}

.orbit .top {
    top: -4px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
}

.orbit .bottom {
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
}

.orbit .left {
    left: -4px;
    top: 50%;
    transform: translateY(-50%) rotate(45deg);
}

.orbit .right {
    right: -4px;
    top: 50%;
    transform: translateY(-50%) rotate(45deg);
}

/* =========================
   中央魔法阵
========================= */

.core {
    position: absolute;
    width: 25%;
    height: 25%;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid rgba(130, 185, 235, .42);

    box-shadow:
        0 0 30px rgba(60, 130, 210, .08),
        inset 0 0 25px rgba(70, 140, 210, .08);
}

.core::before {
    content: "✶";

    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 25px;

    color: rgba(170, 215, 255, .55);
}

/* =========================
   唯一的一颗星星
========================= */

.travel-star {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 28px;
    height: 28px;

    margin-left: -14px;
    margin-top: -14px;

    z-index: 20;

    pointer-events: none;
}

/*
   这个容器负责：
   外轨 → 中轨 → 内轨
*/

.star-path {
    position: absolute;

    width: 0;
    height: 0;

    left: 50%;
    top: 50%;

    animation:
        starTravel 92s linear infinite;
}

/* 星星本体 */

.star-symbol {
    position: absolute;

    left: 0;
    top: 0;

    transform: translate(-50%, -50%);

    font-size: 25px;

    color: #dff2ff;

    text-shadow:
        0 0 5px rgba(180, 225, 255, .8),
        0 0 13px rgba(110, 180, 245, .65),
        0 0 28px rgba(80, 150, 230, .4);

    animation:
        starPulse 2.8s ease-in-out infinite;
}

/* =========================
   星星移动轨迹
========================= */

/*
   通过三个阶段改变半径：

   0%   外圈
   33%  中圈
   66%  内圈
   100% 回到外圈

   同时持续旋转。
*/

@keyframes starTravel {

    0% {
        transform:
            rotate(0deg)
            translateX(
                min(39vw, 195px)
            );
    }

    30% {
        transform:
            rotate(108deg)
            translateX(
                min(39vw, 195px)
            );
    }

    36% {
        transform:
            rotate(130deg)
            translateX(
                min(29.5vw, 148px)
            );
    }

    63% {
        transform:
            rotate(227deg)
            translateX(
                min(29.5vw, 148px)
            );
    }

    69% {
        transform:
            rotate(248deg)
            translateX(
                min(20.5vw, 103px)
            );
    }

    94% {
        transform:
            rotate(338deg)
            translateX(
                min(20.5vw, 103px)
            );
    }

    100% {
        transform:
            rotate(360deg)
            translateX(
                min(39vw, 195px)
            );
    }
}

/* 星星呼吸 */

@keyframes starPulse {

    0%,100% {
        opacity: .72;
        transform:
            translate(-50%, -50%)
            scale(.82);
    }

    50% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}

/* =========================
   三个星轨旋转
========================= */

@keyframes orbitRotateOuter {
    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}

@keyframes orbitRotateMiddle {
    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}

@keyframes orbitRotateInner {
    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}

/* =========================
   标题
========================= */

.title {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 10;

    text-align: center;

    pointer-events: none;

    letter-spacing: .28em;
}

.title-main {
    font-size: clamp(13px, 2vw, 20px);

    font-weight: 300;

    letter-spacing: .42em;

    margin-left: .42em;

    opacity: .72;
}

.title-sub {
    margin-top: 8px;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    font-size: clamp(7px, 1vw, 10px);

    letter-spacing: .48em;

    margin-left: .48em;

    opacity: .38;
}

/* =========================
   手机适配
========================= */

@media (max-width: 600px) {

    .magic-system {
        width: 92vw;
        height: 92vw;
    }

    .title-main {
        font-size: 12px;
    }

    .title-sub {
        font-size: 7px;
    }

    .star-symbol {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- 背景星星 -->
    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✶</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✶</span>
    </div>


    <!-- =====================
         魔法阵
    ====================== -->

    <div class="magic-system">

        <!-- 外轨 -->
        <div class="orbit outer">

            <span class="mark top"></span>
            <span class="mark bottom"></span>
            <span class="mark left"></span>
            <span class="mark right"></span>

        </div>


        <!-- 中轨 -->
        <div class="orbit middle">

            <span class="mark top"></span>
            <span class="mark bottom"></span>
            <span class="mark left"></span>
            <span class="mark right"></span>

        </div>


        <!-- 内轨 -->
        <div class="orbit inner">

            <span class="mark top"></span>
            <span class="mark bottom"></span>
            <span class="mark left"></span>
            <span class="mark right"></span>

        </div>


        <!-- 中央 -->
        <div class="core"></div>


        <!-- =================
             唯一星星
        ================== -->

        <div class="travel-star">

            <div class="star-path">

                <div class="star-symbol">
                    ✦
                </div>

            </div>

        </div>


        <!-- 标题 -->
        <div class="title">

            <div class="title-main">
                SEYAMI
            </div>

            <div class="title-sub">
                ARCHIVE
            </div>

        </div>

    </div>

</div>

</body>
</html>
