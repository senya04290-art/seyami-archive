<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆｜SEYAMI ARCHIVE</title>

<!--
    西幻高对比字体
    Cormorant Garamond：
    细、长、高对比、优雅，非常适合大陆档案馆 / 奇幻世界观标题
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;
}

body {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(42, 125, 185, 0.17),
            transparent 37%
        ),

        radial-gradient(
            circle at 18% 22%,
            rgba(40, 105, 160, 0.11),
            transparent 30%
        ),

        radial-gradient(
            circle at 82% 68%,
            rgba(35, 105, 170, 0.08),
            transparent 28%
        ),

        linear-gradient(
            180deg,
            #020a16 0%,
            #041426 46%,
            #020914 100%
        );

    color: #eaf7ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   页面
========================================================= */

.page {

    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================================================
   远处星尘
========================================================= */

.stars {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: 0.9;

    background-image:

        radial-gradient(
            circle,
            rgba(205, 235, 255, 0.72) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(170, 220, 255, 0.50) 0 1px,
            transparent 1.6px
        ),

        radial-gradient(
            circle,
            rgba(220, 245, 255, 0.38) 0 0.8px,
            transparent 1.5px
        );

    background-size:
        145px 130px,
        210px 180px,
        280px 230px;

    background-position:
        10px 30px,
        80px 100px,
        150px 60px;

    animation:
        starFieldMove 30s linear infinite;
}

@keyframes starFieldMove {

    0% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(-8px, 10px, 0);
    }

    100% {
        transform:
            translate3d(0, 0, 0);
    }
}


/* =========================================================
   浮动星星容器
========================================================= */

.floating-stars {

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;
}


/* =========================================================
   浮动星星
========================================================= */

.floating-star {

    position: absolute;

    display: block;

    color:
        rgba(210, 240, 255, 0.78);

    font-family:
        "Times New Roman",
        serif;

    line-height: 1;

    text-shadow:
        0 0 5px rgba(160, 225, 255, 0.9),
        0 0 15px rgba(85, 190, 245, 0.65),
        0 0 30px rgba(70, 165, 230, 0.30);

    animation:
        starFloat var(--float-time) ease-in-out infinite,
        starTwinkle var(--twinkle-time) ease-in-out infinite alternate;

    animation-delay:
        var(--delay);

    opacity:
        var(--opacity);
}


/* 大星星 */

.star-a {
    top: 20%;
    left: 18%;

    font-size: 16px;

    --float-time: 7s;
    --twinkle-time: 3.5s;
    --delay: -2s;
    --opacity: 0.75;
}

.star-b {
    top: 29%;
    right: 18%;

    font-size: 11px;

    --float-time: 8s;
    --twinkle-time: 4s;
    --delay: -5s;
    --opacity: 0.62;
}

.star-c {
    top: 43%;
    left: 11%;

    font-size: 8px;

    --float-time: 6s;
    --twinkle-time: 3s;
    --delay: -1s;
    --opacity: 0.58;
}

.star-d {
    top: 49%;
    right: 12%;

    font-size: 15px;

    --float-time: 9s;
    --twinkle-time: 4.5s;
    --delay: -6s;
    --opacity: 0.72;
}

.star-e {
    top: 67%;
    left: 22%;

    font-size: 9px;

    --float-time: 7.5s;
    --twinkle-time: 3.7s;
    --delay: -4s;
    --opacity: 0.58;
}

.star-f {
    top: 70%;
    right: 23%;

    font-size: 12px;

    --float-time: 8.5s;
    --twinkle-time: 4s;
    --delay: -3s;
    --opacity: 0.65;
}

.star-g {
    top: 35%;
    left: 29%;

    font-size: 5px;

    --float-time: 5s;
    --twinkle-time: 2.8s;
    --delay: -2.5s;
    --opacity: 0.50;
}

.star-h {
    top: 58%;
    right: 30%;

    font-size: 6px;

    --float-time: 6.5s;
    --twinkle-time: 3.2s;
    --delay: -5s;
    --opacity: 0.55;
}


/* 更远的星星 */

.star-i {
    top: 15%;
    left: 38%;

    font-size: 4px;

    --float-time: 10s;
    --twinkle-time: 5s;
    --delay: -4s;
    --opacity: 0.45;
}

.star-j {
    top: 24%;
    right: 32%;

    font-size: 5px;

    --float-time: 9s;
    --twinkle-time: 4s;
    --delay: -1s;
    --opacity: 0.40;
}

.star-k {
    top: 74%;
    left: 38%;

    font-size: 5px;

    --float-time: 8s;
    --twinkle-time: 4.5s;
    --delay: -6s;
    --opacity: 0.45;
}

.star-l {
    top: 62%;
    right: 40%;

    font-size: 4px;

    --float-time: 7s;
    --twinkle-time: 3s;
    --delay: -3s;
    --opacity: 0.42;
}


/* =========================================================
   星星动画
========================================================= */

@keyframes starFloat {

    0% {
        transform:
            translate3d(0, 0, 0)
            rotate(0deg);
    }

    25% {
        transform:
            translate3d(5px, -7px, 0)
            rotate(7deg);
    }

    50% {
        transform:
            translate3d(-2px, -13px, 0)
            rotate(-4deg);
    }

    75% {
        transform:
            translate3d(-6px, -5px, 0)
            rotate(5deg);
    }

    100% {
        transform:
            translate3d(0, 0, 0)
            rotate(0deg);
    }
}


@keyframes starTwinkle {

    0% {
        opacity: 0.18;

        filter:
            blur(0.2px);
    }

    45% {
        opacity: 0.55;
    }

    70% {
        opacity: 0.95;

        filter:
            blur(0);
    }

    100% {
        opacity: 0.30;
    }
}


/* =========================================================
   装饰边框
========================================================= */

.frame {

    position: absolute;

    top: 24px;
    left: 24px;
    right: 24px;
    bottom: 24px;

    border:
        1px solid rgba(110, 190, 235, 0.18);

    pointer-events: none;

    z-index: 10;
}


.frame::before,
.frame::after {

    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    border-color:
        rgba(130, 210, 255, 0.45);

    border-style: solid;
}


.frame::before {

    top: -1px;
    left: -1px;

    border-width:
        1px 0 0 1px;
}


.frame::after {

    right: -1px;
    bottom: -1px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   顶部导航
========================================================= */

.nav {

    position: relative;

    z-index: 20;

    width: 100%;

    padding:
        30px
        clamp(30px, 6vw, 90px);

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.logo {

    display: flex;

    align-items: center;

    gap: 13px;

    color:
        rgba(220, 244, 255, 0.92);

    font-size: 13px;

    letter-spacing: 3px;

    white-space: nowrap;
}


.logo-symbol {

    color: #9fdcff;

    font-size: 17px;

    text-shadow:
        0 0 10px rgba(110, 210, 255, 0.7);
}


.logo-en {

    opacity: 0.65;

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    letter-spacing: 3px;

    font-size: 13px;
}


.nav-links {

    display: flex;

    gap: 34px;
}


.nav-links a {

    position: relative;

    color:
        rgba(210, 235, 250, 0.62);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 2px;

    transition:
        color .3s ease;
}


.nav-links a::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    width: 0;
    height: 1px;

    background: #9edcff;

    transform:
        translateX(-50%);

    transition:
        width .3s ease;
}


.nav-links a:hover {

    color:
        #edfaff;
}


.nav-links a:hover::after {

    width: 100%;
}


/* =========================================================
   主区域
========================================================= */

.hero {

    position: relative;

    z-index: 12;

    flex: 1;

    min-height:
        calc(100vh - 100px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        50px 25px 100px;
}


/* =========================================================
   顶部小符号
========================================================= */

.symbol {

    margin-bottom: 34px;

    color:
        rgba(155, 218, 250, 0.70);

    font-size: 15px;

    letter-spacing: 10px;

    text-shadow:
        0 0 15px rgba(90, 190, 255, 0.45);

    animation:
        symbolGlow 4s ease-in-out infinite alternate;
}


@keyframes symbolGlow {

    from {
        opacity: 0.45;
    }

    to {
        opacity: 0.90;
    }
}


/* =========================================================
   SEYAMI ARCHIVE
   真正的西幻标题
========================================================= */

.title-en {

    margin: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-family:
        "Cormorant Garamond",
        "Bodoni 72",
        "Didot",
        "Baskerville",
        "Times New Roman",
        serif;

    font-weight: 300;

    color:
        rgba(244, 250, 255, 0.96);

    text-shadow:

        0 0 5px rgba(225, 247, 255, 0.52),

        0 0 18px rgba(90, 190, 245, 0.24),

        0 0 45px rgba(55, 150, 215, 0.12);

    transform:
        scaleX(0.92);

    letter-spacing: 0;

    line-height: 0.82;

    white-space: nowrap;

    /* 让字体保持极细 */

    -webkit-font-smoothing: antialiased;

    text-rendering:
        geometricPrecision;
}


/* =========================================================
   第一行 SEYAMI
========================================================= */

.title-word:first-child {

    display: block;

    font-size:
        clamp(76px, 10.5vw, 136px);

    font-weight: 300;

    letter-spacing:
        clamp(11px, 1.8vw, 24px);

    padding-left:
        clamp(11px, 1.8vw, 24px);
}


/* =========================================================
   第二行 ARCHIVE
========================================================= */

.title-word:last-child {

    display: block;

    margin-top: 16px;

    font-size:
        clamp(61px, 8.6vw, 111px);

    font-weight: 300;

    letter-spacing:
        clamp(14px, 2.2vw, 29px);

    padding-left:
        clamp(14px, 2.2vw, 29px);

    opacity: 0.94;
}


/* =========================================================
   标题附近微光
========================================================= */

.title-en::before {

    content: "";

    position: absolute;

    width: 520px;
    height: 220px;

    background:
        radial-gradient(
            ellipse,
            rgba(75, 175, 230, 0.08),
            transparent 68%
        );

    filter:
        blur(25px);

    pointer-events: none;

    z-index: -1;
}


/* =========================================================
   标题线
========================================================= */

.title-line {

    position: relative;

    width:
        min(650px, 78vw);

    height: 1px;

    margin:
        34px auto
        17px;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(105, 200, 255, 0.10) 12%,
            rgba(105, 200, 255, 0.48) 50%,
            rgba(105, 200, 255, 0.10) 88%,
            transparent 100%
        );
}


.title-line::before,
.title-line::after {

    content: "✦";

    position: absolute;

    top: 50%;

    color:
        rgba(145, 220, 255, 0.55);

    font-size: 8px;

    transform:
        translateY(-50%);

    text-shadow:
        0 0 10px rgba(110, 210, 255, 0.7);
}


.title-line::before {
    left: 18%;
}


.title-line::after {
    right: 18%;
}


/* =========================================================
   中文标题
========================================================= */

.title-cn {

    margin: 0;

    color:
        rgba(221, 241, 251, 0.82);

    font-size:
        clamp(16px, 2vw, 23px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1vw, 10px);

    text-indent:
        clamp(5px, 1vw, 10px);
}


/* =========================================================
   简介
========================================================= */

.description {

    margin-top: 27px;

    color:
        rgba(180, 213, 232, 0.57);

    font-size: 13px;

    line-height: 2.2;

    letter-spacing: 2px;

    font-weight: 300;
}


/* =========================================================
   进入按钮
========================================================= */

.enter-button {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 45px;

    min-width: 190px;

    padding:
        14px 28px;

    border:
        1px solid rgba(130, 205, 240, 0.45);

    color:
        rgba(225, 246, 255, 0.9);

    background:
        rgba(8, 31, 52, 0.38);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 4px;

    transition:
        all .35s ease;

    backdrop-filter:
        blur(5px);
}


.enter-button::before,
.enter-button::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    border-color:
        #a8e1ff;

    border-style: solid;
}


.enter-button::before {

    top: -1px;
    left: -1px;

    border-width:
        1px 0 0 1px;
}


.enter-button::after {

    right: -1px;
    bottom: -1px;

    border-width:
        0 1px 1px 0;
}


.enter-button:hover {

    color:
        #ffffff;

    border-color:
        rgba(165, 225, 255, 0.8);

    background:
        rgba(22, 66, 98, 0.45);

    box-shadow:
        0 0 25px rgba(70, 180, 240, 0.16);

    transform:
        translateY(-2px);
}


/* =========================================================
   底部文字
========================================================= */

.footer-mark {

    position: absolute;

    bottom: 30px;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(150, 200, 225, 0.32);

    font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;

    font-size: 12px;

    letter-spacing: 6px;

    white-space: nowrap;

    z-index: 15;
}


/* =========================================================
   魔法圆环
========================================================= */

.magic-circle {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(650px, 90vw);

    height:
        min(650px, 90vw);

    border:
        1px solid rgba(90, 175, 220, 0.07);

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    z-index: 1;

    animation:
        circleBreath 12s ease-in-out infinite alternate;
}


.magic-circle::before {

    content: "";

    position: absolute;

    left: 7%;
    top: 7%;

    width: 86%;
    height: 86%;

    border:
        1px solid rgba(110, 195, 235, 0.045);

    border-radius: 50%;
}


.magic-circle::after {

    content: "✦";

    position: absolute;

    top: -9px;
    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(120, 205, 240, 0.22);

    font-size: 13px;
}


@keyframes circleBreath {

    from {
        opacity: 0.55;

        transform:
            translate(-50%, -50%)
            scale(0.99);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.015);
    }
}


/* =========================================================
   中央微光
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 470px;
    height: 470px;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(50, 145, 210, 0.10),
            transparent 68%
        );

    filter:
        blur(12px);

    pointer-events: none;

    z-index: 1;

    animation:
        glowPulse 7s ease-in-out infinite alternate;
}


@keyframes glowPulse {

    from {
        opacity: 0.65;

        transform:
            translate(-50%, -50%)
            scale(0.94);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}


/* =========================================================
   手机
========================================================= */

@media (max-width: 700px) {

    .frame {

        top: 14px;
        left: 14px;
        right: 14px;
        bottom: 14px;
    }


    .nav {

        padding:
            24px 30px;

        align-items:
            flex-start;
    }


    .logo {

        font-size: 11px;

        letter-spacing: 2px;
    }


    .logo-en {
        display: none;
    }


    .nav-links {

        gap: 14px;
    }


    .nav-links a {

        font-size: 10px;

        letter-spacing: 1px;
    }


    .hero {

        padding:
            40px 20px 90px;
    }


    .symbol {

        margin-bottom: 27px;

        font-size: 13px;
    }


    .title-en {

        transform:
            scaleX(0.88);

        line-height:
            0.84;
    }


    .title-word:first-child {

        font-size:
            clamp(58px, 16vw, 88px);

        letter-spacing:
            7px;

        padding-left:
            7px;
    }


    .title-word:last-child {

        margin-top: 11px;

        font-size:
            clamp(47px, 13vw, 72px);

        letter-spacing:
            9px;

        padding-left:
            9px;
    }


    .title-line {

        width: 76vw;

        margin:
            28px auto
            15px;
    }


    .title-cn {

        font-size: 15px;

        letter-spacing: 5px;
    }


    .description {

        font-size: 11px;

        line-height: 2;

        letter-spacing: 1px;
    }


    .enter-button {

        margin-top: 34px;

        min-width: 175px;

        padding:
            13px 20px;

        font-size: 11px;

        letter-spacing: 3px;
    }


    .footer-mark {

        bottom: 20px;

        font-size: 9px;

        letter-spacing: 4px;
    }


    .magic-circle {

        width: 480px;
        height: 480px;
    }


    .star-a {
        left: 12%;
    }

    .star-b {
        right: 11%;
    }

    .star-d {
        right: 8%;
    }

    .star-f {
        right: 14%;
    }

}


/* =========================================================
   超小屏幕
========================================================= */

@media (max-width: 430px) {

    .nav-links a:nth-child(3) {
        display: none;
    }


    .logo {

        font-size: 10px;
    }


    .title-word:first-child {

        font-size: 53px;

        letter-spacing: 5px;

        padding-left: 5px;
    }


    .title-word:last-child {

        font-size: 43px;

        letter-spacing: 6px;

        padding-left: 6px;

        margin-top: 9px;
    }


    .title-cn {

        font-size: 14px;

        letter-spacing: 4px;
    }


    .description {

        max-width: 280px;
    }


    .floating-star {

        transform:
            scale(0.75);
    }

}

</style>
</head>

<div class="page">


    <!-- =====================================================

    <div class="stars"></div>


    <!-- =====================================================

    <div class="floating-stars">

        <span class="floating-star star-a">✦</span>

        <span class="floating-star star-b">✧</span>

        <span class="floating-star star-g">·</span>

    <header class="nav">

        <div class="logo">

            <span class="logo-symbol">

            </span>

            <span>
                塞垭弥大陆档案馆
            </span>

            <span class="logo-en">

            </span>

        </div>


        <nav class="nav-links">

            <a href="index.html">
