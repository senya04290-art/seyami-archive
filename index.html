*{

/* =========================================================
页面背景
========================================================= */

.page{
position:relative;

width:100%;    
min-height:100vh;    

overflow:hidden;    

background:    
    radial-gradient(    
        circle at 50% 45%,    
        rgba(38,91,137,.18),    
        transparent 38%

    radial-gradient(    
        circle at 50% 50%,    
        rgba(11,45,75,.45),    
        transparent 70%

    #061426;

}

/* =========================================================
星空
========================================================= */

.stars{
position:absolute;
inset:0;

pointer-events:none;    
overflow:hidden;

}

.stars::before,
.stars::after{

content:"";    

position:absolute;    
inset:-20%;    

background-image:    

    radial-gradient(    
        circle,    
        rgba(182,220,255,.7) 0 1px,    
        transparent 1.5px    
    ),    

    radial-gradient(    
        circle,    
        rgba(130,191,239,.45) 0 1px,    
        transparent 1.5px    
    ),    

    radial-gradient(    
        circle,    
        rgba(220,240,255,.35) 0 1px,    
        transparent 1.5px    
    );    

background-size:    
    180px 180px,    
    240px 240px,    
    310px 310px;    

background-position:    
    20px 30px,    
    80px 120px,    
    150px 70px;    

opacity:.45;    

animation:    
    starMove    
    35s    
    linear    
    infinite;

}

.stars::after{

opacity:.22;    

transform:scale(1.15);    

animation-duration:50s;

}

@keyframes starMove{

from{    
    transform:    
        translate3d(0,0,0);    
}    

to{    
    transform:    
        translate3d(-80px,50px,0);    
}

}

浮动星星
========================================================= */

.floating-stars{

position:absolute;    
inset:0;    

pointer-events:none;    

z-index:2;

}

.floating-stars span{

font-family:    
    serif;    

font-size:14px;

    0 0 8px    
    rgba(96,177,242,.5);    

animation:    
    floatStar    
    6s    
    ease-in-out    
    infinite;

}

.floating-stars span:nth-child(1){
left:12%;
top:24%;
animation-delay:0s;
}

.floating-stars span:nth-child(2){

top:67%;

}

.floating-stars span:nth-child(3){

top:22%;

}

.floating-stars span:nth-child(4){

top:70%;

}

.floating-stars span:nth-child(5){

top:17%;

}

.floating-stars span:nth-child(6){

top:61%;

}

.floating-stars span:nth-child(7){
left:16%;
top:46%;

}

.floating-stars span:nth-child(8){

top:43%;

}

.floating-stars span:nth-child(9){
left:42%;
top:11%;

}

.floating-stars span:nth-child(10){
left:57%;
top:83%;

}

.floating-stars span:nth-child(11){
left:7%;
top:78%;

}

.floating-stars span:nth-child(12){

top:18%;

}

@keyframes floatStar{

0%,    
100%{    

    opacity:.35;    

    transform:    
        translateY(0)    
        rotate(0deg);    
}    

50%{    

    opacity:.85;    

    transform:    
        translateY(-8px)

}

外框
========================================================= */

========================================================= */

justify-content:center;

.corner.tl{
left:-34px;
top:-34px;
}

.corner.tr{
right:-34px;
top:-34px;
}

.corner.bl{

bottom:-34px;

bottom:-34px;

/* =========================================================
顶部导航
========================================================= */

.top-nav{

right:58px;

Logo
========================================================= */

.logo{

✶

这里专门修正位置
========================================================= */

*/

    0 0 7px    
    rgba(76,159,216,.5),

    rgba(49,132,191,.22);

}

/* =========================================================
Logo文字
========================================================= */

.logo-text{

display:flex;    

flex-direction:column;    

line-height:1.05;

}

.logo-cn{

    "Noto Serif SC",    
    serif;

}

.logo-en{

margin-top:5px;

/* =========================================================
导航
========================================================= */

.nav-links{

align-items:center;

}

.nav-links a{

color:    
    rgba(191,220,243,.68);

    "Noto Serif SC",    
    serif;    

font-size:12px;    

letter-spacing:2px;

    text-shadow .3s ease;

}

.nav-links a::after{

content:"";    

position:absolute;    

left:50%;    

bottom:-8px;    

width:0;    

height:1px;    

background:    
    rgba(122,192,235,.7);    

transform:

.nav-links a:hover{

text-shadow:    
    0 0 8px    
    rgba(102,180,231,.35);

}

.nav-links a:hover::after{

}

/* =========================================================
主区域
========================================================= */

.main{

position:relative;    

width:100%;    

min-height:100vh;    

display:flex;    

flex-direction:column;    

align-items:center;    

justify-content:center;    

z-index:5;    

padding:

}

/* =========================================================
魔法阵
========================================================= */

.magic-circle{

position:absolute;    

width:560px;    
height:560px;    

left:50%;    
top:50%;    

transform:    
    translate(-50%,-50%);    

border-radius:50%;    

pointer-events:none;    

opacity:.55;

}

/* 外圈 */

.magic-circle::before{

content:"";    

position:absolute;    

inset:0;    

border-radius:50%;    

border:    
    1px solid    
    rgba(73,143,198,.28);    

box-shadow:    
    0 0 22px    
    rgba(47,126,184,.08);    

animation:    
    rotateCircle    
    80s    
    linear    
    infinite;

}

/* 内圈 */

.magic-circle::after{

content:"";    

position:absolute;    

inset:27px;    

border-radius:50%;    

border:    
    1px solid    
    rgba(91,162,213,.22);    

box-shadow:    
    inset 0 0 20px    
    rgba(62,139,194,.04);    

animation:    
    rotateCircleReverse    
    55s    
    linear    
    infinite;

}

@keyframes rotateCircle{

from{    
    transform:rotate(0deg);    
}    

to{    
    transform:rotate(360deg);    
}

}

@keyframes rotateCircleReverse{

from{    
    transform:rotate(360deg);    
}    

to{    
    transform:rotate(0deg);    
}

}

/* =========================================================
★ 星轨
★ 使用你刚刚发来的那版运行方式
========================================================= */

.orbit{

position:absolute;    

left:50%;    
top:50%;    

border:    
    1px solid    
    rgba(69,164,230,.13);    

border-radius:50%;    

transform:    
    translate(-50%,-50%);    

animation:    
    orbitRotate    
    38s    
    linear    
    infinite;

}

/* 第一层 */

.orbit.one{

width:500px;    
height:190px;

}

/* 第二层 */

.orbit.two{

width:420px;    
height:145px;    

animation-direction:    
    reverse;    

animation-duration:    
    32s;

}

/* 第三层 */

.orbit.three{

width:330px;    
height:105px;    

animation-duration:    
    25s;

}

/* 星轨运行
★ 完全采用你给我的代码
*/

@keyframes orbitRotate{

from{    

    transform:    
        translate(-50%,-50%)    
        rotate(0deg);    
}    

to{    

    transform:    
        translate(-50%,-50%)    
        rotate(360deg);    
}

}

/* =========================================================
魔法阵十字线
========================================================= */

.magic-line{

left:50%;    
top:50%;

}

.magic-line.vertical{

}

========================================================= */

.magic-center{
