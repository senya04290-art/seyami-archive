<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* ==============================
   基础
============================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;

    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;

    overflow-x:hidden;
}


/* ==============================
   页面
============================== */

.page{
    position:relative;

    min-height:100vh;
    width:100%;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),

        #061426;
}


/* ==============================
   背景星尘
============================== */

.stars{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.45;

    background-image:

        radial-gradient(
            1px 1px at 20% 30%,
            rgba(190,225,250,.8),
            transparent
        ),

        radial-gradient(
            1px 1px at 70% 20%,
            rgba(190,225,250,.7),
            transparent
        ),

        radial-gradient(
            1px 1px at 40% 80%,
            rgba(190,225,250,.65),
            transparent
        ),

        radial-gradient(
            1px 1px at 85% 65%,
            rgba(190,225,250,.55),
            transparent
        );

    background-size:
        180px 180px,
        240px 240px,
        310px 310px,
        220px 220px;

    animation:
        starsMove 35s linear infinite,
        starsGlow 50s ease-in-out infinite alternate;
}

@keyframes starsMove{

    from{
        background-position:
            0 0,
            0 0,
            0 0,
            0 0;
    }

    to{
        background-position:
            90px 60px,
            -80px 100px,
            120px -70px,
            -100px 80px;
    }

}

@keyframes starsGlow{

    from{
        opacity:.32;
    }

    to{
        opacity:.52;
    }

}


/* ==============================
   浮动星星
============================== */

.floating-stars{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:2;
}

.floating-stars span{
    position:absolute;

    color:rgba(147,204,239,.55);

    font-family:
        "Times New Roman",
        serif;

    animation:
        floatStar 6s ease-in-out infinite;
}

.floating-stars span:nth-child(1){
    left:12%;
    top:22%;
    font-size:12px;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:82%;
    top:19%;
    font-size:10px;
    animation-delay:1s;
}

.floating-stars span:nth-child(3){
    left:17%;
    top:67%;
    font-size:14px;
    animation-delay:2s;
}

.floating-stars span:nth-child(4){
    left:87%;
    top:72%;
    font-size:13px;
    animation-delay:3s;
}

.floating-stars span:nth-child(5){
    left:28%;
    top:15%;
    font-size:8px;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(6){
    left:72%;
    top:37%;
    font-size:13px;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(7){
    left:9%;
    top:48%;
    font-size:9px;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(8){
    left:91%;
    top:47%;
    font-size:11px;
    animation-delay:1.2s;
}

.floating-stars span:nth-child(9){
    left:31%;
    top:82%;
    font-size:11px;
    animation-delay:4s;
}

.floating-stars span:nth-child(10){
    left:68%;
    top:84%;
    font-size:10px;
    animation-delay:2.2s;
}

.floating-stars span:nth-child(11){
    left:47%;
    top:12%;
    font-size:8px;
    animation-delay:4.5s;
}

.floating-stars span:nth-child(12){
    left:54%;
    top:89%;
    font-size:12px;
    animation-delay:3.2s;
}

@keyframes floatStar{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }

    50%{
        transform:
            translateY(-9px)
            rotate(20deg);

        opacity:.75;
    }

}


/* ==============================
   外框
============================== */

.frame{
    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;
}

.frame::before{
    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(81,142,193,.08);
}


/* ==============================
   四角六芒星
============================== */

.corner{
    position:absolute;

    width:68px;
    height:68px;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.corner::before{
    content:"✡";

    font-family:
        "Times New Roman",
        serif;

    font-size:31px;

    color:
        rgba(108,178,230,.88);

    text-shadow:
        0 0 7px rgba(72,160,215,.25);
}

.corner.tl{
    left:-34px;
    top:-34px;
}

.corner.tr{
    right:-34px;
    top:-34px;
}

.corner.bl{
    left:-34px;
    bottom:-34px;
}

.corner.br{
    right:-34px;
    bottom:-34px;
}


/* ==============================
   顶部导航
============================== */

.top-nav{
    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    z-index:20;
}


/* 左上角 LOGO */

.logo{
    display:flex;

    align-items:baseline;

    gap:10px;

    color:#d9edff;

    text-decoration:none;
}

.logo-mark{
    width:auto;
    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    line-height:1;

    position:relative;

    top:1px;

    color:
        rgba(137,201,239,.9);

    text-shadow:
        0 0 8px rgba(71,163,219,.22);
}

.logo-text{
    display:flex;

    flex-direction:column;
}

.logo-cn{
    font-family:
        "Noto Serif SC",
        serif;

    font-size:15px;

    letter-spacing:2px;

    line-height:1;
}

.logo-en{
    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.63);
}


/* 导航 */

.nav-links{
    display:flex;

    gap:31px;

    padding-top:2px;
}

.nav-links a{
    color:
        rgba(189,219,239,.65);

    text-decoration:none;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:2px;

    transition:
        color .3s ease;
}

.nav-links a:hover{
    color:#e1f3ff;
}


/* ==============================
   主区域
============================== */

.main{
    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        80px 20px 70px;
}


/* ==============================
   魔法阵
============================== */

.magic-circle{
    position:absolute;

    left:50%;
    top:50%;

    width:560px;
    height:560px;

    transform:
        translate(-50%,-50%);

    opacity:.55;

    pointer-events:none;
}


/* 外圈 */

.magic-circle::before{
    content:"";

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(73,143,198,.28);

    border-radius:50%;

    box-shadow:
        0 0 22px
        rgba(51,133,190,.07);

    animation:
        magicRotate 80s linear infinite;
}


/* 内圈 */

.magic-circle::after{
    content:"";

    position:absolute;

    inset:27px;

    border:
        1px solid
        rgba(91,162,213,.22);

    border-radius:50%;

    animation:
        magicRotateReverse 55s linear infinite;
}

@keyframes magicRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes magicRotateReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* ==============================
   星轨
============================== */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:
        1px solid
        rgba(94,165,214,.30);

    box-shadow:
        0 0 6px
        rgba(70,155,210,.08);

    transform:
        translate(-50%,-50%);

    transform-origin:center center;

    animation:
        orbitRotate 38s linear infinite;
}

.orbit.one{
    width:500px;
    height:190px;
}

.orbit.two{
    width:420px;
    height:145px;

    animation-direction:reverse;

    animation-duration:32s;
}

.orbit.three{
    width:330px;
    height:105px;

    animation-duration:25s;
}

@keyframes orbitRotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* ==============================
   魔法阵十字线
============================== */

.magic-line{
    position:absolute;

    background:
        rgba(92,164,213,.13);
}

.magic-line.horizontal{
    width:490px;
    height:1px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);
}

.magic-line.vertical{
    width:1px;
    height:490px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);
}


/* ==============================
   魔法阵中心
============================== */

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    border:
        1px solid
        rgba(133,202,242,.48);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 9px
        rgba(75,163,218,.2);
}

.magic-center::before{
    content:"";

    position:absolute;

    width:3px;
    height:3px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(169,218,244,.75);

    border-radius:50%;
}


/* ==============================
   标题
============================== */

.title-area{
    position:relative;

    z-index:8;

    text-align:center;

    margin-top:-18px;
}

.main-title{
    display:flex;

    flex-direction:column;

    align-items:center;

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        serif;

    font-weight:400;

    line-height:.83;

    letter-spacing:8px;

    color:#dceeff;

    text-shadow:
        0 0 12px
        rgba(108,182,228,.08);
}

.seyami{
    font-size:70px;
}

.archive{
    margin-top:15px;

    font-size:87px;

    letter-spacing:9px;
}


/* ==============================
   标题装饰线
============================== */

.title-decoration{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:13px;

    margin-top:29px;
}

.title-decoration .line{
    width:95px;
    height:1px;

    background:
        rgba(122,181,218,.4);
}

.title-decoration .diamond{
    width:6px;
    height:6px;

    transform:rotate(45deg);

    border:
        1px solid
        rgba(141,202,235,.6);
}

.title-decoration .line.right{
    transform:none;
}


/* ==============================
   中文标题
============================== */

.chinese-title{
    margin-top:24px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:8px;

    color:
        rgba(207,229,246,.86);
}


/* ==============================
   描述
============================== */

.description{
    display:flex;

    flex-direction:column;

    margin-top:20px;

    gap:5px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    line-height:1.6;

    letter-spacing:2px;

    color:
        rgba(177,207,230,.62);
}


/* ==============================
   进入按钮外框
============================== */

.enter-wrap{
    position:relative;

    width:370px;
    height:82px;

    margin:42px auto 0;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* 魔法边框 */

.enter-wrap::before{
    content:"";

    position:absolute;

    inset:10px 0;

    border:
        1px solid
        rgba(99,170,216,.35);

    clip-path:
        polygon(
            0 25%,
            5% 25%,
            7% 0,
            93% 0,
            95% 25%,
            100% 25%,
            100% 75%,
            95% 75%,
            93% 100%,
            7% 100%,
            5% 75%,
            0 75%
        );
}

.enter-wrap::after{
    content:"";

    position:absolute;

    inset:15px 5px;

    border:
        1px solid
        rgba(80,143,190,.16);

    pointer-events:none;
}


/* ==============================
   按钮
============================== */

.enter-button{
    position:relative;

    width:300px;
    height:50px;

    border:none;

    background:
        linear-gradient(
            180deg,
            rgba(12,43,69,.92),
            rgba(7,29,50,.92)
        );

    border-top:
        1px solid
        rgba(116,188,229,.55);

    border-bottom:
        1px solid
        rgba(116,188,229,.3);

    color:#dcefff;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        all .35s ease;
}

.enter-button:hover{
    background:
        linear-gradient(
            180deg,
            rgba(19,60,91,.95),
            rgba(9,38,63,.95)
        );

    color:#ffffff;

    box-shadow:
        0 0 18px
        rgba(70,157,211,.14);
}


/* ==============================
   按钮两侧六芒星
============================== */

.enter-star{
    position:absolute;

    z-index:3;

    font-family:
        "Times New Roman",
        serif;

    font-size:17px;

    color:
        rgba(116,191,231,.72);

    text-shadow:
        0 0 8px
        rgba(67,157,211,.18);
}

.enter-star.left{
    left:19px;
}

.enter-star.right{
    right:19px;
}


/* ==============================
   按钮上下菱形
============================== */

.enter-diamond{
    position:absolute;

    width:5px;
    height:5px;

    transform:rotate(45deg);

    border:
        1px solid
        rgba(126,192,226,.45);
}

.enter-diamond.top{
    top:5px;
    left:50%;
}

.enter-diamond.bottom{
    bottom:5px;
    left:50%;
}


/* ==============================
   底部
============================== */

.footer{
    position:absolute;

    left:50%;
    bottom:32px;

    transform:
        translateX(-50%);

    z-index:20;

    white-space:nowrap;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    color:
        rgba(133,177,207,.38);
}


/* ==============================
   平板
============================== */

@media(max-width:800px){

    .top-nav{
        left:35px;
        right:35px;
    }

    .nav-links{
        gap:20px;
    }

    .magic-circle{
        width:480px;
        height:480px;
    }

    .orbit.one{
        width:430px;
        height:165px;
    }

    .orbit.two{
        width:360px;
        height:125px;
    }

    .orbit.three{
        width:285px;
        height:90px;
    }

}


/* ==============================
   手机
============================== */

@media(max-width:520px){

    .frame{
        inset:12px;
    }

    .top-nav{
        left:25px;
        right:25px;
        top:24px;
    }

    .logo{
        gap:7px;
    }

    .logo-mark{
        font-size:18px;
    }

    .logo-cn{
        font-size:12px;
        letter-spacing:1px;
    }

    .logo-en{
        font-size:6px;
        letter-spacing:2px;
        margin-top:4px;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:9px;
        letter-spacing:1px;
    }


    /* 手机四角 */

    .corner{
        width:55px;
        height:55px;
    }

    .corner::before{
        font-size:26px;
    }

    .corner.tl{
        left:-27.5px;
        top:-27.5px;
    }

    .corner.tr{
        right:-27.5px;
        top:-27.5px;
    }

    .corner.bl{
        left:-27.5px;
        bottom:-27.5px;
    }

    .corner.br{
        right:-27.5px;
        bottom:-27.5px;
    }


    /* 主区域 */

    .main{
        padding:
            100px 15px 70px;
    }


    /* 魔法阵 */

    .magic-circle{
        width:390px;

        opacity:.48;
    }

    .orbit.one{
        width:350px;

    }

        width:295px;
        height:102px;
    }

        width:235px;
        height:75px;
    }

    .magic-line.horizontal{
        width:350px;
    }

    .magic-line.vertical{
        height:350px;
    }


    /* 标题 */

    .title-area{
        margin-top:-10px;
    }

    .main-title{
        letter-spacing:5px;
    }

    .seyami{
        font-size:43px;
    }

    .archive{
        margin-top:12px;

        font-size:53px;

        letter-spacing:6px;
    }


    /* 标题装饰 */

    .title-decoration{
        margin-top:23px;

        gap:9px;
    }

    .title-decoration .line{
        width:55px;
    }


    /* 中文 */

    .chinese-title{
        margin-top:19px;

        font-size:15px;

        letter-spacing:5px;
    }


    /* 描述 */

    .description{
        margin-top:16px;

        font-size:10px;

        letter-spacing:1px;

        gap:4px;
    }


    /* 按钮 */

    .enter-wrap{
        width:320px;
        height:76px;

        margin-top:34px;
    }

    .enter-button{
        width:255px;
        height:46px;

        font-size:11px;

        letter-spacing:3px;
    }

    .enter-star{
        font-size:14px;
    }

    .enter-star.left{
        left:15px;
    }

    .enter-star.right{
        right:15px;
    }


    /* 底部 */

    .footer{
        bottom:21px;

        font-size:6px;

        letter-spacing:3px;
    }

}

</style>

</head>


<body>

<div class="page">


<!-- ==============================
     背景星尘
============================== -->

<div class="stars"></div>


<!-- ==============================
     浮动星星
============================== -->

<div class="floating-stars">

    <span>✦</span>
    <span>✧</span>
    <span>·</span>
    <span>✶</span>
    <span>✦</span>
    <span>·</span>
    <span>✧</span>
    <span>✡</span>
    <span>✦</span>
    <span>✶</span>
    <span>·</span>
    <span>✧</span>

</div>


<!-- ==============================
     页面外框
============================== -->

<div class="frame">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

</div>


<!-- ==============================
     顶部导航
============================== -->

<header class="top-nav">


    <!-- 左上角 -->

    <a href="index.html"
       class="logo">

        <div class="logo-mark">✶</div>

        <div class="logo-text">

            <span class="logo-cn">
                塞垭弥大陆档案馆
            </span>

            <span class="logo-en">
                SEYAMI ARCHIVE
            </span>

        </div>

    </a>


    <!-- 右上角导航 -->

    <nav class="nav-links">

        <a href="index.html">
            首页
        </a>

        <a href="archive.html">
            档案目录
        </a>

        <a href="about.html">
            关于我们
        </a>

    </nav>

</header>


<!-- ==============================
     主内容
============================== -->

<main class="main">


    <!-- 魔法阵 -->

    <div class="magic-circle">


        <!-- 星轨 -->

        <div class="orbit one"></div>

        <div class="orbit two"></div>

        <div class="orbit three"></div>


        <!-- 十字线 -->

        <div class="magic-line horizontal"></div>

        <div class="magic-line vertical"></div>


        <!-- 中心 -->

        <div class="magic-center"></div>

    </div>


    <!-- 标题区域 -->

    <section class="title-area">


        <!-- 英文标题 -->

        <h1 class="main-title">

            <span class="seyami">
                SEYAMI
            </span>

            <span class="archive">
                ARCHIVE
            </span>

        </h1>


        <!-- 装饰线 -->

        <div class="title-decoration">

            <span class="line"></span>

            <span class="diamond"></span>
