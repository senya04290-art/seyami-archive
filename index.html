<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>赛垭弥大陆档案馆｜SEYAMI ARCHIVE</title>

<style>

/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "Microsoft YaHei",
        serif;

    color: #eaf7ff;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(20, 71, 137, 0.22),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(8, 45, 100, 0.18),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #020b1c 0%,
            #031126 45%,
            #020b1c 100%
        );

    overflow-x: hidden;
}


/* =========================================================
   星空
========================================================= */

.stars {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,0.95) 0.8px,
            transparent 1.2px
        ),

        radial-gradient(
            circle,
            rgba(103,190,255,0.75) 0.8px,
            transparent 1.2px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,0.55) 0.7px,
            transparent 1px
        );

    background-size:
        130px 130px,
        190px 190px,
        270px 270px;

    background-position:
        20px 30px,
        70px 100px,
        140px 50px;

    opacity: 0.48;
}


/* =========================================================
   极淡的蓝色雾光
========================================================= */

.ambient-light {
    position: fixed;

    width: 700px;
    height: 700px;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(24, 100, 190, 0.11),
            rgba(4, 23, 57, 0.03) 45%,
            transparent 70%
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   魔法星盘
========================================================= */

.magic-circle {
    position: absolute;

    width: min(720px, 90vw);
    height: min(720px, 90vw);

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid rgba(91, 184, 255, 0.08);

    pointer-events: none;

    z-index: 1;

    animation: slowRotate 55s linear infinite;
}

.magic-circle::before {
    content: "";

    position: absolute;

    inset: 55px;

    border-radius: 50%;

    border:
        1px solid rgba(91, 184, 255, 0.075);
}

.magic-circle::after {
    content: "";

    position: absolute;

    inset: 115px;

    border-radius: 50%;

    border:
        1px dashed rgba(91, 184, 255, 0.06);
}

@keyframes slowRotate {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* =========================================================
   页面四角边框
========================================================= */

.frame {
    position: fixed;

    inset: 28px;

    border:
        1px solid rgba(82, 181, 255, 0.20);

    pointer-events: none;

    z-index: 10;
}

.frame::before,
.frame::after {
    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    border-color:
        rgba(104, 202, 255, 0.65);

    border-style: solid;
}


/* 左上 */

.frame::before {
    left: -1px;
    top: -1px;

    border-width:
        2px 0 0 2px;
}


/* 右下 */

.frame::after {
    right: -1px;
    bottom: -1px;

    border-width:
        0 2px 2px 0;
}


/* =========================================================
   顶部导航
========================================================= */

nav {
    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 82px;

    padding:
        0 7%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(2, 10, 26, 0.68);

    backdrop-filter:
        blur(16px);

    border-bottom:
        1px solid rgba(87, 184, 255, 0.13);

    z-index: 30;
}


/* =========================================================
   左上 Logo
========================================================= */

.logo {
    display: flex;

    align-items: center;

    gap: 15px;

    text-decoration: none;

    color: #eaf8ff;
}


/* 罗盘图标 */

.logo-symbol {
    width: 42px;
    height: 42px;

    border:
        1px solid rgba(111, 205, 255, 0.65);

    border-radius: 50%;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #a9e2ff;

    font-size: 20px;

    text-shadow:
        0 0 12px rgba(99, 203, 255, 0.9);

    box-shadow:
        0 0 15px rgba(54, 159, 230, 0.08);
}

.logo-symbol::before {
    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid rgba(111, 205, 255, 0.28);

    border-radius: 50%;
}


/* Logo 文字 */

.logo-text {
    line-height: 1.2;
}

.logo-cn {
    display: block;

    font-size: 16px;

    letter-spacing: 4px;

    color: #e7f7ff;
}

.logo-en {
    display: block;

    margin-top: 5px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 9px;

    letter-spacing: 4px;

    color: #69c4f5;
}


/* =========================================================
   顶部导航链接
========================================================= */

.nav-links {
    display: flex;

    align-items: center;

    gap: 42px;
}

.nav-links a {
    position: relative;

    text-decoration: none;

    color: #82b5d5;

    font-size: 13px;

    letter-spacing: 2px;

    transition: .3s ease;
}

.nav-links a:hover {
    color: #eaf9ff;

    text-shadow:
        0 0 12px rgba(88, 197, 255, 0.7);
}

.nav-links a.active {
    color: #dff6ff;
}

.nav-links a.active::after {
    content: "";

    position: absolute;

    left: 50%;

    bottom: -13px;

    width: 42px;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        #79d4ff;

    box-shadow:
        0 0 8px rgba(93, 204, 255, 0.8);
}


/* =========================================================
   主视觉
========================================================= */

.hero {
    position: relative;

    z-index: 5;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        120px 20px 80px;
}


/* =========================================================
   中央内容
========================================================= */

.hero-content {
    position: relative;

    z-index: 8;

    width: min(900px, 92vw);
}


/* =========================================================
   中央小星星
========================================================= */

.center-star {
    position: relative;

    width: 38px;
    height: 38px;

    margin:
        0 auto 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #dff7ff;

    font-size: 28px;

    text-shadow:
        0 0 12px #67cfff,
        0 0 30px rgba(65, 170, 255, 0.8);
}


/* =========================================================
   英文主标题
========================================================= */

.title-en {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(54px, 9vw, 112px);

    font-weight: 400;

    line-height: 0.95;

    letter-spacing:
        clamp(5px, 1.2vw, 13px);

    white-space: nowrap;

    color: #eaf8ff;

    text-shadow:
        0 0 8px rgba(205, 241, 255, 0.75),
        0 0 28px rgba(61, 165, 235, 0.55),
        0 0 65px rgba(25, 104, 188, 0.28);
}


/* =========================================================
   英文标题两侧装饰线
========================================================= */

.title-line {
    width: min(650px, 80vw);

    height: 1px;

    margin:
        22px auto 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(96, 199, 255, 0.65),
            transparent
        );

    position: relative;
}

.title-line::before,
.title-line::after {
    content: "✦";

    position: absolute;

    color: #77d4ff;

    font-size: 13px;

    text-shadow:
        0 0 10px #69caff;
}

.title-line::before {
    left: 50px;
}

.title-line::after {
    right: 50px;
}


/* =========================================================
   中文标题
========================================================= */

.title-cn {
    font-size:
        clamp(18px, 3vw, 29px);

    font-weight: 400;

    letter-spacing:
        clamp(5px, 1.2vw, 12px);

    color: #cceeff;

    text-shadow:
        0 0 13px rgba(86, 190, 255, 0.55);

    margin-bottom: 38px;
}


/* =========================================================
   简介
========================================================= */

.description {
    max-width: 650px;

    margin:
        0 auto 40px;

    color: #7fa9c5;

    font-size: 13px;

    line-height: 2.1;

    letter-spacing: 2px;
}


/* =========================================================
   进入档案馆按钮
========================================================= */

.enter-btn {
    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 245px;

    height: 58px;

    padding:
        0 38px;

    color: #dff7ff;

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 4px;

    background:
        linear-gradient(
            90deg,
            rgba(9, 48, 91, 0.45),
            rgba(18, 74, 128, 0.35),
            rgba(9, 48, 91, 0.45)
        );

    border:
        1px solid rgba(103, 207, 255, 0.7);

    transition:
        .35s ease;

    box-shadow:
        0 0 18px rgba(45, 157, 224, 0.12),
        inset 0 0 18px rgba(76, 184, 242, 0.04);
}


/* 按钮两侧小装饰 */

.enter-btn::before,
.enter-btn::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    border:
        1px solid #77d6ff;

    transform: rotate(45deg);

    background:
        #06162d;
}

.enter-btn::before {
    left: -6px;
}

.enter-btn::after {
    right: -6px;
}

.enter-btn:hover {
    transform:
        translateY(-4px);

    color: white;

    border-color:
        #b3ebff;

    background:
        linear-gradient(
            90deg,
            rgba(15, 72, 128, 0.65),
            rgba(29, 103, 169, 0.5),
            rgba(15, 72, 128, 0.65)
        );

    box-shadow:
        0 0 28px rgba(65, 182, 245, 0.3),
        inset 0 0 20px rgba(92, 204, 255, 0.08);
}


/* =========================================================
   飘浮小星星
========================================================= */

.star-decoration {
    position: absolute;

    color: #6bcfff;

    font-size: 12px;

    opacity: .7;

    text-shadow:
        0 0 10px #65caff;

    animation:
        floatStar 4s ease-in-out infinite;
}

.star-1 {
    left: 16%;
    top: 29%;
}

.star-2 {
    right: 18%;
    top: 25%;

    animation-delay: 1s;
}

.star-3 {
    left: 23%;
    bottom: 23%;

    animation-delay: 2s;
}

.star-4 {
    right: 24%;
    bottom: 25%;

    animation-delay: 1.5s;
}

@keyframes floatStar {

    0%,
    100% {
        transform:
            translateY(0);

        opacity: .4;
    }

    50% {
        transform:
            translateY(-8px);

        opacity: 1;
    }
}


/* =========================================================
   底部
========================================================= */

.footer {
    position: absolute;

    left: 0;
    bottom: 25px;

    width: 100%;

    text-align: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 9px;

    letter-spacing: 6px;

    color:
        rgba(101, 171, 211, 0.48);

    z-index: 8;
}


/* =========================================================
   手机适配
========================================================= */

@media (max-width: 700px) {

    nav {
        height: 68px;

        padding:
            0 22px;
    }

    .logo-symbol {
        width: 34px;
        height: 34px;

        font-size: 16px;
    }

    .logo-cn {
        font-size: 12px;

        letter-spacing: 2px;
    }

    .logo-en {
        font-size: 7px;

        letter-spacing: 3px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding:
            110px 15px 90px;
    }

    .title-en {
        white-space: normal;

        font-size:
            clamp(43px, 12vw, 70px);

        line-height: 1;

        letter-spacing: 4px;
    }

    .title-line {
        margin:
            18px auto 13px;
    }

    .title-line::before {
        left: 20px;
    }

    .title-line::after {
        right: 20px;
    }

    .title-cn {
        font-size: 18px;

        letter-spacing: 5px;

        margin-bottom: 28px;
    }

    .description {
        font-size: 12px;

        letter-spacing: 1px;

        padding:
            0 15px;
    }

    .enter-btn {
        min-width: 210px;

        height: 54px;

        font-size: 13px;
    }

    .magic-circle {
        width: 520px;
        height: 520px;
    }

    .frame {
        inset: 12px;
    }

    .footer {
        font-size: 7px;

        letter-spacing: 3px;
    }
}


/* =========================================================
   超小屏
========================================================= */

@media (max-width: 400px) {

    .title-en {
        font-size: 40px;

        letter-spacing: 2px;
    }

    .title-cn {
        font-size: 16px;

        letter-spacing: 3px;
    }

    .description {
        font-size: 11px;
    }

}

</style>
</head>


<body>

<!-- 星空 -->
<div class="stars"></div>

<!-- 中央蓝色雾光 -->
<div class="ambient-light"></div>

<!-- 魔法星盘 -->
<div class="magic-circle"></div>

<!-- 边框 -->
<div class="frame"></div>


<!-- =====================================================
     顶部导航
===================================================== -->

<nav>

    <a href="index.html" class="logo">

        <div class="logo-symbol">
            ✦
        </div>

        <div class="logo-text">

            <span class="logo-cn">
                赛垭弥大陆档案馆
            </span>

            <span class="logo-en">
                SEYAMI ARCHIVE
            </span>

        </div>

    </a>


    <div class="nav-links">

        <a href="index.html" class="active">
            首页
        </a>

        <a href="archive.html">
            档案目录
        </a>

        <a href="#">
            关于我们
        </a>

    </div>

</nav>


<!-- =====================================================
     主视觉
===================================================== -->

<main class="hero">

    <!-- 装饰星星 -->

    <div class="star-decoration star-1">
        ✦
    </div>

    <div class="star-decoration star-2">
        ✧
    </div>

    <div class="star-decoration star-3">
        ⋆
    </div>

    <div class="star-decoration star-4">
        ✦
    </div>


    <div class="hero-content">

        <!-- 中央小星星 -->

        <div class="center-star">
            ✦
        </div>


        <!-- 超大的英文 -->

        <h1 class="title-en">
            SEYAMI ARCHIVE
        </h1>


        <!-- 装饰线 -->

        <div class="title-line"></div>


        <!-- 中文放在英文下面 -->

        <h2 class="title-cn">
            赛垭弥大陆档案馆
        </h2>


        <!-- 简介 -->

        <p class="description">
            记录关于这片大陆的一切。
            <br>
            角色、种族、地域、历史，
            以及那些尚未被发现的故事。
        </p>


        <!-- 进入档案馆 -->

        <a href="archive.html" class="enter-btn">

            进入档案馆
            <span style="margin-left:12px;">
                →
            </span>

        </a>

    </div>

</main>


<!-- =====================================================
     底部
===================================================== -->

<footer class="footer">

    ✦ &nbsp;&nbsp;
    THE ARCHIVES OF SEYAMI
    &nbsp;&nbsp; ✦

</footer>


</body>
</html>
