<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;
    overflow-x:hidden;
    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}

.page{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;
}


/* =========================================================
   背景星空
========================================================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:-20%;

    background-image:
        radial-gradient(
            circle,
            rgba(182,220,255,.7) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(130,191,239,.45) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(220,240,255,.35) 0 1px,
            transparent 1.5px
        );

    background-size:
        180px 180px,
        240px 240px,
        310px 310px;

    background-position:
        20px 30px,
        80px 120px,
        150px 70px;

    opacity:.45;

    animation:
        starMove
        35s
        linear
        infinite;
}

.stars::after{
    opacity:.22;

    transform:scale(1.15);

    animation-duration:50s;
}

@keyframes starMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-80px,50px,0);
    }

}


/* =========================================================
   浮动星星
========================================================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.floating-stars span{
    position:absolute;

    color:rgba(158,207,247,.62);

    font-family:serif;
    font-size:14px;

    text-shadow:
        0 0 8px rgba(96,177,242,.5);

    animation:
        floatStar
        6s
        ease-in-out
        infinite;
}


/* =========================================================
   原有12颗
========================================================= */

    left:12%;
    top:24%;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:20%;
    top:67%;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(3){

    top:22%;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:84%;
    top:70%;
    animation-delay:1s;
}

.floating-stars span:nth-child(5){
    left:30%;
    top:17%;
    animation-delay:3s;
}

.floating-stars span:nth-child(6){
    left:71%;
    top:61%;
    animation-delay:2s;
}

.floating-stars span:nth-child(7){
    left:16%;
    top:46%;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:89%;
    top:43%;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(9){

    top:11%;

    top:83%;

}

.floating-stars span:nth-child(14){

}

.floating-stars span:nth-child(15){

    top:19%;
    animation-delay:1.7s;
}

.floating-stars span:nth-child(16){
    left:73%;
    top:36%;

}

.floating-stars span:nth-child(17){

    top:58%;

}

.floating-stars span:nth-child(18){
    left:11%;
    top:58%;

}

.floating-stars span:nth-child(19){

}


@keyframes floatStar{

    100%{

        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{

        transform:

/* =========================================================
   外框
========================================================= */

.frame{
    position:absolute;
    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;
    z-index:10;
}

.frame::before{

    position:absolute;
    inset:7px;

    border:

/* =========================================================

========================================================= */

.corner{

    width:68px;
    height:68px;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.corner::before{

    display:block;

    font-family:
        "Times New Roman",
        serif;

    font-size:40px;
    font-weight:400;

.corner.tl{

.corner.tr{

.corner.bl{

    bottom:-34px;
}

    bottom:-34px;

/* =========================================================
   顶部导航
========================================================= */

.top-nav{

    left:58px;
    right:58px;
    top:38px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

.logo{

    gap:10px;

    color:#d9edff;

    text-decoration:none;
}

.logo-mark{

    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;
    font-weight:400;

        rgba(137,201,239,.9);

.logo-text{

    flex-direction:column;

}

.logo-cn{

        "Noto Serif SC",
        serif;

    font-weight:400;

}

.logo-en{

    font-family:

}

.nav-links{

    align-items:center;

}

.nav-links a{

    text-decoration:none;

    font-family:

        serif;

    font-size:12px;

    transition:

        text-shadow .3s ease;
}

.nav-links a::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-8px;

    width:0;
    height:1px;

    background:
        rgba(122,192,235,.7);

    transform:
        translateX(-50%);

    transition:
        width .3s ease;
}

.nav-links a:hover{
    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}

.nav-links a:hover::after{

}


/* =========================================================
   日间模式按钮
   注意：
   position:absolute 不参与原导航宽度计算
========================================================= */

.theme-toggle{
    position:absolute;

    right:0;
    top:45px;

    height:25px;

    padding:0 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;

    border:
        1px solid
        rgba(111,174,224,.28);

    background:
        rgba(7,25,43,.42);

    font-family:
        "Cinzel",

    font-size:7px;

    letter-spacing:1.5px;

    white-space:nowrap;

        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.theme-toggle:hover{

    color:#dcefff;

    border-color:
        rgba(111,183,230,.55);

    background:
        rgba(12,39,63,.58);

    box-shadow:
        0 0 14px

}

.theme-icon{

    font-family:serif;

    font-size:11px;

    line-height:1;
}


/* =========================================================
   主体
========================================================= */

.main{
    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:5;

    padding:
        80px
        20px
        70px;
}


/* =========================================================
   魔法圆阵
========================================================= */

.magic-circle{
    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    opacity:.55;
}

.magic-circle::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.28);

    box-shadow:
        0 0 22px
        rgba(47,126,184,.08);

    animation:
        rotateCircle
        80s
        linear
        infinite;
}

.magic-circle::after{
    content:"";

    position:absolute;

    inset:27px;

    border-radius:50%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        inset
        0 0 20px
        rgba(62,139,194,.04);

    animation:
        rotateCircleReverse
        55s
        linear
        infinite;
}

@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* =========================================================
   三重魔法星轨
========================================================= */

.orbit-system{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;
}

.orbit-track{
    fill:none;

    stroke:
        rgba(69,164,230,.28);

    stroke-width:1;

    vector-effect:
        non-scaling-stroke;

    filter:
        drop-shadow(
            0 0 4px
            rgba(70,155,210,.10)
        );
}


/* =========================================================
   小星辰
========================================================= */

#travellingStar{
    font-family:
        "Times New Roman",
        serif;

    font-size:15px;

    fill:
        rgba(190,228,255,.95);

    text-anchor:middle;

    dominant-baseline:middle;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 3px
            rgba(131,207,250,.9)
        )
        drop-shadow(
            0 0 8px
            rgba(74,165,224,.55)
        );
}

.star-glow{
    fill:
        rgba(143,210,246,.08);

    filter:blur(2px);

    pointer-events:none;
}


/* =========================================================
   中央魔法线
========================================================= */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(92,164,213,.13);
}

.magic-line.horizontal{
    width:490px;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:490px;
}


/* =========================================================
   中央小圆
========================================================= */

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(133,202,242,.48);

    border-radius:50%;

    box-shadow:
        0 0 10px
        rgba(88,171,224,.25);
}

.magic-center::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(174,221,249,.7);

    box-shadow:
        0 0 8px

}

.enter-wrap{

    align-items:center;

    inset:0;

            0 20%,
            5% 20%,
            8% 0,
            92% 0,
            95% 20%,

            100% 80%,
            95% 80%,
            92% 100%,
            8% 100%,
            5% 80%,

<script>

/* =========================================================

(function(){

    const toggle =
        document.getElementById(
            "themeToggle"
        );

    const icon =
        document.getElementById(
            "themeIcon"
        );

    const text =
        document.getElementById(
            "themeText"
        );

    if(
        !toggle ||
        !icon ||
        !text
    ){
        return;
    }


    function updateButton(){

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );

        if(isDay){

            icon.textContent = "☀";

            text.textContent = "DAY";

        }else{

            icon.textContent = "☾";

            text.textContent = "NIGHT";

        }

    }


    const savedTheme =
        localStorage.getItem(
            "seyami-theme"
        );


    if(
        savedTheme === "day"
    ){

        document.body.classList.add(
            "day-mode"
        );

    }


    updateButton();


    toggle.addEventListener(
        "click",
        function(){

            const isDay =
                document.body.classList.toggle(
                    "day-mode"
                );


            localStorage.setItem(
                "seyami-theme",
                isDay
                    ? "day"
                    : "night"
            );


            updateButton();

        }
    );

})();


/* =========================================================
   星轨 JS
========================================================= */

(function(){

    const star =
        document.getElementById(
            "travellingStar"
        );

    const glow =
        document.getElementById(
            "starGlow"
        );

    if(
        !star ||
        !glow
    ){
        return;
    }

    const CX = 280;
    const CY = 280;

    const tracks = [

        {
            id:"A",
            rx:250,
            ry:95,
            rotation:0,
            speed:360 / 38,
            direction:1
        },

        {
            id:"B",
            rx:210,
            ry:72.5,
            rotation:55,
            speed:-360 / 32,
            direction:-1
        },

        {
            id:"C",
            rx:165,
            ry:52.5,
            rotation:110,
            speed:360 / 25,
            direction:1
        }

    ];

    let currentTrack = 0;

    let starAngle = 300;

    let targetAngle = null;

    let switching = false;

    const animationStart =
        performance.now();

    let lastTime =
        animationStart;


    function degToRad(angle){

        return angle *
               Math.PI /
               180;

    }


    function radToDeg(angle){

        return angle *
               180 /
               Math.PI;

    }


    function normalize(angle){

        angle %= 360;

        if(
            angle < 0
        ){
            angle += 360;
        }

        return angle;

    }


    function getRotation(
        track,
        elapsed
    ){

        return (
            track.rotation +
            track.speed *
            elapsed /
            1000
        );

    }


    function getPoint(
        track,
        angle,
        elapsed
    ){

        const rad =
            degToRad(angle);

        const localX =
            track.rx *
            Math.cos(rad);

        const localY =
            track.ry *
            Math.sin(rad);

        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );

        const cos =
            Math.cos(rotation);

        const sin =
            Math.sin(rotation);

        const worldX =
            localX * cos -
            localY * sin;

        const worldY =
            localX * sin +
            localY * cos;

        return {

            x:
                CX + worldX,

            y:
                CY + worldY

        };

    }


    function worldToTrackAngle(
        track,
        x,
        y,
        elapsed
    ){

        let dx =
            x - CX;

        let dy =
            y - CY;

        const rotation =
            degToRad(
                getRotation(
                    track,
                    elapsed
                )
            );

        const cos =
            Math.cos(
                -rotation
            );

        const sin =
            Math.sin(
                -rotation
            );

        const localX =
            dx * cos -
            dy * sin;

        const localY =
            dx * sin +
            dy * cos;

        const angle =
            radToDeg(
                Math.atan2(
                    localY / track.ry,
                    localX / track.rx
                )
            );

        return normalize(
            angle
        );

    }


    function findIntersection(
        trackA,
        trackB,
        elapsed,
        fromAngle
    ){

        const samples = 720;

        let best = null;

        let bestDistance =
            Infinity;

        for(
            let i = 0;
            i < samples;
            i++
        ){

            const angleA =
                i *
                360 /
                samples;

            const pointA =
                getPoint(
                    trackA,
                    angleA,
                    elapsed
                );

            const angleB =
                worldToTrackAngle(
                    trackB,
                    pointA.x,
                    pointA.y,
                    elapsed
                );

            const pointB =
                getPoint(
                    trackB,
                    angleB,
                    elapsed
                );

            const dx =
                pointA.x -
                pointB.x;

            const dy =
                pointA.y -
                pointB.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            let travel =
                normalize(
                    (
                        angleA -
                        fromAngle
                    ) *
                    trackA.direction
                );

            if(
                travel < 0
            ){

                travel += 360;

            }

            if(
                distance <
                    bestDistance
                &&
                travel > 2
            ){

                bestDistance =
                    distance;

                best = {

                    angleA,

                    angleB,

                    x:
                        (
                            pointA.x +
                            pointB.x
                        ) / 2,

                    y:
                        (
                            pointA.y +
                            pointB.y
                        ) / 2,

                    distance,

                    travel

                };

            }

        }


        if(
            !best ||
            best.distance > 8
        ){

            best = null;

            bestDistance =
                Infinity;

            for(
                let i = 0;
                i < samples;
                i++
            ){

                const angleA =
                    i *
                    360 /
                    samples;

                const pointA =
                    getPoint(
                        trackA,
                        angleA,
                        elapsed
                    );

                const angleB =
                    worldToTrackAngle(
                        trackB,
                        pointA.x,
                        pointA.y,
                        elapsed
                    );

                const pointB =
                    getPoint(
                        trackB,
                        angleB,
                        elapsed
                    );

                const dx =
                    pointA.x -
                    pointB.x;

                const dy =
                    pointA.y -
                    pointB.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );

                if(
                    distance <
                    bestDistance
                ){

                    bestDistance =
                        distance;

                    best = {

                        angleA,

                        angleB,

                        x:
                            (
                                pointA.x +
                                pointB.x
                            ) / 2,

                        y:
                            (
                                pointA.y +
                                pointB.y
                            ) / 2,

                        distance

                    };

                }

            }

        }

        return best;

    }


    function setNextTarget(
        elapsed
    ){

        const nextTrackIndex =
            (
                currentTrack +
                1
            ) % 3;

        const current =
            tracks[
                currentTrack
            ];

        const next =
            tracks[
                nextTrackIndex
            ];

        const intersection =
            findIntersection(
                current,
                next,
                elapsed,
                starAngle
            );

        if(!intersection){
            return;
        }

        targetAngle =
            intersection.angleA;

        switching = true;

    }


    function updateOrbits(
        elapsed
    ){

        const groupA =
            document.getElementById(
                "orbitA"
            );

        const groupB =
            document.getElementById(
                "orbitB"
            );

        const groupC =
            document.getElementById(
                "orbitC"
            );

        if(groupA){

            groupA.setAttribute(
                "transform",

                `rotate(
                    ${getRotation(
                        tracks[0],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }

        if(groupB){

            groupB.setAttribute(
                "transform",

                `rotate(
                    ${getRotation(
                        tracks[1],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }

        if(groupC){

            groupC.setAttribute(
                "transform",

                `rotate(
                    ${getRotation(
                        tracks[2],
                        elapsed
                    )}
                    ${CX}
                    ${CY}
                )`
            );

        }

    }


    function updateStar(
        elapsed
    ){

        const track =
            tracks[
                currentTrack
            ];

        const point =
            getPoint(
                track,
                starAngle,
                elapsed
            );

        star.setAttribute(
            "x",
            point.x.toFixed(3)
        );

        star.setAttribute(
            "y",
            point.y.toFixed(3)
        );

        glow.setAttribute(
            "cx",
            point.x.toFixed(3)
        );

        glow.setAttribute(
            "cy",
            point.y.toFixed(3)
        );

    }


    const STAR_SPEED = 11;


    function animate(now){

        const elapsed =
            now -
            animationStart;

        const delta =
            Math.min(
                0.05,
                (
                    now -
                    lastTime
                ) / 1000
            );

        updateOrbits(
            elapsed
        );

        if(!switching){

            setNextTarget(
                elapsed
            );

        }

        if(
            switching &&
            targetAngle !== null
        ){

            const track =
                tracks[
                    currentTrack
                ];

            const direction =
                track.direction;

            let distance =
                normalize(
                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction
                );

            let speed =
                STAR_SPEED;

            if(
                distance < 25
            ){

                speed *=
                    Math.max(
                        0.25,
                        distance / 25
                    );

            }

            starAngle +=
                speed *
                direction *
                delta;

            starAngle =
                normalize(
                    starAngle
                );

            distance =
                normalize(
                    (
                        targetAngle -
                        starAngle
                    ) *
                    direction
                );

            if(
                distance < 1
            ){

                const intersection =
                    getPoint(
                        track,
                        targetAngle,
                        elapsed
                    );

                const nextTrackIndex =
                    (
                        currentTrack +
                        1
                    ) % 3;

                const nextTrack =
                    tracks[
                        nextTrackIndex
                    ];

                const nextAngle =
                    worldToTrackAngle(
                        nextTrack,
                        intersection.x,
                        intersection.y,
                        elapsed
                    );

                currentTrack =
                    nextTrackIndex;

                starAngle =
                    nextAngle;

                targetAngle =
                    null;

                switching =
                    false;

                starAngle =
                    normalize(
                        starAngle +
                        tracks[
                            currentTrack
                        ].direction *
                        0.8
                    );

            }

        }

        updateStar(
            elapsed
        );

        lastTime =
            now;

        requestAnimationFrame(
            animate
        );

    }


    starAngle = 300;

    updateOrbits(0);

    updateStar(0);

    requestAnimationFrame(
        animate
    );


})();

</script>
