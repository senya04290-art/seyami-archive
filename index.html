<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    position:relative;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(14,44,79,.30) 0%,
            rgba(6,27,52,.45) 28%,
            rgba(2,15,31,.82) 62%,
            #020a16 100%
        );

    color:#dce8f3;

    font-family:
        "Noto Serif SC",
        "Times New Roman",
        serif;
}


/* =========================
   星空背景
========================= */

.space{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;

    background:#b9d4eb;

    box-shadow:
        0 0 4px rgba(105,158,194,.48),
        0 0 9px rgba(48,101,145,.28);

    opacity:.75;
}

.dust{
    position:absolute;
    width:1px;
    height:1px;
    border-radius:50%;

    background:rgba(137,181,211,.55);

    box-shadow:
        0 0 4px rgba(91,142,177,.3);

    opacity:.5;
}

.big-star{
    position:absolute;
    width:4px;
    height:4px;

    background:#c8ddea;

    box-shadow:
        0 0 7px #5e8fb5,
        0 0 17px rgba(45,95,137,.6);

    transform:rotate(45deg);
}

.big-star::before,
.big-star::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;

    background:inherit;

    transform:translate(-50%,-50%);
}

.big-star::before{
    width:1px;
    height:16px;
}

.big-star::after{
    width:16px;
    height:1px;
}


/* =========================
   外框
========================= */

.frame{
    position:fixed;
    inset:15px;

    border:1px solid rgba(61,113,153,.36);

    pointer-events:none;
    z-index:20;
}

.frame::before,
.frame::after{
    content:"";
    position:absolute;
    left:24px;
    right:24px;
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(65,126,173,.55),
            transparent
        );
}

.frame::before{
    top:15px;
}

.frame::after{
    bottom:15px;
}


/* =========================
   四角六芒星
========================= */

.corner{
    position:absolute;

    width:72px;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.six-star{
    display:block;

    font-family:
        "Times New Roman",
        "Noto Serif SC",
        serif;

    font-size:58px;
    font-weight:400;
    line-height:1;

    color:rgba(103,163,207,.72);

    text-shadow:
        0 0 5px rgba(65,125,173,.32),
        0 0 12px rgba(45,98,145,.2);
}

.corner.tl{
    left:-1px;
    top:-1px;
}

.corner.tr{
    right:-1px;
    top:-1px;
}

.corner.bl{
    left:-1px;
    bottom:-1px;
}

.corner.br{
    right:-1px;
    bottom:-1px;
}


/* =========================
   魔法阵
========================= */

.magic-circle{
    position:fixed;

    width:510px;
    height:510px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        rotate(-8deg);

    opacity:.39;

    pointer-events:none;
    z-index:1;

    filter:
        drop-shadow(
            0 0 12px rgba(38,101,169,.28)
        );
}


/* 圆环 */

.circle{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(70,139,190,.32);

    border-radius:50%;

    transform:
        translate(-50%,-50%);
}

.c1{
    width:100%;
    height:100%;
}

.c2{
    width:88%;
    height:88%;
}

.c3{
    width:73%;
    height:73%;
}

.c4{
    width:56%;
    height:56%;
}

.c5{
    width:38%;
    height:38%;
}


/* 圆环上的细线 */

.magic-circle .circle::before,
.magic-circle .circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(73,143,194,.22);
}

.c2::before{
    width:116%;
    height:1px;
}

.c3::before{
    width:1px;
    height:116%;
}


/* =========================
   椭圆星轨
========================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(78,147,196,.28);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    animation:
        orbitRotate
        32s
        linear
        infinite;
}

.o1{
    width:108%;
    height:52%;

    transform:
        translate(-50%,-50%)
        rotate(28deg);
}

.o2{
    width:105%;
    height:58%;

    transform:
        translate(-50%,-50%)
        rotate(-34deg);

    animation-duration:38s;
    animation-direction:reverse;
}

.o3{
    width:112%;
    height:42%;

    transform:
        translate(-50%,-50%)
        rotate(74deg);

    animation-duration:44s;
}

@keyframes orbitRotate{
    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =========================
   魔法阵十字线
========================= */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(71,137,184,.28),
            transparent
        );

    transform:
        translate(-50%,-50%);
}

.magic-line.horizontal{
    width:116%;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:116%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(71,137,184,.28),
            transparent
        );
}


/* 中心几何星形 */

.magic-circle::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:37%;
    height:37%;

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    border:
        1px solid rgba(77,146,196,.3);

    clip-path:
        polygon(
            50% 0%,
            93% 25%,
            93% 75%,
            50% 100%,
            7% 75%,
            7% 25%
        );
}

.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:29%;
    height:29%;

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    border:
        1px solid rgba(77,146,196,.25);

    clip-path:
        polygon(
            50% 0%,
            93% 25%,
            93% 75%,
            50% 100%,
            7% 75%,
            7% 25%
        );
}


/* =========================
   页面主体
========================= */

.page{
    position:relative;

    min-height:100vh;

    display:flex;
    flex-direction:column;

    z-index:5;
}


/* =========================
   顶部
========================= */

header{
    position:relative;

    width:100%;

    padding:
        34px
        52px
        0;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    z-index:10;
}

.logo{
    display:flex;
    flex-direction:column;

    text-decoration:none;

    color:#a8c4d8;

    letter-spacing:.16em;

    line-height:1.4;
}

.logo-cn{
    font-size:15px;
    font-weight:400;
}

.logo-en{
    font-family:
        "Cormorant Garamond",
        serif;

    font-size:11px;

    letter-spacing:.3em;

    color:rgba(122,165,193,.72);
}

nav{
    display:flex;
    gap:30px;

    align-items:center;
}

nav a{
    text-decoration:none;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:13px;

    letter-spacing:.2em;

    color:rgba(153,187,210,.7);

    transition:.3s;
}

nav a:hover{
    color:#c6dce9;
}

.nav-star{
    font-size:13px;
    color:rgba(103,158,191,.7);
}


/* =========================
   Hero
========================= */

.hero{
    min-height:calc(100vh - 120px);

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    z-index:5;
}

.hero-content{
    width:min(
        1000px,
        calc(100% - 70px)
    );

    margin-top:105px;

    text-align:center;
}


/* =========================
   标题
========================= */

.title{
    display:flex;
    flex-direction:column;
    align-items:center;

    margin:0;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(
            58px,
            9vw,
            112px
        );

    font-weight:300;

    line-height:.82;

    letter-spacing:
        .12em;

    color:#d3e2ec;

    text-shadow:
        0 0 5px rgba(180,210,235,.25),
        0 0 18px rgba(48,101,145,.2);
}

.title span{
    display:block;
}

.title span:last-child{
    font-size:.96em;

    letter-spacing:
        .17em;

    margin-left:.12em;
}


/* =========================
   中文副标题
========================= */

.subtitle{
    margin-top:30px;

    font-size:14px;

    letter-spacing:.48em;

    color:rgba(148,183,205,.78);

    font-weight:300;
}


/* =========================
   标题装饰
========================= */

.title-decoration{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:15px;

    margin-top:27px;
}

.title-decoration::before,
.title-decoration::after{
    content:"";

    width:72px;
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(85,143,181,.6)
        );
}

.title-decoration::after{
    background:
        linear-gradient(
            to left,
            transparent,
            rgba(85,143,181,.6)
        );
}

.title-decoration span{
    font-family:
        "Cormorant Garamond",
        serif;

    font-size:14px;

    color:rgba(101,159,195,.72);
}


/* =========================
   中央星星
========================= */

.center-star{
    width:8px;
    height:8px;

    margin:
        29px
        auto
        26px;

    position:relative;

    transform:rotate(45deg);

    background:#b7d0df;

    box-shadow:
        0 0 7px rgba(76,130,164,.7),
        0 0 18px rgba(45,94,130,.42);
}

.center-star::before,
.center-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:#b7d0df;
}

.center-star::before{
    width:1px;
    height:24px;
}

.center-star::after{
    width:24px;
    height:1px;
}


/* =========================
   简介
========================= */

.description{
    max-width:580px;

    margin:
        0
        auto;

    font-size:13px;

    line-height:2.1;

    letter-spacing:.15em;

    color:rgba(139,171,193,.72);

    font-weight:300;
}


/* =========================
   进入按钮
========================= */

.enter-wrap{
    margin-top:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;
}

.button-star{
    font-family:
        "Cormorant Garamond",
        serif;

    font-size:13px;

    color:rgba(88,148,185,.7);
}

.enter-button{
    position:relative;

    min-width:260px;

    padding:
        14px
        28px;

    border:
        1px solid rgba(76,137,176,.55);

    background:
        rgba(4,20,38,.34);

    text-decoration:none;

    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;

    font-size:14px;

    letter-spacing:.3em;

    color:#b9d0df;

    transition:
        background .35s,
        border-color .35s,
        box-shadow .35s,
        color .35s;
}

.enter-button::before,
.enter-button::after{
    content:"";

    position:absolute;

    left:12px;
    right:12px;

    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(101,157,191,.58),
            transparent
        );
}

.enter-button::before{
    top:-5px;
}

.enter-button::after{
    bottom:-5px;
}

.enter-button:hover{
    color:#d8e8f1;

    background:
        rgba(20,52,77,.26);

    border-color:
        rgba(105,165,197,.75);

    box-shadow:
        0 0 18px
        rgba(45,96,131,.18);
}


/* =========================
   底部
========================= */

footer{
    position:absolute;

    left:0;
    right:0;
    bottom:25px;

    text-align:center;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:11px;

    letter-spacing:.32em;

    color:rgba(92,137,163,.52);

    z-index:10;
}


/* =========================
   响应式
========================= */

@media(max-width:900px){

    header{
        padding:
            30px
            35px
            0;
    }

    nav{
        gap:18px;
    }

    .magic-circle{
        width:470px;
        height:470px;
    }

    .hero-content{
        width:
            calc(100% - 50px);
    }
}


@media(max-width:600px){

    .frame{
        inset:9px;
    }

    .frame::before,
    .frame::after{
        left:15px;
        right:15px;
    }

    header{
        padding:
            27px
            27px
            0;
    }

    .logo-cn{
        font-size:12px;
    }

    .logo-en{
        font-size:8px;
    }

    nav{
        gap:12px;
    }

    nav a{
        font-size:10px;
        letter-spacing:.12em;
    }

    .nav-star{
        font-size:10px;
    }


    /* 四角六芒星缩小 */

    .corner{
        width:58px;
        height:58px;
    }

    .six-star{
        font-size:45px;
    }


    /* 魔法阵保留 */

    .magic-circle{
        width:390px;
        height:390px;

        opacity:.36;
    }


    /* 中间整体继续往下 */

    .hero{
        min-height:
            calc(100vh - 100px);
    }

    .hero-content{
        width:
            calc(100% - 30px);

        margin-top:85px;
    }


    .title{
        font-size:
            clamp(
                52px,
                16vw,
                82px
            );

        line-height:.84;

        letter-spacing:.1em;
    }

    .title span:last-child{
        letter-spacing:.13em;
    }


    .subtitle{
        margin-top:25px;

        font-size:12px;

        letter-spacing:.3em;
    }


    .title-decoration{
        margin-top:23px;
    }

    .title-decoration::before,
    .title-decoration::after{
        width:45px;
    }


    .center-star{
        margin-top:25px;
        margin-bottom:22px;
    }


    .description{
        padding:
            0
            10px;

        font-size:11px;

        line-height:2;

        letter-spacing:.1em;
    }


    .enter-wrap{
        margin-top:32px;
    }

    .enter-button{
        min-width:220px;

        padding:
            13px
            18px;

        font-size:12px;

        letter-spacing:.22em;
    }

    .button-star{
        font-size:10px;
    }


    footer{
        bottom:18px;

        font-size:8px;

        letter-spacing:.22em;
    }
}


@media(max-width:380px){

    .corner{
        width:50px;
        height:50px;
    }

    .six-star{
        font-size:39px;
    }

    .magic-circle{
        width:350px;
        height:350px;
    }

    .hero-content{
        margin-top:78px;
    }

    .title{
        font-size:48px;
    }

    .subtitle{
        font-size:10px;
    }

    .description{
        font-size:10px;
    }

    .enter-button{
        min-width:205px;
    }
}

</style>
</head>


<body>


<!-- =========================
     星空
========================= -->

<div class="space" id="space"></div>


<!-- =========================
     外框
========================= -->

<div class="frame">

    <div class="corner tl">
        <span class="six-star">✡</span>
    </div>

    <div class="corner tr">
        <span class="six-star">✡</span>
    </div>

    <div class="corner bl">
        <span class="six-star">✡</span>
    </div>

    <div class="corner br">
        <span class="six-star">✡</span>
    </div>

</div>


<!-- =========================
     魔法阵 / 多层星轨
========================= -->

<div class="magic-circle">

    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
    <div class="circle c5"></div>

    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>

    <div class="magic-line horizontal"></div>
    <div class="magic-line vertical"></div>

</div>


<!-- =========================
     页面
========================= -->

<div class="page">


    <!-- 顶部 -->

    <header>

        <a href="index.html" class="logo">

            <span class="logo-cn">
                塞垭弥大陆档案馆
            </span>

            <span class="logo-en">
                SEYAMI ARCHIVE
            </span>

        </a>


        <nav>

            <a href="index.html">
                HOME
            </a>

            <span class="nav-star">✦</span>

            <a href="archive.html">
                ARCHIVE
            </a>

            <span class="nav-star">✦</span>

            <a href="about.html">
                ABOUT
            </a>

        </nav>

    </header>


    <!-- 中央内容 -->

    <main class="hero">

        <div class="hero-content">


            <h1 class="title">

                <span>SEYAMI</span>

                <span>ARCHIVE</span>

            </h1>


            <div class="subtitle">
                塞 垭 弥 大 陆 档 案 馆
            </div>


            <div class="title-decoration">
                <span>✦</span>
            </div>


            <div class="center-star"></div>


            <p class="description">
                记录关于塞垭弥大陆的一切。
                <br>
                角色、国度、传说与那些尚未被书写的故事。
            </p>


            <div class="enter-wrap">

                <span class="button-star">✦</span>

                <a
                    href="archive.html"
                    class="enter-button"
                >
                    进入档案馆　→
                </a>

                <span class="button-star">✦</span>

            </div>


        </div>

    </main>


    <!-- 底部 -->

    <footer>
        ✦ THE ARCHIVES OF SEYAMI ✦
    </footer>


</div>


<script>

/* =========================
   星空生成
========================= */

const space =
    document.getElementById("space");


/* 普通星星 */

for(let i = 0; i < 95; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const size =
        Math.random() * 1.8 + .7;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.opacity =
        Math.random() * .65 + .2;

    space.appendChild(star);
}


/* 小型星尘 */

for(let i = 0; i < 18; i++){

    const dust =
        document.createElement("div");

    dust.className = "dust";

    dust.style.left =
        Math.random() * 100 + "%";

    dust.style.top =
        Math.random() * 100 + "%";

    dust.style.opacity =
        Math.random() * .45 + .15;

    space.appendChild(dust);
}


/* 大星星 */

const bigStarPositions = [

    [18,19],
    [82,22],
    [13,73],
    [88,76],
    [69,12],
    [32,82]

];

bigStarPositions.forEach(
    ([x,y], index) => {

        const star =
            document.createElement("div");

        star.className =
            "big-star";

        star.style.left =
            x + "%";

        star.style.top =
            y + "%";

        star.style.opacity =
            index % 2 === 0
                ? ".7"
                : ".5";

        space.appendChild(star);

    }
);

</script>

</body>
</html>
