<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>


<!-- =========================
     字体
========================= -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    background:#061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;
}


/* =========================
   页面背景
========================= */

.page{

    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(24,69,108,.16),
            transparent 38%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(29,80,119,.10),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(23,65,105,.08),
            transparent 35%
        ),

        #061426;
}


/* =========================
   星尘背景
========================= */

.starfield{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.starfield::before,
.starfield::after{

    content:"";

    position:absolute;

    inset:-20%;

    background-image:

        radial-gradient(
            circle,
            rgba(188,225,255,.75) 0 1px,
            transparent 1.5px
        );

    background-size:
        120px 120px;

    opacity:.28;

    animation:
        starMove
        35s
        linear
        infinite;
}

.starfield::after{

    background-size:
        180px 180px;

    opacity:.18;

    animation-duration:
        50s;

    animation-direction:
        reverse;
}

@keyframes starMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(120px,80px);
    }

}


/* =========================
   浮动星星
========================= */

.floating-stars{

    position:absolute;

    inset:0;

    pointer-events:none;
}

.floating-stars span{

    position:absolute;

    color:
        rgba(150,211,245,.68);

    font-family:
        "Times New Roman",
        serif;

    animation:
        floatStar
        6s
        ease-in-out
        infinite;
}

.floating-stars span:nth-child(1){
    left:14%;
    top:23%;
    font-size:14px;
    animation-delay:-1s;
}

.floating-stars span:nth-child(2){
    left:23%;
    top:68%;
    font-size:9px;
    animation-delay:-3s;
}

.floating-stars span:nth-child(3){
    left:77%;
    top:22%;
    font-size:12px;
    animation-delay:-2s;
}

.floating-stars span:nth-child(4){
    left:86%;
    top:66%;
    font-size:8px;
    animation-delay:-4s;
}

.floating-stars span:nth-child(5){
    left:67%;
    top:13%;
    font-size:10px;
    animation-delay:-5s;
}

.floating-stars span:nth-child(6){
    left:32%;
    top:17%;
    font-size:7px;
    animation-delay:-2.5s;
}

.floating-stars span:nth-child(7){
    left:12%;
    top:48%;
    font-size:9px;
    animation-delay:-4.5s;
}

.floating-stars span:nth-child(8){
    left:91%;
    top:39%;
    font-size:11px;
    animation-delay:-1.5s;
}

.floating-stars span:nth-child(9){
    left:73%;
    top:78%;
    font-size:8px;
    animation-delay:-3.5s;
}

.floating-stars span:nth-child(10){
    left:38%;
    top:84%;
    font-size:10px;
    animation-delay:-5.5s;
}

.floating-stars span:nth-child(11){
    left:55%;
    top:8%;
    font-size:8px;
    animation-delay:-2s;
}

.floating-stars span:nth-child(12){
    left:5%;
    top:76%;
    font-size:9px;
    animation-delay:-4s;
}

@keyframes floatStar{

    0%,
    100%{
        opacity:.25;
        transform:translateY(0) scale(.9);
    }

    50%{
        opacity:.9;
        transform:translateY(-8px) scale(1.15);
    }

}


/* =========================
   外框
========================= */

.frame{

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;
}


/* =========================
   四角六芒星
========================= */

.corner{

    position:absolute;

    color:
        rgba(141,204,240,.78);

    font-family:
        "Times New Roman",
        serif;

    font-size:31px;

    line-height:1;

    text-shadow:
        0 0 8px
        rgba(65,151,211,.45);
}

.corner.tl{
    left:8px;
    top:7px;
}

.corner.tr{
    right:8px;
    top:7px;
}

.corner.bl{
    left:8px;
    bottom:7px;
}

.corner.br{
    right:8px;
    bottom:7px;
}


/* =========================
   顶部导航
========================= */

.top-nav{

    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    display:flex;

    justify-content:
        space-between;

    align-items:flex-start;

    z-index:10;
}


/* =========================
   左上角 LOGO
========================= */

.logo{

    display:flex;

    align-items:baseline;

    gap:10px;
}

.logo-mark{

    width:auto;
    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    font-weight:400;

    line-height:1;

    color:
        rgba(137,201,239,.9);

    position:relative;

    top:1px;

    text-shadow:

        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);
}

.logo-text{

    display:flex;

    flex-direction:column;

    gap:2px;
}

.logo-cn{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;

    font-weight:400;

    letter-spacing:
        .18em;

    color:
        rgba(218,236,250,.92);
}

.logo-en{

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:10px;

    letter-spacing:
        .28em;

    color:
        rgba(132,189,222,.7);
}


/* =========================
   导航
========================= */

.nav-links{

    display:flex;

    align-items:center;

    gap:34px;

    padding-top:3px;
}

.nav-links a{

    position:relative;

    text-decoration:none;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:
        .18em;

    color:
        rgba(203,226,244,.72);

    transition:
        color .3s ease;
}

.nav-links a::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-7px;

    width:0;

    height:1px;

    background:
        rgba(105,184,229,.8);

    transform:
        translateX(-50%);

    transition:
        width .3s ease;
}

.nav-links a:hover{

    color:
        rgba(226,242,253,.98);
}

.nav-links a:hover::after{

    width:100%;
}


/* =========================
   主区域
========================= */

.main{

    position:relative;

    width:100%;
    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;
}


/* =========================
   魔法阵整体
========================= */

.magic-circle{

    position:absolute;

    left:50%;
    top:50%;

    width:560px;
    height:560px;

    transform:
        translate(-50%,-50%);

    opacity:.55;

    pointer-events:none;
}


/* =========================
   魔法阵外圈
========================= */

.magic-circle::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:520px;
    height:520px;

    border:
        1px solid
        rgba(73,143,198,.28);

    border-radius:50%;

    transform:
        translate(-50%,-50%);
}

.magic-circle::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:430px;
    height:430px;

    border:
        1px solid
        rgba(91,162,213,.22);

    border-radius:50%;

    transform:
        translate(-50%,-50%);
}


/* =========================
   ★ 星轨
========================= */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(69,164,230,.28);

    border-radius:50%;

    box-shadow:
        0 0 6px
        rgba(70,155,210,.12);

    transform:
        translate(-50%,-50%);
}


/* 第一条星轨
   从 0° 开始 */

.orbit.one{

    width:500px;
    height:190px;

    animation:
        orbitRotateOne
        38s
        linear
        infinite;
}


/* 第二条星轨
   从 55° 开始 */

.orbit.two{

    width:420px;
    height:145px;

    animation:
        orbitRotateTwo
        32s
        linear
        infinite;
}


/* 第三条星轨
   从 110° 开始 */

.orbit.three{

    width:330px;
    height:105px;

    animation:
        orbitRotateThree
        25s
        linear
        infinite;
}


/* 第一条 */

@keyframes orbitRotateOne{

    from{

        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{

        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* 第二条 */

@keyframes orbitRotateTwo{

    from{

        transform:
            translate(-50%,-50%)
            rotate(55deg);
    }

    to{

        transform:
            translate(-50%,-50%)
            rotate(415deg);
    }

}


/* 第三条 */

@keyframes orbitRotateThree{

    from{

        transform:
            translate(-50%,-50%)
            rotate(110deg);
    }

    to{

        transform:
            translate(-50%,-50%)
            rotate(470deg);
    }

}


/* =========================
   魔法十字线
========================= */

.magic-line{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(92,164,213,.13);
}

.magic-line.horizontal{

    width:490px;

    height:1px;
}

.magic-line.vertical{

    width:1px;

    height:490px;
}


/* =========================
   中心
========================= */

.magic-center{

    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    border:
        1px solid
        rgba(123,190,230,.48);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:

        0 0 8px
        rgba(72,158,215,.32),

        0 0 18px
        rgba(57,133,190,.18);
}


/* =========================
   中央内容
========================= */

.content{

    position:relative;

    z-index:5;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* =========================
   英文标题
========================= */

.title{

    display:flex;

    flex-direction:column;

    align-items:center;

    margin:0;

    font-family:
        "Cinzel",
        serif;

    font-weight:400;

    color:
        rgba(225,241,252,.96);

    line-height:.82;

    text-shadow:
        0 0 18px
        rgba(77,155,209,.15);
}

.title .seyami{

    font-size:70px;

    letter-spacing:
        .18em;

    margin-right:
        -.18em;
}

.title .archive{

    font-size:87px;

    letter-spacing:
        .10em;

    margin-right:
        -.10em;

    margin-top:5px;
}


/* =========================
   中文标题
========================= */

.subtitle-cn{

    margin-top:25px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:
        .45em;

    margin-right:
        -.45em;

    color:
        rgba(214,234,248,.82);
}


/* =========================
   描述
========================= */

.description{

    margin-top:14px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:14px;

    letter-spacing:
        .20em;

    color:
        rgba(144,190,219,.65);
}


/* =========================
   进入档案馆按钮
========================= */

.enter-frame{

    position:relative;

    width:370px;

    height:82px;

    margin-top:39px;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* 四角装饰 */

.enter-frame::before,
.enter-frame::after{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border-color:
        rgba(100,180,226,.62);

    border-style:solid;
}

.enter-frame::before{

    left:0;
    top:0;

    border-width:
        1px 0 0 1px;
}

.enter-frame::after{

    right:0;
    bottom:0;

    border-width:
        0 1px 1px 0;
}


/* =========================
   按钮
========================= */

.enter-button{

    position:relative;

    width:300px;
    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    border:
        1px solid
        rgba(105,185,229,.46);

    background:
        rgba(7,27,47,.38);

    color:
        rgba(221,239,250,.92);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:
        .38em;

    padding-left:
        .38em;

    transition:
        all .35s ease;
}

.enter-button::before{

    content:"";

    position:absolute;

    inset:4px;

    border:
        1px solid
        rgba(89,160,208,.18);

    pointer-events:none;
}

.enter-button:hover{

    background:
        rgba(20,62,91,.42);

    border-color:
        rgba(128,203,242,.76);

    box-shadow:

        0 0 16px
        rgba(62,148,207,.16),

        inset 0 0 18px
        rgba(53,126,176,.08);

    transform:
        translateY(-1px);
}


/* =========================
   底部
========================= */

.footer{

    position:absolute;

    left:50%;
    bottom:27px;

    transform:
        translateX(-50%);

    z-index:5;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:11px;

    letter-spacing:
        .28em;

    color:
        rgba(116,164,196,.45);

    white-space:nowrap;
}


/* =========================
   平板
========================= */

@media(max-width:800px){

    .top-nav{

        left:38px;
        right:38px;
    }

    .nav-links{

        gap:20px;
    }

    .magic-circle{

        width:500px;
        height:500px;
    }

    .magic-circle::before{

        width:465px;
        height:465px;
    }

    .magic-circle::after{

        width:385px;
        height:385px;
    }

    .orbit.one{

        width:445px;
        height:169px;
    }

    .orbit.two{

        width:374px;
        height:129px;
    }

    .orbit.three{

        width:294px;
        height:94px;
    }

    .magic-line.horizontal{

        width:435px;
    }

    .magic-line.vertical{

        height:435px;
    }

    .title .seyami{

        font-size:58px;
    }

    .title .archive{

        font-size:72px;
    }

}


/* =========================
   手机
========================= */

@media(max-width:520px){

    .frame{

        inset:11px;
    }

    .corner{

        font-size:23px;
    }

    .corner.tl{
        left:4px;
        top:3px;
    }

    .corner.tr{
        right:4px;
        top:3px;
    }

    .corner.bl{
        left:4px;
        bottom:3px;
    }

    .corner.br{
        right:4px;
        bottom:3px;
    }


    .top-nav{

        left:25px;
        right:25px;
        top:27px;

        align-items:flex-start;
    }


    .logo{

        gap:7px;
    }

    .logo-mark{

        font-size:17px;
    }

    .logo-cn{

        font-size:11px;
        letter-spacing:.12em;
    }

    .logo-en{

        font-size:8px;
        letter-spacing:.20em;
    }


    .nav-links{

        gap:13px;
    }

    .nav-links a{

        font-size:10px;

        letter-spacing:.08em;
    }


    .magic-circle{

        width:390px;
        height:390px;

        opacity:.48;
    }

    .magic-circle::before{

        width:365px;
        height:365px;
    }

    .magic-circle::after{

        width:300px;
        height:300px;
    }


    /* 手机星轨 */

    .orbit.one{

        width:350px;
        height:133px;
    }

    .orbit.two{

        width:295px;
        height:102px;
    }

    .orbit.three{

        width:235px;
        height:75px;
    }


    .magic-line.horizontal{

        width:350px;
    }

    .magic-line.vertical{

        height:350px;
    }


    .title .seyami{

        font-size:43px;

        letter-spacing:.16em;
        margin-right:-.16em;
    }

    .title .archive{

        font-size:53px;

        letter-spacing:.08em;
        margin-right:-.08em;

        margin-top:4px;
    }


    .subtitle-cn{

        margin-top:19px;

        font-size:15px;

        letter-spacing:.30em;
        margin-right:-.30em;
    }


    .description{

        margin-top:11px;

        font-size:11px;

        letter-spacing:.12em;
    }


    .enter-frame{

        width:300px;
        height:70px;

        margin-top:30px;
    }


    .enter-button{

        width:255px;
        height:46px;

        font-size:11px;

        letter-spacing:.28em;

        padding-left:.28em;
    }


    .footer{

        bottom:17px;

        font-size:8px;

        letter-spacing:.18em;
    }

}

</style>
