<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#061426;
    color:#dceeff;
    font-family:"Cormorant Garamond","Noto Serif SC",serif;
}

.page{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 42%,rgba(38,91,137,.18),transparent 38%),
        radial-gradient(circle at 50% 52%,rgba(11,45,75,.45),transparent 72%),
        #061426;
}

/* =========================
   背景星尘
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,rgba(182,220,255,.7) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(130,191,239,.45) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(220,240,255,.35) 0 1px,transparent 1.5px);

    background-size:
        170px 170px,
        240px 240px,
        310px 310px;

    background-position:
        20px 30px,
        90px 120px,
        140px 60px;

    opacity:.55;
}

.stars::after{
    transform:rotate(17deg) scale(1.15);
    opacity:.28;
}

/* =========================
   浮动星星
========================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.floating-stars span{
    position:absolute;
    color:rgba(158,207,247,.62);
    font-size:10px;
    animation:floatStar 7s ease-in-out infinite;
}

.floating-stars span:nth-child(1){left:8%;top:19%;animation-delay:-1s;}
.floating-stars span:nth-child(2){left:16%;top:70%;animation-delay:-4s;}
.floating-stars span:nth-child(3){left:28%;top:14%;animation-delay:-2s;}
.floating-stars span:nth-child(4){left:37%;top:78%;animation-delay:-5s;}
.floating-stars span:nth-child(5){left:49%;top:11%;animation-delay:-3s;}
.floating-stars span:nth-child(6){left:59%;top:83%;animation-delay:-1s;}
.floating-stars span:nth-child(7){left:68%;top:17%;animation-delay:-5s;}
.floating-stars span:nth-child(8){left:76%;top:72%;animation-delay:-2s;}
.floating-stars span:nth-child(9){left:88%;top:23%;animation-delay:-4s;}
.floating-stars span:nth-child(10){left:93%;top:61%;animation-delay:-3s;}
.floating-stars span:nth-child(11){left:13%;top:44%;animation-delay:-2s;}
.floating-stars span:nth-child(12){left:83%;top:46%;animation-delay:-1s;}
.floating-stars span:nth-child(13){left:23%;top:88%;animation-delay:-4s;}
.floating-stars span:nth-child(14){left:42%;top:25%;animation-delay:-2s;}
.floating-stars span:nth-child(15){left:57%;top:30%;animation-delay:-5s;}
.floating-stars span:nth-child(16){left:71%;top:89%;animation-delay:-3s;}
.floating-stars span:nth-child(17){left:79%;top:13%;animation-delay:-1s;}
.floating-stars span:nth-child(18){left:91%;top:82%;animation-delay:-4s;}
.floating-stars span:nth-child(19){left:5%;top:83%;animation-delay:-3s;}
.floating-stars span:nth-child(20){left:32%;top:51%;animation-delay:-1s;}
.floating-stars span:nth-child(21){left:47%;top:91%;animation-delay:-4s;}
.floating-stars span:nth-child(22){left:64%;top:7%;animation-delay:-2s;}
.floating-stars span:nth-child(23){left:72%;top:53%;animation-delay:-5s;}
.floating-stars span:nth-child(24){left:86%;top:37%;animation-delay:-3s;}
.floating-stars span:nth-child(25){left:18%;top:30%;animation-delay:-1s;}
.floating-stars span:nth-child(26){left:52%;top:62%;animation-delay:-4s;}
.floating-stars span:nth-child(27){left:97%;top:33%;animation-delay:-2s;}
.floating-stars span:nth-child(28){left:3%;top:58%;animation-delay:-5s;}

@keyframes floatStar{
    0%,100%{
        transform:translateY(0) scale(1);
        opacity:.45;
    }
    50%{
        transform:translateY(-7px) scale(1.12);
        opacity:.9;
    }
}

/* =========================
   外框
========================= */

.frame{
    position:absolute;
    inset:26px;
    border:1px solid rgba(111,174,224,.32);
    pointer-events:none;
}

.frame::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(81,142,193,.08);
}

.corner{
    position:absolute;
    width:30px;
    height:30px;
}

.corner::before{
    content:"✡";
    position:absolute;
    color:rgba(108,178,230,.88);
    font-size:21px;
    line-height:1;
}

.corner.tl{top:-13px;left:-13px;}
.corner.tr{top:-13px;right:-13px;}
.corner.bl{bottom:-8px;left:-13px;}
.corner.br{bottom:-8px;right:-13px;}

/* =========================
   顶部导航
========================= */

.top-nav{
    position:absolute;
    top:42px;
    left:46px;
    right:46px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;

    color:#d9edff;
    font-family:"Noto Serif SC",serif;
    font-size:14px;
    letter-spacing:2px;
}

.logo-mark{
    color:rgba(137,201,239,.9);
    font-size:18px;
    text-shadow:0 0 7px rgba(117,193,239,.35);
}

.logo-en{
    margin-left:4px;
    color:rgba(157,204,239,.63);
    font-family:"Cinzel",serif;
    font-size:10px;
    letter-spacing:3px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-links{
    display:flex;
    gap:26px;
}

.nav-links a{
    position:relative;

    color:rgba(191,220,243,.68);
    text-decoration:none;

    font-family:"Noto Serif SC",serif;
    font-size:12px;
    letter-spacing:2px;

    transition:.3s;
}

.nav-links a:hover{
    color:#d9efff;
    text-shadow:0 0 8px rgba(122,192,235,.18);
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-7px;
    width:100%;
    height:1px;

    background:rgba(122,192,235,.7);

    transform:scaleX(0);
    transform-origin:center;

    transition:.3s;
}

.nav-links a:hover::after{
    transform:scaleX(1);
}

/* =========================
   日夜模式按钮
========================= */

.theme-toggle{
    border:1px solid rgba(111,174,224,.32);
    background:rgba(7,25,43,.45);
    color:rgba(191,220,243,.72);

    padding:7px 12px;

    font-family:"Cinzel",serif;
    font-size:9px;
    letter-spacing:1.5px;

    cursor:pointer;

    transition:.3s;
}

.theme-toggle:hover{
    border-color:rgba(122,192,235,.6);
    color:#d9efff;
    box-shadow:0 0 14px rgba(83,143,167,.15);
}

/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;
    left:50%;
    top:50%;

    width:620px;
    height:310px;

    transform:translate(-50%,-50%);

    opacity:.75;

    pointer-events:none;
}

.magic-circle::before{
    content:"";
    position:absolute;
    inset:22px 0;

    border:1px solid rgba(73,143,198,.28);
    border-radius:50%;

    box-shadow:0 0 22px rgba(69,135,163,.07);
}

.magic-circle::after{
    content:"";
    position:absolute;
    inset:44px 58px;

    border:1px solid rgba(91,162,213,.22);
    border-radius:50%;

    box-shadow:inset 0 0 20px rgba(80,141,166,.035);
}

.magic-circle svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
}

/* =========================
   星轨
========================= */

.orbit-track{
    fill:none;
    stroke:rgba(69,164,230,.28);
    stroke-width:1;

    filter:drop-shadow(0 0 4px rgba(70,130,155,.08));
}

#travellingStar{
    fill:rgba(190,228,255,.95);

    filter:
        drop-shadow(0 0 3px rgba(112,176,198,.45))
        drop-shadow(0 0 8px rgba(99,164,188,.25));
}

.star-glow{
    fill:rgba(143,210,246,.08);
}

.magic-line{
    position:absolute;

    background:rgba(92,164,213,.13);
}

.magic-line.horizontal{
    width:100%;
    height:1px;

    left:0;
    top:50%;
}

.magic-line.vertical{
    width:1px;
    height:100%;

    left:50%;
    top:0;
}

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:10px;
    height:10px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(133,202,242,.48);
    border-radius:50%;

    box-shadow:0 0 10px rgba(88,171,224,.25);
}

.magic-center::before{
    content:"";

    position:absolute;
    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:translate(-50%,-50%);

    background:rgba(174,221,249,.7);
    border-radius:50%;

    box-shadow:0 0 8px rgba(126,203,244,.8);
}

/* =========================
   标题
========================= */

.title-area{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;
}

.main-title{
    color:#dceeff;

    font-family:"Cinzel",serif;

    font-size:clamp(58px,8vw,108px);
    font-weight:400;

    line-height:.82;
    letter-spacing:9px;

    text-shadow:0 0 18px rgba(94,172,222,.08);
}

.main-title + .main-title{
    margin-top:8px;
}

.title-decoration{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    margin:18px auto 12px;
}

.title-decoration .line{
    width:95px;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(115,182,224,.62)
    );
}

.title-decoration .line.right{
    background:linear-gradient(
        90deg,
        rgba(115,182,224,.62),
        transparent
    );
}

.title-decoration .diamond{
    width:6px;
    height:6px;

    border:1px solid rgba(143,202,237,.8);

    transform:rotate(45deg);
}

.chinese-title{
    color:rgba(207,229,246,.86);

    font-family:"Noto Serif SC",serif;

    font-size:15px;
    letter-spacing:8px;
}

.description{
    margin-top:11px;

    color:rgba(177,207,230,.62);

    font-family:"Noto Serif SC",serif;

    font-size:11px;
    letter-spacing:3px;
}

/* =========================
   进入档案馆
========================= */

.enter-wrap{
    position:relative;

    margin:31px auto 0;

    width:max-content;
}

.enter-wrap::before{
    content:"";

    position:absolute;

    inset:-7px -13px;

    border:1px solid rgba(91,167,218,.38);

    background:rgba(8,28,49,.48);

    box-shadow:0 0 22px rgba(39,120,180,.08);
}

.enter-wrap::after{
    content:"";

    position:absolute;

    inset:-3px -8px;

    border:1px solid rgba(91,164,213,.16);

    pointer-events:none;
}

.enter-button{
    position:relative;

    display:block;

    padding:11px 28px;

    color:#d9edff;

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    border-top:1px solid rgba(105,180,225,.38);
    border-bottom:1px solid rgba(105,180,225,.38);

    text-decoration:none;

    font-family:"Noto Serif SC",serif;

    font-size:12px;
    letter-spacing:4px;

    transition:.3s;
}

.enter-button:hover{
    background:
        linear-gradient(
            90deg,
            rgba(14,42,66,.96),
            rgba(24,62,91,.96),
            rgba(14,42,66,.96)
        );

    box-shadow:0 0 22px rgba(56,143,201,.18);
}

.enter-star{
    margin-right:7px;

    color:rgba(111,186,229,.75);

    text-shadow:0 0 9px rgba(82,143,167,.28);
}

.enter-diamond{
    position:absolute;

    width:7px;
    height:7px;

    border:1px solid rgba(105,180,225,.58);

    background:#061426;

    transform:rotate(45deg);
}

.enter-diamond.tl{
    top:-4px;
    left:-4px;
}

.enter-diamond.tr{
    top:-4px;
    right:-4px;
}

.enter-diamond.bl{
    bottom:-4px;
    left:-4px;
}

.enter-diamond.br{
    bottom:-4px;
    right:-4px;
}

/* =========================
   页脚
========================= */

.footer{
    position:absolute;

    left:50%;
    bottom:34px;

    transform:translateX(-50%);

    color:rgba(133,177,207,.38);

    font-family:"Cinzel",serif;

    font-size:9px;
    letter-spacing:4px;

    white-space:nowrap;
}

/* =====================================================
   ❄️ DAY MODE — 冰蓝版本
   ===================================================== */

body.day-mode{
    background:#eef6fc;
    color:#304b63;
}

body.day-mode .page{
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(157,198,226,.26),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 52%,
            rgba(216,231,243,.80),
            transparent 72%
        ),
        #eef6fc;
}

body.day-mode .stars::before,
body.day-mode .stars::after{
    background-image:
        radial-gradient(
            circle,
            rgba(91,137,174,.40) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(126,165,195,.28) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(76,122,163,.18) 0 1px,
            transparent 1.5px
        );

    opacity:.30;
    filter:none;
}

body.day-mode .stars::after{
    opacity:.15;
}

body.day-mode .floating-stars span{
    color:rgba(83,132,173,.54);
    text-shadow:none;
}

body.day-mode .frame{
    border-color:rgba(83,130,169,.34);
}

body.day-mode .frame::before{
    border-color:rgba(87,137,177,.12);
}

body.day-mode .corner::before{
    color:rgba(77,130,174,.72);
    text-shadow:none;
}

body.day-mode .logo{
    color:#304a61;
}

body.day-mode .logo-mark{
    color:rgba(83,142,190,.84);
    text-shadow:0 0 7px rgba(91,158,207,.24);
}

body.day-mode .logo-en{
    color:rgba(79,124,162,.64);
}

body.day-mode .nav-links a{
    color:rgba(61,91,119,.74);
}

body.day-mode .nav-links a:hover{
    color:#294b68;
    text-shadow:0 0 8px rgba(88,145,190,.18);
}

body.day-mode .nav-links a::after{
    background:rgba(83,143,192,.58);
}

body.day-mode .theme-toggle{
    border-color:rgba(83,130,169,.34);

    background:rgba(244,249,253,.64);

    color:rgba(59,89,116,.80);
}

body.day-mode .theme-toggle:hover{
    border-color:rgba(79,143,195,.64);

    color:#294b68;

    box-shadow:0 0 14px rgba(84,148,198,.14);
}

body.day-mode .magic-circle{
    opacity:.52;
}

body.day-mode .magic-circle::before{
    border-color:rgba(76,136,181,.25);

    box-shadow:
        0 0 22px rgba(79,145,194,.07);
}

body.day-mode .magic-circle::after{
    border-color:rgba(99,157,197,.21);

    box-shadow:
        inset 0 0 20px rgba(91,151,194,.035);
}

body.day-mode .orbit-track{
    stroke:rgba(70,133,181,.27);

    filter:
        drop-shadow(
            0 0 4px rgba(74,140,190,.08)
        );
}

body.day-mode #travellingStar{
    fill:rgba(91,151,193,.90);

    filter:
        drop-shadow(
            0 0 3px rgba(135,190,221,.45)
        )
        drop-shadow(
            0 0 8px rgba(105,169,207,.24)
        );
}

body.day-mode .star-glow{
    fill:rgba(124,184,216,.08);
}

body.day-mode .magic-line{
    background:rgba(78,138,183,.13);
}

body.day-mode .magic-center{
    border-color:rgba(82,145,190,.42);

    box-shadow:
        0 0 10px rgba(89,153,198,.17);
}

body.day-mode .magic-center::before{
    background:rgba(106,164,204,.64);

    box-shadow:
        0 0 8px rgba(99,169,213,.48);
}

body.day-mode .main-title{
    color:#294b68;

    text-shadow:
        0 0 18px rgba(90,151,198,.08);
}

body.day-mode .title-decoration .line{
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(83,143,190,.52)
        );
}

body.day-mode .title-decoration .line.right{
    background:
        linear-gradient(
            90deg,
            rgba(83,143,190,.52),
            transparent
        );
}

body.day-mode .title-decoration .diamond{
    border-color:rgba(91,153,199,.68);
}

body.day-mode .chinese-title{
    color:rgba(48,79,105,.80);
}

body.day-mode .description{
    color:rgba(68,101,128,.67);
}

body.day-mode .enter-wrap::before{
    border-color:rgba(83,143,190,.37);

    background:rgba(235,244,250,.62);

    box-shadow:
        0 0 22px rgba(77,139,186,.07);
}

body.day-mode .enter-wrap::after{
    border-color:rgba(84,145,191,.16);
}

body.day-mode .enter-button{
    color:#365a76;

    background:
        linear-gradient(
            90deg,
            rgba(222,236,246,.92),
            rgba(240,248,253,.98),
            rgba(222,236,246,.92)
        );

    border-top-color:rgba(82,145,194,.40);
    border-bottom-color:rgba(82,145,194,.40);
}

body.day-mode .enter-button:hover{
    background:
        linear-gradient(
            90deg,
            rgba(215,232,244,.98),
            rgba(239,248,253,1),
            rgba(215,232,244,.98)
        );

    box-shadow:
        0 0 22px rgba(81,145,195,.16);
}

body.day-mode .enter-star{
    color:rgba(83,143,191,.72);

    text-shadow:
        0 0 9px rgba(91,155,203,.28);
}

body.day-mode .enter-diamond{
    border-color:rgba(83,145,193,.60);

    background:#eef6fc;
}

body.day-mode .footer{
    color:rgba(76,111,139,.42);
}

/* =========================
   手机 / 平板
========================= */

@media(max-width:900px){

    .frame{
        inset:18px;
    }

    .top-nav{
        top:30px;
        left:32px;
        right:32px;
    }

    .nav-links{
        gap:15px;
    }

    .magic-circle{
        width:540px;
        height:270px;
    }

    .main-title{
        font-size:clamp(48px,12vw,82px);
    }
}

@media(max-width:600px){

    .frame{
        inset:12px;
    }

    .frame::before{
        inset:6px;
    }

    .top-nav{
        top:24px;
        left:24px;
        right:24px;
    }

    .logo{
        font-size:11px;
        gap:6px;
    }

    .logo-mark{
        font-size:15px;
    }

    .logo-en{
        display:none;
    }

    .nav-right{
        gap:10px;
    }

    .nav-links{
        gap:11px;
    }

    .nav-links a{
        font-size:10px;
        letter-spacing:1px;
    }

    .theme-toggle{
        padding:6px 8px;
        font-size:8px;
    }

    .magic-circle{
        width:430px;
        height:215px;
    }

    .main-title{
        font-size:clamp(42px,15vw,70px);
        letter-spacing:6px;
    }

    .title-decoration{
        margin-top:15px;
    }

    .title-decoration .line{
        width:55px;
    }

    .chinese-title{
        font-size:12px;
        letter-spacing:5px;
    }

    .description{
        font-size:9px;
        letter-spacing:2px;
    }

    .enter-wrap{
        margin-top:25px;
    }

    .enter-button{
        padding:10px 20px;
        font-size:10px;
        letter-spacing:3px;
    }

    .footer{
        bottom:24px;
        font-size:7px;
        letter-spacing:3px;
    }

    .floating-stars span:nth-child(n+13){
        display:none;
    }
}

/* =========================
   日夜模式过渡
========================= */

body,
.page,
.frame,
.logo,
.nav-links a,
.theme-toggle,
.main-title,
.chinese-title,
.description,
.enter-button,
.footer{
    transition:
        background .45s ease,
        background-color .45s ease,
        color .45s ease,
        border-color .45s ease,
        box-shadow .45s ease,
        text-shadow .45s ease;
}
</style>
</head>

<body>

<div class="page">

    <div class="stars"></div>

    <div class="floating-stars">
        <span>✦</span>
        <span>✧</span>

<script>

/* =========================
   日夜模式
========================= */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("seyami-theme");

if(savedTheme === "day"){
    document.body.classList.add("day-mode");
    themeToggle.textContent = "☀ DAY";
}

themeToggle.addEventListener("click",()=>{

    document.body.classList.toggle("day-mode");

    const isDay =
        document.body.classList.contains("day-mode");

    themeToggle.textContent =
        isDay ? "☀ DAY" : "☾ NIGHT";

    localStorage.setItem(
        "seyami-theme",
        isDay ? "day" : "night"
    );

});


/* =========================
   三层星轨
========================= */

const tracks = [

    {
        element:document.getElementById("orbitA"),
        rotation:0,
        speed:360/38,
        direction:1
    },

    {
        element:document.getElementById("orbitB"),
        rotation:55,
        speed:360/32,
        direction:-1
    },

    {
        element:document.getElementById("orbitC"),
        rotation:110,
        speed:360/25,
        direction:1
    }

];

let currentTrack = 0;
let starAngle = 300;

const STAR_SPEED = 11;

let lastTime = performance.now();


function ellipsePoint(
    rx,
    ry,
    angle
){

    const rad =
        angle * Math.PI / 180;

    return {

        x:
            310 +
            rx * Math.cos(rad),

        y:
            155 +
            ry * Math.sin(rad)

    };

}


function updateStar(){

    const track =
        tracks[currentTrack];

    const ellipse =
        track.element;

    const rx =
        parseFloat(
            ellipse.getAttribute("rx")
        );

    const ry =
        parseFloat(
            ellipse.getAttribute("ry")
        );

    const point =
        ellipsePoint(
            rx,
            ry,
            starAngle + track.rotation
        );

    const star =
        document.getElementById(
            "travellingStar"
        );

    star.setAttribute(
        "x",
        point.x
    );

    star.setAttribute(
        "y",
        point.y
    );

}


function animate(time){

    const delta =
        (time - lastTime) / 1000;

    lastTime = time;

    const track =
        tracks[currentTrack];

    starAngle +=
        STAR_SPEED *
        track.direction *
        delta;

    if(starAngle > 360)
        starAngle -= 360;

    if(starAngle < 0)
        starAngle += 360;

    updateStar();

    requestAnimationFrame(animate);

}

updateStar();

requestAnimationFrame(animate);

</script>
