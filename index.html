<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================================
   基础
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    background:
        radial-gradient(
            circle at 50% 42%,
            #203d68 0%,
            #142d55 34%,
            #0b1d3b 68%,
            #07142c 100%
        );

    color:#e9eef8;

    font-family:
        "Noto Serif SC",
        serif;

    overflow:hidden;
}


/* ================================
   深蓝背景光
================================ */

.background-glow{

    position:fixed;

    width:700px;
    height:700px;

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(87,125,177,.20) 0%,
            rgba(61,96,145,.10) 38%,
            transparent 70%
        );

    filter:blur(15px);

    pointer-events:none;
}


/* ================================
   细微星尘
================================ */

.star{

    position:fixed;

    z-index:1;

    color:#c9d8ef;

    font-family:
        "Cormorant Garamond",
        serif;

    font-weight:300;

    opacity:.45;

    pointer-events:none;

    animation:
        floatStar
        7s
        ease-in-out
        infinite;
}

.star.s1{
    top:16%;
    left:15%;
    font-size:16px;
    animation-delay:-1s;
}

.star.s2{
    top:22%;
    right:18%;
    font-size:13px;
    animation-delay:-4s;
}

.star.s3{
    top:48%;
    left:9%;
    font-size:11px;
    animation-delay:-2s;
}

.star.s4{
    top:62%;
    right:12%;
    font-size:18px;
    animation-delay:-5s;
}

.star.s5{
    top:77%;
    left:23%;
    font-size:10px;
    animation-delay:-3s;
}

.star.s6{
    top:73%;
    right:27%;
    font-size:13px;
    animation-delay:-6s;
}

.star.s7{
    top:35%;
    left:29%;
    font-size:9px;
    animation-delay:-1.5s;
}

.star.s8{
    top:41%;
    right:30%;
    font-size:10px;
    animation-delay:-3.5s;
}

@keyframes floatStar{

    0%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }

    50%{
        transform:
            translateY(-11px)
            rotate(12deg);

        opacity:.75;
    }

    100%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }
}


/* ================================
   左上角 LOGO
================================ */

.logo{

    position:absolute;

    top:31px;
    left:37px;

    z-index:10;

    text-decoration:none;

    color:#edf3fc;

    line-height:1;

}

.logo-cn{

    display:block;

    font-size:15px;

    font-weight:400;

    letter-spacing:4px;

    margin-bottom:8px;

    text-shadow:
        0 1px 12px rgba(180,210,245,.15);
}

.logo-en{

    display:block;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:12px;

    font-weight:400;

    letter-spacing:4px;

    color:#91a8c8;
}


/* ================================
   主页面
================================ */

.hero{

    position:relative;

    width:100%;
    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:
        70px
        25px;
}


/* ================================
   中央内容
================================ */

.hero-content{

    position:relative;

    z-index:5;

    display:flex;

    flex-direction:column;

    align-items:center;

}


/* ================================
   顶部装饰
================================ */

.ornament{

    font-family:
        "Cormorant Garamond",
        serif;

    color:#a9bdd9;

    font-size:14px;

    letter-spacing:9px;

    margin-bottom:28px;

    opacity:.7;
}


/* ================================
   SEYAMI
================================ */

.title-seyami{

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(58px, 10vw, 105px);

    font-weight:300;

    letter-spacing:.20em;

    line-height:.82;

    margin-left:.20em;

    color:#f0f4fa;

    text-shadow:
        0 2px 22px rgba(116,151,195,.20);
}


/* ================================
   ARCHIVE
================================ */

.title-archive{

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(78px, 13vw, 142px);

    font-weight:300;

    letter-spacing:.095em;

    line-height:.88;

    margin-left:.095em;

    margin-top:9px;

    color:#f4f7fb;

    text-shadow:
        0 2px 25px rgba(113,150,196,.25);
}


/* ================================
   中文标题
================================ */

.subtitle{

    margin-top:29px;

    color:#aebed5;

    font-size:13px;

    font-weight:300;

    letter-spacing:7px;

    margin-left:7px;

    text-shadow:
        0 1px 10px rgba(40,70,110,.5);
}


/* ================================
   分隔线
================================ */

.divider{

    width:150px;

    height:1px;

    margin-top:26px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(154,179,211,.65),
            transparent
        );
}


/* ================================
   ENTER 按钮
================================ */

.enter-button{

    margin-top:30px;

    width:190px;
    height:47px;

    display:flex;

    justify-content:center;
    align-items:center;

    border:
        1px solid
        rgba(151,176,207,.48);

    background:
        rgba(17,39,72,.42);

    color:#dce6f4;

    text-decoration:none;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:15px;

    letter-spacing:4px;

    transition:
        .35s ease;

    box-shadow:
        inset 0 0 20px
        rgba(120,150,190,.04);
}

.enter-button:hover{

    background:
        rgba(42,69,108,.55);

    border-color:
        rgba(189,207,230,.75);

    color:#ffffff;

    letter-spacing:6px;

    box-shadow:
        0 0 28px
        rgba(105,143,191,.14);

    transform:
        translateY(-2px);
}


/* ================================
   小字
================================ */

.description{

    margin-top:18px;

    color:#7188a7;

    font-size:10px;

    font-family:
        "Cormorant Garamond",
        serif;

    letter-spacing:3px;
}


/* ================================
   两侧竖线
================================ */

.side-decoration{

    position:absolute;

    top:50%;

    width:1px;

    height:115px;

    transform:
        translateY(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(136,161,194,.32),
            transparent
        );
}

.side-decoration.left{
    left:9%;
}

.side-decoration.right{
    right:9%;
}


/* ================================
   浮动 ✡ ✶
================================ */

.sparkle{

    position:absolute;

    z-index:2;

    font-family:
        "Cormorant Garamond",
        serif;

    color:#b7c9e1;

    opacity:.55;

    pointer-events:none;

    animation:
        sparkleFloat
        5s
        ease-in-out
        infinite;
}

.sparkle.one{

    top:30%;
    left:32%;

    font-size:13px;
}

.sparkle.two{

    top:29%;
    right:32%;

    font-size:10px;

    animation-delay:-2s;
}

.sparkle.three{

    bottom:29%;
    left:36%;

    font-size:11px;

    animation-delay:-1s;
}

.sparkle.four{

    bottom:27%;
    right:36%;

    font-size:14px;

    animation-delay:-3s;
}

@keyframes sparkleFloat{

    0%{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }

    50%{

        transform:
            translateY(-8px)
            rotate(18deg);

        opacity:.75;
    }

    100%{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:.25;
    }
}


/* ================================
   底部
================================ */

.footer{

    position:absolute;

    left:0;
    right:0;

    bottom:22px;

    text-align:center;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:10px;

    letter-spacing:4px;

    color:#627b9d;

}


/* ================================
   手机
================================ */

@media(max-width:600px){

    .logo{

        top:23px;
        left:22px;
    }

    .logo-cn{

        font-size:12px;

        letter-spacing:3px;
    }

    .logo-en{

        font-size:10px;

        letter-spacing:3px;
    }

    .hero{

        padding:
            85px
            18px
            60px;
    }

    .title-seyami{

        font-size:
            clamp(48px, 15vw, 72px);

        letter-spacing:.15em;

        margin-left:.15em;
    }

    .title-archive{

        font-size:
            clamp(64px, 19vw, 94px);

        letter-spacing:.065em;

        margin-left:.065em;
    }

    .subtitle{

        font-size:11px;

        letter-spacing:4px;

        margin-left:4px;
    }

    .side-decoration{

        height:80px;
    }

    .side-decoration.left{
        left:5%;
    }

    .side-decoration.right{
        right:5%;
    }

    .description{

        font-size:9px;

        letter-spacing:2px;
    }

}

</style>
</head>


<body>


<!-- 背景光 -->

<div class="background-glow"></div>


<!-- 左上角 -->

<a href="index.html" class="logo">

    <span class="logo-cn">
        塞垭弥大陆档案馆
    </span>

    <span class="logo-en">
        SEYAMI ARCHIVE
    </span>

</a>


<!-- 漂浮星星 -->

<div class="star s1">✶</div>
<div class="star s2">✡</div>
<div class="star s3">✦</div>
<div class="star s4">✶</div>
<div class="star s5">✧</div>
<div class="star s6">✡</div>
<div class="star s7">·</div>
<div class="star s8">✦</div>


<!-- 主页面 -->

<main class="hero">


    <div class="side-decoration left"></div>

    <div class="side-decoration right"></div>


    <section class="hero-content">


        <div class="ornament">
            ✦　✧　✦
        </div>


        <div class="title-seyami">
            SEYAMI
        </div>


        <div class="title-archive">
            ARCHIVE
        </div>


        <div class="subtitle">
            塞垭弥大陆档案馆
        </div>


        <div class="divider"></div>


        <a
            href="archive.html"
            class="enter-button"
        >
            ENTER ARCHIVE
        </a>


        <div class="description">
            THE RECORDS OF SEYAMI CONTINENT
        </div>


    </section>


    <!-- ✡ ✶ 装饰 -->

    <span class="sparkle one">✶</span>

    <span class="sparkle two">✡</span>

    <span class="sparkle three">✧</span>

    <span class="sparkle four">✶</span>


</main>


<footer class="footer">
    ✦　SEYAMI CONTINENT　✦
</footer>


</body>
</html>
