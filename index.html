<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#061426;
    color:#dceeff;
    font-family:"Cormorant Garamond","Noto Serif SC",serif;
    transition:
        background .6s ease,
        color .6s ease;
}

.page{
    position:relative;
    width:100%;
    height:100vh;
    min-height:600px;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(38,91,137,.18) 0%,
            rgba(11,45,75,.45) 35%,
            #061426 78%
        );
}


/* =========================================================
   背景星点
========================================================= */

.background-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.background-stars::before,
.background-stars::after{
    content:"";
    position:absolute;
    inset:-10%;
    background-image:
        radial-gradient(circle at 12% 17%, rgba(182,220,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 27% 72%, rgba(130,191,239,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 43% 12%, rgba(220,240,255,.35) 0 1px, transparent 1.5px),
        radial-gradient(circle at 64% 27%, rgba(182,220,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 81% 15%, rgba(130,191,239,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 91% 58%, rgba(220,240,255,.35) 0 1px, transparent 1.5px),
        radial-gradient(circle at 8% 83%, rgba(182,220,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 90%, rgba(130,191,239,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 57% 78%, rgba(220,240,255,.35) 0 1px, transparent 1.5px),
        radial-gradient(circle at 75% 91%, rgba(182,220,255,.7) 0 1px, transparent 1.5px);
    background-size:100% 100%;
}

.background-stars::after{
    transform:scale(1.15);
    opacity:.55;
}


/* =========================================================
   更多星点
   —— 只在平板 / 手机显示
========================================================= */

.mobile-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    display:none;
}

.mobile-stars span{
    position:absolute;
    color:rgba(158,207,247,.62);
    font-family:"Cormorant Garamond",serif;
    font-size:13px;
    line-height:1;
    text-shadow:none;
}

.mobile-stars .dot{
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(182,220,255,.62);
}


/* =========================================================
   页面边框
========================================================= */

.frame{
    position:absolute;
    inset:20px;
    border:1px solid rgba(111,174,224,.32);
    pointer-events:none;
    z-index:20;
}

.frame::after{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(81,142,193,.08);
}


/* =========================================================
   四角六芒星
========================================================= */

.corner{
    position:absolute;
    z-index:30;
    width:62px;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

.corner::before{
    content:"✡";
    color:rgba(108,178,230,.88);
    font-size:30px;
    font-family:"Times New Roman",serif;
    font-weight:400;
    text-shadow:none;
}

.corner-tl{
    left:34px;
    top:28px;
}

.corner-tr{
    right:34px;
    top:28px;
}

.corner-bl{
    left:34px;
    bottom:28px;
}

.corner-br{
    right:34px;
    bottom:28px;
}


/* =========================================================
   顶部导航
========================================================= */

.topbar{
    position:absolute;
    top:36px;
    left:50px;
    right:50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:40;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    color:#d9edff;
    font-family:"Noto Serif SC",serif;
    font-size:13px;
    letter-spacing:2px;
}

.logo-mark{
    color:rgba(137,201,239,.9);
    font-size:17px;
    text-shadow:0 0 10px rgba(91,170,220,.3);
}

.logo-en{
    margin-left:2px;
    color:rgba(157,204,239,.63);
    font-family:"Cinzel",serif;
    font-size:9px;
    letter-spacing:3px;
}

.nav{
    display:flex;
    align-items:center;
    gap:27px;
}

.nav a{
    position:relative;

    color:rgba(191,220,243,.68);
    text-decoration:none;

    font-family:"Noto Serif SC",serif;
    font-size:12px;
    letter-spacing:2px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.nav a::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-7px;

    width:0;
    height:1px;

    background:rgba(122,192,235,.7);

    transform:translateX(-50%);
    transition:width .3s ease;
}

.nav a:hover{
    color:#d9efff;
    text-shadow:0 0 8px rgba(93,167,215,.25);
}

.nav a:hover::after{
    width:100%;
}


/* =========================================================
   日夜模式
========================================================= */

.theme-toggle{
    width:82px;
    height:29px;

    margin-left:18px;

    border:1px solid rgba(111,174,224,.32);
    border-radius:30px;

    background:rgba(7,25,43,.45);

    color:rgba(191,220,243,.72);

    font-family:"Cinzel",serif;
    font-size:9px;
    letter-spacing:1.5px;

    cursor:pointer;

    transition:
        background .5s ease,
        color .5s ease,
        border-color .5s ease;
}

.theme-toggle:hover{
    color:#d9efff;
}


/* =========================================================
   主区域
========================================================= */

.main{
    position:relative;
    z-index:10;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding-top:25px;
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{
    position:absolute;

    width:610px;
    height:610px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(73,143,198,.28);
    border-radius:50%;

    box-shadow:
        0 0 45px rgba(39,117,171,.06),
        inset 0 0 45px rgba(39,117,171,.05);

    pointer-events:none;
}

.magic-circle::before{
    content:"";

    position:absolute;
    inset:34px;

    border:1px solid rgba(91,162,213,.22);
    border-radius:50%;
}

.magic-circle::after{
    content:"";

    position:absolute;
    inset:85px;

    border:1px dashed rgba(91,162,213,.16);
    border-radius:50%;
}


/* =========================================================
   三层星轨
========================================================= */

.orbit{
    position:absolute;
    left:50%;
    top:50%;

    border:1px solid rgba(69,164,230,.28);
    border-radius:50%;

    transform-origin:center;

    pointer-events:none;
}

.orbit-a{
    width:500px;
    height:190px;
    margin-left:-250px;
    margin-top:-95px;
}

.orbit-b{
    width:420px;
    height:145px;
    margin-left:-210px;
    margin-top:-72.5px;
}

.orbit-c{
    width:330px;
    height:105px;
    margin-left:-165px;
    margin-top:-52.5px;
}


/* =========================================================
   星轨中心
========================================================= */

.magic-center{
    position:absolute;
    left:50%;
    top:50%;

    width:86px;
    height:86px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(133,202,242,.48);
    border-radius:50%;

    box-shadow:
        0 0 25px rgba(88,171,224,.25),
        inset 0 0 20px rgba(126,203,244,.15);
}

.magic-center::before{
    content:"";

    position:absolute;
    inset:12px;

    border:1px solid rgba(174,221,249,.7);
    border-radius:50%;

    box-shadow:
        inset 0 0 12px rgba(126,203,244,.8);
}

.magic-center::after{
    content:"✦";

    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:rgba(190,228,255,.95);

    font-size:14px;
}


/* =========================================================
   魔法线
========================================================= */

.magic-line{
    position:absolute;
    left:50%;
    top:50%;

    width:430px;
    height:1px;

    background:rgba(92,164,213,.13);

    transform-origin:center;
}

.magic-line.l1{
    transform:translate(-50%,-50%) rotate(0deg);
}

.magic-line.l2{
    transform:translate(-50%,-50%) rotate(60deg);
}

.magic-line.l3{
    transform:translate(-50%,-50%) rotate(120deg);
}


/* =========================================================
   轨道小星辰
========================================================= */

.travelling-star{
    position:absolute;

    width:8px;
    height:8px;

    left:50%;
    top:50%;

    margin-left:-4px;
    margin-top:-4px;

    border-radius:50%;

    background:rgba(190,228,255,.95);

    filter:
        drop-shadow(0 0 6px rgba(104,190,230,.45))
        drop-shadow(0 0 13px rgba(67,158,215,.25));

    pointer-events:none;
}


/* =========================================================
   浮动星星
========================================================= */

.floating-stars{
    position:absolute;
    inset:0;

    z-index:3;
    pointer-events:none;
}

.floating-stars span{
    position:absolute;

    color:rgba(158,207,247,.62);

    font-family:"Cormorant Garamond",serif;

    font-size:15px;

    text-shadow:none;

    animation:floatStar 5s ease-in-out infinite;
}

.floating-stars span:nth-child(1){
    left:17%;
    top:25%;
    animation-delay:-1s;
}

.floating-stars span:nth-child(2){
    left:79%;
    top:23%;
    animation-delay:-3s;
}

.floating-stars span:nth-child(3){
    left:22%;
    top:70%;
    animation-delay:-2s;
}

.floating-stars span:nth-child(4){
    left:82%;
    top:72%;
    animation-delay:-4s;
}

.floating-stars span:nth-child(5){
    left:11%;
    top:48%;
    font-size:11px;
    animation-delay:-1.5s;
}

.floating-stars span:nth-child(6){
    left:89%;
    top:45%;
    font-size:11px;
    animation-delay:-3.5s;
}

.floating-stars span:nth-child(7){
    left:31%;
    top:17%;
    font-size:10px;
}

.floating-stars span:nth-child(8){
    left:68%;
    top:82%;
    font-size:10px;
}

@keyframes floatStar{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-6px) rotate(8deg);
    }
}


/* =========================================================
   标题
========================================================= */

.title-wrap{
    position:relative;
    z-index:15;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:15px;
}

.main-title{
    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;

    color:#dceeff;

    font-family:"Cinzel","Cormorant Garamond",serif;
    font-weight:400;

    text-align:center;

    text-shadow:
        0 0 18px rgba(94,172,222,.08);
}

.main-title .seyami{
    font-size:74px;
    line-height:.92;

    letter-spacing:15px;
    margin-left:15px;
}

.main-title .archive{
    font-size:91px;
    line-height:.9;

    letter-spacing:10px;
    margin-left:10px;
}


/* =========================================================
   标题下方装饰
========================================================= */

.title-decoration{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    margin-top:27px;

    opacity:.9;
}

.title-decoration .line{
    width:82px;
    height:1px;

    background:rgba(115,182,224,.62);
}

.title-decoration .diamond{
    width:7px;
    height:7px;

    background:rgba(143,202,237,.8);

    transform:rotate(45deg);

    box-shadow:0 0 9px rgba(108,186,226,.35);
}


/* =========================================================
   中文标题
========================================================= */

.cn-title{
    margin-top:17px;

    color:rgba(207,229,246,.86);

    font-family:"Noto Serif SC",serif;
    font-size:16px;
    font-weight:400;

    letter-spacing:8px;

    text-indent:8px;
}

.description{
    margin-top:11px;

    color:rgba(177,207,230,.62);

    font-family:"Noto Serif SC",serif;

    font-size:11px;
    letter-spacing:4px;
}


/* =========================================================
   进入按钮
========================================================= */

.enter-wrap{
    position:relative;

    width:325px;
    height:86px;

    margin-top:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(91,167,218,.38);

    background:rgba(8,28,49,.48);

    box-shadow:
        0 0 20px rgba(39,120,180,.08);

    clip-path:polygon(
        12px 0,
        calc(100% - 12px) 0,
        100% 12px,
        100% calc(100% - 12px),
        calc(100% - 12px) 100%,
        12px 100%,
        0 calc(100% - 12px),
        0 12px
    );
}

.enter-wrap::after{
    content:"";

    position:absolute;
    inset:5px;

    border:1px solid rgba(91,164,213,.16);

    pointer-events:none;
}

.enter-button{
    position:relative;
    z-index:2;

    width:270px;
    height:54px;

    border:1px solid rgba(105,180,225,.38);

    background:
        linear-gradient(
            90deg,
            rgba(8,31,52,.88),
            rgba(17,51,78,.88),
            rgba(8,31,52,.88)
        );

    color:#d9edff;

    font-family:"Noto Serif SC",serif;
    font-size:13px;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
}

.enter-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(56,143,201,.18);

    background:
        linear-gradient(
            90deg,
            rgba(11,38,62,.95),
            rgba(20,60,91,.95),
            rgba(11,38,62,.95)
        );
}

.enter-star{
    position:absolute;

    color:rgba(111,186,229,.75);

    font-size:13px;

    filter:
        drop-shadow(0 0 5px rgba(67,158,215,.45));
}

.enter-star.s1{
    left:19px;
    top:17px;
}

.enter-star.s2{
    right:19px;
    bottom:17px;
}

.enter-diamond{
    position:absolute;

    width:5px;
    height:5px;

    background:rgba(143,202,237,.8);

    transform:rotate(45deg);

    box-shadow:0 0 9px rgba(108,186,226,.3);
}

.enter-diamond.d1{
    left:13px;
    bottom:15px;
}

.enter-diamond.d2{
    right:13px;
    top:15px;
}


/* =========================================================
   页脚
========================================================= */

.footer{
    position:absolute;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    color:rgba(133,177,207,.38);

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:4px;

    white-space:nowrap;

    z-index:25;
}


/* =========================================================
   DAY MODE
========================================================= */

body.day-mode{
    background:#edf4f7;
    color:#29465a;
}

body.day-mode .page{
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(154,198,219,.28) 0%,
            rgba(213,229,235,.75) 35%,
            #edf4f7 78%
        );
}

body.day-mode .background-stars::before{
    background-image:
        radial-gradient(circle at 12% 17%, rgba(77,127,158,.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 27% 72%, rgba(104,154,181,.28) 0 1px, transparent 1.5px),
        radial-gradient(circle at 43% 12%, rgba(56,107,139,.20) 0 1px, transparent 1.5px),
        radial-gradient(circle at 64% 27%, rgba(77,127,158,.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 81% 15%, rgba(104,154,181,.28) 0 1px, transparent 1.5px),
        radial-gradient(circle at 91% 58%, rgba(56,107,139,.20) 0 1px, transparent 1.5px),
        radial-gradient(circle at 8% 83%, rgba(77,127,158,.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 90%, rgba(104,154,181,.28) 0 1px, transparent 1.5px),
        radial-gradient(circle at 57% 78%, rgba(56,107,139,.20) 0 1px, transparent 1.5px),
        radial-gradient(circle at 75% 91%, rgba(77,127,158,.42) 0 1px, transparent 1.5px);

    opacity:.3;
}

body.day-mode .background-stars::after{
    opacity:.15;
}

body.day-mode .mobile-stars span{
    color:rgba(70,126,158,.52);
}

body.day-mode .mobile-stars .dot{
    background:rgba(77,127,158,.40);
}

body.day-mode .frame{
    border-color:rgba(75,119,145,.35);
}

body.day-mode .frame::after{
    border-color:rgba(75,119,145,.12);
}

body.day-mode .corner::before{
    color:rgba(72,119,145,.68);
    text-shadow:none;
}

body.day-mode .logo{
    color:#314b5e;
}

body.day-mode .logo-mark{
    color:rgba(74,126,151,.82);
    text-shadow:0 0 9px rgba(81,135,158,.18);
}

body.day-mode .logo-en{
    color:rgba(76,119,141,.62);
}

body.day-mode .nav a{
    color:rgba(63,91,108,.72);
}

body.day-mode .nav a:hover{

    text-shadow:0 0 8px rgba(81,135,158,.18);

body.day-mode .nav a::after{

}

            rgba(222,235,240,.90)
        );

    border-color:rgba(78,136,161,.38);
}

body.day-mode .enter-button:hover{
    background:
        linear-gradient(
            90deg,
            rgba(214,230,236,.96),
            rgba(235,245,248,1),
            rgba(214,230,236,.96)
        );

        0 8px 20px rgba(76,135,159,.16);
}

    color:rgba(76,133,158,.66);
}

    background:rgba(78,136,160,.58);

}

body.day-mode .footer{
    color:rgba(77,111,126,.40);
}


/* =========================================================
   平板端
========================================================= */

@media(max-width:800px){

    .topbar{
        left:35px;
        right:35px;
        top:30px;
    }

    .nav{
        gap:17px;
    }

    .nav a{
        font-size:11px;
    }

    .theme-toggle{
        width:78px;
        height:27px;

<script>

/* =========================================================
   日夜模式
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day-mode");

        themeIcon.textContent = "☀";
        themeText.textContent = "DAY";

    }else{

        document.body.classList.remove("day-mode");

        themeIcon.textContent = "☾";
        themeText.textContent = "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem("seyami-theme") || "night";

applyTheme(savedTheme);


themeToggle.addEventListener("click",()=>{

    const isDay =
        document.body.classList.contains("day-mode");

    const nextTheme =
        isDay ? "night" : "day";

    localStorage.setItem(
        "seyami-theme",
        nextTheme
    );

    applyTheme(nextTheme);

});


/* =========================================================
   三层星轨 + 小星辰
========================================================= */

const star =
    document.getElementById("travellingStar");

const tracks = [

    {
        rx:250,
        ry:95,
        rotation:0,
        speed:360/38,
        direction:1
    },

    {
        rx:210,
        ry:72.5,
        rotation:55,
        speed:-360/32,
        direction:-1
    },

    {
        rx:165,
        ry:52.5,
        rotation:110,
        speed:360/25,
        direction:1
    }

];


let currentTrack = 0;
let angle = 0;

const STAR_SPEED = 11;

let lastTime = performance.now();


function moveStar(time){

    const delta =
        (time-lastTime)/1000;

    lastTime = time;

    const track =
        tracks[currentTrack];

    angle +=
        track.speed *
        track.direction *
        delta;

    const rad =
        angle*Math.PI/180;

    const localX =
        Math.cos(rad)*track.rx;

    const localY =
        Math.sin(rad)*track.ry;


    const rotation =
        track.rotation*Math.PI/180;

    const x =
        localX*Math.cos(rotation)
        -
        localY*Math.sin(rotation);

    const y =
        localX*Math.sin(rotation)
        +
        localY*Math.cos(rotation);


    star.style.transform =
        `translate(${x}px, ${y}px)`;


    requestAnimationFrame(moveStar);

}


requestAnimationFrame(moveStar);


/* =========================================================
   定期切换轨道
========================================================= */

setInterval(()=>{

    currentTrack =
        (currentTrack+1)%tracks.length;

    angle = 0;

}, STAR_SPEED*1000);


</script>
