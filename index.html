<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com">

<link rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;
    overflow-x:hidden;
    font-family:"Cormorant Garamond","Noto Serif SC",serif;
}

.page{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(38,91,137,.18), transparent 38%),
        radial-gradient(circle at 50% 50%, rgba(11,45,75,.45), transparent 70%),
        #061426;
}


/* =========================
   背景星空
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:-20%;
    background-image:
        radial-gradient(circle, rgba(182,220,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(130,191,239,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(220,240,255,.35) 0 1px, transparent 1.5px);
    background-size:
        180px 180px,
        240px 240px,
        310px 310px;
    background-position:
        20px 30px,
        80px 120px,
        150px 70px;
    opacity:.45;
    animation:starMove 35s linear infinite;
}

.stars::after{
    opacity:.22;
    transform:scale(1.15);
    animation-duration:50s;
}

@keyframes starMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-80px,50px,0);
    }

}


/* =========================
   浮动星星
========================= */

.floating-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.floating-stars span{
    position:absolute;
    color:rgba(158,207,247,.62);
    font-family:serif;
    font-size:14px;
    text-shadow:0 0 8px rgba(96,177,242,.5);
    animation:floatStar 6s ease-in-out infinite;
}

.floating-stars span:nth-child(1){
    left:12%;
    top:24%;
    animation-delay:0s;
}

.floating-stars span:nth-child(2){
    left:20%;
    top:67%;
    animation-delay:1.5s;
}

.floating-stars span:nth-child(3){
    left:77%;
    top:22%;
    animation-delay:2.5s;
}

.floating-stars span:nth-child(4){
    left:84%;
    top:70%;
    animation-delay:1s;
}

.floating-stars span:nth-child(5){
    left:30%;
    top:17%;
    animation-delay:3s;
}

.floating-stars span:nth-child(6){
    left:71%;
    top:61%;
    animation-delay:2s;
}

.floating-stars span:nth-child(7){
    left:16%;
    top:46%;
    animation-delay:4s;
}

.floating-stars span:nth-child(8){
    left:89%;
    top:43%;
    animation-delay:1.8s;
}

.floating-stars span:nth-child(9){
    left:42%;
    top:11%;
    animation-delay:2.2s;
}

.floating-stars span:nth-child(10){
    left:57%;
    top:83%;
    animation-delay:3.5s;
}

.floating-stars span:nth-child(11){
    left:7%;
    top:78%;
    animation-delay:1.2s;
}

.floating-stars span:nth-child(12){
    left:94%;
    top:18%;
    animation-delay:4.2s;
}

@keyframes floatStar{

    0%,100%{
        opacity:.35;
        transform:translateY(0) rotate(0deg);
    }

    50%{
        opacity:.85;
        transform:translateY(-8px) rotate(12deg);
    }

}


/* =========================
   外框
========================= */

.frame{
    position:absolute;
    inset:18px;
    border:1px solid rgba(111,174,224,.32);
    pointer-events:none;
    z-index:10;
}

.frame::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(81,142,193,.08);
}


/* =========================
   四角六芒星
========================= */

.corner{
    position:absolute;
    width:68px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

.corner::before{
    content:"✡";
    display:block;
    font-family:"Times New Roman",serif;
    font-size:31px;
    font-weight:400;
    line-height:1;
    color:rgba(108,178,230,.88);
    text-shadow:
        0 0 5px rgba(67,153,218,.5),
        0 0 13px rgba(43,124,190,.28);
}

.corner.tl{
    left:-34px;
    top:-34px;
}

.corner.tr{
    right:-34px;
    top:-34px;
}

.corner.bl{
    left:-34px;
    bottom:-34px;
}

.corner.br{
    right:-34px;
    bottom:-34px;
}


/* =========================
   顶部导航
========================= */

.top-nav{
    position:absolute;
    left:58px;
    right:58px;
    top:38px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    z-index:20;
}

.logo{
    display:flex;
    align-items:baseline;
    gap:10px;
    color:#d9edff;
    text-decoration:none;
}

.logo-mark{
    width:auto;
    height:auto;
    display:block;
    flex-shrink:0;
    font-family:"Times New Roman",serif;
    font-size:21px;
    font-weight:400;
    line-height:1;
    color:rgba(137,201,239,.9);
    position:relative;
    top:1px;
    text-shadow:
        0 0 7px rgba(76,159,216,.5),
        0 0 15px rgba(49,132,191,.22);
}

.logo-text{
    display:flex;
    flex-direction:column;
    line-height:1.05;
}

.logo-cn{
    font-family:"Noto Serif SC",serif;
    font-size:15px;
    font-weight:400;
    letter-spacing:2px;
}

.logo-en{
    margin-top:5px;
    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:3px;
    color:rgba(157,204,239,.63);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:31px;
}

.nav-links a{
    position:relative;
    color:rgba(191,220,243,.68);
    text-decoration:none;
    font-family:"Noto Serif SC",serif;
    font-size:12px;
    letter-spacing:2px;
    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-8px;
    width:0;
    height:1px;
    background:rgba(122,192,235,.7);
    transform:translateX(-50%);
    transition:width .3s ease;
}

.nav-links a:hover{
    color:#d9efff;
    text-shadow:0 0 8px rgba(102,180,231,.35);
}

.nav-links a:hover::after{
    width:100%;
}


/* =========================
   主体
========================= */

.main{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:5;
    padding:80px 20px 70px;
}


/* =========================
   魔法圆阵
========================= */

.magic-circle{
    position:absolute;
    width:560px;
    height:560px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    opacity:.55;
}

.magic-circle::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(73,143,198,.28);
    box-shadow:0 0 22px rgba(47,126,184,.08);
    animation:rotateCircle 80s linear infinite;
}

.magic-circle::after{
    content:"";
    position:absolute;
    inset:27px;
    border-radius:50%;
    border:1px solid rgba(91,162,213,.22);
    box-shadow:inset 0 0 20px rgba(62,139,194,.04);
    animation:rotateCircleReverse 55s linear infinite;
}

@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* ==========================================================
   三重魔法星轨
========================================================== */

.orbit-system{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
}

.orbit-track{
    fill:none;
    stroke:rgba(69,164,230,.28);
    stroke-width:1;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 0 4px rgba(70,155,210,.10));
}


/* =========================
   小星辰
========================= */

#travellingStar{
    font-family:"Times New Roman",serif;
    font-size:15px;
    fill:rgba(210,239,255,.98);
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
    filter:
        drop-shadow(0 0 3px rgba(131,207,250,.95))
        drop-shadow(0 0 8px rgba(74,165,224,.65));
}

.star-glow{
    fill:rgba(143,210,246,.09);
    filter:blur(2px);
    pointer-events:none;
}


/* =========================
   中央魔法线
========================= */

.magic-line{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(92,164,213,.13);
}

.magic-line.horizontal{
    width:490px;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:490px;
}


/* =========================
   中央小圆
========================= */

.magic-center{
    position:absolute;
    left:50%;
    top:50%;
    width:12px;
    height:12px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(133,202,242,.48);
    border-radius:50%;
    box-shadow:0 0 10px rgba(88,171,224,.25);
}

.magic-center::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:3px;
    height:3px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(174,221,249,.7);
    box-shadow:0 0 8px rgba(126,203,244,.8);
}


/* =========================
   标题
========================= */

.title-area{
    position:relative;
    text-align:center;
    z-index:8;
    margin-top:-18px;
}

.main-title{
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:"Cinzel","Cormorant Garamond",serif;
    font-weight:400;
    line-height:.83;
    letter-spacing:8px;
    color:#dceeff;
    text-shadow:0 0 18px rgba(94,172,222,.08);
}

.main-title .seyami{
    font-size:70px;
}

.main-title .archive{
    margin-top:15px;
    font-size:87px;
    letter-spacing:9px;
}


/* =========================
   标题装饰
========================= */

.title-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:29px;
    opacity:.7;
}

.title-decoration .line{
    width:95px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(115,182,224,.62)
    );
}

.title-decoration .line.right{
    background:linear-gradient(
        90deg,
        rgba(115,182,224,.62),
        transparent
    );
}

.title-decoration .diamond{
    width:6px;
    height:6px;
    border:1px solid rgba(143,202,237,.8);
    transform:rotate(45deg);
}


/* =========================
   中文标题
========================= */

.chinese-title{
    margin-top:24px;
    font-family:"Noto Serif SC",serif;
    font-size:20px;
    font-weight:300;
    letter-spacing:8px;
    color:rgba(207,229,246,.86);
}


/* =========================
   描述
========================= */

.description{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:7px;
    text-align:center;
    color:rgba(177,207,230,.62);
    font-family:"Noto Serif SC",serif;
    font-size:12px;
    line-height:1.7;
    letter-spacing:2px;
}


/* =========================
   进入按钮
========================= */

.enter-wrap{
    position:relative;
    width:370px;
    height:82px;
    margin-top:42px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.enter-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    clip-path:polygon(
        0 20%,
        5% 20%,
        8% 0,
        92% 0,
        95% 20%,
        100% 20%,
        100% 80%,
        95% 80%,
        92% 100%,
        8% 100%,
        5% 80%,
        0 80%
    );
    border:1px solid rgba(91,167,218,.38);
    background:rgba(8,28,49,.48);
    box-shadow:0 0 22px rgba(39,120,180,.08);
    pointer-events:none;
}

.enter-wrap::after{
    content:"";
    position:absolute;
    left:13px;
    right:13px;
    top:13px;
    bottom:13px;
    border:1px solid rgba(91,164,213,.16);
    pointer-events:none;
}

.enter-button{
    position:relative;
    z-index:2;
    width:300px;
    height:50px;
    border:none;
    outline:none;
    cursor:pointer;
    color:#d9edff;
    font-family:"Noto Serif SC",serif;
    font-size:13px;
    letter-spacing:4px;
    background:linear-gradient(
        90deg,
        rgba(8,31,52,.88),
        rgba(17,51,78,.88),
        rgba(8,31,52,.88)
    );
    border-top:1px solid rgba(105,180,225,.38);
    border-bottom:1px solid rgba(105,180,225,.38);
    transition:
        background .35s ease,
        box-shadow .35s ease,
        letter-spacing .35s ease;
}

.enter-button:hover{
    background:linear-gradient(
        90deg,
        rgba(10,41,67,.95),
        rgba(23,66,98,.95),
        rgba(10,41,67,.95)
    );
    box-shadow:0 0 22px rgba(56,143,201,.18);
    letter-spacing:5px;
}

.enter-button:active{
    transform:translateY(1px);
}

.enter-star{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    color:rgba(111,186,229,.75);
    font-size:16px;
    text-shadow:0 0 9px rgba(67,158,215,.45);
}

.enter-star.left{
    left:26px;
}

.enter-star.right{
    right:26px;
}

.enter-diamond{
    position:absolute;
    left:50%;
    width:6px;
    height:6px;
    transform:translateX(-50%) rotate(45deg);
    border:1px solid rgba(116,187,226,.65);
    background:#061426;
}

.enter-diamond.top{
    top:-3px;
}

.enter-diamond.bottom{
    bottom:-3px;
}


/* =========================
   Footer
========================= */

.footer{
    position:absolute;
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
    z-index:15;
    color:rgba(133,177,207,.38);
    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:4px;
    white-space:nowrap;
}


/* ==========================================================
   平板
========================================================== */

@media(max-width:800px){

    .top-nav{
        left:35px;
        right:35px;
        top:30px;
    }

    .nav-links{
        gap:17px;
    }

    .nav-links a{
        font-size:11px;
        letter-spacing:1px;
    }

    .magic-circle{
        width:500px;
        height:500px;
    }

    .main-title .seyami{
        font-size:58px;
    }

    .main-title .archive{
        font-size:70px;
    }

    .chinese-title{
        font-size:18px;
    }

    .description{
        font-size:11px;
    }

}


/* ==========================================================
   手机
========================================================== */

@media(max-width:520px){

    .frame{
        inset:12px;
    }

    .top-nav{
        left:25px;
        right:25px;
        top:24px;
    }

    .logo{
        gap:8px;
        align-items:baseline;
    }

    .logo-mark{
        font-size:18px;
        position:relative;
        top:1px;
    }

    .logo-cn{
        font-size:12px;
        letter-spacing:1px;
    }

    .logo-en{
        font-size:6px;
        letter-spacing:2px;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:9px;
        letter-spacing:0;
    }

    .corner{
        width:55px;
        height:55px;
    }

    .corner.tl{
        left:-27.5px;
        top:-27.5px;
    }

    .corner.tr{
        right:-27.5px;
        top:-27.5px;
    }

    .corner.bl{
        left:-27.5px;
        bottom:-27.5px;
    }

    .corner.br{
        right:-27.5px;
        bottom:-27.5px;
    }

    .corner::before{
        font-size:26px;
    }

    .main{
        padding:100px 15px 70px;
    }

    .magic-circle{
        width:390px;
        height:390px;
        opacity:.48;
    }

    .magic-line.horizontal{
        width:350px;
    }

    .magic-line.vertical{
        height:350px;
    }

    .main-title{
        letter-spacing:5px;
    }

    .main-title .seyami{
        font-size:43px;
    }

    .main-title .archive{
        margin-top:11px;
        font-size:53px;
        letter-spacing:6px;
    }

    .title-decoration{
        margin-top:23px;
    }

    .title-decoration .line{
        width:55px;
    }

    .chinese-title{
        margin-top:20px;
        font-size:15px;
        letter-spacing:5px;
    }

    .description{
        margin-top:16px;
        font-size:10px;
        letter-spacing:1px;
    }

    .enter-wrap{
        width:320px;
        height:76px;
        margin-top:35px;
    }

    .enter-button{
        width:255px;
        height:46px;
        font-size:11px;
        letter-spacing:3px;
    }

    .enter-star.left{
        left:23px;
    }

    .enter-star.right{
        right:23px;
    }

    .footer{
        bottom:21px;
        font-size:6px;
        letter-spacing:2px;
    }

}

</style>

</head>


<body>

<div class="page">


    <!-- 背景星空 -->

    <div class="stars"></div>


    <!-- 浮动装饰星 -->

    <div class="floating-stars">

        <span>✦</span>
        <span>✧</span>
        <span>·</span>
        <span>✶</span>
        <span>✦</span>
        <span>·</span>
        <span>✧</span>
        <span>✡</span>
        <span>✦</span>
        <span>✶</span>
        <span>·</span>
        <span>✧</span>

    </div>


    <!-- 外框 -->

    <div class="frame">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

    </div>


    <!-- 顶部 -->

    <header class="top-nav">

        <a href="index.html" class="logo">

            <div class="logo-mark">
                ✶
            </div>

            <div class="logo-text">

                <span class="logo-cn">
                    塞垭弥大陆档案馆
                </span>

                <span class="logo-en">
                    SEYAMI ARCHIVE
                </span>

            </div>

        </a>


        <nav class="nav-links">

            <a href="index.html">
                首页
            </a>

            <a href="archive.html">
                档案目录
            </a>

            <a href="about.html">
                关于我们
            </a>

        </nav>

    </header>


    <!-- 主体 -->

    <main class="main">


        <!-- ==================================================
             魔法阵 + 三条动态星轨
        =================================================== -->

        <div class="magic-circle">

            <svg
                id="orbitSVG"
                class="orbit-system"
                viewBox="0 0 560 560"
                preserveAspectRatio="xMidYMid meet"
                aria-hidden="true"
            >

                <!-- 第一轨 -->

                <g id="orbitA">

                    <ellipse
                        id="ellipseA"
                        class="orbit-track"
                        cx="280"
                        cy="280"
                        rx="250"
                        ry="95"
                    />

                </g>


                <!-- 第二轨 -->

                <g id="orbitB">

                    <ellipse
                        id="ellipseB"
                        class="orbit-track"
                        cx="280"
                        cy="280"
                        rx="210"
                        ry="72.5"
                    />

                </g>


                <!-- 第三轨 -->

                <g id="orbitC">

                    <ellipse
                        id="ellipseC"
                        class="orbit-track"
                        cx="280"
                        cy="280"
                        rx="165"
                        ry="52.5"
                    />

                </g>


                <!-- 小星辰光晕 -->

                <circle
                    id="starGlow"
                    class="star-glow"
                    cx="280"
                    cy="280"
                    r="7"
                />


                <!-- 唯一的小星辰 -->

                <text
                    id="travellingStar"
                    x="280"
                    y="280"
                >✦</text>


            </svg>


            <!-- 横竖魔法线 -->

            <div class="magic-line horizontal"></div>

            <div class="magic-line vertical"></div>


            <!-- 中央魔法点 -->

            <div class="magic-center"></div>


        </div>


        <!-- ==================================================
             标题
        =================================================== -->

        <section class="title-area">


            <h1 class="main-title">

                <span class="seyami">
                    SEYAMI

                    ARCHIVE
                </span>

            </h1>


            <div class="title-decoration">

                <span class="line"></span>

                <span class="diamond"></span>

                <span class="line right"></span>

            </div>


            <div class="chinese-title">
                塞垭弥大陆档案馆
            </div>


            <div class="description">

                <span>
                    记录关于这片大陆的一切。
                </span>

                <span>
                    角色、种族、地域、历史，以及那些尚未被发现的故事。
                </span>

            </div>


            <div class="enter-wrap">

                <span class="enter-star left">
                    ✡
                </span>


                <button
                    class="enter-button"
                    onclick="location.href='archive.html'"
                >
                    开启塞垭弥档案　→
                </button>


                <span class="enter-star right">
                    ✡
                </span>


                <span class="enter-diamond top"></span>

                <span class="enter-diamond bottom"></span>

            </div>


        </section>


    </main>


    <!-- Footer -->

    <footer class="footer">
        ✦　THE ARCHIVES OF SEYAMI　✦
    </footer>


</div>


<script>

/* =========================================================
   SEYAMI ARCHIVE
   三轨换轨星辰系统 · 修正版

   A：38秒 / 顺时针
   B：32秒 / 逆时针
   C：25秒 / 顺时针

   路线：

   A
   ↓
   A / B
   ↓
   B
   ↓
   B / C
   ↓
   C
   ↓
   C / A
   ↓
   A

   核心修复：

   每次换轨时，不再直接把上一条轨道的
   参数角度复制给下一条轨道。

   而是：

   1. 找到真实世界坐标交点
   2. 星辰移动到交点
   3. 把交点重新转换成下一轨的参数
   4. 再沿下一轨继续运行

========================================================= */


(function(){


    const svg =
        document.getElementById("orbitSVG");

    const star =
        document.getElementById("travellingStar");

    const glow =
        document.getElementById("starGlow");


    if(!svg || !star || !glow){
        return;
    }


    /* =========================
       基础坐标
    ========================= */

    const CX = 280;
    const CY = 280;


    /* =========================
       三条轨道

       rotation：
       初始倾角

       angularSpeed：
       轨道自身旋转速度
    ========================= */

    const tracks = [

        {
            id:"A",
            rx:250,
            ry:95,
            rotation:0,
            angularSpeed:360 / 38
        },

        {
            id:"B",
            rx:210,
            ry:72.5,
            rotation:55,
            angularSpeed:-360 / 32
        },

        {
            id:"C",
            rx:165,
            ry:52.5,
            rotation:110,
            angularSpeed:360 / 25
        }

    ];


    /* =========================
       当前轨道
    ========================= */

    let currentTrack = 0;


    /*
       星辰在当前轨道上的
       本地参数角度
    */

    let starParameter = 25;


    /*
       目标参数
    */

    let targetParameter = 25;


    /*
       当前目标世界坐标

       换轨时使用
    */

    let targetWorld = null;


    /*
       是否已经拥有目标
    */

    let hasTarget = false;


    /*
       动画开始时间
    */

    const animationStart =
        performance.now();


    let lastTime =
        animationStart;


    /*
       星辰移动速度

       调低一点，
       让它看起来像魔法星辰，
       而不是快速飞行的小点。
    */

    const STAR_SPEED = 13;


    /*
       换轨完成后
       休息一点点时间

       让交界处有一种
       “接触 → 换轨”的感觉。
    */

    let switchCooldown = 0;


    /* =====================================================
       工具函数
    ===================================================== */

    function rad(deg){

        return deg * Math.PI / 180;

    }


    function normalize(angle){

        angle %= 360;

        if(angle < 0){
            angle += 360;
        }

        return angle;

    }


    /*
       当前时间下
       某一轨道自己的旋转角度
    */

    function trackRotation(
        track,
        elapsed
    ){

        return (
            track.rotation +
            track.angularSpeed *
            elapsed / 1000
        );

    }


    /*
       本地椭圆参数
       → 世界坐标
    */

    function pointOnTrack(
        track,
        parameter,
        elapsed
    ){

        const angle =
            parameter +
            trackRotation(
                track,
                elapsed
            );


        const r =
            rad(angle);


        return {

            x:
                CX +
                track.rx *
                Math.cos(r),

            y:
                CY +
                track.ry *
                Math.sin(r)

        };

    }


    /*
       世界坐标
       → 当前轨道的本地参数

       这个函数就是这次修复的关键。
    */

    function parameterFromWorld(
        track,
        x,
        y,
        elapsed
    ){

        const dx =
            x - CX;

        const dy =
            y - CY;


        /*
           先把轨道自身旋转反向抵消。
        */

        const rotation =
            trackRotation(
                track,
                elapsed
            );


        const r =
            -rad(rotation);


        const localX =
            dx * Math.cos(r) -
            dy * Math.sin(r);

        const localY =
            dx * Math.sin(r) +
            dy * Math.cos(r);


        /*
           再根据椭圆参数求角度。
        */

        const angle =
            Math.atan2(
                localY / track.ry,
                localX / track.rx
            ) * 180 / Math.PI;


        return normalize(angle);

    }


    /*
       两个角度之间
       顺着正方向前进多少
    */

    function forwardDistance(
        from,
        to
    ){

        return normalize(
            to - from
        );

    }


    /*
       计算两个轨道在当前时刻
       的交点。

       用高密度采样寻找，
       不会影响页面视觉。
    */

    function findIntersections(
        indexA,
        indexB,
        elapsed
    ){

        const A =
            tracks[indexA];

        const B =
            tracks[indexB];


        const candidates = [];


        /*
           720 个采样点足够精细。
        */

        const samples = 720;


        for(
            let i = 0;
            i < samples;
            i++
        ){

            const pA =
                i * 360 / samples;


            const worldA =
                pointOnTrack(
                    A,
                    pA,
                    elapsed
                );


            /*
               直接寻找 B 上
               最接近的位置。
            */

            let bestB = null;


            for(
                let j = 0;
                j < samples;
                j += 2
            ){

                const pB =
                    j * 360 / samples;


                const worldB =
                    pointOnTrack(
                        B,
                        pB,
                        elapsed
                    );


                const dx =
                    worldA.x -
                    worldB.x;

                const dy =
                    worldA.y -
                    worldB.y;


                const d =
                    dx * dx +
                    dy * dy;


                if(
                    bestB === null ||
                    d < bestB.distance
                ){

                    bestB = {

                        parameter:pB,

                        x:worldB.x,
                        y:worldB.y,

                        distance:d

                    };

                }

            }


            /*
               只接受真正靠近的交点。
            */

            if(
                bestB &&
                bestB.distance < 5
            ){

                const already =
                    candidates.some(
                        c => {

                            const dx =
                                c.x -
                                worldA.x;

                            const dy =
                                c.y -
                                worldA.y;

                            return (
                                Math.sqrt(
                                    dx * dx +
                                    dy * dy
                                ) < 12
                            );

                        }
                    );


                if(!already){

                    candidates.push({

                        parameterA:pA,

                        parameterB:
                            bestB.parameter,

                        x:
                            (worldA.x +
                             bestB.x) / 2,

                        y:
                            (worldA.y +
                             bestB.y) / 2,

                        distance:
                            Math.sqrt(
                                bestB.distance
                            )

                    });

                }

            }

        }


        return candidates;

    }


    /*
       获取离星辰前进方向最近的交点
    */

    function getNextIntersection(
        currentIndex,
        nextIndex,
        elapsed
    ){

        const intersections =
            findIntersections(
                currentIndex,
                nextIndex,
                elapsed
            );


        if(
            intersections.length === 0
        ){

            return null;

        }


        let best = null;

        let bestDistance =
            Infinity;


        for(
            const intersection
            of intersections
        ){

            const distance =
                forwardDistance(
                    starParameter,
                    intersection.parameterA
                );


            /*
               避免选择身后的交点。

               如果距离太大，
               仍然允许寻找最近的。
            */

            const score =
                distance <= 180
                ? distance
                : distance + 360;


            if(
                score <
                bestDistance
            ){

                bestDistance =
                    score;

                best =
                    intersection;

            }

        }


        return best;

    }


    /* =====================================================
       设置下一个交界
    ===================================================== */

    function prepareNextIntersection(
        elapsed
    ){

        const nextTrack =
            (currentTrack + 1) % 3;


        const intersection =
            getNextIntersection(
                currentTrack,
                nextTrack,
                elapsed
            );


        if(!intersection){
            return;
        }


        targetParameter =
            intersection.parameterA;


        targetWorld = {

            x:intersection.x,
            y:intersection.y

        };


        hasTarget = true;

    }


    /* =====================================================
       更新轨道旋转
    ===================================================== */

    function updateOrbitTransforms(
        elapsed
    ){

        const groupA =
            document.getElementById(
                "orbitA"
            );

        const groupB =
            document.getElementById(
                "orbitB"
            );

        const groupC =
            document.getElementById(
                "orbitC"
            );


        groupA.setAttribute(
            "transform",
            `rotate(
                ${trackRotation(
                    tracks[0],
                    elapsed
                )}
                ${CX}
                ${CY}
            )`
        );


        groupB.setAttribute(
            "transform",
            `rotate(
                ${trackRotation(
                    tracks[1],
                    elapsed
                )}
                ${CX}
                ${CY}
            )`
        );


        groupC.setAttribute(
            "transform",
            `rotate(
                ${trackRotation(
                    tracks[2],
                    elapsed
                )}
                ${CX}
                ${CY}
            )`
        );

    }


    /* =====================================================
       更新星辰
    ===================================================== */

    function updateStar(
        elapsed
    ){

        const track =
            tracks[currentTrack];


        /*
           当前轨道上的精确位置
        */

        const position =
            pointOnTrack(
                track,
                starParameter,
                elapsed
            );


        star.setAttribute(
            "x",
            position.x
        );


        star.setAttribute(
            "y",
            position.y
        );


        glow.setAttribute(
            "cx",
            position.x
        );


        glow.setAttribute(
            "cy",
            position.y
        );

    }


    /* =====================================================
       真正换轨
    ===================================================== */

    function switchTrack(
        elapsed
    ){

        /*
           记录交界世界坐标
        */

        const x =
            targetWorld.x;

        const y =
            targetWorld.y;


        /*
           下一轨
        */

        const nextTrack =
            (currentTrack + 1) % 3;


        /*
           切换轨道
        */

        currentTrack =
            nextTrack;


        /*
           ★ 核心：

           把同一个世界交点
           重新计算成下一轨自己的角度。

           所以星辰不会突然
           飞离轨道。
        */

        starParameter =
            parameterFromWorld(
                tracks[currentTrack],
                x,
                y,
                elapsed
            );


        targetWorld = null;

        hasTarget = false;


        /*
           极短冷却，
           避免在同一个交点
           立即再次换轨。
        */

        switchCooldown =
            180;

    }


    /* =====================================================
       主动画
    ===================================================== */

    function animate(now){

        const elapsed =
            now - animationStart;


        const delta =
            now - lastTime;


        /*
           三条轨道独立旋转

           A = 38s
           B = 32s
           C = 25s
        */

        updateOrbitTransforms(
            elapsed
        );


        /*
           冷却倒计时
        */

        if(
            switchCooldown > 0
        ){

            switchCooldown -= delta;

        }


        /*
           没有目标的时候，
           寻找下一交界。
        */

        if(
            !hasTarget &&
            switchCooldown <= 0
        ){

            prepareNextIntersection(
                elapsed
            );

        }


        /*
           星辰沿当前轨道前进
        */

        if(
            hasTarget &&
            switchCooldown <= 0
        ){

            const distance =
                forwardDistance(
                    starParameter,
                    targetParameter
                );


            /*
               正常速度
            */

            let movement =
                STAR_SPEED *
                delta /
                1000;


            /*
               接近交界的时候
               稍微减速。
            */

            if(
                distance < 25
            ){

                movement *=
                    Math.max(
                        0.28,
                        distance / 25
                    );

            }


            /*
               如果已经非常接近，
               直接进入交界。
            */

            if(
                distance < 1.5
            ){

                /*
                   先把星辰准确放到
                   当前轨道交界位置。
                */

                starParameter =
                    targetParameter;


                /*
                   再执行换轨。
                */

                switchTrack(
                    elapsed
                );

            }else{

                /*
                   正常前进
                */

                starParameter =
                    normalize(
                        starParameter +
                        movement
                    );

            }

        }


        /*
           更新星辰位置
        */

        updateStar(
            elapsed
        );


        lastTime =
            now;


        requestAnimationFrame(
            animate
        );

    }


    /*
       初始位置

       从第一轨开始。
    */

    starParameter =
        25;


    /*
       启动
    */

    requestAnimationFrame(
        animate
    );


})();

</script>
