<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(17,52,100,.34) 0%,
            rgba(7,29,62,.45) 28%,
            rgba(3,17,39,.82) 62%,
            #020a1b 100%
        );

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;
}


/* =========================================================
   星空背景
========================================================= */

.space{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:0;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#c5e1ff;

    box-shadow:
        0 0 4px rgba(130,190,245,.65),
        0 0 9px rgba(62,125,205,.4);

    animation:
        twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{

    0%,
    100%{
        opacity:.2;
        transform:scale(.7);
    }

    50%{
        opacity:.8;
        transform:scale(1.3);
    }
}


/* =========================================================
   大型星芒
========================================================= */

.big-star{
    position:absolute;

    width:7px;
    height:7px;

    background:#d5eaff;

    transform:rotate(45deg);

    box-shadow:
        0 0 7px #6ca9df,
        0 0 17px rgba(53,112,185,.65);

    opacity:.72;

    animation:
        bigStar 5s ease-in-out infinite;
}

.big-star::before,
.big-star::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:linear-gradient(
        to bottom,
        transparent,
        #9bc8ed,
        transparent
    );
}

.big-star::before{
    width:1px;
    height:30px;
}

.big-star::after{
    width:30px;
    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        #9bc8ed,
        transparent
    );
}

@keyframes bigStar{

    0%,
    100%{
        opacity:.28;
        transform:rotate(45deg) scale(.75);
    }

    50%{
        opacity:.85;
        transform:rotate(45deg) scale(1);
    }
}


/* =========================================================
   档案馆外框
========================================================= */

.frame{
    position:fixed;

    inset:22px;

    border:1px solid rgba(69,128,191,.38);

    pointer-events:none;

    z-index:20;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    left:32px;
    right:32px;

    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        rgba(65,126,191,.58),
        rgba(111,166,218,.68),
        rgba(65,126,191,.58),
        transparent
    );
}

.frame::before{
    top:12px;
}

.frame::after{
    bottom:12px;
}


/* =========================================================
   四角六芒星矢量装饰
========================================================= */

.corner{
    position:absolute;

    width:72px;
    height:72px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.corner svg{
    width:72px;
    height:72px;

    overflow:visible;

    opacity:.72;

    filter:
        drop-shadow(
            0 0 5px rgba(79,147,211,.28)
        );
}

.corner svg line,
.corner svg polygon{
    fill:none;

    stroke:#6eaddd;

    stroke-width:1;

    vector-effect:non-scaling-stroke;
}

.corner svg .soft{
    stroke:#4d8cbd;

    opacity:.72;
}

.corner.tl{
    left:-1px;
    top:-1px;
}

.corner.tr{
    right:-1px;
    top:-1px;

    transform:scaleX(-1);
}

.corner.bl{
    left:-1px;
    bottom:-1px;

    transform:scaleY(-1);
}

.corner.br{
    right:-1px;
    bottom:-1px;

    transform:scale(-1);
}


/* =========================================================
   星空魔法阵
========================================================= */

.magic-circle{
    position:absolute;

    width:510px;
    height:510px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        rotate(-8deg);

    opacity:.39;

    filter:
        drop-shadow(
            0 0 12px rgba(38,101,169,.28)
        );

    pointer-events:none;
}


/* =========================================================
   圆环
========================================================= */

.circle{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:1px solid rgba(70,135,196,.48);

    transform:translate(-50%,-50%);
}

.circle.c1{
    width:490px;
    height:490px;
}

.circle.c2{
    width:420px;
    height:420px;

    border-color:
        rgba(62,121,183,.38);
}

.circle.c3{
    width:330px;
    height:330px;

    border-style:dashed;

    border-color:
        rgba(75,143,204,.42);
}

.circle.c4{
    width:250px;
    height:250px;

    border-color:
        rgba(64,124,188,.38);
}

.circle.c5{
    width:180px;
    height:180px;

    border-style:dashed;

    border-color:
        rgba(82,151,211,.42);
}


/* =========================================================
   真正的多层星轨
========================================================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(66,131,194,.46);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotate(0deg);
}

.orbit.o1{
    width:450px;
    height:180px;

    animation:
        orbitOne 28s linear infinite;
}

.orbit.o2{
    width:390px;
    height:140px;

    border-color:
        rgba(79,143,201,.44);

    transform:
        translate(-50%,-50%)
        rotate(58deg);

    animation:
        orbitTwo 22s linear infinite;
}

.orbit.o3{
    width:310px;
    height:110px;

    border-color:
        rgba(59,119,181,.5);

    transform:
        translate(-50%,-50%)
        rotate(-45deg);

    animation:
        orbitThree 18s linear infinite;
}

@keyframes orbitOne{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes orbitTwo{

    from{
        transform:
            translate(-50%,-50%)
            rotate(58deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-302deg);
    }
}

@keyframes orbitThree{

    from{
        transform:
            translate(-50%,-50%)
            rotate(-45deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(315deg);
    }
}


/* =========================================================
   魔法阵十字
========================================================= */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(74,139,199,.55),
            transparent
        );
}

.magic-line.horizontal{
    width:490px;
    height:1px;
}

.magic-line.vertical{
    width:1px;
    height:490px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(74,139,199,.55),
            transparent
        );
}


/* =========================================================
   中央六芒星
========================================================= */

.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:182px;

    border:1px solid rgba(76,143,204,.38);

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    clip-path:polygon(
        50% 0%,
        100% 25%,
        100% 75%,
        50% 100%,
        0% 75%,
        0% 25%
    );
}

.magic-circle::after{
    transform:
        translate(-50%,-50%)
        rotate(90deg);

    opacity:.6;
}


/* =========================================================
   Header
========================================================= */

header{
    position:relative;

    z-index:10;

    width:min(1200px, calc(100% - 100px));

    margin:0 auto;

    padding-top:48px;

    display:flex;

    align-items:center;
    justify-content:space-between;
}


/* =========================================================
   左侧 LOGO
========================================================= */

.logo{
    display:flex;

    align-items:center;

    gap:14px;

    text-decoration:none;

    color:#bdd7ef;
}

.logo-symbol{
    width:34px;
    height:34px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid rgba(83,145,198,.58);

    border-radius:50%;

    color:#75add9;

    font-size:18px;

    box-shadow:
        0 0 10px rgba(48,104,164,.18);
}

.logo-text{
    font-family:"Cinzel",serif;

    font-size:14px;

    letter-spacing:.22em;

    color:#aac9e6;

    line-height:1.4;
}

.logo-text span{
    display:block;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:10px;

    letter-spacing:.25em;

    color:#55799d;
}


/* =========================================================
   导航
========================================================= */

nav{
    display:flex;

    align-items:center;

    gap:34px;
}

nav a{
    position:relative;

    color:#8caac8;

    text-decoration:none;

    font-size:13px;

    letter-spacing:.14em;

    transition:.35s ease;
}

nav a:hover{
    color:#d5e8f8;
}

nav a.active{
    color:#d3e7f8;
}

nav a.active::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-9px;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#70acd8;

    box-shadow:
        0 0 7px #5595c5;

    transform:translateX(-50%);
}


/* =========================================================
   Header 中央星星
========================================================= */

.header-star{
    position:absolute;

    left:50%;
    top:63px;

    transform:translateX(-50%);

    color:#8fbcd9;

    font-size:15px;

    text-shadow:
        0 0 8px #4c8ab8,
        0 0 16px rgba(42,100,155,.55);

    animation:
        headerStar 4s ease-in-out infinite;
}

@keyframes headerStar{

    0%,
    100%{
        opacity:.4;
    }

    50%{
        opacity:.85;
    }
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    z-index:5;

    min-height:calc(100vh - 110px);

    display:flex;

    justify-content:center;

    align-items:flex-start;
}

.hero-content{

    width:min(1000px, calc(100% - 70px));

    margin-top:75px;

    text-align:center;
}


/* =========================================================
   标题
========================================================= */

.title{
    position:relative;

    display:block;

    width:100%;

    font-family:"Cinzel",serif;

    font-size:clamp(
        66px,
        8.2vw,
        118px
    );

    font-weight:400;

    letter-spacing:.075em;

    line-height:.98;

    color:#e1edf7;

    text-shadow:
        0 0 5px rgba(196,222,242,.38),
        0 0 18px rgba(65,124,176,.25);
}

.title span{
    display:block;
}


/* =========================================================
   副标题
========================================================= */

.subtitle{
    margin-top:28px;

    font-size:18px;

    letter-spacing:.48em;

    text-indent:.48em;

    color:#bcd4e9;

    text-shadow:
        0 0 10px rgba(63,119,170,.2);
}


/* =========================================================
   副标题装饰
========================================================= */

.subtitle-decoration{
    width:min(620px, 72vw);

    margin:17px auto 0;

    display:flex;

    align-items:center;

    gap:16px;
}

.subtitle-decoration::before,
.subtitle-decoration::after{
    content:"";

    flex:1;

    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(65,126,184,.52)
        );
}

.subtitle-decoration::after{
    transform:scaleX(-1);
}

.subtitle-decoration span{
    width:5px;
    height:5px;

    background:#80b6dc;

    transform:rotate(45deg);

    box-shadow:
        0 0 6px #528cb8;
}


/* =========================================================
   中央小星
========================================================= */

.center-star{
    margin-top:16px;

    color:#88b6d8;

    font-size:15px;

    letter-spacing:.5em;

    text-shadow:
        0 0 8px #528eb9,
        0 0 17px rgba(55,111,165,.55);
}


/* =========================================================
   介绍文字
========================================================= */

.description{

    width:min(650px, 82vw);

    margin:22px auto 0;

    color:#7f9fbd;

    font-size:13px;

    line-height:2.15;

    letter-spacing:.12em;

    text-shadow:
        0 0 7px rgba(43,94,145,.14);
}


/* =========================================================
   进入档案馆按钮
========================================================= */

.enter-wrap{
    margin-top:38px;

    display:flex;

    justify-content:center;

    position:relative;
}

.enter-button{

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    width:300px;
    height:62px;

    border:none;

    background:
        linear-gradient(
            to bottom,
            rgba(7,29,57,.08),
            rgba(7,29,57,.22)
        );

    color:#c5dcec;

    text-decoration:none;

    font-size:13px;

    letter-spacing:.38em;

    text-indent:.38em;

    transition:.4s ease;
}


/* 上下多层线 */

.enter-button::before{
    content:"";

    position:absolute;

    left:0;
    right:0;

    top:0;

    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(100,158,201,.72),
            rgba(139,185,217,.82),
            rgba(100,158,201,.72),
            transparent
        );

    box-shadow:
        0 9px 0 rgba(69,128,174,.34),
        0 52px 0 rgba(69,128,174,.34),
        0 61px 0 rgba(100,158,201,.72);
}


/* 菱形两侧 */

.enter-button::after{

    content:"◇";

    position:absolute;

    left:-18px;
    top:50%;

    transform:translateY(-50%);

    color:#83b8d9;

    font-size:25px;

    font-family:"Cinzel",serif;

    text-shadow:
        0 0 7px rgba(73,137,181,.45);
}


/* 右侧菱形 */
.enter-wrap::after{

    content:"◇";

    position:absolute;

    right:calc(50% - 168px);

    top:50%;

    transform:translateY(-50%);

    color:#83b8d9;

    font-size:25px;

    font-family:"Cinzel",serif;

    text-shadow:
        0 0 7px rgba(73,137,181,.45);

    pointer-events:none;
}


/* 按钮悬停 */

.enter-button:hover{

    color:#e0eef8;

    text-shadow:
        0 0 8px rgba(107,165,207,.42);

    transform:translateY(-1px);
}


/* =========================================================
   按钮上下十字星
========================================================= */

.button-star{

    position:absolute;

    color:#8ab8d8;

    font-size:24px;

    line-height:1;

    text-shadow:
        0 0 7px rgba(74,137,182,.45);
}

.button-star.left{

    left:50%;

    top:-18px;

    transform:translateX(-50%);
}

.button-star.right{

    right:auto;

    left:50%;

    top:auto;

    bottom:-20px;

    transform:translateX(-50%);
}


/* =========================================================
   底部档案文字
========================================================= */

.archive-footer{
    position:absolute;

    left:50%;
    bottom:28px;

    transform:translateX(-50%);

    color:rgba(90,121,151,.38);

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:.38em;

    white-space:nowrap;
}

.archive-footer span{
    color:rgba(111,158,192,.5);

    margin:0 12px;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:900px){

    header{

        width:calc(100% - 60px);

        padding-top:38px;
    }

    nav{

        gap:20px;
    }

    nav a{

        font-size:11px;
    }

    .hero-content{

        margin-top:65px;
    }

    .title{

        font-size:clamp(
            54px,
            9vw,
            86px
        );
    }

    .magic-circle{

        transform:
            translate(-50%,-50%)
            scale(.82)
            rotate(-8deg);
    }

}


/* =========================================================
   手机
========================================================= */

@media(max-width:600px){

    .frame{

        inset:12px;
    }

    .frame::before,
    .frame::after{

        left:18px;
        right:18px;
    }

    header{

        width:calc(100% - 45px);

        padding-top:30px;
    }

    .logo{

        gap:9px;
    }

    .logo-symbol{

        width:29px;
        height:29px;

        font-size:15px;
    }

    .logo-text{

        font-size:10px;

        letter-spacing:.17em;
    }

    .logo-text span{

        font-size:7px;

        letter-spacing:.2em;
    }

    nav{

        gap:11px;
    }

    nav a{

        font-size:8px;

        letter-spacing:.06em;
    }

    .header-star{

        top:42px;

        font-size:12px;
    }


    /* 四角六芒星 */

    .corner{

        width:58px;
        height:58px;
    }

    .corner svg{

        width:58px;
        height:58px;
    }


    /* 内容 */

    .hero-content{

        width:calc(100% - 30px);

        margin-top:65px;
    }


    /* =====================================================
       手机标题
    ===================================================== */

    .title{

        width:100%;

        font-size:
            clamp(
                48px,
                15vw,
                68px
            );

        line-height:1.02;

        letter-spacing:.075em;

        padding:0 5px;
    }

    .title span{

        display:block;
    }


    .subtitle{

        margin-top:26px;

        font-size:14px;

        letter-spacing:.3em;

        text-indent:.3em;
    }

    .subtitle-decoration{

        width:86%;

        gap:9px;

        margin-top:14px;
    }

    .description{

        width:86%;

        font-size:10px;

        line-height:2.05;

        letter-spacing:.08em;

        margin-top:20px;
    }


    /* =====================================================
       手机按钮
    ===================================================== */

    .enter-wrap{

        margin-top:34px;
    }

    .enter-button{

        width:235px;

        height:58px;

        font-size:11px;

        letter-spacing:.32em;

        text-indent:.32em;
    }

    .enter-button::before{

        box-shadow:
            0 8px 0 rgba(69,128,174,.32),
            0 49px 0 rgba(69,128,174,.32),
            0 57px 0 rgba(100,158,201,.65);
    }

    .enter-button::after{

        left:-16px;

        font-size:22px;
    }

    .enter-wrap::after{

        right:calc(50% - 134px);

        font-size:22px;
    }

    .button-star{

        font-size:21px;
    }

    .button-star.left{

        top:-17px;
    }

    .button-star.right{

        bottom:-18px;
    }


    /* =====================================================
       魔法阵
    ===================================================== */

    .magic-circle{

        width:440px;
        height:440px;

        transform:
            translate(-50%,-50%)
            scale(.65)
            rotate(-8deg);
    }

    .circle.c1{

        width:490px;
        height:490px;
    }

    .circle.c2{

        width:420px;
        height:420px;
    }

    .circle.c3{

        width:330px;
        height:330px;
    }

    .circle.c4{

        width:250px;
        height:250px;
    }

    .circle.c5{

        width:180px;
        height:180px;
    }


    .archive-footer{

        bottom:20px;

        font-size:7px;

        letter-spacing:.25em;
    }

    .archive-footer span{

        margin:0 7px;
    }

}


/* =========================================================
   超小屏
========================================================= */

@media(max-width:380px){

    nav{

        gap:8px;
    }

    nav a{

        font-size:7px;
    }

    .hero-content{

        margin-top:55px;
    }

    .title{

        font-size:43px;
    }

    .subtitle{

        font-size:12px;
    }

    .description{

        font-size:9px;
    }

    .enter-button{

        width:220px;
    }

}


/* =========================================================
   四角六芒星 SVG
========================================================= */

</style>

</head>

<script>


/* =========================================================
   动态生成星空
========================================================= */

const space =
    document.getElementById("space");


/* 普通星星 */

for(let i = 0; i < 95; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const size =
        Math.random() * 2 + .5;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    star.style.animationDuration =
        3 + Math.random() * 5 + "s";

    space.appendChild(star);

}


/* =========================================================
   大型星芒
========================================================= */

const bigStarPositions = [

    [12,18],
    [83,15],
    [91,47],
    [8,70],
    [76,82],
    [24,87],
    [52,10],
    [44,78]

];

bigStarPositions.forEach(
    (position,index)=>{

        const star =
            document.createElement("div");

        star.className =
            "big-star";

        star.style.left =
            position[0] + "%";

        star.style.top =
            position[1] + "%";

        star.style.animationDelay =
            (index * .7) + "s";

        space.appendChild(star);

    }
);


/* =========================================================
   微小星尘
========================================================= */

for(let i = 0; i < 18; i++){

    const dust =
        document.createElement("div");

    dust.style.position =
        "absolute";

    dust.style.left =
        Math.random() * 100 + "%";

    dust.style.top =
        Math.random() * 100 + "%";

    dust.style.width =
        "1px";

    dust.style.height =
        "1px";

    dust.style.borderRadius =
        "50%";

    dust.style.background =
        "rgba(120,178,220,.65)";

    dust.style.boxShadow =
        "0 0 5px rgba(62,120,174,.55)";

    dust.style.opacity =
        .15 + Math.random() * .5;

    dust.style.animation =
        "twinkle " +
        (4 + Math.random() * 6) +
        "s ease-in-out infinite";

    dust.style.animationDelay =
        Math.random() * 6 + "s";

    space.appendChild(dust);

}

</script>
