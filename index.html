<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#061426;
    color:#d8e9f7;
    font-family:"Noto Serif SC",serif;
}


/* =========================
   背景
========================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    min-height:620px;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(34,92,137,.12) 0%,
            rgba(6,20,38,0) 42%
        ),
        #061426;
}


/* =========================
   背景星星
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    color:rgba(170,215,242,.38);
    font-family:"Times New Roman",serif;
    font-size:10px;
    animation:starFloat linear infinite;
}

.star:nth-child(1){
    left:8%;
    top:19%;
    animation-duration:7s;
}

.star:nth-child(2){
    left:17%;
    top:71%;
    font-size:7px;
    animation-duration:9s;
}

.star:nth-child(3){
    left:27%;
    top:14%;
    font-size:6px;
    animation-duration:8s;
}

.star:nth-child(4){
    left:38%;
    top:78%;
    font-size:9px;
    animation-duration:11s;
}

.star:nth-child(5){
    left:61%;
    top:17%;
    font-size:7px;
    animation-duration:10s;
}

.star:nth-child(6){
    left:73%;
    top:76%;
    font-size:8px;
    animation-duration:8s;
}

.star:nth-child(7){
    left:84%;
    top:25%;
    font-size:6px;
    animation-duration:12s;
}

.star:nth-child(8){
    left:91%;
    top:65%;
    font-size:9px;
    animation-duration:9s;
}

@keyframes starFloat{

    0%,
    100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:.7;
        transform:translateY(-7px);
    }
}


/* =========================
   浮动魔法符号
========================= */

.symbol{
    position:absolute;
    color:rgba(81,159,207,.16);
    font-family:"Times New Roman",serif;
    pointer-events:none;
    animation:symbolFloat 10s ease-in-out infinite;
}

.symbol.one{
    left:12%;
    top:35%;
    font-size:26px;
}

.symbol.two{
    right:13%;
    top:42%;
    font-size:20px;
    animation-delay:-4s;
}

.symbol.three{
    left:21%;
    bottom:17%;
    font-size:18px;
    animation-delay:-6s;
}

.symbol.four{
    right:23%;
    bottom:20%;
    font-size:25px;
    animation-delay:-2s;
}

@keyframes symbolFloat{

    0%,
    100%{
        opacity:.12;
        transform:translateY(0) rotate(0deg);
    }

    50%{
        opacity:.28;
        transform:translateY(-8px) rotate(8deg);
    }
}


/* =========================
   外框
========================= */

.outer-frame{
    position:absolute;
    inset:18px;
    border:1px solid rgba(91,153,191,.17);
    pointer-events:none;
}

.outer-frame::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(91,153,191,.07);
}


/* =========================
   四角六芒星
========================= */

.corner-star{
    position:absolute;
    z-index:10;
    color:rgba(103,174,219,.55);
    font-family:"Times New Roman",serif;
    font-size:29px;
    font-weight:400;
    line-height:1;
    text-shadow:0 0 8px rgba(55,132,181,.12);
}

.corner-star::after{
    content:"";
    position:absolute;
    width:28px;
    height:28px;
    border:1px solid rgba(74,139,180,.15);
    transform:rotate(45deg);
}

.corner-star.top-left{
    left:31px;
    top:29px;
}

.corner-star.top-right{
    right:31px;
    top:29px;
}

.corner-star.bottom-left{
    left:31px;
    bottom:29px;
}

.corner-star.bottom-right{
    right:31px;
    bottom:29px;
}


/* =========================
   顶部导航
========================= */

.topbar{
    position:absolute;
    left:55px;
    right:55px;
    top:45px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    z-index:20;
}


/* =========================
   左上角 Logo
========================= */

.logo{
    display:flex;
    align-items:baseline;
    gap:10px;

    color:inherit;
    text-decoration:none;
}

.logo-mark{
    width:auto;
    height:auto;
    display:block;
    flex-shrink:0;

    font-family:"Times New Roman",serif;
    font-size:21px;
    line-height:1;

    position:relative;
    top:1px;

    color:#8fc4e4;
}

.logo-text{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.logo-cn{
    font-size:14px;
    letter-spacing:3px;
    color:#b8d8ea;
    line-height:1.2;
}

.logo-en{
    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:3px;
    color:rgba(125,180,213,.58);
    line-height:1.2;
}


/* =========================
   导航
========================= */

.nav-links{
    display:flex;
    gap:38px;
    align-items:center;
}

.nav-links a{
    position:relative;

    color:rgba(179,211,231,.65);
    text-decoration:none;

    font-size:12px;
    letter-spacing:3px;

    transition:
        color .35s ease,
        text-shadow .35s ease;
}

.nav-links a::after{
    content:"";

    position:absolute;
    left:50%;
    bottom:-8px;

    width:0;
    height:1px;

    background:rgba(108,179,220,.6);

    transform:translateX(-50%);

    transition:width .35s ease;
}

.nav-links a:hover{
    color:#d9edf8;
    text-shadow:0 0 8px rgba(75,157,207,.18);
}

.nav-links a:hover::after{
    width:100%;
}


/* =========================
   中央魔法阵区域
========================= */

.magic-area{
    position:absolute;
    left:50%;
    top:50%;

    width:700px;
    height:470px;

    transform:translate(-50%,-50%);

    pointer-events:none;
}


/* =========================
   魔法圆环
========================= */

.magic-circle{
    position:absolute;
    left:50%;
    top:50%;

    width:510px;
    height:260px;

    transform:translate(-50%,-50%) rotate(-9deg);

    border:1px solid rgba(65,140,191,.15);
    border-radius:50%;
}

.magic-circle::before{
    content:"";

    position:absolute;
    inset:15px;

    border:1px solid rgba(65,140,191,.09);
    border-radius:50%;
}

.magic-circle::after{
    content:"";

    position:absolute;
    inset:38px;

    border:1px solid rgba(65,140,191,.06);
    border-radius:50%;
}


/* =========================
   第二层魔法阵
========================= */

.magic-circle-inner{
    position:absolute;
    left:50%;
    top:50%;

    width:410px;
    height:210px;

    transform:translate(-50%,-50%) rotate(18deg);

    border:1px solid rgba(65,140,191,.10);
    border-radius:50%;
}


/* =========================
   三层星轨
   —— 用户指定的最终版本
========================= */

.orbit{
    position:absolute;
    left:50%;
    top:50%;

    border:1px solid rgba(69,164,230,.30);
    border-radius:50%;

    box-shadow:
        0 0 6px rgba(70,155,210,.08);

    transform:translate(-50%,-50%);

    animation:orbitRotate 38s linear infinite;
}


/* 第一层 */

.orbit.one{
    width:500px;
    height:190px;
}


/* 第二层 */

.orbit.two{
    width:420px;
    height:145px;

    animation-direction:reverse;
    animation-duration:32s;
}


/* 第三层 */

.orbit.three{
    width:330px;
    height:105px;

    animation-duration:25s;
}


/* 星轨旋转 */

@keyframes orbitRotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =========================
   魔法十字线
========================= */

.magic-line-horizontal{
    position:absolute;

    left:50%;
    top:50%;

    width:520px;
    height:1px;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(76,150,194,.12),
            rgba(93,174,216,.18),
            rgba(76,150,194,.12),
            transparent
        );
}

.magic-line-vertical{
    position:absolute;

    left:50%;
    top:50%;

    width:1px;
    height:280px;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(76,150,194,.10),
            rgba(93,174,216,.16),
            rgba(76,150,194,.10),
            transparent
        );
}


/* =========================
   中心点
========================= */

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(132,205,239,.55);
    border-radius:50%;

    box-shadow:
        0 0 9px rgba(81,171,216,.35);
}


/* =========================
   主标题
========================= */

.hero{
    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:5;

    text-align:center;

    width:100%;
}

.main-title{
    display:flex;
    flex-direction:column;
    align-items:center;

    margin:0;

    font-family:"Cormorant Garamond","Cinzel",serif;
    font-weight:300;

    color:#d9edf8;

    line-height:.83;

    text-shadow:
        0 0 18px rgba(75,151,195,.06);
}

.main-title .seyami{
    font-size:82px;
    letter-spacing:19px;

    margin-right:-19px;
}

.main-title .archive{
    margin-top:10px;

    font-size:100px;
    letter-spacing:17px;

    margin-right:-17px;
}


/* =========================
   中文标题
========================= */

.hero-cn{
    margin-top:30px;

    font-size:16px;
    font-weight:300;

    letter-spacing:9px;

    margin-right:-9px;

    color:rgba(191,221,237,.86);
}

.hero-desc{
    margin-top:13px;

    font-size:10px;
    line-height:2;

    letter-spacing:3px;

    color:rgba(140,182,208,.56);
}


/* =========================
   进入按钮
========================= */

.enter-wrap{
    margin-top:35px;

    display:flex;
    justify-content:center;
}

.enter-button{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-width:205px;
    height:48px;

    padding:0 30px;

    color:#bcdced;

    text-decoration:none;

    font-size:12px;
    letter-spacing:4px;

    border:1px solid rgba(92,163,204,.36);

    background:
        linear-gradient(
            90deg,
            rgba(13,44,69,.20),
            rgba(24,65,94,.30),
            rgba(13,44,69,.20)
        );

    transition:
        color .4s ease,
        border-color .4s ease,
        background .4s ease,
        box-shadow .4s ease;
}

.enter-button::before,
.enter-button::after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-color:rgba(109,183,222,.7);
    border-style:solid;
}

.enter-button::before{
    left:-1px;
    top:-1px;

    border-width:1px 0 0 1px;
}

.enter-button::after{
    right:-1px;
    bottom:-1px;

    border-width:0 1px 1px 0;
}

.enter-button:hover{
    color:#e1f2fa;

    border-color:rgba(104,188,231,.62);

    background:
        linear-gradient(
            90deg,
            rgba(17,53,82,.35),
            rgba(30,79,112,.48),
            rgba(17,53,82,.35)
        );

    box-shadow:
        0 0 20px rgba(50,133,180,.12);
}


/* =========================
   Footer
========================= */

.footer{
    position:absolute;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    z-index:20;

    color:rgba(112,165,195,.38);

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:4px;

    white-space:nowrap;
}


/* =========================
   小装饰线
========================= */

.decor-line{
    position:absolute;

    width:70px;
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(84,155,195,.28),
            transparent
        );
}

.decor-line.left{
    left:calc(50% - 295px);
    top:50%;
}

.decor-line.right{
    right:calc(50% - 295px);
    top:50%;
}


/* =========================
   平板
========================= */

@media (max-width:900px){

    .topbar{
        left:42px;
        right:42px;
    }

    .nav-links{
        gap:25px;
    }

    .magic-area{
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    .main-title .seyami{
        font-size:70px;
        letter-spacing:15px;
        margin-right:-15px;
    }

    .main-title .archive{
        font-size:84px;
        letter-spacing:13px;
        margin-right:-13px;
    }

}


/* =========================
   手机
========================= */

@media (max-width:600px){

    body{
        overflow:hidden;
    }

    .page{
        min-height:580px;
    }


    /* 外框 */

    .outer-frame{
        inset:11px;
    }

    .outer-frame::before{
        inset:4px;
    }


    /* 四角 */

    .corner-star{
        font-size:26px;
    }

    .corner-star::after{
        width:24px;
        height:24px;
    }

    .corner-star.top-left{
        left:20px;
        top:21px;
    }

    .corner-star.top-right{
        right:20px;
        top:21px;
    }

    .corner-star.bottom-left{
        left:20px;
        bottom:21px;
    }

    .corner-star.bottom-right{
        right:20px;
        bottom:21px;
    }


    /* 顶部 */

    .topbar{
        left:28px;
        right:28px;
        top:34px;

        align-items:flex-start;
    }


    /* Logo */

    .logo{
        gap:7px;
    }

    .logo-mark{
        font-size:18px;
        top:1px;
    }

    .logo-cn{
        font-size:11px;
        letter-spacing:2px;
    }

    .logo-en{
        font-size:6px;
        letter-spacing:2px;
    }


    /* 手机隐藏导航 */

    .nav-links{
        display:none;
    }


    /* 魔法区域 */

    .magic-area{
        width:100%;
        height:400px;

        transform:
            translate(-50%,-50%)
            scale(.78);
    }


    /* 手机星轨 */

    .orbit.one{
        width:350px;
        height:133px;
    }

    .orbit.two{
        width:295px;
        height:102px;
    }

    .orbit.three{
        width:235px;
        height:75px;
    }


    /* 主标题 */

    .main-title .seyami{
        font-size:52px;
        letter-spacing:11px;
        margin-right:-11px;
    }

    .main-title .archive{
        margin-top:8px;

        font-size:63px;
        letter-spacing:9px;
        margin-right:-9px;
    }


    /* 中文 */

    .hero-cn{
        margin-top:25px;

        font-size:12px;

        letter-spacing:5px;
        margin-right:-5px;
    }

    .hero-desc{
        margin-top:11px;

        padding:0 35px;

        font-size:8px;

        line-height:2;

        letter-spacing:2px;
    }


    /* 按钮 */

    .enter-wrap{
        margin-top:28px;
    }

    .enter-button{
        min-width:180px;
        height:44px;

        padding:0 22px;

        font-size:10px;

        letter-spacing:3px;
    }


    /* Footer */

    .footer{
        bottom:24px;

        font-size:6px;

        letter-spacing:2px;
    }


    /* 背景符号 */

    .symbol.one{
        left:7%;
    }

    .symbol.two{
        right:7%;
    }

    .symbol.three{
        left:12%;
    }

    .symbol.four{
        right:12%;
    }

}


/* =========================
   超小屏幕
========================= */

@media (max-width:380px){

    .main-title .seyami{
        font-size:45px;
        letter-spacing:9px;
        margin-right:-9px;
    }

    .main-title .archive{
        font-size:54px;
        letter-spacing:7px;
        margin-right:-7px;
    }

    .hero-cn{
        font-size:11px;
    }

    .hero-desc{
        padding:0 25px;
    }

    .magic-area{
        transform:
            translate(-50%,-50%)
            scale(.68);
    }

}

</style>
</head>


<body>
