<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · Seyami Archive</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;
}

body{

    background:#061426;

    color:#dcecff;

    font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
}


/* =========================================================
   页面背景
========================================================= */

.page{

    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(28,76,117,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(7,35,62,.45),
            transparent 70%
        ),

        #061426;
}


/* =========================================================
   星点背景
========================================================= */

.stars{

    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    opacity:.65;
}


.stars::before,
.stars::after{

    content:"";

    position:absolute;

    inset:-20%;

    background-image:

        radial-gradient(
            circle,
            rgba(181,222,247,.72) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(108,178,230,.55) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(207,235,250,.45) 0 .7px,
            transparent 1.2px
        );

    background-size:
        95px 95px,
        137px 137px,
        67px 67px;

    background-position:
        10px 20px,
        40px 70px,
        20px 50px;

    animation:
        starMove
        35s
        linear
        infinite;
}


.stars::after{

    opacity:.45;

    transform:scale(1.2);

    animation-duration:50s;

    animation-direction:reverse;
}


@keyframes starMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-80px,50px,0);
    }
}


/* =========================================================
   漂浮星星
========================================================= */

.floating-stars{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:3;
}


.floating-stars span{

    position:absolute;

    color:rgba(160,211,241,.55);

    font-family:
        "Times New Roman",
        serif;

    text-shadow:
        0 0 8px rgba(102,178,226,.35);

    animation:
        floatStar
        7s
        ease-in-out
        infinite;
}


.floating-stars span:nth-child(1){
    left:16%;
    top:19%;
    font-size:12px;
}

.floating-stars span:nth-child(2){
    left:27%;
    top:72%;
    font-size:10px;
}

.floating-stars span:nth-child(3){
    left:76%;
    top:22%;
    font-size:8px;
}

.floating-stars span:nth-child(4){
    left:85%;
    top:67%;
    font-size:13px;
}

.floating-stars span:nth-child(5){
    left:12%;
    top:53%;
    font-size:9px;
}

.floating-stars span:nth-child(6){
    left:91%;
    top:39%;
    font-size:8px;
}

.floating-stars span:nth-child(7){
    left:67%;
    top:78%;
    font-size:11px;
}

.floating-stars span:nth-child(8){
    left:38%;
    top:17%;
    font-size:10px;
}

.floating-stars span:nth-child(9){
    left:72%;
    top:55%;
    font-size:8px;
}

.floating-stars span:nth-child(10){
    left:21%;
    top:39%;
    font-size:12px;
}

.floating-stars span:nth-child(11){
    left:56%;
    top:83%;
    font-size:9px;
}

.floating-stars span:nth-child(12){
    left:80%;
    top:12%;
    font-size:10px;
}


@keyframes floatStar{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1);

        opacity:.35;
    }

    50%{
        transform:
            translateY(-7px)
            scale(1.15);

        opacity:.8;
    }
}


/* =========================================================
   外框
========================================================= */

.frame{

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;
}


.frame::before{

    content:"";

    position:absolute;

    inset:6px;

    border:
        1px solid
        rgba(81,144,193,.12);
}


/* =========================================================
   四角六芒星
========================================================= */

.corner{

    position:absolute;

    width:50px;
    height:50px;

    z-index:20;

    pointer-events:none;
}


.corner::before{

    content:"✡";

    position:absolute;

    font-family:
        "Times New Roman",
        serif;

    font-size:31px;

    line-height:1;

    color:
        rgba(108,178,230,.88);

    text-shadow:

        0 0 7px
        rgba(85,169,222,.35),

        0 0 15px
        rgba(53,128,180,.18);
}


.corner.tl{
    left:-11px;
    top:-11px;
}

.corner.tr{
    right:-11px;
    top:-11px;
}

.corner.bl{
    left:-11px;
    bottom:-11px;
}

.corner.br{
    right:-11px;
    bottom:-11px;
}


/* =========================================================
   顶部导航
========================================================= */

.top-nav{

    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    z-index:30;
}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:baseline;

    gap:10px;
}


.logo-mark{

    width:auto;
    height:auto;

    display:block;

    flex-shrink:0;

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    line-height:1;

    position:relative;

    top:1px;

    color:
        rgba(137,201,239,.9);

    text-shadow:

        0 0 7px
        rgba(87,167,219,.35);
}


.logo-text{

    display:flex;

    flex-direction:column;

    gap:3px;
}


.logo-cn{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:15px;

    font-weight:300;

    letter-spacing:2px;

    color:
        rgba(214,236,251,.92);
}


.logo-en{

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(119,176,214,.66);
}


/* =========================================================
   导航
========================================================= */

.nav-links{

    display:flex;

    gap:31px;

    padding-top:3px;
}


.nav-links a{

    position:relative;

    color:
        rgba(177,211,234,.65);

    text-decoration:none;

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:2px;

    transition:.3s ease;
}


.nav-links a::after{

    content:"";

    position:absolute;

    left:0;
    bottom:-6px;

    width:0;
    height:1px;

    background:
        rgba(128,195,235,.8);

    transition:.3s ease;
}


.nav-links a:hover{

    color:
        rgba(219,240,253,.95);
}


.nav-links a:hover::after{

    width:100%;
}


/* =========================================================
   主区域
========================================================= */

.main{

    position:relative;

    width:100%;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        80px
        20px
        70px;

    z-index:5;
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:absolute;

    width:560px;
    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    opacity:.68;
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(82,160,215,.40);

    border-radius:50%;

    box-shadow:
        0 0 22px
        rgba(47,126,184,.12);

    animation:
        rotateCircle
        80s
        linear
        infinite;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:27px;

    border:
        1px solid
        rgba(101,180,225,.32);

    border-radius:50%;

    box-shadow:
        inset 0 0 20px
        rgba(62,139,194,.07);

    animation:
        rotateCircleReverse
        55s
        linear
        infinite;
}


@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes rotateCircleReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}


/* =========================================================
   ★ 星轨
   ★ 仅增加不同 animation-delay
========================================================= */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(94,165,214,.30);

    border-radius:50%;

    box-shadow:
        0 0 6px
        rgba(70,155,210,.08);

    transform:
        translate(-50%,-50%);

    animation:
        orbitRotate
        38s
        linear
        infinite;
}


/* 第一层 */

.orbit.one{

    width:500px;
    height:190px;

    animation-delay:-0s;
}


/* 第二层 */

.orbit.two{

    width:420px;
    height:145px;

    animation-direction:
        reverse;

    animation-duration:
        32s;

    animation-delay:-7s;
}


/* 第三层 */

.orbit.three{

    width:330px;
    height:105px;

    animation-duration:
        25s;

    animation-delay:-13s;
}


/* 星轨运行 */

@keyframes orbitRotate{

    from{

        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{

        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =========================================================
   魔法十字线
========================================================= */

.magic-line{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(105,181,225,.24);

    box-shadow:
        0 0 5px
        rgba(70,155,210,.06);
}


.magic-line.horizontal{

    width:490px;
    height:1px;
}


.magic-line.vertical{

    width:1px;
    height:490px;
}


/* =========================================================
   魔法中心
========================================================= */

.magic-center{

    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(147,211,243,.62);

    border-radius:50%;

    box-shadow:
        0 0 10px
        rgba(88,171,224,.25);
}


.magic-center::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:3px;

    transform:
        translate(-50%,-50%);

    background:
        rgba(190,229,249,.82);

    border-radius:50%;

    box-shadow:
        0 0 8px
        rgba(126,203,244,.8);
}


/* =========================================================
   标题区域
========================================================= */

.title-area{

    position:relative;

    z-index:8;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    margin-top:-18px;
}


/* =========================================================
   英文标题
========================================================= */

.title-en{

    display:flex;

    flex-direction:column;

    align-items:center;

    line-height:.82;

    color:
        rgba(224,241,252,.95);

    text-shadow:
        0 0 18px
        rgba(104,178,224,.12);
}


.title-en .seyami{

    font-family:
        "Cinzel",
        serif;

    font-size:70px;

    font-weight:400;

    letter-spacing:8px;

    margin-left:8px;
}


.title-en .archive{

    font-family:
        "Cinzel",
        serif;

    font-size:87px;

    font-weight:400;

    letter-spacing:9px;

    margin-left:9px;
}


/* =========================================================
   标题装饰线
========================================================= */

.title-decoration{

    display:flex;

    align-items:center;

    gap:15px;

    margin-top:17px;

    opacity:.65;
}


.title-decoration .line{

    width:95px;

    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(119,190,231,.65)
        );
}


.title-decoration .line.right{

    transform:scaleX(-1);
}


.title-decoration .diamond{

    width:5px;
    height:5px;

    transform:rotate(45deg);

    border:
        1px solid
        rgba(151,212,241,.72);

    box-shadow:
        0 0 7px
        rgba(102,180,228,.25);
}


/* =========================================================
   中文标题
========================================================= */

.title-cn{

    margin-top:13px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:20px;

    font-weight:300;

    letter-spacing:8px;

    color:
        rgba(204,228,245,.82);

    margin-left:8px;
}


/* =========================================================
   描述
========================================================= */

.description{

    margin-top:14px;

    display:flex;

    flex-direction:column;

    gap:7px;

    color:
        rgba(151,188,214,.62);

    font-size:12px;

    letter-spacing:2px;

    line-height:1.5;
}


/* =========================================================
   进入按钮
========================================================= */

.enter-wrap{

    position:relative;

    width:370px;
    height:82px;

    margin-top:28px;

    display:flex;

    align-items:center;
    justify-content:center;
}


.enter-button{

    position:relative;

    width:300px;
    height:50px;

    border:
        1px solid
        rgba(104,179,226,.48);

    background:
        rgba(7,27,47,.58);

    color:
        rgba(210,235,250,.88);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        .35s ease;

    box-shadow:
        0 0 18px
        rgba(58,137,190,.08),

        inset 0 0 20px
        rgba(57,130,180,.04);
}


.enter-button::before,
.enter-button::after{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border:
        1px solid
        rgba(131,198,234,.8);

    transform:rotate(45deg);

    background:#061426;
}


.enter-button::before{

    left:-4px;
    top:-4px;
}


.enter-button::after{

    right:-4px;
    bottom:-4px;
}


.enter-button:hover{

    color:
        rgba(235,248,255,1);

    border-color:
        rgba(136,205,239,.82);

    background:
        rgba(13,42,68,.72);

    box-shadow:

        0 0 25px
        rgba(68,151,205,.18),

        inset 0 0 20px
        rgba(75,153,201,.08);
}


/* =========================================================
   按钮周围装饰
========================================================= */

.enter-wrap::before{

    content:"✦";

    position:absolute;

    left:22px;
    top:12px;

    font-size:11px;

    color:
        rgba(129,194,232,.55);

    text-shadow:
        0 0 7px
        rgba(95,171,222,.4);
}


.enter-wrap::after{

    content:"✦";

    position:absolute;

    right:22px;
    bottom:12px;

    font-size:11px;

    color:
        rgba(129,194,232,.55);

    text-shadow:
        0 0 7px
        rgba(95,171,222,.4);
}


/* =========================================================
   底部
========================================================= */

.footer{

    position:absolute;

    left:0;
    right:0;

    bottom:32px;

    text-align:center;

    z-index:20;

    color:
        rgba(106,153,184,.48);

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;
}


/* =========================================================
   平板
========================================================= */

@media(max-width:800px){

    .top-nav{

        left:35px;
        right:35px;
        top:30px;
    }


    .magic-circle{

        width:500px;
        height:500px;
    }


    .title-en .seyami{

        font-size:58px;
    }


    .title-en .archive{

        font-size:70px;
    }


    .title-cn{

        font-size:18px;
    }

/* =========================================================
   手机
========================================================= */

@media(max-width:520px){

    .frame{

        inset:12px;
    }


    .top-nav{

        left:25px;

    }


    .logo{

        gap:7px;
    }


    .logo-mark{

        font-size:18px;

    .logo-cn{

        font-size:12px;

    }

    .orbit.one{

        width:350px;

    .footer{

        letter-spacing:2px;
    }

}
