<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆｜SEYAMI ARCHIVE</title>

<style>

/* =========================
   基础
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(35, 105, 160, 0.16),
            transparent 38%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(30, 90, 145, 0.10),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #020a16 0%,
            #041426 45%,
            #020914 100%
        );

    color: #eaf7ff;

    font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    overflow-x: hidden;
}


/* =========================
   页面整体
========================= */

.page {
    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================
   星空基础
========================= */

.stars,
.stars::before,
.stars::after {
    position: absolute;

    width: 2px;
    height: 2px;

    background: rgba(210, 240, 255, 0.72);

    border-radius: 50%;

    content: "";

    pointer-events: none;

    z-index: 1;
}

.stars {
    top: 10%;
    left: 8%;

    animation:
        starDrift 18s ease-in-out infinite alternate;

    box-shadow:
        90px 40px rgba(180,220,255,.45),
        180px 120px rgba(210,240,255,.65),
        290px 50px rgba(160,210,255,.38),
        390px 180px rgba(210,240,255,.55),
        520px 70px rgba(170,220,255,.45),
        650px 150px rgba(210,240,255,.55),
        780px 35px rgba(170,215,255,.45),
        900px 120px rgba(210,240,255,.65),
        1040px 65px rgba(180,225,255,.42),
        1150px 170px rgba(200,235,255,.55),
        1250px 80px rgba(170,215,255,.40),

        120px 420px rgba(190,230,255,.38),
        270px 510px rgba(210,240,255,.52),
        430px 390px rgba(170,220,255,.45),
        580px 470px rgba(210,240,255,.55),
        760px 400px rgba(190,230,255,.40),
        920px 520px rgba(210,240,255,.52),
        1090px 430px rgba(180,220,255,.45),
        1220px 540px rgba(210,240,255,.55),

        60px 280px rgba(220,245,255,.32),
        340px 300px rgba(180,225,255,.40),
        470px 110px rgba(220,245,255,.42),
        720px 280px rgba(170,215,255,.35),
        850px 180px rgba(220,245,255,.42),
        980px 340px rgba(180,225,255,.34),
        1180px 300px rgba(220,245,255,.38);
}


/* =========================
   浮动星星
========================= */

.floating-star {
    position: absolute;

    color: rgba(205, 239, 255, 0.72);

    font-family:
        "Times New Roman",
        serif;

    pointer-events: none;

    z-index: 2;

    text-shadow:
        0 0 8px rgba(120, 210, 255, 0.55),
        0 0 18px rgba(90, 180, 235, 0.28);

    animation:
        floatStar 6s ease-in-out infinite,
        twinkleStar 3.5s ease-in-out infinite alternate;
}

.star-1 {
    top: 21%;
    left: 19%;
    font-size: 12px;
    animation-delay: -1s;
}

.star-2 {
    top: 27%;
    right: 20%;
    font-size: 9px;
    animation-delay: -3s;
}

.star-3 {
    top: 42%;
    left: 13%;
    font-size: 7px;
    animation-delay: -2s;
}

.star-4 {
    top: 48%;
    right: 14%;
    font-size: 13px;
    animation-delay: -4s;
}

.star-5 {
    top: 66%;
    left: 23%;
    font-size: 8px;
    animation-delay: -1.5s;
}

.star-6 {
    top: 70%;
    right: 24%;
    font-size: 10px;
    animation-delay: -3.5s;
}

.star-7 {
    top: 34%;
    left: 29%;
    font-size: 5px;
    animation-delay: -2.5s;
}

.star-8 {
    top: 58%;
    right: 31%;
    font-size: 6px;
    animation-delay: -4.5s;
}


/* =========================
   星星动画
========================= */

@keyframes floatStar {

    0% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }

    50% {
        transform:
            translate(4px, -8px)
            rotate(10deg);
    }

    100% {
        transform:
            translate(-3px, 4px)
            rotate(-8deg);
    }

}

@keyframes twinkleStar {

    0% {
        opacity: 0.25;
    }

    50% {
        opacity: 0.85;
    }

    100% {
        opacity: 0.38;
    }

}

@keyframes starDrift {

    0% {
        transform:
            translate(0, 0);
    }

    100% {
        transform:
            translate(10px, -7px);
    }

}


/* =========================
   装饰边框
========================= */

.frame {
    position: absolute;

    top: 24px;
    left: 24px;
    right: 24px;
    bottom: 24px;

    border: 1px solid rgba(110, 190, 235, 0.18);

    pointer-events: none;

    z-index: 8;
}

.frame::before,
.frame::after {
    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    border-color: rgba(130, 210, 255, 0.45);
    border-style: solid;
}

.frame::before {
    top: -1px;
    left: -1px;

    border-width: 1px 0 0 1px;
}

.frame::after {
    right: -1px;
    bottom: -1px;

    border-width: 0 1px 1px 0;
}


/* =========================
   顶部导航
========================= */

.nav {
    position: relative;
    z-index: 10;

    width: 100%;

    padding:
        30px
        clamp(30px, 6vw, 90px);

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;

    color: rgba(220, 244, 255, 0.92);

    font-size: 13px;

    letter-spacing: 3px;

    white-space: nowrap;
}

.logo-symbol {
    color: #9fdcff;

    font-size: 17px;

    text-shadow:
        0 0 10px rgba(110, 210, 255, 0.7);
}

.logo-en {
    opacity: 0.65;

    font-family:
        "Times New Roman",
        serif;

    letter-spacing: 3px;

    font-size: 11px;
}

.nav-links {
    display: flex;
    gap: 34px;
}

.nav-links a {
    position: relative;

    color: rgba(210, 235, 250, 0.62);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 2px;

    transition:
        color .3s ease;
}

.nav-links a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    width: 0;
    height: 1px;

    background: #9edcff;

    transform: translateX(-50%);

    transition: width .3s ease;
}

.nav-links a:hover {
    color: #edfaff;
}

.nav-links a:hover::after {
    width: 100%;
}


/* =========================
   主区域
========================= */

.hero {
    position: relative;
    z-index: 4;

    flex: 1;

    min-height: calc(100vh - 100px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding:
        50px 25px 100px;
}


/* =========================
   小装饰
========================= */

.symbol {
    margin-bottom: 31px;

    color: rgba(155, 218, 250, 0.7);

    font-size: 15px;

    letter-spacing: 10px;

    text-shadow:
        0 0 15px rgba(90, 190, 255, 0.45);
}


/* =========================
   英文主标题
   SEYAMI
   ARCHIVE
========================= */

.title-en {
    margin: 0;

    display: flex;
    flex-direction: column;

    align-items: center;

    font-family:
        "Bodoni 72",
        "Didot",
        "Baskerville",
        "Times New Roman",
        serif;

    font-size:
        clamp(70px, 10vw, 128px);

    font-weight: 300;

    line-height: 0.82;

    letter-spacing:
        clamp(8px, 1.8vw, 20px);

    color: #edf9ff;

    text-shadow:
        0 0 6px rgba(220, 245, 255, 0.55),
        0 0 24px rgba(70, 175, 240, 0.30);

    transform: scaleX(0.91);

    font-variant: small-caps;
}


/* =========================
   两行标题
========================= */

.title-word {
    display: block;

    white-space: nowrap;
}

.title-word:first-child {
    font-size: 1em;

    letter-spacing:
        clamp(10px, 2vw, 23px);
}

.title-word:last-child {
    margin-top: 13px;

    font-size: 0.78em;

    letter-spacing:
        clamp(12px, 2.4vw, 28px);

    opacity: 0.96;
}


/* =========================
   标题下方细线
========================= */

.title-line {
    position: relative;

    width: min(650px, 80vw);

    height: 1px;

    margin:
        31px auto
        17px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(105, 200, 255, 0.45),
            transparent
        );
}

.title-line::before,
.title-line::after {
    content: "✦";

    position: absolute;

    top: 50%;

    color:
        rgba(135, 215, 250, 0.42);

    font-size: 8px;

    transform:
        translateY(-50%);
}

.title-line::before {
    left: 19%;
}

.title-line::after {
    right: 19%;
}


/* =========================
   中文标题
========================= */

.title-cn {
    margin: 0;

    color: rgba(221, 241, 251, 0.82);

    font-size:
        clamp(16px, 2vw, 23px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1vw, 10px);

    text-indent:
        clamp(5px, 1vw, 10px);
}


/* =========================
   简介
========================= */

.description {
    margin-top: 27px;

    color: rgba(180, 213, 232, 0.57);

    font-size: 13px;

    line-height: 2.2;

    letter-spacing: 2px;

    font-weight: 300;
}


/* =========================
   进入按钮
========================= */

.enter-button {
    position: relative;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 45px;

    min-width: 190px;

    padding:
        14px 28px;

    border:
        1px solid rgba(130, 205, 240, 0.45);

    color: rgba(225, 246, 255, 0.9);

    background:
        rgba(8, 31, 52, 0.38);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 4px;

    transition:
        all .35s ease;

    backdrop-filter: blur(5px);
}

.enter-button::before,
.enter-button::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    border-color: #a8e1ff;

    border-style: solid;
}

.enter-button::before {
    top: -1px;
    left: -1px;

    border-width: 1px 0 0 1px;
}

.enter-button::after {
    right: -1px;
    bottom: -1px;

    border-width: 0 1px 1px 0;
}

.enter-button:hover {
    color: #ffffff;

    border-color:
        rgba(165, 225, 255, 0.8);

    background:
        rgba(22, 66, 98, 0.45);

    box-shadow:
        0 0 25px rgba(70, 180, 240, 0.16);

    transform:
        translateY(-2px);
}


/* =========================
   底部文字
========================= */

.footer-mark {
    position: absolute;

    bottom: 30px;

    left: 50%;

    transform: translateX(-50%);

    color:
        rgba(150, 200, 225, 0.32);

    font-family:
        "Times New Roman",
        serif;

    font-size: 10px;

    letter-spacing: 6px;

    white-space: nowrap;

    z-index: 6;
}


/* =========================
   魔法圆环
========================= */

.magic-circle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(650px, 90vw);
    height: min(650px, 90vw);

    border:
        1px solid rgba(90, 175, 220, 0.07);

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    z-index: 1;
}

.magic-circle::before {
    content: "";

    position: absolute;

    left: 7%;
    top: 7%;

    width: 86%;
    height: 86%;

    border:
        1px solid rgba(110, 195, 235, 0.045);

    border-radius: 50%;
}

.magic-circle::after {
    content: "✦";

    position: absolute;

    top: -9px;
    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(120, 205, 240, 0.22);

    font-size: 13px;
}


/* =========================
   中央微光
========================= */

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 420px;
    height: 420px;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(50, 145, 210, 0.09),
            transparent 68%
        );

    filter: blur(10px);

    pointer-events: none;

    z-index: 1;
}


/* =========================
   手机适配
========================= */

@media (max-width: 700px) {

    .frame {
        top: 14px;
        left: 14px;
        right: 14px;
        bottom: 14px;
    }

    .nav {
        padding:
            24px 30px;

        align-items: flex-start;
    }

    .logo {
        font-size: 11px;

        letter-spacing: 2px;
    }

    .logo-en {
        display: none;
    }

    .nav-links {
        gap: 14px;
    }

    .nav-links a {
        font-size: 10px;

        letter-spacing: 1px;
    }

    .hero {
        padding:
            40px 20px 90px;
    }

    .symbol {
        margin-bottom: 24px;

        font-size: 13px;
    }

    .title-en {
        font-size:
            clamp(60px, 17vw, 88px);

        line-height: 0.83;

        letter-spacing:
            7px;

        transform: scaleX(0.88);
    }

    .title-word:first-child {
        letter-spacing: 8px;
    }

    .title-word:last-child {
        margin-top: 10px;

        letter-spacing: 10px;
    }

    .title-line {
        width: 75vw;

        margin:
            23px auto
            15px;
    }

    .title-cn {
        font-size: 15px;

        letter-spacing: 5px;
    }

    .description {
        font-size: 11px;

        line-height: 2;

        letter-spacing: 1px;
    }

    .enter-button {
        margin-top: 34px;

        min-width: 175px;

        padding: 13px 20px;

        font-size: 11px;

        letter-spacing: 3px;
    }

    .footer-mark {
        bottom: 20px;

        font-size: 8px;

        letter-spacing: 4px;
    }

    .floating-star {
        transform: scale(0.8);
    }

}


/* =========================
   超小屏幕
========================= */

@media (max-width: 430px) {

    .nav-links a:nth-child(3) {
        display: none;
    }

    .logo {
        font-size: 10px;
    }

    .title-en {
        font-size: 55px;

        letter-spacing: 5px;
    }

    .title-word:first-child {
        letter-spacing: 6px;
    }

    .title-word:last-child {
        margin-top: 8px;

        letter-spacing: 7px;
    }

    .title-cn {
        font-size: 14px;

        letter-spacing: 4px;
    }

    .description {
        max-width: 280px;
    }

    .floating-star {
        display: none;
    }

}

</style>
</head>


<body>

<div class="page">

    <!-- 星空 -->
    <div class="stars"></div>

    <!-- 浮动星星 -->
    <div class="floating-star star-1">✦</div>
    <div class="floating-star star-2">✧</div>
    <div class="floating-star star-3">·</div>
    <div class="floating-star star-4">✦</div>
    <div class="floating-star star-5">✧</div>
    <div class="floating-star star-6">✦</div>
    <div class="floating-star star-7">·</div>
    <div class="floating-star star-8">✧</div>

    <!-- 中央微光 -->
    <div class="glow"></div>

    <!-- 魔法圆环 -->
    <div class="magic-circle"></div>

    <!-- 装饰边框 -->
    <div class="frame"></div>


    <!-- =====================
         顶部导航
    ====================== -->

    <header class="nav">

        <div class="logo">

            <span class="logo-symbol">✦</span>

            <span>
                塞垭弥大陆档案馆
            </span>

            <span class="logo-en">
                SEYAMI ARCHIVE
            </span>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                首页
            </a>

            <a href="archive.html">
                档案目录
            </a>

            <a href="#">
                关于我们
            </a>

        </nav>

    </header>


    <!-- =====================
         首页主体
    ====================== -->

    <main class="hero">

        <div class="symbol">
            ✧　✦　✧
        </div>


        <!-- 两行西幻标题 -->

        <h1 class="title-en">

            <span class="title-word">
                SEYAMI
            </span>

            <span class="title-word">
                ARCHIVE
            </span>

        </h1>


        <div class="title-line"></div>


        <h2 class="title-cn">
            塞垭弥大陆档案馆
        </h2>


        <p class="description">
            记录关于这片大陆的一切。<br>
            角色、种族、地域、历史，<br>
            以及那些尚未被发现的故事。
        </p>


        <a
            class="enter-button"
            href="archive.html"
        >
            进入档案馆

            <span style="margin-left: 14px;">
                →
            </span>

        </a>

    </main>


    <!-- =====================
         底部
    ====================== -->

    <div class="footer-mark">
        ✦　THE ARCHIVES OF SEYAMI　✦
    </div>

</div>


</body>
</html>
