<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>角色档案 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
rel="stylesheet">

<style>

/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(38,91,137,.18),
      transparent 38%
    ),
    radial-gradient(
      circle at 50% 50%,
      rgba(11,45,75,.45),
      transparent 70%
    ),
    #061426;

  color:#dcecff;

  font-family:
    "Noto Serif SC",
    "Times New Roman",
    serif;

  overflow-x:hidden;

  transition:
    background .6s ease,
    color .6s ease;
}


/* =========================
   PAGE
========================= */

.page{

  position:relative;

  min-height:100vh;

  padding:
    30px
    clamp(24px,6vw,90px)
    70px;

  overflow:hidden;

  transition:
    background .6s ease;
}


/* =========================
   FLOATING STARS
========================= */

.stars{

  position:absolute;

  inset:0;

  z-index:1;

  pointer-events:none;

  overflow:hidden;
}

.stars span{

  position:absolute;

  display:block;

  color:rgba(158,207,247,.62);

  font-family:
    "Times New Roman",
    serif;

  line-height:1;

  text-shadow:
    0 0 8px rgba(96,177,242,.5);

  animation:
    starFloat 8s ease-in-out infinite,
    starTwinkle 5s ease-in-out infinite;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}


/* star positions */

.stars span:nth-child(1){
  left:8%;
  top:15%;
  font-size:15px;
  animation-delay:-2s,-1s;
  opacity:.55;
}

.stars span:nth-child(2){
  left:19%;
  top:32%;
  font-size:10px;
  animation-delay:-4s,-2s;
  opacity:.32;
}

.stars span:nth-child(3){
  left:31%;
  top:12%;
  font-size:12px;
  animation-delay:-6s,-1s;
  opacity:.38;
}

.stars span:nth-child(4){
  right:17%;
  top:18%;
  font-size:18px;
  animation-delay:-3s,-2s;
  opacity:.42;
}

.stars span:nth-child(5){
  right:8%;
  top:38%;
  font-size:10px;
  animation-delay:-5s,-3s;
  opacity:.32;
}

.stars span:nth-child(6){
  left:10%;
  top:57%;
  font-size:13px;
  animation-delay:-4s,-1s;
  opacity:.35;
}

.stars span:nth-child(7){
  left:27%;
  top:69%;
  font-size:9px;
  animation-delay:-7s,-2s;
  opacity:.28;
}

.stars span:nth-child(8){
  right:25%;
  top:58%;
  font-size:15px;
  animation-delay:-3s,-1s;
  opacity:.30;
}

.stars span:nth-child(9){
  right:9%;
  top:73%;
  font-size:18px;
  animation-delay:-6s,-3s;
  opacity:.26;
}

.stars span:nth-child(10){
  left:43%;
  top:78%;
  font-size:11px;
  animation-delay:-2s,-2s;
  opacity:.30;
}

.stars span:nth-child(11){
  left:4%;
  top:30%;
  font-size:9px;
  animation-delay:-1s,-2s;
  opacity:.32;
}

.stars span:nth-child(12){
  left:38%;
  top:8%;
  font-size:12px;
  animation-delay:-4s,-1s;
  opacity:.38;
}

.stars span:nth-child(13){
  right:5%;
  top:31%;
  font-size:15px;
  animation-delay:-6s,-3s;
  opacity:.30;
}

.stars span:nth-child(14){
  left:24%;
  top:53%;
  font-size:8px;
  animation-delay:-3s,-1s;
  opacity:.28;
}

.stars span:nth-child(15){
  right:24%;
  top:53%;
  font-size:14px;
  animation-delay:-7s,-2s;
  opacity:.24;
}

.stars span:nth-child(16){
  left:6%;
  top:72%;
  font-size:12px;
  animation-delay:-5s,-3s;
  opacity:.34;
}

.stars span:nth-child(17){
  right:7%;
  top:70%;
  font-size:18px;
  animation-delay:-8s,-4s;
  opacity:.25;
}

.stars span:nth-child(18){
  left:34%;
  bottom:9%;
  font-size:10px;
  animation-delay:-2s,-2s;
  opacity:.30;
}

.stars span:nth-child(19){
  right:36%;
  bottom:8%;
  font-size:11px;
  animation-delay:-5s,-1s;
  opacity:.34;
}

.stars span:nth-child(20){
  left:46%;
  top:8%;
  font-size:13px;
  animation-delay:-9s,-4s;
  opacity:.20;
}


/* =========================
   STAR ANIMATION
========================= */

@keyframes starFloat{

  0%,
  100%{
    transform:translate3d(0,0,0);
  }

  50%{
    transform:translate3d(0,-8px,0);
  }
}

@keyframes starTwinkle{

  0%,
  100%{
    opacity:.18;
  }

  50%{
    opacity:.65;
  }
}


/* =========================
   MAGIC CIRCLE
========================= */

.magic-circle{

  position:absolute;

  width:min(72vw,760px);
  height:min(72vw,760px);

  left:50%;
  top:47%;

  transform:translate(-50%,-50%);

  border:
    1px solid
    rgba(73,143,198,.28);

  border-radius:50%;

  box-shadow:
    0 0 50px rgba(47,126,184,.08),
    inset 0 0 60px rgba(62,139,194,.04);

  z-index:0;

  pointer-events:none;

  opacity:.55;

  transition:
    border-color .6s ease,
    box-shadow .6s ease;
}

.magic-circle::before,
.magic-circle::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  pointer-events:none;

  transition:
    border-color .6s ease;
}

.magic-circle::before{

  width:82%;
  height:82%;

  border:
    1px solid
    rgba(73,143,198,.22);
}

.magic-circle::after{

  width:61%;
  height:61%;

  border:
    1px solid
    rgba(91,162,213,.22);
}


/* =========================
   OUTER FRAME
========================= */

.frame{

  position:absolute;

  top:20px;
  left:20px;
  right:20px;
  bottom:20px;

  border:
    1px solid
    rgba(111,174,224,.32);

  pointer-events:none;

  z-index:2;

  transition:
    border-color .6s ease;
}

.frame::before,
.frame::after{

  content:"";

  position:absolute;

  width:45px;
  height:45px;

  transition:
    border-color .6s ease;
}

.frame::before{

  left:-1px;
  top:-1px;

  border-left:
    1px solid
    rgba(108,178,230,.88);

  border-top:
    1px solid
    rgba(108,178,230,.88);
}

.frame::after{

  right:-1px;
  bottom:-1px;

  border-right:
    1px solid
    rgba(108,178,230,.88);

  border-bottom:
    1px solid
    rgba(108,178,230,.88);
}


/* =========================
   HEADER
========================= */

.header{

  position:absolute;

  left:58px;
  right:58px;
  top:38px;

  z-index:20;

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  width:auto;
  max-width:none;

  margin:0;
  padding:0;
}


/* =========================
   LOGO
========================= */

.logo{

  display:flex;

  align-items:flex-start;

  gap:12px;

  color:#d9edff;

  text-decoration:none;

  transition:
    color .6s ease;
}

.logo-symbol{

  color:rgba(137,201,239,.9);

  width:17px;
  height:13px;

  display:flex;

  align-items:flex-start;

  justify-content:center;

  font-size:17px;

  line-height:13px;

  margin:0;
  padding:0;

  text-shadow:
    0 0 7px rgba(76,159,216,.5),
    0 0 15px rgba(49,132,191,.22);

  flex-shrink:0;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}

.logo-text{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  line-height:1;
}

.logo-cn{

  display:block;

  height:13px;

  line-height:13px;

  color:#d9edff;

  font-size:13px;

  letter-spacing:3px;

  white-space:nowrap;

  transition:
    color .6s ease;
}

.logo-en{

  display:block;

  margin-top:5px;

  color:rgba(157,204,239,.63);

  font-family:
    "Times New Roman",
    serif;

  font-size:8px;

  line-height:8px;

  letter-spacing:3px;

  white-space:nowrap;

  transition:
    color .6s ease;
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{

  display:flex;

  align-items:center;

  gap:20px;
}


/* =========================
   BACK
========================= */

.back{

  color:rgba(191,220,243,.68);

  text-decoration:none;

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:11px;

  letter-spacing:1px;

  transition:
    color .3s ease,
    text-shadow .3s ease;
}

.back:hover{

  color:#d9efff;

  text-shadow:
    0 0 10px
    rgba(102,180,231,.35);
}


/* =========================
   DAY / NIGHT TOGGLE
========================= */

.theme-toggle{

  display:flex;

  align-items:center;

  gap:7px;

  height:28px;

  padding:
    0 11px;

  border:
    1px solid
    rgba(111,174,224,.32);

  background:
    rgba(8,28,49,.35);

  color:
    rgba(191,220,243,.68);

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:8px;

  letter-spacing:2px;

  cursor:pointer;

  border-radius:0;

  white-space:nowrap;

  transition:
    color .35s ease,
    border-color .35s ease,
    background .35s ease,
    box-shadow .35s ease;
}

.theme-toggle:hover{

  color:#d9efff;

  border-color:
    rgba(122,192,235,.62);

  background:
    rgba(8,31,52,.55);

  box-shadow:
    0 0 14px
    rgba(76,151,202,.12);
}

.theme-icon{

  font-size:12px;

  line-height:1;

  letter-spacing:0;
}


/* =========================
   CONTENT
========================= */

.content{

  position:relative;

  z-index:5;

  width:min(1100px,100%);

  margin:0 auto;

  padding-top:145px;
}


/* =========================
   HEADING
========================= */

.heading{

  text-align:center;

  margin-bottom:48px;
}

.heading-small{

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:6px;

  color:rgba(115,182,224,.62);

  margin-bottom:12px;

  transition:
    color .6s ease;
}

.heading-main{

  font-family:"Cinzel",serif;

  font-size:clamp(34px,5vw,56px);

  font-weight:400;

  letter-spacing:8px;

  line-height:1;

  color:#dceeff;

  transition:
    color .6s ease,
    text-shadow .6s ease;
}

.heading-cn{

  margin-top:14px;

  font-size:13px;

  letter-spacing:5px;

  color:rgba(207,229,246,.86);

  transition:
    color .6s ease;
}


/* =========================
   CHARACTER PANEL
========================= */

.character-panel{

  position:relative;

  display:grid;

  grid-template-columns:
    minmax(300px,430px)
    1fr;

  gap:55px;

  width:100%;

  padding:38px;

  border:
    1px solid
    rgba(111,174,224,.32);

  background:

    linear-gradient(
      145deg,
      rgba(38,91,137,.13),
      rgba(11,45,75,.10)
    );

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.15);

  transition:
    background .6s ease,
    border-color .6s ease,
    box-shadow .6s ease;
}


/* =========================
   CHARACTER IMAGE
========================= */

.character-image{

  position:relative;

  min-height:540px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:
    1px solid
    rgba(111,174,224,.25);

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(38,91,137,.14),
      transparent 58%
    ),

    rgba(6,20,38,.4);

  overflow:hidden;

  transition:
    background .6s ease,
    border-color .6s ease;
}

.character-image::before{

  content:"";

  position:absolute;

  inset:18px;

  border:
    1px solid
    rgba(140,210,245,.07);

  pointer-events:none;

  transition:
    border-color .6s ease;
}

.character-image::after{

  content:"✦";

  position:absolute;

  right:24px;
  top:20px;

  color:rgba(143,202,237,.8);

  font-size:16px;

  text-shadow:
    0 0 10px
    rgba(90,190,240,.25);

  transition:
    color .6s ease,
    text-shadow .6s ease;
}


/* =========================
   IMAGE PLACEHOLDER
========================= */

.image-placeholder{

  text-align:center;

  color:rgba(177,207,230,.62);

  font-family:"Cinzel",serif;

  letter-spacing:4px;

  font-size:10px;

  transition:
    color .6s ease;
}

.image-placeholder-symbol{

  display:block;

  margin-bottom:15px;

  font-family:
    "Times New Roman",
    serif;

  font-size:34px;

  color:rgba(143,210,246,.08);

  transition:
    color .6s ease;
}

.image-placeholder-cn{

  display:block;

  margin-top:10px;

  font-family:
    "Noto Serif SC",
    serif;

  font-size:10px;

  letter-spacing:3px;

  color:rgba(177,207,230,.62);

  transition:
    color .6s ease;
}


/* =========================
   CHARACTER INFO
========================= */

.character-info{

  display:flex;

  flex-direction:column;

  justify-content:center;
}


/* CHARACTER NUMBER */

.character-number{

  font-family:"Cinzel",serif;

  font-size:9px;

  letter-spacing:4px;

  color:rgba(115,182,224,.62);

  margin-bottom:22px;

  transition:
    color .6s ease;
}


/* CHARACTER NAME */

.character-name-en{

  font-family:"Cinzel",serif;

  font-size:clamp(32px,4vw,52px);

  font-weight:400;

  letter-spacing:5px;

  line-height:1;

  color:#d9edff;

  transition:
    color .6s ease;
}

.character-name-cn{

  margin-top:13px;

  font-size:18px;

  letter-spacing:7px;

  color:rgba(207,229,246,.86);

  transition:
    color .6s ease;
}

.character-role{

  margin-top:18px;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:4px;

  color:rgba(115,182,224,.62);

  transition:
    color .6s ease;
}


/* =========================
   DIVIDER
========================= */

.divider{

  width:100%;

  height:1px;

  margin:30px 0;

  background:

    linear-gradient(
      90deg,
      rgba(120,195,235,.3),
      rgba(120,195,235,.06),
      transparent
    );

  transition:
    background .6s ease;
}


/* =========================
   BASIC INFO
========================= */

.basic-info{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:22px 35px;
}

.info-item{

  display:flex;

  flex-direction:column;

  gap:7px;
}

.info-label{

  font-family:"Cinzel",serif;

  font-size:8px;

  letter-spacing:3px;

  color:rgba(115,182,224,.62);

  transition:
    color .6s ease;
}

.info-value{

  font-size:12px;

  letter-spacing:2px;

  color:rgba(207,229,246,.86);

  min-height:14px;

  transition:
    color .6s ease;
}


/* =========================
   PROFILE
========================= */

.description-title{

  font-family:"Cinzel",serif;

  font-size:9px;

  letter-spacing:4px;

  color:rgba(115,182,224,.62);

  margin-bottom:13px;

  transition:
    color .6s ease;
}

.description{

  font-size:13px;

  line-height:2;

  letter-spacing:1px;

  color:rgba(177,207,230,.62);

  min-height:20px;

  transition:
    color .6s ease;
}


/* =========================
   ARCHIVE MARK
========================= */

.archive-mark{

  position:absolute;

  right:25px;
  bottom:20px;

  font-family:"Cinzel",serif;

  font-size:8px;

  letter-spacing:3px;

  color:rgba(137,201,239,.28);

  transition:
    color .6s ease;
}


/* =========================
   TABLET
========================= */

@media(max-width:800px){

  .header{

    left:35px;
    right:35px;
    top:30px;
  }

  .header-right{

    gap:14px;
  }

  .theme-toggle{

    height:27px;

    padding:
      0 9px;

    font-size:7px;
  }

  .character-panel{

    grid-template-columns:1fr;

    gap:40px;

    padding:30px;
  }

  .character-image{

    min-height:500px;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .page{

    padding:
      22px
      20px
      55px;
  }

  .header{

    left:25px;
    right:25px;
    top:24px;

    width:auto;
    max-width:none;

    margin:0;
    padding:0;

    align-items:flex-start;
  }

  .frame{

    top:14px;
    left:14px;
    right:14px;
    bottom:14px;
  }


  /* logo */

  .logo{

    align-items:flex-start;

    gap:10px;
  }

  .logo-symbol{

    width:15px;
    height:11px;

    font-size:15px;

    line-height:11px;

    margin-top:2px;
  }

  .logo-cn{

    height:11px;

    line-height:11px;

    font-size:11px;

    letter-spacing:2px;
  }

  .logo-en{

    margin-top:4px;

    font-size:7px;

    line-height:7px;

    letter-spacing:2px;
  }

  .header-right{

    gap:8px;
  }

  .back{

    font-size:10px;
  }

  .theme-toggle{

    height:25px;

    padding:
      0 7px;

    gap:5px;

    font-size:6px;

    letter-spacing:1px;
  }

  .theme-icon{

    font-size:10px;
  }


  /* content */

  .content{

    padding-top:120px;
  }

  .heading{

    margin-bottom:30px;
  }

  .heading-small{

    font-size:8px;

    letter-spacing:4px;
  }

  .heading-main{

    font-size:30px;

    letter-spacing:5px;
  }

  .heading-cn{

    font-size:10px;

    letter-spacing:3px;
  }


  /* panel */

  .character-panel{

    padding:20px;

    gap:30px;
  }

  .character-image{

    min-height:430px;
  }

  .character-image::before{

    inset:12px;
  }


  /* name */

  .character-name-en{

    font-size:32px;

    letter-spacing:4px;
  }

  .character-name-cn{

    font-size:15px;

    letter-spacing:5px;
  }


  /* info */

  .basic-info{

    grid-template-columns:1fr;

    gap:17px;
  }

  .description{

    font-size:12px;

    line-height:1.9;
  }


  /* magic circle */

  .magic-circle{

    width:125vw;

    height:125vw;
  }


  /* archive mark */

  .archive-mark{

    position:relative;

    right:auto;
    bottom:auto;

    margin-top:24px;

    text-align:right;

    font-size:7px;

    letter-spacing:2px;

    line-height:1.4;

    white-space:nowrap;
  }
}


/* =========================
   VERY SMALL
========================= */

@media(max-width:360px){

  .header{

    left:20px;
    right:20px;
    top:24px;
  }

  .heading-main{

    font-size:27px;
  }

  .header-right{

    gap:5px;
  }

  .back{

    font-size:9px;
  }

  .theme-toggle{

    padding:
      0 6px;

    font-size:6px;
  }
}


/* =========================================================
   ★ DAY MODE
   ★ 与首页 / 档案目录统一
========================================================= */

body.day-mode{

  background:#f4f9fd;

  color:#2e5069;
}


/* 页面背景 */

body.day-mode .page{

  background:

    radial-gradient(
      circle at 50% 42%,
      rgba(165,211,238,.20),
      transparent 38%
    ),

    radial-gradient(
      circle at 50% 52%,
      rgba(226,240,249,.68),
      transparent 72%
    ),

    #f4f9fd;
}


/* =========================
   DAY · STARS
========================= */

body.day-mode .stars span{

  color:
    rgba(87,151,199,.50);

  text-shadow:none;
}


/* =========================
   DAY · MAGIC CIRCLE
========================= */

body.day-mode .magic-circle{

  border-color:
    rgba(79,148,196,.26);

  box-shadow:

    0 0 50px
    rgba(70,142,196,.055),

    inset
    0 0 60px
    rgba(78,151,204,.028);
}

body.day-mode .magic-circle::before{

  border-color:
    rgba(79,148,196,.26);
}

body.day-mode .magic-circle::after{

  border-color:
    rgba(101,168,207,.20);
}


/* =========================
   DAY · FRAME
========================= */

<script>

/* =========================================================
   昼夜模式
   与首页 / 档案目录共用：seyami-theme
========================================================= */

const themeToggle =
  document.getElementById(
    "themeToggle"
  );

const themeIcon =
  document.getElementById(
    "themeIcon"
  );

const themeText =
  document.getElementById(
    "themeText"
  );


function applyTheme(theme){

  if(theme === "day"){

    document.body.classList.add(
      "day-mode"
    );

    themeIcon.textContent = "☀";

    themeText.textContent = "DAY";

  }else{

    document.body.classList.remove(
      "day-mode"
    );

    themeIcon.textContent = "☾";

    themeText.textContent = "NIGHT";

  }

}


/* 读取首页 / 档案目录保存的模式 */

const savedTheme =
  localStorage.getItem(
    "seyami-theme"
  );


/* 默认夜间 */

applyTheme(
  savedTheme === "day"
    ? "day"
    : "night"
);


/* 点击切换 */

themeToggle.addEventListener(
  "click",
  () => {

    const isDay =
      document.body.classList.contains(
        "day-mode"
      );

    const nextTheme =
      isDay
        ? "night"
        : "day";

    localStorage.setItem(
      "seyami-theme",
      nextTheme
    );

    applyTheme(
      nextTheme
    );

  }
);

</script>
