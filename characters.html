<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>角色档案 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        "Times New Roman",
        serif;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


.page{

    position:relative;

    min-height:100vh;

    padding:
        30px
        clamp(24px,6vw,90px)
        70px;

    overflow:hidden;

    transition:
        background .5s ease;
}


/* =========================================================
   背景星星
========================================================= */

.stars{

    position:absolute;

    inset:0;

    z-index:1;

    pointer-events:none;

    overflow:hidden;
}

.stars span{

    position:absolute;

    display:block;

    color:
        rgba(158,207,247,.62);

    font-family:
        "Times New Roman",
        serif;

    line-height:1;

    text-shadow:
        0 0 8px
        rgba(96,177,242,.5);

    animation:
        starFloat
        8s
        ease-in-out
        infinite,

        starTwinkle
        5s
        ease-in-out
        infinite;
}


/* =========================================================
   星星位置
========================================================= */

.stars span:nth-child(1){
    left:8%;
    top:15%;
    font-size:15px;
    animation-delay:-2s,-1s;
    opacity:.55;
}

.stars span:nth-child(2){
    left:19%;
    top:32%;
    font-size:10px;
    animation-delay:-4s,-2s;
    opacity:.32;
}

.stars span:nth-child(3){
    left:31%;
    top:12%;
    font-size:12px;
    animation-delay:-6s,-1s;
    opacity:.38;
}

.stars span:nth-child(4){
    right:17%;
    top:18%;
    font-size:18px;
    animation-delay:-3s,-2s;
    opacity:.42;
}

.stars span:nth-child(5){
    right:8%;
    top:38%;
    font-size:10px;
    animation-delay:-5s,-3s;
    opacity:.32;
}

.stars span:nth-child(6){
    left:10%;
    top:57%;
    font-size:13px;
    animation-delay:-4s,-1s;
    opacity:.35;
}

.stars span:nth-child(7){
    left:27%;
    top:69%;
    font-size:9px;
    animation-delay:-7s,-2s;
    opacity:.28;
}

.stars span:nth-child(8){
    right:25%;
    top:58%;
    font-size:15px;
    animation-delay:-3s,-1s;
    opacity:.30;
}

.stars span:nth-child(9){
    right:9%;
    top:73%;
    font-size:18px;
    animation-delay:-6s,-3s;
    opacity:.26;
}

.stars span:nth-child(10){
    left:43%;
    top:78%;
    font-size:11px;
    animation-delay:-2s,-2s;
    opacity:.30;
}

.stars span:nth-child(11){
    left:4%;
    top:30%;
    font-size:9px;
    animation-delay:-1s,-2s;
    opacity:.32;
}

.stars span:nth-child(12){
    left:38%;
    top:8%;
    font-size:12px;
    animation-delay:-4s,-1s;
    opacity:.38;
}

.stars span:nth-child(13){
    right:5%;
    top:31%;
    font-size:15px;
    animation-delay:-6s,-3s;
    opacity:.30;
}

.stars span:nth-child(14){
    left:24%;
    top:53%;
    font-size:8px;
    animation-delay:-3s,-1s;
    opacity:.28;
}

.stars span:nth-child(15){
    right:24%;
    top:53%;
    font-size:14px;
    animation-delay:-7s,-2s;
    opacity:.24;
}

.stars span:nth-child(16){
    left:6%;
    top:72%;
    font-size:12px;
    animation-delay:-5s,-3s;
    opacity:.34;
}

.stars span:nth-child(17){
    right:7%;
    top:70%;
    font-size:18px;
    animation-delay:-8s,-4s;
    opacity:.25;
}

.stars span:nth-child(18){
    left:34%;
    bottom:9%;
    font-size:10px;
    animation-delay:-2s,-2s;
    opacity:.30;
}

.stars span:nth-child(19){
    right:36%;
    bottom:8%;
    font-size:11px;
    animation-delay:-5s,-1s;
    opacity:.34;
}

.stars span:nth-child(20){
    left:46%;
    top:8%;
    font-size:13px;
    animation-delay:-9s,-4s;
    opacity:.20;
}


@keyframes starFloat{

    0%,
    100%{
        transform:
            translate3d(0,0,0);
    }

    50%{
        transform:
            translate3d(0,-8px,0);
    }

}


@keyframes starTwinkle{

    0%,
    100%{
        opacity:.18;
    }

    50%{
        opacity:.65;
    }

}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:absolute;

    width:
        min(72vw,760px);

    height:
        min(72vw,760px);

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.12);

    box-shadow:
        0 0 50px
        rgba(47,126,184,.035),

        inset 0 0 60px
        rgba(62,139,194,.025);

    pointer-events:none;

    z-index:0;

    transition:
        border-color .5s ease,
        box-shadow .5s ease;
}

.magic-circle::before{

    content:"";

    position:absolute;

    inset:9%;

    border-radius:50%;

    border:
        1px solid
        rgba(91,162,213,.10);

}

.magic-circle::after{

    content:"";

    position:absolute;

    inset:19.5%;

    border-radius:50%;

    border:
        1px solid
        rgba(108,178,230,.10);

}


/* =========================================================
   外框
========================================================= */

.frame{

    position:absolute;

    inset:20px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;

    transition:
        border-color .5s ease;
}

.frame::before,
.frame::after{

    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-color:
        rgba(137,201,239,.45);

    border-style:solid;
}

.frame::before{

    left:-1px;
    top:-1px;

    border-width:
        1px 0 0 1px;
}

.frame::after{

    right:-1px;
    bottom:-1px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   顶部
========================================================= */

.header{

    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{

    display:flex;

    align-items:baseline;

    gap:10px;

    text-decoration:none;

    color:
        rgba(225,246,255,.92);
}

.logo-symbol{

    font-family:
        "Times New Roman",
        serif;

    font-size:21px;

    color:
        rgba(137,201,239,.9);

    text-shadow:
        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);
}

.logo-text{

    display:flex;

    flex-direction:column;

    line-height:1.05;
}

.logo-cn{

    font-size:15px;

    letter-spacing:2px;

    color:
        rgba(225,246,255,.92);
}

.logo-en{

    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.63);
}


/* =========================================================
   右侧
========================================================= */

.header-right{

    display:flex;

    align-items:center;

    gap:18px;
}

.back{

    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-size:12px;

    letter-spacing:2px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.back:hover{

    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}


/* =========================================================
   日夜按钮
========================================================= */

.theme-toggle{

    height:28px;

    padding:
        0 11px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    flex-shrink:0;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:1.5px;

    cursor:pointer;

    white-space:nowrap;

    transition:
        border-color .35s ease,
        background .35s ease,
        color .35s ease,
        box-shadow .35s ease;
}

.theme-toggle:hover{

    border-color:
        rgba(122,192,235,.62);

    color:#d9efff;

    box-shadow:
        0 0 14px
        rgba(76,151,202,.12);
}

.theme-icon{

    font-size:12px;

    line-height:1;
}


/* =========================================================
   主体
========================================================= */

.content{

    position:relative;

    z-index:5;

    width:
        min(1100px,100%);

    margin:
        0 auto;

    padding-top:145px;
}


/* =========================================================
   标题
========================================================= */

.heading{

    text-align:center;

    margin-bottom:42px;
}

.heading-small{

    font-family:
        "Cinzel",
        serif;

    font-size:11px;

    letter-spacing:5px;

    color:
        rgba(157,204,239,.63);

    margin-bottom:11px;
}

.heading-main{

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(34px,5vw,58px);

    font-weight:400;

    letter-spacing:7px;

    color:
        rgba(220,238,255,.92);

    text-shadow:
        0 0 18px
        rgba(94,172,222,.08);
}

.heading-cn{

    margin-top:14px;

    font-size:14px;

    letter-spacing:5px;

    color:
        rgba(177,207,230,.62);
}


/* =========================================================
   角色主体
========================================================= */

.character-panel{

    display:grid;

    grid-template-columns:
        430px 1fr;

    gap:55px;

    padding:38px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:

        linear-gradient(
            135deg,
            rgba(38,91,137,.13),
            rgba(11,45,75,.10)
        );

    box-shadow:
        0 0 40px
        rgba(38,91,137,.06);

    transition:
        border-color .5s ease,
        background .5s ease,
        box-shadow .5s ease;
}


/* =========================================================
   角色图片
========================================================= */

.character-image{

    position:relative;

    min-height:540px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        1px solid
        rgba(111,174,224,.25);

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.14),
            transparent 48%
        ),

        rgba(6,20,38,.4);

    transition:
        border-color .5s ease,
        background .5s ease;
}

.character-image::before{

    content:"";

    position:absolute;

    inset:14px;

    border:
        1px solid
        rgba(140,210,245,.07);

    pointer-events:none;
}

.character-image::after{

    content:"✦";

    position:absolute;

    right:18px;

    bottom:15px;

    font-size:16px;

    color:
        rgba(145,215,250,.25);

    text-shadow:
        0 0 10px
        rgba(80,170,225,.25);
}

.character-placeholder{

    text-align:center;

    color:
        rgba(157,204,239,.40);

    letter-spacing:3px;

    font-size:11px;
}


/* =========================================================
   角色资料
========================================================= */

.profile{

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.character-name{

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(30px,4vw,48px);

    font-weight:400;

    letter-spacing:5px;

    color:
        rgba(220,238,255,.92);
}

.character-subtitle{

    margin-top:9px;

    font-size:13px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.63);
}

.divider{

    width:100%;

    height:1px;

    margin:
        28px 0;

    background:

        linear-gradient(
            90deg,
            rgba(120,195,235,.3),
            rgba(120,195,235,.06),
            transparent
        );
}


/* =========================================================
   基础资料
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        20px 30px;
}

.info-item{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.info-label{

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:2px;

    color:
        rgba(125,190,220,.42);
}

.info-value{

    min-height:18px;

    font-size:12px;

    letter-spacing:1px;

    color:
        rgba(205,232,244,.68);
}


/* =========================================================
   介绍
========================================================= */

.description-title{

    margin-bottom:11px;

    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:3px;

    color:
        rgba(130,200,235,.5);
}

.description-text{

    font-size:12px;

    line-height:2;

    letter-spacing:1px;

    color:
        rgba(190,220,235,.58);
}


/* =========================================================
   档案编号
========================================================= */

.archive-mark{

    margin-top:34px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    color:
        rgba(137,201,239,.28);
}


/* =========================================================
   日间模式
   ★ 颜色完全对应首页
========================================================= */

body.day-mode{

    background:#f4f9fd;

    color:#2e5069;
}

body.day-mode .page{

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),

        #f4f9fd;
}


/* 星星 */

body.day-mode .stars span{

    color:
        rgba(87,151,199,.50);

    text-shadow:none;
}


/* 魔法阵 */

body.day-mode .magic-circle{

    border-color:
        rgba(79,148,196,.13);

    box-shadow:
        0 0 50px
        rgba(70,142,196,.055),

        inset 0 0 60px
        rgba(78,151,204,.028);
}

body.day-mode .magic-circle::before{

    border-color:
        rgba(79,148,196,.10);
}

body.day-mode .magic-circle::after{

    border-color:
        rgba(101,168,207,.11);
}


/* 外框 */

body.day-mode .frame{

    border-color:
        rgba(91,145,184,.34);
}

body.day-mode .frame::before,
body.day-mode .frame::after{

    border-color:
        rgba(79,151,200,.48);
}


/* Logo */

body.day-mode .logo{

    color:#2e526c;
}

body.day-mode .logo-symbol{

    color:
        rgba(79,151,201,.84);

    text-shadow:
        0 0 7px
        rgba(86,158,208,.20);
}

body.day-mode .logo-cn{

    color:
        rgba(46,82,108,.92);
}

body.day-mode .logo-en{

    color:
        rgba(81,137,173,.62);
}


/* 返回 */

body.day-mode .back{

    color:
        rgba(62,99,127,.70);
}

body.day-mode .back:hover{

    color:#28536f;

    text-shadow:
        0 0 8px
        rgba(76,151,202,.14);
}


/* 日夜按钮 */

body.day-mode .theme-toggle{

    border-color:
        rgba(91,145,184,.34);

    background:
        rgba(248,252,255,.78);

    color:
        rgba(61,98,125,.76);
}

body.day-mode .theme-toggle:hover{

    border-color:
        rgba(79,151,200,.62);

    color:#28536f;

    box-shadow:
        0 0 14px
        rgba(76,151,202,.11);
}


/* 标题 */

body.day-mode .heading-small{

    color:
        rgba(81,137,173,.68);
}

body.day-mode .heading-main{

    color:#2b506a;

    text-shadow:
        0 0 18px
        rgba(80,151,201,.065);
}

body.day-mode .heading-cn{

    color:
        rgba(45,82,106,.80);
}


/* 角色框 */

body.day-mode .character-panel{

    border-color:
        rgba(91,145,184,.34);

    background:

        linear-gradient(
            135deg,
            rgba(165,211,238,.13),
            rgba(226,240,249,.10)
        );

    box-shadow:
        0 0 40px
        rgba(76,151,202,.055);
}


/* 图片框 */

body.day-mode .character-image{

    border-color:
        rgba(91,145,184,.25);

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(165,211,238,.14),
            transparent 48%
        ),

        rgba(242,249,253,.72);
}

body.day-mode .character-image::before{

    border-color:
        rgba(79,151,200,.10);
}

body.day-mode .character-image::after{

    color:
        rgba(76,151,201,.28);

    text-shadow:
        0 0 10px
        rgba(80,151,201,.15);
}

body.day-mode .character-placeholder{

    color:
        rgba(81,137,173,.48);
}


/* 名字 */

body.day-mode .character-name{

    color:#2b506a;
}

body.day-mode .character-subtitle{

    color:
        rgba(81,137,173,.68);
}


/* 分割线 */

body.day-mode .divider{

    background:

        linear-gradient(
            90deg,
            rgba(81,151,198,.30),
            rgba(81,151,198,.06),
            transparent
        );
}


/* 基础资料 */

body.day-mode .info-label{

    color:
        rgba(81,137,173,.52);
}

body.day-mode .info-value{

    color:
        rgba(62,99,127,.76);
}


/* 介绍 */

body.day-mode .description-title{

    color:
        rgba(81,137,173,.58);
}

body.day-mode .description-text{

    color:
        rgba(65,106,133,.68);
}


/* 档案编号 */

body.day-mode .archive-mark{

    color:
        rgba(81,137,173,.38);
}


/* =========================================================
   平板
========================================================= */

@media(max-width:900px){

    .character-panel{

        grid-template-columns:
            360px 1fr;

        gap:35px;

        padding:28px;
    }

    .character-image{

        min-height:480px;
    }

}


/* =========================================================
   手机
========================================================= */

@media(max-width:700px){

    .page{

        padding:
            24px
            20px
            55px;
    }

    .frame{

        inset:12px;
    }

    .header{

        left:25px;
        right:25px;
        top:24px;
    }

    .header-right{

        gap:10px;
    }

    .logo{

        gap:8px;
    }

    .logo-symbol{

        font-size:18px;
    }

    .logo-cn{

        font-size:12px;

        letter-spacing:1px;
    }

    .logo-en{

        font-size:6px;

        letter-spacing:2px;
    }

    .back{

        font-size:9px;

        letter-spacing:1px;
    }

    .theme-toggle{

        height:24px;

        padding:
            0 6px;

        gap:3px;

        font-size:6px;

        letter-spacing:.7px;
    }

    .theme-icon{

        font-size:10px;
    }

    .content{

        padding-top:115px;
    }

    .heading{

        margin-bottom:30px;
    }

    .heading-small{

        font-size:9px;

        letter-spacing:3px;
    }

    .heading-main{

        font-size:34px;

        letter-spacing:4px;
    }

    .heading-cn{

        font-size:12px;

        letter-spacing:3px;
    }

    .character-panel{

        grid-template-columns:1fr;

        gap:30px;

        padding:20px;
    }

    .character-image{

        min-height:400px;
    }

    .character-name{

        font-size:34px;
    }

    .info-grid{

        gap:
            16px
            18px;
    }

}


/* =========================================================
   超小屏
========================================================= */

@media(max-width:420px){

    .page{

        padding-left:16px;
        padding-right:16px;
    }

    .header{

        left:20px;
        right:20px;
    }

    .back{

        font-size:8px;
    }

    .theme-toggle{

        padding:0 5px;
    }

    .theme-toggle .theme-text{

        display:none;
    }

    .heading-main{

        font-size:30px;

        letter-spacing:3px;
    }

    .character-panel{

        padding:16px;
    }

    .character-image{

        min-height:340px;
    }

    .info-grid{

        grid-template-columns:1fr;
    }

}


/* =========================================================
   日间模式过渡
========================================================= */

body.day-mode .character-panel,
body.day-mode .character-image,

<script>

/* =========================================================
   日间 / 夜间模式
========================================================= */

(function(){

    const toggle =
        document.getElementById(
            "themeToggle"
        );

    const icon =
        document.getElementById(
            "themeIcon"
        );

    const text =
        document.getElementById(
            "themeText"
        );


    if(
        !toggle ||
        !icon ||
        !text
    ){

        return;

    }


    function updateButton(){

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );


        if(isDay){

            icon.textContent = "☀";

            text.textContent = "DAY";

        }else{

            icon.textContent = "☾";

            text.textContent = "NIGHT";

        }

    }


    const savedTheme =
        localStorage.getItem(
            "seyami-theme"
        );


    if(savedTheme === "day"){

        document.body.classList.add(
            "day-mode"
        );

    }


    updateButton();


    toggle.addEventListener(
        "click",
        function(){

            const isDay =
                document.body.classList.toggle(
                    "day-mode"
                );


            localStorage.setItem(
                "seyami-theme",
                isDay
                    ? "day"
                    : "night"
            );


            updateButton();

        }
    );

})();

</script>
