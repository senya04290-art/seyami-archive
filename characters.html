<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   CHARACTER ELEMENTS
========================================================= */

const characterNumber =
  document.querySelector(".character-number");

const characterNameEn =
  document.querySelector(".character-name-en");

const characterNameCn =
  document.querySelector(".character-name-cn");

const characterRole =
  document.querySelector(".character-role");

const infoValues =
  document.querySelectorAll(".info-value");

const characterImage =
  document.getElementById("characterImage");

const imagePlaceholder =
  document.getElementById("imagePlaceholder");

const description =
  document.querySelector(".description");

const archiveMark =
  document.querySelector(".archive-mark");


/* =========================================================
   EDIT BUTTON
   游客默认隐藏，管理员验证通过后才显示
========================================================= */

const editCharacterButton =
  document.getElementById("editCharacterButton");

if (editCharacterButton) {
  editCharacterButton.style.display = "none";
}


/* =========================================================
   PAGINATION ELEMENTS
========================================================= */

const prevCharacter =
  document.getElementById("prevCharacter");

const nextCharacter =
  document.getElementById("nextCharacter");

const paginationStatus =
  document.getElementById("paginationStatus");


/* =========================================================
   ALL CHARACTERS
========================================================= */

let allCharacters = [];

let currentIndex = 0;


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkSeyamiAdmin() {
  try {
    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (error || !data || !data.user) {
      return false;
    }

    return (
      (data.user.email || "").trim().toLowerCase() ===
      "1296457710@qq.com"
    );

  } catch (error) {
    console.error("管理员身份检查失败：", error);
    return false;
  }
}


/* =========================================================
   SET UP EDIT BUTTON
========================================================= */

async function setupCharacterEditButton() {
  if (!editCharacterButton) return;

  /* 再次确保游客看不到按钮 */
  editCharacterButton.style.display = "none";

  const isAdmin = await checkSeyamiAdmin();

  if (!isAdmin) return;

  /* 仅管理员显示 */
  editCharacterButton.style.display = "";

  editCharacterButton.addEventListener("click", function () {
    const character = allCharacters[currentIndex];

    if (!character) return;

    window.location.href =
      "edit.html?id=" +
      encodeURIComponent(character.id);
  });
}


/* =========================================================
   GET CHARACTER ID
========================================================= */

function getCharacterId() {
  const params =
    new URLSearchParams(window.location.search);

  return params.get("id");
}


/* =========================================================
   UPDATE URL
========================================================= */

function goToCharacter(character) {
  if (!character) return;

  const url =
    "characters.html?id=" +
    encodeURIComponent(character.id);

  window.location.href = url;
}


/* =========================================================
   UPDATE PAGINATION
========================================================= */

function updatePagination() {
  const total = allCharacters.length;

  if (total <= 1) {
    prevCharacter.disabled = true;
    nextCharacter.disabled = true;
  } else {
    prevCharacter.disabled = currentIndex <= 0;
    nextCharacter.disabled = currentIndex >= total - 1;
  }

  const displayNumber =
    String(currentIndex + 1).padStart(3, "0");

  paginationStatus.textContent =
    "CHARACTER · " + displayNumber;

  document.title =
    "角色档案 · " +
    (allCharacters[currentIndex]?.name || "Seyami Archive");
}


/* =========================================================
   RENDER CHARACTER
========================================================= */

function renderCharacter(character) {
  if (!character) return;

  const displayNumber =
    String(currentIndex + 1).padStart(3, "0");

  characterNumber.textContent =
    "CHARACTER · " + displayNumber;

  archiveMark.textContent =
    "SEYAMI · CHARACTER ARCHIVE · " + displayNumber;


  /* NAME */

  const fullName = (character.name || "").trim();

  const chineseIndex =
    fullName.search(/[\u4e00-\u9fff]/);

  if (chineseIndex > -1) {
    characterNameEn.textContent =
      fullName.substring(0, chineseIndex).trim();

    characterNameCn.textContent =
      fullName.substring(chineseIndex).trim();
  } else {
    characterNameEn.textContent = fullName;
    characterNameCn.textContent = "";
  }


  /* ROLE */

  characterRole.textContent =
    character.role || "";


  /* BASIC INFO */

  if (infoValues.length >= 4) {
    infoValues[0].textContent =
      character.race || "";

    infoValues[1].textContent =
      character.region || "";

    let status = "";

    if (character.gender) {
      status = character.gender;
    }

    if (
      character.age !== null &&
      character.age !== undefined &&
      character.age !== ""
    ) {
      if (status) status += " · ";
      status += character.age + "岁";
    }

    infoValues[2].textContent = status;

    infoValues[3].textContent =
      character.role || "";
  }


  /* PROFILE */

  let profileText = "";

  if (
    character.personality !== null &&
    character.personality !== undefined &&
    String(character.personality).trim() !== ""
  ) {
    profileText +=
      "性格： " + String(character.personality).trim();
  }

  if (
    character.backstory !== null &&
    character.backstory !== undefined &&
    String(character.backstory).trim() !== ""
  ) {
    if (profileText) profileText += "\n\n";

    profileText +=
      "背景： " + String(character.backstory).trim();
  }

  description.style.whiteSpace = "pre-line";
  description.textContent = profileText;


  /* IMAGE */

  const imageURL =
    (character.image_url || "").trim();

  characterImage.style.display = "none";
  imagePlaceholder.style.display = "block";

  characterImage.onload = null;
  characterImage.onerror = null;

  if (imageURL) {
    characterImage.onload = function () {
      characterImage.style.display = "block";
      imagePlaceholder.style.display = "none";
    };

    characterImage.onerror = function () {
      characterImage.style.display = "none";
      imagePlaceholder.style.display = "block";

      console.error("角色图片加载失败：", imageURL);
    };

    characterImage.src = imageURL;
    characterImage.alt = fullName;

  } else {
    characterImage.removeAttribute("src");
  }

  updatePagination();
}


/* =========================================================
   LOAD ALL CHARACTERS
========================================================= */

async function loadCharacters() {
  try {
    const {
      data,
      error
    } = await supabaseClient
      .from("characters")
      .select(`
        id,
        name,
        race,
        role,
        age,
        gender,
        region,
        personality,
        backstory,
        image_url
      `)
      .order("id", {
        ascending: true
      });

    if (error) {
      console.error("Supabase 读取失败：", error);

      characterNameEn.textContent = "ARCHIVE ERROR";
      characterNameCn.textContent = "档案读取失败";
      description.textContent = "DATABASE CONNECTION ERROR";

      return;
    }

    if (!data || data.length === 0) {
      characterNameEn.textContent = "ARCHIVE NOT FOUND";
      characterNameCn.textContent = "暂无角色档案";
      description.textContent = "";

      prevCharacter.disabled = true;
      nextCharacter.disabled = true;

      return;
    }

    allCharacters = data;

    const characterId = getCharacterId();

    if (characterId) {
      const foundIndex =
        allCharacters.findIndex(
          character =>
            String(character.id) === String(characterId)
        );

      currentIndex = foundIndex >= 0 ? foundIndex : 0;
    } else {
      currentIndex = 0;
    }

    renderCharacter(allCharacters[currentIndex]);

    console.log("角色数量：", allCharacters.length);
    console.log("当前角色：", allCharacters[currentIndex]);

  } catch (error) {
    console.error("角色档案加载失败：", error);

    characterNameEn.textContent = "ARCHIVE ERROR";
    characterNameCn.textContent = "档案读取失败";
    description.textContent = "DATABASE CONNECTION ERROR";
  }
}


/* =========================================================
   PREVIOUS
========================================================= */

prevCharacter.addEventListener("click", function () {
  if (currentIndex <= 0) return;

  goToCharacter(allCharacters[currentIndex - 1]);
});


/* =========================================================
   NEXT
========================================================= */

nextCharacter.addEventListener("click", function () {
  if (currentIndex >= allCharacters.length - 1) return;

  goToCharacter(allCharacters[currentIndex + 1]);
});


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener("keydown", function (event) {
  const tag = document.activeElement?.tagName;

  if (tag === "INPUT" || tag === "TEXTAREA") {
    return;
  }

  if (event.key === "ArrowLeft" && currentIndex > 0) {
    goToCharacter(allCharacters[currentIndex - 1]);
  }

  if (
    event.key === "ArrowRight" &&
    currentIndex < allCharacters.length - 1
  ) {
    goToCharacter(allCharacters[currentIndex + 1]);
  }
});


/* =========================================================
   DAY / NIGHT
========================================================= */

const themeToggle =
  document.getElementById("themeToggle");

const themeIcon =
  document.getElementById("themeIcon");

const themeText =
  document.getElementById("themeText");


function applyTheme(theme) {
  if (theme === "day") {
    document.body.classList.add("day-mode");

    themeIcon.textContent = "☀";
    themeText.textContent = "DAY";
  } else {
    document.body.classList.remove("day-mode");

    themeIcon.textContent = "☾";
    themeText.textContent = "NIGHT";
  }
}


const savedTheme =
  localStorage.getItem("seyami-theme");

applyTheme(savedTheme === "day" ? "day" : "night");


themeToggle.addEventListener("click", function () {
  const isDay =
    document.body.classList.contains("day-mode");

  const nextTheme = isDay ? "night" : "day";

  localStorage.setItem("seyami-theme", nextTheme);

  applyTheme(nextTheme);
});


/* =========================================================
   START
========================================================= */

loadCharacters();
setupCharacterEditButton();

</script>
