<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>角色档案 · Seyami Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
rel="stylesheet">

<style>

/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(38,91,137,.18),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #071523 0%,
      #06111f 50%,
      #040c17 100%
    );

  color:#dcecff;

  font-family:
    "Noto Serif SC",
    "Times New Roman",
    serif;

  overflow-x:hidden;
}


/* =========================
   PAGE
========================= */

.page{

  position:relative;

  min-height:100vh;

  padding:
    30px
    clamp(24px,6vw,90px)
    70px;

  overflow:hidden;
}


/* =========================
   FLOATING STARS
========================= */

.stars{

  position:absolute;

  inset:0;

  z-index:1;

  pointer-events:none;

  overflow:hidden;
}

.stars span{

  position:absolute;

  display:block;

  color:rgba(137,201,239,.42);

  font-family:
    "Times New Roman",
    serif;

  line-height:1;

  text-shadow:
    0 0 7px rgba(76,159,216,.35),
    0 0 18px rgba(49,132,191,.18);

  animation:
    starFloat 8s ease-in-out infinite,
    starTwinkle 5s ease-in-out infinite;
}


/* star positions */

.stars span:nth-child(1){
  left:8%;
  top:15%;
  font-size:15px;
  animation-delay:-2s,-1s;
  opacity:.55;
}

.stars span:nth-child(2){
  left:19%;
  top:32%;
  font-size:10px;
  animation-delay:-4s,-2s;
  opacity:.32;
}

.stars span:nth-child(3){
  left:31%;
  top:12%;
  font-size:12px;
  animation-delay:-6s,-1s;
  opacity:.38;
}

.stars span:nth-child(4){
  right:17%;
  top:18%;
  font-size:18px;
  animation-delay:-3s,-2s;
  opacity:.42;
}

.stars span:nth-child(5){
  right:8%;
  top:38%;
  font-size:10px;
  animation-delay:-5s,-3s;
  opacity:.32;
}

.stars span:nth-child(6){
  left:10%;
  top:57%;
  font-size:13px;
  animation-delay:-4s,-1s;
  opacity:.35;
}

.stars span:nth-child(7){
  left:27%;
  top:69%;
  font-size:9px;
  animation-delay:-7s,-2s;
  opacity:.28;
}

.stars span:nth-child(8){
  right:25%;
  top:58%;
  font-size:15px;
  animation-delay:-3s,-1s;
  opacity:.30;
}

.stars span:nth-child(9){
  right:9%;
  top:73%;
  font-size:18px;
  animation-delay:-6s,-3s;
  opacity:.26;
}

.stars span:nth-child(10){
  left:43%;
  top:78%;
  font-size:11px;
  animation-delay:-2s,-2s;
  opacity:.30;
}

.stars span:nth-child(11){
  left:4%;
  top:30%;
  font-size:9px;
  animation-delay:-1s,-2s;
  opacity:.32;
}

.stars span:nth-child(12){
  left:38%;
  top:8%;
  font-size:12px;
  animation-delay:-4s,-1s;
  opacity:.38;
}

.stars span:nth-child(13){
  right:5%;
  top:31%;
  font-size:15px;
  animation-delay:-6s,-3s;
  opacity:.30;
}

.stars span:nth-child(14){
  left:24%;
  top:53%;
  font-size:8px;
  animation-delay:-3s,-1s;
  opacity:.28;
}

.stars span:nth-child(15){
  right:24%;
  top:53%;
  font-size:14px;
  animation-delay:-7s,-2s;
  opacity:.24;
}

.stars span:nth-child(16){
  left:6%;
  top:72%;
  font-size:12px;
  animation-delay:-5s,-3s;
  opacity:.34;
}

.stars span:nth-child(17){
  right:7%;
  top:70%;
  font-size:18px;
  animation-delay:-8s,-4s;
  opacity:.25;
}

.stars span:nth-child(18){
  left:34%;
  bottom:9%;
  font-size:10px;
  animation-delay:-2s,-2s;
  opacity:.30;
}

.stars span:nth-child(19){
  right:36%;
  bottom:8%;
  font-size:11px;
  animation-delay:-5s,-1s;
  opacity:.34;
}

.stars span:nth-child(20){
  left:46%;
  top:8%;
  font-size:13px;
  animation-delay:-9s,-4s;
  opacity:.20;
}


/* =========================
   STAR ANIMATION
========================= */

@keyframes starFloat{

  0%,
  100%{
    transform:translate3d(0,0,0);
  }

  50%{
    transform:translate3d(0,-8px,0);
  }
}

@keyframes starTwinkle{

  0%,
  100%{
    opacity:.18;
  }

  50%{
    opacity:.65;
  }
}


/* =========================
   MAGIC CIRCLE
========================= */

.magic-circle{

  position:absolute;

  width:min(72vw,760px);
  height:min(72vw,760px);

  left:50%;
  top:47%;

  transform:translate(-50%,-50%);

  border:
    1px solid
    rgba(69,164,230,.07);

  border-radius:50%;

  box-shadow:
    0 0 50px rgba(70,150,210,.035),
    inset 0 0 60px rgba(70,150,210,.025);

  z-index:0;

  pointer-events:none;
}

.magic-circle::before,
.magic-circle::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  pointer-events:none;
}

.magic-circle::before{

  width:82%;
  height:82%;

  border:
    1px solid
    rgba(69,164,230,.055);
}

.magic-circle::after{

  width:61%;
  height:61%;

  border:
    1px solid
    rgba(69,164,230,.06);
}


/* =========================
   OUTER FRAME
========================= */

.frame{

  position:absolute;

  top:20px;
  left:20px;
  right:20px;
  bottom:20px;

  border:
    1px solid
    rgba(111,174,224,.32);

  pointer-events:none;

  z-index:2;
}

.frame::before,
.frame::after{

  content:"";

  position:absolute;

  width:45px;
  height:45px;
}

.frame::before{

  left:-1px;
  top:-1px;

  border-left:
    1px solid
    rgba(160,220,250,.45);

  border-top:
    1px solid
    rgba(160,220,250,.45);
}

.frame::after{

  right:-1px;
  bottom:-1px;

  border-right:
    1px solid
    rgba(160,220,250,.45);

  border-bottom:
    1px solid
    rgba(160,220,250,.45);
}


/* =========================
   HEADER
========================= */

.header{

  position:absolute;

  left:58px;
  right:58px;
  top:38px;

  z-index:20;

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  width:auto;
  max-width:none;

  margin:0;
  padding:0;
}


/* =========================
   LOGO
========================= */

.logo{

  display:flex;

  align-items:flex-start;

  gap:12px;

  color:rgba(225,246,255,.92);

  text-decoration:none;
}

.logo-symbol{

  color:#9edcff;

  width:17px;
  height:13px;

  display:flex;

  align-items:flex-start;

  justify-content:center;

  font-size:17px;

  line-height:13px;

  margin:0;
  padding:0;

  text-shadow:
    0 0 12px rgba(90,200,255,.7);

  flex-shrink:0;
}

.logo-text{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  line-height:1;
}

.logo-cn{

  display:block;

  height:13px;

  line-height:13px;

  color:rgba(225,246,255,.92);

  font-size:13px;

  letter-spacing:3px;

  white-space:nowrap;
}

.logo-en{

  display:block;

  margin-top:5px;

  color:rgba(157,204,239,.63);

  font-family:
    "Times New Roman",
    serif;

  font-size:8px;

  line-height:8px;

  letter-spacing:3px;

  white-space:nowrap;
}


/* =========================
   BACK
========================= */

.back{

  color:rgba(157,204,239,.63);

  text-decoration:none;

  font-family:
    "Cinzel",
    "Noto Serif SC",
    serif;

  font-size:11px;

  letter-spacing:1px;

  transition:
    color .3s ease,
    text-shadow .3s ease;
}

.back:hover{

  color:rgba(220,245,255,.95);

  text-shadow:
    0 0 10px
    rgba(100,200,245,.35);
}


/* =========================
   CONTENT
========================= */

.content{

  position:relative;

  z-index:5;

  width:min(1100px,100%);

  margin:0 auto;

  padding-top:145px;
}


/* =========================
   HEADING
========================= */

.heading{

  text-align:center;

  margin-bottom:48px;
}

.heading-small{

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:6px;

  color:rgba(137,201,239,.55);

  margin-bottom:12px;
}

.heading-main{

  font-family:"Cinzel",serif;

  font-size:clamp(34px,5vw,56px);

  font-weight:400;

  letter-spacing:8px;

  line-height:1;

  color:#dcecff;
}

.heading-cn{

  margin-top:14px;

  font-size:13px;

  letter-spacing:5px;

  color:rgba(170,210,230,.48);
}


/* =========================
   CHARACTER PANEL
========================= */

.character-panel{

  position:relative;

  display:grid;

  grid-template-columns:
    minmax(300px,430px)
    1fr;

  gap:55px;

  width:100%;

  padding:38px;

  border:
    1px solid
    rgba(111,174,224,.32);

  background:

    linear-gradient(
      145deg,
      rgba(38,91,137,.13),
      rgba(11,45,75,.10)
    );

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.15);
}


/* =========================
   CHARACTER IMAGE
========================= */

.character-image{

  position:relative;

  min-height:540px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:
    1px solid
    rgba(111,174,224,.25);

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(38,91,137,.14),
      transparent 58%
    ),

    rgba(6,20,38,.4);

  overflow:hidden;
}

.character-image::before{

  content:"";

  position:absolute;

  inset:18px;

  border:
    1px solid
    rgba(140,210,245,.07);

  pointer-events:none;
}

.character-image::after{

  content:"✦";

  position:absolute;

  right:24px;
  top:20px;

  color:rgba(145,215,250,.25);

  font-size:16px;

  text-shadow:
    0 0 10px
    rgba(90,190,240,.25);
}


/* =========================
   IMAGE PLACEHOLDER
========================= */

.image-placeholder{

  text-align:center;

  color:rgba(155,205,230,.35);

  font-family:"Cinzel",serif;

  letter-spacing:4px;

  font-size:10px;
}

.image-placeholder-symbol{

  display:block;

  margin-bottom:15px;

  font-family:
    "Times New Roman",
    serif;

  font-size:34px;

  color:rgba(130,205,240,.25);
}

.image-placeholder-cn{

  display:block;

  margin-top:10px;

  font-family:
    "Noto Serif SC",
    serif;

  font-size:10px;

  letter-spacing:3px;

  color:rgba(160,205,225,.28);
}


/* =========================
   CHARACTER INFO
========================= */

.character-info{

  display:flex;

  flex-direction:column;

  justify-content:center;
}


/* CHARACTER NUMBER */

.character-number{

  font-family:"Cinzel",serif;

  font-size:9px;

  letter-spacing:4px;

  color:rgba(120,195,235,.45);

  margin-bottom:22px;
}


/* CHARACTER NAME */

.character-name-en{

  font-family:"Cinzel",serif;

  font-size:clamp(32px,4vw,52px);

  font-weight:400;

  letter-spacing:5px;

  line-height:1;

  color:rgba(225,245,255,.92);
}

.character-name-cn{

  margin-top:13px;

  font-size:18px;

  letter-spacing:7px;

  color:rgba(195,230,245,.7);
}

.character-role{

  margin-top:18px;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:4px;

  color:rgba(130,200,235,.55);
}


/* =========================
   DIVIDER
========================= */

.divider{

  width:100%;

  height:1px;

  margin:30px 0;

  background:

    linear-gradient(
      90deg,
      rgba(120,195,235,.3),
      rgba(120,195,235,.06),
      transparent
    );
}


/* =========================
   BASIC INFO
========================= */

.basic-info{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:22px 35px;
}

.info-item{

  display:flex;

  flex-direction:column;

  gap:7px;
}

.info-label{

  font-family:"Cinzel",serif;

  font-size:8px;

  letter-spacing:3px;

  color:rgba(125,190,220,.42);
}

.info-value{

  font-size:12px;

  letter-spacing:2px;

  color:rgba(205,232,244,.68);

  min-height:14px;
}


/* =========================
   PROFILE
========================= */

.description-title{

  font-family:"Cinzel",serif;

  font-size:9px;

  letter-spacing:4px;

  color:rgba(130,200,235,.5);

  margin-bottom:13px;
}

.description{

  font-size:13px;

  line-height:2;

  letter-spacing:1px;

  color:rgba(190,220,235,.58);

  min-height:20px;
}


/* =========================
   ARCHIVE MARK
========================= */

.archive-mark{

  position:absolute;

  right:25px;
  bottom:20px;

  font-family:"Cinzel",serif;

  font-size:8px;

  letter-spacing:3px;

  color:rgba(137,201,239,.28);
}


/* =========================
   TABLET
========================= */

@media(max-width:800px){

  .header{

    left:35px;
    right:35px;
    top:30px;
  }

  .character-panel{

    grid-template-columns:1fr;

    gap:40px;

    padding:30px;
  }

  .character-image{

    min-height:500px;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .page{

    padding:
      22px
      20px
      55px;
  }

  .header{

    left:25px;
    right:25px;
    top:24px;

    width:auto;
    max-width:none;

    margin:0;
    padding:0;

    align-items:flex-start;
  }

  .frame{

    top:14px;
    left:14px;
    right:14px;
    bottom:14px;
  }


  /* logo */

  .logo{

    align-items:flex-start;

    gap:10px;
  }

  .logo-symbol{

    width:15px;
    height:11px;

    font-size:15px;

    line-height:11px;

    margin-top:2px;
  }

  .logo-cn{

    height:11px;

    line-height:11px;

    font-size:11px;

    letter-spacing:2px;
  }

  .logo-en{

    margin-top:4px;

    font-size:7px;

    line-height:7px;

    letter-spacing:2px;
  }

  .back{

    font-size:10px;
  }


  /* content */

  .content{

    padding-top:120px;
  }

  .heading{

    margin-bottom:30px;
  }

  .heading-small{

    font-size:8px;

    letter-spacing:4px;
  }

  .heading-main{

    font-size:30px;

    letter-spacing:5px;
  }

  .heading-cn{

    font-size:10px;

    letter-spacing:3px;
  }


  /* panel */

  .character-panel{

    padding:20px;

    gap:30px;
  }

  .character-image{

    min-height:430px;
  }

  .character-image::before{

    inset:12px;
  }


  /* name */

  .character-name-en{

    font-size:32px;

    letter-spacing:4px;
  }

  .character-name-cn{

    font-size:15px;

    letter-spacing:5px;
  }


  /* info */

  .basic-info{

    grid-template-columns:1fr;

    gap:17px;
  }

  .description{

    font-size:12px;

    line-height:1.9;
  }


  /* magic circle */

  .magic-circle{

    width:125vw;

    height:125vw;
  }


  /* archive mark */

  .archive-mark{

    position:relative;

    right:auto;
    bottom:auto;

    margin-top:24px;

    text-align:right;

    font-size:7px;

    letter-spacing:2px;

    line-height:1.4;

    white-space:nowrap;
  }
}


/* =========================
   VERY SMALL
========================= */

@media(max-width:360px){

  .header{

    left:20px;
    right:20px;
    top:24px;
  }

  .heading-main{

    font-size:27px;
  }
}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  .stars span{

    animation:none;
  }
}

</style>
</head>
