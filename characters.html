<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 角色档案</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    background:#061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================
   主体
========================= */

.page{

    min-height:100vh;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        120px
        60px
        100px;
}


/* =========================
   外框
========================= */

.frame{

    width:min(1200px, 100%);

    min-height:720px;

    position:relative;

    border:
        1px solid
        rgba(180,215,255,.32);

    padding:70px;

    background:
        rgba(4,16,32,.42);

    box-shadow:
        inset 0 0 80px
        rgba(30,100,180,.05);

}


/* =========================
   四角装饰
========================= */

.corner{

    position:absolute;

    width:36px;

    height:36px;

    color:#dcecff;

    font-size:18px;

    opacity:.7;

}

.corner::before{

    content:"✡";

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

}

.corner.tl{

    top:-18px;
    left:-18px;

}

.corner.tr{

    top:-18px;
    right:-18px;

}

.corner.bl{

    bottom:-18px;
    left:-18px;

}

.corner.br{

    bottom:-18px;
    right:-18px;

}


/* =========================
   左上角 Logo
========================= */

.site-logo{

    position:fixed;

    left:58px;

    top:38px;

    z-index:20;

    color:#dcecff;

    text-decoration:none;

    line-height:1.35;

}

.site-logo .cn{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:16px;

    letter-spacing:3px;

    font-weight:400;

}

.site-logo .en{

    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:.7;

}


/* =========================
   右上角
========================= */

.top-right{

    position:fixed;

    right:58px;

    top:38px;

    z-index:20;

    display:flex;

    align-items:center;

    gap:22px;

}

.back-link{

    color:#dcecff;

    text-decoration:none;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    opacity:.72;

    transition:.3s;

}

.back-link:hover{

    opacity:1;

}


/* =========================
   日夜模式
========================= */

.theme-toggle{

    width:38px;

    height:20px;

    border:
        1px solid
        rgba(190,220,255,.35);

    border-radius:20px;

    position:relative;

    cursor:pointer;

    background:
        rgba(255,255,255,.03);

}

.theme-toggle::before{

    content:"";

    position:absolute;

    width:12px;

    height:12px;

    border-radius:50%;

    left:3px;

    top:3px;

    background:#dcecff;

    transition:.35s;

}

body.day .theme-toggle::before{

    transform:
        translateX(18px);

}


/* =========================
   标题
========================= */

.archive-label{

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:11px;

    letter-spacing:5px;

    opacity:.55;

    margin-bottom:16px;

}

.main-title{

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:
        clamp(30px,5vw,54px);

    font-weight:300;

    letter-spacing:7px;

    margin-bottom:55px;

}

.main-title .cn{

    display:block;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:
        clamp(18px,2.5vw,25px);

    letter-spacing:8px;

    margin-top:13px;

    opacity:.85;

}


/* =========================
   角色主体
========================= */

.character-panel{

    display:grid;

    grid-template-columns:
        minmax(300px, .85fr)
        minmax(320px, 1fr);

    gap:75px;

    align-items:center;

}


/* =========================
   立绘区域
========================= */

.character-image-wrap{

    position:relative;

    min-height:500px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.character-image-wrap::before{

    content:"";

    position:absolute;

    width:390px;

    height:390px;

    max-width:80vw;

    max-height:80vw;

    border:
        1px solid
        rgba(170,215,255,.22);

    border-radius:50%;

}

.character-image-wrap::after{

    content:"";

    position:absolute;

    width:300px;

    height:300px;

    max-width:65vw;

    max-height:65vw;

    border:
        1px solid
        rgba(170,215,255,.13);

    border-radius:50%;

}


.character-image{

    position:relative;

    z-index:3;

    max-width:100%;

    max-height:500px;

    object-fit:contain;

    display:none;

}


/* =========================
   魔法阵
========================= */

.magic-circle{

    position:absolute;

    width:430px;

    height:430px;

    max-width:90vw;

    max-height:90vw;

    border:
        1px solid
        rgba(150,205,255,.15);

    border-radius:50%;

    z-index:1;

}

.magic-circle::before{

    content:"";

    position:absolute;

    width:78%;

    height:78%;

    left:11%;

    top:11%;

    border:
        1px solid
        rgba(150,205,255,.11);

    border-radius:50%;

}

.magic-circle::after{

    content:"✦";

    position:absolute;

    left:50%;

    top:-9px;

    transform:
        translateX(-50%);

    font-size:13px;

    color:#dcecff;

    opacity:.65;

}


/* =========================
   立绘占位
========================= */

.image-placeholder{

    position:relative;

    z-index:2;

    width:230px;

    height:320px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        rgba(180,215,255,.2);

    color:
        rgba(220,236,255,.35);

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    text-align:center;

}


/* =========================
   角色信息
========================= */

.character-info{

    position:relative;

    z-index:5;

}

.character-number{

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:4px;

    opacity:.45;

    margin-bottom:18px;

}

.character-name{

    font-family:"Cinzel",serif;

    font-weight:300;

    font-size:
        clamp(30px,4vw,48px);

    letter-spacing:3px;

    line-height:1.15;

}

.character-name .cn-name{

    display:block;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:
        clamp(18px,2.4vw,25px);

    letter-spacing:5px;

    margin-top:12px;

    opacity:.8;

}

.info-line{

    width:100%;

    height:1px;

    background:
        rgba(180,215,255,.18);

    margin:
        30px 0;

}

.meta-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        20px 30px;

    margin-bottom:36px;

}

.meta-item{

    min-width:0;

}

.meta-label{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:2px;

    opacity:.42;

    margin-bottom:7px;

}

.meta-value{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;

    letter-spacing:2px;

    min-height:20px;

}

.profile-title{

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:4px;

    opacity:.55;

    margin-bottom:14px;

}

.profile{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;

    line-height:2;

    letter-spacing:1.5px;

    opacity:.78;

    white-space:pre-line;

    min-height:70px;

}


/* =========================
   档案标记
========================= */

.archive-mark{

    margin-top:35px;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.35;

}


/* =========================
   翻页
========================= */

.character-navigation{

    margin-top:70px;

    padding-top:30px;

    border-top:
        1px solid
        rgba(180,215,255,.15);

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:30px;

}

.nav-button{

    color:#dcecff;

    text-decoration:none;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:.65;

    transition:
        opacity .3s ease,
        transform .3s ease;

    display:inline-flex;

    align-items:center;

    gap:14px;

}

.nav-button:hover{

    opacity:1;

}

.nav-prev{

    justify-self:start;

}

.nav-next{

    justify-self:end;

}

.nav-arrow{

    font-size:18px;

    line-height:1;

}

.nav-current{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.38;

    white-space:nowrap;

}


/* =========================
   星点
========================= */

.star{

    position:fixed;

    color:#dcecff;

    pointer-events:none;

    opacity:.35;

    font-size:10px;

}

.star.s1{

    left:12%;

    top:25%;

}

.star.s2{

    right:15%;

    top:22%;

}

.star.s3{

    left:20%;

    bottom:20%;

}

.star.s4{

    right:11%;

    bottom:26%;

}

.star.s5{

    left:7%;

    top:58%;

}

.star.s6{

    right:7%;

    top:67%;

}


/* =========================
   日间模式
   只改变明亮区域
========================= */

body.day{

body.day .frame{

body.day .theme-toggle::before{

}

body.day .character-image-wrap::before{

    border-color:
        rgba(50,90,130,.18);

}

body.day .character-image-wrap::after{

    border-color:
        rgba(50,90,130,.12);

}

body.day .magic-circle{

    border-color:
        rgba(50,90,130,.14);

}

body.day .magic-circle::before{

    border-color:
        rgba(50,90,130,.1);

}

body.day .info-line,
body.day .character-navigation{

    border-color:
        rgba(50,80,110,.16);

}

body.day .image-placeholder{

    border-color:
        rgba(50,80,110,.2);

    color:
        rgba(30,55,80,.38);

}

body.day .star{

    color:#18283b;

}

/* =========================

@media(max-width:430px){

        gap:
            18px

    }

/* =========================
   防止隐藏元素占位
========================= */

[hidden]{

    display:none !important;

}

</style>

<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   页面元素
===================================================== */

const characterNumber =
    document.getElementById(
        "characterNumber"
    );

const characterName =
    document.getElementById(
        "characterName"
    );

const characterRace =
    document.getElementById(
        "characterRace"
    );

const characterRegion =
    document.getElementById(
        "characterRegion"
    );

const characterAge =
    document.getElementById(
        "characterAge"
    );

const characterGender =
    document.getElementById(
        "characterGender"
    );

const characterStatus =
    document.getElementById(
        "characterStatus"
    );

const characterRole =
    document.getElementById(
        "characterRole"
    );

const characterProfile =
    document.getElementById(
        "characterProfile"
    );

const archiveMark =
    document.getElementById(
        "archiveMark"
    );

const characterImage =
    document.getElementById(
        "characterImage"
    );

const imagePlaceholder =
    document.getElementById(
        "imagePlaceholder"
    );

const prevCharacter =
    document.getElementById(
        "prevCharacter"
    );

const nextCharacter =
    document.getElementById(
        "nextCharacter"
    );

const navCurrent =
    document.getElementById(
        "navCurrent"
    );


/* =====================================================
   获取 URL 中的角色 ID
===================================================== */

function getCharacterId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =====================================================
   名字处理
   例如：
   Evelina•Nieve 伊莉娜·妳芙

   自动分成：

   Evelina•Nieve
   伊莉娜·妳芙
===================================================== */

function splitCharacterName(fullName){

    if(!fullName){

        return {
            english:"CHARACTER",
            chinese:"角色"
        };

    }


    const text =
        String(fullName).trim();


    const chineseMatch =
        text.match(
            /[\u3400-\u9FFF]/
        );


    if(!chineseMatch){

        return {
            english:text,
            chinese:""
        };

    }


    const index =
        chineseMatch.index;


    return {

        english:
            text
                .slice(0,index)
                .trim(),

        chinese:
            text
                .slice(index)
                .trim()

    };

}


/* =====================================================
   显示角色
===================================================== */

function renderCharacter(
    character,
    currentIndex,
    totalCount
){

    if(!character){

        return;

    }


    /* -------------------------
       编号
    ------------------------- */

    const displayNumber =
        String(
            currentIndex + 1
        ).padStart(3,"0");


    characterNumber.textContent =
        "CHARACTER · " +
        displayNumber;


    navCurrent.textContent =
        "CHARACTER · " +
        displayNumber;


    /* -------------------------
       名字
    ------------------------- */

    const names =
        splitCharacterName(
            character.name
        );


    characterName.innerHTML = `

        <span class="en-name">
            ${escapeHTML(names.english)}
        </span>

        <span class="cn-name">
            ${escapeHTML(names.chinese)}
        </span>

    `;


    /* -------------------------
       基础资料
    ------------------------- */

    characterRace.textContent =
        character.race || "—";

    characterRegion.textContent =
        character.region || "—";

    characterAge.textContent =
        character.age !== null &&
        character.age !== undefined &&
        character.age !== ""
            ? character.age
            : "—";

    characterGender.textContent =
        character.gender || "—";

    characterRole.textContent =
        character.role || "—";


    /*
       STATUS

       当前数据库没有 status 字段，
       所以这里暂时使用固定档案状态。
    */

    characterStatus.textContent =
        "ARCHIVED";


    /* -------------------------
       PROFILE
    ------------------------- */

    const profileParts = [];


    if(character.personality){

        profileParts.push(
            "性格：" +
            character.personality
        );

    }


    if(character.backstory){

        profileParts.push(
            character.backstory
        );

    }


    if(profileParts.length){

        characterProfile.textContent =
            profileParts.join("\n\n");

    }else{

        characterProfile.textContent =
            "暂无档案记录。";

    }


    /* -------------------------
       Archive Mark
    ------------------------- */

    archiveMark.textContent =
        "SEYAMI ARCHIVE · " +
        displayNumber;


    /* -------------------------
       图片
    ------------------------- */

    characterImage.style.display =
        "none";

    imagePlaceholder.style.display =
        "flex";

    characterImage.removeAttribute(
        "src"
    );


    if(character.image_url){

        characterImage.onload =
            function(){

                imagePlaceholder.style.display =
                    "none";

                characterImage.style.display =
                    "block";

            };


        characterImage.onerror =
            function(){

                characterImage.style.display =
                    "none";

                imagePlaceholder.style.display =
                    "flex";

                console.error(
                    "角色立绘加载失败：",
                    character.image_url
                );

            };


        characterImage.src =
            character.image_url;

    }


    /* -------------------------
       上一个
    ------------------------- */

    if(currentIndex > 0){

        const previousCharacter =
            window.allCharacters[
                currentIndex - 1
            ];

        prevCharacter.href =
            "characters.html?id=" +
            encodeURIComponent(
                previousCharacter.id
            );

        prevCharacter.style.visibility =
            "visible";

    }else{

        prevCharacter.removeAttribute(
            "href"
        );

        prevCharacter.style.visibility =
            "hidden";

    }


    /* -------------------------
       下一个
    ------------------------- */

    if(
        currentIndex <
        totalCount - 1
    ){

        const nextCharacterData =
            window.allCharacters[
                currentIndex + 1
            ];

        nextCharacter.href =
            "characters.html?id=" +
            encodeURIComponent(
                nextCharacterData.id
            );

        nextCharacter.style.visibility =
            "visible";

    }else{

        nextCharacter.removeAttribute(
            "href"
        );

        nextCharacter.style.visibility =
            "hidden";

    }

}


/* =====================================================
   防止角色名称里的特殊字符破坏 HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   读取角色
===================================================== */

async function loadCharacters(){

    try{

        /*
         * 读取所有角色
         *
         * 按 id 从小到大排列
         *
         * 以后新增角色，
         * 会自动进入翻页系统。
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("characters")
                .select(`
                    id,
                    created_at,
                    name,
                    race,
                    role,
                    age,
                    gender,
                    region,
                    personality,
                    backstory,
                    image_url
                `)
                .order(
                    "id",
                    {
                        ascending:true
                    }
                );


        if(error){

            console.error(
                "读取角色失败：",
                error
            );

            characterProfile.textContent =
                "无法读取角色档案。";

            return;

        }


        if(
            !data ||
            data.length === 0
        ){

            characterNumber.textContent =
                "CHARACTER · 000";

            characterName.innerHTML = `

                <span class="en-name">
                    NO RECORD
                </span>

                <span class="cn-name">
                    暂无角色档案
                </span>

            `;

            characterProfile.textContent =
                "当前档案馆中暂无角色记录。";

            characterImage.style.display =
                "none";

            imagePlaceholder.style.display =
                "flex";

            prevCharacter.style.visibility =
                "hidden";

            nextCharacter.style.visibility =
                "hidden";

            navCurrent.textContent =
                "NO RECORD";

            return;

        }


        /*
         * 保存全部角色
         * 翻页时直接使用
         */

        window.allCharacters =
            data;


        const urlCharacterId =
            getCharacterId();


        let currentIndex = 0;


        /*
         * 如果 URL 有 id，
         * 找到对应角色
         */

        if(urlCharacterId){

            const foundIndex =
                data.findIndex(
                    character =>
                        String(character.id) ===
                        String(urlCharacterId)
                );


            if(foundIndex !== -1){

                currentIndex =
                    foundIndex;

            }

        }


        renderCharacter(
            data[currentIndex],
            currentIndex,
            data.length
        );


        console.log(
            "角色总数：",
            data.length
        );

        console.log(
            "当前角色：",
            data[currentIndex]
        );


    }catch(error){

        console.error(
            "角色页面发生错误：",
            error
        );

        characterProfile.textContent =
            "档案读取出现错误。";

    }

}


/* =====================================================
   翻页点击
===================================================== */

prevCharacter.addEventListener(
    "click",
    function(event){

        if(
            !this.href ||
            this.style.visibility ===
            "hidden"
        ){

            event.preventDefault();

        }

    }
);


nextCharacter.addEventListener(
    "click",
    function(event){

        if(
            !this.href ||
            this.style.visibility ===
            "hidden"
        ){

            event.preventDefault();

        }

    }
);


/* =====================================================
   日夜模式
===================================================== */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

    }else{

        document.body.classList.remove(
            "day"
        );

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


if(savedTheme){

    applyTheme(savedTheme);

}else{

    applyTheme("night");

}


themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day"
            );

        const newTheme =
            isDay
                ? "night"
                : "day";

        applyTheme(newTheme);

        localStorage.setItem(
            "seyami-theme",
            newTheme
        );

    }
);


/* =====================================================
   开始读取
===================================================== */

loadCharacters();

</script>
