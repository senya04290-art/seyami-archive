
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案管理 · Seyami Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{visibility:hidden;background:radial-gradient(circle at 50% 30%,rgba(20,55,95,.16),transparent 45%),#061426;color:#dbe8f5;font-family:"Noto Serif SC",serif;transition:background .5s,color .5s}
body.auth-ready{visibility:visible}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(190,220,245,.65);opacity:.5}
.page{position:relative;min-height:100vh;padding:38px 58px 70px;z-index:1}
.header{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:20px}
.logo{display:flex;flex-direction:column;gap:4px}
.logo-cn{font-size:16px;letter-spacing:.16em;font-weight:400}
.logo-en{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.3em;opacity:.55}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.back,.logout-button{color:inherit;text-decoration:none;font-family:"Cinzel",serif;font-size:10px;letter-spacing:.16em;opacity:.7;transition:opacity .3s;background:transparent;border:0;cursor:pointer}
.back:hover,.logout-button:hover{opacity:1}
.logout-button{border:1px solid rgba(190,215,240,.25);padding:10px 12px}
.theme-toggle{width:38px;height:38px;border:1px solid rgba(190,215,240,.25);background:transparent;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.theme-toggle:hover{background:rgba(180,210,240,.06);border-color:rgba(190,215,240,.45)}
.title-area{text-align:center;margin:70px 0 55px}
.title-en{font-family:"Cinzel",serif;font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.22em;margin-left:.22em;line-height:1.2}
.title-sub{margin-top:12px;font-family:"Cinzel",serif;font-size:10px;letter-spacing:.42em;opacity:.45;margin-left:.42em}
.title-cn{margin-top:18px;font-size:14px;letter-spacing:.25em;opacity:.65}
.management-switch{width:min(900px,100%);margin:0 auto 28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.management-button{min-width:0;height:42px;border:1px solid rgba(180,210,240,.2);background:rgba(4,17,32,.35);color:inherit;cursor:pointer;font-family:"Cinzel","Noto Serif SC",serif;font-size:9px;letter-spacing:.12em;transition:background .3s,border-color .3s}
.management-button:hover{border-color:rgba(180,210,240,.45);background:rgba(180,210,240,.05)}
.management-button.active{border-color:rgba(190,220,245,.5);background:rgba(30,65,95,.45)}
.admin-container{width:min(820px,100%);margin:0 auto;border:1px solid rgba(180,210,240,.18);background:rgba(4,17,32,.42);padding:42px;position:relative}
.admin-container:before,.admin-container:after{content:"";position:absolute;width:18px;height:18px;border-color:rgba(180,210,240,.45);pointer-events:none}
.admin-container:before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.admin-container:after{right:-1px;bottom:-1px;border-right:1px solid;border-bottom:1px solid}
.section-title{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.3em;margin-bottom:30px;opacity:.8}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 28px}
.field{display:flex;flex-direction:column;gap:9px}
.field.full{grid-column:1/-1}
label{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.2em;opacity:.6}
input,select,textarea{width:100%;border:1px solid rgba(180,210,240,.2);outline:none;background:rgba(3,15,29,.75);color:#dbe8f5;padding:0 14px;font-family:"Noto Serif SC",serif;font-size:13px;transition:border-color .3s,background .3s}
input,select{height:46px}
textarea{min-height:140px;padding:14px;resize:vertical;line-height:1.8}
input:focus,select:focus,textarea:focus{border-color:rgba(180,210,240,.55);background:rgba(5,20,38,.9)}
input::placeholder,textarea::placeholder{color:rgba(210,225,240,.35)}
.upload-box,.gallery-upload-box{width:100%;min-height:220px;border:1px dashed rgba(180,210,240,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;cursor:pointer;transition:border-color .3s,background .3s}
.upload-box:hover,.gallery-upload-box:hover{border-color:rgba(180,210,240,.55);background:rgba(180,210,240,.025)}
.gallery-upload-box{min-height:360px}
.upload-box input[type=file],.gallery-upload-box input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;z-index:2}
.upload-placeholder,.gallery-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;text-align:center}
.upload-symbol,.gallery-symbol{font-size:28px;opacity:.55;font-family:serif}
.upload-text,.gallery-upload-text{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.22em;opacity:.65}
.upload-hint,.gallery-upload-hint{font-size:10px;opacity:.4}
.preview,.gallery-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:15px;display:none;pointer-events:none}
.save-area{margin-top:38px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.save-button{min-width:230px;height:48px;border:1px solid rgba(190,220,245,.4);background:rgba(10,32,55,.5);color:#dbe8f5;font-family:"Cinzel",serif;font-size:10px;letter-spacing:.3em;cursor:pointer;transition:background .3s,border-color .3s,transform .2s}
.save-button:hover{background:rgba(30,65,95,.5);border-color:rgba(210,230,245,.65)}
.save-button:active{transform:scale(.98)}
.save-button:disabled{opacity:.45;cursor:wait}
.secondary-button{min-width:130px;height:48px;border:1px solid rgba(190,220,245,.22);background:transparent;color:inherit;font-family:"Noto Serif SC",serif;font-size:12px;cursor:pointer}
.secondary-button:hover{background:rgba(180,210,240,.06)}
.message{text-align:center;margin-top:22px;min-height:20px;font-size:12px;letter-spacing:.06em;opacity:.85;overflow-wrap:anywhere}
.message.success{color:#b8d8c8}
.message.error{color:#e0b8b8}

/* 新增：已有国家档案列表 */
.country-records{margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid rgba(180,210,240,.16)}
.country-records-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.country-records-title{font-family:"Cinzel","Noto Serif SC",serif;font-size:12px;letter-spacing:.18em;opacity:.85}
.country-records-hint{font-size:11px;opacity:.5;line-height:1.8}
.country-records-list{display:flex;flex-direction:column;gap:10px}
.country-record-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px;border:1px solid rgba(180,210,240,.15);background:rgba(5,20,38,.28)}
.country-record-item.editing{border-color:rgba(190,220,245,.6);background:rgba(30,65,95,.25)}
.country-record-info{min-width:0;flex:1}
.country-record-name{font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.country-record-subtitle{font-size:11px;opacity:.5;margin-top:3px;overflow-wrap:anywhere}
.country-record-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.country-edit-button{border:1px solid rgba(190,220,245,.35);background:rgba(10,32,55,.35);color:inherit;padding:9px 13px;font-family:"Noto Serif SC",serif;font-size:11px;cursor:pointer;white-space:nowrap}
.country-edit-button:hover{background:rgba(30,65,95,.5);border-color:rgba(210,230,245,.6)}
.country-record-empty{padding:18px 12px;text-align:center;border:1px dashed rgba(180,210,240,.18);font-size:12px;line-height:2;opacity:.6}
.country-list-refresh{border:0;background:transparent;color:inherit;font-family:"Noto Serif SC",serif;font-size:11px;text-decoration:underline;text-underline-offset:4px;opacity:.65;cursor:pointer}
.country-list-refresh:hover{opacity:1}
.footer{text-align:center;margin-top:55px;font-family:"Cinzel",serif;font-size:8px;letter-spacing:.35em;opacity:.25}
body.day-mode{background:radial-gradient(circle at 50% 30%,rgba(210,225,238,.35),transparent 50%),#e9eef3;color:#24384c}
body.day-mode .admin-container{background:rgba(255,255,255,.52);border-color:rgba(40,70,100,.18)}
body.day-mode .management-button{background:rgba(255,255,255,.35);border-color:rgba(40,70,100,.2)}
body.day-mode .management-button.active{background:rgba(255,255,255,.65);border-color:rgba(40,70,100,.4)}
body.day-mode input,body.day-mode select,body.day-mode textarea{background:rgba(255,255,255,.65);color:#24384c;border-color:rgba(40,70,100,.2)}
body.day-mode input:focus,body.day-mode select:focus,body.day-mode textarea:focus{background:rgba(255,255,255,.9);border-color:rgba(40,70,100,.45)}
body.day-mode .upload-box,body.day-mode .gallery-upload-box{border-color:rgba(40,70,100,.25)}
body.day-mode .save-button{color:#24384c;background:rgba(255,255,255,.5);border-color:rgba(40,70,100,.35)}
body.day-mode .theme-toggle,body.day-mode .logout-button{border-color:rgba(40,70,100,.25)}
body.day-mode .country-records{border-bottom-color:rgba(40,70,100,.18)}
body.day-mode .country-record-item{background:rgba(255,255,255,.35);border-color:rgba(40,70,100,.18)}
body.day-mode .country-record-item.editing{background:rgba(210,225,238,.45);border-color:rgba(40,70,100,.45)}
body.day-mode .country-edit-button{background:rgba(255,255,255,.5);border-color:rgba(40,70,100,.3);color:#24384c}
body.day-mode .secondary-button{border-color:rgba(40,70,100,.3)}

@media(max-width:700px){
.page{padding:25px 20px 50px}
.header{align-items:center}
.logo-cn{font-size:13px}
.logo-en{font-size:7px}
.header-right{gap:9px}

.logout-button{padding:8px 7px}
.theme-toggle{width:34px;height:34px}
.title-area{margin-top:55px;margin-bottom:40px}
.title-en{font-size:29px;letter-spacing:.14em;margin-left:.14em}
.title-sub{font-size:8px;letter-spacing:.3em;margin-left:.3em}
.title-cn{font-size:12px}
.management-switch{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:20px}
.management-button{height:40px;font-size:8px;letter-spacing:.08em}
.admin-container{padding:28px 20px}
.form-grid{grid-template-columns:1fr;gap:22px}
.field.full{grid-column:auto}
.upload-box{min-height:200px}
.gallery-upload-box{min-height:300px}
.save-button{width:100%;min-width:0}
.secondary-button{width:100%}
textarea{min-height:160px}

.country-record-name{font-size:12px}

.country-edit-button{padding:8px 10px;font-size:10px}
.country-records-title{font-size:11px}
}
</style>
</head>

<div class="page">
<header class="header">
<div class="logo">
<div class="logo-cn">塞垭弥大陆档案馆</div>
<div class="logo-en">SEYAMI ARCHIVE</div>
</div>

<main class="admin-container">

<div class="country-records-heading">
<div>

<div class="section-title" id="sectionTitle">CREATE CHARACTER RECORD</div>

<form id="characterForm">
<div class="form-grid">

<div class="field full character-field">
<label for="name">CHARACTER NAME · 角色名称</label>
<input id="name" type="text" placeholder="例如：Evelina · 伊莉娜" required>
</div>
<div class="field character-field">
<label for="race">RACE · 种族</label>
<input id="race" type="text" placeholder="例如：雪山神">
</div>
<div class="field character-field">
<label for="region">REGION · 地区</label>
<input id="region" type="text" placeholder="例如：雪山">
</div>
<div class="field character-field">
<label for="role">ROLE · 身份</label>
<input id="role" type="text" placeholder="例如：雪山女神">
</div>
<div class="field character-field">
<label for="age">AGE · 年龄</label>
<input id="age" type="number" min="0" placeholder="例如：1000">
</div>
<div class="field full character-field">
<label for="gender">GENDER · 性别</label>
<select id="gender">
<option value="">请选择</option>
<option value="女性">女性</option>
<option value="男性">男性</option>
<option value="其他">其他</option>
</select>
</div>
<div class="field full character-field">
<label for="personality">PERSONALITY · 性格</label>
<textarea id="personality" placeholder="填写角色的性格特点、习惯、喜好、待人方式等……"></textarea>
</div>
<div class="field full character-field">
<label for="backstory">BACKSTORY · 人物背景</label>
<textarea id="backstory" placeholder="填写角色的出身、成长经历、重要事件、人物关系与故事背景等……"></textarea>
</div>
<div class="field full character-field">
<label>CHARACTER ARTWORK · 角色立绘</label>
<div class="upload-box">
<input id="image" type="file" accept="image/png,image/jpeg,image/webp">
<div class="upload-placeholder" id="uploadPlaceholder">
<div class="upload-symbol">✦</div><div class="upload-text">SELECT ARTWORK</div><div class="upload-hint">PNG / JPG / WEBP</div>
</div>
<img id="preview" class="preview" alt="角色立绘预览">
</div>
</div>

<div class="field full country-field" style="display:none">
<label for="countryName">COUNTRY NAME · 国家名称</label>
<input id="countryName" type="text" placeholder="例如：雪境王国">
</div>
<div class="field full country-field" style="display:none">
<label for="countrySubtitle">SUBTITLE · 副标题 / 别名</label>
<input id="countrySubtitle" type="text" placeholder="例如：永冬之国">
</div>
<div class="field country-field" style="display:none">

<div class="field country-field" style="display:none">
<label for="countryGovernment">GOVERNMENT · 政体</label>

</div>
<div class="field full country-field" style="display:none">

<div class="field full country-field" style="display:none">

</div>
<div class="field full country-field" style="display:none">

</div>
<div class="field full country-field" style="display:none">
<label for="countryCulture">CULTURE · 国家文化</label>
<textarea id="countryCulture" placeholder="填写国家文化、传统、宗教、节日、风俗等……"></textarea>
</div>

<div class="field history-field" style="display:none">
<label for="historyYear">YEAR · 年代</label>
<input id="historyYear" type="text" placeholder="例如：公元 1200 年">
</div>
<div class="field history-field" style="display:none">
<label for="historyEra">ERA · 时期</label>
<input id="historyEra" type="text" placeholder="例如：白银时代">
</div>
<div class="field full history-field" style="display:none">
<label for="historyTitle">TITLE · 事件名称</label>

</div>
<div class="field full history-field" style="display:none">
<label for="historyLocation">LOCATION · 地点</label>
<input id="historyLocation" type="text" placeholder="例如：北境雪山 · 伊尔希亚">
</div>
<div class="field full history-field" style="display:none">
<label for="historyDescription">DESCRIPTION · 事件简介</label>
<textarea id="historyDescription" placeholder="用一小段文字介绍这个历史事件……"></textarea>
</div>
<div class="field full history-field" style="display:none">
<label for="historyContent">CONTENT · HISTORICAL RECORD</label>
<textarea id="historyContent" placeholder="填写完整历史记录、事件经过、人物、影响等……"></textarea>
</div>

<div class="field full gallery-field" style="display:none">

</div>
<img id="galleryPreview" class="gallery-preview" alt="图集预览">
</div>
</div>

</div>

<div class="save-area">
<button class="save-button" id="saveButton" type="submit">SAVE CHARACTER</button>

</div>
<div class="message" id="message" role="status" aria-live="polite"></div>
</form>
</main>

<footer class="footer" id="footer">SEYAMI · CHARACTER ARCHIVE</footer>
</div>

<script>
"use strict";

const SUPABASE_URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";
const ADMIN_EMAIL = "1296457710@qq.com";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

let adminAuthorized = false;
let currentMode = "character";
let editHistoryId = null;
let editCountryId = null;
let countryRecords = [];

function goToLogin(){window.location.replace("login.html");}

async function verifyAdmin(){
  try{
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError||!sessionData.session){goToLogin();return false;}

    const {data:userData,error:userError}=await supabaseClient.auth.getUser();
    if(userError||!userData.user){
      await supabaseClient.auth.signOut();
      goToLogin();
      return false;
    }

    if((userData.user.email||"").trim().toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
      await supabaseClient.auth.signOut();
      goToLogin();
      return false;
    }

    adminAuthorized=true;
    document.body.classList.add("auth-ready");
    return true;
  }catch(error){
    console.error(error);
    goToLogin();
    return false;
  }
}

document.getElementById("logoutButton").addEventListener("click",async()=>{
  const b=document.getElementById("logoutButton");
  b.disabled=true;
  b.textContent="SIGNING OUT...";
  try{await supabaseClient.auth.signOut();}
  finally{adminAuthorized=false;goToLogin();}
});

supabaseClient.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"&&adminAuthorized){
    adminAuthorized=false;
    goToLogin();
  }
});

/* 图片预览 */
imageInput.addEventListener("change",()=>{
  const file=imageInput.files[0];
  if(!file){clearCharacterPreview();return;}
  if(!file.type.startsWith("image/")){
    showMessage("请选择有效的图片文件。","error");
    clearCharacterPreview();
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    preview.src=e.target.result;
    preview.style.display="block";
    uploadPlaceholder.style.display="none";
  };
  reader.readAsDataURL(file);
});

galleryImageInput.addEventListener("change",()=>{
  const file=galleryImageInput.files[0];
  if(!file){clearGalleryPreview();return;}
  if(!file.type.startsWith("image/")){
    showMessage("请选择有效的图片文件。","error");
    clearGalleryPreview();
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    galleryPreview.src=e.target.result;
    galleryPreview.style.display="block";
    galleryPlaceholder.style.display="none";
  };
  reader.readAsDataURL(file);
});

function makeFilePath(prefix,file){
  const ext=file.name.includes(".")?file.name.split(".").pop().toLowerCase():"";
  return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,10)+"."+
    (["png","jpg","jpeg","webp"].includes(ext)?ext:"png");
}

async function uploadPublicImage(bucket,path,file){
  const {error}=await supabaseClient.storage.from(bucket).upload(path,file,{
    cacheControl:"3600",
    upsert:false
  });
  if(error)throw error;
  return supabaseClient.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

function setSaving(text){
  saveButton.disabled=true;
  saveButton.textContent=text;
}

function finishSaving(text){
  saveButton.disabled=false;
  saveButton.textContent=text;
}

/* 角色档案：保留原有新增功能 */
async function saveCharacter(){
  const name=nameInput.value.trim();
  const race=raceInput.value.trim();
  const region=regionInput.value.trim();
  const role=roleInput.value.trim();
  const age=ageInput.value.trim();
  const gender=genderInput.value.trim();
  const personality=personalityInput.value.trim();
  const backstory=backstoryInput.value.trim();
  const imageFile=imageInput.files[0];

  if(!name){
    showMessage("请先填写角色名字。","error");
    return;
  }
  if(!imageFile){
    showMessage("请先选择角色立绘。","error");
    return;
  }
  if(!imageFile.type.startsWith("image/")){
    showMessage("请选择有效的图片文件。","error");
    return;
  }

  setSaving("UPLOADING...");
  try{
    showMessage("正在上传立绘……");
    const imageURL=await uploadPublicImage(
      "character-images",
      makeFilePath("character",imageFile),
      imageFile
    );

    showMessage("立绘上传完成，正在建立角色档案……");
    const {error}=await supabaseClient.from("characters").insert({
      name,
      race:race||null,
      role:role||null,
      age:age===""?null:Number(age),
      gender:gender||null,
      region:region||null,
      image_url:imageURL,
      personality:personality||null,
      backstory:backstory||null
    });

    if(error)throw error;

    showMessage("角色档案保存成功！","success");
    form.reset();
    clearCharacterPreview();
    finishSaving("SAVE CHARACTER");
  }catch(error){
    console.error("Character save error:",error);
    showMessage("保存失败："+(error.message||"未知错误"),"error");
    finishSaving("SAVE CHARACTER");
  }
}

/* 国家档案：读取已有记录 */
async function loadCountryRecords(){
  if(!adminAuthorized||currentMode!=="country")return;

  countryRecordsList.replaceChildren();
  const loading=document.createElement("div");
  loading.className="country-record-empty";
  loading.textContent="正在读取国家档案……";
  countryRecordsList.appendChild(loading);

  refreshCountriesButton.disabled=true;

  try{
    const {data,error}=await supabaseClient
      .from("countries")
      .select("id,name,subtitle,capital,government,region,description,history,culture")
      .order("name",{ascending:true});

    if(error)throw error;

    countryRecords=Array.isArray(data)?data:[];
    renderCountryRecords();
  }catch(error){
    console.error("读取国家档案失败：",error);
    countryRecordsList.replaceChildren();

    const empty=document.createElement("div");
    empty.className="country-record-empty";
    empty.textContent="国家列表读取失败："+(error.message||"未知错误");
    countryRecordsList.appendChild(empty);

    showMessage(
      "读取国家列表失败。请检查 countries 表的读取权限："+(error.message||"未知错误"),
      "error"
    );
  }finally{
    refreshCountriesButton.disabled=false;
  }
}

function renderCountryRecords(){
  countryRecordsList.replaceChildren();

  if(countryRecords.length===0){
    const empty=document.createElement("div");
    empty.className="country-record-empty";
    empty.textContent="目前还没有读取到国家档案。你可以在下方创建第一条记录。";
    countryRecordsList.appendChild(empty);
    return;
  }

  countryRecords.forEach(country=>{
    const item=document.createElement("div");
    item.className="country-record-item";
    if(editCountryId!==null&&String(country.id)===String(editCountryId)){
      item.classList.add("editing");
    }

    const info=document.createElement("div");
    info.className="country-record-info";

    const name=document.createElement("div");
    name.className="country-record-name";
    name.textContent=country.name||"未命名国家";

    const subtitle=document.createElement("div");
    subtitle.className="country-record-subtitle";
    const details=[country.subtitle,country.capital?("首都："+country.capital):""]
      .filter(Boolean);
    subtitle.textContent=details.join(" · ")||"尚未填写副标题或首都";

    info.append(name,subtitle);

    const actions=document.createElement("div");
    actions.className="country-record-actions";

    const editButton=document.createElement("button");
    editButton.type="button";
    editButton.className="country-edit-button";
    editButton.textContent=
      editCountryId!==null&&String(country.id)===String(editCountryId)
      ?"正在编辑":"编辑档案";

    editButton.addEventListener("click",()=>beginEditCountry(country.id));

    actions.appendChild(editButton);
    item.append(info,actions);
    countryRecordsList.appendChild(item);
  });
}

/* 点击编辑：将原有数据载入表单 */
function beginEditCountry(id){
  const country=countryRecords.find(item=>String(item.id)===String(id));

  if(!country){
    showMessage("没有找到这条国家档案，请刷新列表后重试。","error");
    return;
  }

  form.reset();
  clearCharacterPreview();
  clearGalleryPreview();

  editCountryId=country.id;

  countryNameInput.value=country.name||"";
  countrySubtitleInput.value=country.subtitle||"";
  countryCapitalInput.value=country.capital||"";
  countryGovernmentInput.value=country.government||"";
  countryRegionInput.value=country.region||"";
  countryDescriptionInput.value=country.description||"";
  countryHistoryInput.value=country.history||"";
  countryCultureInput.value=country.culture||"";

  showCountryMode();

  /* showCountryMode 会异步刷新列表；再次渲染可立即标记当前项目 */
  renderCountryRecords();

  titleEn.textContent="EDIT COUNTRY";
  titleCn.textContent="修改国家档案";
  sectionTitle.textContent="EDIT COUNTRY RECORD";
  saveButton.textContent="UPDATE COUNTRY";
  cancelCountryEditButton.style.display="inline-block";

  showMessage("已载入「"+(country.name||"未命名国家")+"」，修改后点击 UPDATE COUNTRY 保存。");
  $("countryName").focus();

  $("countryName").scrollIntoView({behavior:"smooth",block:"center"});
}

/* 国家档案：新增或更新 */
async function saveCountry(){
  const name=countryNameInput.value.trim();

  if(!name){
    showMessage("请先填写国家名称。","error");
    countryNameInput.focus();
    return;
  }

  const payload={
    name,
    subtitle:countrySubtitleInput.value.trim()||null,
    capital:countryCapitalInput.value.trim()||null,
    government:countryGovernmentInput.value.trim()||null,
    region:countryRegionInput.value.trim()||null,
    description:countryDescriptionInput.value.trim()||null,
    history:countryHistoryInput.value.trim()||null,
    culture:countryCultureInput.value.trim()||null
  };

  const isEditing=editCountryId!==null;
  const originalId=editCountryId;

  setSaving(isEditing?"UPDATING...":"SAVING...");
  showMessage(isEditing?"正在更新国家档案……":"正在建立国家档案……");

  try{
    let result;

    if(isEditing){
      /* 只更新当前选中的 id，不会新增重复国家 */
      result=await supabaseClient
        .from("countries")
        .update(payload)
        .eq("id",originalId)
        .select("id");

      if(result.error)throw result.error;

      if(!result.data||result.data.length===0){
        throw new Error("没有记录被更新。请检查管理员的更新权限及该国家的记录 ID。");
      }

      editCountryId=null;
      form.reset();

      showMessage("国家档案修改成功！","success");
      finishSaving("SAVE COUNTRY");
      cancelCountryEditButton.style.display="none";
      titleEn.textContent="COUNTRY";
      titleCn.textContent="国家设定管理";
      sectionTitle.textContent="CREATE COUNTRY RECORD";

      await loadCountryRecords();
    }else{
      result=await supabaseClient.from("countries").insert(payload);
      if(result.error)throw result.error;

      form.reset();
      showMessage("国家设定保存成功！","success");
      finishSaving("SAVE COUNTRY");

      await loadCountryRecords();
    }
  }catch(error){
    console.error("Country save/update error:",error);
    showMessage(
      (isEditing?"修改失败：":"保存失败：")+(error.message||"未知错误"),
      "error"
    );
    finishSaving(isEditing?"UPDATE COUNTRY":"SAVE COUNTRY");
  }
}

/* 历史档案：保留原有新增与修改功能 */
function getHistoryPayload(){
  return {
    year:historyYearInput.value.trim()||null,
    title:historyTitleInput.value.trim(),
    era:historyEraInput.value.trim()||null,
    location:historyLocationInput.value.trim()||null,
    description:historyDescriptionInput.value.trim()||null,
    content:historyContentInput.value.trim()||null
  };
}

async function createHistory(){
  const payload=getHistoryPayload();

  if(!payload.title){
    showMessage("请先填写事件名称。","error");
    return;
  }

  setSaving("SAVING...");
  showMessage("正在建立历史档案……");

  try{
    const {error}=await supabaseClient.from("history_records").insert(payload);
    if(error)throw error;

    showMessage("历史记录保存成功！","success");
    form.reset();
    finishSaving("SAVE HISTORY");
  }catch(error){
    console.error(error);
    showMessage("保存失败："+(error.message||"未知错误"),"error");
    finishSaving("SAVE HISTORY");
  }
}

async function updateHistory(){
  if(!editHistoryId){
    showMessage("没有找到需要修改的历史记录。","error");
    return;
  }

  const payload=getHistoryPayload();

  if(!payload.title){
    showMessage("请先填写事件名称。","error");
    return;
  }

  setSaving("UPDATING...");
  showMessage("正在更新历史记录……");

  try{
    const {error}=await supabaseClient
      .from("history_records")
      .update({...payload,updated_at:new Date().toISOString()})
      .eq("id",editHistoryId);

    if(error)throw error;

    showMessage("历史记录修改成功，正在返回……","success");
    setTimeout(()=>location.href="history.html",900);
  }catch(error){
    console.error(error);
    showMessage("修改失败："+(error.message||"未知错误"),"error");
    finishSaving("UPDATE HISTORY");
  }
}

/* 图集：保留原有上传功能 */
async function saveGalleryImage(){
  const file=galleryImageInput.files[0];

  if(!file){
    showMessage("请先选择一张图集图片。","error");
    return;
  }
  if(!file.type.startsWith("image/")){
    showMessage("请选择 PNG、JPG 或 WEBP 图片。","error");
    return;
  }

  setSaving("UPLOADING...");
  let path=null;

  try{
    path=makeFilePath("gallery",file);
    showMessage("正在上传图集图片……");

    const imageURL=await uploadPublicImage("gallery-images",path,file);
    showMessage("图片上传完成，正在建立图集记录……");

    const {error}=await supabaseClient
      .from("gallery_images")
      .insert({image_url:imageURL});

    if(error){
      const {error:removeError}=await supabaseClient
        .storage.from("gallery-images").remove([path]);
      if(removeError)console.error("清理未使用的图片失败：",removeError);
      throw error;
    }

    showMessage("图集图片上传成功！","success");
    clearGalleryPreview();
    finishSaving("UPLOAD IMAGE");
  }catch(error){
    console.error(error);
    showMessage("上传失败："+(error.message||"未知错误"),"error");
    finishSaving("UPLOAD IMAGE");
  }
}

form.addEventListener("submit",async event=>{
  event.preventDefault();

  if(!adminAuthorized){
    showMessage("管理员身份尚未验证，请重新登录。","error");
    goToLogin();
    return;
  }

  if(currentMode==="character")await saveCharacter();
  else if(currentMode==="country")await saveCountry();
  else if(currentMode==="history"){
    if(editHistoryId)await updateHistory();
    else await createHistory();
  }else if(currentMode==="gallery"){
    await saveGalleryImage();
  }
});

/* 根据 URL 读取待编辑的历史记录 */
async function loadHistoryForEdit(){
  if(urlType!=="history"||!urlId){
    showCharacterMode();
    return;
  }

  editHistoryId=urlId;
  showHistoryMode();
  setSaving("LOADING...");
  showMessage("正在读取历史记录……");

  try{
    const {data,error}=await supabaseClient
      .from("history_records")
      .select("id,year,title,era,location,description,content")
      .eq("id",urlId)
      .single();

    if(error)throw error;
    if(!data)throw new Error("没有找到这条历史记录。");

    historyYearInput.value=data.year||"";
    historyTitleInput.value=data.title||"";
    historyEraInput.value=data.era||"";
    historyLocationInput.value=data.location||"";
    historyDescriptionInput.value=data.description||"";
    historyContentInput.value=data.content||"";

    titleEn.textContent="EDIT HISTORY";
    titleCn.textContent="修改历史记录";
    sectionTitle.textContent="EDIT HISTORY RECORD";
    saveButton.textContent="UPDATE HISTORY";
    footer.textContent="SEYAMI · HISTORY ARCHIVE";
    saveButton.disabled=false;
    showMessage("历史记录已载入，可以修改。");
  }catch(error){
    console.error(error);
    showMessage("读取历史记录失败："+(error.message||"未知错误"),"error");
    saveButton.disabled=true;
  }
}

/* 日夜模式 */
function applyTheme(theme){
  const isDay=theme==="day";
  document.body.classList.toggle("day-mode",isDay);
  themeToggle.textContent=isDay?"☀":"☾";
}

try{
  applyTheme(localStorage.getItem("seyami-theme")||"night");
}catch{
  applyTheme("night");
}

themeToggle.addEventListener("click",()=>{
  const next=document.body.classList.contains("day-mode")?"night":"day";
  try{localStorage.setItem("seyami-theme",next);}catch{}
  applyTheme(next);
});

/* 初始化 */
(async function initAdmin(){
  const authorized=await verifyAdmin();
  if(!authorized)return;
  await loadHistoryForEdit();
})();
