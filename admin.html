<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(19, 51, 87, 0.20),
            transparent 48%

        #061426;

    color: #dce9f5;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x: hidden;

    transition:
        background 0.5s ease,
        color 0.5s ease;
}


/* =========================================================
   星点
========================================================= */

.stars {
    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(190, 220, 245, 0.65);

    opacity: 0.45;
}


/* =========================================================
   魔法星环
========================================================= */

.magic-circle {

    position: fixed;

    width: min(72vw, 760px);

    height: min(72vw, 760px);

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(140, 190, 230, 0.075);

    border-radius: 50%;

    pointer-events: none;

    z-index: 0;
}

.magic-circle::before {

    content: "";

    position: absolute;

    width: 82%;
    height: 82%;

    left: 9%;
    top: 9%;

    border:
        1px solid
        rgba(140, 190, 230, 0.055);

    border-radius: 50%;
}

.magic-circle::after {

    content: "";

    position: absolute;

    width: 61%;
    height: 61%;

    left: 19.5%;
    top: 19.5%;

    border:
        1px solid
        rgba(140, 190, 230, 0.045);

    border-radius: 50%;
}


/* =========================================================
   页面框架
========================================================= */

.page {

    min-height: 100vh;

/* =========================================================
   顶部
========================================================= */

.theme-toggle {

/* =========================================================
   标题
========================================================= */

.title-small {

    letter-spacing:

}

.title-main {

        "Cinzel",

/* =========================================================
   角色区域
========================================================= */

.character-panel {

    width:

    display: grid;

    grid-template-columns:
        minmax(300px, 0.95fr)

    gap: 55px;

    position: relative;

    z-index: 2;
}


/* =========================================================
   图片区域
========================================================= */

.character-art {

#characterImage {

========================================================= */

}

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );

const loadError =
    document.getElementById(
        "loadError"
    );

const errorText =
    document.getElementById(
        "errorText"
    );

const characterImage =
    document.getElementById(
        "characterImage"
    );

const imagePlaceholder =
    document.getElementById(
        "imagePlaceholder"
    );

const characterNumber =
    document.getElementById(
        "characterNumber"
    );

const characterNameEn =
    document.getElementById(
        "characterNameEn"
    );

const characterNameCn =
    document.getElementById(
        "characterNameCn"
    );

const characterRole =
    document.getElementById(
        "characterRole"
    );

const infoRace =
    document.getElementById(
        "infoRace"
    );

const infoRegion =
    document.getElementById(
        "infoRegion"
    );

const infoStatus =
    document.getElementById(
        "infoStatus"
    );

const infoRole =
    document.getElementById(
        "infoRole"
    );

const profile =
    document.getElementById(
        "profile"
    );

const archiveMark =
    document.getElementById(
        "archiveMark"
    );


/* =========================================================
   辅助函数
========================================================= */

function setText(
    element,
    value
) {

    element.textContent =
        value || "";

}


/* =========================================================
   解析角色名字
========================================================= */

function parseCharacterName(
    fullName
) {

    if (!fullName) {

        return {
            english: "",
            chinese: ""
        };

    }


    const parts =
        fullName
            .trim()
            .split(/\s+/);


    if (parts.length === 1) {

        return {
            english: parts[0],
            chinese: ""
        };

    }


    return {

        english:
            parts
                .slice(0, -1)
                .join(" "),

        chinese:
            parts[parts.length - 1]

    };

}


/* =========================================================
   获取 URL 中的角色 ID
========================================================= */

function getCharacterId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =========================================================
   显示错误
========================================================= */

function showError(
    message
) {

    errorText.textContent =
        message;

    loadError.classList.add(
        "show"
    );

}


/* =========================================================
   显示角色
========================================================= */

function renderCharacter(
    character
) {

    const names =
        parseCharacterName(
            character.name
        );


    /* -------------------------
       名字
    ------------------------- */

    setText(
        characterNameEn,
        names.english
    );

    setText(
        characterNameCn,
        names.chinese
    );


    /* -------------------------
       编号
    ------------------------- */

    setText(
        characterNumber,
        "CHARACTER · " +
        String(character.id || "")
    );


    /* -------------------------
       Role
    ------------------------- */

    setText(
        characterRole,
        character.role
    );


    /* -------------------------
       Basic info
    ------------------------- */

    setText(
        infoRace,
        character.race
    );

    setText(
        infoRegion,
        character.region
    );

    setText(
        infoRole,
        character.role
    );


    let status = "";


    if (character.gender) {

        status +=
            character.gender;

    }


    if (
        character.age !== null &&
        character.age !== undefined &&
        character.age !== ""
    ) {

        if (status) {

            status += " · ";

        }

        status +=
            character.age +
            " 岁";

    }


    setText(
        infoStatus,
        status
    );


    /* -------------------------
       Profile
    ------------------------- */

    /*
     * 目前数据库没有单独的 profile
     * 字段，所以这里暂时保持空白。
     *
     * 以后如果增加 profile 字段，
     * 可以直接接上。
     */

    setText(
        profile,
        character.profile
    );


    /* -------------------------
       图片
    ------------------------- */

    if (character.image_url) {

        characterImage.src =
            character.image_url;

        characterImage.alt =
            character.name || "Character";

        characterImage.style.display =
            "block";

        imagePlaceholder.style.display =
            "none";


        characterImage.onerror =
            function () {

                characterImage.style.display =
                    "none";

                imagePlaceholder.style.display =
                    "flex";

            };

    } else {

        characterImage.style.display =
            "none";

        imagePlaceholder.style.display =
            "flex";

    }


    /* -------------------------
       页脚
    ------------------------- */

    archiveMark.textContent =
        "SEYAMI · CHARACTER ARCHIVE · " +
        character.id;

}


/* =========================================================
   读取角色
========================================================= */

async function loadCharacter() {

    try {

        const characterId =
            getCharacterId();


        let query =
            supabaseClient
                .from("characters")
                .select("*");


        /*
         * 如果 URL 有 id：
         *
         * characters.html?id=xxxxx
         *
         * 就读取指定角色。
         */

        if (characterId) {

            query =
                query.eq(
                    "id",
                    characterId
                );

        } else {

            /*
             * 如果没有 id，
             * 暂时读取第一条。
             *
             * 这样直接打开 characters.html
             * 也不会出现空白。
             */

            query =
                query
                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    )
                    .limit(1);

        }


        const {
            data,
            error
        } =
            await query;


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            showError(
                characterId
                    ? "没有找到 ID 为 " +
                      characterId +
                      " 的角色档案。"
                    : "目前没有角色档案。"
            );

            return;

        }


        const character =
            data[0];


        renderCharacter(
            character
        );


    } catch (error) {

        console.error(
            "Character loading error:",
            error
        );


        showError(
            "读取角色档案失败：" +
            (
                error.message ||
                "未知错误"
            )
        );

    } finally {

        setTimeout(
            function () {

                loading.classList.add(
                    "hide"
                );

            },
            200
        );

    }

}


/* =========================================================
   日间 / 夜间模式
========================================================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


function applyTheme(
    theme
) {

    if (theme === "day") {

        document.body.classList.add(
            "day-mode"
        );

        themeToggle.textContent =
            "☀";

    } else {

        document.body.classList.remove(
            "day-mode"
        );

        themeToggle.textContent =
            "☾";

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


applyTheme(
    savedTheme || "night"
);


themeToggle.addEventListener(
    "click",
    function () {

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );


        const newTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            newTheme
        );


        applyTheme(
            newTheme
        );

    }
);


/* =========================================================
   启动
========================================================= */

loadCharacter();

</script>
