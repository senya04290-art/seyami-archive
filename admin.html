<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>档案管理 · Seyami Archive</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   基础
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(20, 55, 95, 0.16),
            transparent 45%
        ),
        #061426;

    color: #dbe8f5;

    font-family:
        "Noto Serif SC",
        serif;

    transition:
        background 0.5s ease,
        color 0.5s ease;
}


/* =========================
   背景星点
========================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.star {

    position: absolute;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background:
        rgba(190, 220, 245, 0.65);

    opacity: 0.5;
}


/* =========================
   页面
========================= */

.page {

    position: relative;

    min-height: 100vh;

    padding:
        38px 58px 70px;

    z-index: 1;
}


/* =========================
   顶部
========================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    width: 100%;
}

.logo {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.logo-cn {

    font-size: 16px;

    letter-spacing: 0.16em;

    font-weight: 400;
}

.logo-en {

    font-family: "Cinzel", serif;

    font-size: 9px;

    letter-spacing: 0.3em;

    opacity: 0.55;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 20px;
}

.back {

    color: inherit;

    text-decoration: none;

    font-family: "Cinzel", serif;

    font-size: 10px;

    letter-spacing: 0.22em;

    opacity: 0.65;

    transition:
        opacity 0.3s ease;
}

.back:hover {

    opacity: 1;
}


/* =========================
   日夜按钮
========================= */

.theme-toggle {

    width: 38px;

    height: 38px;

    border:
        1px solid
        rgba(190, 215, 240, 0.25);

    background: transparent;

    color: inherit;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    transition:
        background 0.3s ease,
        border-color 0.3s ease;
}

.theme-toggle:hover {

    background:
        rgba(180, 210, 240, 0.06);

    border-color:
        rgba(190, 215, 240, 0.45);
}


/* =========================
   标题
========================= */

.title-area {

    text-align: center;

    margin-top: 70px;

    margin-bottom: 55px;
}

.title-en {

    font-family: "Cinzel", serif;

    font-size:
        clamp(30px, 5vw, 58px);

    font-weight: 300;

    letter-spacing: 0.22em;

    margin-left: 0.22em;

    line-height: 1.2;
}

.title-sub {

    margin-top: 12px;

    font-family: "Cinzel", serif;

    font-size: 10px;

    letter-spacing: 0.42em;

    opacity: 0.45;

    margin-left: 0.42em;
}

.title-cn {

    margin-top: 18px;

    font-size: 14px;

    letter-spacing: 0.25em;

    opacity: 0.65;
}


/* =========================
   管理类型
========================= */

.management-switch {

    width: min(820px, 100%);

    margin:
        0 auto 28px;

    display: flex;

    justify-content: center;

    gap: 10px;
}

.management-button {

    min-width: 170px;

    height: 42px;

    border:
        1px solid
        rgba(180, 210, 240, 0.2);

    background:
        rgba(4, 17, 32, 0.35);

    color: inherit;

    cursor: pointer;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size: 9px;

    letter-spacing: 0.2em;

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        opacity 0.3s ease;
}

.management-button:hover {

    border-color:
        rgba(180, 210, 240, 0.45);

    background:
        rgba(180, 210, 240, 0.05);
}

.management-button.active {

    border-color:
        rgba(190, 220, 245, 0.5);

    background:
        rgba(30, 65, 95, 0.45);

    opacity: 1;
}


/* =========================
   表单容器
========================= */

.admin-container {

    width: min(820px, 100%);

    margin: 0 auto;

    border:
        1px solid
        rgba(180, 210, 240, 0.18);

    background:
        rgba(4, 17, 32, 0.42);

    padding: 42px;

    position: relative;
}


/* =========================
   四角
========================= */

.admin-container::before,
.admin-container::after {

    content: "";

    position: absolute;

    width: 18px;

    height: 18px;

    border-color:
        rgba(180, 210, 240, 0.45);

    pointer-events: none;
}

.admin-container::before {

    top: -1px;

    left: -1px;

    border-top: 1px solid;

    border-left: 1px solid;
}

.admin-container::after {

    right: -1px;

    bottom: -1px;

    border-right: 1px solid;

    border-bottom: 1px solid;
}


/* =========================
   区域标题
========================= */

.section-title {

    font-family: "Cinzel", serif;

    font-size: 13px;

    letter-spacing: 0.3em;

    margin-bottom: 30px;

    opacity: 0.8;
}


/* =========================
   表单
========================= */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 24px 28px;
}

.field {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.field.full {

    grid-column: 1 / -1;
}

label {

    font-family: "Cinzel", serif;

    font-size: 9px;

    letter-spacing: 0.25em;

    opacity: 0.6;
}

input,
select,
textarea {

    width: 100%;

    border:
        1px solid
        rgba(180, 210, 240, 0.2);

    outline: none;

    background:
        rgba(3, 15, 29, 0.75);

    color: #dbe8f5;

    padding: 0 14px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size: 13px;

    transition:
        border-color 0.3s ease,
        background 0.3s ease;
}

input,
select {

    height: 46px;
}

textarea {

    min-height: 140px;

    padding: 14px;

    resize: vertical;

    line-height: 1.8;
}

input:focus,
select:focus,
textarea:focus {

    border-color:
        rgba(180, 210, 240, 0.55);

    background:
        rgba(5, 20, 38, 0.9);
}

input::placeholder,
textarea::placeholder {

    color:
        rgba(210, 225, 240, 0.28);
}


/* =========================
   图片上传
========================= */

.upload-box {

    width: 100%;

    min-height: 220px;

    border:
        1px dashed
        rgba(180, 210, 240, 0.25);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    position: relative;

    overflow: hidden;

    cursor: pointer;

    transition:
        border-color 0.3s ease,
        background 0.3s ease;
}

.upload-box:hover {

    border-color:
        rgba(180, 210, 240, 0.55);

    background:
        rgba(180, 210, 240, 0.025);
}

.upload-box input[type="file"] {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    opacity: 0;

    cursor: pointer;

    padding: 0;
}

.upload-placeholder {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;

    pointer-events: none;
}

.upload-symbol {

    font-size: 26px;

    opacity: 0.55;

    font-family: serif;
}

.upload-text {

    font-family: "Cinzel", serif;

    font-size: 10px;

    letter-spacing: 0.22em;

    opacity: 0.6;
}

.upload-hint {

    font-size: 10px;

    opacity: 0.35;
}

.preview {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 15px;

    display: none;

    pointer-events: none;
}


/* =========================
   保存按钮
========================= */

.save-area {

    margin-top: 38px;

    display: flex;

    justify-content: center;
}

.save-button {

    min-width: 230px;

    height: 48px;

    border:
        1px solid
        rgba(190, 220, 245, 0.4);

    background:
        rgba(10, 32, 55, 0.5);

    color: #dbe8f5;

    font-family: "Cinzel", serif;

    font-size: 10px;

    letter-spacing: 0.3em;

    cursor: pointer;

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease;
}

.save-button:hover {

    background:
        rgba(30, 65, 95, 0.5);

    border-color:
        rgba(210, 230, 245, 0.65);
}

.save-button:active {

    transform: scale(0.98);
}

.save-button:disabled {

    opacity: 0.45;

    cursor: wait;
}


/* =========================
   消息
========================= */

.message {

    text-align: center;

    margin-top: 22px;

    min-height: 20px;

    font-size: 12px;

    letter-spacing: 0.08em;

    opacity: 0.8;
}

.message.success {

    color: #b8d8c8;
}

.message.error {

    color: #e0b8b8;
}


/* =========================
   底部
========================= */

.footer {

    text-align: center;

    margin-top: 55px;

    font-family: "Cinzel", serif;

    font-size: 8px;

    letter-spacing: 0.35em;

    opacity: 0.25;
}


/* =========================
   日间模式
========================= */

body.day-mode {

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(210, 225, 238, 0.35),
            transparent 50%
        ),
        #e9eef3;

    color: #24384c;
}

body.day-mode .admin-container {

    background:
        rgba(255, 255, 255, 0.52);

    border-color:
        rgba(40, 70, 100, 0.18);
}

body.day-mode .management-button {

    background:
        rgba(255, 255, 255, 0.35);

    border-color:
        rgba(40, 70, 100, 0.2);
}

body.day-mode .management-button.active {

    background:
        rgba(255, 255, 255, 0.65);

    border-color:
        rgba(40, 70, 100, 0.4);
}

body.day-mode input,
body.day-mode select,
body.day-mode textarea {

    background:
        rgba(255, 255, 255, 0.65);

    color: #24384c;

    border-color:
        rgba(40, 70, 100, 0.2);
}

body.day-mode input:focus,
body.day-mode select:focus,
body.day-mode textarea:focus {

    background:
        rgba(255, 255, 255, 0.9);

    border-color:
        rgba(40, 70, 100, 0.45);
}

body.day-mode .upload-box {

    border-color:
        rgba(40, 70, 100, 0.25);
}

body.day-mode .save-button {

    color: #24384c;

    background:
        rgba(255, 255, 255, 0.5);

    border-color:
        rgba(40, 70, 100, 0.35);
}

body.day-mode .theme-toggle {

    border-color:
        rgba(40, 70, 100, 0.25);
}


/* =========================
   手机
========================= */

@media (max-width: 700px) {

    .page {

        padding:
            25px 20px 50px;
    }

    .header {

        align-items: center;
    }

    .logo-cn {

        font-size: 13px;
    }

    .logo-en {

        font-size: 7px;
    }

    .header-right {

        gap: 10px;
    }

    .back {

        font-size: 8px;
    }

    .theme-toggle {

        width: 34px;

        height: 34px;
    }

    .title-area {

        margin-top: 55px;

        margin-bottom: 40px;
    }

    .title-en {

        font-size: 29px;

        letter-spacing: 0.14em;

        margin-left: 0.14em;
    }

    .title-sub {

        font-size: 8px;

        letter-spacing: 0.3em;

        margin-left: 0.3em;
    }

    .title-cn {

        font-size: 12px;
    }

    .management-switch {

        gap: 7px;

        margin-bottom: 20px;
    }

    .management-button {

        min-width: 0;

        width: 50%;

        height: 40px;

        font-size: 8px;

        letter-spacing: 0.14em;
    }

    .admin-container {

        padding:
            28px 20px;
    }

    .form-grid {

        grid-template-columns: 1fr;

        gap: 22px;
    }

    .field.full {

        grid-column: auto;
    }

    .upload-box {

        min-height: 200px;
    }

    .save-button {

        width: 100%;
    }

    textarea {

        min-height: 160px;
    }

}

</style>

</head>


<body>


<!-- =========================
     背景星点
========================= -->

<div class="stars">

    <span class="star" style="left:8%;top:14%;"></span>
    <span class="star" style="left:18%;top:31%;"></span>
    <span class="star" style="left:27%;top:9%;"></span>
    <span class="star" style="left:36%;top:23%;"></span>
    <span class="star" style="left:46%;top:12%;"></span>
    <span class="star" style="left:58%;top:28%;"></span>
    <span class="star" style="left:67%;top:8%;"></span>
    <span class="star" style="left:78%;top:20%;"></span>
    <span class="star" style="left:91%;top:12%;"></span>

    <span class="star" style="left:13%;top:57%;"></span>
    <span class="star" style="left:23%;top:76%;"></span>
    <span class="star" style="left:34%;top:64%;"></span>
    <span class="star" style="left:49%;top:82%;"></span>
    <span class="star" style="left:61%;top:69%;"></span>
    <span class="star" style="left:73%;top:88%;"></span>
    <span class="star" style="left:86%;top:61%;"></span>
    <span class="star" style="left:94%;top:78%;"></span>

</div>


<div class="page">


    <!-- =========================
         顶部
    ========================= -->

    <header class="header">

        <div class="logo">

            <div class="logo-cn">
                塞垭弥大陆档案馆
            </div>

            <div class="logo-en">
                SEYAMI ARCHIVE
            </div>

        </div>


        <div class="header-right">

            <a
                href="archive.html"
                class="back"
            >
                RETURN TO ARCHIVE
            </a>


            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
            >
                ☾
            </button>

        </div>

    </header>


    <!-- =========================
         标题
    ========================= -->

    <section class="title-area">

        <div
            class="title-en"
            id="titleEn"
        >
            CHARACTER
        </div>


        <div
            class="title-sub"
            id="titleSub"
        >
            ARCHIVE ADMINISTRATION
        </div>


        <div
            class="title-cn"
            id="titleCn"
        >
            角色档案管理
        </div>

    </section>


    <!-- =========================
         管理类型
    ========================= -->

    <div class="management-switch">

        <button
            type="button"
            class="management-button active"
            id="characterModeButton"
        >
            CHARACTER · 角色
        </button>


        <button
            type="button"
            class="management-button"
            id="countryModeButton"
        >
            COUNTRY · 国家
        </button>

    </div>


    <!-- =========================
         管理表单
    ========================= -->

    <main class="admin-container">

        <div
            class="section-title"
            id="sectionTitle"
        >
            CREATE CHARACTER RECORD
        </div>


        <form id="characterForm">

            <div class="form-grid">


                <!-- =====================
                     角色
                ===================== -->

                <div
                    class="field full character-field"
                >

                    <label for="name">
                        CHARACTER NAME
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="例如：Evelina•Nieve 伊莉娜·妳芙"
                    >

                </div>


                <div
                    class="field character-field"
                >

                    <label for="race">
                        RACE
                    </label>

                    <input
                        id="race"
                        type="text"
                        placeholder="例如：雪山神"
                    >

                </div>


                <div
                    class="field character-field"
                >

                    <label for="region">
                        REGION
                    </label>

                    <input
                        id="region"
                        type="text"
                        placeholder="例如：雪山"
                    >

                </div>


                <div
                    class="field character-field"
                >

                    <label for="role">
                        ROLE
                    </label>

                    <input
                        id="role"
                        type="text"
                        placeholder="例如：雪山女神"
                    >

                </div>


                <div
                    class="field character-field"
                >

                    <label for="age">
                        AGE
                    </label>

                    <input
                        id="age"
                        type="number"
                        min="0"
                        placeholder="例如：1000"
                    >

                </div>


                <div
                    class="field full character-field"
                >

                    <label for="gender">
                        GENDER
                    </label>

                    <select id="gender">

                        <option value="">
                            请选择
                        </option>

                        <option value="女性">
                            女性
                        </option>

                        <option value="男性">
                            男性
                        </option>

                        <option value="其他">
                            其他
                        </option>

                    </select>

                </div>


                <div
                    class="field full character-field"
                >

                    <label for="personality">
                        PERSONALITY · 性格
                    </label>

                    <textarea
                        id="personality"
                        placeholder="例如：冷静、温柔而神秘，对陌生人保持一定距离……"
                    ></textarea>

                </div>


                <div
                    class="field full character-field"
                >

                    <label for="backstory">
                        BACKSTORY · 背景故事
                    </label>

                    <textarea
                        id="backstory"
                        placeholder="填写角色的背景、经历、世界观设定、人物关系等……"
                    ></textarea>

                </div>


                <!-- =====================
                     角色图片
                ===================== -->

                <div
                    class="field full character-field"
                >

                    <label>
                        CHARACTER ARTWORK
                    </label>


                    <div class="upload-box">

                        <input
                            id="image"
                            type="file"
                            accept="image/png,image/jpeg,image/webp"
                        >


                        <div
                            class="upload-placeholder"
                            id="uploadPlaceholder"
                        >

                            <div class="upload-symbol">
                                ✦
                            </div>

                            <div class="upload-text">
                                SELECT ARTWORK
                            </div>

                            <div class="upload-hint">
                                PNG / JPG / WEBP
                            </div>

                        </div>


                        <img
                            id="preview"
                            class="preview"
                            alt="预览"
                        >

                    </div>

                </div>


                <!-- =========================
                     国家
                ========================= -->

                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countryName">
                        COUNTRY NAME · 国家名称
                    </label>

                    <input
                        id="countryName"
                        type="text"
                        placeholder="例如：雪境王国"
                    >

                </div>


                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countrySubtitle">
                        SUBTITLE · 副标题 / 别名
                    </label>

                    <input
                        id="countrySubtitle"
                        type="text"
                        placeholder="例如：永冬之国"
                    >

                </div>


                <div
                    class="field country-field"
                    style="display:none;"
                >

                    <label for="countryCapital">
                        CAPITAL · 首都
                    </label>

                    <input
                        id="countryCapital"
                        type="text"
                        placeholder="例如：伊尔希亚"
                    >

                </div>


                <div
                    class="field country-field"
                    style="display:none;"
                >

                    <label for="countryGovernment">
                        GOVERNMENT · 政体
                    </label>

                    <input
                        id="countryGovernment"
                        type="text"
                        placeholder="例如：君主制"
                    >

                </div>


                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countryRegion">
                        REGION · 所在地区
                    </label>

                    <input
                        id="countryRegion"
                        type="text"
                        placeholder="例如：北境雪山"
                    >

                </div>


                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countryDescription">
                        DESCRIPTION · 国家介绍
                    </label>

                    <textarea
                        id="countryDescription"
                        placeholder="填写这个国家的整体介绍、地理环境、国土情况等……"
                    ></textarea>

                </div>


                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countryHistory">
                        HISTORY · 国家历史
                    </label>

                    <textarea
                        id="countryHistory"
                        placeholder="填写国家的建立、战争、王朝、重要历史事件等……"
                    ></textarea>

                </div>


                <div
                    class="field full country-field"
                    style="display:none;"
                >

                    <label for="countryCulture">
                        CULTURE · 国家文化
                    </label>

                    <textarea
                        id="countryCulture"
                        placeholder="填写国家的文化、传统、宗教、节日、风俗等……"
                    ></textarea>

                </div>


            </div>


            <!-- =========================
                 保存
            ========================= -->

            <div class="save-area">

                <button
                    class="save-button"
                    id="saveButton"
                    type="submit"
                >
                    SAVE CHARACTER
                </button>

            </div>


            <div
                class="message"
                id="message"
            ></div>


        </form>

    </main>


    <footer
        class="footer"
        id="footer"
    >
        SEYAMI · CHARACTER ARCHIVE
    </footer>


</div>


<script>

/* =========================================================
   SUPABASE

/* =========================================================
   图片预览
========================================================= */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];


        if (!file) {

            preview.style.display =
                "none";

            uploadPlaceholder.style.display =
                "flex";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                preview.src =
                    event.target.result;

                preview.style.display =
                    "block";

                uploadPlaceholder.style.display =
                    "none";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================================
   保存角色
========================================================= */

async function saveCharacter() {

    const name =
        nameInput.value.trim();

    const race =
        raceInput.value.trim();

    const region =
        regionInput.value.trim();

    const role =
        roleInput.value.trim();

    const age =
        ageInput.value.trim();

    const gender =
        genderInput.value.trim();

    const personality =
        personalityInput.value.trim();

    const backstory =
        backstoryInput.value.trim();

    const imageFile =
        imageInput.files[0];


    if (!name) {

        showMessage(
            "请先填写角色名字。",
            "error"
        );

        return;
    }


    if (!imageFile) {

        showMessage(
            "请先选择角色立绘。",
            "error"
        );

        return;
    }


    saveButton.disabled =
        true;

    saveButton.textContent =
        "UPLOADING...";


    try {


        /* =========================
           文件扩展名
        ========================= */

        const originalName =
            imageFile.name;

        const extension =
            originalName
                .split(".")
                .pop()
                .toLowerCase();


        const filePath =
            "character-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 8) +
            "." +
            extension;


        showMessage(
            "正在上传立绘……"
        );


        /* =========================
           上传图片
        ========================= */

        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("character-images")
                .upload(
                    filePath,
                    imageFile,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


        if (uploadError) {

            throw uploadError;
        }


        /* =========================
           获取图片 URL
        ========================= */

        const {
            data: publicURLData
        } =
            supabaseClient
                .storage
                .from("character-images")
                .getPublicUrl(
                    filePath
                );


        const imageURL =
            publicURLData.publicUrl;


        showMessage(
            "立绘上传完成，正在建立角色档案……"
        );


        /* =========================
           写入角色
        ========================= */

        const {
            error: insertError
        } =
            await supabaseClient
                .from("characters")
                .insert({

                    name:
                        name,

                    race:
                        race || null,

                    role:
                        role || null,

                    age:
                        age === ""
                            ? null
                            : Number(age),

                    gender:
                        gender || null,

                    region:
                        region || null,

                    personality:
                        personality || null,

                    backstory:
                        backstory || null,

                    image_url:
                        imageURL

                });


        if (insertError) {

            throw insertError;
        }


        showMessage(
            "角色档案保存成功！",
            "success"
        );


        saveButton.textContent =
            "SAVED";


        form.reset();


        preview.src =
            "";

        preview.style.display =
            "none";

        uploadPlaceholder.style.display =
            "flex";


        setTimeout(
            function() {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "SAVE CHARACTER";

            },
            2000
        );


    } catch (error) {

        console.error(
            "Character save error:",
            error
        );


        showMessage(
            "保存失败：" +
            (
                error.message ||
                "未知错误"
            ),
            "error"
        );


        saveButton.disabled =
            false;

        saveButton.textContent =
            "SAVE CHARACTER";

    }

}

/* =========================================================
   日夜模式
========================================================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


function applyTheme(
    theme
) {

    if (
        theme ===
        "day"
    ) {

        document.body.classList.add(
            "day-mode"
        );

        themeToggle.textContent =
            "☀";

    } else {

        document.body.classList.remove(
            "day-mode"
        );

        themeToggle.textContent =
            "☾";

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


applyTheme(
    savedTheme ||
    "night"
);


themeToggle.addEventListener(
    "click",
    function() {

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );


        const newTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            newTheme
        );


        applyTheme(
            newTheme
        );

    }
);
