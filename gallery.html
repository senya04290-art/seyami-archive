<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 档案画廊</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    overflow-x:hidden;

    background:#071522;

    color:#d9edff;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    transition:
        background .6s ease,
        color .6s ease;
}


/* =========================================================
   页面
========================================================= */

.page{

    position:relative;

    min-height:100vh;

    padding:
        30px
        70px
        80px;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(37,91,128,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(13,47,72,.48),
            transparent 72%
        ),

        #071522;

    transition:
        background .6s ease;
}


/* =========================================================
   边框
========================================================= */

.frame{

    position:absolute;

    top:20px;
    left:20px;
    right:20px;
    bottom:20px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;

    transition:
        border-color .6s ease;
}


.frame::before,
.frame::after{

    content:"";

    position:absolute;

    width:45px;
    height:45px;

    transition:
        border-color .6s ease;
}


.frame::before{

    left:-1px;
    top:-1px;

    border-left:
        1px solid
        rgba(108,178,230,.88);

    border-top:
        1px solid
        rgba(108,178,230,.88);
}


.frame::after{

    right:-1px;
    bottom:-1px;

    border-right:
        1px solid
        rgba(108,178,230,.88);

    border-bottom:
        1px solid
        rgba(108,178,230,.88);
}


/* =========================================================
   星星背景
========================================================= */

.stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    background-image:

        radial-gradient(
            1px 1px at 10% 18%,
            rgba(180,220,255,.65),
            transparent
        ),

        radial-gradient(
            1px 1px at 22% 72%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 35% 25%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 48% 83%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 63% 17%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 77% 65%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 89% 30%,
            rgba(180,220,255,.6),
            transparent
        ),

        radial-gradient(
            1px 1px at 92% 84%,
            rgba(180,220,255,.4),
            transparent
        );
}


/* =========================================================
   微小星点
========================================================= */

.micro-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;

    opacity:.7;

    background-image:

        radial-gradient(
            1px 1px at 7% 42%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 17% 14%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 31% 62%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 44% 11%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 56% 71%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 69% 37%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 82% 12%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 95% 55%,
            rgba(173,215,244,.4),
            transparent
        );
}


/* =========================================================
   漂浮魔法符号
========================================================= */

.floating-symbols{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:3;
}


.floating-symbol{

    position:absolute;

    font-family:
        "Times New Roman",
        serif;

    color:
        rgba(115,180,222,.72);

    text-shadow:none;

    user-select:none;

    animation:
        symbolFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);
}


@keyframes symbolFloat{

    0%{

        transform:
            translate3d(0,0,0)
            rotate(0deg);

        opacity:.12;
    }

    25%{

        opacity:.28;
    }

    50%{

        transform:
            translate3d(12px,-24px,0)
            rotate(8deg);

        opacity:.34;
    }

    75%{

        opacity:.22;
    }

    100%{

        transform:
            translate3d(-10px,-48px,0)
            rotate(-6deg);

        opacity:.12;
    }
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:fixed;

    left:50%;

    top:48%;

    width:480px;

    height:480px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(92,163,209,.09);

    border-radius:50%;

    pointer-events:none;

    z-index:1;

    box-shadow:

        0 0 0 16px
        rgba(80,147,194,.018),

        0 0 0 34px
        rgba(80,147,194,.014),

        0 0 80px
        rgba(43,113,159,.04);
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:35px;

    border:
        1px solid
        rgba(92,163,209,.07);

    border-radius:50%;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:78px;

    border:
        1px dashed
        rgba(92,163,209,.06);

    border-radius:50%;
}


/* =========================================================
   魔法阵装饰线
========================================================= */

.magic-line{

    position:absolute;

    left:50%;

    top:50%;

    width:100%;

    height:1px;

    background:
        rgba(115,180,220,.045);

    transform:
        translate(-50%,-50%);
}


.magic-line:nth-child(2){

    transform:
        translate(-50%,-50%)
        rotate(60deg);
}


.magic-line:nth-child(3){

    transform:
        translate(-50%,-50%)
        rotate(-60deg);
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:absolute;

    left:58px;
    right:58px;

    top:38px;

    z-index:20;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;
}


/* =========================================================
   Logo
========================================================= */

.logo{

    display:flex;

    align-items:flex-start;

    gap:12px;

    color:#d9edff;

    text-decoration:none;

    transition:
        color .6s ease;
}


.logo-symbol{

    color:
        rgba(137,201,239,.9);

    width:17px;

    height:13px;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    font-size:17px;

    line-height:13px;

    margin:0;

    padding:0;

    text-shadow:

        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);

    flex-shrink:0;

    transition:

        color .6s ease,

        text-shadow .6s ease;
}


.logo > span:last-child{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1;
}


.logo-cn{

    display:block;

    height:13px;

    line-height:13px;

    color:#d9edff;

    font-size:13px;

    letter-spacing:3px;

    white-space:nowrap;
}


.logo-en{

    display:block;

    margin-top:5px;

    color:
        rgba(157,204,239,.63);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    line-height:8px;

    letter-spacing:3px;

    white-space:nowrap;
}


/* =========================================================
   右侧控制
========================================================= */

.header-right{

    display:flex;

    align-items:center;

    gap:20px;
}


.back{

    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:1px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}


.back:hover{

    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}


.theme-toggle{

    display:flex;

    align-items:center;

    gap:7px;

    height:28px;

    padding:
        0 11px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;

    white-space:nowrap;

    transition:

        color .35s ease,

        border-color .35s ease,

        background .35s ease,

        box-shadow .35s ease;
}


.theme-toggle:hover{

    color:#d9efff;

    border-color:
        rgba(122,192,235,.62);

    background:
        rgba(8,31,52,.55);

    box-shadow:
        0 0 14px
        rgba(76,151,202,.12);
}


.theme-icon{

    font-size:12px;

    line-height:1;

    letter-spacing:0;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    z-index:5;

    text-align:center;

    padding-top:150px;

    margin-bottom:78px;
}


.hero-en{

    font-family:
        "Cinzel",
        serif;

    font-size:11px;

    letter-spacing:6px;

    color:
        rgba(157,204,239,.63);

    margin-bottom:12px;
}


.hero-title{

    font-family:
        "Cinzel",
        serif;

    font-size:42px;

    font-weight:400;

    letter-spacing:8px;

    color:#dcefff;

    line-height:1.1;

    text-shadow:
        0 0 16px
        rgba(73,150,204,.14);
}


.hero-cn{

    margin-top:15px;

    font-size:13px;

    letter-spacing:5px;

    color:
        rgba(181,218,242,.72);
}


/* =========================================================
   档案画廊
========================================================= */

.gallery{

    position:relative;

    z-index:5;

    width:min(1100px,94%);

    margin:0 auto;
}


/* =========================================================
   图片网格
========================================================= */

.gallery-list{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:28px;

    position:relative;

    z-index:2;
}


/* =========================================================
   画廊卡片
========================================================= */

.gallery-item{

    border:
        1px solid
        rgba(110,170,210,.13);

    background:
        linear-gradient(
            135deg,
            rgba(17,42,61,.28),
            rgba(8,22,35,.18)
        );

    padding:14px;

    transition:
        border-color .35s ease,
        background .35s ease,
        transform .35s ease,
        box-shadow .35s ease;

    cursor:pointer;
}


.gallery-item:hover{

    border-color:
        rgba(130,190,225,.30);

    background:
        linear-gradient(
            135deg,
            rgba(25,54,76,.35),
            rgba(10,27,42,.25)
        );

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.12);
}


/* =========================================================
   图片区域
========================================================= */

.gallery-image-wrap{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:
        rgba(5,16,27,.35);

    border:
        1px solid
        rgba(110,170,210,.08);

    min-height:180px;
}


.gallery-image{

    display:block;

    width:100%;

    height:auto;

    max-width:100%;

    object-fit:contain;
}


/* =========================================================
   图片文字
========================================================= */

.gallery-info{

    padding:
        17px
        4px
        4px;
}


.gallery-era{

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(140,190,220,.52);

    margin-bottom:8px;
}


.gallery-title{

    font-family:
        "Cinzel",
        serif;

    font-size:16px;

    font-weight:400;

    letter-spacing:2px;

    color:#d2e5f2;

    margin-bottom:7px;
}


.gallery-cn{

    font-size:11px;

    letter-spacing:2px;

    color:
        rgba(190,216,232,.6);

    margin-bottom:8px;
}


.gallery-description{

    font-size:10px;

    line-height:1.9;

    letter-spacing:1px;

    color:
        rgba(175,202,220,.45);
}


/* =========================================================
   空白提示
========================================================= */

.empty-gallery{

    grid-column:1 / -1;

    text-align:center;

    padding:50px 20px;

    border:
        1px solid
        rgba(110,170,210,.10);

    background:
        rgba(10,27,42,.16);

    color:
        rgba(170,200,220,.38);

    font-size:11px;

    letter-spacing:2px;
}


.empty-gallery-en{

    display:block;

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:9px;

    color:
        rgba(145,190,220,.4);
}


/* =========================================================
   图片放大层
========================================================= */

.lightbox{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:50px;

    background:
        rgba(3,10,18,.86);

    backdrop-filter:blur(5px);

    z-index:100;
}


.lightbox.active{

    display:flex;
}


.lightbox-image{

    max-width:90vw;

    max-height:85vh;

    width:auto;

    height:auto;

    object-fit:contain;

    box-shadow:
        0 0 40px
        rgba(50,120,170,.18);

    border:
        1px solid
        rgba(130,190,225,.25);
}


.lightbox-close{

    position:absolute;

    top:28px;

    right:35px;

    color:
        rgba(210,235,248,.7);

    font-family:
        "Cinzel",
        serif;

    font-size:25px;

    font-weight:400;

    cursor:pointer;

    transition:.3s;
}


.lightbox-close:hover{

    color:#e5f5ff;

    transform:rotate(90deg);
}


/* =========================================================
   页脚
========================================================= */

.footer{

    position:relative;

    z-index:5;

    text-align:center;

    margin-top:100px;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:4px;

    color:
        rgba(133,177,207,.38);
}


/* =========================================================
   日间模式
========================================================= */

body.day{

    background:#f4f9fd;

    color:#2e5069;
}


body.day .page{

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),

        #f4f9fd;
}


body.day .stars{

    opacity:.18;
}


body.day .micro-stars{

    opacity:.12;
}


body.day .frame{

    border-color:
        rgba(91,145,184,.34);
}


body.day .frame::before{

    border-left-color:
        rgba(79,141,190,.68);

    border-top-color:
        rgba(79,141,190,.68);
}


body.day .frame::after{

    border-right-color:
        rgba(79,141,190,.68);

    border-bottom-color:
        rgba(79,141,190,.68);
}


body.day .logo{

    color:#315a75;
}


body.day .logo-cn{

    color:#315a75;
}


body.day .logo-en{

    color:
        rgba(68,116,145,.62);
}


body.day .logo-symbol{

    color:
        rgba(72,145,187,.8);

    text-shadow:none;
}


body.day .back{

    color:
        rgba(64,110,137,.72);
}


body.day .back:hover{

    color:#29485e;

    text-shadow:
        0 0 8px
        rgba(76,151,202,.14);
}


body.day .theme-toggle{

    border-color:
        rgba(91,145,184,.34);

    background:
        rgba(248,252,255,.78);

    color:
        rgba(61,98,125,.76);
}


body.day .theme-toggle:hover{

    border-color:
        rgba(79,151,200,.62);

    background:
        rgba(248,252,255,.90);

    color:#28536f;

    box-shadow:
        0 0 14px
        rgba(76,151,202,.11);
}


body.day .hero-en{

    color:
        rgba(81,137,173,.68);
}


body.day .hero-title{

    color:#2b506a;

    text-shadow:
        0 0 18px
        rgba(80,151,201,.065);
}


body.day .hero-cn{

    color:
        rgba(45,82,106,.80);
}


body.day .magic-circle{

    border-color:
        rgba(79,148,196,.26);

    box-shadow:

        0 0 50px
        rgba(70,142,196,.055),

        inset
        0 0 60px
        rgba(78,151,204,.028);
}


body.day .magic-circle::before{

    border-color:
        rgba(79,148,196,.26);
}


body.day .magic-circle::after{

    border-color:
        rgba(101,168,207,.20);
}


body.day .magic-line{

    background:
        rgba(76,151,202,.05);
}


/* =========================================================
   画廊日间模式
========================================================= */

body.day .gallery-item{

    border-color:
        rgba(65,110,140,.14);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.5),
            rgba(235,243,247,.38)
        );
}


body.day .gallery-item:hover{

    border-color:
        rgba(65,110,140,.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.75),
            rgba(235,243,247,.55)
        );
}


body.day .gallery-image-wrap{

    background:
        rgba(235,243,247,.4);

    border-color:
        rgba(65,110,140,.10);
}


body.day .gallery-era{

    color:
        rgba(65,105,130,.55);
}


body.day .gallery-title{

    color:#29485e;
}


body.day .gallery-cn{

    color:
        rgba(55,88,108,.65);
}


body.day .gallery-description{

    color:
        rgba(55,88,108,.55);
}


body.day .empty-gallery{

    border-color:
        rgba(65,110,140,.13);

    background:
        rgba(255,255,255,.35);

    color:
        rgba(55,88,108,.48);
}


body.day .empty-gallery-en{

    color:
        rgba(65,105,130,.45);
}


body.day .footer{

    color:
        rgba(73,115,143,.40);
}


/* =========================================================
   手机端
========================================================= */

@media(max-width:900px){

    .gallery-list{

        grid-template-columns:
            repeat(2,1fr);

        gap:22px;
    }

}


@media(max-width:700px){

    .page{

        padding:
            22px
            20px
            55px;
    }


    .frame{

        top:14px;
        left:14px;
        right:14px;
        bottom:14px;
    }


    .header{

        left:25px;
        right:25px;
        top:24px;
    }


    .logo{

        gap:10px;
    }


    .logo-symbol{

        width:15px;

        height:11px;

        font-size:15px;

        line-height:11px;

        margin-top:2px;
    }


    .logo-cn{

        height:11px;

        line-height:11px;

        font-size:11px;

        letter-spacing:2px;
    }


    .logo-en{

        margin-top:4px;

        font-size:7px;

        line-height:7px;

        letter-spacing:2px;
    }


    .header-right{

        gap:8px;
    }


    .back{

        font-size:10px;
    }


    .theme-toggle{

        height:25px;

        padding:
            0 7px;

        gap:5px;

        font-size:6px;

        letter-spacing:1px;
    }


    .hero{

        padding-top:120px;

        margin-bottom:60px;
    }


    .hero-en{

        font-size:8px;

        letter-spacing:5px;
    }


    .hero-title{

        font-size:27px;

        letter-spacing:4px;
    }


    .hero-cn{

        font-size:12px;

        letter-spacing:5px;
    }


    .gallery{

        width:100%;

        margin-top:0;
    }


    .gallery-list{

        grid-template-columns:1fr;

        gap:25px;
    }


    .gallery-item{

        padding:12px;
    }


    .gallery-image-wrap{

        min-height:140px;
    }


    .gallery-title{

        font-size:15px;
    }


    .gallery-description{

        font-size:10px;
    }


    .empty-gallery{

        padding:40px 15px;
    }


    .lightbox{

        padding:
            30px
            20px;
    }


    .lightbox-image{

        max-width:94vw;

        max-height:82vh;
    }


    .lightbox-close{

        top:18px;

<script>

/* =========================================================
   画廊资料
========================================================= */

const galleryItems = [

    /*
    
    以后新增历史记录可以写在这里：

    {
        image: "images/ilina.jpg",
        era: "CHARACTER ARCHIVE",
        title: "ILINA",
        cn: "伊莉娜",
        description: "雪山的神女。"
    },

    {
        image: "images/example.png",
        era: "WORLD ARCHIVE",
        title: "EXAMPLE",
        cn: "示例档案",
        description: "这里填写图片说明。"
    }

    */

];


/* =========================================================
   生成画廊
========================================================= */

const galleryList =
    document.getElementById("galleryList");


function renderGallery(){

    galleryList.innerHTML = "";


    if(galleryItems.length === 0){

        galleryList.innerHTML = `

            <div class="empty-gallery">

                <span class="empty-gallery-en">
                    ARCHIVE EMPTY
                </span>

                暂无档案画廊记录

            </div>

        `;

        return;
    }


    galleryItems.forEach(
        (item,index)=>{

            const card =
                document.createElement("div");


            card.className =
                "gallery-item";


            card.innerHTML = `

                <div class="gallery-image-wrap">

                    <img
                        class="gallery-image"
                        src="${item.image}"
                        alt="${item.title || ""}"
                        loading="lazy"
                    >

                </div>


                <div class="gallery-info">

                    ${
                        item.era
                        ?
                        `<div class="gallery-era">
                            ${item.era}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.title
                        ?
                        `<div class="gallery-title">
                            ${item.title}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.cn
                        ?
                        `<div class="gallery-cn">
                            ${item.cn}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.description
                        ?
                        `<div class="gallery-description">
                            ${item.description}
                        </div>`
                        :
                        ""
                    }

                </div>

            `;


            galleryList.appendChild(card);


            const image =
                card.querySelector(
                    ".gallery-image"
                );


            image.addEventListener(
                "click",
                ()=>{

                    lightboxImage.src =
                        item.image;

                    lightboxImage.alt =
                        item.title || "";

                    lightbox.classList.add(
                        "active"
                    );

                }
            );

        }
    );

}


renderGallery();


/* =========================================================
   图片放大层
========================================================= */

const lightbox =
    document.getElementById("lightbox");


const lightboxImage =
    document.getElementById("lightboxImage");


const lightboxClose =
    document.getElementById("lightboxClose");


lightboxClose.addEventListener(
    "click",
    ()=>{

        lightbox.classList.remove(
            "active"
        );

        lightboxImage.src = "";

    }
);


lightbox.addEventListener(
    "click",
    (event)=>{

        if(event.target === lightbox){

            lightbox.classList.remove(
                "active"
            );

            lightboxImage.src = "";

        }

    }
);


document.addEventListener(
    "keydown",
    (event)=>{

        if(event.key === "Escape"){

            lightbox.classList.remove(
                "active"
            );

            lightboxImage.src = "";

        }

    }
);


/* =========================================================
   日间 / 夜间模式
========================================================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


const themeIcon =
    document.getElementById(
        "themeIcon"
    );


const themeText =
    document.getElementById(
        "themeText"
    );


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

        themeIcon.textContent =
            "☀";

        themeText.textContent =
            "DAY";

    }else{

        document.body.classList.remove(
            "day"
        );

        themeIcon.textContent =
            "☾";

        themeText.textContent =
            "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList.contains(
                "day"
            );


        const nextTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );


        applyTheme(
            nextTheme
        );

    }
);

</script>
