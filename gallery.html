<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 档案画廊</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    background:#061426;
    color:#dcecff;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    transition:
        background .6s ease,
        color .6s ease;
}


/* =========================================================
   页面
========================================================= */

.page{
    position:relative;
    min-height:100vh;

    padding:
        30px
        70px
        80px;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(38,91,137,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(11,45,75,.45),
            transparent 72%
        ),

        #061426;

    transition:
        background .6s ease;
}


/* =========================================================
   边框
========================================================= */

.frame{
    position:absolute;

    top:20px;
    left:20px;
    right:20px;
    bottom:20px;

    border:
        1px solid
        rgba(111,174,224,.32);

    pointer-events:none;

    z-index:10;

    transition:
        border-color .6s ease;
}


.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:45px;
    height:45px;

    transition:
        border-color .6s ease;
}


.frame::before{
    left:-1px;
    top:-1px;

    border-left:
        1px solid
        rgba(108,178,230,.88);

    border-top:
        1px solid
        rgba(108,178,230,.88);
}


.frame::after{
    right:-1px;
    bottom:-1px;

    border-right:
        1px solid
        rgba(108,178,230,.88);

    border-bottom:
        1px solid
        rgba(108,178,230,.88);
}


/* =========================================================
   星星背景
========================================================= */

.stars{
    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    background-image:

        radial-gradient(
            1px 1px at 10% 18%,
            rgba(182,220,255,.7),
            transparent
        ),

        radial-gradient(
            1px 1px at 22% 72%,
            rgba(182,220,255,.25),
            transparent
        ),

        radial-gradient(
            1px 1px at 35% 25%,
            rgba(182,220,255,.28),
            transparent
        ),

        radial-gradient(
            1px 1px at 48% 83%,
            rgba(182,220,255,.25),
            transparent
        ),

        radial-gradient(
            1px 1px at 63% 17%,
            rgba(182,220,255,.30),
            transparent
        ),

        radial-gradient(
            1px 1px at 77% 65%,
            rgba(182,220,255,.23),
            transparent
        ),

        radial-gradient(
            1px 1px at 89% 30%,
            rgba(182,220,255,.28),
            transparent
        ),

        radial-gradient(
            1px 1px at 92% 84%,
            rgba(182,220,255,.20),
            transparent
        );
}


.micro-stars{
    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;

    opacity:.7;

    background-image:

        radial-gradient(
            1px 1px at 7% 42%,
            rgba(194,225,248,.30),
            transparent
        ),

        radial-gradient(
            1px 1px at 17% 14%,
            rgba(194,225,248,.25),
            transparent
        ),

        radial-gradient(
            1px 1px at 31% 62%,
            rgba(194,225,248,.20),
            transparent
        ),

        radial-gradient(
            1px 1px at 44% 11%,
            rgba(194,225,248,.25),
            transparent
        ),

        radial-gradient(
            1px 1px at 56% 71%,
            rgba(194,225,248,.25),
            transparent
        ),

        radial-gradient(
            1px 1px at 69% 37%,
            rgba(194,225,248,.20),
            transparent
        ),

        radial-gradient(
            1px 1px at 82% 12%,
            rgba(194,225,248,.30),
            transparent
        ),

        radial-gradient(
            1px 1px at 95% 55%,
            rgba(194,225,248,.25),
            transparent
        );
}


/* =========================================================
   ✶ ✡ 漂浮魔法星屑
   共 20 个
========================================================= */

.floating-symbols{
    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:3;
}


.floating-symbol{
    position:absolute;

    font-family:
        "Times New Roman",
        serif;

    color:
        rgba(211,239,255,.98);

    user-select:none;

    font-size:
        var(--size);

    animation:
        symbolFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);

    opacity:
        var(--opacity);

    filter:
        drop-shadow(
            0 0 5px
            rgba(132,215,255,.92)
        )
        drop-shadow(
            0 0 13px
            rgba(76,181,239,.65)
        )
        drop-shadow(
            0 0 25px
            rgba(56,143,201,.35)
        );

    transition:
        color .6s ease,
        filter .6s ease;
}


@keyframes symbolFloat{

    0%{
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(.96);

        opacity:
            calc(var(--opacity) * .72);
    }

    25%{
        opacity:
            calc(var(--opacity) * 1.12);
    }

    50%{
        transform:
            translate3d(
                var(--move-x),
                var(--move-y),
                0
            )
            rotate(
                var(--rotate)
            )
            scale(1.08);

        opacity:
            calc(var(--opacity) * 1.35);
    }

    75%{
        opacity:
            calc(var(--opacity) * 1.05);
    }

    100%{
        transform:
            translate3d(
                calc(var(--move-x) * -0.7),
                calc(var(--move-y) * -1),
                0
            )
            rotate(
                calc(var(--rotate) * -0.7)
            )
            scale(.96);

        opacity:
            calc(var(--opacity) * .72);
    }
}


/* =========================================================
   ★ 魔法星环
========================================================= */

.magic-circle{
    position:absolute;

    width:min(72vw,760px);
    height:min(72vw,760px);

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        1px solid
        rgba(73,143,198,.28);

    box-shadow:

        0 0 50px
        rgba(47,126,184,.08),

        inset
        0 0 60px
        rgba(62,139,194,.04);

    z-index:0;

    pointer-events:none;

    transition:
        border-color .6s ease,
        box-shadow .6s ease;
}


.magic-circle::before,
.magic-circle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;

    transition:
        border-color .6s ease,
        box-shadow .6s ease;
}


.magic-circle::before{
    width:82%;
    height:82%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        0 0 25px
        rgba(47,126,184,.08);
}


.magic-circle::after{
    width:61%;
    height:61%;

    border:
        1px solid
        rgba(91,162,213,.22);

    box-shadow:
        0 0 18px
        rgba(62,139,194,.04);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:absolute;

    left:58px;
    right:58px;

    top:38px;

    z-index:20;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;
}


.logo{
    display:flex;

    align-items:flex-start;

    gap:12px;

    color:#d9edff;

    text-decoration:none;

    transition:
        color .6s ease;
}


.logo-symbol{
    color:
        rgba(137,201,239,.9);

    width:17px;
    height:13px;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    font-size:17px;

    line-height:13px;

    margin:0;

    padding:0;

    text-shadow:

        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);

    flex-shrink:0;

    transition:
        color .6s ease,
        text-shadow .6s ease;
}


.logo > span:last-child{
    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1;
}


.logo-cn{
    display:block;

    height:13px;

    line-height:13px;

    color:#d9edff;

    font-size:13px;

    letter-spacing:3px;

    white-space:nowrap;
}


.logo-en{
    display:block;

    margin-top:5px;

    color:
        rgba(157,204,239,.63);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    line-height:8px;

    letter-spacing:3px;

    white-space:nowrap;
}


/* =========================================================
   右侧控制
========================================================= */

.header-right{
    display:flex;

    align-items:center;

    gap:20px;
}


.back{
    color:
        rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:1px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}


.back:hover{
    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}


.theme-toggle{
    display:flex;

    align-items:center;

    gap:7px;

    height:28px;

    padding:
        0 11px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;

    white-space:nowrap;

    transition:
        color .35s ease,
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}


.theme-toggle:hover{
    color:#d9efff;

    border-color:
        rgba(122,192,235,.62);

    background:
        rgba(8,31,52,.55);

    box-shadow:
        0 0 14px
        rgba(76,151,202,.12);
}


.theme-icon{
    font-size:12px;

    line-height:1;

    letter-spacing:0;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    z-index:5;

    text-align:center;

    padding-top:150px;

    margin-bottom:78px;
}


.hero-en{
    font-family:
        "Cinzel",
        serif;

    font-size:11px;

    letter-spacing:6px;

    color:
        rgba(157,204,239,.63);

    margin-bottom:12px;
}


.hero-title{
    font-family:
        "Cinzel",
        serif;

    font-size:42px;

    font-weight:400;

    letter-spacing:8px;

    color:#dceeff;

    line-height:1.1;

    text-shadow:
        0 0 16px
        rgba(47,126,184,.14);
}


.hero-cn{
    margin-top:15px;

    font-size:13px;

    letter-spacing:5px;

    color:
        rgba(177,207,230,.62);
}


/* =========================================================
   档案画廊
========================================================= */

.gallery{
    position:relative;

    z-index:5;

    width:min(1100px,94%);

    margin:0 auto;
}


.gallery-list{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:28px;

    position:relative;

    z-index:2;
}


/* =========================================================
   画廊卡片
========================================================= */

.gallery-item{
    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        linear-gradient(
            135deg,
            rgba(38,91,137,.18),
            rgba(11,45,75,.45)
        );

    padding:14px;

    transition:
        border-color .35s ease,
        background .35s ease,
        transform .35s ease,
        box-shadow .35s ease;

    cursor:pointer;
}


.gallery-item:hover{
    border-color:
        rgba(122,192,235,.62);

    background:
        linear-gradient(
            135deg,
            rgba(38,91,137,.26),
            rgba(11,45,75,.55)
        );

    transform:
        translateY(-3px);

    box-shadow:

        0 8px 28px
        rgba(0,0,0,.12),

        0 0 25px
        rgba(56,143,201,.12);
}


.gallery-image-wrap{
    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:
        rgba(11,45,75,.22);

    border:
        1px solid
        rgba(91,162,213,.18);

    min-height:180px;
}


.gallery-image{
    display:block;

    width:100%;

    height:auto;

    max-width:100%;

    object-fit:contain;
}


.gallery-info{
    padding:
        17px
        4px
        4px;
}


.gallery-era{
    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(157,204,239,.52);

    margin-bottom:8px;
}


.gallery-title{
    font-family:
        "Cinzel",
        serif;

    font-size:16px;

    font-weight:400;

    letter-spacing:2px;

    color:
        rgba(220,238,255,.92);

    margin-bottom:7px;
}


.gallery-cn{
    font-size:11px;

    letter-spacing:2px;

    color:
        rgba(177,207,230,.62);

    margin-bottom:8px;
}


.gallery-description{
    font-size:10px;

    line-height:1.9;

    letter-spacing:1px;

    color:
        rgba(177,207,230,.45);
}


/* =========================================================
   空白提示
========================================================= */

.empty-gallery{
    grid-column:1 / -1;

    text-align:center;

    padding:50px 20px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(11,45,75,.20);

    color:
        rgba(177,207,230,.48);

    font-size:11px;

    letter-spacing:2px;
}


.empty-gallery-en{
    display:block;

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:9px;

    color:
        rgba(157,204,239,.45);
}


/* =========================================================
   图片放大层
========================================================= */

.lightbox{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:50px;

    background:
        rgba(6,20,38,.86);

    backdrop-filter:blur(5px);

    z-index:100;
}


.lightbox.active{
    display:flex;
}


.lightbox-image{
    max-width:90vw;

    max-height:85vh;

    width:auto;

    height:auto;

    object-fit:contain;

    box-shadow:
        0 0 40px
        rgba(47,126,184,.18);

    border:
        1px solid
        rgba(122,192,235,.25);
}


.lightbox-close{
    position:absolute;

    top:28px;
    right:35px;

    color:
        rgba(210,235,248,.7);

    font-family:
        "Cinzel",
        serif;

    font-size:25px;

    font-weight:400;

    cursor:pointer;

    transition:.3s;
}


.lightbox-close:hover{
    color:#e5f5ff;

    transform:rotate(90deg);
}


/* =========================================================
   页脚
========================================================= */

.footer{
    position:relative;

    z-index:5;

    text-align:center;

    margin-top:100px;

    font-family:
        "Cinzel",

    font-size:8px;

    letter-spacing:4px;

<script>

/* =========================================================
   画廊资料
========================================================= */

const galleryItems = [

    /*
    
    {
        image: "images/ilina.jpg",
        era: "CHARACTER ARCHIVE",
        title: "ILINA",
        cn: "伊莉娜",
        description: "雪山的神女。"
    },

    {
        image: "images/example.png",
        era: "WORLD ARCHIVE",
        title: "EXAMPLE",
        cn: "示例档案",
        description: "这里填写图片说明。"
    }

    */

];


const galleryList =
    document.getElementById("galleryList");


function renderGallery(){

    galleryList.innerHTML = "";


    if(galleryItems.length === 0){

        galleryList.innerHTML = `

            <div class="empty-gallery">

                <span class="empty-gallery-en">
                    ARCHIVE EMPTY
                </span>

                暂无档案画廊记录

            </div>

        `;

        return;
    }


    galleryItems.forEach(
        (item)=>{

            const card =
                document.createElement("div");


            card.className =
                "gallery-item";


            card.innerHTML = `

                <div class="gallery-image-wrap">

                    <img
                        class="gallery-image"
                        src="${item.image}"
                        alt="${item.title || ""}"
                        loading="lazy"
                    >

                </div>


                <div class="gallery-info">

                    ${
                        item.era
                        ?
                        `<div class="gallery-era">
                            ${item.era}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.title
                        ?
                        `<div class="gallery-title">
                            ${item.title}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.cn
                        ?
                        `<div class="gallery-cn">
                            ${item.cn}
                        </div>`
                        :
                        ""
                    }


                    ${
                        item.description
                        ?
                        `<div class="gallery-description">
                            ${item.description}
                        </div>`
                        :
                        ""
                    }

                </div>

            `;


            galleryList.appendChild(card);


            const image =
                card.querySelector(
                    ".gallery-image"
                );


            image.addEventListener(
                "click",
                ()=>{

                    lightboxImage.src =
                        item.image;

                    lightboxImage.alt =
                        item.title || "";

                    lightbox.classList.add(
                        "active"
                    );

                }
            );

        }
    );

}


renderGallery();


/* =========================================================
   图片放大层
========================================================= */

const lightbox =
    document.getElementById("lightbox");


const lightboxImage =
    document.getElementById("lightboxImage");


const lightboxClose =
    document.getElementById("lightboxClose");


lightboxClose.addEventListener(
    "click",
    ()=>{

        lightbox.classList.remove(
            "active"
        );

        lightboxImage.src = "";

    }
);


lightbox.addEventListener(
    "click",
    (event)=>{

        if(event.target === lightbox){

            lightbox.classList.remove(
                "active"
            );

            lightboxImage.src = "";

        }

    }
);


document.addEventListener(
    "keydown",
    (event)=>{

        if(event.key === "Escape"){

            lightbox.classList.remove(
                "active"
            );

            lightboxImage.src = "";

        }

    }
);


/* =========================================================
   日间 / 夜间模式
========================================================= */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


const themeIcon =
    document.getElementById(
        "themeIcon"
    );


const themeText =
    document.getElementById(
        "themeText"
    );


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day"
        );

        themeIcon.textContent =
            "☀";

        themeText.textContent =
            "DAY";

    }else{

        document.body.classList.remove(
            "day"
        );

        themeIcon.textContent =
            "☾";

        themeText.textContent =
            "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem(
        "seyami-theme"
    );


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList.contains(
                "day"
            );


        const nextTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );


        applyTheme(
            nextTheme
        );

    }
);

</script>
