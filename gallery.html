<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 档案画廊</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #061426;
    --bg-deep: #030b16;
    --text: #dcecff;
    --text-soft: #9eb5d1;
    --line: rgba(151, 190, 232, .24);
    --line-bright: rgba(173, 210, 255, .48);
    --accent: #b9d7ff;
    --card-bg: rgba(10, 29, 52, .78);
    --button-bg: rgba(12, 34, 59, .78);
    --watermark: rgba(225, 239, 255, .34);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    background:
        radial-gradient(
            ellipse at 50% 35%,
            rgba(24, 57, 91, .2),
            transparent 55%
        ),
        var(--bg);
    font-family: "Noto Serif SC", serif;
    font-weight: 300;
    transition: background-color .3s, color .3s;
}

body.day-mode {
    --bg: #eaf0f7;
    --bg-deep: #dfe8f2;
    --text: #263b54;
    --text-soft: #637b96;
    --line: rgba(66, 101, 142, .25);
    --line-bright: rgba(66, 101, 142, .45);
    --accent: #496b95;
    --card-bg: rgba(255, 255, 255, .78);
    --button-bg: rgba(255, 255, 255, .82);
    --watermark: rgba(255, 255, 255, .52);

    background:
        radial-gradient(
            ellipse at 50% 35%,
            rgba(194, 211, 235, .3),
            transparent 55%
        ),
        var(--bg);
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

button {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

/* 星空 */

.stars,
.micro-stars,
.arcane-stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.stars {
    z-index: 0;
}

.micro-stars {
    z-index: 0;
    opacity: .5;
}

.arcane-stars {
    z-index: 0;
    opacity: .35;
}

.star {
    position: absolute;
    color: #d9eaff;
    animation: twinkle 4s ease-in-out infinite;
    user-select: none;
}

.micro-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #d9eaff;
    animation: twinkle 5s ease-in-out infinite;
}

.arcane-star {
    position: absolute;
    color: #9bbde5;
    font-family: "Cinzel", serif;
    animation: twinkle 6s ease-in-out infinite;
}

body.day-mode .star,
body.day-mode .arcane-star {
    color: #738eaf;
}

body.day-mode .micro-star {
    background: #738eaf;
}

@keyframes twinkle {
    0%, 100% {
        opacity: .25;
    }

    50% {
        opacity: .85;
    }
}

/* 魔法圆环 */

.magic-circle {
    position: fixed;
    width: min(72vw, 760px);
    aspect-ratio: 1;
    top: 47%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: .55;
}

.magic-circle::before,
.magic-circle::after {
    content: "";
    position: absolute;
    border: 1px solid var(--line);
    border-radius: 50%;
    inset: 9%;
}

.magic-circle::after {
    inset: 19.5%;
}

.magic-circle .magic-line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 1px;
    background: var(--line);
    transform: translate(-50%, -50%);
}

.magic-circle .magic-line:nth-child(2) {
    transform: translate(-50%, -50%) rotate(60deg);
}

.magic-circle .magic-line:nth-child(3) {
    transform: translate(-50%, -50%) rotate(-60deg);
}

body.day-mode .magic-circle {
    opacity: .35;
}

/* 页面框架 */

.page-frame {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 38px 58px 70px;
}

.page-frame::before {
    content: "";
    position: fixed;
    inset: 17px;
    border: 1px solid var(--line);
    pointer-events: none;
    z-index: -1;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    position: relative;
    z-index: 2;
}

.logo {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
}

.logo-cn {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: 400;
}

.logo-en {
    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 3px;
    opacity: .72;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-link,
.theme-toggle {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 36px;
    padding: 8px 15px;
    border: 1px solid var(--line);
    background: var(--button-bg);
    color: var(--text);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .25s, border-color .25s;
}

.back-link:hover,
.theme-toggle:hover {
    border-color: var(--line-bright);
    background: var(--card-bg);
}

/* 标题 */

.page-title {
    position: relative;
    z-index: 1;
    text-align: center;
    margin: 66px 0 16px;
}

.page-title h1 {
    margin: 0;
    font-family: "Cinzel", serif;
    font-size: clamp(30px, 4.5vw, 49px);
    font-weight: 400;
    letter-spacing: 8px;
}

.page-title p {
    margin: 14px 0 0;
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 5px;
}

.title-divider {
    width: 90px;
    height: 1px;
    margin: 24px auto 0;
    background: var(--line-bright);
}

/* 画廊 */

.gallery-container {
    position: relative;
    z-index: 1;
    max-width: 1250px;
    margin: 45px auto 0;
}

.gallery-list {
    column-count: 3;
    column-gap: 24px;
}

.gallery-item {
    display: inline-block;
    width: 100%;
    margin: 0 0 24px;
    padding: 10px;
    break-inside: avoid;
    border: 1px solid var(--line);
    background: var(--card-bg);
    vertical-align: top;
    transition:
        border-color .3s,
        transform .3s,
        background .3s;
}

.gallery-item:hover {
    border-color: var(--line-bright);
    transform: translateY(-3px);
}

.gallery-image-wrap {
    position: relative;
    overflow: hidden;
    width: 100%;
    background: rgba(0, 0, 0, .15);
    isolation: isolate;
}

.gallery-image {
    display: block;
    width: 100%;
    height: auto;
    min-height: 100px;
    object-fit: contain;
    cursor: zoom-in;

    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

/* 重复斜向水印 */

.watermark-pattern {
    position: absolute;
    inset: -25%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    overflow: hidden;
    transform: rotate(-25deg);
    transform-origin: center;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
}

.watermark-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 30px;
    width: 150%;
    white-space: nowrap;
}

.watermark-row span {
    color: var(--watermark);
    font-family: "Cinzel", "Noto Serif SC", serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .28);
}

/* 右下角署名 */

.watermark-signature {
    position: absolute;
    right: 9px;
    bottom: 9px;
    z-index: 3;
    max-width: calc(100% - 18px);
    padding: 5px 8px;
    color: rgba(255, 255, 255, .92);
    background: rgba(3, 13, 27, .66);
    border: 1px solid rgba(220, 236, 255, .32);
    font-family: "Cinzel", "Noto Serif SC", serif;
    font-size: 9px;
    letter-spacing: 1px;
    line-height: 1.6;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
}

.gallery-caption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 11px 3px 2px;
    color: var(--text-soft);
    font-size: 10px;
    letter-spacing: 1px;
}

.gallery-caption span {
    overflow-wrap: anywhere;
}

.delete-button {
    display: none;
    flex-shrink: 0;
    border: 1px solid rgba(230, 119, 119, .42);
    background: rgba(95, 25, 35, .28);
    color: #ffcaca;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1px;
}

.delete-button:hover {
    background: rgba(130, 35, 45, .5);
}

body.is-gallery-admin .delete-button {
    display: inline-flex;
}

/* 空状态 */

.empty-gallery {
    display: none;
    padding: 70px 20px;
    border: 1px solid var(--line);
    text-align: center;
    color: var(--text-soft);
    font-size: 13px;
    letter-spacing: 2px;
    background: var(--card-bg);
}

.empty-gallery.show {
    display: block;
}

.empty-symbol {
    margin-bottom: 18px;
    font-family: "Cinzel", serif;
    font-size: 34px;
    opacity: .65;
}

/* 加载状态 */

.loading-message {
    padding: 50px 15px;
    text-align: center;
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 3px;
}

/* 图片放大查看 */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 35px;
    background: rgba(1, 7, 16, .94);
}

.lightbox.active {
    display: flex;
}

.lightbox-stage {
    position: relative;
    display: inline-block;
    max-width: min(92vw, 1200px);
    max-height: 88vh;
    overflow: hidden;
    isolation: isolate;
}

.lightbox-image {
    display: block;
    max-width: min(92vw, 1200px);
    max-height: 88vh;
    width: auto;
    height: auto;
    object-fit: contain;
    cursor: default;

    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.lightbox-stage .watermark-pattern {
    inset: -20%;
}

.lightbox-stage .watermark-row span {
    font-size: 14px;
    letter-spacing: 3px;
}

.lightbox-stage .watermark-signature {
    font-size: 11px;
    padding: 7px 11px;
}

.lightbox-close {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 1002;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(220, 236, 255, .4);
    background: rgba(5, 20, 38, .7);
    color: #fff;
    font-size: 25px;
    font-weight: 300;
    cursor: pointer;
}

.lightbox-close:hover {
    background: rgba(35, 60, 90, .8);
}

.lightbox-tip {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(220, 236, 255, .55);
    font-size: 10px;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
}

/* 页脚 */

.page-footer {
    position: relative;
    z-index: 1;
    margin-top: 65px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--text-soft);
    text-align: center;
    font-family: "Cinzel", "Noto Serif SC", serif;
    font-size: 10px;
    letter-spacing: 3px;
}

/* 手机端 */

@media (max-width: 900px) {
    .page-frame {
        padding: 28px 30px 55px;
    }

    .gallery-list {
        column-count: 2;
        column-gap: 18px;
    }

    .gallery-item {
        margin-bottom: 18px;
    }

    .page-title {
        margin-top: 55px;
    }
}

@media (max-width: 560px) {
    .page-frame {
        padding: 24px 20px 45px;
    }

    .page-frame::before {
        inset: 8px;
    }

    .page-header {
        gap: 10px;
    }

    .logo-cn {
        font-size: 13px;
        letter-spacing: 2px;
    }

    .logo-en {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .header-actions {
        gap: 6px;
    }

    .back-link,
    .theme-toggle {
        min-height: 32px;
        padding: 6px 9px;
        font-size: 10px;
        letter-spacing: 0;
    }

    .page-title {
        margin-top: 48px;
    }

    .page-title h1 {
        font-size: 30px;
        letter-spacing: 5px;
    }

    .page-title p {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .gallery-container {
        margin-top: 30px;
    }

    .gallery-list {
        column-count: 2;
        column-gap: 12px;
    }

    .gallery-item {
        padding: 6px;
        margin-bottom: 12px;
    }

    .gallery-caption {
        font-size: 9px;
        flex-wrap: wrap;
    }

    .watermark-row {
        gap: 18px;
    }

    .watermark-row span {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .watermark-signature {
        right: 5px;
        bottom: 5px;
        padding: 4px 5px;
        font-size: 7px;
        letter-spacing: .5px;
    }

    .lightbox {
        padding: 12px;
    }

    .lightbox-stage,
    .lightbox-image {
        max-width: 96vw;
        max-height: 84vh;
    }

    .lightbox-stage .watermark-row span {
        font-size: 9px;
        letter-spacing: 1px;
    }

    .lightbox-stage .watermark-signature {
        font-size: 8px;
    }

    .lightbox-close {
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
    }

    .lightbox-tip {
        bottom: 10px;
        font-size: 9px;
        letter-spacing: 1px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<!-- 星空背景 -->
<div class="stars" id="stars"></div>
<div class="micro-stars" id="micro-stars"></div>
<div class="arcane-stars" id="arcane-stars"></div>

<!-- 魔法圆环 -->
<div class="magic-circle" aria-hidden="true">
    <div class="magic-line"></div>
    <div class="magic-line"></div>
    <div class="magic-line"></div>
</div>

<div class="page-frame">

    <header class="page-header">

        <a class="logo" href="index.html" aria-label="返回塞垭弥大陆档案馆首页">
            <span class="logo-cn">塞垭弥大陆档案馆</span>
            <span class="logo-en">SEYAMI ARCHIVE</span>
        </a>

        <div class="header-actions">
            <a class="back-link" href="archive.html">返回档案</a>
            <button class="theme-toggle" id="themeToggle" type="button">
                ☼ 昼夜
            </button>
        </div>

    </header>

    <section class="page-title">
        <h1>GALLERY</h1>
        <p>档案画廊 · VISUAL ARCHIVE</p>
        <div class="title-divider"></div>
    </section>

    <main class="gallery-container">

        <div class="loading-message" id="loadingMessage">
            正在读取档案……
        </div>

        <div class="gallery-list" id="galleryList"></div>

        <div class="empty-gallery" id="emptyGallery">
            <div class="empty-symbol">✧</div>
            <div>这里暂时还没有收藏的画作</div>
        </div>

    </main>

    <footer class="page-footer">
        SEYAMI ARCHIVE · THE WORLD OF SEYAMI
    </footer>

</div>

<!-- 图片放大查看 -->
<div class="lightbox" id="lightbox" aria-hidden="true">

    <button
        class="lightbox-close"
        id="lightboxClose"
        type="button"
        aria-label="关闭图片"
    >×</button>

    <div class="lightbox-stage" id="lightboxStage">

        <img
            class="lightbox-image"
            id="lightboxImage"
            src=""
            alt="塞垭弥大陆档案馆画廊图片"
            draggable="false"
        >

        <div class="watermark-pattern" aria-hidden="true"></div>

        <div class="watermark-signature" aria-hidden="true">
            ✦ SEYAMI ARCHIVE
        </div>

    </div>

    <div class="lightbox-tip">
        SEYAMI ARCHIVE · 塞垭弥大陆档案馆
    </div>

</div>

<script>
/* ==============================
   Supabase 配置
============================== */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* ==============================
   页面元素
============================== */

const galleryList = document.getElementById("galleryList");
const loadingMessage = document.getElementById("loadingMessage");
const emptyGallery = document.getElementById("emptyGallery");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxStage = document.getElementById("lightboxStage");
const lightboxClose = document.getElementById("lightboxClose");

let isGalleryAdmin = false;

/* ==============================
   生成星空
============================== */

function createStars() {
    const stars = document.getElementById("stars");
    const microStars = document.getElementById("micro-stars");
    const arcaneStars = document.getElementById("arcane-stars");

    stars.innerHTML = "";
    microStars.innerHTML = "";
    arcaneStars.innerHTML = "";

    for (let i = 0; i < 28; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = i % 3 === 0 ? "✦" : "✶";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.fontSize = (8 + Math.random() * 9) + "px";
        star.style.animationDelay = (Math.random() * 5) + "s";
        star.style.animationDuration = (3 + Math.random() * 5) + "s";

        stars.appendChild(star);
    }

    for (let i = 0; i < 65; i++) {
        const star = document.createElement("span");
        star.className = "micro-star";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = (Math.random() * 6) + "s";

        microStars.appendChild(star);
    }

    for (let i = 0; i < 9; i++) {
        const star = document.createElement("span");
        star.className = "arcane-star";
        star.textContent = i % 2 === 0 ? "✡" : "✧";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.fontSize = (10 + Math.random() * 9) + "px";
        star.style.animationDelay = (Math.random() * 5) + "s";

        arcaneStars.appendChild(star);
    }
}

createStars();

/* ==============================
   昼夜模式
============================== */

const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
    document.body.classList.toggle("day-mode", theme === "day");

    themeToggle.textContent =
        theme === "day" ? "☾ 夜间" : "☼ 昼夜";
}

const savedTheme = localStorage.getItem("seyami-theme") || "night";
applyTheme(savedTheme);

themeToggle.addEventListener("click", () => {
    const isDay = document.body.classList.contains("day-mode");
    const nextTheme = isDay ? "night" : "day";

    localStorage.setItem("seyami-theme", nextTheme);
    applyTheme(nextTheme);
});

/* ==============================
   水印
============================== */

function createWatermarkPattern(container) {
    container.replaceChildren();

    const watermarkText = "✦ 塞垭弥大陆档案馆 · SEYAMI ARCHIVE ✦";

    for (let i = 0; i < 7; i++) {
        const row = document.createElement("div");
        row.className = "watermark-row";

        for (let j = 0; j < 3; j++) {
            const span = document.createElement("span");
            span.textContent = watermarkText;
            row.appendChild(span);
        }

        container.appendChild(row);
    }
}

function addCardWatermark(wrap) {
    const pattern = document.createElement("div");
    pattern.className = "watermark-pattern";
    pattern.setAttribute("aria-hidden", "true");

    createWatermarkPattern(pattern);

    const signature = document.createElement("div");
    signature.className = "watermark-signature";
    signature.textContent = "✦ SEYAMI ARCHIVE";

    wrap.appendChild(pattern);
    wrap.appendChild(signature);
}

createWatermarkPattern(
    lightboxStage.querySelector(".watermark-pattern")
);

/* ==============================
   管理员身份检查
============================== */

async function checkGalleryAdmin(sessionFromAuth = undefined) {
    try {
        let session = sessionFromAuth;

        if (session === undefined) {
            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error) throw error;

            session = data.session;
        }

        if (!session || !session.user) {
            isGalleryAdmin = false;
            document.body.classList.remove("is-gallery-admin");
            return false;
        }

        const { data, error } = await supabaseClient.rpc("is_admin");

        if (error) {
            console.error("管理员权限检查失败：", error);
            isGalleryAdmin = false;
            document.body.classList.remove("is-gallery-admin");
            return false;
        }

        isGalleryAdmin = data === true;

        document.body.classList.toggle(
            "is-gallery-admin",
            isGalleryAdmin
        );

        return isGalleryAdmin;

    } catch (error) {
        console.error("身份检查失败：", error);

        isGalleryAdmin = false;
        document.body.classList.remove("is-gallery-admin");

        return false;
    }
}

/* ==============================
   加载画廊
============================== */

async function loadGallery() {
    loadingMessage.style.display = "block";
    loadingMessage.textContent = "正在读取档案……";

    galleryList.replaceChildren();
    emptyGallery.classList.remove("show");

    try {
        const { data, error } = await supabaseClient
            .from("gallery_images")
            .select("id,image_url,created_at")
            .order("created_at", { ascending: false });

        if (error) throw error;

        loadingMessage.style.display = "none";

        if (!data || data.length === 0) {
            emptyGallery.classList.add("show");
            return;
        }

        for (const item of data) {
            if (!item.image_url) continue;

            const card = document.createElement("article");
            card.className = "gallery-item";

            const wrap = document.createElement("div");
            wrap.className = "gallery-image-wrap";

            const img = document.createElement("img");
            img.className = "gallery-image";
            img.src = item.image_url;
            img.alt = "塞垭弥大陆档案馆画廊图片";
            img.loading = "lazy";
            img.draggable = false;
            img.decoding = "async";

            img.addEventListener("click", () => {
                openLightbox(item.image_url);
            });

            img.addEventListener("contextmenu", event => {
                event.preventDefault();
            });

            wrap.appendChild(img);
            addCardWatermark(wrap);

            const caption = document.createElement("div");
            caption.className = "gallery-caption";

            const date = document.createElement("span");

            if (item.created_at) {
                const parsedDate = new Date(item.created_at);

                date.textContent = Number.isNaN(parsedDate.getTime())
                    ? "SEYAMI ARCHIVE"
                    : parsedDate.toLocaleDateString("zh-CN");
            } else {
                date.textContent = "SEYAMI ARCHIVE";
            }

            caption.appendChild(date);

            if (isGalleryAdmin) {
                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.type = "button";
                deleteButton.textContent = "删除";

                deleteButton.addEventListener("click", async event => {
                    event.stopPropagation();
                    await deleteGalleryImage(item);
                });

                caption.appendChild(deleteButton);
            }

            card.appendChild(wrap);
            card.appendChild(caption);
            galleryList.appendChild(card);
        }

        if (galleryList.children.length === 0) {
            emptyGallery.classList.add("show");
        }

    } catch (error) {
        console.error("读取画廊失败：", error);

        loadingMessage.style.display = "block";
        loadingMessage.textContent =
            "档案读取失败，请检查网络或稍后再试。";
    }
}

/* ==============================
   图片放大查看
============================== */

function openLightbox(src) {
    lightboxImage.src = src;
    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");

    document.body.style.overflow = "hidden";
}

function closeLightbox() {
    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");

    lightboxImage.src = "";
    document.body.style.overflow = "";
}

lightboxClose.addEventListener("click", closeLightbox);

lightbox.addEventListener("click", event => {
    if (
        event.target === lightbox ||
        event.target === lightboxStage
    ) {
        closeLightbox();
    }
});

lightboxImage.addEventListener("contextmenu", event => {
    event.preventDefault();
});

lightboxImage.addEventListener("dragstart", event => {
    event.preventDefault();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeLightbox();
    }
});

/* ==============================
   基础防直接保存措施
============================== */

document.addEventListener("contextmenu", event => {
    if (
        event.target.closest(".gallery-image-wrap") ||
        event.target.closest(".lightbox-stage")
    ) {
        event.preventDefault();
    }
});

document.addEventListener("dragstart", event => {
    if (
        event.target.closest(".gallery-image-wrap") ||
        event.target.closest(".lightbox-stage")
    ) {
        event.preventDefault();
    }
});

/*
  注意：
  这些措施只能增加直接保存图片的难度，
  不能阻止截图、开发者工具或直接访问公开图片地址。
*/

/* ==============================
   删除图片
============================== */

function getStorageFileInfo(publicUrl) {
    try {
        const url = new URL(publicUrl);

        const marker = "/storage/v1/object/public/";
        const markerIndex = url.pathname.indexOf(marker);

        if (markerIndex === -1) {
            return null;
        }

        const remainder = url.pathname.slice(
            markerIndex + marker.length
        );

        const firstSlash = remainder.indexOf("/");

        if (firstSlash === -1) {
            return null;
        }

        const bucket = remainder.slice(0, firstSlash);

        const encodedPath = remainder.slice(firstSlash + 1);

        const filePath = encodedPath
            .split("/")
            .map(part => decodeURIComponent(part))
            .join("/");

        return {
            bucket,
            filePath
        };

    } catch (error) {
        console.error("无法解析图片地址：", error);
        return null;
    }
}

async function deleteStorageFile(publicUrl) {
    const info = getStorageFileInfo(publicUrl);

    if (!info) {
        throw new Error(
            "无法识别图片的存储地址，请检查图片 URL。"
        );
    }

    const { error } = await supabaseClient
        .storage
        .from(info.bucket)
        .remove([info.filePath]);

    if (error) {
        throw error;
    }
}

async function deleteGalleryImage(item) {
    if (!isGalleryAdmin) {
        alert("只有管理员可以删除画廊图片。");
        return;
    }

    const confirmed = confirm(
        "确定要删除这张图片吗？\n\n删除后无法通过画廊恢复。"
    );

    if (!confirmed) return;

    try {
        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !userData.user) {
            throw new Error("登录状态已失效，请重新登录。");
        }

        const { data: adminResult, error: adminError } =
            await supabaseClient.rpc("is_admin");

        if (adminError || adminResult !== true) {
            throw new Error("当前账号没有管理员权限。");
        }

        /*
          先删除数据库记录，确认成功后再尝试删除存储文件。
          这样即使存储删除失败，画廊记录也不会继续显示。
        */

        const { error: rowError } = await supabaseClient
            .from("gallery_images")
            .delete()
            .eq("id", item.id);

        if (rowError) {
            throw rowError;
        }

        try {
            await deleteStorageFile(item.image_url);
        } catch (storageError) {
            console.error("图片记录已删除，但存储文件删除失败：", storageError);

            alert(
                "画廊记录已删除，但存储文件可能仍然存在。\n" +
                "请检查 Supabase Storage 权限。"
            );

            await loadGallery();
            return;
        }

        alert("图片已删除。");
        await loadGallery();

    } catch (error) {
        console.error("删除图片失败：", error);

        alert(
            "删除失败： " +
            (error.message || "发生未知错误")
        );
    }
}

/* ==============================
   初始化与登录状态变化
============================== */

async function initGallery() {
    await checkGalleryAdmin();
    await loadGallery();
}

supabaseClient.auth.onAuthStateChange(
    async (_event, session) => {
        const previousAdminStatus = isGalleryAdmin;

        await checkGalleryAdmin(session);

        if (previousAdminStatus !== isGalleryAdmin) {
            await loadGallery();
        }
    }
);

initGallery();
</script>
