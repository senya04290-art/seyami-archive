
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 档案画廊</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #061426;
    --bg-soft: rgba(9, 28, 49, 0.88);
    --text: #dcecff;
    --text-soft: #9fb8d5;
    --line: rgba(173, 207, 244, 0.22);
    --line-strong: rgba(173, 207, 244, 0.42);
    --accent: #b8d5f4;
    --card-bg: rgba(9, 27, 47, 0.72);
    --shadow: rgba(0, 0, 0, 0.28);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif SC", serif;
    transition: background-color 0.3s ease, color 0.3s ease;
}

body.day {
    --bg: #eaf1f8;
    --bg-soft: rgba(248, 251, 255, 0.92);
    --text: #243c56;
    --text-soft: #637c98;
    --line: rgba(72, 106, 143, 0.24);
    --line-strong: rgba(72, 106, 143, 0.42);
    --accent: #5e7fa4;
    --card-bg: rgba(250, 252, 255, 0.84);
    --shadow: rgba(47, 71, 97, 0.12);
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

button {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

/* 背景星点 */
.stars,
.micro-stars,
.arcane-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.stars {
    z-index: 0;
}

.micro-stars {
    z-index: 0;
    opacity: 0.56;
}

.arcane-stars {
    z-index: 0;
    opacity: 0.32;
}

.star {
    position: absolute;
    color: var(--accent);
    user-select: none;
    line-height: 1;
    animation: starFloat 7s ease-in-out infinite alternate;
}

.micro-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.65;
}

.arcane-star {
    position: absolute;
    color: var(--accent);
    font-size: 13px;
    animation: starFloat 9s ease-in-out infinite alternate;
}

@keyframes starFloat {
    from {
        transform: translateY(0);
        opacity: 0.36;
    }
    to {
        transform: translateY(-5px);
        opacity: 0.85;
    }
}

/* 背景魔法星环 */
.magic-circle {
    position: fixed;
    width: min(72vw, 760px);
    aspect-ratio: 1;
    left: 50%;
    top: 47%;
    transform: translate(-50%, -50%);
    border: 1px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.44;
}

.magic-circle::before,
.magic-circle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid var(--line);
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.magic-circle::before {
    width: 82%;
    height: 82%;
}

.magic-circle::after {
    width: 61%;
    height: 61%;
}

.magic-circle .circle-cross {
    position: absolute;
    inset: 10%;
    border: 1px solid var(--line);
    transform: rotate(45deg);
}

.magic-circle .circle-cross::before,
.magic-circle .circle-cross::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--line);
    transform: rotate(30deg);
}

.magic-circle .circle-cross::after {
    transform: rotate(60deg);
}

body.day .magic-circle {
    opacity: 0.36;
}

/* 页面布局 */
.page {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    padding: 38px 58px 72px;
}

.header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    position: relative;
    z-index: 5;
}

.brand {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
}

.brand-cn {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    letter-spacing: 0.13em;
    font-weight: 500;
}

.brand-en {
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-soft);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
}

.back-link,
.theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 12px;
    letter-spacing: 0.06em;
    transition: background 0.25s ease, border-color 0.25s ease;
}

.back-link {
    padding: 7px 14px;
}

.theme-toggle {
    min-width: 38px;
    padding: 7px 10px;
    cursor: pointer;
}

.back-link:hover,
.theme-toggle:hover {
    background: var(--card-bg);
    border-color: var(--line-strong);
}

main {
    position: relative;
    z-index: 1;
}

.page-heading {
    text-align: center;
    margin: 78px auto 48px;
}

.page-heading h1 {
    margin: 0;
    font-family: "Cinzel", serif;
    font-weight: 400;
    font-size: clamp(27px, 4vw, 43px);
    letter-spacing: 0.2em;
    line-height: 1.5;
}

.page-heading p {
    margin: 13px 0 0;
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 0.24em;
}

/* 图片画廊 */
.gallery-wrap {
    width: min(1120px, 100%);
    margin: 0 auto;
}

.gallery-list {
    column-count: 3;
    column-gap: 24px;
}

.gallery-item {
    display: inline-block;
    width: 100%;
    margin: 0 0 24px;
    break-inside: avoid;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card-bg);
    box-shadow: 0 10px 28px var(--shadow);
    cursor: pointer;
    transition: border-color 0.25s ease, transform 0.25s ease;
}

.gallery-item:hover {
    border-color: var(--line-strong);
    transform: translateY(-3px);
}

.gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    background: rgba(0, 0, 0, 0.08);
}

/* 图片删除按钮 */
.delete-button {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    display: none;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid rgba(255, 190, 190, 0.48);
    background: rgba(35, 13, 20, 0.82);
    color: #ffe5e5;
    font-size: 12px;
    cursor: pointer;
    backdrop-filter: blur(6px);
}

.delete-button:hover {
    background: rgba(105, 28, 42, 0.92);
    border-color: rgba(255, 190, 190, 0.8);
}

body.is-admin .delete-button {
    display: inline-flex;
}

.empty-gallery {
    display: none;
    padding: 70px 20px;
    text-align: center;
    color: var(--text-soft);
    border: 1px solid var(--line);
    background: var(--card-bg);
    letter-spacing: 0.1em;
    font-size: 13px;
}

.loading-message {
    padding: 42px 20px;
    text-align: center;
    color: var(--text-soft);
    font-size: 13px;
    letter-spacing: 0.12em;
}

/* 图片放大查看 */
.lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(2, 9, 18, 0.92);
    backdrop-filter: blur(8px);
}

.lightbox.open {
    display: flex;
}

.lightbox-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

.lightbox-image {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.28);
}

.lightbox-close {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(220, 236, 255, 0.3);
    background: rgba(5, 18, 32, 0.72);
    color: #dcecff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}

.lightbox-close:hover {
    background: rgba(26, 50, 76, 0.92);
}

.lightbox-hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(220, 236, 255, 0.64);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-align: center;
    white-space: nowrap;
}

/* 页脚 */
.footer {
    position: relative;
    z-index: 1;
    margin: 62px auto 0;
    text-align: center;
    color: var(--text-soft);
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    opacity: 0.78;
}

/* 平板 */
@media (max-width: 900px) {
    .page {
        padding: 30px 30px 58px;
    }

    .gallery-list {
        column-count: 2;
        column-gap: 18px;
    }

    .gallery-item {
        margin-bottom: 18px;
    }

    .page-heading {
        margin-top: 66px;
    }

    .magic-circle {
        width: min(88vw, 680px);
    }
}

/* 手机 */
@media (max-width: 560px) {
    .page {
        padding: 22px 18px 44px;
    }

    .header {
        gap: 12px;
    }

    .brand-cn {
        font-size: 14px;
        letter-spacing: 0.08em;
    }

    .brand-en {
        font-size: 9px;
        letter-spacing: 0.15em;
    }

    .header-actions {
        gap: 8px;
    }

    .back-link {
        padding: 6px 9px;
        font-size: 11px;
    }

    .theme-toggle {
        min-width: 34px;
        padding: 6px 8px;
    }

    .page-heading {
        margin: 58px auto 34px;
    }

    .page-heading h1 {
        font-size: 25px;
        letter-spacing: 0.13em;
    }

    .page-heading p {
        font-size: 10px;
        letter-spacing: 0.16em;
    }

    .gallery-list {
        column-count: 2;
        column-gap: 12px;
    }

    .gallery-item {
        margin-bottom: 12px;
    }

    .delete-button {
        top: 6px;
        right: 6px;
        min-width: 30px;
        height: 30px;
        padding: 0 7px;
        font-size: 11px;
    }

    .magic-circle {
        width: 110vw;
    }

    .lightbox {
        padding: 16px;
    }

    .lightbox-close {
        top: 2px;
        right: 2px;
        width: 38px;
        height: 38px;
    }

    .lightbox-hint {
        bottom: 2px;
        font-size: 10px;
    }

    .footer {
        margin-top: 44px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>
<!-- 背景装饰 -->
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="micro-stars" id="microStars" aria-hidden="true"></div>
<div class="arcane-stars" id="arcaneStars" aria-hidden="true"></div>

<div class="magic-circle" aria-hidden="true">
    <div class="circle-cross"></div>
</div>

<div class="page">
    <header class="header">
        <a class="brand" href="index.html" aria-label="返回塞垭弥大陆档案馆首页">
            <span class="brand-cn">塞垭弥大陆档案馆</span>
            <span class="brand-en">SEYAMI ARCHIVE</span>
        </a>

        <div class="header-actions">
            <a class="back-link" href="archive.html">返回档案</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换昼夜模式">☼</button>
        </div>
    </header>

    <main>
        <section class="page-heading">
            <h1>GALLERY</h1>
            <p>档案画廊 · GALLERY OF SEYAMI</p>
        </section>

        <section class="gallery-wrap" aria-label="档案画廊">
            <div class="loading-message" id="loadingMessage">正在读取档案……</div>
            <div class="gallery-list" id="galleryList"></div>
            <div class="empty-gallery" id="emptyGallery">这里暂时还没有收藏的图像</div>
        </section>
    </main>

    <footer class="footer">
        SEYAMI ARCHIVE · GALLERY
    </footer>
</div>

<!-- 图片放大查看：不再自动叠加水印 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-stage" id="lightboxStage">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭图片">×</button>
        <img class="lightbox-image" id="lightboxImage" alt="画廊图片">
        <div class="lightbox-hint">点击空白处或按 ESC 关闭</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* Supabase 配置：保留原有项目 */
const SUPABASE_URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";
const STORAGE_BUCKET = "gallery-images";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const galleryList = document.getElementById("galleryList");
const loadingMessage = document.getElementById("loadingMessage");
const emptyGallery = document.getElementById("emptyGallery");

const lightbox = document.getElementById("lightbox");
const lightboxStage = document.getElementById("lightboxStage");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxClose = document.getElementById("lightboxClose");

/* 背景星点：使用固定数量，避免持续创建动画 */
function createBackgroundStars() {
    const starsContainer = document.getElementById("stars");
    const microContainer = document.getElementById("microStars");
    const arcaneContainer = document.getElementById("arcaneStars");

    const starSymbols = ["✦", "✶", "✧"];
    const starPositions = [
        [7, 15], [17, 72], [26, 28], [34, 85],
        [43, 12], [55, 68], [64, 33], [73, 82],
        [82, 19], [92, 58], [13, 43], [68, 8]
    ];

    starPositions.forEach((position, index) => {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = starSymbols[index % starSymbols.length];
        star.style.left = position[0] + "%";
        star.style.top = position[1] + "%";
        star.style.fontSize = (9 + (index % 3) * 3) + "px";
        star.style.animationDelay = (index % 5) + "s";
        starsContainer.appendChild(star);
    });

    const microPositions = [
        [5, 23], [12, 61], [21, 10], [29, 48], [37, 19],
        [45, 77], [52, 35], [61, 91], [70, 51], [78, 29],
        [86, 72], [95, 13], [16, 89], [33, 63], [57, 14],
        [74, 94], [89, 42], [40, 39], [3, 79], [97, 84]
    ];

    microPositions.forEach(position => {
        const star = document.createElement("span");
        star.className = "micro-star";
        star.style.left = position[0] + "%";
        star.style.top = position[1] + "%";
        microContainer.appendChild(star);
    });

    const arcanePositions = [
        [9, 50], [24, 17], [39, 91], [58, 24],
        [76, 62], [90, 32], [48, 54], [16, 80]
    ];

    arcanePositions.forEach((position, index) => {
        const star = document.createElement("span");
        star.className = "arcane-star";
        star.textContent = index % 2 === 0 ? "✡" : "✶";
        star.style.left = position[0] + "%";
        star.style.top = position[1] + "%";
        star.style.animationDelay = (index % 4) + "s";
        arcaneContainer.appendChild(star);
    });
}

createBackgroundStars();

/* 昼夜模式 */
const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
    const isDay = theme === "day";
    document.body.classList.toggle("day", isDay);
    themeToggle.textContent = isDay ? "☾" : "☼";
    themeToggle.setAttribute(
        "aria-label",
        isDay ? "切换至夜间模式" : "切换至日间模式"
    );
}

themeToggle.addEventListener("click", () => {
    const nextTheme = document.body.classList.contains("day") ? "night" : "day";
    applyTheme(nextTheme);

    try {
        localStorage.setItem("seyami-gallery-theme", nextTheme);
    } catch (error) {
        /* 浏览器不允许本地存储时，仍可正常切换 */
    }
});

try {
    applyTheme(localStorage.getItem("seyami-gallery-theme") || "night");
} catch (error) {
    applyTheme("night");
}

/* 检查当前访问者是否为管理员 */
async function checkAdminStatus() {
    try {
        const { data, error } = await supabaseClient.rpc("is_admin");

        if (error) {
            console.warn("管理员状态检查未成功：", error.message);
            document.body.classList.remove("is-admin");
            return false;
        }

        const isAdmin = data === true;
        document.body.classList.toggle("is-admin", isAdmin);
        return isAdmin;
    } catch (error) {
        console.warn("无法检查管理员状态：", error);
        document.body.classList.remove("is-admin");
        return false;
    }
}

/* 从数据库读取画廊 */
async function loadGallery() {
    loadingMessage.style.display = "block";
    emptyGallery.style.display = "none";
    galleryList.innerHTML = "";

    const { data, error } = await supabaseClient
        .from("gallery_images")
        .select("id,image_url,created_at")
        .order("created_at", { ascending: false });

    loadingMessage.style.display = "none";

    if (error) {
        console.error("读取画廊失败：", error);
        emptyGallery.textContent = "暂时无法读取画廊，请稍后再试";
        emptyGallery.style.display = "block";
        return;
    }

    if (!data || data.length === 0) {
        emptyGallery.textContent = "这里暂时还没有收藏的图像";
        emptyGallery.style.display = "block";
        return;
    }

    data.forEach(item => {
        if (!item.image_url) return;

        const card = document.createElement("div");
        card.className = "gallery-item";

        const image = document.createElement("img");
        image.src = item.image_url;
        image.alt = "塞垭弥大陆档案馆收藏图片";
        image.loading = "lazy";
        image.decoding = "async";

        image.addEventListener("click", () => {
            openLightbox(item.image_url);
        });

        image.addEventListener("error", () => {
            image.alt = "图片加载失败";
        });

        card.appendChild(image);

        /* 删除按钮仅在管理员验证通过后显示 */
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "删除";
        deleteButton.setAttribute("aria-label", "删除这张图片");

        deleteButton.addEventListener("click", async event => {
            event.stopPropagation();
            await deleteGalleryImage(item);
        });

        card.appendChild(deleteButton);
        galleryList.appendChild(card);
    });
}

/* 删除画廊图片 */
async function deleteGalleryImage(item) {
    const confirmed = window.confirm(
        "确定要删除这张图片吗？\n此操作无法撤销。"
    );

    if (!confirmed) return;

    const deleteButtons = document.querySelectorAll(".delete-button");
    deleteButtons.forEach(button => {
        button.disabled = true;
    });

    try {
        /*
         * 先尝试从 Supabase Storage 删除对应文件。
         * 再删除数据库记录。
         */
        const imageUrl = item.image_url || "";
        let storagePath = "";

        try {
            const url = new URL(imageUrl);
            const marker = "/storage/v1/object/public/" + STORAGE_BUCKET + "/";
            const markerIndex = url.pathname.indexOf(marker);

            if (markerIndex !== -1) {
                storagePath = decodeURIComponent(
                    url.pathname.slice(markerIndex + marker.length)
                );
            }
        } catch (error) {
            console.warn("无法解析图片地址：", error);
        }

        if (storagePath) {
            const { error: storageError } = await supabaseClient
                .storage
                .from(STORAGE_BUCKET)
                .remove([storagePath]);

            if (storageError) {
                console.warn("Storage 文件删除未成功：", storageError.message);
            }
        }

        const { error: databaseError } = await supabaseClient
            .from("gallery_images")
            .delete()
            .eq("id", item.id);

        if (databaseError) {
            throw databaseError;
        }

        const card = [...document.querySelectorAll(".gallery-item")]
            .find(element => {
                const img = element.querySelector("img");
                return img && img.src === imageUrl;
            });

        if (card) card.remove();

        if (!galleryList.querySelector(".gallery-item")) {
            emptyGallery.textContent = "这里暂时还没有收藏的图像";
            emptyGallery.style.display = "block";
        }

        window.alert("图片已从画廊记录中删除。");
    } catch (error) {
        console.error("删除图片失败：", error);
        window.alert("删除失败，请检查管理员权限和数据库策略后重试。");
        await loadGallery();
    } finally {
        deleteButtons.forEach(button => {
            button.disabled = false;
        });
    }
}

/* 打开图片：原图显示，不再自动叠加任何水印 */
function openLightbox(imageUrl) {
    lightboxImage.src = imageUrl;
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
}

function closeLightbox() {
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden", "true");
    lightboxImage.removeAttribute("src");
    document.body.style.overflow = "";
}

lightboxClose.addEventListener("click", event => {
    event.stopPropagation();
    closeLightbox();
});

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

lightboxStage.addEventListener("click", event => {
    if (event.target === lightboxStage) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
    }
});

/* 初始化 */
async function initializeGallery() {
    await checkAdminStatus();
    await loadGallery();
}

initializeGallery();
</script>
