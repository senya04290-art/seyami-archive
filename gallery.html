<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 档案画廊</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ================================
   基础
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(45,105,165,.20),
            transparent 52%
        ),
        #061a30;

    color:#c9dbea;

    font-family:"Noto Serif SC",serif;

    transition:
        background .5s ease,
        color .5s ease;
}


/* ================================
   星点
================================ */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1px),
        radial-gradient(circle,rgba(145,195,235,.35) 1px,transparent 1px);

    background-size:
        180px 180px,
        260px 260px;

    background-position:
        20px 30px,
        90px 120px;

    opacity:.35;
}


/* ================================
   微小星点
================================ */

.micro-stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background-image:
        radial-gradient(circle,rgba(180,220,255,.45) .7px,transparent .8px);

    background-size:95px 95px;

    opacity:.25;
}


/* ================================
   漂浮魔法符号
================================ */

.floating-symbols{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.floating-symbol{
    position:absolute;

    font-family:"Cinzel",serif;

    color:rgba(145,200,235,.18);

    text-shadow:
        0 0 12px rgba(90,175,225,.12);

    user-select:none;

    animation:
        symbolFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:var(--delay);
}

@keyframes symbolFloat{

    0%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);

        opacity:.08;
    }

    25%{
        opacity:.18;
    }

    50%{
        transform:
            translate3d(12px,-24px,0)
            rotate(8deg);

        opacity:.22;
    }

    75%{
        opacity:.14;
    }

    100%{
        transform:
            translate3d(-10px,-48px,0)
            rotate(-6deg);

        opacity:.08;
    }
}


/* ================================
   四角边框
================================ */

.frame{
    position:fixed;
    inset:18px;

    border:1px solid rgba(115,170,210,.16);

    pointer-events:none;

    z-index:10;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:75px;
    height:75px;

    border-color:rgba(135,195,235,.38);
    border-style:solid;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-width:1px 0 0 1px;
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-width:0 1px 1px 0;
}


/* ================================
   魔法阵
================================ */

.magic-circle{
    position:fixed;

    width:620px;
    height:620px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(92,155,200,.07);

    border-radius:50%;

    pointer-events:none;

    z-index:0;
}

.magic-circle::before{
    content:"";

    position:absolute;

    inset:38px;

    border:1px solid rgba(110,175,220,.055);

    border-radius:50%;
}

.magic-circle::after{
    content:"";

    position:absolute;

    inset:110px;

    border:1px solid rgba(110,175,220,.045);

    border-radius:50%;
}


/* ================================
   魔法阵装饰线
================================ */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:1px;

    background:rgba(115,180,220,.045);

    transform:translate(-50%,-50%);
}

.magic-line:nth-child(2){
    transform:
        translate(-50%,-50%)
        rotate(60deg);
}

.magic-line:nth-child(3){
    transform:
        translate(-50%,-50%)
        rotate(-60deg);
}


/* ================================
   页面主体
================================ */

.page{
    position:relative;

    z-index:2;

    min-height:100vh;

    padding:
        42px
        70px
        80px;
}


/* ================================
   顶部
================================ */

.header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    width:100%;

    position:relative;

    z-index:20;
}


/* ================================
   Logo
================================ */

.logo{
    display:flex;

    align-items:center;

    gap:10px;

    color:#d4e7f6;

    text-decoration:none;
}

.logo-symbol{
    font-size:14px;

    color:#9bc7e5;

    opacity:.8;
}

.logo > span:last-child{
    display:flex;

    flex-direction:column;

    justify-content:center;

    line-height:1.15;
}

.logo-cn{
    font-family:"Noto Serif SC",serif;

    font-size:12px;

    font-weight:400;

    letter-spacing:2px;

    color:inherit;
}

.logo-en{
    margin-top:3px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:2.5px;

    color:rgba(191,220,243,.55);
}


/* ================================
   右侧控制
================================ */

.header-right{
    display:flex;

    align-items:center;

    gap:24px;
}

.back{
    color:rgba(190,215,235,.58);

    text-decoration:none;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:10px;

    letter-spacing:1.5px;

    transition:.3s;
}

.back:hover{
    color:#d7ecfa;
}

.theme-toggle{
    border:1px solid rgba(145,190,220,.25);

    background:rgba(20,45,65,.22);

    color:rgba(200,225,242,.72);

    padding:7px 12px;

    font-family:"Noto Serif SC",serif;

    font-size:10px;

    letter-spacing:1px;

    cursor:pointer;

    transition:.3s;

    border-radius:2px;
}

.theme-toggle:hover{
    border-color:rgba(160,205,235,.45);

    background:rgba(35,65,90,.3);
}


/* ================================
   Hero
================================ */

.hero{
    text-align:center;

    margin-top:92px;

    position:relative;
}

.hero-en{
    font-family:"Cinzel",serif;

    font-size:12px;

    letter-spacing:7px;

    color:rgba(165,205,232,.48);

    margin-bottom:13px;
}

.hero-title{
    font-family:"Cinzel",serif;

    font-size:46px;

    font-weight:400;

    letter-spacing:9px;

    color:#d9eaf6;

    text-shadow:
        0 0 20px rgba(95,170,220,.12);
}

.hero-cn{
    margin-top:14px;

    font-size:14px;

    letter-spacing:7px;

    color:rgba(188,214,232,.58);
}


/* ================================
   档案画廊
================================ */

.gallery{
    width:min(1100px,94%);

    margin:78px auto 0;

    position:relative;
}


/* ================================
   图片网格
================================ */

.gallery-list{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:28px;

    position:relative;

    z-index:2;
}


/* ================================
   画廊卡片
================================ */

.gallery-item{
    border:1px solid rgba(110,170,210,.13);

    background:
        linear-gradient(
            135deg,
            rgba(17,42,61,.28),
            rgba(8,22,35,.18)
        );

    padding:14px;

    transition:
        border-color .35s ease,
        background .35s ease,
        transform .35s ease,
        box-shadow .35s ease;

    cursor:pointer;
}

.gallery-item:hover{
    border-color:rgba(130,190,225,.30);

    background:
        linear-gradient(
            135deg,
            rgba(25,54,76,.35),
            rgba(10,27,42,.25)
        );

    transform:translateY(-3px);

    box-shadow:
        0 8px 28px rgba(0,0,0,.12);
}


/* ================================
   图片区域
================================ */

.gallery-image-wrap{
    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        rgba(5,16,27,.35);

    border:1px solid rgba(110,170,210,.08);

    min-height:180px;
}

.gallery-image{
    display:block;

    width:100%;

    height:auto;

    max-width:100%;

    object-fit:contain;
}


/* ================================
   图片文字
================================ */

.gallery-info{
    padding:
        17px
        4px
        4px;
}

.gallery-era{
    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:3px;

    color:rgba(140,190,220,.52);

    margin-bottom:8px;
}

.gallery-title{
    font-family:"Cinzel",serif;

    font-size:16px;

    font-weight:400;

    letter-spacing:2px;

    color:#d2e5f2;

    margin-bottom:7px;
}

.gallery-cn{
    font-size:11px;

    letter-spacing:2px;

    color:rgba(190,216,232,.6);

    margin-bottom:8px;
}

.gallery-description{
    font-size:10px;

    line-height:1.9;

    letter-spacing:1px;

    color:rgba(175,202,220,.45);
}


/* ================================
   空白提示
================================ */

.empty-gallery{
    grid-column:1 / -1;

    text-align:center;

    padding:50px 20px;

    border:1px solid rgba(110,170,210,.10);

    background:rgba(10,27,42,.16);

    color:rgba(170,200,220,.38);

    font-size:11px;

    letter-spacing:2px;
}

.empty-gallery-en{
    display:block;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:9px;

    color:rgba(145,190,220,.4);
}


/* ================================
   图片放大层
================================ */

.lightbox{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:50px;

    background:
        rgba(3,10,18,.86);

    backdrop-filter:blur(5px);

    z-index:100;
}

.lightbox.active{
    display:flex;
}

.lightbox-image{
    max-width:90vw;

    max-height:85vh;

    width:auto;
    height:auto;

    object-fit:contain;

    box-shadow:
        0 0 40px rgba(50,120,170,.18);

    border:1px solid rgba(130,190,225,.25);
}

.lightbox-close{
    position:absolute;

    top:28px;
    right:35px;

    color:rgba(210,235,248,.7);

    font-family:"Cinzel",serif;

    font-size:25px;

    font-weight:400;

    cursor:pointer;

    transition:.3s;
}

.lightbox-close:hover{
    color:#e5f5ff;

    transform:rotate(90deg);
}


/* ================================
   页脚
================================ */

.footer{
    text-align:center;

    margin-top:100px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:4px;

    color:rgba(150,190,215,.25);
}


/* ================================
   日间模式
================================ */

body.day{
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(125,175,205,.12),
            transparent 45%
        ),
        #eef3f6;

    color:#29455b;
}

body.day .stars{
    opacity:.18;
}

body.day .micro-stars{
    opacity:.12;
}

body.day .frame{
    border-color:rgba(65,105,130,.16);
}

body.day .frame::before,
body.day .frame::after{
    border-color:rgba(65,110,140,.28);
}

body.day .logo{
    color:#29485e;
}

body.day .logo-en{
    color:rgba(61,98,125,.58);
}

body.day .logo-symbol{
    color:#557f9a;
}

body.day .back{
    color:rgba(55,88,108,.65);
}

body.day .back:hover{
    color:#29485e;
}

body.day .theme-toggle{
    border-color:rgba(70,110,135,.25);

    background:rgba(255,255,255,.42);

    color:rgba(45,80,102,.75);
}

body.day .theme-toggle:hover{
    background:rgba(255,255,255,.7);

    border-color:rgba(65,105,130,.4);
}

body.day .hero-en{
    color:rgba(65,105,130,.48);
}

body.day .hero-title{
    color:#29485e;
}

body.day .hero-cn{
    color:rgba(55,88,108,.62);
}

body.day .magic-circle{
    border-color:rgba(65,115,145,.07);
}

body.day .magic-circle::before,
body.day .magic-circle::after{
    border-color:rgba(65,115,145,.055);
}

body.day .magic-line{
    background:rgba(65,115,145,.05);
}


/* 画廊日间模式 */

body.day .gallery-item{
    border-color:rgba(65,110,140,.14);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.5),
            rgba(235,243,247,.38)
        );
}

body.day .gallery-item:hover{
    border-color:rgba(65,110,140,.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.75),
            rgba(235,243,247,.55)
        );
}

body.day .gallery-image-wrap{
    background:
        rgba(235,243,247,.4);

    border-color:rgba(65,110,140,.10);
}

body.day .gallery-era{
    color:rgba(65,105,130,.55);
}

body.day .gallery-title{
    color:#29485e;
}

body.day .gallery-cn{
    color:rgba(55,88,108,.65);
}

body.day .gallery-description{
    color:rgba(55,88,108,.55);
}

body.day .empty-gallery{
    border-color:rgba(65,110,140,.13);

    background:rgba(255,255,255,.35);

    color:rgba(55,88,108,.48);
}

body.day .empty-gallery-en{
    color:rgba(65,105,130,.45);
}

body.day .footer{
    color:rgba(65,105,130,.3);
}


/* ================================
   手机端
================================ */

@media(max-width:900px){

    .gallery-list{
        grid-template-columns:
            repeat(2,1fr);

        gap:22px;
    }

}


@media(max-width:700px){

    .page{
        padding:
            30px
            28px
            60px;
    }

    .frame{
        inset:12px;
    }

    .header-right{
        gap:10px;
    }

    .back{
        font-size:9px;

        letter-spacing:1px;
    }

    .theme-toggle{
        padding:6px 8px;

        font-size:9px;
    }

    .hero{
        margin-top:72px;
    }

    .hero-en{
        font-size:9px;

        letter-spacing:4px;
    }

    .hero-title{
        font-size:30px;

        letter-spacing:5px;
    }

    .hero-cn{
        font-size:12px;

        letter-spacing:4px;
    }

    .gallery{
        width:100%;

        margin-top:60px;
    }

    .gallery-list{
        grid-template-columns:1fr;

        gap:25px;
    }

    .gallery-item{
        padding:12px;
    }

    .gallery-image-wrap{
        min-height:140px;
    }

    .gallery-title{
        font-size:15px;
    }

    .gallery-description{
        font-size:10px;
    }

    .empty-gallery{
        padding:40px 15px;
    }

    .lightbox{
        padding:30px 20px;
    }

    .lightbox-image{
        max-width:94vw;

        max-height:82vh;
    }

    .lightbox-close{
        top:18px;

        right:22px;

        font-size:22px;
    }

    .footer{
        margin-top:70px;
    }

}

</style>
</head>

<!-- 页面边框 -->

<div class="page">

    <!-- ================================

    <header class="header">

        <div class="logo">

            <span class="logo-symbol">
                ✦
            </span>

            <span>

                <span class="logo-cn">
                    塞垭弥大陆档案馆
                </span>

                <span class="logo-en">
                    SEYAMI ARCHIVE
                </span>

            </span>

        </div>


        <div class="header-right">

            <a
                href="archive.html"
                class="back"
            >
                ← 返回档案目录
            </a>

                class="theme-toggle"
                id="themeToggle"

    id="lightbox"

<script>

/* =========================================
   画廊资料
   =========================================

   以后只需要在这里增加图片。

   示例：

   {
       image: "images/ilina.jpg",
       era: "CHARACTER ARCHIVE",
       title: "ILINA",
       cn: "伊莉娜",
       description: "雪山的神女。"
   }

   image：
   填写你的图片路径。

========================================= */


const galleryItems = [

    /*
    {
        image: "images/ilina.jpg",
        era: "CHARACTER ARCHIVE",
        title: "ILINA",
        cn: "伊莉娜",
        description: "雪山的神女。"
    },

    {
        image: "images/example.png",
        era: "WORLD ARCHIVE",
        title: "EXAMPLE",
        cn: "示例档案",
        description: "这里填写图片说明。"
    }
    */

];


/* =========================================
   生成画廊
========================================= */

const galleryList =
    document.getElementById("galleryList");


function renderGallery(){

    galleryList.innerHTML = "";


    /* 没有图片 */

    if(galleryItems.length === 0){

        galleryList.innerHTML = `

            <div class="empty-gallery">

                <span class="empty-gallery-en">
                    ARCHIVE EMPTY
                </span>

                暂无档案画廊记录

            </div>

        `;

        return;
    }


    /* 有图片 */

    galleryItems.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "gallery-item";


        card.innerHTML = `

            <div class="gallery-image-wrap">

                <img
                    class="gallery-image"
                    src="${item.image}"
                    alt="${item.title || ""}"
                    loading="lazy"
                >

            </div>


            <div class="gallery-info">

                ${
                    item.era
                    ?
                    `<div class="gallery-era">
                        ${item.era}
                    </div>`
                    :
                    ""
                }

                ${
                    item.title
                    ?
                    `<div class="gallery-title">
                        ${item.title}
                    </div>`
                    :
                    ""
                }

                ${
                    item.cn
                    ?
                    `<div class="gallery-cn">
                        ${item.cn}
                    </div>`
                    :
                    ""
                }

                ${
                    item.description
                    ?
                    `<div class="gallery-description">
                        ${item.description}
                    </div>`
                    :
                    ""
                }

            </div>

        `;


        galleryList.appendChild(card);


        /* 点击图片放大 */

        const image =
            card.querySelector(".gallery-image");


        image.addEventListener(
            "click",
            ()=>{

                lightboxImage.src =
                    item.image;

                lightboxImage.alt =
                    item.title || "";

                lightbox.classList.add("active");

            }
        );

    });

}


renderGallery();


/* =========================================
   图片放大层
========================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");


/* 点击关闭 */

lightboxClose.addEventListener(
    "click",
    ()=>{

        lightbox.classList.remove("active");

        lightboxImage.src = "";

    }
);


/* 点击背景关闭 */

lightbox.addEventListener(
    "click",
    (event)=>{

        if(event.target === lightbox){

            lightbox.classList.remove("active");

            lightboxImage.src = "";

        }

    }
);


/* ESC 关闭 */

document.addEventListener(
    "keydown",
    (event)=>{

        if(event.key === "Escape"){

            lightbox.classList.remove("active");

            lightboxImage.src = "";

        }

    }
);


/* =========================================
   日间 / 夜间模式
========================================= */

const themeToggle =
    document.getElementById("themeToggle");


const savedTheme =
    localStorage.getItem("seyami-theme");


if(savedTheme === "day"){

    document.body.classList.add("day");

    themeToggle.textContent =
        "☾ 夜间";

}


themeToggle.addEventListener(
    "click",
    ()=>{

        document.body.classList.toggle("day");


        const isDay =
            document.body.classList.contains("day");


        localStorage.setItem(
            "seyami-theme",
            isDay ? "day" : "night"
        );


        themeToggle.textContent =
            isDay
            ? "☾ 夜间"
            : "☼ 日间";

    }
);

</script>
