<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    overflow-x:hidden;

    background:#071522;

    color:#d9edff;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    transition:
        background .6s ease,
        color .6s ease;
}


/* =========================================================
   页面
========================================================= */

.page{

    position:relative;

    min-height:100vh;

    padding:
        30px
        70px
        80px;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(37,91,128,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(13,47,72,.48),
            transparent 72%
        ),

        #071522;
}


/* =========================================================
   边框
========================================================= */

.frame{

    position:fixed;

    inset:18px;

    border:
        1px solid
        rgba(111,174,224,.16);

    pointer-events:none;

    z-index:10;
}


/* =========================================================
   HEADER
   与国家档案 archive.html 保持一致
========================================================= */

.header{

    position:absolute;

    left:58px;
    right:58px;

    top:38px;

    z-index:20;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    width:auto;

    max-width:none;

    margin:0;

    padding:0;
}


.logo{

    display:flex;

    align-items:flex-start;

    gap:12px;

    color:#d9edff;

    text-decoration:none;

    transition:
        color .6s ease;
}


.logo-symbol{

    color:rgba(137,201,239,.9);

    width:17px;

    height:13px;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    font-size:17px;

    line-height:13px;

    margin:0;

    padding:0;

    text-shadow:

        0 0 7px
        rgba(76,159,216,.5),

        0 0 15px
        rgba(49,132,191,.22);

    flex-shrink:0;

    transition:

        color .6s ease,

        text-shadow .6s ease;
}


.logo-text{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1;
}


.logo-cn{

    display:block;

    height:13px;

    line-height:13px;

    color:#d9edff;

    font-size:13px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}


.logo-en{

    display:block;

    margin-top:5px;

    color:rgba(157,204,239,.63);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    line-height:8px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}


.header-right{

    display:flex;

    align-items:center;

    gap:20px;
}


.back{

    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:1px;

    transition:

        color .3s ease,

        text-shadow .3s ease;
}


.back:hover{

    color:#d9efff;

    text-shadow:

        0 0 8px
        rgba(102,180,231,.35);
}


.theme-toggle{

    display:flex;

    align-items:center;

    gap:7px;

    height:28px;

    padding:0 11px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;

    white-space:nowrap;

    transition:

        color .35s ease,

        border-color .35s ease,

        background .35s ease,

        box-shadow .35s ease;
}


.theme-toggle:hover{

    color:#d9efff;

    border-color:
        rgba(122,192,235,.62);

    background:
        rgba(8,31,52,.55);

    box-shadow:

        0 0 14px
        rgba(76,151,202,.12);
}


.theme-icon{

    font-size:12px;

    line-height:1;

    letter-spacing:0;
}


/* =========================================================
   星星背景
========================================================= */

.stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    background-image:

        radial-gradient(
            1px 1px at 10% 18%,
            rgba(180,220,255,.65),
            transparent
        ),

        radial-gradient(
            1px 1px at 22% 72%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 35% 25%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 48% 83%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 63% 17%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 77% 65%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 89% 30%,
            rgba(180,220,255,.6),
            transparent
        ),

        radial-gradient(
            1px 1px at 92% 84%,
            rgba(180,220,255,.4),
            transparent
        );
}


/* =========================================================
   微小星点
========================================================= */

.micro-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;

    opacity:.7;

    background-image:

        radial-gradient(
            1px 1px at 7% 42%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 17% 14%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 31% 62%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 44% 11%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 56% 71%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 69% 37%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 82% 12%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 95% 55%,
            rgba(173,215,244,.4),
            transparent
        );
}


/* =========================================================
   漂浮符号 ✡ ✶
========================================================= */

.symbol{

    position:fixed;

    pointer-events:none;

    z-index:15;

    display:block;

    color:
        rgba(115,180,222,.72);

    font-family:
        "Times New Roman",
        serif;

    font-weight:400;

    line-height:1;

    opacity:.75;

    text-shadow:

        0 0 6px
        rgba(68,145,198,.35),

        0 0 14px
        rgba(68,145,198,.18);

    animation:
        floatSymbol 9s ease-in-out infinite;
}


.symbol-one{

    left:8%;

    top:29%;

    font-size:25px;

    animation-delay:-2s;
}


.symbol-two{

    right:9%;

    top:55%;

    font-size:21px;

    animation-delay:-5s;
}


@keyframes floatSymbol{

    0%,
    100%{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:.65;
    }

    50%{

        transform:
            translateY(-12px)
            rotate(8deg);

        opacity:.9;
    }
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:fixed;

    left:50%;

    top:48%;

    width:480px;

    height:480px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(92,163,209,.09);

    border-radius:50%;

    pointer-events:none;

    z-index:1;

    box-shadow:

        0 0 0 16px
        rgba(80,147,194,.018),

        0 0 0 34px
        rgba(80,147,194,.014),

        0 0 80px
        rgba(43,113,159,.04);
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:35px;

    border:
        1px solid
        rgba(92,163,209,.07);

    border-radius:50%;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:78px;

    border:
        1px dashed
        rgba(92,163,209,.06);

    border-radius:50%;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    z-index:5;

    text-align:center;

    padding-top:150px;

    margin-bottom:100px;
}


.hero-en{

    color:
        rgba(154,204,239,.72);

    font-size:10px;

    letter-spacing:7px;

    margin-bottom:14px;
}


.hero-title{

    margin:0;

    color:#dcefff;

    font-family:
        "Cinzel",
        serif;

    font-size:42px;

    font-weight:400;

    letter-spacing:8px;

    line-height:1.1;

    text-shadow:

        0 0 16px
        rgba(73,150,204,.14);
}


.hero-cn{

    margin-top:18px;

    color:
        rgba(181,218,242,.78);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;

    letter-spacing:8px;
}


/* =========================================================
   历史记录
========================================================= */

.history{

    position:relative;

    z-index:5;

    width:min(900px,92%);

    margin:0 auto;

    padding-bottom:80px;
}


.history::before{

    content:"";

    position:absolute;

    top:0;

    bottom:0;

    left:50%;

    width:1px;

    transform:
        translateX(-50%);

    background:

        linear-gradient(
            to bottom,
            transparent,
            rgba(102,173,218,.2) 8%,
            rgba(102,173,218,.2) 92%,
            transparent
        );
}


.history-item{

    position:relative;

    width:50%;

    padding:
        0
        40px
        55px;
}


.history-item:nth-child(odd){

    left:0;

    text-align:right;
}


.history-item:nth-child(even){

    left:50%;

    text-align:left;
}


.history-item::before{

    content:"";

    position:absolute;

    top:4px;

    width:7px;

    height:7px;

    border:
        1px solid
        rgba(128,194,231,.6);

    border-radius:50%;

    background:#071522;

    box-shadow:

        0 0 8px
        rgba(88,169,217,.3);
}


.history-item:nth-child(odd)::before{

    right:-4px;
}


.history-item:nth-child(even)::before{

    left:-4px;
}


.history-date{

    color:
        rgba(122,184,220,.62);

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:10px;
}


.history-title{

    margin:
        0
        0
        8px;

    color:
        rgba(211,235,251,.9);

    font-size:16px;

    font-weight:400;

    letter-spacing:2px;
}


.history-description{

    margin:0;

    color:
        rgba(161,199,223,.58);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:11px;

    line-height:2;

    letter-spacing:1px;
}


/* =========================================================
   空状态
========================================================= */

.empty-state{

    position:relative;

    z-index:5;

    text-align:center;

    padding:
        30px
        20px
        100px;
}


.empty-en{

    color:
        rgba(125,184,220,.42);

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:5px;

    margin-bottom:13px;
}


.empty-cn{

    color:
        rgba(174,210,233,.5);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:relative;

    z-index:5;

    text-align:center;

    padding-top:20px;

    color:
        rgba(120,177,211,.38);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    letter-spacing:3px;
}


/* =========================================================
   DAY MODE
========================================================= */

body.day{

    background:#f4f9fd;

    color:#2e5069;
}


body.day .page{

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),

        #f4f9fd;
}


body.day .frame{

    border-color:
        rgba(85,145,181,.18);
}


body.day .logo{

    color:#315a75;
}


body.day .logo-cn{

    color:#315a75;
}


body.day .logo-en{

    color:
        rgba(68,116,145,.62);
}


body.day .logo-symbol{

    color:
        rgba(72,145,187,.8);

    text-shadow:none;
}


body.day .back{

    color:
        rgba(64,110,137,.72);
}


body.day .theme-toggle{

    background:
        rgba(255,255,255,.42);

    border-color:
        rgba(85,145,181,.3);

    color:
        rgba(64,110,137,.75);
}


body.day .theme-toggle:hover{

    background:
        rgba(255,255,255,.7);

    border-color:
        rgba(85,145,181,.55);
}


body.day .hero-en{

    color:
        rgba(72,129,160,.72);
}


body.day .hero-title{

    color:#315a75;

    text-shadow:
        0 0 16px
        rgba(83,145,182,.12);
}


body.day .hero-cn{

    color:
        rgba(64,108,133,.72);
}


body.day .history::before{

    background:

        linear-gradient(
            to bottom,
            transparent,
            rgba(80,139,174,.22) 8%,
            rgba(80,139,174,.22) 92%,
            transparent
        );
}


body.day .history-item::before{

    background:#f4f9fd;

    border-color:
        rgba(78,139,174,.55);
}


body.day .history-date{

    color:
        rgba(67,126,158,.65);
}


body.day .history-title{

    color:
        rgba(49,91,115,.9);
}


body.day .history-description{

    color:
        rgba(77,116,138,.68);
}


body.day .empty-en{

    color:
        rgba(75,128,157,.48);
}


body.day .empty-cn{

    color:
        rgba(73,111,132,.58);
}


body.day .footer{

    color:
        rgba(75,128,157,.42);
}


/* =========================================================
   日间模式
   ✡ / ✶ 保留，但完全取消发光
========================================================= */

body.day .symbol{

    text-shadow:none;

    color:
        rgba(72,145,187,.62);

    opacity:.72;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:800px){

    .header{

        left:35px;

        right:35px;

        top:30px;
    }


    .header-right{

        gap:14px;
    }


    .theme-toggle{

        height:27px;

        padding:0 9px;

        font-size:7px;
    }


    .hero{

        padding-top:135px;
    }


    .hero-title{

        font-size:34px;

        letter-spacing:6px;
    }


    .history{

        width:94%;
    }

}


@media(max-width:600px){

    .page{

        padding:
            22px
            20px
            55px;
    }


    .frame{

        inset:12px;
    }


    /* =====================================================
       国家档案顶部标准版
    ===================================================== */

    .header{

        left:25px;

        right:25px;

        top:24px;

        width:auto;

        max-width:none;

        margin:0;

        padding:0;

        align-items:flex-start;
    }


    .logo{

        align-items:flex-start;

        gap:10px;
    }


    .logo-symbol{

        width:15px;

        height:11px;

        display:flex;

        align-items:flex-start;

        justify-content:center;

        font-size:15px;

        line-height:11px;

        margin-top:2px;
    }


    .logo-cn{

        height:11px;

        line-height:11px;

        font-size:11px;

        letter-spacing:2px;
    }


    .logo-en{

        display:block;

        margin-top:4px;

        font-size:7px;

        line-height:7px;

        letter-spacing:2px;
    }


    .header-right{

        gap:8px;
    }


    .back{

        font-size:10px;
    }


    .theme-toggle{

        height:25px;

        padding:0 7px;

        gap:5px;

        font-size:6px;

        letter-spacing:1px;
    }


    .theme-icon{

        font-size:10px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero{

        padding-top:120px;

        margin-bottom:70px;
    }


    .hero-en{

        font-size:8px;

        letter-spacing:5px;
    }


    .hero-title{

        font-size:27px;

        letter-spacing:4px;
    }


    .hero-cn{

        font-size:12px;

        letter-spacing:5px;
    }


    /* =====================================================
       手机端历史时间轴竖线取消
    ===================================================== */

    .history{

        width:92%;
    }


    .history::before{

        display:none;
    }


    .history-item,
    .history-item:nth-child(odd),
    .history-item:nth-child(even){

        left:0;

        width:100%;

        padding:
            0
            0
            45px
            30px;

        text-align:left;
    }


    .history-item::before,
    .history-item:nth-child(odd)::before,
    .history-item:nth-child(even)::before{

        left:4px;

        right:auto;
    }


    /* =====================================================
       魔法阵
    ===================================================== */

    .magic-circle{

        width:330px;

        height:330px;
    }


    /* =====================================================
       手机端 ✡ / ✶
       明确固定位置与显示层级
    ===================================================== */

    .symbol{

        z-index:15;

        display:block;

        opacity:.75;
    }


    .symbol-one{

        left:5%;

        top:31%;

        font-size:25px;
    }


    .symbol-two{

        right:5%;

        top:58%;

        font-size:21px;
    }

}


@media(max-width:360px){

    .header{

        left:20px;

        right:20px;

        top:24px;
    }


    .header-right{

        gap:5px;
    }


    .back{

        font-size:9px;
    }


    .theme-toggle{

        padding:0 6px;

        font-size:6px;
    }


    .hero-title{

        font-size:24px;

        letter-spacing:3px;
    }


    .symbol-one{

        left:4%;

        top:31%;

        font-size:23px;
    }


    .symbol-two{

        right:4%;

        top:58%;

        font-size:20px;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- 背景 -->

    <div class="stars"></div>

    <div class="micro-stars"></div>


    <!-- =================================================
         漂浮魔法符号
    ================================================== -->

    <div class="symbol symbol-one">
        ✡
    </div>


    <div class="symbol symbol-two">
        ✶
    </div>


    <!-- 魔法阵 -->

    <div class="magic-circle"></div>


    <!-- 边框 -->

    <div class="frame"></div>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">


        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-symbol">
                ✦
            </span>


            <span class="logo-text">

                <span class="logo-cn">
                    塞垭弥大陆档案馆
                </span>


                <span class="logo-en">
                    SEYAMI ARCHIVE
                </span>

            </span>

        </a>


        <div class="header-right">


            <a
                href="archive.html"
                class="back"
            >
                ← 返回档案目录
            </a>


            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="切换昼夜模式"
            >

                <span
                    class="theme-icon"
                    id="themeIcon"
                >
                    ☾
                </span>


                <span id="themeText">
                    NIGHT
                </span>

            </button>


        </div>

    </header>


    <!-- =================================================
         HERO
    ================================================== -->

    <section class="hero">


        <div class="hero-en">
            HISTORY RECORD
        </div>


        <h1 class="hero-title">
            HISTORY
        </h1>


        <div class="hero-cn">
            历史记录
        </div>


    </section>


    <!-- =================================================
         历史记录
    ================================================== -->

    <section
        class="history"
        id="historyList"
    >

        <!--

        以后新增历史记录可以写在这里。

        <article class="history-item">

            <div class="history-date">
                2026 · 09 · 20
            </div>

            <h2 class="history-title">
                塞垭弥大陆档案馆建立
            </h2>

            <p class="history-description">
                塞垭弥大陆档案馆正式建立。
            </p>

        </article>

        -->

    </section>


    <!-- =================================================
         空状态
    ================================================== -->

    <section
        class="empty-state"
        id="emptyState"
    >

        <div class="empty-en">
            ARCHIVE EMPTY
        </div>


        <div class="empty-cn">
            暂无历史记录
        </div>

    </section>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        SEYAMI ARCHIVE · HISTORY RECORD

    </footer>


</div>


<script>

/* =========================================================
   昼夜模式
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day");

        themeIcon.textContent = "☀";

        themeText.textContent = "DAY";

    }else{

        document.body.classList.remove("day");

        themeIcon.textContent = "☾";

        themeText.textContent = "NIGHT";

    }

}


/* =========================================================
   读取全站统一主题
========================================================= */

const savedTheme =
    localStorage.getItem("seyami-theme");


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


/* =========================================================
   切换主题
========================================================= */

themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList.contains("day");

        const nextTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );


        applyTheme(nextTheme);

    }
);


/* =========================================================
   历史记录
========================================================= */

const historyRecords = [

    /*
    
    以后新增历史记录可以写在这里：

    {
        date:"2026 · 09 · 20",
        title:"塞垭弥大陆档案馆建立",
        description:"塞垭弥大陆档案馆正式建立。"
    }

    */

];


const historyList =
    document.getElementById("historyList");


const emptyState =
    document.getElementById("emptyState");


/* =========================================================
   如果有历史记录则显示
========================================================= */

if(historyRecords.length > 0){

    emptyState.style.display = "none";


    historyRecords.forEach(
        record => {

            const item =
                document.createElement("article");


            item.className =
                "history-item";


            item.innerHTML = `

                <div class="history-date">
                    ${record.date}
                </div>

                <h2 class="history-title">
                    ${record.title}
                </h2>

                <p class="history-description">
                    ${record.description}
                </p>

            `;


            historyList.appendChild(item);

        }
    );

}

</script>


</body>

</html>
