<style>

/* ================================
   基础
================================ */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    background:#071522;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}


/* ================================
   外框
================================ */

.frame{

    position:fixed;

    inset:18px;

    border:
        1px solid rgba(180,215,255,.16);

    pointer-events:none;

    z-index:30;
}


/* ================================
   左上角 Logo
================================ */

.logo{

    position:absolute;

    left:58px;
    top:38px;

    z-index:20;

    text-align:left;
}

.logo-main{

    font-family:
        "Noto Serif SC",
        serif;

    font-size:18px;

    letter-spacing:5px;

    color:#dcecff;
}

.logo-sub{

    margin-top:7px;

    font-family:
        "Cinzel",
        serif;

    font-size:10px;

    letter-spacing:4px;

    color:rgba(220,236,255,.55);
}

.logo-star{

    display:inline-block;

    margin-right:8px;

    font-size:13px;

    color:#dcecff;
}


/* ================================
   返回按钮
================================ */

.back-button{

    position:absolute;

    right:58px;
    top:38px;

    z-index:20;

    color:#dcecff;

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:2px;

    padding:8px 12px;

    border:
        1px solid rgba(190,220,255,.25);

    background:
        rgba(7,21,34,.28);

    transition:
        border-color .3s ease,
        background .3s ease,
        color .3s ease;
}

.back-button:hover{

    border-color:
        rgba(220,240,255,.6);

    background:
        rgba(140,180,220,.08);
}


/* ================================
   日夜模式
================================ */

.theme-toggle{

    position:absolute;

    right:58px;
    top:84px;

    z-index:20;

    width:34px;
    height:34px;

    border:
        1px solid rgba(190,220,255,.22);

    background:
        rgba(7,21,34,.25);

    color:#dcecff;

    cursor:pointer;

    font-size:15px;

    transition:
        background .3s ease,
        border-color .3s ease;
}

.theme-toggle:hover{

    background:
        rgba(150,190,230,.08);

    border-color:
        rgba(220,240,255,.5);
}


/* ================================
   漂浮星点
================================ */

.floating-symbol{

    position:fixed;

    color:rgba(190,220,255,.28);

    font-size:12px;

    pointer-events:none;

    animation:
        floatSymbol 7s ease-in-out infinite;

    z-index:1;
}

@keyframes floatSymbol{

    0%,
    100%{
        transform:translateY(0);
        opacity:.35;
    }

    50%{
        transform:translateY(-8px);
        opacity:.7;
    }
}


/* ================================
   魔法阵
================================ */

.magic-circle{

    position:absolute;

    width:680px;
    height:680px;

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        1px solid rgba(130,180,230,.08);

    pointer-events:none;

    z-index:0;
}

.magic-circle::before{

    content:"";

    position:absolute;

    width:82%;
    height:82%;

    left:9%;
    top:9%;

    border-radius:50%;

    border:
        1px solid rgba(130,180,230,.07);
}

.magic-circle::after{

    content:"";

    position:absolute;

    width:61%;
    height:61%;

    left:19.5%;
    top:19.5%;

    border-radius:50%;

    border:
        1px solid rgba(130,180,230,.06);
}


/* ================================
   HERO
================================ */

.hero{

    position:relative;

    z-index:2;

    text-align:center;

    padding-top:150px;

    padding-bottom:85px;
}

.hero-en-small{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:7px;

    color:
        rgba(220,236,255,.5);

    margin-bottom:18px;
}

.hero-title{

    margin:0;

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(48px,7vw,88px);

    font-weight:400;

    letter-spacing:10px;

    line-height:1;

    color:#e2efff;
}

.hero-cn{

    margin-top:22px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:18px;

    letter-spacing:8px;

    color:
        rgba(220,236,255,.72);
}


/* ================================
   时间轴
================================ */

.history-wrapper{

    position:relative;

    z-index:3;

    width:min(900px,82%);

    margin:0 auto;

    padding-bottom:130px;
}

.history-list{

    position:relative;

    padding:10px 0;
}

.history-list::before{

    content:"";

    position:absolute;

    left:50%;

    top:0;
    bottom:0;

    width:1px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(160,200,240,.35) 8%,
            rgba(160,200,240,.35) 92%,
            transparent
        );
}


/* ================================
   历史事件
================================ */

.history-item{

    position:relative;

    width:50%;

    padding:30px 55px;

    margin-bottom:25px;
}

.history-item:nth-child(odd){

    margin-left:0;

    text-align:right;
}

.history-item:nth-child(even){

    margin-left:50%;

    text-align:left;
}


/* 时间轴节点 */

.history-item::after{

    content:"✦";

    position:absolute;

    top:37px;

    width:22px;
    height:22px;

    line-height:22px;

    font-size:10px;

    color:#dcecff;

    text-align:center;

    background:#071522;

    border:
        1px solid rgba(190,220,255,.3);

    border-radius:50%;
}

.history-item:nth-child(odd)::after{

    right:-11px;
}

.history-item:nth-child(even)::after{

    left:-11px;
}


/* 年份 */

.history-date{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:4px;

    color:
        rgba(180,215,250,.55);

    margin-bottom:12px;
}


/* 标题 */

.history-title{

    margin:0;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:22px;

    font-weight:500;

    letter-spacing:3px;

    color:#e3f0ff;
}


/* 简介 */

.history-description{

    margin:15px 0 0;

    font-size:13px;

    line-height:2;

    letter-spacing:1px;

    color:
        rgba(220,236,255,.6);
}


/* 时期 / 地点 */

.history-meta{

    margin-top:14px;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:10px;

    letter-spacing:2px;

    color:
        rgba(180,215,250,.42);
}

.history-meta span + span::before{

    content:" · ";

    margin:0 7px;
}


/* 正文 */

.history-content{

    margin-top:18px;

    font-size:13px;

    line-height:2.1;

    letter-spacing:1px;

    color:
        rgba(220,236,255,.62);

    white-space:pre-line;
}


/* ================================
   空状态
================================ */

.empty-state{

    text-align:center;

    padding:90px 20px;

    color:
        rgba(200,225,250,.45);
}

.empty-symbol{

    font-size:28px;

    margin-bottom:20px;
}

.empty-en{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:5px;

    margin-bottom:12px;
}

.empty-cn{

    font-size:13px;

    letter-spacing:3px;
}


/* ================================
   错误状态
================================ */

.error-state{

    text-align:center;

    padding:90px 20px;

    color:
        rgba(220,200,200,.55);
}

.error-en{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:5px;

    margin-bottom:12px;
}

.error-cn{

    font-size:13px;

    letter-spacing:3px;
}


/* ================================
   Footer
================================ */

.footer{

    position:relative;

    z-index:3;

    text-align:center;

    padding:
        20px
        20px
        45px;

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:4px;

    color:
        rgba(180,215,250,.35);
}

body.day-mode .history-item::after{

body.day-mode .history-content{

body.day-mode .floating-symbol{

body.day-mode .footer{

<script>

/* ==================================================
   Supabase
================================================== */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   日夜模式
================================================== */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("seyami-theme");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add(
            "day-mode"
        );

        themeToggle.textContent = "☀";

    }else{

        document.body.classList.remove(
            "day-mode"
        );

        themeToggle.textContent = "☾";

    }

}


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );

        const newTheme =
            isDay
                ? "night"
                : "day";

        localStorage.setItem(
            "seyami-theme",
            newTheme
        );

        applyTheme(newTheme);

    }
);


/* ==================================================
   防止 HTML 注入
================================================== */

function escapeHTML(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==================================================
   加载历史记录
================================================== */

async function loadHistory(){

    const historyList =
        document.getElementById(
            "historyList"
        );

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    const errorState =
        document.getElementById(
            "errorState"
        );


    historyList.innerHTML = "";

    emptyState.style.display = "none";

    errorState.style.display = "none";


    try{

        const {
            data,
            error
        } = await supabaseClient

            .from("history_records")

            .select(`
                id,
                year,
                title,
                era,
                location,
                description,
                content,
                created_at,
                updated_at
            `)

            .order(
                "id",
                {
                    ascending:true
                }
            );


        if(error){

            console.error(
                "读取历史记录失败：",
                error
            );

            errorState.style.display =
                "block";

            return;
        }


        /* 没有记录 */

        if(!data || data.length === 0){

            emptyState.style.display =
                "block";

            return;
        }


        /* 有记录 */

        data.forEach(
            function(record){

                const item =
                    document.createElement(
                        "article"
                    );

                item.className =
                    "history-item";


                const year =
                    escapeHTML(
                        record.year
                    );

                const title =
                    escapeHTML(
                        record.title
                    );

                const era =
                    escapeHTML(
                        record.era
                    );

                const location =
                    escapeHTML(
                        record.location
                    );

                const description =
                    escapeHTML(
                        record.description
                    );

                const content =
                    escapeHTML(
                        record.content
                    );


                let metaHTML = "";


                if(era || location){

                    metaHTML = `
                        <div class="history-meta">

                            ${
                                era
                                    ? `<span>${era}</span>`
                                    : ""
                            }

                            ${
                                location
                                    ? `<span>${location}</span>`
                                    : ""
                            }

                        </div>
                    `;
                }


                let contentHTML = "";


                if(content){

                    contentHTML = `
                        <div class="history-content">
                            ${content}
                        </div>
                    `;
                }


                item.innerHTML = `

                    <div class="history-date">
                        ${year}
                    </div>

                    <h2 class="history-title">
                        ${title}
                    </h2>

                    ${
                        description
                            ? `
                                <p class="history-description">
                                    ${description}
                                </p>
                              `
                            : ""
                    }

                    ${metaHTML}

                    ${contentHTML}

                `;


                historyList.appendChild(
                    item
                );

            }
        );

    }catch(error){

        console.error(
            "历史记录加载异常：",
            error
        );

        errorState.style.display =
            "block";
    }

}


/* ==================================================
   启动
================================================== */

loadHistory();

</script>
