<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #071522;
    --bg-deep: #040d18;
    --panel: rgba(11, 28, 45, 0.78);
    --panel-hover: rgba(17, 39, 60, 0.9);
    --text: #dcecff;
    --text-soft: #9fb6cd;
    --text-muted: #718ba5;
    --line: rgba(151, 190, 225, 0.23);
    --line-strong: rgba(172, 205, 238, 0.48);
    --accent: #c4d9f1;
    --accent-soft: rgba(174, 207, 240, 0.12);
    --button-bg: rgba(143, 183, 222, 0.09);
    --button-border: rgba(174, 207, 240, 0.38);
    --shadow: rgba(0, 0, 0, 0.22);
}

body.day-mode {
    --bg: #eaf0f6;
    --bg-deep: #dfe8f1;
    --panel: rgba(255, 255, 255, 0.72);
    --panel-hover: rgba(255, 255, 255, 0.94);
    --text: #263d55;
    --text-soft: #526c85;
    --text-muted: #71869a;
    --line: rgba(64, 99, 133, 0.2);
    --line-strong: rgba(64, 99, 133, 0.42);
    --accent: #476d96;
    --accent-soft: rgba(91, 132, 173, 0.09);
    --button-bg: rgba(255, 255, 255, 0.55);
    --button-border: rgba(64, 99, 133, 0.32);
    --shadow: rgba(44, 67, 90, 0.08);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    background:
        radial-gradient(
            ellipse at 50% 20%,
            var(--accent-soft),
            transparent 48%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg-deep)
        );
    font-family: "Noto Serif SC", serif;
    transition:
        background-color 0.25s ease,
        color 0.25s ease;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

.page-frame {
    position: fixed;
    inset: 14px;
    z-index: 20;
    pointer-events: none;
    border: 1px solid var(--line);
}

.page-frame::before,
.page-frame::after {
    position: absolute;
    content: "";
    width: 24px;
    height: 24px;
    border-color: var(--line-strong);
    border-style: solid;
}

.page-frame::before {
    top: -1px;
    left: -1px;
    border-width: 1px 0 0 1px;
}

.page-frame::after {
    right: -1px;
    bottom: -1px;
    border-width: 0 1px 1px 0;
}

.frame-star {
    position: absolute;
    color: var(--text-soft);
    font-size: 15px;
    opacity: 0.72;
}

.frame-star.top-left {
    top: -7px;
    left: -7px;
}

.frame-star.top-right {
    top: -7px;
    right: -7px;
}

.frame-star.bottom-left {
    bottom: -7px;
    left: -7px;
}

.frame-star.bottom-right {
    right: -7px;
    bottom: -7px;
}

.background-stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.background-star {
    position: absolute;
    color: var(--text-soft);
    opacity: 0.32;
    user-select: none;
    animation: star-twinkle 5s ease-in-out infinite alternate;
}

.background-star:nth-child(2n) {
    animation-delay: -2s;
}

.background-star:nth-child(3n) {
    animation-delay: -3.5s;
}

@keyframes star-twinkle {
    from {
        opacity: 0.14;
    }
    to {
        opacity: 0.48;
    }
}

.floating-symbol {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    color: var(--text-soft);
    opacity: 0.18;
    font-size: 20px;
}

.floating-symbol.symbol-one {
    left: 7%;
    top: 33%;
}

.floating-symbol.symbol-two {
    right: 8%;
    top: 57%;
    font-size: 16px;
}

.floating-symbol.symbol-three {
    right: 15%;
    top: 19%;
    font-size: 12px;
}

.site-header {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 38px 58px 0;
}

.site-logo {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
}

.logo-cn {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--text);
}

.logo-en {
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 3.5px;
    color: var(--text-soft);
}

.header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    flex-wrap: wrap;
}

.header-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 35px;
    padding: 7px 13px;
    border: 1px solid var(--button-border);
    border-radius: 2px;
    background: var(--button-bg);
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.header-button:hover {
    color: var(--text);
    border-color: var(--line-strong);
    background: var(--panel-hover);
}

.theme-button {
    width: 36px;
    min-width: 36px;
    padding: 0;
    font-size: 16px;
}

main {
    position: relative;
    z-index: 1;
    width: min(100% - 48px, 1000px);
    margin: 0 auto;
    padding: 88px 0 100px;
}

.hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 10px 0 62px;
}

.magic-circle {
    position: absolute;
    top: -35px;
    left: 50%;
    width: min(68vw, 500px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    border: 1px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.52;
}

.magic-circle::before,
.magic-circle::after {
    content: "";
    position: absolute;
    inset: 10%;
    border: 1px solid var(--line);
    border-radius: 50%;
}

.magic-circle::after {
    inset: 23%;
    transform: rotate(45deg);
    border-radius: 0;
}

.magic-inner-ring {
    position: absolute;
    inset: 30%;
    border: 1px dashed var(--line-strong);
    border-radius: 50%;
}

.magic-line {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 84%;
    height: 1px;
    transform: translate(-50%, -50%);
    background: var(--line);
}

.magic-line.vertical {
    width: 1px;
    height: 84%;
}

.magic-star {
    position: absolute;
    left: 50%;
    top: 50%;
    color: var(--text-soft);
    font-size: 19px;
    transform: translate(-50%, -50%);
}

.hero-kicker {
    position: relative;
    z-index: 1;
    margin: 0 0 15px;
    color: var(--text-soft);
    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.hero-title {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: clamp(29px, 5vw, 43px);
    font-weight: 400;
    letter-spacing: 8px;
}

.hero-subtitle {
    position: relative;
    z-index: 1;
    margin-top: 13px;
    color: var(--text-soft);
    font-family: "Cinzel", serif;
    font-size: clamp(11px, 2vw, 15px);
    letter-spacing: 5px;
}

.hero-description {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 25px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 2.2;
    letter-spacing: 1px;
}

.section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 0 auto 36px;
    color: var(--text-soft);
    font-size: 13px;
}

.section-divider::before,
.section-divider::after {
    content: "";
    width: 64px;
    height: 1px;
    background: var(--line-strong);
}

.history-list {
    position: relative;
    width: 100%;
    padding: 8px 0 10px;
}

.history-list::before {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    content: "";
    background: linear-gradient(
        to bottom,
        transparent,
        var(--line-strong) 6%,
        var(--line-strong) 94%,
        transparent
    );
}

.history-item {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr);
    align-items: start;
    margin: 0 0 38px;
}

.history-item:last-child {
    margin-bottom: 0;
}

.history-content {
    grid-column: 1;
    grid-row: 1;
    padding: 23px 25px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 8px 30px var(--shadow);
    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.history-item:nth-child(even) .history-content {
    grid-column: 3;
}

.history-item:nth-child(odd) .history-content {
    text-align: right;
}

.history-node {
    position: relative;
    z-index: 2;
    grid-column: 2;
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 28px;
}

.history-node span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text);
    font-size: 7px;
    box-shadow: 0 0 0 5px var(--bg);
}

.history-year {
    margin: 0 0 10px;
    color: var(--text-soft);
    font-family: "Cinzel", serif;
    font-size: 12px;
    letter-spacing: 3px;
}

.history-title {
    margin: 0;
    color: var(--text);
    font-size: 19px;
    font-weight: 400;
    line-height: 1.8;
    letter-spacing: 2px;
    overflow-wrap: anywhere;
}

.history-meta {
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 1px;
}

.history-description {
    margin: 17px 0 0;
    color: var(--text-soft);
    font-size: 13px;
    line-height: 2.1;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.history-content-text {
    margin-top: 12px;
    color: var(--text-soft);
    font-size: 13px;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.history-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 18px;
}

.history-item:nth-child(odd) .history-actions {
    justify-content: flex-end;
}

.history-item:nth-child(even) .history-actions {
    justify-content: flex-start;
}

.edit-history {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 12px;
    border: 1px solid var(--button-border);
    background: var(--button-bg);
    color: var(--text-soft);
    font-size: 11px;
    letter-spacing: 1px;
    transition: 0.2s ease;
}

.edit-history:hover {
    border-color: var(--line-strong);
    color: var(--text);
    background: var(--panel-hover);
}

.empty-state,
.loading-state,
.error-state {
    position: relative;
    z-index: 1;
    padding: 48px 24px;
    border: 1px solid var(--line);
    background: var(--panel);
    text-align: center;
}

.empty-symbol {
    margin-bottom: 15px;
    color: var(--text-soft);
    font-size: 24px;
}

.empty-title {
    margin: 0;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 2px;
}

.empty-description {
    margin: 13px 0 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 2;
}

.site-footer {
    position: relative;
    z-index: 1;
    padding: 0 20px 45px;
    color: var(--text-muted);
    text-align: center;
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 3px;
}

.footer-symbol {
    margin-bottom: 13px;
    color: var(--text-soft);
    font-size: 16px;
}

@media (max-width: 700px) {
    .page-frame {
        inset: 7px;
    }

    .site-header {
        padding: 24px 22px 0;
        gap: 14px;
    }

    .logo-cn {
        font-size: 15px;
        letter-spacing: 1.5px;
    }

    .logo-en {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .header-actions {
        gap: 7px;
    }

    .header-button {
        min-height: 32px;
        padding: 6px 9px;
        font-size: 10px;
    }

    .theme-button {
        width: 32px;
        min-width: 32px;
        padding: 0;
    }

    main {
        width: calc(100% - 38px);
        padding-top: 75px;
        padding-bottom: 70px;
    }

    .hero {
        padding-bottom: 43px;
    }

    .magic-circle {
        top: -17px;
        width: min(82vw, 370px);
    }

    .hero-kicker {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .hero-title {
        font-size: 28px;
        letter-spacing: 5px;
    }

    .hero-subtitle {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .hero-description {
        max-width: 330px;
        font-size: 12px;
    }

    .history-list::before {
        left: 8px;
    }

    .history-item {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        margin-bottom: 25px;
    }

    .history-node {
        grid-column: 1;
        grid-row: 1;
        justify-content: flex-start;
        padding-top: 29px;
    }

    .history-node span {
        width: 13px;
        height: 13px;
    }

    .history-content,
    .history-item:nth-child(even) .history-content,
    .history-item:nth-child(odd) .history-content {
        grid-column: 2;
        grid-row: 1;
        padding: 18px 16px;
        text-align: left;
    }

    .history-title {
        font-size: 17px;
        letter-spacing: 1px;
    }

    .history-description,
    .history-content-text {
        font-size: 12px;
    }

    .history-actions,
    .history-item:nth-child(odd) .history-actions,
    .history-item:nth-child(even) .history-actions {
        justify-content: flex-start;
    }

    .section-divider {
        margin-bottom: 27px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div class="page-frame" aria-hidden="true">
    <span class="frame-star top-left">✡</span>
    <span class="frame-star top-right">✡</span>
    <span class="frame-star bottom-left">✡</span>
    <span class="frame-star bottom-right">✡</span>
</div>

<div class="background-stars" id="backgroundStars" aria-hidden="true"></div>

<div class="floating-symbol symbol-one" aria-hidden="true">✶</div>
<div class="floating-symbol symbol-two" aria-hidden="true">✦</div>
<div class="floating-symbol symbol-three" aria-hidden="true">✧</div>

<header class="site-header">
    <a class="site-logo" href="index.html" aria-label="返回塞垭弥大陆档案馆首页">
        <span class="logo-cn">塞垭弥大陆档案馆</span>
        <span class="logo-en">SEYAMI ARCHIVE</span>
    </a>

    <div class="header-actions">
        <a class="header-button" href="archive.html">返回档案目录</a>
        <button class="header-button theme-button" id="themeToggle" type="button" aria-label="切换昼夜模式">☾</button>
    </div>
</header>

<main>
    <section class="hero">
        <div class="magic-circle" aria-hidden="true">
            <div class="magic-inner-ring"></div>
            <div class="magic-line"></div>
            <div class="magic-line vertical"></div>
            <span class="magic-star">✧</span>
        </div>

        <p class="hero-kicker">CHRONICLES OF SEYAMI</p>
        <h1 class="hero-title">历史记录</h1>
        <div class="hero-subtitle">HISTORY ARCHIVE</div>
        <p class="hero-description">
            记录塞垭弥大陆的时代更迭、重大事件与被岁月铭记的故事。
            每一段历史，都曾在这片大陆留下痕迹。
        </p>
    </section>

    <div class="section-divider" aria-hidden="true">✦</div>

    <section id="historyList" class="history-list" aria-live="polite">
        <div class="loading-state">
            <div class="empty-symbol">✧</div>
            <p class="empty-title">正在翻阅历史卷宗</p>
            <p class="empty-description">请稍候，档案正在载入。</p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-symbol">✧ ✦ ✧</div>
    SEYAMI ARCHIVE
</footer>

<script>
/* ==============================
   Supabase 配置
============================== */

const SUPABASE_URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

/* 只有这个邮箱登录后才显示修改按钮 */
const ADMIN_EMAIL = "1296457710@qq.com";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ==============================
   昼夜模式
============================== */

const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
    const isDay = theme === "day";

    document.body.classList.toggle("day-mode", isDay);
    themeToggle.textContent = isDay ? "☀" : "☾";
    themeToggle.setAttribute(
        "aria-label",
        isDay ? "切换夜间模式" : "切换白昼模式"
    );
}

const savedTheme = localStorage.getItem("seyami-theme") || "night";
applyTheme(savedTheme);

themeToggle.addEventListener("click", function () {
    const nextTheme = document.body.classList.contains("day-mode")
        ? "night"
        : "day";

    localStorage.setItem("seyami-theme", nextTheme);
    applyTheme(nextTheme);
});


/* ==============================
   背景星星
============================== */

(function createBackgroundStars() {
    const container = document.getElementById("backgroundStars");
    const symbols = ["✦", "✧", "✶", "·"];

    for (let i = 0; i < 34; i++) {
        const star = document.createElement("span");

        star.className = "background-star";
        star.textContent = symbols[i % symbols.length];
        star.style.left = (Math.random() * 100) + "%";
        star.style.top = (Math.random() * 100) + "%";
        star.style.fontSize = (7 + Math.random() * 10) + "px";
        star.style.animationDelay = (-Math.random() * 5) + "s";

        container.appendChild(star);
    }
})();


/* ==============================
   管理员身份检查

   游客：返回 false
   未登录：返回 false
   其他邮箱：返回 false
   指定管理员邮箱：返回 true

   这一步只控制按钮是否显示。
============================== */

async function isAdmin() {
    try {
        const { data, error } = await supabaseClient.auth.getUser();

        if (error || !data || !data.user) {
            return false;
        }

        const email = (data.user.email || "").trim().toLowerCase();

        return email === ADMIN_EMAIL.toLowerCase();
    } catch (error) {
        console.error("管理员身份检查失败：", error);
        return false;
    }
}


/* ==============================
   安全处理文本

   避免档案中的文字被当成 HTML 执行。
============================== */

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==============================
   载入历史记录
============================== */

async function loadHistoryRecords() {
    const historyList = document.getElementById("historyList");

    historyList.innerHTML = `
        <div class="loading-state">
            <div class="empty-symbol">✧</div>
            <p class="empty-title">正在翻阅历史卷宗</p>
            <p class="empty-description">请稍候，档案正在载入。</p>
        </div>
    `;

    try {
        /*
         * 先读取公开历史记录。
         * 游客可以正常读取，不需要登录。
         */
        const { data, error } = await supabaseClient
            .from("history_records")
            .select("*")
            .order("id", { ascending: true });

        if (error) {
            throw error;
        }

        if (!data || data.length === 0) {
            historyList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-symbol">✧</div>
                    <h2 class="empty-title">尚无历史记录</h2>
                    <p class="empty-description">
                        这片大陆的历史卷宗仍待书写。
                    </p>
                </div>
            `;
            return;
        }

        /*
         * 在循环外检查一次管理员身份。
         * 不要在 forEach 中使用 await。
         */
        const admin = await isAdmin();

        historyList.innerHTML = "";

        for (const record of data) {
            const item = document.createElement("article");
            item.className = "history-item";

            const year = escapeHTML(record.year || "年代未详");
            const title = escapeHTML(record.title || "未命名事件");
            const era = escapeHTML(record.era || "");
            const location = escapeHTML(record.location || "");
            const description = escapeHTML(record.description || "");
            const content = escapeHTML(record.content || "");

            const metaParts = [];

            if (era) {
                metaParts.push(era);
            }

            if (location) {
                metaParts.push(location);
            }

            const metaHTML = metaParts.length
                ? `<div class="history-meta">${metaParts.join(" · ")}</div>`
                : "";

            const descriptionHTML = description
                ? `<p class="history-description">${description}</p>`
                : "";

            const contentHTML = content
                ? `<div class="history-content-text">${content}</div>`
                : "";

            /*
             * 核心修改：
             * 只有管理员登录时，才生成修改记录按钮。
             * 游客的页面中不会生成这个按钮。
             */
            const editButtonHTML = admin
                ? `
                    <div class="history-actions">
                        <a
                            class="edit-history"
                            href="edit.html?type=history&id=${encodeURIComponent(record.id)}"
                        >✦ 修改记录</a>
                    </div>
                `
                : "";

            item.innerHTML = `
                <div class="history-node" aria-hidden="true">
                    <span>✦</span>
                </div>

                <div class="history-content">
                    <div class="history-year">${year}</div>
                    <h2 class="history-title">${title}</h2>
                    ${metaHTML}
                    ${descriptionHTML}
                    ${contentHTML}
                    ${editButtonHTML}
                </div>
            `;

            historyList.appendChild(item);
        }

    } catch (error) {
        console.error("历史记录载入失败：", error);

        historyList.innerHTML = `
            <div class="error-state">
                <div class="empty-symbol">✧</div>
                <h2 class="empty-title">卷宗暂时无法读取</h2>
                <p class="empty-description">
                    请检查网络连接，稍后重新载入。
                </p>
                <button
                    class="header-button"
                    type="button"
                    onclick="loadHistoryRecords()"
                    style="margin-top: 20px;"
                >重新载入</button>
            </div>
        `;
    }
}


/* ==============================
   页面启动
============================== */

loadHistoryRecords();
</script>

</body>
</html>
