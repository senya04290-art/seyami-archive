<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ================================
   基础
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(38,91,137,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(11,45,75,.45),
            transparent 70%
        ),
        #061426;

    color:#dcecff;

    font-family:"Noto Serif SC",serif;

    transition:
        background .5s ease,
        color .5s ease;
}


/* ================================
   星点
================================ */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background-image:
        radial-gradient(circle,rgba(182,220,255,.7) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(130,191,239,.45) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(220,240,255,.35) 1px,transparent 1.5px);

    background-size:
        180px 180px,
        240px 240px,
        310px 310px;

    background-position:
        20px 30px,
        80px 120px,
        150px 70px;

    opacity:.35;
}


/* ================================
   微小星点
================================ */

.micro-stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background-image:
        radial-gradient(
            circle,
            rgba(180,220,255,.45) .7px,
            transparent .8px
        );

    background-size:95px 95px;

    opacity:.25;
}


/* ================================
   ✡ ✶ 浮动魔法符文
================================ */

.floating-symbols{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:3;
}

.floating-symbol{
    position:absolute;

    font-family:"Cinzel",serif;

    color:rgba(175,220,245,.58);

    text-shadow:
        0 0 8px rgba(120,195,235,.42),
        0 0 18px rgba(90,175,225,.30),
        0 0 34px rgba(90,175,225,.16);

    user-select:none;

    animation:
        symbolFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:var(--delay);

    will-change:
        transform,
        opacity;
}


/* ================================
   不同大小
================================ */

.symbol-1{
    font-size:24px;
}

.symbol-2{
    font-size:17px;
}

.symbol-3{
    font-size:29px;
}

.symbol-4{
    font-size:20px;
}

.symbol-5{
    font-size:14px;
    opacity:.8;
}

.symbol-6{
    font-size:26px;
    opacity:.72;
}


/* ================================
   浮动动画
================================ */

@keyframes symbolFloat{

    0%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);

        opacity:.32;
    }

    25%{
        opacity:.58;
    }

    50%{
        transform:
            translate3d(
                12px,
                -24px,
                0
            )
            rotate(8deg);

        opacity:.68;
    }

    75%{
        opacity:.48;
    }

    100%{
        transform:
            translate3d(
                -10px,
                -48px,
                0
            )
            rotate(-6deg);

        opacity:.32;
    }

}


/* ================================
   四角边框
================================ */

.frame{
    position:fixed;
    inset:18px;

    border:1px solid rgba(111,174,224,.24);

    pointer-events:none;

    z-index:10;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:75px;
    height:75px;

    border-color:rgba(135,195,235,.38);
    border-style:solid;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-width:1px 0 0 1px;
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-width:0 1px 1px 0;
}


/* ================================
   魔法阵
================================ */

.magic-circle{
    position:fixed;

    width:480px;
    height:480px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(92,155,200,.11);

    border-radius:50%;

    pointer-events:none;

    z-index:0;
}

.magic-circle::before{
    content:"";

    position:absolute;

    inset:38px;

    border:1px solid rgba(110,175,220,.08);

    border-radius:50%;
}

.magic-circle::after{
    content:"";

    position:absolute;

    inset:110px;

    border:1px solid rgba(110,175,220,.065);

    border-radius:50%;
}


/* ================================
   魔法阵装饰线
================================ */

.magic-line{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:1px;

    background:rgba(115,180,220,.06);

    transform:translate(-50%,-50%);
}

.magic-line:nth-child(2){
    transform:
        translate(-50%,-50%)
        rotate(60deg);
}

.magic-line:nth-child(3){
    transform:
        translate(-50%,-50%)
        rotate(-60deg);
}


/* ================================
   页面主体
================================ */

.page{
    position:relative;

    z-index:2;

    min-height:100vh;

    padding:
        30px
        70px
        80px;
}


/* ================================
   顶部
   与档案目录完全统一
================================ */

.header{
    position:absolute;

    left:58px;
    right:58px;
    top:38px;

    z-index:20;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    width:auto;
    max-width:none;

    margin:0;
    padding:0;
}


/* ================================
   Logo
   与档案目录完全统一
================================ */

.logo{
    display:flex;

    align-items:flex-start;

    gap:12px;

    color:#d9edff;

    text-decoration:none;

    transition:
        color .6s ease;
}

.logo-symbol{
    color:rgba(137,201,239,.9);

    width:17px;
    height:13px;

    display:flex;

    align-items:flex-start;
    justify-content:center;

    font-size:17px;
    line-height:13px;

    margin:0;
    padding:0;

    text-shadow:
        0 0 7px rgba(76,159,216,.5),
        0 0 15px rgba(49,132,191,.22);

    flex-shrink:0;

    transition:
        color .6s ease,
        text-shadow .6s ease;
}

.logo > span:last-child{
    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1;
}

.logo-cn{
    display:block;

    height:13px;
    line-height:13px;

    color:#d9edff;

    font-size:13px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}

.logo-en{
    display:block;

    margin-top:5px;

    color:rgba(157,204,239,.63);

    font-family:"Times New Roman",serif;

    font-size:8px;
    line-height:8px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}


/* ================================
   右侧控制
   与档案目录完全统一
================================ */

.header-right{
    display:flex;

    align-items:center;

    gap:20px;
}

.back{
    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:1px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.back:hover{
    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}

.theme-toggle{
    display:flex;

    align-items:center;

    gap:7px;

    height:28px;

    padding:
        0 11px;

    border:
        1px solid
        rgba(111,174,224,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;

    white-space:nowrap;

    transition:
        color .35s ease,
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}

.theme-toggle:hover{
    color:#d9efff;

    border-color:
        rgba(122,192,235,.62);

    background:
        rgba(8,31,52,.55);

    box-shadow:
        0 0 14px
        rgba(76,151,202,.12);
}

.theme-icon{
    font-size:12px;

    line-height:1;

    letter-spacing:0;
}


/* ================================
   Hero
================================ */

.hero{
    text-align:center;

    margin-top:72px;

    position:relative;
}

.hero-en{
    font-family:"Cinzel",serif;

    font-size:12px;

    letter-spacing:7px;

    color:rgba(165,205,232,.55);

    margin-bottom:13px;
}

.hero-title{
    font-family:"Cinzel",serif;

    font-size:46px;

    font-weight:400;

    letter-spacing:9px;

    color:#dceeff;

    text-shadow:
        0 0 20px rgba(94,172,222,.12);
}

.hero-cn{
    margin-top:14px;

    font-size:14px;

    letter-spacing:7px;

    color:rgba(188,214,232,.64);
}


/* ================================
   时间轴区域
================================ */

.history{
    width:min(900px,92%);

    margin:82px auto 0;

    position:relative;
}


/* 中央时间轴 */

.timeline{
    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:1px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(110,170,210,.40) 8%,
            rgba(110,170,210,.40) 92%,
            transparent
        );
}


/* ================================
   历史记录
================================ */

.history-list{
    display:flex;

    flex-direction:column;

    gap:68px;

    position:relative;

    z-index:2;
}

.history-item{
    width:100%;

    display:grid;

    grid-template-columns:
        1fr
        42px
        1fr;

    align-items:center;
}


/* 左右内容 */

.history-content{
    padding:24px 34px;

    border:1px solid rgba(110,170,210,.15);

    background:
        linear-gradient(
            135deg,
            rgba(17,42,61,.34),
            rgba(8,28,49,.24)
        );

    min-height:145px;

    transition:
        border-color .35s ease,
        background .35s ease,
        transform .35s ease;
}

.history-content:hover{
    border-color:rgba(130,190,225,.30);

    background:
        linear-gradient(
            135deg,
            rgba(25,54,76,.40),
            rgba(10,32,50,.30)
        );

    transform:translateY(-2px);
}


/* 左侧 */

.history-item:nth-child(odd) .history-content{
    grid-column:1;

    text-align:right;
}


/* 右侧 */

.history-item:nth-child(even) .history-content{
    grid-column:3;

    text-align:left;
}


/* ================================
   时间点
================================ */

.timeline-point{
    grid-column:2;

    grid-row:1;

    width:13px;
    height:13px;

    margin:auto;

    border-radius:50%;

    border:1px solid rgba(150,205,235,.60);

    background:#061426;

    box-shadow:
        0 0 0 4px rgba(95,165,210,.055),
        0 0 14px rgba(90,175,225,.20);

    position:relative;

    z-index:3;
}


/* ================================
   历史文字
================================ */

.history-era{
    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    color:rgba(140,190,220,.58);

    margin-bottom:8px;
}

.history-date{
    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    color:rgba(180,215,235,.48);

    margin-bottom:16px;
}

.history-title{
    font-family:"Cinzel",serif;

    font-size:19px;

    font-weight:400;

    letter-spacing:2px;

    color:#d2e5f2;

    margin-bottom:7px;
}

.history-cn{
    font-size:12px;

    letter-spacing:3px;

    color:rgba(190,216,232,.65);

    margin-bottom:15px;
}

.history-description{
    font-size:11px;

    line-height:2;

    letter-spacing:1px;

    color:rgba(175,202,220,.50);
}


/* ================================
   空白提示
================================ */

.empty-history{
    text-align:center;

    padding:45px 20px;

    border:1px solid rgba(110,170,210,.12);

    background:rgba(10,30,48,.22);

    color:rgba(170,200,220,.42);

    font-size:11px;

    letter-spacing:2px;
}

.empty-history-en{
    display:block;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:9px;

    color:rgba(145,190,220,.45);
}


/* ================================
   页脚
================================ */

.footer{
    text-align:center;

    margin-top:100px;

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:4px;

    color:rgba(150,190,215,.28);
}


/* ================================
   日间模式
================================ */

body.day{
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(165,211,238,.20),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),
        #f4f9fd;

    color:#2e5069;
}

body.day .stars{
    opacity:.8;
}

body.day .micro-stars{
    opacity:.65;
}

body.day .floating-symbol{
    color:rgba(87,151,199,.50);

    text-shadow:none;
}

body.day .frame{
    border-color:
        rgba(91,145,184,.34);
}

body.day .frame::before,
body.day .frame::after{
    border-color:
        rgba(79,141,190,.68);
}

body.day .logo{
    color:#2e526c;
}

body.day .logo-symbol{
    color:
        rgba(79,151,201,.84);

    text-shadow:
        0 0 7px
        rgba(86,158,208,.20);
}

body.day .logo-cn{
    color:#2e526c;
}

body.day .logo-en{
    color:
        rgba(81,137,173,.62);
}

body.day .back{
    color:
        rgba(62,99,127,.70);
}

body.day .back:hover{
    color:#28536f;

    text-shadow:
        0 0 8px
        rgba(76,151,202,.14);
}

body.day .theme-toggle{
    border-color:
        rgba(91,145,184,.34);

    background:
        rgba(248,252,255,.78);

    color:
        rgba(61,98,125,.76);
}

body.day .theme-toggle:hover{
    border-color:
        rgba(79,151,200,.62);

    background:
        rgba(248,252,255,.90);

    color:#28536f;

    box-shadow:
        0 0 14px
        rgba(76,151,202,.11);
}

body.day .hero-en{
    color:
        rgba(81,137,173,.68);
}

body.day .hero-title{
    color:#2b506a;

    text-shadow:
        0 0 18px
        rgba(80,151,201,.065);
}

        rgba(45,82,106,.80);
}

body.day .magic-circle{

        rgba(79,148,196,.26);

        0 0 50px
        rgba(70,142,196,.055),

        inset
        0 0 60px
        rgba(78,151,204,.028);
}

body.day .magic-circle::before{
    border-color:
        rgba(79,148,196,.26);

    box-shadow:
        0 0 25px
        rgba(70,142,196,.055);
}

body.day .magic-circle::after{
    border-color:
        rgba(101,168,207,.20);

    box-shadow:
        0 0 18px
        rgba(76,151,202,.065);
}

body.day .timeline{
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(82,151,198,.32) 8%,
            rgba(82,151,198,.32) 92%,
            transparent
        );
}

body.day .timeline-point{
    background:#f4f9fd;

    border-color:
        rgba(79,141,190,.55);

    box-shadow:
        0 0 0 4px
        rgba(76,151,202,.05),

        0 0 14px
        rgba(76,151,202,.12);
}

body.day .history-content{
    border-color:
        rgba(82,151,198,.36);

    background:
        linear-gradient(
            145deg,
            rgba(242,249,253,.76),
            rgba(226,240,249,.68)
        );
}

body.day .history-content:hover{
    border-color:
        rgba(79,151,200,.62);

    background:
        linear-gradient(
            145deg,
            rgba(225,238,247,1),
            rgba(250,253,255,1)
        );

    box-shadow:
        0 10px 35px
        rgba(55,95,115,.10),

        0 0 25px
        rgba(76,151,202,.13);
}

body.day .history-era{
    color:
        rgba(81,137,173,.68);
}

body.day .history-date{
    color:
        rgba(65,106,133,.64);
}

body.day .history-title{
    color:#2b506a;
}

body.day .history-cn{
    color:
        rgba(65,106,133,.64);
}

body.day .history-description{
    color:
        rgba(65,106,133,.64);
}

body.day .empty-history{
    border-color:
        rgba(82,151,198,.36);

    background:
        linear-gradient(
            145deg,
            rgba(242,249,253,.76),
            rgba(226,240,249,.68)
        );

    color:
        rgba(65,106,133,.64);
}

body.day .empty-history-en{
    color:
        rgba(81,137,173,.68);
}

body.day .footer{
    color:
        rgba(73,115,143,.40);
}


/* ================================
   800px
   与档案目录统一
================================ */

@media(max-width:800px){

    .header{
        left:35px;
        right:35px;
        top:30px;
    }

    .header-right{
        gap:14px;
    }
}


/* ================================
   600px
   与档案目录统一
================================ */

@media(max-width:600px){

    .page{
        padding:
            30px
            28px
            60px;
    }

    .frame{
        inset:12px;
    }

    .header{
        left:25px;
        right:25px;
        top:24px;

        width:auto;
        max-width:none;

        margin:0;
        padding:0;

        align-items:flex-start;
    }

    .header-right{
        gap:8px;
    }

    .back{
        font-size:10px;
        letter-spacing:1px;
    }

    .theme-toggle{
        height:25px;

        padding:
            0 7px;

        gap:5px;

        font-size:6px;

        letter-spacing:1px;
    }

    .hero{
        margin-top:72px;
    }

    .hero-en{
        font-size:9px;
        letter-spacing:4px;
    }

    .hero-title{
        font-size:30px;
        letter-spacing:5px;
    }

    .hero-cn{
        font-size:12px;
        letter-spacing:4px;
    }

    .history{
        width:100%;
        margin-top:60px;
    }

    .timeline{
        left:10px;
        transform:none;
    }

    .history-list{
        gap:38px;
    }

    .history-item{
        display:block;
        padding-left:30px;
        position:relative;
    }

    .timeline-point{
        position:absolute;

        left:4px;
        top:25px;

        width:13px;
        height:13px;
    }

    .history-item:nth-child(odd) .history-content,
    .history-item:nth-child(even) .history-content{
        text-align:left;
    }

    .history-content{
        padding:20px 20px;
        min-height:auto;
    }

    .history-title{
        font-size:17px;
    }

    .history-cn{
        font-size:11px;
    }

    .history-description{
        font-size:10px;
        line-height:1.9;
    }

    .empty-history{
        padding:35px 15px;
    }

    .footer{
        margin-top:70px;
    }

    .floating-symbol{
        transform:scale(.75);
    }
}


/* ================================
   360px
   与档案目录统一
================================ */

@media(max-width:360px){

    .header{
        left:20px;
        right:20px;
        top:24px;
    }

    .header-right{
        gap:5px;
    }
}

</style>
</head>

<script>

/* =========================================
   历史资料
========================================= */

const historyRecords = [

    /*
    {
        era: "",
        date: "",
        title: "",
        cn: "",
        description: ""
    }
    */

];


/* =========================================
   生成历史记录
========================================= */

const historyList =
    document.getElementById("historyList");


function renderHistory(){

    historyList.innerHTML = "";


    if(historyRecords.length === 0){

        historyList.innerHTML = `

            <div class="empty-history">

                <span class="empty-history-en">
                    ARCHIVE EMPTY
                </span>

                暂无历史记录

            </div>

        `;

        return;
    }


    historyRecords.forEach((record,index)=>{

        const item =
            document.createElement("div");

        item.className =
            "history-item";


        item.innerHTML = `

            <div class="history-content">

                ${
                    record.era
                    ?
                    `<div class="history-era">
                        ${record.era}
                    </div>`
                    :
                    ""
                }

                ${
                    record.date
                    ?
                    `<div class="history-date">
                        ${record.date}
                    </div>`
                    :
                    ""
                }

                ${
                    record.title
                    ?
                    `<div class="history-title">
                        ${record.title}
                    </div>`
                    :
                    ""
                }

                ${
                    record.cn
                    ?
                    `<div class="history-cn">
                        ${record.cn}
                    </div>`
                    :
                    ""
                }

                ${
                    record.description
                    ?
                    `<div class="history-description">
                        ${record.description}
                    </div>`
                    :
                    ""
                }

            </div>


            <div class="timeline-point"></div>

        `;


        historyList.appendChild(item);

    });

}


renderHistory();


/* =========================================
   日间 / 夜间模式
========================================= */

const themeToggle =
    document.getElementById("themeToggle");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day");

        themeIcon.textContent =
            "☀";

        themeText.textContent =
            "DAY";

    }else{

        document.body.classList.remove("day");

        themeIcon.textContent =
            "☾";

        themeText.textContent =
            "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem("seyami-theme");


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList.contains("day");

        const nextTheme =
            isDay
                ? "night"
                : "day";

        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );

        applyTheme(
            nextTheme
        );

    }
);

</script>
