<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>历史记录 · 塞垭弥大陆档案馆</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet">

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    background:#061522;
    color:#c8e4f7;
    font-family:"Noto Serif SC","Times New Roman",serif;
    transition:
        background .6s ease,
        color .6s ease;
}

.page{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(38,103,151,.16),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 52%,
            rgba(9,38,62,.75),
            transparent 72%
        ),
        #061522;

    transition:background .6s ease;
}


/* =========================
   外框
========================= */

.frame{
    position:fixed;
    inset:18px;
    border:1px solid rgba(108,171,211,.18);
    pointer-events:none;
    z-index:10;
}


/* =========================
   星空
========================= */

.stars{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;

    background-image:
        radial-gradient(
            circle,
            rgba(185,224,247,.72) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(130,190,225,.45) 0 1px,
            transparent 1.5px
        );

    background-size:
        137px 137px,
        193px 193px;

    background-position:
        11px 17px,
        72px 51px;

    opacity:.42;
}

.micro-stars{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;

    background-image:
        radial-gradient(
            circle,
            rgba(191,226,245,.5) 0 .6px,
            transparent 1px
        );

    background-size:83px 83px;
    background-position:31px 44px;

    opacity:.3;
}


/* =========================
   魔法阵
========================= */

.magic-circle{
    position:absolute;
    left:50%;
    top:50%;
    width:min(62vw,720px);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border:1px solid rgba(103,174,218,.12);
    border-radius:50%;
    z-index:1;
    pointer-events:none;
}

.magic-circle::before{
    content:"";
    position:absolute;
    inset:8%;
    border:1px solid rgba(105,176,219,.09);
    border-radius:50%;
}

.magic-circle::after{
    content:"";
    position:absolute;
    inset:18%;
    border:1px solid rgba(105,176,219,.07);
    border-radius:50%;
}


/* =========================
   标题栏
========================= */

.header{
    position:absolute;
    left:58px;
    right:58px;
    top:38px;
    z-index:20;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    width:auto;
    max-width:none;
    margin:0;
    padding:0;
}

.logo{
    display:flex;
    align-items:flex-start;
    gap:12px;

    color:#d9edff;
    text-decoration:none;

    transition:color .6s ease;
}

.logo-symbol{
    color:rgba(137,201,239,.9);

    width:17px;
    height:13px;

    display:flex;
    align-items:flex-start;
    justify-content:center;

    font-size:17px;
    line-height:13px;

    margin:0;
    padding:0;

    text-shadow:
        0 0 7px rgba(76,159,216,.5),
        0 0 15px rgba(49,132,191,.22);

    flex-shrink:0;

    transition:
        color .6s ease,
        text-shadow .6s ease;
}

.logo-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1;
}

.logo-cn{
    display:block;

    height:13px;
    line-height:13px;

    color:#d9edff;

    font-size:13px;
    letter-spacing:3px;

    white-space:nowrap;

    transition:color .6s ease;
}

.logo-en{
    display:block;

    margin-top:5px;

    color:rgba(157,204,239,.63);

    font-family:"Times New Roman",serif;

    font-size:8px;
    line-height:8px;
    letter-spacing:3px;

    white-space:nowrap;

    transition:color .6s ease;
}

.header-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.back{
    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:11px;
    letter-spacing:1px;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.back:hover{
    color:#d9efff;

    text-shadow:
        0 0 8px
        rgba(102,180,231,.35);
}

.theme-toggle{
    display:flex;
    align-items:center;
    gap:7px;

    height:28px;
    padding:0 11px;

    border:1px solid rgba(111,174,224,.32);

    background:rgba(8,28,49,.35);

    color:rgba(191,220,243,.68);

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:8px;
    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;
    white-space:nowrap;

    transition:
        color .35s ease,
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}

.theme-toggle:hover{
    color:#d9efff;

    border-color:rgba(122,192,235,.62);

    background:rgba(8,31,52,.55);

    box-shadow:
        0 0 14px
        rgba(76,151,202,.12);
}

.theme-icon{
    font-size:12px;
    line-height:1;
    letter-spacing:0;
}


/* =========================
   历史记录主体
========================= */

.history-area{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(920px,80vw);
    max-height:68vh;

    z-index:5;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;
}

.history-title{
    margin:0;

    color:#d9edff;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:30px;
    font-weight:400;

    letter-spacing:7px;

    transition:color .6s ease;
}

.history-subtitle{
    margin-top:12px;

    color:rgba(164,204,231,.62);

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:10px;
    letter-spacing:4px;

    transition:color .6s ease;
}

.history-line{
    width:1px;
    height:70px;

    margin:28px 0 25px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(113,183,224,.42),
            transparent
        );
}

.history-list{
    width:100%;
    max-height:42vh;

    overflow-y:auto;

    padding:0 15px;

    scrollbar-width:thin;
    scrollbar-color:
        rgba(108,174,218,.3)
        transparent;
}

.history-list::-webkit-scrollbar{
    width:4px;
}

.history-list::-webkit-scrollbar-track{
    background:transparent;
}

.history-list::-webkit-scrollbar-thumb{
    background:rgba(108,174,218,.3);
}


/* =========================
   空状态
========================= */

.empty-history{
    padding:30px 20px;

    color:rgba(159,201,228,.45);

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:11px;
    letter-spacing:3px;

    line-height:2;
}

.empty-history::before{
    content:"✦";

    display:block;

    margin-bottom:15px;

    color:rgba(108,178,220,.38);

    font-size:18px;
}


/* =========================
   历史记录卡片
========================= */

.history-item{
    position:relative;

    display:grid;
    grid-template-columns:100px 1fr;

    width:100%;

    padding:20px 10px;

    border-top:1px solid
        rgba(110,175,214,.12);

    text-align:left;
}

.history-item:last-child{
    border-bottom:1px solid
        rgba(110,175,214,.12);
}

.history-date{
    color:rgba(132,188,220,.58);

    font-family:"Cinzel",serif;

    font-size:10px;
    letter-spacing:1px;
}

.history-content{
    color:rgba(190,220,239,.76);

    font-size:12px;

    line-height:1.9;
}


/* =========================
   漂浮符号
========================= */

.symbol{
    position:fixed;

    pointer-events:none;

    z-index:15;

    display:block;

    color:rgba(115,180,222,.72);

    font-family:"Times New Roman",serif;
    font-weight:400;

    line-height:1;

    opacity:.75;

    text-shadow:none;

    animation:
        floatSymbol 9s ease-in-out infinite;
}

.symbol-one{
    left:8%;
    top:29%;

    font-size:25px;

    animation-delay:-2s;
}

.symbol-two{
    right:9%;
    top:55%;

    font-size:21px;

    animation-delay:-5s;
}

.symbol-three{
    left:22%;
    top:17%;

    font-size:17px;

    animation-duration:11s;
    animation-delay:-4s;
}

.symbol-four{
    right:23%;
    top:28%;

    font-size:15px;

    animation-duration:10s;
    animation-delay:-7s;
}

.symbol-five{
    left:13%;
    top:68%;

    font-size:14px;

    animation-duration:12s;
    animation-delay:-1s;
}

.symbol-six{
    right:17%;
    top:78%;

    font-size:18px;

    animation-duration:10s;
    animation-delay:-6s;
}

.symbol-seven{
    left:28%;
    top:48%;

    font-size:12px;

    animation-duration:13s;
    animation-delay:-9s;
}

.symbol-eight{
    right:29%;
    top:70%;

    font-size:13px;

    animation-duration:11s;
    animation-delay:-3s;
}

.symbol-nine{
    left:35%;
    top:82%;

    font-size:16px;

    animation-duration:14s;
    animation-delay:-8s;
}

.symbol-ten{
    right:12%;
    top:16%;

    font-size:12px;

    animation-duration:12s;
    animation-delay:-10s;
}

@keyframes floatSymbol{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);

        opacity:.58;
    }

    50%{
        transform:
            translateY(-12px)
            rotate(8deg);

        opacity:.82;
    }
}

body.day .history-subtitle{

}

body.day .history-line{

        );
}

body.day .empty-history{

}

body.day .empty-history::before{

}

body.day .history-item{

body.day .history-date{

body.day .history-content{

body.day .symbol{

    opacity:.72;
}

<body>

<div class="page">

    <div class="stars"></div>
    <div class="micro-stars"></div>

    <div class="magic-circle"></div>

    <div class="frame"></div>


    <!-- 漂浮符号 -->

    <div class="symbol symbol-one">✡</div>
    <div class="symbol symbol-two">✶</div>
    <div class="symbol symbol-three">✦</div>
    <div class="symbol symbol-four">✧</div>
    <div class="symbol symbol-five">⋆</div>
    <div class="symbol symbol-six">✦</div>
    <div class="symbol symbol-seven">✧</div>
    <div class="symbol symbol-eight">⋆</div>
    <div class="symbol symbol-nine">✶</div>
    <div class="symbol symbol-ten">✧</div>


    <!-- 顶部 -->

    <header class="header">

        <a href="index.html"
           class="logo">

            <span class="logo-symbol">✦</span>

            <span class="logo-text">

                <span class="logo-cn">
                    塞垭弥大陆档案馆
                </span>

                <span class="logo-en">
                    SEYAMI ARCHIVE
                </span>

            </span>

        </a>


        <div class="header-right">

            <a href="archive.html"
               class="back">
                ← 返回档案目录
            </a>

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="切换昼夜模式">

                <span
                    class="theme-icon"
                    id="themeIcon">
                    ☾
                </span>

                <span id="themeText">
                    NIGHT
                </span>

            </button>

        </div>

    </header>


    <!-- 历史记录 -->

    <main class="history-area">

        <h1 class="history-title">
            历史记录
        </h1>

        <div class="history-subtitle">
            ARCHIVE HISTORY
        </div>

        <div class="history-line"></div>

        <div
            class="history-list"
            id="historyList">

            <div class="empty-history">
                暂无历史记录
            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   昼夜模式
========================= */

const themeToggle =
    document.getElementById("themeToggle");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day");

        themeIcon.textContent = "☀";
        themeText.textContent = "DAY";

    }else{

        document.body.classList.remove("day");

        themeIcon.textContent = "☾";
        themeText.textContent = "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem("seyami-theme");


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList
            .contains("day");

        const nextTheme =
            isDay
                ? "night"
                : "day";

        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );

        applyTheme(nextTheme);

    }
);


/* =========================
   历史记录
========================= */

const historyList =
    document.getElementById("historyList");

const historyRecords = [];


function renderHistory(){

    if(!historyRecords.length){

        historyList.innerHTML = `
            <div class="empty-history">
                暂无历史记录
            </div>
        `;

        return;
    }


    historyList.innerHTML =
        historyRecords.map(
            item => `

                <div class="history-item">

                    <div class="history-date">
                        ${item.date}
                    </div>

                    <div class="history-content">
                        ${item.content}
                    </div>

                </div>

            `
        ).join("");

}


renderHistory();

</script>
