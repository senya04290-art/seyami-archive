<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    background:#061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    overflow-x:hidden;

    transition:
        background .35s ease,
        color .35s ease;
}

/* =========================
   页面框架
========================= */

.page-frame{

    position:fixed;

    inset:18px;

    border:1px solid rgba(157,194,235,.22);

    pointer-events:none;

    z-index:20;
}

.page-frame::before,
.page-frame::after{

    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-color:rgba(157,194,235,.45);

    border-style:solid;
}

.page-frame::before{

    left:-1px;
    top:-1px;

    border-width:1px 0 0 1px;
}

.page-frame::after{

    right:-1px;
    bottom:-1px;

    border-width:0 1px 1px 0;
}

/* =========================
   顶部
========================= */

.header{

    position:relative;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    padding:38px 58px 0;
}

/* logo */

.logo{

    display:flex;

    flex-direction:column;

    line-height:1.1;

    text-decoration:none;

    color:inherit;
}

.logo-cn{

    font-size:20px;

    letter-spacing:4px;
}

.logo-en{

    margin-top:6px;

    font-family:"Cinzel",serif;

    font-size:11px;

    letter-spacing:3px;

    opacity:.68;
}

/* 返回 */

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:9px;

    color:inherit;

    text-decoration:none;

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:11px;

    letter-spacing:2px;

    opacity:.72;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.back-btn:hover{

    opacity:1;

    transform:translateX(-3px);
}

/* =========================
   主题按钮
========================= */

.theme-toggle{

    position:fixed;

    right:40px;

    bottom:34px;

    z-index:50;

    width:42px;

    height:42px;

    border:1px solid rgba(157,194,235,.35);

    border-radius:50%;

    background:rgba(6,20,38,.65);

    color:#dcecff;

    cursor:pointer;

    font-size:15px;

    transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease;
}

.theme-toggle:hover{

    transform:rotate(15deg);

    border-color:rgba(190,220,255,.7);
}

/* =========================
   浮动星点
========================= */

.stars,
.micro-stars,
.arcane-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;
}

.stars span,
.micro-stars span,
.arcane-stars span{

    position:absolute;

    user-select:none;
}

.stars span{

    color:rgba(208,230,255,.45);

    font-size:13px;
}

.micro-stars span{

    color:rgba(208,230,255,.25);

    font-size:7px;
}

.arcane-stars span{

    color:rgba(184,216,255,.3);

    font-size:15px;
}

/* =========================
   主内容
========================= */

.main{

    position:relative;

    z-index:5;

    width:min(1100px,88vw);

    margin:0 auto;

    padding:
        115px 0
        100px;
}

/* =========================
   Hero
========================= */

.hero{

    position:relative;

    text-align:center;

    margin-bottom:110px;
}

.hero-en{

    font-family:"Cinzel",serif;

    font-size:clamp(36px,6vw,72px);

    font-weight:400;

    letter-spacing:
        clamp(7px,1.8vw,17px);

    line-height:1;

    color:#dcecff;
}

.hero-cn{

    margin-top:20px;

    font-size:14px;

    letter-spacing:7px;

    opacity:.62;
}

.hero-line{

    width:90px;

    height:1px;

    margin:28px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(184,216,255,.55),
            transparent
        );
}

/* =========================
   魔法圆环
========================= */

.magic-circle{

    position:absolute;

    left:50%;

    top:50%;

    width:min(64vw,650px);

    height:min(64vw,650px);

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(154,194,237,.10);

    border-radius:50%;

    pointer-events:none;

    z-index:-1;
}

.magic-circle::before{

    content:"";

    position:absolute;

    inset:12%;

    border:
        1px solid
        rgba(154,194,237,.08);

    border-radius:50%;
}

.magic-circle::after{

    content:"";

    position:absolute;

    inset:28%;

    border:
        1px solid
        rgba(154,194,237,.07);

    border-radius:50%;
}

/* =========================
   时间线
========================= */

.timeline{

    position:relative;

    width:100%;
}

.timeline::before{

    content:"";

    position:absolute;

    left:50%;

    top:0;

    bottom:0;

    width:1px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(157,194,235,.35) 8%,
            rgba(157,194,235,.35) 92%,
            transparent
        );

    transform:translateX(-50%);
}

/* =========================
   历史项目
========================= */

.history-item{

    position:relative;

    display:grid;

    grid-template-columns:
        1fr 70px 1fr;

    align-items:start;

    margin-bottom:95px;
}

.history-item:last-child{

    margin-bottom:0;
}

.history-dot{

    grid-column:2;

    justify-self:center;

    width:9px;

    height:9px;

    margin-top:8px;

    border:1px solid rgba(211,232,255,.7);

    border-radius:50%;

    background:#061426;

    box-shadow:
        0 0 0 4px rgba(157,194,235,.06);
}

.history-content{

    width:min(390px,100%);

    padding:0 10px;
}

.history-item:nth-child(odd)
.history-content{

    grid-column:1;

    justify-self:end;

    text-align:right;
}

.history-item:nth-child(even)
.history-content{

    grid-column:3;

    justify-self:start;

    text-align:left;
}

/* 年代 */

.history-year{

    margin-bottom:12px;

    font-family:"Cinzel",serif;

    font-size:13px;

    letter-spacing:4px;

    color:rgba(190,219,250,.72);
}

/* 标题 */

.history-title{

    margin:0;

    font-size:23px;

    font-weight:500;

    letter-spacing:3px;

    line-height:1.5;
}

/* 简介 */

.history-description{

    margin-top:15px;

    font-size:13px;

    line-height:2;

    letter-spacing:1px;

    opacity:.67;
}

/* 信息 */

.history-meta{

    margin-top:14px;

    font-size:10px;

    letter-spacing:2px;

    opacity:.42;
}

/* 内容 */

.history-record{

    margin-top:23px;

    padding-top:20px;

    border-top:1px solid rgba(157,194,235,.12);

    font-size:12px;

    line-height:2.1;

    letter-spacing:.8px;

    opacity:.72;

    white-space:pre-wrap;
}

/* =========================
   修改按钮
========================= */

.edit-history{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:20px;

    padding:8px 16px;

    border:1px solid rgba(157,194,235,.25);

    background:rgba(7,24,45,.42);

    color:#dcecff;

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:10px;

    letter-spacing:2px;

    transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease;
}

.edit-history:hover{

    border-color:rgba(190,220,255,.65);

    background:rgba(20,48,78,.55);

    transform:translateY(-2px);
}

/* =========================
   空状态
========================= */

.empty{

    text-align:center;

    padding:80px 0;

    opacity:.5;

    letter-spacing:3px;

    font-size:13px;
}

.error{

    text-align:center;

    padding:80px 0;

    color:#e7b6b6;

    font-size:13px;

    letter-spacing:2px;
}

/* =========================
   Footer
========================= */

.footer{

    margin-top:120px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.3;
}

/* =========================
   日间模式
   只增加白色比例
========================= */

body.day{

    background:#eef4fa;

    color:#17283c;
}

body.day .page-frame{

    border-color:rgba(44,76,108,.18);
}

body.day .hero-en{

    color:#17283c;
}

body.day .theme-toggle{

    background:rgba(255,255,255,.7);

    color:#17283c;

    border-color:rgba(44,76,108,.25);
}

body.day .magic-circle{

    border-color:rgba(44,76,108,.10);
}

body.day .magic-circle::before{

    border-color:rgba(44,76,108,.08);
}

body.day .magic-circle::after{

    border-color:rgba(44,76,108,.07);
}

body.day .timeline::before{

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(44,76,108,.22) 8%,
            rgba(44,76,108,.22) 92%,
            transparent
        );
}

body.day .history-dot{

    background:#eef4fa;

    border-color:rgba(44,76,108,.5);
}

body.day .edit-history{

    background:rgba(255,255,255,.55);

    color:#17283c;

    border-color:rgba(44,76,108,.22);
}

body.day .stars span,
body.day .micro-stars span,
body.day .arcane-stars span{

    color:rgba(44,76,108,.22);
}

/* =========================
   手机
========================= */

@media(max-width:700px){

    .page-frame{

        inset:10px;
    }

    .header{

        padding:28px 28px 0;
    }

    .logo-cn{

        font-size:15px;

        letter-spacing:3px;
    }

    .logo-en{

        font-size:9px;

        letter-spacing:2px;
    }

    .main{

        width:84vw;

        padding-top:90px;
    }

    .hero{

        margin-bottom:75px;
    }

    .hero-en{

        font-size:35px;

        letter-spacing:7px;
    }

    .hero-cn{

        font-size:11px;

        letter-spacing:4px;
    }

    .magic-circle{

        width:90vw;

        height:90vw;
    }

    .timeline::before{

        left:14px;

        transform:none;
    }

    .history-item{

        display:block;

        padding-left:42px;

        margin-bottom:65px;
    }

    .history-dot{

        position:absolute;

        left:10px;

        top:0;

        margin:0;
    }

    .history-content{

        width:100%;

        padding:0;

        text-align:left !important;

    }

    .history-item:nth-child(odd)
    .history-content,
    .history-item:nth-child(even)
    .history-content{

        grid-column:auto;

        justify-self:auto;
    }

    .history-title{

        font-size:19px;
    }

    .history-description{

        font-size:12px;
    }

    .history-record{

        font-size:11px;
    }

    .theme-toggle{

        right:24px;

        bottom:24px;
    }
}

</style>

</head>


<body>

<!-- 页面边框 -->

<div class="page-frame"></div>


<!-- 浮动星点 -->

<div class="stars">

    <span style="left:8%;top:17%;">✦</span>
    <span style="left:18%;top:73%;">✶</span>
    <span style="left:83%;top:21%;">✡</span>
    <span style="left:91%;top:66%;">✦</span>
    <span style="left:67%;top:82%;">✶</span>

</div>


<div class="micro-stars">

    <span style="left:13%;top:34%;">·</span>
    <span style="left:28%;top:19%;">·</span>
    <span style="left:74%;top:31%;">·</span>
    <span style="left:88%;top:46%;">·</span>
    <span style="left:56%;top:14%;">·</span>
    <span style="left:39%;top:88%;">·</span>

</div>


<div class="arcane-stars">

    <span style="left:5%;top:49%;">✶</span>
    <span style="left:95%;top:37%;">✶</span>
    <span style="left:78%;top:9%;">✦</span>
    <span style="left:23%;top:92%;">✦</span>

</div>


<!-- Header -->

<header class="header">

    <a
        href="index.html"
        class="logo"
    >

        <span class="logo-cn">
            塞垭弥大陆档案馆
        </span>

        <span class="logo-en">
            SEYAMI ARCHIVE
        </span>

    </a>


    <a
        href="archive.html"
        class="back-btn"
    >

        ← 返回档案目录

    </a>

</header>


<!-- 主体 -->

<main class="main">


    <!-- Hero -->

    <section class="hero">

        <div class="magic-circle"></div>

        <div class="hero-en">
            HISTORY
        </div>

        <div class="hero-cn">
            历史记录
        </div>

        <div class="hero-line"></div>

    </section>


    <!-- 时间线 -->

    <section
        class="timeline"
        id="historyList"
    >

        <div class="empty">
            正在读取历史记录……
        </div>

    </section>


    <div class="footer">

        SEYAMI · HISTORY ARCHIVE

    </div>


</main>


<!-- Theme -->

<button
    class="theme-toggle"
    id="themeToggle"
    aria-label="切换主题"
>
    ☼
</button>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   DOM
========================= */

const historyList =
    document.getElementById("historyList");


/* =========================
   加载历史记录
========================= */

async function loadHistory(){

    const {
        data,
        error
    } = await supabaseClient

        .from("history_records")

        .select(`
            id,
            year,
            title,
            era,
            location,
            description,
            content,
            created_at,
            updated_at
        `)

        .order("id", {
            ascending:true
        });


    if(error){

        console.error(error);

        historyList.innerHTML = `
            <div class="error">
                历史记录读取失败
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        historyList.innerHTML = `
            <div class="empty">
                暂无历史记录
            </div>
        `;

        return;
    }


    historyList.innerHTML =
        data.map(record => {

            const year =
                record.year || "—";

            const title =
                record.title || "未命名事件";

            const description =
                record.description || "";

            const era =
                record.era || "";

            const location =
                record.location || "";

            const content =
                record.content || "";


            let meta = "";

            if(era && location){

                meta =
                    `${era} · ${location}`;

            }else if(era){

                meta = era;

            }else if(location){

                meta = location;

            }


            return `

                <article
                    class="history-item"
                >

                    <div class="history-content">

                        <div class="history-year">
                            ${escapeHTML(year)}
                        </div>

                        <h2 class="history-title">
                            ${escapeHTML(title)}
                        </h2>

                        ${
                            description
                            ?
                            `
                            <div class="history-description">
                                ${escapeHTML(description)}
                            </div>
                            `
                            :
                            ""
                        }

                        ${
                            meta
                            ?
                            `
                            <div class="history-meta">
                                ${escapeHTML(meta)}
                            </div>
                            `
                            :
                            ""
                        }

                        ${
                            content
                            ?
                            `
                            <div class="history-record">
                                ${escapeHTML(content)}
                            </div>
                            `
                            :
                            ""
                        }

                        <a
                            class="edit-history"
                            href="admin.html?type=history&id=${encodeURIComponent(record.id)}"
                        >
                            ✦ 修改记录
                        </a>

                    </div>

                    <div class="history-dot"></div>

                </article>

            `;

        }).join("");

}


/* =========================
   防止文本注入 HTML
========================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================
   主题
========================= */

const themeToggle =
    document.getElementById("themeToggle");


function applyTheme(){

    const theme =
        localStorage.getItem(
            "seyami-theme"
        );


    if(theme === "day"){

        document.body.classList.add("day");

        themeToggle.textContent = "☾";

    }else{

        document.body.classList.remove("day");

        themeToggle.textContent = "☼";

    }

}


themeToggle.addEventListener(
    "click",
    () => {

        const isDay =
            document.body.classList.contains("day");


        if(isDay){

            localStorage.setItem(
                "seyami-theme",
                "night"
            );

        }else{

            localStorage.setItem(
                "seyami-theme",
                "day"
            );

        }


        applyTheme();

    }
);


applyTheme();


/* =========================
   启动
========================= */

loadHistory();

</script>

</body>

</html>
