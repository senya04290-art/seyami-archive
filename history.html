<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    overflow-x:hidden;

    background:#071522;

    color:#d9edff;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    transition:
        background .6s ease,
        color .6s ease;
}


/* =========================================================
   页面
========================================================= */

.page{

    position:relative;

    min-height:100vh;

    padding:
        30px
        70px
        80px;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(37,91,128,.18),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(13,47,72,.48),
            transparent 72%
        ),

        #071522;
}


/* =========================================================
   边框
========================================================= */

.frame{

    position:absolute;

    top:20px;
    left:20px;
    right:20px;
    bottom:20px;

    border:
        1px solid
        rgba(99,174,248,.32);

    pointer-events:none;

    z-index:10;

    transition:
        border-color .6s ease;
}


.frame::before,
.frame::after{

    content:"";

    position:absolute;

    width:45px;
    height:45px;

    transition:
        border-color .6s ease;
}


.frame::before{

    left:-1px;
    top:-1px;

    border-left:
        1px solid
        rgba(99,174,248,.88);

    border-top:
        1px solid
        rgba(99,174,248,.88);
}


.frame::after{

    right:-1px;
    bottom:-1px;

    border-right:
        1px solid
        rgba(99,174,248,.88);

    border-bottom:
        1px solid
        rgba(99,174,248,.88);
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:absolute;

    left:58px;
    right:58px;

    top:38px;

    z-index:20;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    width:auto;

    max-width:none;

    margin:0;

    padding:0;
}


.logo{

    display:flex;

    align-items:flex-start;

    gap:12px;

    color:#d9edff;

    text-decoration:none;

    transition:
        color .6s ease;
}


.logo-symbol{

    color:rgba(99,174,248,.9);

    width:17px;

    height:13px;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    font-size:17px;

    line-height:13px;

    margin:0;

    padding:0;

    text-shadow:

        0 0 7px
        rgba(45,120,215,.5),

        0 0 15px
        rgba(45,120,215,.22);

    flex-shrink:0;

    transition:

        color .6s ease,

        text-shadow .6s ease;
}


.logo-text{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1;
}


.logo-cn{

    display:block;

    height:13px;

    line-height:13px;

    color:#d9edff;

    font-size:13px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}


.logo-en{

    display:block;

    margin-top:5px;

    color:rgba(157,204,239,.63);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    line-height:8px;

    letter-spacing:3px;

    white-space:nowrap;

    transition:
        color .6s ease;
}


.header-right{

    display:flex;

    align-items:center;

    gap:20px;
}


.back{

    color:rgba(191,220,243,.68);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:1px;

    transition:

        color .3s ease,

        text-shadow .3s ease;
}


.back:hover{

    color:#d9efff;

    text-shadow:

        0 0 8px
        rgba(99,174,248,.35);
}


/* =========================================================
   主题按钮
========================================================= */

.theme-toggle{

    display:flex;

    align-items:center;

    gap:7px;

    height:28px;

    padding:0 11px;

    border:
        1px solid
        rgba(99,174,248,.32);

    background:
        rgba(8,28,49,.35);

    color:
        rgba(191,220,243,.68);

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    border-radius:0;

    white-space:nowrap;

    transition:

        color .35s ease,

        border-color .35s ease,

        background .35s ease,

        box-shadow .35s ease;
}


.theme-toggle:hover{

    color:#d9efff;

    border-color:
        rgba(99,174,248,.62);

    background:
        rgba(8,31,52,.55);

    box-shadow:

        0 0 14px
        rgba(45,120,215,.12);
}


.theme-icon{

    font-size:12px;

    line-height:1;

    letter-spacing:0;
}


/* =========================================================
   星星背景
========================================================= */

.stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    background-image:

        radial-gradient(
            1px 1px at 10% 18%,
            rgba(180,220,255,.65),
            transparent
        ),

        radial-gradient(
            1px 1px at 22% 72%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 35% 25%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 48% 83%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 63% 17%,
            rgba(180,220,255,.55),
            transparent
        ),

        radial-gradient(
            1px 1px at 77% 65%,
            rgba(180,220,255,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 89% 30%,
            rgba(180,220,255,.6),
            transparent
        ),

        radial-gradient(
            1px 1px at 92% 84%,
            rgba(180,220,255,.4),
            transparent
        );
}


/* =========================================================
   微小星点
========================================================= */

.micro-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;

    opacity:.7;

    background-image:

        radial-gradient(
            1px 1px at 7% 42%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 17% 14%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 31% 62%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 44% 11%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 56% 71%,
            rgba(173,215,244,.4),
            transparent
        ),

        radial-gradient(
            1px 1px at 69% 37%,
            rgba(173,215,244,.38),
            transparent
        ),

        radial-gradient(
            1px 1px at 82% 12%,
            rgba(173,215,244,.45),
            transparent
        ),

        radial-gradient(
            1px 1px at 95% 55%,
            rgba(173,215,244,.4),
            transparent
        );
}


/* =========================================================
   漂浮魔法符号
========================================================= */

.symbol{

    position:fixed;

    pointer-events:none;

    z-index:15;

    display:block;

    color:
        rgba(99,174,248,.72);

    font-family:
        "Times New Roman",
        serif;

    font-weight:400;

    line-height:1;

    opacity:.75;

    text-shadow:none;

    animation:
        floatSymbol 9s ease-in-out infinite;
}


.symbol-one{

    left:8%;

    top:29%;

    font-size:25px;

    animation-delay:-2s;
}


.symbol-two{

    right:9%;

    top:55%;

    font-size:21px;

    animation-delay:-5s;
}


.symbol-three{

    left:22%;

    top:17%;

    font-size:17px;

    animation-duration:11s;

    animation-delay:-4s;
}


.symbol-four{

    right:23%;

    top:28%;

    font-size:15px;

    animation-duration:10s;

    animation-delay:-7s;
}


.symbol-five{

    left:13%;

    top:68%;

    font-size:14px;

    animation-duration:12s;

    animation-delay:-1s;
}


.symbol-six{

    right:17%;

    top:78%;

    font-size:18px;

    animation-duration:10s;

    animation-delay:-6s;
}


.symbol-seven{

    left:28%;

    top:48%;

    font-size:12px;

    animation-duration:13s;

    animation-delay:-9s;
}


.symbol-eight{

    right:29%;

    top:70%;

    font-size:13px;

    animation-duration:11s;

    animation-delay:-3s;
}


.symbol-nine{

    left:35%;

    top:82%;

    font-size:16px;

    animation-duration:14s;

    animation-delay:-8s;
}


.symbol-ten{

    right:12%;

    top:16%;

    font-size:12px;

    animation-duration:12s;

    animation-delay:-10s;
}


@keyframes floatSymbol{

    0%,
    100%{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:.58;
    }

    50%{

        transform:
            translateY(-12px)
            rotate(8deg);

        opacity:.82;
    }
}


/* =========================================================
   魔法阵
========================================================= */

.magic-circle{

    position:fixed;

    left:50%;

    top:49%;

    width:680px;

    height:680px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(99,174,248,.45);

    border-radius:50%;

    pointer-events:none;

    z-index:1;

    filter:
        drop-shadow(
            0 0 14px
            rgba(45,120,215,.38)
        );
}


.magic-circle::before{

    content:"";

    position:absolute;

    inset:35px;

    border:
        1px solid
        rgba(99,174,248,.45);

    border-radius:50%;
}


.magic-circle::after{

    content:"";

    position:absolute;

    inset:78px;

    border:
        1px dashed
        rgba(99,174,248,.30);

    border-radius:50%;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    z-index:5;

    text-align:center;

    padding-top:150px;

    margin-bottom:100px;
}


.hero-en{

    color:
        rgba(154,204,239,.72);

    font-size:10px;

    letter-spacing:7px;

    margin-bottom:14px;
}


.hero-title{

    margin:0;

    color:#dcefff;

    font-family:
        "Cinzel",
        serif;

    font-size:42px;

    font-weight:400;

    letter-spacing:8px;

    line-height:1.1;

    text-shadow:

        0 0 16px
        rgba(45,120,215,.14);
}


.hero-cn{

    margin-top:18px;

    color:
        rgba(181,218,242,.78);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:14px;

    letter-spacing:8px;
}


/* =========================================================
   历史记录
========================================================= */

.history{

    position:relative;

    z-index:5;

    width:min(900px,92%);

    margin:0 auto;

    padding-bottom:80px;
}


.history::before{

    content:"";

    position:absolute;

    top:0;

    bottom:0;

    left:50%;

    width:1px;

    transform:
        translateX(-50%);

    background:

        linear-gradient(
            to bottom,
            transparent,
            rgba(99,174,248,.2) 8%,
            rgba(99,174,248,.2) 92%,
            transparent
        );
}


.history-item{

    position:relative;

    width:50%;

    padding:
        0
        40px
        55px;
}


.history-item:nth-child(odd){

    left:0;

    text-align:right;
}


.history-item:nth-child(even){

    left:50%;

    text-align:left;
}


.history-item::before{

    content:"";

    position:absolute;

    top:4px;

    width:7px;

    height:7px;

    border:
        1px solid
        rgba(99,174,248,.6);

    border-radius:50%;

    background:#071522;

    box-shadow:

        0 0 8px
        rgba(45,120,215,.3);
}


.history-item:nth-child(odd)::before{

    right:-4px;
}


.history-item:nth-child(even)::before{

    left:-4px;
}


.history-date{

    color:
        rgba(99,174,248,.62);

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:10px;
}


.history-title{

    margin:
        0
        0
        8px;

    color:
        rgba(211,235,251,.9);

    font-size:16px;

    font-weight:400;

    letter-spacing:2px;
}


.history-description{

    margin:0;

    color:
        rgba(161,199,223,.58);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:11px;

    line-height:2;

    letter-spacing:1px;
}


/* =========================================================
   修改记录按钮
========================================================= */

.edit-history{

    display:inline-block;

    margin-top:14px;

    padding:
        5px
        10px;

    border:
        1px solid
        rgba(99,174,248,.24);

    color:
        rgba(156,201,230,.52);

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:8px;

    letter-spacing:1px;

    transition:

        color .3s ease,

        border-color .3s ease,

        background .3s ease;
}


.edit-history:hover{

    color:#d9efff;

    border-color:
        rgba(99,174,248,.55);

    background:
        rgba(45,120,215,.08);
}


/* =========================================================
   空状态
========================================================= */

.empty-state{

    position:relative;

    z-index:5;

    text-align:center;

    padding:
        30px
        20px
        100px;
}


.empty-en{

    color:
        rgba(99,174,248,.42);

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:5px;

    margin-bottom:13px;
}


.empty-cn{

    color:
        rgba(174,210,233,.5);

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:4px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:relative;

    z-index:5;

    text-align:center;

    padding-top:20px;

    color:
        rgba(99,174,248,.38);

    font-family:
        "Times New Roman",
        serif;

    font-size:8px;

    letter-spacing:3px;
}


/* =========================================================
   DAY MODE
========================================================= */

body.day{

    background:#f4f9fd;

    color:#2e5069;
}


body.day .page{

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(165,211,238,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 52%,
            rgba(226,240,249,.68),
            transparent 72%
        ),

        #f4f9fd;
}


body.day .frame{

    border-color:
        rgba(79,148,196,.34);
}


body.day .frame::before{

    border-left-color:
        rgba(79,148,196,.68);

    border-top-color:
        rgba(79,148,196,.68);
}


body.day .frame::after{

    border-right-color:
        rgba(79,148,196,.68);

    border-bottom-color:
        rgba(79,148,196,.68);
}


body.day .logo{

    color:#315a75;
}


body.day .logo-cn{

    color:#315a75;
}


body.day .logo-en{

    color:
        rgba(68,116,145,.62);
}


body.day .logo-symbol{

    color:
        rgba(79,148,196,.8);

    text-shadow:none;
}


body.day .back{

    color:
        rgba(64,110,137,.72);
}


body.day .theme-toggle{

    background:
        rgba(255,255,255,.42);

    border-color:
        rgba(79,148,196,.3);

    color:
        rgba(64,110,137,.75);
}


body.day .theme-toggle:hover{

    background:
        rgba(255,255,255,.7);

    border-color:
        rgba(79,148,196,.55);
}


body.day .hero-en{

    color:
        rgba(72,129,160,.72);
}


body.day .hero-title{

    color:#315a75;

    text-shadow:
        0 0 16px
        rgba(79,148,196,.12);
}


body.day .hero-cn{

    color:
        rgba(64,108,133,.72);
}


body.day .magic-circle{

    filter:
        drop-shadow(
            0 0 10px
            rgba(45,120,215,.20)
        );
}


body.day .magic-circle::before,
body.day .magic-circle::after{

    border-color:
        rgba(79,148,196,.28);
}


body.day .history::before{

    background:

        linear-gradient(
            to bottom,
            transparent,
            rgba(79,148,196,.22) 8%,
            rgba(79,148,196,.22) 92%,
            transparent
        );
}


body.day .history-item::before{

    background:#f4f9fd;

    border-color:
        rgba(79,148,196,.55);
}


body.day .history-date{

    color:
        rgba(67,126,158,.65);
}


body.day .history-title{

    color:
        rgba(49,91,115,.9);
}


body.day .history-description{

    color:
        rgba(77,116,138,.68);
}


body.day .edit-history{

    color:
        rgba(68,116,145,.62);

    border-color:
        rgba(79,148,196,.25);
}


body.day .edit-history:hover{

    color:#315a75;

    border-color:
        rgba(79,148,196,.52);

    background:
        rgba(79,148,196,.07);
}


body.day .empty-en{

    color:
        rgba(75,128,157,.48);
}


body.day .empty-cn{

    color:
        rgba(73,111,132,.58);
}


body.day .footer{

    color:
        rgba(75,128,157,.42);
}


/* =========================================================
   日间模式浮动星星
========================================================= */

body.day .symbol{

    text-shadow:none;

    color:
        rgba(79,148,196,.62);

    opacity:.72;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:800px){

    .header{

        left:35px;

        right:35px;

        top:30px;
    }


    .header-right{

        gap:10px;
    }


    .theme-toggle{

        height:27px;

        padding:0 9px;

        font-size:7px;
    }


    .hero{

        padding-top:135px;
    }


    .hero-title{

        font-size:34px;

        letter-spacing:6px;
    }


    .history{

        width:94%;
    }

}


@media(max-width:600px){

    .page{

        padding:
            22px
            20px
            55px;
    }


    .frame{

        top:14px;
        left:14px;
        right:14px;
        bottom:14px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header{

        left:25px;

        right:25px;

        top:24px;

        width:auto;

        max-width:none;

        margin:0;

        padding:0;

        align-items:flex-start;
    }


    .logo{

        align-items:flex-start;

        gap:10px;
    }


    .logo-symbol{

        width:15px;

        height:11px;

        display:flex;

        align-items:flex-start;

        justify-content:center;

        font-size:15px;

        line-height:11px;

        margin-top:2px;
    }


    .logo-cn{

        height:11px;

        line-height:11px;

        font-size:11px;

        letter-spacing:2px;
    }


    .logo-en{

        display:block;

        margin-top:4px;

        font-size:7px;

        line-height:7px;

        letter-spacing:2px;
    }


    .header-right{

        gap:6px;
    }


    .back{

        font-size:10px;
    }


    .theme-toggle{

        height:25px;

        padding:0 7px;

        gap:5px;

        font-size:6px;

        letter-spacing:1px;
    }


    .theme-icon{

        font-size:10px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero{

        padding-top:120px;

        margin-bottom:70px;
    }


    .hero-en{

        font-size:8px;

        letter-spacing:5px;
    }


    .hero-title{

        font-size:27px;

        letter-spacing:4px;
    }


    .hero-cn{

        font-size:12px;

        letter-spacing:5px;
    }


    /* =====================================================
       手机端历史时间轴竖线取消
    ===================================================== */

    .history{

        width:92%;
    }


    .history::before{

        display:none;
    }


    .history-item,
    .history-item:nth-child(odd),
    .history-item:nth-child(even){

        left:0;

        width:100%;

        padding:
            0
            0
            45px
            30px;

        text-align:left;
    }


    .history-item::before,
    .history-item:nth-child(odd)::before,
    .history-item:nth-child(even)::before{

        left:4px;

        right:auto;
    }


    /* =====================================================
       修改按钮
    ===================================================== */

    .edit-history{

        margin-top:12px;

        font-size:7px;

        padding:
            5px
            9px;

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   昼夜模式
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme){

    if(theme === "day"){

        document.body.classList.add("day");

        themeIcon.textContent = "☀";

        themeText.textContent = "DAY";

    }else{

        document.body.classList.remove("day");

        themeIcon.textContent = "☾";

        themeText.textContent = "NIGHT";

    }

}


const savedTheme =
    localStorage.getItem("seyami-theme");


applyTheme(
    savedTheme === "day"
        ? "day"
        : "night"
);


themeToggle.addEventListener(
    "click",
    ()=>{

        const isDay =
            document.body.classList.contains("day");

        const nextTheme =
            isDay
                ? "night"
                : "day";


        localStorage.setItem(
            "seyami-theme",
            nextTheme
        );


        applyTheme(nextTheme);

    }
);


/* =========================================================
   历史记录 DOM
========================================================= */

const historyList =
    document.getElementById("historyList");


const emptyState =
    document.getElementById("emptyState");


/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   空状态
========================================================= */

function showEmpty(
    englishText,
    chineseText
){

    emptyState.style.display =
        "block";


    emptyState.innerHTML = `

        <div class="empty-en">
            ${escapeHTML(englishText)}
        </div>

        <div class="empty-cn">
            ${escapeHTML(chineseText)}
        </div>

    `;
}


/* =========================================================
   加载历史记录
========================================================= */

async function loadHistoryRecords(){

    historyList.innerHTML = "";

    emptyState.style.display =
        "none";


    const {
        data,
        error
    } = await supabaseClient

        .from("history_records")

        .select(`
            id,
            year,
            title,
            era,
            location,
            description,
            content,
            created_at,
            updated_at
        `)

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "读取历史记录失败：",
            error
        );


        showEmpty(
            "ARCHIVE ERROR",
            "历史记录读取失败"
        );

        return;
    }


    if(!data || data.length === 0){

        showEmpty(
            "ARCHIVE EMPTY",
            "暂无历史记录"
        );

        return;
    }


    data.forEach(
        record => {

            const item =
                document.createElement("article");


            item.className =
                "history-item";


            const year =
                record.year
                    ? escapeHTML(record.year)
                    : "UNDATED";


            const title =
                record.title
                    ? escapeHTML(record.title)
                    : "未命名历史记录";


            const description =
                record.description
                    ? escapeHTML(record.description)
                    : "暂无事件简介。";


            const editUrl =
                "edit.html?type=history&id=" +
                encodeURIComponent(record.id);


            item.innerHTML = `

                <div class="history-date">
                    ${year}
                </div>


                <h2 class="history-title">
                    ${title}
                </h2>


                <p class="history-description">
                    ${description}
                </p>


                <a
                    class="edit-history"
                    href="${editUrl}"
                >
                    ✦ 修改记录
                </a>

            `;


            historyList.appendChild(item);

        }
    );

}


/* =========================================================
   启动
========================================================= */

loadHistoryRecords();

</script>

        ☼
    </button>


    <!-- 返回 -->

    <a
        href="archive.html"
        class="back-link"
    >
        ← 返回档案目录
    </a>


    <!-- =================================================
         Hero
    ================================================= -->

    <section class="hero">

        <div class="hero-en">
            HISTORY
        </div>

        <div class="hero-cn">
            历史记录
        </div>

    </section>


    <!-- =================================================
         历史记录区域
    ================================================= -->

    <section
        class="history"
        id="historyList"
    >
        <!-- Supabase 历史记录会自动生成到这里 -->
    </section>


    <!-- =================================================
         空状态
    ================================================= -->

    <section
        class="empty-state"
        id="emptyState"
    >

        <div class="empty-symbol">
            ✦
        </div>

        <div
            class="empty-text"
            id="emptyText"
        >
            正在读取历史档案……
        </div>

    </section>


    <!-- =================================================
         Footer
    ================================================= -->

    <footer class="footer">

        塞垭弥档案 · 历史记录

    </footer>


</div>


<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   主题
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");


function applyTheme(){

    const savedTheme =
        localStorage.getItem("seyami-theme");

    if(savedTheme === "day"){

        document.body.classList.add("day");

        themeToggle.textContent = "☾";

    }else{

        document.body.classList.remove("day");

        themeToggle.textContent = "☼";

    }

}


themeToggle.addEventListener(
    "click",
    () => {

        const isDay =
            document.body.classList.toggle("day");

        localStorage.setItem(
            "seyami-theme",
            isDay ? "day" : "night"
        );

        themeToggle.textContent =
            isDay ? "☾" : "☼";

    }
);


applyTheme();


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DOM
========================================================= */

const historyList =
    document.getElementById("historyList");

const emptyState =
    document.getElementById("emptyState");

const emptyText =
    document.getElementById("emptyText");


/* =========================================================
   生成单条历史记录
========================================================= */

function createHistoryItem(record, index){

    const item =
        document.createElement("article");

    item.className =
        "history-item";


    const dot =
        document.createElement("div");

    dot.className =
        "history-dot";


    const year =
        escapeHtml(record.year);

    const title =
        escapeHtml(record.title);

    const era =
        escapeHtml(record.era);

    const location =
        escapeHtml(record.location);

    const description =
        escapeHtml(record.description);

    const content =
        escapeHtml(record.content);


    let metaParts = [];


    if(era){

        metaParts.push(
            `时期 · ${era}`
        );

    }


    if(location){

        metaParts.push(
            `地点 · ${location}`
        );

    }


    const meta =
        metaParts.length
            ? `
                <div class="history-meta">
                    ${metaParts.join("　·　")}
                </div>
              `
            : "";


    const descriptionHtml =
        description
            ? `
                <div class="history-description">
                    ${description}
                </div>
              `
            : "";


    const contentHtml =
        content
            ? `
                <div class="history-content">
                    ${content}
                </div>
              `
            : "";


    item.innerHTML = `

        <div class="history-year">
            ${year || "—"}
        </div>

        <div class="history-title">
            ${title || "未命名历史记录"}
        </div>

        ${meta}

        ${descriptionHtml}

        ${contentHtml}

        <a
            class="edit-history"
            href="edit.html?type=history&id=${encodeURIComponent(record.id)}"
        >
            ✦ 修改记录
        </a>

    `;


    item.prepend(dot);


    return item;

}


/* =========================================================
   读取历史记录
========================================================= */

async function loadHistory(){

    historyList.innerHTML = "";

    emptyState.style.display = "block";

    emptyText.textContent =
        "正在读取历史档案……";


    const {
        data,
        error
    } = await supabaseClient

        .from("history_records")

        .select(`
            id,
            year,
            title,
            era,
            location,
            description,
            content,
            created_at,
            updated_at
        `)

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "读取历史记录失败：",
            error
        );

        emptyState.style.display =
            "block";

        emptyText.textContent =
            "历史档案读取失败，请稍后再试。";

        return;

    }


    if(!data || data.length === 0){

        emptyState.style.display =
            "block";

        emptyText.textContent =
            "目前尚无历史记录。";

        return;

    }


    emptyState.style.display =
        "none";


    data.forEach(
        (record, index) => {

            historyList.appendChild(
                createHistoryItem(
                    record,
                    index
                )
            );

        }
    );

}


/* =========================================================
   启动
========================================================= */

loadHistory();

</script>


</body>

</html>
