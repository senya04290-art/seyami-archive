<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Noto Serif SC",
        serif;

    background:#071522;

    color:#dbeeff;

    overflow-x:hidden;

    transition:
        background .5s ease,
        color .5s ease;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   页面背景
========================================================= */

.page{

    position:relative;

    min-height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(22,68,112,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(22,82,125,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(30,80,130,.10),
            transparent 28%
        ),

        #071522;
}


/* =========================================================
   外框
========================================================= */

.frame{

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(105,174,226,.20);

    pointer-events:none;

    z-index:10;
}

.frame::before{

    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(105,174,226,.07);
}


/* =========================================================
   星星
========================================================= */

.stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    overflow:hidden;
}

.star{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:
        rgba(190,225,255,.72);

    box-shadow:
        0 0 6px
        rgba(120,190,255,.5);

    animation:
        twinkle 4s ease-in-out infinite;
}

.star:nth-child(1){
    left:8%;
    top:15%;
    animation-delay:.4s;
}

.star:nth-child(2){
    left:18%;
    top:31%;
    animation-delay:1.5s;
}

.star:nth-child(3){
    left:29%;
    top:12%;
    animation-delay:2.2s;
}

.star:nth-child(4){
    left:42%;
    top:25%;
    animation-delay:.8s;
}

.star:nth-child(5){
    left:57%;
    top:13%;
    animation-delay:2.8s;
}

.star:nth-child(6){
    left:71%;
    top:29%;
    animation-delay:1.1s;
}

.star:nth-child(7){
    left:83%;
    top:18%;
    animation-delay:3.1s;
}

.star:nth-child(8){
    left:92%;
    top:42%;
    animation-delay:1.8s;
}

.star:nth-child(9){
    left:12%;
    top:66%;
    animation-delay:2.6s;
}

.star:nth-child(10){
    left:24%;
    top:83%;
    animation-delay:.6s;
}

.star:nth-child(11){
    left:39%;
    top:72%;
    animation-delay:3.4s;
}

.star:nth-child(12){
    left:54%;
    top:87%;
    animation-delay:1.7s;
}

.star:nth-child(13){
    left:68%;
    top:70%;
    animation-delay:2.4s;
}

.star:nth-child(14){
    left:79%;
    top:84%;
    animation-delay:.9s;
}

.star:nth-child(15){
    left:91%;
    top:68%;
    animation-delay:3s;
}


@keyframes twinkle{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:.95;
        transform:scale(1.35);
    }
}


/* =========================================================
   微小星点
========================================================= */

.micro-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;

    opacity:.6;
}

.micro-stars::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        radial-gradient(
            circle,
            rgba(155,205,245,.42) 0 1px,
            transparent 1px
        );

    background-size:
        87px 93px;

    background-position:
        12px 17px;

    opacity:.35;
}


/* =========================================================
   装饰符号
========================================================= */

.symbol{

    position:absolute;

    color:
        rgba(112,182,235,.32);

    font-family:
        "Cinzel",
        serif;

    pointer-events:none;

    z-index:1;

    user-select:none;
}

.symbol.s1{
    left:7%;
    top:20%;
    font-size:22px;
}

.symbol.s2{
    right:8%;
    top:25%;
    font-size:17px;
}

.symbol.s3{
    left:14%;
    top:48%;
    font-size:14px;
}

.symbol.s4{
    right:13%;
    top:54%;
    font-size:25px;
}

.symbol.s5{
    left:8%;
    bottom:19%;
    font-size:17px;
}

.symbol.s6{
    right:8%;
    bottom:15%;
    font-size:19px;
}

.symbol.s7{
    left:28%;
    top:18%;
    font-size:12px;
}

.symbol.s8{
    right:29%;
    top:20%;
    font-size:14px;
}

.symbol.s9{
    left:36%;
    bottom:13%;
    font-size:13px;
}

.symbol.s10{
    right:35%;
    bottom:16%;
    font-size:11px;
}


/* =========================================================
   魔法阵
   与国家档案完全一致
========================================================= */

.magic-circle{

    position:absolute;

    width:510px;
    height:510px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        rotate(-8deg);

    border-radius:50%;

    opacity:.5;

    filter:
        drop-shadow(
            0 0 14px
            rgba(45,120,215,.38)
        );

    pointer-events:none;

    z-index:1;
}

.magic-circle::before,
.magic-circle::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:182px;

    border:
        1px solid
        rgba(99,174,248,.45);

    transform:
        translate(-50%,-50%)
        rotate(30deg);

    clip-path:polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );

    pointer-events:none;
}

.magic-circle::after{

    transform:
        translate(-50%,-50%)
        rotate(90deg);

    opacity:.65;
}


/* =========================================================
   顶部导航
========================================================= */

header{

    position:relative;

    width:100%;

    padding:
        42px
        62px
        0;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:20;
}

.logo{

    display:flex;

    flex-direction:column;

    gap:3px;
}

.logo-main{

    font-family:
        "Cinzel",
        serif;

    font-size:19px;

    letter-spacing:
        5px;

    color:
        rgba(215,236,255,.9);
}

.logo-sub{

    font-size:10px;

    letter-spacing:
        3px;

    color:
        rgba(136,184,221,.56);
}

.nav{

    display:flex;

    align-items:center;

    gap:28px;

    font-size:12px;

    letter-spacing:2px;

    color:
        rgba(180,214,240,.72);
}

.nav a{

    position:relative;

    transition:
        color .3s ease;
}

.nav a:hover{

    color:
        rgba(230,245,255,.98);
}

.nav a::after{

    content:"";

    position:absolute;

    left:0;
    bottom:-7px;

    width:0;

    height:1px;

    background:
        rgba(125,190,240,.65);

    transition:
        width .3s ease;
}

.nav a:hover::after{

    width:100%;
}


/* =========================================================
   日夜模式按钮
========================================================= */

.theme-toggle{

    width:34px;
    height:18px;

    border:
        1px solid
        rgba(122,181,224,.45);

    border-radius:20px;

    position:relative;

    cursor:pointer;

    transition:
        background .3s ease,
        border-color .3s ease;
}

.theme-toggle::before{

    content:"";

    position:absolute;

    width:12px;
    height:12px;

    left:2px;
    top:2px;

    border-radius:50%;

    background:
        rgba(183,222,255,.9);

    box-shadow:
        0 0 7px
        rgba(116,191,255,.5);

    transition:
        transform .3s ease,
        background .3s ease;
}

body.day .theme-toggle::before{

    transform:
        translateX(16px);

    background:
        rgba(76,134,180,.8);
}


/* =========================================================
   主标题
========================================================= */

.hero{

    position:relative;

    z-index:5;

    width:100%;

    min-height:
        calc(100vh - 180px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
        80px
        30px
        120px;
}

.hero-small{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:
        7px;

    color:
        rgba(133,190,232,.65);

    margin-bottom:20px;
}

.hero-title{

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(42px,7vw,86px);

    font-weight:400;

    letter-spacing:
        13px;

    color:
        rgba(224,240,255,.94);

    text-shadow:
        0 0 28px
        rgba(78,157,220,.17);

    margin:
        0 0 16px;
}

.hero-cn{

    font-size:16px;

    letter-spacing:
        8px;

    color:
        rgba(164,201,230,.68);

    margin-bottom:30px;
}

.hero-line{

    width:120px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(110,180,230,.6),
            transparent
        );

    margin-bottom:32px;
}

.hero-description{

    max-width:550px;

    line-height:2;

    font-size:12px;

    letter-spacing:2px;

    color:
        rgba(157,193,220,.55);
}


/* =========================================================
   历史内容
========================================================= */

.history{

    position:relative;

    z-index:6;

    width:
        min(850px,88%);

    margin:
        -35px auto 80px;

    padding:
        45px 55px;

    border:
        1px solid
        rgba(104,170,220,.15);

    background:
        rgba(5,20,33,.28);

    backdrop-filter:
        blur(4px);
}

.history-title{

    font-family:
        "Cinzel",
        serif;

    font-size:12px;

    letter-spacing:
        5px;

    color:
        rgba(153,205,240,.72);

    text-align:center;

    margin-bottom:40px;
}

.history-list{

    position:relative;

    min-height:100px;
}

.history-list::before{

    content:"";

    position:absolute;

    left:50%;

    top:0;
    bottom:0;

    width:1px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(95,162,214,.25),
            transparent
        );
}


/* =========================================================
   空历史
========================================================= */

.empty-history{

    position:relative;

    z-index:2;

    text-align:center;

    padding:55px 20px;

    color:
        rgba(133,178,209,.5);

    font-size:12px;

    letter-spacing:3px;
}

.empty-history-symbol{

    font-family:
        "Cinzel",
        serif;

    font-size:30px;

    color:
        rgba(113,182,229,.32);

    margin-bottom:18px;
}

.empty-history-text{

    line-height:2;
}


/* =========================================================
   空状态
========================================================= */

.empty-state{

    position:relative;

    z-index:5;

    width:100%;

    text-align:center;

    padding:
        20px 20px 80px;
}

.empty-state-title{

    font-family:
        "Cinzel",
        serif;

    font-size:11px;

    letter-spacing:4px;

    color:
        rgba(117,175,215,.46);
}


/* =========================================================
   Footer
========================================================= */

footer{

    position:relative;

    z-index:10;

    text-align:center;

    padding:
        20px
        20px
        35px;

    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(116,164,200,.38);
}

========================================================= */

body.day .frame{

</style>

<script>

/* =========================================================
   日夜模式
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("seyami-theme");

if(savedTheme === "day"){

    document.body.classList.add("day");

}

themeToggle.addEventListener(
    "click",
    () => {

        document.body.classList.toggle("day");

        localStorage.setItem(
            "seyami-theme",
            document.body.classList.contains("day")
                ? "day"
                : "night"
        );

    }
);


/* =========================================================
   历史记录
========================================================= */

const historyList =
    document.getElementById("historyList");

const historyRecords =
    JSON.parse(
        localStorage.getItem(
            "historyRecords"
        ) || "[]"
    );


if(historyRecords.length > 0){

    historyList.innerHTML = "";

    historyRecords.forEach(
        record => {

            const item =
                document.createElement("div");

            item.className =
                "history-item";

            item.innerHTML = `
                <div>
                    ${record.name || "未知档案"}
                </div>
            `;

            historyList.appendChild(item);

        }
    );

}

</script>

</body>

</html>
