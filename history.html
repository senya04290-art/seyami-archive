<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 历史记录</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(31,63,105,.12),
            transparent 38%
        ),
        #061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    font-weight:300;

    letter-spacing:.04em;

    transition:
        background .35s ease,
        color .35s ease;
}


/* =========================================================
   日间模式
========================================================= */

body.day{

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.8),
            transparent 45%
        ),
        #edf3f8;

    color:#23384f;
}


/* =========================================================
   星点
========================================================= */

.stars,
.micro-stars,
.arcane-stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;
}

.stars span,
.micro-stars span,
.arcane-stars span{

    position:absolute;

    user-select:none;

    color:#dcecff;

    opacity:.5;

    font-family:serif;

    transition:
        color .35s ease,
        opacity .35s ease;
}

.stars span{
    font-size:16px;
}

.micro-stars span{
    font-size:9px;
    opacity:.32;
}

.arcane-stars span{
    font-size:13px;
    opacity:.4;
}

body.day .stars span,
body.day .micro-stars span,
body.day .arcane-stars span{

    color:#58728d;

    opacity:.35;
}


/* =========================================================
   主题按钮
========================================================= */

.theme-toggle{

    position:fixed;

    top:34px;
    right:42px;

    width:42px;
    height:42px;

    border:1px solid rgba(180,210,240,.28);

    background:rgba(8,24,43,.45);

    color:#dcecff;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:20;

    font-family:serif;

    font-size:17px;

    transition:
        background .3s ease,
        border-color .3s ease,
        color .3s ease;
}

.theme-toggle:hover{

    background:rgba(45,75,110,.45);

    border-color:rgba(190,220,250,.55);
}

body.day .theme-toggle{

    background:rgba(255,255,255,.55);

    border-color:rgba(70,95,120,.25);

    color:#31485e;
}


/* =========================================================
   页面框架
========================================================= */

.page-frame{

    position:relative;

    z-index:1;

    width:100%;

    min-height:100vh;

    padding:
        38px
        58px
        42px;
}


/* =========================================================
   顶部
========================================================= */

.header{

    position:relative;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:5;
}

.logo{

    text-decoration:none;

    color:inherit;

    display:block;
}

.logo-cn{

    font-size:16px;

    letter-spacing:.16em;

    margin-bottom:5px;
}

.logo-en{

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:.32em;

    opacity:.62;
}


/* =========================================================
   返回按钮
========================================================= */

.back-link{

    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-top:58px;

    color:inherit;

    text-decoration:none;

    font-size:12px;

    letter-spacing:.12em;

    opacity:.72;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.back-link:hover{

    opacity:1;

    transform:translateX(-3px);
}


/* =========================================================
   Hero
========================================================= */

.hero{

    position:relative;

    text-align:center;

    padding-top:65px;

    padding-bottom:70px;
}

.hero-en{

    font-family:"Cinzel",serif;

    font-size:clamp(36px,6vw,74px);

    font-weight:300;

    letter-spacing:.22em;

    margin-right:-.22em;

    line-height:1.05;
}

.hero-cn{

    margin-top:18px;

    font-size:16px;

    letter-spacing:.32em;

    margin-right:-.32em;

    opacity:.75;
}


/* =========================================================
   历史区域
========================================================= */

.history{

    position:relative;

    width:min(920px,92vw);

    margin:0 auto;

    padding-bottom:100px;
}


/* =========================================================
   时间轴
========================================================= */

.history::before{

    content:"";

    position:absolute;

    left:50%;

    top:0;

    bottom:0;

    width:1px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(170,205,240,.35) 8%,
            rgba(170,205,240,.35) 92%,
            transparent
        );

    transform:translateX(-50%);
}

body.day .history::before{

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(75,100,125,.28) 8%,
            rgba(75,100,125,.28) 92%,
            transparent
        );
}


/* =========================================================
   历史记录
========================================================= */

.history-item{

    position:relative;

    width:100%;

    padding:25px 0 45px;

    min-height:150px;
}

.history-item:nth-child(odd){

    padding-right:calc(50% + 55px);

    text-align:right;
}

.history-item:nth-child(even){

    padding-left:calc(50% + 55px);

    text-align:left;
}


/* =========================================================
   时间轴节点
========================================================= */

.history-dot{

    position:absolute;

    left:50%;

    top:32px;

    width:9px;
    height:9px;

    border:1px solid rgba(210,230,250,.75);

    background:#061426;

    transform:translateX(-50%) rotate(45deg);

    z-index:2;

    transition:
        background .35s ease,
        border-color .35s ease;
}

body.day .history-dot{

    background:#edf3f8;

    border-color:rgba(70,95,120,.55);
}


/* =========================================================
   年代
========================================================= */

.history-year{

    font-family:"Cinzel",serif;

    font-size:13px;

    letter-spacing:.18em;

    opacity:.65;

    margin-bottom:12px;
}


/* =========================================================
   标题
========================================================= */

.history-title{

    font-size:21px;

    letter-spacing:.1em;

    line-height:1.7;

    margin-bottom:12px;
}


/* =========================================================
   时期 / 地点
========================================================= */

.history-meta{

    font-family:"Cinzel","Noto Serif SC",serif;

    font-size:10px;

    letter-spacing:.14em;

    opacity:.48;

    margin-bottom:14px;

    line-height:1.8;
}


/* =========================================================
   简介
========================================================= */

.history-description{

    font-size:12px;

    line-height:2.1;

    opacity:.68;

    white-space:pre-line;
}


/* =========================================================
   完整记录
========================================================= */

.history-content{

    margin-top:18px;

    padding-top:16px;

    border-top:1px solid rgba(180,210,240,.12);

    font-size:12px;

    line-height:2.15;

    opacity:.62;

    white-space:pre-line;
}


/* =========================================================
   修改按钮
========================================================= */

.edit-history{

    display:inline-block;

    margin-top:20px;

    padding:7px 14px;

    border:1px solid rgba(170,205,240,.25);

    color:inherit;

    text-decoration:none;

    font-size:10px;

    letter-spacing:.14em;

    opacity:.62;

    transition:
        opacity .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.edit-history:hover{

    opacity:1;

    border-color:rgba(190,220,250,.55);

    background:rgba(60,90,125,.16);
}

body.day .edit-history{

    border-color:rgba(70,95,120,.22);

    background:rgba(255,255,255,.22);
}

body.day .edit-history:hover{

    border-color:rgba(70,95,120,.45);

    background:rgba(255,255,255,.55);
}


/* =========================================================
   空状态
========================================================= */

.empty-state{

    width:min(700px,90vw);

    margin:20px auto 100px;

    padding:65px 30px;

    text-align:center;

    border-top:1px solid rgba(170,205,240,.16);

    border-bottom:1px solid rgba(170,205,240,.16);

    opacity:.65;
}

.empty-symbol{

    font-family:serif;

    font-size:26px;

    margin-bottom:20px;

    opacity:.55;
}

.empty-text{

    font-size:12px;

    letter-spacing:.16em;

    line-height:2;
}


/* =========================================================
   底部
========================================================= */

.footer{

    position:relative;

    text-align:center;

    padding:30px 0 10px;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:.25em;

    opacity:.38;
}


/* =========================================================
   手机端
========================================================= */

@media(max-width:700px){

    .page-frame{

        padding:
            28px
            24px
            35px;
    }

    .theme-toggle{

        top:25px;
        right:24px;

        width:38px;
        height:38px;
    }

    .logo-cn{

        font-size:13px;
    }

    .logo-en{

        font-size:7px;
    }

    .back-link{

        margin-top:48px;

        font-size:11px;
    }

    .hero{

        padding-top:55px;

        padding-bottom:55px;
    }

    .hero-en{

        font-size:38px;

        letter-spacing:.16em;

        margin-right:-.16em;
    }

    .hero-cn{

        font-size:13px;

        letter-spacing:.22em;

        margin-right:-.22em;
    }

    .history{

        width:100%;
    }

    .history::before{

        left:12px;

        transform:none;
    }

    .history-item,
    .history-item:nth-child(odd),
    .history-item:nth-child(even){

        padding:

            20px

            0

            42px

            42px;

        text-align:left;
    }

    .history-dot{

        left:12px;

        top:27px;
    }

    .history-title{

        font-size:18px;
    }

    .history-description{

        font-size:11px;
    }

}


/* =========================================================
   更小屏幕
========================================================= */

@media(max-width:430px){

    .page-frame{

        padding-left:20px;

        padding-right:20px;
    }

    .hero-en{

        font-size:32px;
    }

    .hero-cn{

        font-size:12px;
    }

    .history-title{

        font-size:17px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     装饰星点
===================================================== -->

<div class="stars">

    <span style="top:12%;left:8%;">✦</span>
    <span style="top:21%;left:88%;">✧</span>
    <span style="top:42%;left:6%;">✦</span>
    <span style="top:63%;left:93%;">✧</span>
    <span style="top:82%;left:10%;">✦</span>
    <span style="top:91%;left:84%;">✧</span>

</div>


<div class="micro-stars">

    <span style="top:18%;left:23%;">✶</span>
    <span style="top:29%;left:74%;">✶</span>
    <span style="top:48%;left:17%;">✶</span>
    <span style="top:57%;left:82%;">✶</span>
    <span style="top:76%;left:28%;">✶</span>
    <span style="top:88%;left:69%;">✶</span>

</div>


<div class="arcane-stars">

    <span style="top:35%;left:31%;">✡</span>
    <span style="top:68%;left:72%;">✡</span>

</div>


<!-- =====================================================
     页面
===================================================== -->

<div class="page-frame">


    <!-- 顶部 -->

    <header class="header">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-cn">
                塞垭弥大陆档案馆
            </div>

            <div class="logo-en">
                SEYAMI ARCHIVE
            </div>

        </a>

    </header>


    <!-- 主题切换 -->

    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="切换主题"
    >
        ☼
    </button>


    <!-- 返回 -->

    <a
        href="archive.html"
        class="back-link"
    >
        ← 返回档案目录
    </a>


    <!-- =================================================
         Hero
    ================================================= -->

    <section class="hero">

        <div class="hero-en">
            HISTORY
        </div>

        <div class="hero-cn">
            历史记录
        </div>

    </section>


    <!-- =================================================
         历史记录区域
    ================================================= -->

    <section
        class="history"
        id="historyList"
    >
        <!-- Supabase 历史记录会自动生成到这里 -->
    </section>


    <!-- =================================================
         空状态
    ================================================= -->

    <section
        class="empty-state"
        id="emptyState"
    >

        <div class="empty-symbol">
            ✦
        </div>

        <div
            class="empty-text"
            id="emptyText"
        >
            正在读取历史档案……
        </div>

    </section>


    <!-- =================================================
         Footer
    ================================================= -->

    <footer class="footer">

        塞垭弥档案 · 历史记录

    </footer>


</div>


<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   主题
========================================================= */

const themeToggle =
    document.getElementById("themeToggle");


function applyTheme(){

    const savedTheme =
        localStorage.getItem("seyami-theme");

    if(savedTheme === "day"){

        document.body.classList.add("day");

        themeToggle.textContent = "☾";

    }else{

        document.body.classList.remove("day");

        themeToggle.textContent = "☼";

    }

}


themeToggle.addEventListener(
    "click",
    () => {

        const isDay =
            document.body.classList.toggle("day");

        localStorage.setItem(
            "seyami-theme",
            isDay ? "day" : "night"
        );

        themeToggle.textContent =
            isDay ? "☾" : "☼";

    }
);


applyTheme();


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DOM
========================================================= */

const historyList =
    document.getElementById("historyList");

const emptyState =
    document.getElementById("emptyState");

const emptyText =
    document.getElementById("emptyText");


/* =========================================================
   生成单条历史记录
========================================================= */

function createHistoryItem(record, index){

    const item =
        document.createElement("article");

    item.className =
        "history-item";


    const dot =
        document.createElement("div");

    dot.className =
        "history-dot";


    const year =
        escapeHtml(record.year);

    const title =
        escapeHtml(record.title);

    const era =
        escapeHtml(record.era);

    const location =
        escapeHtml(record.location);

    const description =
        escapeHtml(record.description);

    const content =
        escapeHtml(record.content);


    let metaParts = [];


    if(era){

        metaParts.push(
            `时期 · ${era}`
        );

    }


    if(location){

        metaParts.push(
            `地点 · ${location}`
        );

    }


    const meta =
        metaParts.length
            ? `
                <div class="history-meta">
                    ${metaParts.join("　·　")}
                </div>
              `
            : "";


    const descriptionHtml =
        description
            ? `
                <div class="history-description">
                    ${description}
                </div>
              `
            : "";


    const contentHtml =
        content
            ? `
                <div class="history-content">
                    ${content}
                </div>
              `
            : "";


    item.innerHTML = `

        <div class="history-year">
            ${year || "—"}
        </div>

        <div class="history-title">
            ${title || "未命名历史记录"}
        </div>

        ${meta}

        ${descriptionHtml}

        ${contentHtml}

        <a
            class="edit-history"
            href="edit.html?type=history&id=${encodeURIComponent(record.id)}"
        >
            ✦ 修改记录
        </a>

    `;


    item.prepend(dot);


    return item;

}


/* =========================================================
   读取历史记录
========================================================= */

async function loadHistory(){

    historyList.innerHTML = "";

    emptyState.style.display = "block";

    emptyText.textContent =
        "正在读取历史档案……";


    const {
        data,
        error
    } = await supabaseClient

        .from("history_records")

        .select(`
            id,
            year,
            title,
            era,
            location,
            description,
            content,
            created_at,
            updated_at
        `)

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "读取历史记录失败：",
            error
        );

        emptyState.style.display =
            "block";

        emptyText.textContent =
            "历史档案读取失败，请稍后再试。";

        return;

    }


    if(!data || data.length === 0){

        emptyState.style.display =
            "block";

        emptyText.textContent =
            "目前尚无历史记录。";

        return;

    }


    emptyState.style.display =
        "none";


    data.forEach(
        (record, index) => {

            historyList.appendChild(
                createHistoryItem(
                    record,
                    index
                )
            );

        }
    );

}


/* =========================================================
   启动
========================================================= */

loadHistory();

</script>


</body>

</html>
