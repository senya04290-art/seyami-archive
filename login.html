
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061426">
<title>后台登录 · 塞垭弥大陆档案馆</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 35%,#183354 0,transparent 55%),#061426;color:#dcecff;font-family:"Noto Serif SC",serif}
.card{width:min(100%,430px);padding:40px 30px 30px;border:1px solid #b8cde833;background:#081a2eef;box-shadow:0 24px 70px #0005}
.logo{text-align:center;font-size:18px;letter-spacing:.16em}
.en{font:12px Cinzel,serif;letter-spacing:.3em;color:#9db6d7;margin-top:9px}
.rule{height:1px;width:76px;margin:24px auto;background:linear-gradient(90deg,transparent,#b8cde8,transparent)}
h1{text-align:center;font:400 20px Cinzel,serif;letter-spacing:.15em;margin:0 0 8px}
.sub{text-align:center;color:#8ea7c5;font-size:12px;margin-bottom:28px}
label{display:block;font-size:13px;margin:16px 0 8px}
input{width:100%;padding:13px;border:1px solid #b8cde833;background:#04101f;color:#dcecff;font:14px "Noto Serif SC",serif;outline:none}
input:focus{border-color:#a8c6ec}
button{width:100%;margin-top:24px;padding:13px;border:1px solid #a9c4e5;background:#c5d8f1;color:#10233c;font:14px "Noto Serif SC",serif;letter-spacing:.15em;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:24px;margin-top:12px;text-align:center;color:#ffb8bd;font-size:12px}
.back{display:block;text-align:center;margin-top:15px;color:#8ea7c5;font-size:12px;text-decoration:none}
.foot{text-align:center;margin-top:24px;color:#617895;font:10px Cinzel,serif;letter-spacing:.14em}
@media(max-width:420px){.card{padding:35px 22px 27px}.logo{font-size:16px}}
</style>
</head>
<body>
<main class="card">
<header class="logo">
塞垭弥大陆档案馆
<div class="en">SEYAMI ARCHIVE</div>
</header>
<div class="rule"></div>
<h1>ARCHIVE ADMIN</h1>
<div class="sub">档案管理 · 管理员登录</div>

<form id="form">
<label for="email">管理员邮箱</label>
<input id="email" type="email" value="1296457710@qq.com" autocomplete="username" required>

<label for="password">登录密码</label>
<input id="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required>

<button id="submit" type="submit">进入档案馆后台</button>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
</form>

<a class="back" href="index.html">← 返回档案馆首页</a>
<div class="foot">THE RECORDS OF SEYAMI</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const URL = "https://rqqkdpzehxzwqzytpxgh.supabase.co";
  const KEY = "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";
  const ADMIN = "1296457710@qq.com";

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");

  if (!window.supabase) {
    msg.textContent = "登录组件加载失败，请刷新页面或检查网络。";
    btn.disabled = true;
    return;
  }

  const client = window.supabase.createClient(URL, KEY);

  client.auth.getSession().then(({data, error}) => {
    if (!error && data.session &&
        data.session.user.email?.toLowerCase() === ADMIN) {
      location.replace("admin.html");
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";

    const email = document.getElementById("email")
      .value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (email !== ADMIN) {
      msg.textContent = "此邮箱不是档案馆管理员账号。";
      return;
    }

    btn.disabled = true;
    btn.textContent = "正在验证……";

    const {data, error} = await client.auth.signInWithPassword({
      email, password
    });

    if (error) {
      console.error("Supabase sign-in:", error.message);
      msg.textContent = "登录失败，请检查邮箱和密码，或确认 Supabase Auth 已启用此账号。";
      btn.disabled = false;
      btn.textContent = "进入档案馆后台";
      return;
    }

    if (data.user?.email?.toLowerCase() !== ADMIN) {
      await client.auth.signOut();
      msg.textContent = "当前账号没有管理员权限。";
      btn.disabled = false;
      btn.textContent = "进入档案馆后台";
      return;
    }

    location.replace("admin.html");
  });
})();
</script>
</body>
</html>
