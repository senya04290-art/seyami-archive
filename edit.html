<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>编辑角色档案 · Seyami Archive</title>

<link

    href="https://fonts.googleapis.com"
>

<link

    href="https://fonts.gstatic.com"
    crossorigin
>

<link

>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#061426;
    color:#dcecff;

    font-family:
        "Noto Serif SC",
        "Cinzel",
        serif;

    font-weight:300;
    letter-spacing:1px;

    transition:
        background .5s ease,
        color .5s ease;
}


/* =========================================================
   星空
========================================================= */

.stars{
    position:fixed;
    inset:0;

    pointer-events:none;
    overflow:hidden;

    z-index:0;
}

.star{
    position:absolute;

    color:rgba(220,236,255,.45);

    font-family:serif;
    font-size:13px;

    animation:
        starFloat 8s ease-in-out infinite;
}

.star:nth-child(1){
    left:7%;
    top:18%;
    animation-delay:-1s;
}

.star:nth-child(2){
    left:15%;
    top:72%;
    animation-delay:-4s;
}

.star:nth-child(3){
    left:24%;
    top:35%;
    animation-delay:-2s;
}

.star:nth-child(4){
    left:32%;
    top:82%;
    animation-delay:-6s;
}

.star:nth-child(5){
    left:43%;
    top:14%;
    animation-delay:-3s;
}

.star:nth-child(6){
    left:51%;
    top:66%;
    animation-delay:-5s;
}

.star:nth-child(7){
    left:62%;
    top:27%;
    animation-delay:-1.5s;
}

.star:nth-child(8){
    left:71%;
    top:79%;
    animation-delay:-7s;
}

.star:nth-child(9){
    left:82%;
    top:21%;
    animation-delay:-2.5s;
}

.star:nth-child(10){
    left:91%;
    top:59%;
    animation-delay:-5.5s;
}

.star:nth-child(11){
    left:5%;
    top:47%;
    animation-delay:-3.5s;
}

.star:nth-child(12){
    left:18%;
    top:9%;
    animation-delay:-6.5s;
}

.star:nth-child(13){
    left:28%;
    top:58%;
    animation-delay:-4.5s;
}

.star:nth-child(14){
    left:39%;
    top:91%;
    animation-delay:-1.8s;
}

.star:nth-child(15){
    left:57%;
    top:9%;
    animation-delay:-3.8s;
}

.star:nth-child(16){
    left:68%;
    top:48%;
    animation-delay:-6.2s;
}

.star:nth-child(17){
    left:77%;
    top:11%;
    animation-delay:-2.2s;
}

.star:nth-child(18){
    left:88%;
    top:87%;
    animation-delay:-4.2s;
}

.star:nth-child(19){
    left:94%;
    top:33%;
    animation-delay:-7.2s;
}

.star:nth-child(20){
    left:11%;
    top:91%;
    animation-delay:-5.2s;
}


@keyframes starFloat{

    0%,
    100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:.75;
        transform:translateY(-5px);
    }

}


/* =========================================================
   外框
========================================================= */

.page-frame{
    position:relative;

    z-index:2;

    width:
        min(
            calc(100% - 76px),
            1100px
        );

    min-height:
        calc(100vh - 76px);

    margin:38px auto;

    border:
        1px solid
        rgba(190,215,238,.22);

    padding:
        0
        68px
        60px;

    overflow:hidden;
}

.page-frame::before,
.page-frame::after{
    content:"";

    position:absolute;

    width:24px;
    height:24px;

    pointer-events:none;
}

.page-frame::before{
    top:-1px;
    left:-1px;

    border-top:
        1px solid
        rgba(220,236,255,.65);

    border-left:
        1px solid
        rgba(220,236,255,.65);
}

.page-frame::after{
    right:-1px;
    bottom:-1px;

    border-right:
        1px solid
        rgba(220,236,255,.65);

    border-bottom:
        1px solid
        rgba(220,236,255,.65);
}


/* =========================================================
   Header
========================================================= */

.header{
    position:relative;

    z-index:5;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    padding-top:36px;
}

.archive-logo{
    display:flex;

    flex-direction:column;

    gap:7px;

    text-decoration:none;

    color:inherit;
}

.archive-logo-cn{
    font-family:
        "Noto Serif SC",
        serif;

    font-size:17px;

    letter-spacing:3px;
}

.archive-logo-en{
    font-family:
        "Cinzel",
        serif;

    font-size:9px;

    letter-spacing:4px;

    opacity:.58;
}

.header-right{
    display:flex;

    align-items:center;

    gap:24px;
}

.back-link{
    color:inherit;

    text-decoration:none;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:9px;

    letter-spacing:2px;

    opacity:.65;

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.back-link:hover{
    opacity:1;

    transform:
        translateX(-3px);
}


/* =========================================================
   日夜切换
========================================================= */

.theme-toggle{
    width:42px;
    height:22px;

    padding:0;

    border:
        1px solid
        rgba(190,215,238,.32);

    border-radius:20px;

    background:
        rgba(255,255,255,.03);

    cursor:pointer;

    position:relative;

    transition:
        background .4s ease,
        border-color .4s ease;
}

.theme-toggle::before{
    content:"";

    position:absolute;

    width:14px;
    height:14px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:
        rgba(220,236,255,.78);

    transition:
        transform .4s ease,
        background .4s ease;
}

body.day-mode .theme-toggle::before{
    transform:
        translateX(20px);

    background:#ffffff;
}


/* =========================================================
   页面标题
========================================================= */

.page-title{
    position:relative;

    z-index:2;

    text-align:center;

    margin:
        90px
        0
        55px;
}

.page-title-en{
    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(
            25px,
            4vw,
            42px
        );

    font-weight:300;

    letter-spacing:9px;
}

.page-title-cn{
    margin-top:14px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    letter-spacing:5px;

    opacity:.62;
}


/* =========================================================
   编辑区域
========================================================= */

.edit-container{
    position:relative;

    z-index:3;

    width:
        min(
            100%,
            820px
        );

    margin:0 auto;
}


/* =========================================================
   图片
========================================================= */

.image-section{
    position:relative;

    width:100%;

    margin-bottom:42px;
}

.image-preview{
    width:100%;

    min-height:420px;

    border:
        1px dashed
        rgba(190,215,238,.30);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:
        rgba(255,255,255,.015);

    transition:
        border-color .4s ease,
        background .4s ease;
}

.image-preview img{
    display:block;

    width:auto;

    max-width:100%;

    max-height:570px;

    object-fit:contain;
}

.image-placeholder{
    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:3px;

    opacity:.38;

    text-align:center;
}


/* =========================================================
   文件
========================================================= */

.file-input-wrap{
    position:relative;

    display:flex;

    align-items:center;

    width:100%;

    margin-top:28px;

    border:
        1px solid
        rgba(190,215,238,.20);

    background:
        rgba(255,255,255,.015);
}

.file-input-wrap input[type="file"]{
    width:100%;

    padding:17px 20px;

    color:inherit;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:1px;

    cursor:pointer;
}

.file-input-wrap input[type="file"]::file-selector-button{

    margin-right:22px;

    padding:10px 22px;

    border:
        1px solid
        rgba(190,215,238,.18);

    background:transparent;

    color:inherit;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    cursor:pointer;
}


/* =========================================================
   表单
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:25px 30px;
}

.form-item{
    display:flex;

    flex-direction:column;
}

.form-item.full{
    grid-column:
        1 / -1;
}

.form-label{
    margin-bottom:10px;

    font-family:
        "Cinzel",
        "Noto Serif SC",
        serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.58;
}

.form-input,
.form-textarea{
    width:100%;

    border:
        1px solid
        rgba(190,215,238,.22);

    outline:none;

    background:
        rgba(255,255,255,.015);

    color:inherit;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    font-weight:300;

    letter-spacing:1px;

    padding:14px 16px;

    transition:
        border-color .3s ease,
        background .3s ease;
}

.form-input{
    height:48px;
}

.form-textarea{
    min-height:130px;

    resize:vertical;

    line-height:1.9;
}

.form-input:focus,
.form-textarea:focus{
    border-color:
        rgba(190,215,238,.55);

    background:
        rgba(255,255,255,.025);
}

.form-input::placeholder,
.form-textarea::placeholder{
    color:inherit;

    opacity:.25;
}


/* =========================================================
   按钮
========================================================= */

.action-area{
    display:flex;

    gap:28px;

    margin-top:48px;
}

.action-button{
    flex:1;

    height:70px;

    border:
        1px solid
        rgba(190,215,238,.30);

    background:
        rgba(255,255,255,.015);

    color:inherit;

    font-family:
        "Noto Serif SC",
        "Cinzel",
        serif;

    font-size:13px;

    font-weight:300;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        background .35s ease,
        border-color .35s ease,
        opacity .35s ease;
}

.action-button:hover{
    background:
        rgba(255,255,255,.045);

    border-color:
        rgba(210,230,250,.55);
}

.action-button:disabled{
    opacity:.45;

    cursor:default;
}


/* =========================================================
   状态
========================================================= */

.status-message{
    min-height:32px;

    margin-top:36px;

    text-align:center;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:2px;

    line-height:1.8;

    opacity:.78;
}

.status-message.error{
    color:#e9bcbc;
}

.status-message.success{
    color:#b9dccb;
}


/* =========================================================
   底部
========================================================= */

.archive-mark{
    margin-top:85px;

    text-align:center;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:11px;

    letter-spacing:5px;

    opacity:.35;
}


/* =========================================================
   日间模式
========================================================= */

body.day-mode{
    background:#edf4fa;

    color:#34404d;
}

body.day-mode .page-frame{
    border-color:
        rgba(72,101,126,.22);
}

body.day-mode .page-frame::before,
body.day-mode .page-frame::after{
    border-color:
        rgba(72,101,126,.55);
}

body.day-mode .star{
    color:
        rgba(72,101,126,.38);
}

body.day-mode .theme-toggle{
    border-color:
        rgba(72,101,126,.30);

    background:
        rgba(255,255,255,.30);
}

body.day-mode .image-preview,
body.day-mode .file-input-wrap,
body.day-mode .form-input,
body.day-mode .form-textarea,
body.day-mode .action-button{

    background:
        rgba(255,255,255,.38);

    border-color:
        rgba(72,101,126,.20);
}

body.day-mode .image-preview{
    border-color:
        rgba(72,101,126,.25);
}

body.day-mode .form-input:focus,
body.day-mode .form-textarea:focus{

    border-color:
        rgba(72,101,126,.48);

    background:
        rgba(255,255,255,.58);
}

body.day-mode .action-button:hover{

    background:
        rgba(255,255,255,.58);

    border-color:
        rgba(72,101,126,.40);
}

body.day-mode .status-message.error{
    color:#b98282;
}

body.day-mode .status-message.success{
    color:#668f7c;
}


/* =========================================================
   手机
========================================================= */

@media(max-width:700px){

    .page-frame{

        width:
            calc(100% - 36px);

        min-height:
            calc(100vh - 36px);

        margin:18px auto;

        padding:
            0
            22px
            40px;
    }

    .header{
        padding-top:25px;
    }

    .archive-logo-cn{
        font-size:13px;

        letter-spacing:2px;
    }

    .archive-logo-en{
        font-size:7px;

        letter-spacing:3px;
    }

    .header-right{
        gap:13px;
    }

    .back-link{
        font-size:7px;

        letter-spacing:1px;
    }

    .page-title{

        margin:
            62px
            0
            38px;
    }

    .page-title-en{
        font-size:23px;

        letter-spacing:5px;
    }

    .page-title-cn{
        font-size:11px;

        letter-spacing:3px;
    }

    .image-preview{
        min-height:300px;
    }

    .image-preview img{
        max-height:430px;
    }

    .form-grid{
        grid-template-columns:1fr;

        gap:22px;
    }

    .form-item.full{
        grid-column:auto;
    }

    .action-area{
        flex-direction:column;

        gap:16px;

        margin-top:35px;
    }

    .action-button{
        height:64px;
    }

    .archive-mark{
        margin-top:60px;
    }

}


@media(max-width:430px){

    .page-frame{

        width:
            calc(100% - 24px);

        margin:12px auto;

        padding-left:16px;

        padding-right:16px;
    }

    .archive-logo-cn{
        font-size:11px;
    }

    .header-right{
        gap:8px;
    }

    .page-title-en{
        font-size:20px;
    }

    .image-preview{
        min-height:250px;
    }

    .image-preview img{
        max-height:350px;
    }

    .file-input-wrap input[type="file"]{

        padding:
            13px
            10px;

        font-size:10px;
    }

    .file-input-wrap
    input[type="file"]::file-selector-button{

        margin-right:8px;

        padding:
            8px
            10px;

        font-size:10px;
    }

    .form-input,
    .form-textarea{
        font-size:12px;
    }

}


/* =========================================================
   减少动画
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>

</head>

        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DOM
========================================================= */

const nameInput =
    document.getElementById("name");

const raceInput =
    document.getElementById("race");

const roleInput =
    document.getElementById("role");

const ageInput =
    document.getElementById("age");

const genderInput =
    document.getElementById("gender");

const regionInput =
    document.getElementById("region");

const personalityInput =
    document.getElementById("personality");

const backstoryInput =
    document.getElementById("backstory");

const imageFile =
    document.getElementById("imageFile");

const previewImage =
    document.getElementById("previewImage");

const imagePlaceholder =
    document.getElementById("imagePlaceholder");

const saveButton =
    document.getElementById("saveButton");

const cancelButton =
    document.getElementById("cancelButton");

const statusMessage =
    document.getElementById("statusMessage");

const themeToggle =
    document.getElementById("themeToggle");


/* =========================================================
   当前角色
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const characterId =
    params.get("id");


let currentCharacter = null;

let currentImageUrl = null;


/* =========================================================
   状态
========================================================= */

function showStatus(
    message,
    type = ""
){

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message";

    if(type){

        statusMessage.classList.add(
            type
        );

    }

}


/* =========================================================
   图片显示
========================================================= */

function showImage(url){

    if(!url){

        previewImage.style.display =
            "none";

        imagePlaceholder.style.display =
            "block";

        return;
    }


    previewImage.src =
        url;

    previewImage.style.display =
        "block";

    imagePlaceholder.style.display =
        "none";
}


/* =========================================================
   选择新图片
========================================================= */

imageFile.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){

            return;
        }


        const objectUrl =
            URL.createObjectURL(
                file
            );


        showImage(
            objectUrl
        );

    }
);


/* =========================================================
   读取角色
========================================================= */

async function loadCharacter(){

    if(!characterId){

        showStatus(
            "缺少角色 ID",
            "error"
        );

        saveButton.disabled =
            true;

        return;
    }


    showStatus(
        "正在读取角色档案……"
    );


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("characters")
                .select(
                    `
                    id,
                    name,
                    race,
                    role,
                    age,
                    gender,
                    region,
                    personality,
                    backstory,
                    image_url
                    `
                )
                .eq(
                    "id",
                    characterId
                )
                .single();


        if(error){

            console.error(
                "Supabase read error:",
                error
            );

            throw error;
        }


        if(!data){

            throw new Error(
                "没有找到这个角色"
            );
        }


        currentCharacter =
            data;

        currentImageUrl =
            data.image_url ||
            null;


        /* 填充资料 */

        nameInput.value =
            data.name ||
            "";

        raceInput.value =
            data.race ||
            "";

        roleInput.value =
            data.role ||
            "";

        ageInput.value =
            data.age ??
            "";

        genderInput.value =
            data.gender ||
            "";

        regionInput.value =
            data.region ||
            "";

        personalityInput.value =
            data.personality ||
            "";

        backstoryInput.value =
            data.backstory ||
            "";


        /* 显示图片 */

        showImage(
            currentImageUrl
        );


        showStatus("");


    }catch(error){

        console.error(
            "读取角色失败:",
            error
        );


        showStatus(
            "读取角色失败：" +
            (
                error?.message ||
                "未知错误"
            ),
            "error"
        );


        saveButton.disabled =
            true;
    }

}


/* =========================================================
   上传图片
========================================================= */

async function uploadImage(file){

    if(!file){

        return currentImageUrl;
    }


    const originalName =
        file.name ||
        "";


    const extension =
        originalName
            .split(".")
            .pop()
            .toLowerCase();


    /*
       使用安全随机文件名
       避免中文文件名导致上传问题
    */

    const filePath =
        "character-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,8) +
        "." +
        extension;


    const {
        error:uploadError
    } =
        await supabaseClient
            .storage
            .from("character-images")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );


    if(uploadError){

        console.error(
            "Image upload error:",
            uploadError
        );

        throw uploadError;
    }


    const {
        data
    } =
        supabaseClient
            .storage
            .from("character-images")
            .getPublicUrl(
                filePath
            );


    return data.publicUrl;
}


/* =========================================================
   保存角色
========================================================= */

async function saveCharacter(){

    if(!characterId){

        return;
    }


    saveButton.disabled =
        true;

    cancelButton.disabled =
        true;


    showStatus(
        "正在保存档案……"
    );


    try{

        let imageURL =
            currentImageUrl;


        const file =
            imageFile.files &&
            imageFile.files[0];


        /*
           如果选择了新图片，
           才上传新图片
        */

        if(file){

            showStatus(
                "正在上传新的角色图片……"
            );


            imageURL =
                await uploadImage(
                    file
                );
        }


        const updateData = {

            name:
                nameInput.value.trim(),

            race:
                raceInput.value.trim() ||
                null,

            role:
                roleInput.value.trim() ||
                null,

            age:
                ageInput.value.trim() ||
                null,

            gender:
                genderInput.value.trim() ||
                null,

            region:
                regionInput.value.trim() ||
                null,

            personality:
                personalityInput.value.trim() ||
                null,

            backstory:
                backstoryInput.value.trim() ||
                null,

            image_url:
                imageURL ||
                null

        };


        /* 更新数据库 */

        const {
            error
        } =
            await supabaseClient
                .from("characters")
                .update(
                    updateData
                )
                .eq(
                    "id",
                    characterId
                );


        if(error){

            console.error(
                "Supabase update error:",
                error
            );

            throw error;
        }


        showStatus(
            "档案保存成功，即将返回角色页面……",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "characters.html?id=" +
                    encodeURIComponent(
                        characterId
                    );

            },
            900
        );


    }catch(error){

        console.error(
            "保存角色失败:",
            error
        );


        showStatus(
            "保存失败：" +
            (
                error?.message ||
                "未知错误"
            ),
            "error"
        );


        saveButton.disabled =
            false;

        cancelButton.disabled =
            false;

    }

}


/* =========================================================
   保存按钮
========================================================= */

saveButton.addEventListener(
    "click",
    saveCharacter
);


/* =========================================================
   取消
========================================================= */

cancelButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "characters.html?id=" +
            encodeURIComponent(
                characterId
            );

    }
);


/* =========================================================
   日夜模式
========================================================= */

function applyTheme(){

    const theme =
        localStorage.getItem(
            "seyami-theme"
        );


    if(theme === "day"){

        document.body.classList.add(
            "day-mode"
        );

    }else{

        document.body.classList.remove(
            "day-mode"
        );

    }

}


themeToggle.addEventListener(
    "click",
    function(){

        const isDay =
            document.body.classList.contains(
                "day-mode"
            );


        if(isDay){

            document.body.classList.remove(
                "day-mode"
            );

            localStorage.setItem(
                "seyami-theme",
                "night"
            );

        }else{

            document.body.classList.add(
                "day-mode"
            );

            localStorage.setItem(
                "seyami-theme",
                "day"
            );

        }

    }
);


/* =========================================================
   启动
========================================================= */

applyTheme();

loadCharacter();

</script>

</body>

</html>
