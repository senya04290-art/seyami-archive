<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>塞垭弥大陆档案馆 · 编辑档案</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap"
    rel="stylesheet"

<style>

/* ==================================================
   基础
================================================== */

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(45,80,125,.12),
            transparent 42%
        ),
        #061426;

    color:#dcecff;

    font-family:
        "Noto Serif SC",
        serif;

    transition:
        background .35s ease,
        color .35s ease;
}


/* ==================================================
   日间模式
================================================== */

body.day-mode{

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,.8),
            transparent 45%
        ),
        #edf4fb;

    color:#243b56;
}


/* ==================================================
   星点
================================================== */

.star-field{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:0;
}

.star-field span{
    position:absolute;

    color:#dcecff;

    font-family:
        "Cinzel",
        serif;

    opacity:.55;

    font-size:11px;
}

body.day-mode .star-field span{
    color:#5d7895;
    opacity:.35;
}


/* ==================================================
   页面框架
================================================== */

.page-frame{

    position:relative;

    width:min(1120px,92vw);

    min-height:calc(100vh - 70px);

    margin:35px auto;

    padding:34px 42px 45px;

    border:1px solid rgba(150,190,230,.18);

    background:
        linear-gradient(
            180deg,
            rgba(8,25,46,.76),
            rgba(5,18,34,.82)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);

    z-index:1;
}

body.day-mode .page-frame{

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.88),
            rgba(244,248,252,.94)
        );

    border-color:rgba(70,105,140,.18);

    box-shadow:
        0 25px 70px rgba(50,75,100,.10);
}


/* ==================================================
   Header
================================================== */

header{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:25px;

    margin-bottom:45px;
}

.logo{

    text-decoration:none;

    color:inherit;

    display:block;
}

.logo-cn{

    font-size:18px;

    letter-spacing:3px;

    line-height:1.5;
}

.logo-en{

    margin-top:4px;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:3px;

    opacity:.58;
}

.header-right{

    display:flex;

    align-items:center;

    gap:14px;
}

.back-link{

    color:inherit;

    text-decoration:none;

    font-size:12px;

    letter-spacing:1px;

    opacity:.72;

    transition:.25s;
}

.back-link:hover{
    opacity:1;
}


/* ==================================================
   Theme button
================================================== */

.theme-toggle{

    width:34px;
    height:34px;

    border:1px solid rgba(150,190,230,.25);

    background:transparent;

    color:inherit;

    cursor:pointer;

    font-family:inherit;

    font-size:14px;

    transition:.25s;
}

.theme-toggle:hover{

    border-color:rgba(180,215,245,.55);

    transform:rotate(8deg);
}


/* ==================================================
   标题
================================================== */

.title-area{

    text-align:center;

    margin-bottom:45px;
}

.title-en{

    margin:0;

    font-family:"Cinzel",serif;

    font-size:clamp(28px,5vw,48px);

    font-weight:400;

    letter-spacing:8px;

    line-height:1.15;
}

.title-cn{

    margin-top:14px;

    font-size:15px;

    letter-spacing:5px;

    opacity:.72;
}


/* ==================================================
   分隔线
================================================== */

.title-line{

    width:90px;

    height:1px;

    margin:25px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            currentColor,
            transparent
        );

    opacity:.3;
}


/* ==================================================
   表单
================================================== */

.form{

    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:22px 25px;
}

.form-item{

    min-width:0;
}

.form-item.full{

    grid-column:1 / -1;
}

.form-label{

    display:block;

    margin-bottom:9px;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    opacity:.62;
}

.form-input,
.form-textarea{

    width:100%;

    border:1px solid rgba(150,190,230,.2);

    outline:none;

    background:
        rgba(2,13,27,.45);

    color:inherit;

    padding:13px 15px;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:13px;

    transition:
        border-color .25s ease,
        background .25s ease;
}

.form-input{

    height:46px;
}

.form-textarea{

    min-height:220px;

    resize:vertical;

    line-height:1.9;
}

.form-input::placeholder,
.form-textarea::placeholder{

    color:inherit;

    opacity:.3;
}

.form-input:focus,
.form-textarea:focus{

    border-color:
        rgba(160,205,240,.5);

    background:
        rgba(5,22,42,.7);
}

body.day-mode .form-input,
body.day-mode .form-textarea{

    background:
        rgba(255,255,255,.72);

    border-color:
        rgba(70,105,140,.2);
}


/* ==================================================
   图片区域
================================================== */

.image-section{

    grid-column:1 / -1;

    margin-bottom:5px;
}

.image-preview{

    width:180px;
    height:230px;

    margin-bottom:15px;

    border:1px solid rgba(150,190,230,.22);

    background:
        rgba(2,12,25,.45);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.image-preview img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.image-empty{

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:2px;

    opacity:.35;

    text-align:center;
}

.image-upload{

    display:inline-block;

    padding:10px 17px;

    border:1px solid rgba(150,190,230,.22);

    cursor:pointer;

    font-size:11px;

    letter-spacing:1px;

    transition:.25s;
}

.image-upload:hover{

    border-color:
        rgba(180,215,245,.55);
}

.image-upload input{

    display:none;
}


/* ==================================================
   按钮区域
================================================== */

.actions{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:18px;

    margin-top:42px;

    padding-top:28px;

    border-top:
        1px solid rgba(150,190,230,.13);
}

.action-button{

    min-width:145px;

    height:44px;

    padding:0 22px;

    border:1px solid rgba(150,190,230,.25);

    background:transparent;

    color:inherit;

    cursor:pointer;

    font-family:
        "Noto Serif SC",
        serif;

    font-size:12px;

    letter-spacing:2px;

    transition:.25s;
}

.action-button:hover{

    border-color:
        rgba(190,220,245,.65);

    background:
        rgba(100,145,190,.08);
}

.action-button.primary{

    border-color:
        rgba(180,215,245,.4);

    background:
        rgba(100,145,190,.1);
}

.action-button:disabled{

    opacity:.35;

    cursor:not-allowed;
}


/* ==================================================
   删除按钮
================================================== */

.delete-button{

    border-color:
        rgba(190,120,120,.28);
}

.delete-button:hover{

    border-color:
        rgba(210,145,145,.65);

    background:
        rgba(150,80,80,.08);
}

.delete-button:disabled{

    opacity:.35;

    cursor:not-allowed;
}


/* ==================================================
   状态提示
================================================== */

.status-message{

    min-height:22px;

    margin-top:20px;

    text-align:center;

    font-size:12px;

    letter-spacing:1px;

    opacity:.7;
}


/* ==================================================
   Footer
================================================== */

.archive-mark{

    margin-top:45px;

    text-align:center;

    font-family:"Cinzel",serif;

    font-size:9px;

    letter-spacing:3px;

    opacity:.35;
}


/* ==================================================
   小屏幕
================================================== */

@media(max-width:720px){

    .page-frame{

        width:94vw;

        margin:18px auto;

        padding:25px 20px 35px;
    }

    header{

        margin-bottom:35px;
    }

    .logo-cn{

        font-size:15px;

        letter-spacing:2px;
    }

    .header-right{

        gap:8px;

        flex-direction:column-reverse;

        align-items:flex-end;
    }

    .form{

        grid-template-columns:1fr;

    }

    .form-item.full{

        grid-column:auto;
    }

    .image-section{

        grid-column:auto;
    }

    .actions{

        flex-direction:column;

        gap:12px;
    }

    .action-button{

        width:100%;
    }

}

</style>

</head>

<script>

/* ==================================================
   Supabase
================================================== */

const SUPABASE_URL =
    "https://rqqkdpzehxzwqzytpxgh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_T_gNdlgkOaXnzjSvdmI1Pw_HQOVTEWG";


const supabaseClient =
    window.supabase
        ? window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        )
        : null;


/* ==================================================
   如果没有加载 Supabase SDK
================================================== */

if(!window.supabase){

    const script =
        document.createElement("script");

    script.src =
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    script.onload = () => {

        window.supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        initPage();

    };

    document.head.appendChild(script);

}else{

    initPage();

}


/* ==================================================
   URL 参数
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const recordId =
    params.get("id");

const editType =
    params.get("type");


const isWorldMode =
    editType === "world";

const isCountryMode =
    editType === "country";

const isHistoryMode =
    editType === "history";


const isCreatingCountry =
    isCountryMode && !recordId;

const isCreatingHistory =
    isHistoryMode && !recordId;


/* ==================================================
   当前图片
================================================== */

let currentImageUrl = null;


/* ==================================================
   DOM
================================================== */

const pageTitleEn =
    document.getElementById(
        "pageTitleEn"

imageFile.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                imagePreview.src =
                    event.target.result;

                imagePreview.style.display =
                    "block";

                imageEmpty.style.display =
                    "none";
            };

        reader.readAsDataURL(file);
    }
);

/* ==================================================
   上传人物图片
================================================== */

async function uploadImage(file){

    if(!file){

        return currentImageUrl;
    }


    const extension =
        file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "png";


    const fileName =
        `${Date.now()}-${Math.random()
            .toString(36)
            .slice(2)}.${extension}`;


    const {
        error: uploadError
    } =
        await supabase
            .storage
            .from("character-images")
            .upload(
                fileName,
                file,
                {
                    upsert:false,
                    contentType:file.type
                }
            );


    if(uploadError){

        throw uploadError;
    }


    const {
        data
    } =
        supabase
            .storage
            .from("character-images")
            .getPublicUrl(
                fileName
            );


    return data.publicUrl;
}


/* ==================================================
   保存人物
================================================== */

async function saveCharacter(){

    saveButton.disabled =
        true;

    cancelButton.disabled =
        true;

    deleteButton.disabled =
        true;


    try{

        showStatus(
            "正在保存角色档案……"
        );


        let imageUrl =
            currentImageUrl;


        if(imageFile.files.length){

            imageUrl =
                await uploadImage(
                    imageFile.files[0]
                );
        }


        const payload = {

            name:
                name.value.trim(),

            race:
                race.value.trim() || null,

            role:
                role.value.trim() || null,

            age:
                age.value.trim() || null,

            gender:
                gender.value.trim() || null,

            region:
                region.value.trim() || null,

            personality:
                personality.value.trim() || null,

            backstory:
                backstory.value.trim() || null,

            image_url:
                imageUrl || null
        };


        if(!payload.name){

            throw new Error(
                "角色名称不能为空。"
            );
        }


        const {
            error
        } =
            await supabase
                .from("characters")
                .update(payload)
                .eq(
                    "id",
                    recordId
                );


        if(error){

            throw error;
        }


        showStatus(
            "角色档案保存成功，即将返回……"
        );


        setTimeout(
            () => {

                window.location.href =
                    `characters.html?id=${encodeURIComponent(recordId)}`;

            },
            700
        );


    }catch(error){

        console.error(error);

        showStatus(
            error.message ||
            "保存角色档案失败。",
            true
        );

        saveButton.disabled =
            false;

        cancelButton.disabled =
            false;

        deleteButton.disabled =
            false;
    }
}

            description:
                historyDescription.value.trim() ||
                null,

            content:
                historyContent.value.trim() ||
                null,

            updated_at:
                new Date().toISOString()
        };


        if(!payload.title){

            throw new Error(
                "事件名称不能为空。"
            );
        }


        /* ================================
           新建
        ================================= */

        if(isCreatingHistory){

            const {
                data,
                error
            } =
                await supabase
                    .from("history_records")
                    .insert(payload)
                    .select("id")
                    .single();


            if(error){

                throw error;
            }


            showStatus(
                "历史记录建立成功，即将返回历史档案页面……"
            );


        }

        /* ================================
           编辑
        ================================= */

        else{

            const {
                error
            } =
                await supabase
                    .from("history_records")
                    .update(payload)
                    .eq(
                        "id",
                        recordId
                    );


            if(error){

                throw error;
            }


            showStatus(
                "历史记录保存成功，即将返回历史档案页面……"
            );
        }


        setTimeout(
            () => {

                window.location.href =
                    "history.html";

            },
            700
        );


    }catch(error){

        console.error(error);

        showStatus(
            error.message ||
            "保存历史记录失败。",
            true
        );

        saveButton.disabled =
            false;

        cancelButton.disabled =
            false;

        deleteButton.disabled =
            false;
    }
}


/* ==================================================
   删除档案
================================================== */

async function deleteRecord(){

    if(!recordId){

        showStatus(
            "没有可以删除的档案。",
            true
        );

        return;
    }


    let recordType = "";


    if(isHistoryMode){

        recordType =
            "历史记录";

    }else if(isCountryMode){

        recordType =
            "国家档案";

    }else if(!isWorldMode){

        recordType =
            "角色档案";

    }else{

        showStatus(
            "世界设定不支持删除。",
            true
        );

        return;
    }


    const confirmed =
        window.confirm(
            `确定要删除这份${recordType}吗？\n\n删除后无法恢复。`
        );


    if(!confirmed){

        return;
    }


    deleteButton.disabled =
        true;

    saveButton.disabled =
        true;

    cancelButton.disabled =
        true;


    try{

        showStatus(
            `正在删除${recordType}……`
        );


        let tableName = "";


        if(isHistoryMode){

            tableName =
                "history_records";

        }else if(isCountryMode){

            tableName =
                "countries";

        }else{

            tableName =
                "characters";
        }


        const {
            error
        } =
            await supabase
                .from(tableName)
                .delete()
                .eq(
                    "id",
                    recordId
                );


        if(error){

            throw error;
        }


        showStatus(
            `${recordType}删除成功，即将返回……`
        );


        setTimeout(
            () => {

                if(isHistoryMode){

                    window.location.href =
                        "history.html";

                }else if(isCountryMode){

                    window.location.href =
                        "nations.html";

                }else{

                    window.location.href =
                        "characters.html";
                }

            },
            700
        );


    }catch(error){

        console.error(error);

        showStatus(
            error.message ||
            `删除${recordType}失败。`,
            true
        );


        deleteButton.disabled =
            false;

        saveButton.disabled =
            false;

        cancelButton.disabled =
            false;
    }
}


/* ==================================================
   保存按钮
================================================== */

saveButton.addEventListener(
    "click",
    function(){

        if(isHistoryMode){

            saveHistory();

        }else if(isWorldMode){

            saveWorld();

        }else if(isCountryMode){

            saveCountry();

        }else{

            saveCharacter();

        }

    }
);


/* ==================================================
   删除按钮
================================================== */

deleteButton.addEventListener(
    "click",
    function(){

        deleteRecord();

    }
);


/* ==================================================
   取消按钮
================================================== */

cancelButton.addEventListener(
    "click",
    function(){

        if(isHistoryMode){

            window.location.href =
                "history.html";

        }else if(isWorldMode){

            window.location.href =
                "world.html";

        }else if(isCountryMode){

            window.location.href =
                "nations.html";

        }else{

            if(recordId){

                window.location.href =
                    `characters.html?id=${encodeURIComponent(recordId)}`;

            }else{

                window.location.href =
                    "characters.html";
            }
        }

    }
);


/* ==================================================
   主题
================================================== */

function applyTheme(){

    const savedTheme =
        localStorage.getItem(
            "seyami-theme"
        );


    if(savedTheme === "day"){

        document.body.classList.add(
            "day-mode"
        );

        document.getElementById(
            "themeToggle"
        ).textContent = "☾";

    }else{

        document.body.classList.remove(
            "day-mode"
        );

        document.getElementById(
            "themeToggle"
        ).textContent = "☼";
    }
}


document.getElementById(
    "themeToggle"
).addEventListener(
    "click",
    function(){

        document.body.classList.toggle(
            "day-mode"
        );


        const isDay =
            document.body.classList.contains(
                "day-mode"
            );


        localStorage.setItem(
            "seyami-theme",
            isDay
                ? "day"
                : "night"
        );


        this.textContent =
            isDay
                ? "☾"
                : "☼";

    }
);


/* ==================================================
   初始化
================================================== */

function initPage(){

    applyTheme();


    if(isHistoryMode){

        setupHistoryMode();

        loadHistory();

    }else if(isWorldMode){

        setupWorldMode();

        loadWorld();

    }else if(isCountryMode){

        setupCountryMode();

        loadCountry();

    }else{

        setupCharacterMode();

        loadCharacter();
    }
}

</script>
